<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="Arial,sans-serif"><title>Integer accumulation and requantization</title><desc>Subtract input zero point, multiply centered integers, accumulate, then round the scaled sum and add the output zero point.</desc><rect width="640" height="360" rx="12" fill="#f8fafc"/><text x="22" y="39" font-size="17" fill="#20384c" text-anchor="start">Input q (z = 3)</text><rect x="200" y="14" width="114" height="37" rx="6" fill="#315c85"/><text x="257" y="39" font-size="20" fill="white" text-anchor="middle">7</text><rect x="337" y="14" width="114" height="37" rx="6" fill="#315c85"/><text x="394" y="39" font-size="20" fill="white" text-anchor="middle">2</text><rect x="474" y="14" width="114" height="37" rx="6" fill="#315c85"/><text x="531" y="39" font-size="20" fill="white" text-anchor="middle">5</text><text x="22" y="90" font-size="17" fill="#20384c" text-anchor="start">Centered q − z</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.049999999999999996;0.07916666666666666;0.98;1"/><rect x="200" y="65" width="114" height="37" rx="6" fill="#315c85"/><text x="257" y="90" font-size="20" fill="white" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.07916666666666666;0.10833333333333332;0.98;1"/><rect x="337" y="65" width="114" height="37" rx="6" fill="#315c85"/><text x="394" y="90" font-size="20" fill="white" text-anchor="middle">−1</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.10833333333333334;0.13749999999999998;0.98;1"/><rect x="474" y="65" width="114" height="37" rx="6" fill="#315c85"/><text x="531" y="90" font-size="20" fill="white" text-anchor="middle">2</text></g><text x="22" y="141" font-size="17" fill="#20384c" text-anchor="start">Weight q (z = 0)</text><rect x="200" y="116" width="114" height="37" rx="6" fill="#315c85"/><text x="257" y="141" font-size="20" fill="white" text-anchor="middle">4</text><rect x="337" y="116" width="114" height="37" rx="6" fill="#315c85"/><text x="394" y="141" font-size="20" fill="white" text-anchor="middle">−2</text><rect x="474" y="116" width="114" height="37" rx="6" fill="#315c85"/><text x="531" y="141" font-size="20" fill="white" text-anchor="middle">1</text><text x="22" y="192" font-size="17" fill="#20384c" text-anchor="start">Products</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.19166666666666665;0.22083333333333333;0.98;1"/><rect x="200" y="167" width="114" height="37" rx="6" fill="#08766f"/><text x="257" y="192" font-size="20" fill="white" text-anchor="middle">16</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.25;0.2791666666666667;0.98;1"/><rect x="337" y="167" width="114" height="37" rx="6" fill="#08766f"/><text x="394" y="192" font-size="20" fill="white" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.30833333333333335;0.33749999999999997;0.98;1"/><rect x="474" y="167" width="114" height="37" rx="6" fill="#08766f"/><text x="531" y="192" font-size="20" fill="white" text-anchor="middle">2</text></g><text x="22" y="243" font-size="17" fill="#20384c" text-anchor="start">Running sum</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.375;0.4041666666666666;0.98;1"/><rect x="200" y="218" width="114" height="37" rx="6" fill="#08766f"/><text x="257" y="243" font-size="20" fill="white" text-anchor="middle">16</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.43333333333333335;0.46249999999999997;0.98;1"/><rect x="337" y="218" width="114" height="37" rx="6" fill="#08766f"/><text x="394" y="243" font-size="20" fill="white" text-anchor="middle">18</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4916666666666667;0.5208333333333334;0.98;1"/><rect x="474" y="218" width="114" height="37" rx="6" fill="#08766f"/><text x="531" y="243" font-size="20" fill="white" text-anchor="middle">20</text></g><circle cx="257" cy="211" r="2.5" fill="#9a5a20" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.35000000000000003;0.36250000000000004;0.5083333333333333;0.5208333333333334;1"/><animate attributeName="cx" dur="12s" repeatCount="indefinite" values="257;257;531;531" keyTimes="0;0.35000000000000003;0.5083333333333333;1"/></circle><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5416666666666666;0.5708333333333333;0.98;1"/><path d="M531 257V268H105V277" stroke="#a4b6c6" stroke-width="2" fill="none"/><path d="M100 270L105 277L110 270" stroke="#a4b6c6" stroke-width="2" fill="none"/></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6;0.6291666666666667;0.98;1"/><rect x="22" y="281" width="596" height="63" rx="6" fill="#e6edf3"/><text x="105" y="304" font-size="17" fill="#20384c" text-anchor="middle">Scale × 5/16</text><text x="105" y="329" font-size="20" fill="#20384c" text-anchor="middle">20 → 6.25</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6749999999999999;0.7041666666666666;0.98;1"/><text x="298" y="304" font-size="17" fill="#20384c" text-anchor="middle">Round</text><text x="298" y="329" font-size="22" fill="#20384c" text-anchor="middle">6</text><path d="M201 292L201 335" stroke="#a4b6c6" stroke-width="2" fill="none"/></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.75;0.7791666666666667;0.98;1"/><path d="M397 292L397 335" stroke="#a4b6c6" stroke-width="2" fill="none"/><text x="512" y="304" font-size="17" fill="#20384c" text-anchor="middle">Add z = 10</text><text x="512" y="329" font-size="22" fill="#08766f" text-anchor="middle">q = 16</text></g></svg>
