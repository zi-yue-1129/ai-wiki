<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="Arial,sans-serif"><title>Integer accumulation and requantization</title><desc>Trace zero-point correction and products, accumulate, then compare mathematical scaling with the integer multiply, offset, shift and output code.</desc><rect width="640" height="360" rx="12" fill="#f8fafc"/><text x="20" y="32" font-size="17" fill="#20384c" text-anchor="start">Input q (z = 3)</text><rect x="207" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="32" font-size="19" fill="white" text-anchor="middle">7</text><rect x="339" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="32" font-size="19" fill="white" text-anchor="middle">2</text><rect x="471" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="32" font-size="19" fill="white" text-anchor="middle">5</text><text x="20" y="75" font-size="17" fill="#20384c" text-anchor="start">Centered q − z</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.041666666666666664;0.06;0.9666666666666667;1"/><rect x="207" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="75" font-size="19" fill="white" text-anchor="middle">4</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.075;0.09333333333333334;0.9666666666666667;1"/><rect x="339" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="75" font-size="19" fill="white" text-anchor="middle">−1</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.10833333333333334;0.12666666666666668;0.9666666666666667;1"/><rect x="471" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="75" font-size="19" fill="white" text-anchor="middle">2</text></g><text x="20" y="118" font-size="17" fill="#20384c" text-anchor="start">Weight q (z = 0)</text><rect x="207" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="118" font-size="19" fill="white" text-anchor="middle">4</text><rect x="339" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="118" font-size="19" fill="white" text-anchor="middle">−2</text><rect x="471" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="118" font-size="19" fill="white" text-anchor="middle">1</text><text x="20" y="161" font-size="17" fill="#20384c" text-anchor="start">Products</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.16666666666666666;0.18500000000000003;0.9666666666666667;1"/><rect x="207" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="262" y="161" font-size="19" fill="white" text-anchor="middle">16</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.21666666666666667;0.23500000000000001;0.9666666666666667;1"/><rect x="339" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="394" y="161" font-size="19" fill="white" text-anchor="middle">2</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.26666666666666666;0.28500000000000003;0.9666666666666667;1"/><rect x="471" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="526" y="161" font-size="19" fill="white" text-anchor="middle">2</text></g><text x="20" y="204" font-size="17" fill="#20384c" text-anchor="start">Running sum</text><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.325;0.3433333333333333;0.9666666666666667;1"/><rect x="207" y="182" width="110" height="32" rx="5" fill="#08766f"/><text x="262" y="204" font-size="19" fill="white" text-anchor="middle">16</text></g><g opacity="0">