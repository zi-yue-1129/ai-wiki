<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">PAGED KV ALLOCATION</title><desc id="desc">Three logical KV blocks appear in sequence and map through a block table to scattered physical blocks P2, P0, and P3. Coloured particles follow each mapping; physical block P1 stays free. Every block holds two symbolic tokens.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#253c52}.hd{font-size:19px;font-weight:700}.lab{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#62788a}.small{font-size:11px;fill:#62788a}.cell{font-size:17px;font-weight:700}@media(prefers-reduced-motion:reduce){.particle{display:none!important}}</style><rect width="640" height="360" rx="16" fill="#f5f9fc"/><text class="hd" x="26" y="37">PAGED KV ALLOCATION</text><text class="lab" x="26" y="120" >LOGICAL</text><text class="lab" x="26" y="245" >PHYSICAL</text><text class="small" x="26" y="180" >BLOCK TABLE</text><path d="M127 154H605" stroke="#cddde8" stroke-dasharray="3 6"/><path d="M127 227H605" stroke="#cddde8" stroke-dasharray="3 6"/><g ><path d="M174 143 C174 194 404 177 404 230" fill="none" stroke="#128e8b" stroke-width="3" stroke-linecap="round" opacity=".72"/></g><g ><path d="M288 143 C288 194 174 177 174 230" fill="none" stroke="#397cbb" stroke-width="3" stroke-linecap="round" opacity=".72"/></g><g ><path d="M402 143 C402 194 516 177 516 230" fill="none" stroke="#d68a30" stroke-width="3" stroke-linecap="round" opacity=".72"/></g><g ><rect x="136" y="90" width="76" height="53" rx="10" fill="#fff" stroke="#128e8b" stroke-width="1.7"/><text class="small" x="174" y="106" text-anchor="middle">L0</text><text class="cell" x="174" y="131" text-anchor="middle">0 1</text></g><g ><rect x="250" y="90" width="76" height="53" rx="10" fill="#fff" stroke="#397cbb" stroke-width="1.7"/><text class="small" x="288" y="106" text-anchor="middle">L1</text><text class="cell" x="288" y="131" text-anchor="middle">2 3</text></g><g ><rect x="364" y="90" width="76" height="53" rx="10" fill="#fff" stroke="#d68a30" stroke-width="1.7"/><text class="small" x="402" y="106" text-anchor="middle">L2</text><text class="cell" x="402" y="131" text-anchor="middle">4 5</text></g><g ><rect x="136" y="230" width="76" height="66" rx="10" fill="#fff" stroke="#397cbb" stroke-width="1.7"/><text class="small" x="174" y="250" text-anchor="middle">P0</text><text class="cell" x="174" y="281" text-anchor="middle">2 3</text></g><g ><rect x="250" y="230" width="76" height="66" rx="10" fill="#edf2f6" stroke="#cddde8" stroke-width="1.7"/><text class="small" x="288" y="250" text-anchor="middle">P1</text><text class="small" x="288" y="281" text-anchor="middle">free</text></g><g ><rect x="364" y="230" width="76" height="66" rx="10" fill="#fff" stroke="#128e8b" stroke-width="1.7"/><text class="small" x="402" y="250" text-anchor="middle">P2</text><text class="cell" x="402" y="281" text-anchor="middle">0 1</text></g><g ><rect x="478" y="230" width="76" height="66" rx="10" fill="#fff" stroke="#d68a30" stroke-width="1.7"/><text class="small" x="516" y="250" text-anchor="middle">P3</text><text class="cell" x="516" y="281" text-anchor="middle">4 5</text></g><text class="small" x="26" y="333" >Schematic · two token slots per block</text></svg>