<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Logit adjustment: animated decision flip</title><desc id="desc">Artificial example: class priors 0.9 and 0.1 and raw logits 2.0 and 0.5; as tau grows, the rare class becomes top-ranked.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eff6fa"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="url(#bg)" /><text x="26" y="34" font-size="20" font-weight="750" fill="#213e51" >LOGIT ADJUSTMENT</text><text x="26" y="54" font-size="12" font-weight="500" fill="#6b8294" >Prior-aware scores   ·   τ = 0 → 1</text><rect x="23" y="74" width="239" height="251" rx="16" fill="#fff" stroke="#d9e6ed"/><rect x="274" y="74" width="343" height="251" rx="16" fill="#fff" stroke="#d9e6ed"/><text x="42" y="104" font-size="12" font-weight="700" fill="#6b8294" >POST-HOC SCORES</text><text x="43" y="146" font-size="14" font-weight="700" fill="#3470bd" >Head</text><text x="225" y="146" font-size="11" font-weight="500" fill="#6b8294" text-anchor="end">π = .9</text><text x="43" y="214" font-size="14" font-weight="700" fill="#de9238" >Tail</text><text x="225" y="214" font-size="11" font-weight="500" fill="#6b8294" text-anchor="end">π = .1</text><rect x="43" y="159" width="178" height="18" rx="9" fill="#edf2f6" /><rect x="43" y="227" width="178" height="18" rx="9" fill="#edf2f6" /><rect x="43" y="159" width="107.88" height="18" rx="9" fill="#3470bd"><animate attributeName="width" values="107.88;113.56;107.88" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /></rect><rect x="43" y="227" width="26.97" height="18" rx="9" fill="#de9238"><animate attributeName="width" values="26.97;151.17;26.97" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /></rect><text x="43" y="281" font-size="11" font-weight="700" fill="#6b8294" >TOP SCORE</text><text x="151" y="281" font-size="13" font-family="Arial" font-weight="750" fill="#3470bd">HEAD<animate attributeName="opacity" values="1;0;1" keyTimes="0;.615;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/></text><text x="151" y="281" font-size="13" font-family="Arial" font-weight="750" fill="#de9238" opacity="0">TAIL<animate attributeName="opacity" values="0;1;0" keyTimes="0;.615;1" dur="10s" repeatCount="indefinite" calcMode="discrete"/></text><text x="43" y="309" font-size="12" font-weight="600" fill="#6b8294" >z − τ log π</text><path d="M312 123V278" stroke="#ebf1f5"/><text x="312" y="298" font-size="10" font-weight="400" fill="#6b8294" text-anchor="middle">0</text><path d="M379.75 123V278" stroke="#ebf1f5"/><text x="379.75" y="298" font-size="10" font-weight="400" fill="#6b8294" text-anchor="middle">0.25</text><path d="M447.5 123V278" stroke="#ebf1f5"/><text x="447.5" y="298" font-size="10" font-weight="400" fill="#6b8294" text-anchor="middle">0.5</text><path d="M515.25 123V278" stroke="#ebf1f5"/><text x="515.25" y="298" font-size="10" font-weight="400" fill="#6b8294" text-anchor="middle">0.75</text><path d="M583 123V278" stroke="#ebf1f5"/><text x="583" y="298" font-size="10" font-weight="400" fill="#6b8294" text-anchor="middle">1</text><path d="M312 278H583" stroke="#ebf1f5"/><path d="M312 231.03030303030303H583" stroke="#ebf1f5"/><path d="M312 184.06060606060606H583" stroke="#ebf1f5"/><path d="M312 137.09090909090907H583" stroke="#ebf1f5"/><path d="M312 123V278H583" stroke="#9bb1bf" stroke-width="1.8" fill="none"/><text x="299" y="119" font-size="11" font-weight="700" fill="#6b8294" >Score</text><text x="592" y="317" font-size="11" font-weight="700" fill="#6b8294" >τ</text><path d="M312,184.06060606060606 L583,179.11185456758693" stroke="#3470bd" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M312,254.5151515151515 L583,146.3634274502797" stroke="#de9238" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M497.0061228119047 123V278" stroke="#b9a0be" stroke-width="1.8" stroke-dasharray="5 5"/><text x="504.0061228119047" y="140" font-size="11" font-weight="700" fill="#85638f" >flip</text><line x1="312" x2="312" y1="123" y2="278" stroke="#6b8294" stroke-width="1.3" stroke-dasharray="3 5"><animate attributeName="x1" values="312;583;312" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /><animate attributeName="x2" values="312;583;312" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /></line><circle cx="312" cy="184.06060606060606" r="7" fill="#3470bd" stroke="white" stroke-width="2.5"><animate attributeName="cx" values="312;583;312" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /><animate attributeName="cy" values="184.06060606060606;179.11185456758693;184.06060606060606" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /></circle><circle cx="312" cy="254.5151515151515" r="7" fill="#de9238" stroke="white" stroke-width="2.5"><animate attributeName="cx" values="312;583;312" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /><animate attributeName="cy" values="254.5151515151515;146.3634274502797;254.5151515151515" keyTimes="0;.9;1" dur="10s" repeatCount="indefinite" /></circle><text x="26" y="347" font-size="11" font-weight="500" fill="#6b8294" >Tail prior correction can reverse the predicted class</text></svg>