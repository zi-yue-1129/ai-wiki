<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Average precision compared with trapezoidal PR area</title><desc id="desc">Synthetic ranking positive negative positive negative. Step average precision has two rectangles 0.5 times 1 plus 0.5 times two thirds, yielding 0.8333. The trapezoidal area for the same precision-recall points and distinct scores is 0.7917, because the segment between recall 0.5 and 1 connects precision 0.5 and two-thirds linearly.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5f8"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#183d52}.heading{font-size:18px;font-weight:750}.label{font-size:13px;font-weight:700}.small{font-size:11px;font-weight:600}.muted{fill:#6c8391}.axis{stroke:#819dac;stroke-width:1.7}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" fill="url(#bg)" rx="16"/><text x="24" y="36" class="heading" >AP vs TRAPEZOIDAL AREA</text><text x="24" y="56" class="small" >Same ranking, different integration rule</text><rect x="24" y="75" width="288" height="248" fill="white" rx="14" stroke="#dce8ee"/><rect x="328" y="75" width="288" height="248" fill="white" rx="14" stroke="#dce8ee"/><text x="65" y="105" class="label" >AP · STEP</text><text x="266" y="105" class="heading" text-anchor="end">0.833</text><line x1="65" y1="134" x2="65" y2="270" stroke="#7894a1" stroke-width="1.7"/><line x1="65" y1="270" x2="269" y2="270" stroke="#7894a1" stroke-width="1.7"/><line x1="65" y1="134" x2="269" y2="134" stroke="#e2ecf1" /><line x1="167" y1="134" x2="167" y2="270" stroke="#e2ecf1" /><text x="57" y="138" class="small" text-anchor="end">1</text><text x="57" y="274" class="small" text-anchor="end">0</text><text x="65" y="287" class="small" text-anchor="middle">0</text><text x="167" y="287" class="small" text-anchor="middle">.5</text><text x="269" y="287" class="small" text-anchor="middle">1</text><text x="281" y="274" class="small" >R</text><text x="65" y="125" class="small" >P</text><g class="moving"><rect x="65" y="134" width="102" height="136" fill="#55b5a5" opacity="0.72"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.32;1" dur="12s" repeatCount="indefinite"/></g><g class="moving"><rect x="167" y="179.33333333333334" width="102" height="90.66666666666666" fill="#89cfc2" opacity="0.88"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.52;1" dur="12s" repeatCount="indefinite"/></g><g class="still"><rect x="65" y="134" width="102" height="136" fill="#55b5a5" opacity="0.72"/><rect x="167" y="179.33333333333334" width="102" height="90.66666666666666" fill="#89cfc2" opacity="0.88"/></g><path d="M65 134H167V179.33333333333334H269" fill="none" stroke="#287b82" stroke-width="3" stroke-linejoin="round"/><text x="367" y="105" class="label" >TRAPEZOID</text><text x="568" y="105" class="heading" text-anchor="end">0.792</text><line x1="367" y1="134" x2="367" y2="270" stroke="#7894a1" stroke-width="1.7"/><line x1="367" y1="270" x2="571" y2="270" stroke="#7894a1" stroke-width="1.7"/><line x1="367" y1="134" x2="571" y2="134" stroke="#e2ecf1" /><line x1="469" y1="134" x2="469" y2="270" stroke="#e2ecf1" /><text x="359" y="138" class="small" text-anchor="end">1</text><text x="359" y="274" class="small" text-anchor="end">0</text><text x="367" y="287" class="small" text-anchor="middle">0</text><text x="469" y="287" class="small" text-anchor="middle">.5</text><text x="571" y="287" class="small" text-anchor="middle">1</text><text x="583" y="274" class="small" >R</text><text x="367" y="125" class="small" >P</text><g class="moving"><path d="M367 270V134H469V202L571 179.33333333333334V270Z" fill="#f2b881" opacity="0.72"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.79;1" dur="12s" repeatCount="indefinite"/></g><g class="still"><path d="M367 270V134H469V202L571 179.33333333333334V270Z" fill="#f2b881" opacity="0.72"/></g><path d="M367 134H469V202L571 179.33333333333334" fill="none" stroke="#b86d3b" stroke-width="3" stroke-linejoin="round"/><text x="38" y="309" class="small" >0.5 × 1 + 0.5 × ⅔</text><text x="341" y="309" class="small" >Linear segments</text><text x="24" y="348" class="small" >SYNTHETIC ORDER: + − + − · DISTINCT SCORES</text></svg>