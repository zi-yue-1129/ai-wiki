  <rect id="learned-squared-loss" x="153" y="353" width="178" height="12" rx="6" fill="#d88242"><animate attributeName="width" values="178;178;166.5093;155.402;144.6782;134.3377;124.3806;114.8069;105.6166;96.8096;88.3861;80.346;72.6893;65.4159;58.526;52.0194;45.8963;40.1565;34.8001;29.8272;25.2376;21.0314;17.2086;13.7692;10.7132;8.0406;5.7514;3.8455;2.3231;1.1841;0.4284;0.4284" keyTimes="0;0.18;0.1979;0.2159;0.2338;0.2517;0.2697;0.2876;0.3055;0.3234;0.3414;0.3593;0.3772;0.3952;0.4131;0.431;0.449;0.4669;0.4848;0.5028;0.5207;0.5386;0.5566;0.5745;0.5924;0.6103;0.6283;0.6462;0.6641;0.6821;0.7;1" dur="8s" repeatCount="indefinite"/></rect>
  <circle cx="139" cy="174" r="6" fill="#2775bb"><animate attributeName="cx" values="139;177;177;177" keyTimes="0;.12;.18;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.05;.18;1" dur="8s" repeatCount="indefinite"/></circle>
</g>
<g class="animated" aria-hidden="true">
  <line x1="213" y1="569" x2="294" y2="544" class="error-link"><animate attributeName="x2" values="294;213;132;132" keyTimes="0;.31;.61;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><animate attributeName="y2" values="544;610;553;553" keyTimes="0;.31;.61;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></line>
  <circle cx="294" cy="544" r="10" class="actual-dot"><animate attributeName="cx" values="294;213;132;132" keyTimes="0;.31;.61;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values="544;610;553;553" keyTimes="0;.31;.61;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></circle>
  <rect id="sampled-loss" x="153" y="681" width="177" height="12" rx="6" fill="#d88242"><animate attributeName="width" values="177;41.4051;167.9111;167.9111" keyTimes="0;.31;.61;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
  <circle cx="139" cy="502" r="6" fill="#2775bb"><animate attributeName="cx" values="139;139;176;139;176;139" keyTimes="0;.285;.31;.585;.61;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0;0" keyTimes="0;.285;.31;.585;.61;1" dur="8s" repeatCount="indefinite"/></circle>
</g>
<g class="resting">
  <line x1="275" y1="248" x2="268" y2="251" class="error-link"/><circle cx="268" cy="251" r="10" class="pred-dot"/>
  <rect x="153" y="353" width="0.4284" height="12" rx="2" fill="#d88242"/>
  <line x1="213" y1="569" x2="132" y2="553" class="error-link"/><circle cx="132" cy="553" r="10" class="actual-dot"/>
  <rect x="153" y="681" width="167.9111" height="12" rx="6" fill="#d88242"/>
</g>
</svg>
