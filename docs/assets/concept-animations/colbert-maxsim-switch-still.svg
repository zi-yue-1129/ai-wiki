<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">ColBERT: MaxSim token alignment</title><desc id="description">The six illustrative query-document token similarity scores change continuously; each query row selects its highest score and the row maxima are summed.</desc><rect width="640" height="360" fill="#f7fbfd"/><g font-family="Arial, Helvetica, sans-serif"><text x="27" y="35" text-anchor="start" fill="#16364f" font-size="19" font-weight="700">ColBERT</text><text x="132" y="35" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">token-level MaxSim</text><rect x="24" y="58" width="348" height="253" rx="14" fill="#ffffff" stroke="#d5e4ed"/><rect x="385" y="58" width="231" height="253" rx="14" fill="#ffffff" stroke="#d5e4ed"/><text x="45" y="82" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">Query × passage tokens</text><text x="126" y="114" text-anchor="middle" fill="#526c7f" font-size="12" font-weight="500">p1</text><text x="205" y="114" text-anchor="middle" fill="#526c7f" font-size="12" font-weight="500">p2</text><text x="284" y="114" text-anchor="middle" fill="#526c7f" font-size="12" font-weight="500">p3</text><text x="49" y="165" text-anchor="start" fill="#087e99" font-size="13" font-weight="700">q1</text><rect x="88" y="135" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="97" y="167.35" width="52" height="16.65" rx="3" fill="#087e99" fill-opacity="0.84"></rect><rect x="167" y="135" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="176" y="160.01" width="52" height="23.99" rx="3" fill="#087e99" fill-opacity="0.84"></rect><rect x="246" y="135" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="255" y="175.01" width="52" height="8.99" rx="3" fill="#087e99" fill-opacity="0.84"></rect><rect x="167" y="135" width="70" height="59" rx="7" fill="none" stroke="#f1a546" stroke-width="3.5"></rect><text x="49" y="247" text-anchor="start" fill="#7565b9" font-size="13" font-weight="700">q2</text><rect x="88" y="217" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="97" y="259.29" width="52" height="6.71" rx="3" fill="#7565b9" fill-opacity="0.84"></rect><rect x="167" y="217" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="176" y="242.44" width="52" height="23.56" rx="3" fill="#7565b9" fill-opacity="0.84"></rect><rect x="246" y="217" width="70" height="59" rx="7" fill="#ecf3f7" /><rect x="255" y="247.93" width="52" height="18.07" rx="3" fill="#7565b9" fill-opacity="0.84"></rect><rect x="167" y="217" width="70" height="59" rx="7" fill="none" stroke="#f1a546" stroke-width="3.5"></rect><text x="52" y="293" text-anchor="start" fill="#526c7f" font-size="11" font-weight="500">Gold border = row maximum</text><text x="402" y="82" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">MaxSim + sum</text><text x="402" y="134" text-anchor="start" fill="#087e99" font-size="12" font-weight="500">max(q1)</text><rect x="466" y="117" width="128" height="22" rx="5" fill="#ebf2f5" /><rect x="466" y="117" rx="5" height="22" width="85.30" fill="#087e99"></rect><text x="402" y="206" text-anchor="start" fill="#7565b9" font-size="12" font-weight="500">max(q2)</text><rect x="466" y="189" width="128" height="22" rx="5" fill="#ebf2f5" /><rect x="466" y="189" rx="5" height="22" width="83.76" fill="#7565b9"></rect><line x1="407" y1="241" x2="590" y2="241" stroke="#d5e4ed" stroke-width="1.5" /><text x="404" y="265" text-anchor="start" fill="#16364f" font-size="17" font-weight="700">Σ</text><rect x="433" y="247" width="160" height="23" rx="5" fill="#ebf2f5" /><rect x="433" y="247" rx="5" height="23" width="105.66" fill="#de8546"></rect><text x="320" y="344" text-anchor="middle" fill="#526c7f" font-size="11" font-weight="500">Illustrative similarities · Not model outputs</text></g></svg>