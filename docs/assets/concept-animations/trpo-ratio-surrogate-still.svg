<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">TRPO sample importance ratios and surrogate contributions</title><desc id="desc">Three illustrative samples multiply advantages 1, minus 0.5 and 0.4 by ratios 1.2, 0.8 and 1.1. Their mean surrogate changes from 0.300 to about 0.413. This change alone does not establish that the average KL constraint is satisfied.</desc><style>@media (prefers-reduced-motion:reduce){.motion{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1"/><text x="28" y="38" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">TRPO · importance-weighted surrogate</text><text x="28" y="57" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Sample ratios r = πnew(a|s) / πold(a|s)</text><rect x="25" y="78" width="590" height="233" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="42" y="101" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650" text-anchor="start">Sample</text><text x="177" y="101" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650" text-anchor="start">Advantage</text><text x="305" y="101" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650" text-anchor="start">Ratio</text><text x="436" y="101" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="650" text-anchor="start">Contribution</text><rect x="41" y="108" width="557" height="51" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1"/><rect x="54" y="119" width="76" height="28" rx="7" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="92" y="137" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">i = 1</text><text x="204" y="137" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">+1.0</text><text x="340" y="137" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1.2</text><path d="M450 133 H557" fill="none" stroke="#dbe5ed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="451" y="120" width="108" height="12" rx="5" fill="#0f9187" stroke="none" stroke-width="0"/><text x="575" y="137" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end">+1.20</text><rect x="41" y="171" width="557" height="51" rx="8" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1"/><rect x="54" y="182" width="76" height="28" rx="7" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="92" y="200" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">i = 2</text><text x="204" y="200" fill="#da7b2c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">−0.5</text><text x="340" y="200" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">0.8</text><path d="M450 196 H557" fill="none" stroke="#dbe5ed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="510" y="183" width="36" height="12" rx="5" fill="#da7b2c" stroke="none" stroke-width="0"/><text x="575" y="200" fill="#da7b2c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end">−0.40</text><rect x="41" y="234" width="557" height="51" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1"/><rect x="54" y="245" width="76" height="28" rx="7" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="92" y="263" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">i = 3</text><text x="204" y="263" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">+0.4</text><text x="340" y="263" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">1.1</text><path d="M450 259 H557" fill="none" stroke="#dbe5ed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="451" y="246" width="40" height="12" rx="5" fill="#0f9187" stroke="none" stroke-width="0"/><text x="575" y="263" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end">+0.44</text><rect x="29" y="324" width="582" height="26" rx="8" fill="#edf2f7" stroke="none" stroke-width="0"/><text x="42" y="342" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" text-anchor="start">Mean surrogate: old 0.300 → new 0.413 (illustrative)</text></svg>