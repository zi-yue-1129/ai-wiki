<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Weight and KV read crossover during decoding</title><desc id="desc">Illustrative logical memory reads per decode step at fixed batch size. Weight reads are 8 units, MHA cache reads grow at 4 units per context unit, and MQA cache reads at 1. The respective crossovers are context 2 and 8; the moving cursor sweeps context lengths, not measured time.</desc><style>text{font:16px system-ui,sans-serif;fill:#243e53}.heading{font-size:21px;font-weight:700}.sub{font-size:15px;fill:#526b80}.bold{font-weight:700}.white{fill:white}.center{text-anchor:middle}.end{text-anchor:end}.fallback{display:none}@media(prefers-reduced-motion:reduce){.fallback{display:inline}.motion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="6" fill="#f7fafc" /><text x="24" y="34" class="heading">Weight reads vs. KV reads</text><text x="70" y="54" class="sub">Logical bytes (units)</text><path d="M70 288H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="293" class="sub end">0</text><path d="M70 244H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="249" class="sub end">8</text><path d="M70 200H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="205" class="sub end">16</text><path d="M70 156H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="161" class="sub end">24</text><path d="M70 112H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="117" class="sub end">32</text><path d="M70 68H535" stroke="#d4e0e8" stroke-width="1"/><text x="59" y="73" class="sub end">40</text><path d="M70 288v5" stroke="#526b80"/><text x="70" y="311" class="sub center">0</text><path d="M163 288v5" stroke="#526b80"/><text x="163" y="311" class="sub center">2</text><path d="M256 288v5" stroke="#526b80"/><text x="256" y="311" class="sub center">4</text><path d="M349 288v5" stroke="#526b80"/><text x="349" y="311" class="sub center">6</text><path d="M442 288v5" stroke="#526b80"/><text x="442" y="311" class="sub center">8</text><path d="M535 288v5" stroke="#526b80"/><text x="535" y="311" class="sub center">10</text><path d="M70 63V288H535" fill="none" stroke="#526b80" stroke-width="1.5"/><text x="610" y="311" class="sub end">Context</text><path d="M80 339h25" stroke="#98611b" stroke-width="4"/><text x="113" y="344" class="sub">Weights</text><path d="M255 339h25" stroke="#35678f" stroke-width="4"/><text x="288" y="344" class="sub">MHA KV</text><path d="M430 339h25" stroke="#08756e" stroke-width="4"/><text x="463" y="344" class="sub">MQA KV</text><g class="fallback"><path d="M70 244H535" stroke="#98611b" stroke-width="3" fill="none"/><path d="M70 288L535 68" stroke="#35678f" stroke-width="3" fill="none"/><path d="M70 288L535 233" stroke="#08756e" stroke-width="3" fill="none"/><path d="M163 244V288" stroke="#35678f" stroke-dasharray="4 4" opacity=".7"/><circle cx="163" cy="244" r="6" fill="#f7fafc" stroke="#35678f" stroke-width="2.5"/><path d="M442 244V288" stroke="#08756e" stroke-dasharray="4 4" opacity=".7"/><circle cx="442" cy="244" r="6" fill="#f7fafc" stroke="#08756e" stroke-width="2.5"/></g><g class="motion"><g opacity=".3"><path d="M70 244H535" stroke="#98611b" stroke-width="3" fill="none"/><path d="M70 288L535 68" stroke="#35678f" stroke-width="3" fill="none"/><path d="M70 288L535 233" stroke="#08756e" stroke-width="3" fill="none"/></g><defs><clipPath id="reveal"><rect x="66" y="60" width="54.5" height="232"><animate attributeName="width" values="54.5;54.5;473;473" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/></rect></clipPath></defs><g clip-path="url(#reveal)"><path d="M70 244H535" stroke="#98611b" stroke-width="3" fill="none"/><path d="M70 288L535 68" stroke="#35678f" stroke-width="3" fill="none"/><path d="M70 288L535 233" stroke="#08756e" stroke-width="3" fill="none"/><path d="M163 244V288" stroke="#35678f" stroke-dasharray="4 4" opacity=".7"/><circle cx="163" cy="244" r="6" fill="#f7fafc" stroke="#35678f" stroke-width="2.5"/><path d="M442 244V288" stroke="#08756e" stroke-dasharray="4 4" opacity=".7"/><circle cx="442" cy="244" r="6" fill="#f7fafc" stroke="#08756e" stroke-width="2.5"/></g><path d="M0 63V288" transform="translate(116.5 0)" stroke="#526b80" stroke-width="1.5" stroke-dasharray="3 4"><animateTransform attributeName="transform" type="translate" values="116.5 0;116.5 0;535 0;535 0" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/></path><circle cx="116.5" cy="244" r="5" fill="#98611b" stroke="white" stroke-width="1.2"><animate attributeName="cx" values="116.5;116.5;535;535" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="244;244;244;244" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="116.5" cy="266" r="5" fill="#35678f" stroke="white" stroke-width="1.2"><animate attributeName="cx" values="116.5;116.5;535;535" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="266;266;68;68" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="116.5" cy="282.5" r="5" fill="#08756e" stroke="white" stroke-width="1.2"><animate attributeName="cx" values="116.5;116.5;535;535" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="282.5;282.5;233;233" keyTimes="0;.08;.84;1" dur="12s" repeatCount="indefinite"/></circle></g></svg>
