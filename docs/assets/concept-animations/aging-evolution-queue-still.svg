<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Regularized aging evolution population replacement</title><desc id="desc">Tournament chooses C, mutates to child F, and evicts the oldest A even though A has the highest illustrative score. Queue becomes B C D E F. Toy validation scores, not experimental benchmarks.</desc><style>text{font-family:Inter,Arial,sans-serif} @media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" stroke="#f5f9fc" stroke-width="1"/><text x="26" y="33" font-size="14" fill="#263d51" text-anchor="start" font-weight="750">AGING EVOLUTION  /  ONE REPLACEMENT</text><text x="26" y="56" font-size="12" fill="#637b91" text-anchor="start" font-weight="500">Best tournament parent: C (.86) → child F (.88)</text><rect x="23" y="77" width="594" height="266" rx="12" fill="white" stroke="#dce7ef" stroke-width="1"/><text x="35" y="102" font-size="12" fill="#637b91" text-anchor="start" font-weight="700">After removing the oldest</text><rect x="36" y="121" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="44" y="130" width="84" height="6" rx="3" fill="#3977b8" stroke="#3977b8" stroke-width="1"/><text x="86" y="167" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">B</text><text x="86" y="190" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.71</text><rect x="149" y="121" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="157" y="130" width="84" height="6" rx="3" fill="#0c968c" stroke="#0c968c" stroke-width="1"/><text x="199" y="167" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">C</text><text x="199" y="190" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.86</text><rect x="262" y="121" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="270" y="130" width="84" height="6" rx="3" fill="#3977b8" stroke="#3977b8" stroke-width="1"/><text x="312" y="167" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">D</text><text x="312" y="190" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.82</text><rect x="375" y="121" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="383" y="130" width="84" height="6" rx="3" fill="#8564ba" stroke="#8564ba" stroke-width="1"/><text x="425" y="167" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">E</text><text x="425" y="190" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.75</text><rect x="488" y="121" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="496" y="130" width="84" height="6" rx="3" fill="#0c968c" stroke="#0c968c" stroke-width="1"/><text x="538" y="167" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">F</text><text x="538" y="190" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.88</text><rect x="42" y="241" width="185" height="60" rx="8" fill="#fcf1f1" stroke="#efced3" stroke-width="1"/><text x="55" y="264" font-size="15" fill="#bd5b66" text-anchor="start" font-weight="750">A   .94</text><text x="55" y="284" font-size="12" fill="#bd5b66" text-anchor="start" font-weight="650">Oldest: evicted</text><path d="M232 272L326 272" fill="none" stroke="#bd5b66" stroke-width="2" stroke-dasharray="6 5"/><text x="340" y="275" font-size="12" fill="#263d51" text-anchor="start" font-weight="700">Not worst-score removal</text></svg>