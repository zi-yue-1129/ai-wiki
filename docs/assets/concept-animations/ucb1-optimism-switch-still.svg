<svg xmlns="http://www.w3.org/2000/svg" width="860" height="464" viewBox="0 0 860 464" role="img" aria-label="UCB1 selects the arm with largest empirical mean plus uncertainty bonus; two zero rewards reduce the chosen arm bonus"><rect x="1" y="1" width="858" height="462" rx="18" fill="#F9FCFD" stroke="#D0DFE8"/><text x="28" y="42" fill="#17334D" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="760" text-anchor="start">UCB1  /  OPTIMISM BONUS</text><rect x="682" y="21" width="150" height="27" rx="14" fill="#E5F3F2" stroke="none"/><text x="757" y="40" fill="#0A8B8E" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="650" text-anchor="middle">schematic • not data</text><text x="29" y="73" fill="#5F758A" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Score = empirical mean + exploration bonus</text><rect x="28" y="91" width="805" height="294" rx="10" fill="#FFFFFF" stroke="#D8E5ED"/><text x="48" y="121" fill="#477DA8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">Empirical mean</text><rect x="29" y="109" width="12" height="12" rx="2" fill="#477DA8" stroke="none"/><text x="244" y="121" fill="#EB8757" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">Confidence bonus</text><rect x="225" y="109" width="12" height="12" rx="2" fill="#EB8757" stroke="none"/><text x="612" y="121" fill="#0A8B8E" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start">Choose max score</text><rect x="63" y="139" width="209" height="221" rx="11" fill="#FAFCFD" stroke="#E1EAF0"/><text x="167" y="164" fill="#17334D" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="740" text-anchor="middle">ARM A</text><path d="M85 338 L249 338" fill="none" stroke="#B8CAD5" stroke-width="1.3"/><path d="M95 263 L239 263" fill="none" stroke="#E3EDF2" stroke-width="1"/><path d="M95 188 L239 188" fill="none" stroke="#