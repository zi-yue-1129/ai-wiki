<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FlashAttention backward recomputes score tiles instead of saving the dense probability matrix</title><desc id="desc">Illustrative exact-attention data flow: Q, K, V, upstream gradient dO, output O and row log-sum-exp are available to backward. Each score tile is reconstructed in on-chip memory to form local probabilities and gradients, avoiding persistent storage of the full attention probability matrix. Details of retained statistics vary by implementation; no timing or hardware measurement is depicted.</desc><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fafc" stroke="none" stroke-width="1"/><rect x="12" y="12" width="616" height="336" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">FlashAttention backward · recompute</text><text x="28" y="66" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">On-chip score tiles are temporary; row statistics enable exact gradients.</text><rect x="28" y="99" width="171" height="198" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="231" y="99" width="174" height="198" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="446" y="99" width="166" height="198" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#334155" font-weight="700" text-anchor="start">HBM · persistent</text><text x="246" y="123" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#334155" font-weight="700" text-anchor="start">SRAM · temporary</text><text x="460" y="123" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#334155" font-weight="700" text-anchor="start">Backward results</text><rect x="43" y="137" width="141" height="38" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="113" y="161" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Q · K · V · dO</text><rect x="43" y="185" width="141" height="38" rx="7" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/><text x="113" y="209" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle">O · row LSE</text><rect x="43" y="237" width="141" height="38" rx="7" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/><text x="113" y="260" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="middle">P matrix: no</text><text x="246" y="146" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" font-weight="600" text-anchor="start">Recompute S</text><rect x="255" y="161" width="35" height="29" rx="5" fill="#a5f3fc" stroke="#e2e8f0" stroke-width="1"/><rect x="297" y="161" width="35" height="29" rx="5" fill="#c7d2fe" stroke="#e2e8f0" stroke-width="1"/><rect x="339" y="161" width="35" height="29" rx="5" fill="#a5f3fc" stroke="#e2e8f0" stroke-width="1"/><rect x="255" y="196" width="35" height="29" rx="5" fill="#c7d2fe" stroke="#e2e8f0" stroke-width="1"/><rect x="297" y="196" width="35" height="29" rx="5" fill="#a5f3fc" stroke="#e2e8f0" stroke-width="1"/><rect x="339" y="196" width="35" height="29" rx="5" fill="#c7d2fe" stroke="#e2e8f0" stroke-width="1"/><rect x="255" y="231" width="35" height="29" rx="5" fill="#a5f3fc" stroke="#e2e8f0" stroke-width="1"/><rect x="297" y="231" width="35" height="29" rx="5" fill="#c7d2fe" stroke="#e2e8f0" stroke-width="1"/><rect x="339" y="231" width="35" height="29" rx="5" fill="#a5f3fc" stroke="#e2e8f0" stroke-width="1"/><text x="317" y="283" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#475569" font-weight="600" text-anchor="middle">Softmax using LSE</text><rect x="461" y="146" width="135" height="33" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="529" y="168" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">dQ</text><rect x="461" y="191" width="135" height="33" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="529" y="213" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">dK</text><rect x="461" y="236" width="135" height="33" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/><text x="529" y="258" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">dV</text><path d="M 199 165 H 231" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/><path d="M 231 202 H 199" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/><path d="M 405 205 H 446" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/><path d="M 223 159 L 231 165 L 223 171" fill="none" stroke="#0d9488" stroke-width="3"/><path d="M 438 199 L 446 205 L 438 211" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="28" y="311" width="584" height="30" rx="6" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="40" y="330" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start">Forward: save O + LSE, not P</text><text x="600" y="330" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9a3412" font-weight="700" text-anchor="end">Backward: recompute S → dQ, dK, dV</text></svg>