<line x1="366" x2="366" y1="106" y2="290" stroke="#a05c20" stroke-width="1.7" stroke-dasharray="5 3"><animate attributeName="x1" values="366;366;392;392;574;574;366" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="366;366;392;392;574;574;366" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/></line>
<circle cx="366" cy="249.5" r="5.5" fill="#315c85" stroke="white" stroke-width="1.2"><animate attributeName="cx" values="366;366;392;392;574;574;366" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="249.5;249.5;254;254;285.5;285.5;249.5" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="366" cy="272" r="5.5" fill="#08766f" stroke="white" stroke-width="1.2"><animate attributeName="cx" values="366;366;392;392;574;574;366" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="272;272;254;254;128;128;272" keyTimes="0;.15;.25;.35;.75;.85;1" dur="12s" repeatCount="indefinite"/></circle>
<g font-size="13" fill="#23364a" text-anchor="middle"><text x="340" y="307">0</text><text x="392" y="307">0.2</text><text x="600" y="307">1</text><text x="470" y="326">p</text></g>
<g font-size="13" fill="#23364a"><path d="M340 83h18" stroke="#315c85" stroke-width="3"/><text x="364" y="87">Keep 1</text><path d="M470 83h18" stroke="#08766f" stroke-width="3"/><text x="494" y="87">Keep 2</text></g>
<text x="30" y="313" font-size="14" fill="#23364a">Keep the larger energy.</text><text x="30" y="334" font-size="14" fill="#23364a">Discard the other.</text>
</svg>