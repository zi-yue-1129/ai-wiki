<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Shared key-value cache, different query outputs</title><desc id="desc">Two query heads use the same three cached scalar values 1, 2 and 4. The first has attention weights 0.6, 0.2, 0.2 and output 1.8. The second has weights 0.2, 0.2, 0.6 and output 3.0. The animation accumulates weighted contributions for illustration.</desc><style>text{font:16px system-ui,sans-serif;fill:#243e53}.heading{font-size:21px;font-weight:700}.sub{font-size:15px;fill:#526b80}.bold{font-weight:700}.white{fill:white}.center{text-anchor:middle}.end{text-anchor:end}.fallback{display:none}@media(prefers-reduced-motion:reduce){.fallback{display:inline}.motion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="6" fill="#f7fafc" /><text x="24" y="34" class="heading">Shared KV, distinct outputs</text><text x="24" y="65" class="sub">Shared cache</text><text x="546" y="65" class="sub center">Output</text><rect x="130" y="74" width="100" height="58" rx="6" fill="#e5eef5" stroke="#d4e0e8"/><text x="180" y="96" class="center sub">K1 / V1</text><text x="180" y="120" class="center bold">1</text><rect x="252" y="74" width="100" height="58" rx="6" fill="#e5eef5" stroke="#d4e0e8"/><text x="302" y="96" class="center sub">K2 / V2</text><text x="302" y="120" class="center bold">2</text><rect x="374" y="74" width="100" height="58" rx="6" fill="#e5eef5" stroke="#d4e0e8"/><text x="424" y="96" class="center sub">K3 / V3</text><text x="424" y="120" class="center bold">4</text><rect x="22" y="153" width="596" height="78" rx="6" fill="#ffffff" stroke="#d4e0e8"/><text x="46" y="184" class="bold">Q1</text><text x="46" y="207" class="sub">p · v</text><rect x="130" y="161" width="100" height="62" rx="6" fill="#eef3f7" /><text x="180" y="182" class="center sub">60%</text><rect x="252" y="161" width="100" height="62" rx="6" fill="#eef3f7" /><text x="302" y="182" class="center sub">20%</text><rect x="374" y="161" width="100" height="62" rx="6" fill="#eef3f7" /><text x="424" y="182" class="center sub">20%</text><rect x="499" y="202" width="96" height="12" rx="6" fill="#e4ebf0" /><rect x="22" y="241" width="596" height="78" rx="6" fill="#ffffff" stroke="#d4e0e8"/><text x="46" y="272" class="bold">Q2</text><text x="46" y="295" class="sub">p · v</text><rect x="130" y="249" width="100" height="62" rx="6" fill="#eef3f7" /><text x="180" y="270" class="center sub">20%</text><rect x="252" y="249" width="100" height="62" rx="6" fill="#eef3f7" /><text x="302" y="270" class="center sub">20%</text><rect x="374" y="249" width="100" height="62" rx="6" fill="#eef3f7" /><text x="424" y="270" class="center sub">60%</text><rect x="499" y="290" width="96" height="12" rx="6" fill="#e4ebf0" /><text x="24" y="344" class="sub">Attention weights × shared values</text><text x="180" y="206" class="center bold">0.6</text><text x="302" y="206" class="center bold">0.4</text><text x="424" y="206" class="center bold">0.8</text><rect x="499" y="202" width="57.6" height="12" rx="6" fill="#35678f" /><text x="547" y="185" class="center bold">1.8</text><text x="180" y="294" class="center bold">0.2</text><text x="302" y="294" class="center bold">0.4</text><text x="424" y="294" class="center bold">2.4</text><rect x="499" y="290" width="96" height="12" rx="6" fill="#08756e" /><text x="547" y="273" class="center bold">3.0</text></svg>
