<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">GQA conversion: average K and V projection heads then uptrain</title><desc id="desc">Four original K and V projection heads are pooled within two groups, producing two shared key-value heads. Animated packets carry their values toward group means, then the resulting checkpoint undergoes further pretraining. Scalar values are illustrative, not model weights.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f0f5fa"/></linearGradient><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8ca7ba" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,system-ui,Segoe UI,sans-serif;fill:#243e53} .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#567185}.muted{font-size:12px;fill:#627c90}.head{font-size:13px;font-weight:750;text-anchor:middle}.quiet{fill:none;stroke:#b8ceda;stroke-width:2;stroke-linecap:round}.hi0{stroke:#138d98;fill:none;stroke-width:3;stroke-linecap:round}.hi1{stroke:#b97b34;fill:none;stroke-width:3;stroke-linecap:round} @media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><rect width="640" height="360" rx="19" fill="url(#bg)"/><text x="28" y="35" class="eyebrow">GQA CHECKPOINT CONVERSION</text><text x="35" y="67" class="eyebrow">MHA WEIGHTS</text><text x="242" y="67" class="eyebrow">MEAN</text><text x="397" y="67" class="eyebrow">GQA WEIGHTS</text><rect x="24" y="79" width="492" height="116" rx="14" fill="#e8f5f5" stroke="#d3e8e9"/><rect x="24" y="202" width="492" height="116" rx="14" fill="#fff4e6" stroke="#efdfc7"/><rect x="36" y="92" width="154" height="40" rx="10" fill="#fff" stroke="#b4cdd9" stroke-width="1.6"/><text x="48" y="108" font-size="12" font-weight="700">H1</text><text x="83" y="108" font-size="12" f