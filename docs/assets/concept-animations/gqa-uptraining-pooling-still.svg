height="59" rx="11" fill="#fff" stroke="#138d98" stroke-width="2"/><text x="438" y="134" class="head">K .4 / V .6</text><text x="438" y="154" class="muted" text-anchor="middle">shared head</text><rect x="371" y="233" width="134" height="59" rx="11" fill="#fff" stroke="#c18b45" stroke-width="2"/><text x="438" y="257" class="head">K .5 / V .7</text><text x="438" y="277" class="muted" text-anchor="middle">shared head</text><rect x="530" y="130" width="88" height="112" rx="18" fill="#eaeafc" stroke="#bcbde4" stroke-width="1.8"/><path d="M550 166 A23 23 0 1 1 591 185" stroke="#7567c4" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M582 176L592 185L599 174" stroke="#7567c4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="218" class="head">UPTRAIN</text><path d="M505 138 C528 138 528 154 530 155 M505 263 C528 263 528 222 530 219" stroke="#bcbde4" stroke-width="2.5" fill="none"/><text x="35" y="342" class="muted">Schematic scalar weights; the actual method averages K/V projection matrices.</text></svg>