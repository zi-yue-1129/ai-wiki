<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Honest causal tree leaf contrasts</title><desc id="desc">Disjoint partition and estimation samples. The partition chooses a fixed illustrative threshold. Estimation outcomes route to two leaves and form treated-minus-control means, four and one.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#60768d"/></marker></defs><rect width="640" height="360" rx="16" fill="#f6f8fc"/><rect x="14" y="14" width="612" height="332" rx="8" fill="#ffffff" stroke="#d9e3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="43" font-size="22" font-weight="600" fill="#203651" text-anchor="middle">Honest causal tree</text><rect x="32" y="65" width="180" height="72" rx="8" fill="#eff4fa" stroke="#d9e3ed"/><text x="122" y="88" font-size="17" font-weight="600" fill="#4268a7" text-anchor="middle">Partition set</text><text x="122" y="112" font-size="14" font-weight="600" fill="#4268a7" text-anchor="middle">P1 · P2 · P3 · P4</text><rect x="428" y="65" width="180" height="72" rx="8" fill="#eaf7f5" stroke="#d9e3ed"/><text x="518" y="88" font-size="17" font-weight="600" fill="#087f82" text-anchor="middle">Estimation set</text><text x="518" y="112" font-size="15" font-weight="600" fill="#087f82" text-anchor="middle">E1 … E8</text><path d="M212 100H267" fill="none" stroke="#4268a7" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="268" y="77" width="104" height="46" rx="8" fill="#f0f5fa" stroke="#d9e3ed"/><text x="320" y="106" font-size="19" font-weight="600" fill="#203651" text-anchor="middle">x &lt; 0</text><path d="M428 100H373" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 123V153H169V178" fill="none" stroke="#60768d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320 153H471V178" fill="none" stroke="#60768d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="139" y="169" font-size="12" font-weight="600" fill="#60768d" text-anchor="middle">x &lt; 0</text><text x="501" y="169" font-size="12" font-weight="600" fill="#60768d" text-anchor="middle">x ≥ 0</text><rect x="40" y="180" width="258" height="149" rx="8" fill="#f8fbfd" stroke="#d9e3ed"/><text x="169" y="202" font-size="16" font-weight="600" fill="#203651" text-anchor="middle">Leaf L</text><rect x="54" y="213" width="111" height="43" rx="8" fill="#eaf7f5" stroke="#d9e3ed"/><text x="109" y="230" font-size="12" font-weight="600" fill="#087f82" text-anchor="middle">Treated</text><text x="109" y="248" font-size="17" font-weight="600" fill="#087f82" text-anchor="middle">5, 7</text><rect x="173" y="213" width="111" height="43" rx="8" fill="#fff1e5" stroke="#d9e3ed"/><text x="228" y="230" font-size="12" font-weight="600" fill="#b66b26" text-anchor="middle">Control</text><text x="228" y="248" font-size="17" font-weight="600" fill="#b66b26" text-anchor="middle">1, 3</text><text x="169" y="280" font-size="17" font-weight="600" fill="#203651" text-anchor="middle">6 − 2</text><text x="169" y="310" font-size="24" font-weight="600" fill="#087f82" text-anchor="middle">τ̂ = 4</text><rect x="342" y="180" width="258" height="149" rx="8" fill="#f8fbfd" stroke="#d9e3ed"/><text x="471" y="202" font-size="16" font-weight="600" fill="#203651" text-anchor="middle">Leaf R</text><rect x="356" y="213" width="111" height="43" rx="8" fill="#eaf7f5" stroke="#d9e3ed"/><text x="411" y="230" font-size="12" font-weight="600" fill="#087f82" text-anchor="middle">Treated</text><text x="411" y="248" font-size="17" font-weight="600" fill="#087f82" text-anchor="middle">4, 6</text><rect x="475" y="213" width="111" height="43" rx="8" fill="#fff1e5" stroke="#d9e3ed"/><text x="530" y="230" font-size="12" font-weight="600" fill="#b66b26" text-anchor="middle">Control</text><text x="530" y="248" fo