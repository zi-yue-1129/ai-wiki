<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">Dreamer imagined lambda returns computed backward</ns0:title><ns0:desc id="desc">An imagined rollout with rewards 1, 0, 2 bootstraps from V3 equal to 1.5. A backward lambda-return recursion with gamma 0.9 and lambda 0.8 yields G2 3.350, G1 2.610 and G0 3.023. Illustrative values, not experimental measurements.</ns0:desc><ns0:style>@media (prefers-reduced-motion: reduce){.motion-only{display:none!important}}</ns0:style><ns0:defs><ns0:marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#376cae" /></ns0:marker><ns0:marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#087f8a" /></ns0:marker><ns0:marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#b34f7c" /></ns0:marker></ns0:defs><ns0:rect x="0" y="0" width="640" height="360" rx="0" fill="#f4f7fb" stroke="#f4f7fb" /><ns0:text x="28" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#087f8a">DREAMER</ns0:text><ns0:text x="612" y="38" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#19334a">Backward λ-return</ns0:text><ns0:rect x="19" y="64" width="602" height="148" rx="12" fill="#ffffff" stroke="#d7e2ec" /><ns0:rect x="19" y="226" width="602" height="117" rx="12" fill="#ffffff" stroke="#d7e2ec" /><ns0:text x="43" y="87" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">IMAGINED LATENT ROLLOUT</ns0:text><ns0:text x="43" y="250" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fi