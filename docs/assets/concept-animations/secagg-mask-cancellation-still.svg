<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Secure aggregation masked-sum cancellation</title><desc id="desc">Three users send masked updates plus 5, minus 3, plus 3, while net masks plus 1 minus 2 plus 1 cancel to zero. Their true updates plus 4 minus 1 plus 2 sum to plus 5. The masking shares are illustrative and do not represent the full dropout-tolerant protocol.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf5fa"/></linearGradient><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7" fill="none" stroke="#409a9f" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,system-ui,sans-serif;fill:#274355}.head{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#668195}.name{font-size:17px;font-weight:750}.key{font-size:13px;fill:#678297}.value{font-size:18px;font-weight:750}.panel{fill:#fff;stroke:#cddfe8;stroke-width:1.6}.track{stroke:#cfdfeb;stroke-width:4;stroke-linecap:round}.teal{fill:#148d91}.final{opacity:0}@media(prefers-reduced-motion:reduce){.initial,.motion{display:none!important}.final{opacity:1!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="30" y="37" class="head">SECURE AGGREGATION · MASK CANCELLATION</text><text x="30" y="57" class="key">Toy arithmetic over integers; no dropout handling shown</text><rect class="panel" x="29" y="73" width="175" height="154" rx="15"/><text class="name" x="43" y="99">CLIENT A</text><text class="key" x="43" y="126">UPDATE</text><text class="value" x="176" y="127" text-anchor="end">+4</text><text class="key" x="43" y="155">MASK</text><text class="value" x="176" y="156" text-anchor="end" fill="#197a96">+1</text><path d="M43 170H190" stroke="#d7e4eb"/><text class="key" x="43" y="204">SENT</text><text class="value" x="176" y="204" text-anchor="end" fill="#197a96">+5</text><path d="M117 227Q117 251 320 260" stroke="#197a96" stroke-width="3" fill="none" opacity=".7"/><rect class="panel" x="232" y="73" width="175" height="154" rx="15"/><text class="name" x="246" y="99">CLIENT B</text><text class="key" x="246" y="126">UPDATE</text><text class="value" x="379" y="127" text-anchor="end">−1</text><text class="key" x="246" y="155">MASK</text><text class="value" x="379" y="156" text-anchor="end" fill="#a073b1">−2</text><path d="M246 170H393" stroke="#d7e4eb"/><text class="key" x="246" y="204">SENT</text><text class="value" x="379" y="204" text-anchor="end" fill="#a073b1">−3</text><path d="M320 227Q320 251 320 260" stroke="#a073b1" stroke-width="3" fill="none" opacity=".7"/><rect class="panel" x="435" y="73" width="175" height="154" rx="15"/><text class="name" x="449" y="99">CLIENT C</text><text class="key" x="449" y="126">UPDATE</text><text class="value" x="582" y="127" text-anchor="end">+2</text><text class="key" x="449" y="155">MASK</text><text class="value" x="582" y="156" text-anchor="end" fill="#148d91">+1</text><path d="M449 170H596" stroke="#d7e4eb"/><text class="key" x="449" y="204">SENT</text><text class="value" x="582" y="204" text-anchor="end" fill="#148d91">+3</text><path d="M523 227Q523 251 320 260" stroke="#148d91" stroke-width="3" fill="none" opacity=".7"/><rect class="panel" x="208" y="259" width="224" height="72" rx="15"/><text class="head" x="320" y="282" text-anchor="middle">SERVER SEES ONLY SUM</text><text class="value" x="320" y="311" text-anchor="middle">Σ = +5</text><text x="320" y="349" class="key" text-anchor="middle">MASKS CANCEL: (+1) + (−2) + (+1) = 0</text></svg>
