<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ACT CVAE training and encoder-free deployment</title><desc id="desc">During training demonstration actions enter a CVAE encoder; an observation-conditioned decoder reconstructs action chunks while style z is regularized by KL. At inference only observations and z equals zero reach the policy decoder.</desc><style>text{font-family:Arial,Helvetica,sans-serif}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.always{opacity:1!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbff" stroke="none" stroke-width="0"/><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#dce6f0" stroke-width="1"/><text x="28" y="37" font-size="15" font-weight="700" fill="#20354f" text-anchor="start">ACT</text><text x="612" y="37" font-size="12" font-weight="700" fill="#61748a" text-anchor="end">TRAIN / DEPLOY</text><path d="M28 51 H612" stroke="#dce6f0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="68" width="291" height="261" rx="12" fill="#fff" stroke="#dce6f0" stroke-width="1.2"/><rect x="327" y="68" width="291" height="261" rx="12" fill="#fff" stroke="#dce6f0" stroke-width="1.2"/><text x="46" y="91" font-size="13" font-weight="700" fill="#087f83" text-anchor="start">TRAIN</text><text x="351" y="91" font-size="13" font-weight="700" fill="#3379b9" text-anchor="start">DEPLOY</text><rect x="38" y="117" width="74" height="43" rx="9" fill="#e9f2fb" stroke="#dce6f0" stroke-width="1.2"/><text x="75" y="143.5" font-size="12" font-weight="700" fill="#20354f" text-anchor="middle">Actions</text><rect x="140" y="117" width="75" height="43" rx="9" fill="#e2f5f2" stroke="#087f83" stroke-width="1.2"/><text x="177.5" y="143.5" font-size="12" font-weight="700" fill="#087f83" text-anchor="middle">Encoder</text><rect x="242" y="117" width="55" height="43" rx="9" fill="#f0eaff" stroke="#7c5cc4" stroke-width="1.2"/><text x="269.5" y="143.5" font-size="16" font-weight="700" fill="#7c5cc4" text-anchor="middle">z</text><path d="M112 139 H136" stroke="#3379b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 139 H238" stroke="#7c5cc4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="293" y="184" font-size="11" font-weight="700" fill="#7c5cc4" text-anchor="middle">KL</text><rect x="46" y="193" width="74" height="40" rx="9" fill="#e9f2fb" stroke="#dce6f0" stroke-width="1.2"/><text x="83" y="218" font-size="12" font-weight="700" fill="#20354f" text-anchor="middle">Obs</text><rect x="165" y="199" width="104" height="47" rx="9" fill="#e2f5f2" stroke="#087f83" stroke-width="1.2"/><text x="217" y="227.5" font-size="13" font-weight="700" fill="#087f83" text-anchor="middle">Decoder</text><path d="M120 213 H161" stroke="#3379b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 160 V181 H260 V195" stroke="#7c5cc4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M217 246 V263" stroke="#087f83" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="155" y="268" width="124" height="40" rx="9" fill="#fff0df" stroke="#e29337" stroke-width="1.2"/><text x="217" y="293" font-size="12" font-weight="700" fill="#20354f" text-anchor="middle">Action chunk</text><text x="60" y="298" font-size="11" font-weight="600" fill="#e29337" text-anchor="start">L recon</text><rect x="344" y="117" width="87" height="43" rx="9" fill="#e9f2fb" stroke="#dce6f0" stroke-width="1.2"/><text x="387.5" y="143.5" font-size="12" font-weight="700" fill="#20354f" text-anchor="middle">Obs</text><rect x="455" y="117" width="69" height="43" rx="9" fill="#f0eaff" stroke="#7c5cc4" stroke-width="1.2"/><text x="489.5" y="143.5" font-size="13" font-weight="700" fill="#7c5cc4" text-anchor="middle">z = 0</text><rect x="429" y="203" width="126" height="50" rx="9" fill="#e2f5f2" stroke="#087f83" stroke-width="1.2"/><text x="492" y="233" font-size="13" font-weight="700" fill="#087f83" text-anchor="middle">Decoder</text><path d="M388 160 V183 H470 V199" stroke="#3379b9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 160 V199" stroke="#7c5cc4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M492 253 V267" stroke="#087f83" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="271" width="125" height="40" rx="9" fill="#fff0df" stroke="#e29337" stroke-width="1.2"/><text x="492.5" y="296" font-size="12" font-weight="700" fill="#20354f" text-anchor="middle">Action chunk</text><text x="374" y="340" font-size="11" font-weight="600" fill="#61748a" text-anchor="start">No encoder at test time</text></svg>