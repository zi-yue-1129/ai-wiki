<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Truncated SVD residual reduction</title><desc id="desc">Illustrative three-by-four matrix with orthogonal rows. The animation sends three singular components to the reconstruction and lowers Frobenius residual; the static view compares exact rank-one, rank-two and rank-three approximations.</desc><rect x="0" y="0" width="800" height="420" rx="0" fill="#f6f9fc" stroke="none"/><text x="30" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1d3448">Truncated SVD</text><text x="30" y="59" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51677c">Adding orthogonal rank-one terms</text><line x1="30" y1="74" x2="770" y2="74" stroke="#d5e1ea" stroke-width="2" /><text x="33" y="100" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d3448">Exact rank-k snapshots</text><rect x="30" y="117" width="237" height="242" rx="12" fill="#fff" stroke="#d5e1ea"/><text x="48" y="150" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d3448">k = 1</text><rect x="48" y="174" width="46" height="35" rx="5" fill="#168887" stroke="#d5e1ea"/><rect x="99" y="174" width="46" height="35" rx="5" fill="#168887" stroke="#d5e1ea"/><rect x="150" y="174" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="201" y="174" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="48" y="216" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="99" y="216" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="150" y="216" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="201" y="216" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="48" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="99" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="150" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="201" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><line x1="46" y1="309" x2="250" y2="309" stroke="#d5e1ea" stroke-width="1.5" /><text x="48" y="339" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#51677c">Residual</text><text x="242" y="340" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d3448">√10</text><rect x="282" y="117" width="237" height="242" rx="12" fill="#fff" stroke="#d5e1ea"/><text x="300" y="150" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d3448">k = 2</text><rect x="300" y="174" width="46" height="35" rx="5" fill="#168887" stroke="#d5e1ea"/><rect x="351" y="174" width="46" height="35" rx="5" fill="#168887" stroke="#d5e1ea"/><rect x="402" y="174" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="453" y="174" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="300" y="216" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="351" y="216" width="46" height="35" rx="5" fill="#fff" stroke="#d5e1ea"/><rect x="402" y="216" width="46" height="35" rx="5" fill="#4279bb" stroke="#d5e1ea"/><rect x="453" y="216" width="46" height="35" rx="5" fill="#4279bb" stroke="#d5e1ea"/><rect x="300" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="351" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="402" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><rect x="453" y="258" width="46" height="35" rx="5" fill="#f1f5f8" stroke="#d5e1ea"/><line x1="298" y1="309" x2="502" y2="309" stroke="#d5e1ea" stroke-width="1.5" /><text x="300"