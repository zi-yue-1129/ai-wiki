<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Adam epsilon effect for small constant gradients</title><desc id="desc">For a constant positive scalar gradient of magnitude c greater than zero, bias corrected first moment and root second moment both equal c. With epsilon zero the normalized update is one, while with epsilon point one it is c divided by c plus point one. Animated markers trace a parameter sweep, not training iterations.</desc><style>text{font-family:Inter,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.motion-highlight{opacity:.2}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f4f9fc" stroke="none"/><text x="34" y="40" font-size="17" fill="#17364c" font-weight="750" text-anchor="start">ADAM  /  EPSILON AT SMALL GRADIENTS</text><text x="34" y="64" font-size="12" fill="#678397" font-weight="600" text-anchor="start">Constant positive gradient  g = c     ·     corrected moments</text><rect x="28" y="83" width="492" height="293" rx="14" fill="white" stroke="#d6e5ee"/><rect x="533" y="83" width="240" height="293" rx="14" fill="white" stroke="#d6e5ee"/><text x="47" y="111" font-size="15" fill="#24485d" font-weight="700" text-anchor="start">Normalized update  u(c)</text><path d="M77 328.00H487" fill="none" stroke="#eaf1f5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="332.00" font-size="11" fill="#678397" font-weight="500" text-anchor="end">0.0</text><path d="M77 236.00H487" fill="none" stroke="#eaf1f5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="240.00" font-size="11" fill="#678397" font-weight="500" text-anchor="end">0.5</text><path d="M77 144.00H487" fill="none" stroke="#eaf1f5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="148.00" font-size="11" fill="#678397" font-weight="500" text-anchor="end">1.0</text><text x="77.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0</text><text x="159.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0.10</text><text x="241.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0.20</text><text x="323.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0.30</text><text x="405.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0.40</text><text x="487.00" y="349" font-size="11" fill="#678397" font-weight="500" text-anchor="middle">0.50</text><path d="M77 144V328H487" fill="none" stroke="#678397" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M81.10 144H487" fill="none" stroke="#2379bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M77.00 328.00 L81.10 319.24 L85.20 311.27 L89.30 304.00 L93.40 297.33 L97.50 291.20 L101.60 285.54 L105.70 280.30 L109.80 275.43 L113.90 270.90 L118.00 266.67 L122.10 262.71 L126.20 259.00 L130.30 255.52 L134.40 252.24 L138.50 249.14 L142.60 246.22 L146.70 243.46 L150.80 240.84 L154.90 238.36 L159.00 236.00 L163.10 233.76 L167.20 231.62 L171.30 229.58 L175.40 227.64 L179.50 225.78 L183.60 224.00 L187.70 222.30 L191.80 220.67 L195.90 219.10 L200.00 217.60 L204.10 216.16 L208.20 214.77 L212.30 213.43 L216.40 212.15 L220.50 210.91 L224.60 209.71 L228.70 208.56 L232.80 207.45 L236.90 206.37 L241.00 205.33 L245.10 204.33 L249.20 203.35 L253.30 202.41 L257.40 201.50 L261.50 200.62 L265.60 199.76 L269.70 198.93 L273.80 198.12 L277.90 197.33 L282.00 196.57 L286.10 195.83 L290.20 195.11 L294.30 194.41 L298.40 193.73 L302.50 193.07 L306.60 192.42 L310.70 191.79 L314.80 191.18 L318.90 190.58 L323.00 190.00 L327.10 189.43 L331.20 188.88 L335.30 188.34 L339.40 187.81 L343.50 187.29 L347.60 186.79 L351.70 186.30 L355.80 185.82 L359.90 185.35 L364.00 184.89 L368.10 184.44 L372.20 184.00 L376.30 183.57 L380.40 183.15 