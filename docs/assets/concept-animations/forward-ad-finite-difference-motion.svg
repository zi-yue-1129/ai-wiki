<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Directional derivatives: centered difference versus exact JVP</title><desc id="desc">For f(x)=x cubed at x one, the centered finite difference equals three plus h squared, whereas the exact derivative is three. Symmetric secant endpoints and a truncation-error bar move continuously as h shrinks then grows.</desc><defs><marker id="arr-teal" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#13868b"/></marker><marker id="arr-amber" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c98132"/></marker><marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7461a5"/></marker></defs><rect x="0.00" y="0.00" width="800.00" height="420.00" rx="18" fill="#f1f7fa" stroke="none"/><rect x="16.00" y="16.00" width="768.00" height="388.00" rx="16" fill="#fff" stroke="#d8e4eb"/><text x="38.00" y="52.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#19384b" text-anchor="start" font-weight="700">Centered difference vs JVP</text><text x="38.00" y="79.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5b7383" text-anchor="start">f(x) = x³       x = 1       seed = +1</text><rect x="37.00" y="103.00" width="508.00" height="277.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><rect x="562.00" y="103.00" width="203.00" height="277.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><text x="56.00" y="132.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#13868b" text-anchor="start" font-weight="700">Symmetric secant</text><text x="582.00" y="132.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#c98132" text-anchor="start" font-weight="700">Truncation error</text><line x1="80.00" y1="340.00" x2="480.00" y2="340.00" stroke="#d8e4eb" stroke-width="1" stroke-linecap