<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Central path and shrinking duality gap</title><desc id="desc">Minimize x plus two y over the nonnegative quadrant. Exact central points at t=1,2,4,8 have coordinates (1/t,1/(2t)); the gap is 2/t. A moving marker traces the central path and a synchronized bar shrinks. The still shows all four reference points.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#263f53;font-size:16px}.heading{font-size:20px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.panel{fill:white;stroke:#dce7ed;stroke-width:1.5}.axis{stroke:#7691a3;stroke-width:1.5}.motion{display:inline}.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style><rect width="640" height="360" rx="16" fill="#f4f8fb"/><text x="24" y="34" class="heading" text-anchor="start">CENTRAL PATH</text><rect class="panel" x="20" y="50" width="350" height="282" rx="12"/><rect class="panel" x="382" y="50" width="238" height="282" rx="12"/><rect x="72" y="77" width="270" height="211" fill="#eaf5f2"/><path class="axis" fill="none" d="M72 77V288H342"/><text x="52" y="84" class="" text-anchor="start">y</text><text x="341" y="310" class="" text-anchor="start">x</text><text x="82" y="310" class="small" text-anchor="start">0</text><text x="83" y="97" class="small" text-anchor="start">Feasible</text><path d="M72 288L312 168" stroke="#4268a7" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="312" cy="168" r="5" fill="white" stroke="#4268a7" stroke-width="2"/><text x="312" y="150" class="small" text-anchor="middle">t=1</text><circle cx="192" cy="228" r="5" fill="white" stroke="#4268a7" stroke-width="2"/><text x="201" y="195" class="small" text-anchor="start">t=2</text><circle cx="132" cy="258" r="5" fill="white" stroke="#4268a7" stroke-width="2"/><text x="145" y="228" class="small" text-anchor="start">t=4</text><circle cx="102" cy="273" r="5" fill="white" stroke="#4268a7" stroke-width="2"/><path d="M102 267L102 239" stroke="#4268a7" fill="none"/><text x="91" y="232" class="small" text-anchor="start">t=8</text><circle cx="72" cy="288" r="5" fill="#263f53"/><text x="28" y="349" class="strong" text-anchor="start">min x + 2y</text><text x="399" y="82" class="strong" text-anchor="start">Duality gap</text><text x="399" y="107" class="small" text-anchor="start">2/t</text><text x="399" y="139" class="small" text-anchor="start">t=1</text><rect x="399" y="145" width="176" height="12" rx="3" fill="#e4edf0"/><rect x="399" y="145" width="176" height="12" rx="3" fill="#4268a7"/><text x="600" y="156" class="small" text-anchor="end">2</text><text x="399" y="182" class="small" text-anchor="start">t=2</text><rect x="399" y="188" width="176" height="12" rx="3" fill="#e4edf0"/><rect x="399" y="188" width="88" height="12" rx="3" fill="#4268a7"/><text x="600" y="199" class="small" text-anchor="end">1</text><text x="399" y="225" class="small" text-anchor="start">t=4</text><rect x="399" y="231" width="176" height="12" rx="3" fill="#e4edf0"/><rect x="399" y="231" width="44" height="12" rx="3" fill="#4268a7"/><text x="600" y="242" class="small" text-anchor="end">0.5</text><text x="399" y="268" class="small" text-anchor="start">t=8</text><rect x="399" y="274" width="176" height="12" rx="3" fill="#e4edf0"/><rect x="399" y="274" width="22" height="12" rx="3" fill="#4268a7"/><text x="600" y="285" class="small" text-anchor="end">0.25</text><text x="399" y="298" class="small" text-anchor="start">Current</text><g class="motion"><circle cx="312" cy="168" r="9" fill="#087f82" stroke="white" stroke-width="2"><animate attributeName="cx" values="312;192;132;102;102;312" keyTimes="0;.25;.5;.75;.9999;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="168;228;258;273;273;168" keyTimes="0;.25;.5;.75;.9999;1" dur="12s" repeatCount="indefinite"/></circle><rect x="399" y="300" width="176" height="9" rx="3" fill="#e4edf0"/><rect x="399" y="300" width="176" height="9" rx="3" fill="#087f82"><animate attributeName="width" values="176;88;44;22;22;176" keyTimes="0;.25;.5;.75;.9999;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="fallback"><circle cx="102" cy="273" r="8" fill="none" stroke="#087f82" stroke-width="3"/><rect x="399" y="300" width="176" height="9" rx="3" fill="#e4edf0"/><rect x="399" y="300" width="22" height="9" rx="3" fill="#087f82"/></g></svg>
