<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FaceNet triplet margin on the unit circle</title><desc id="desc">Anchor and positive are fixed with squared distance 0.4. A negative moves along the circle. Its squared distance increases; the hinge is max(0.6 minus that distance, zero). The static view shows a semi-hard negative. Toy geometry, not a training trajectory.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="8" fill="#f1f6fa" stroke="none"/><rect x="18" y="48" width="292" height="280" rx="8" fill="#fff" stroke="#d6e1e8"/><rect x="322" y="48" width="300" height="280" rx="8" fill="#fff" stroke="#d6e1e8"/><text x="24" y="28" text-anchor="start" font-size="19" fill="#233b52">FaceNet · triplet margin</text><text x="34" y="72" text-anchor="start" font-size="16" fill="#233b52">Unit embeddings</text><text x="338" y="72" text-anchor="start" font-size="16" fill="#233b52">Triplet hinge</text><circle cx="162" cy="191" r="100" fill="none" stroke="#c1d0dc" stroke-width="2"/><line x1="62" y1="191" x2="262" y2="191" stroke="#b9c9d8" stroke-width="1" /><line x1="162" y1="91" x2="162" y2="291" stroke="#b9c9d8" stroke-width="1" /><line x1="262" y1="191" x2="242" y2="131" stroke="#21678d" stroke-width="2.5" /><circle cx="262" cy="191" r="6" fill="#21678d" stroke="none" stroke-width="2"/><circle cx="242" cy="131" r="6" fill="#21678d" stroke="none" stroke-width="2"/><text x="272" y="196" text-anchor="start" font-size="16" fill="#21678d">A</text><text x="222" y="141" text-anchor="end" font-size="16" fill="#21678d">P</text><text x="37" y="316" text-anchor="start" font-size="14" fill="#a95516">N = moving negative</text><rect x="346" y="93" width="104" height="182" rx="8" fill="#fbe