<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">PGD: repeated input-gradient updates projected to a bounded box</title><desc id="desc">A two-dimensional projected sign-gradient ascent path starting at (-0.85,-0.85). Steps of size 0.4 lead to the feasible right boundary, where a raw update exceeds epsilon and is projected. The analytic attack loss increases from approximately -2.93 to 1.90. Synthetic illustration, not a measured classifier.</desc><style>.hd{font:700 18px Arial,Helvetica,sans-serif;fill:#18354c}.sub{font:700 13px Arial,Helvetica,sans-serif;fill:#18354c}.txt{font:12px Arial,Helvetica,sans-serif;fill:#6c8192}.num{font:700 12px Arial,Helvetica,sans-serif;fill:#18354c}</style><rect width="640" height="360" fill="#f5f8fb"/><text x="24" y="34" class="hd">PGD · Repeat, then project</text><text x="616" y="32" text-anchor="end" class="txt">ANALYTIC EXAMPLE</text><rect x="24" y="52" width="309" height="294" rx="13" fill="white" stroke="#cddbe6"/><rect x="347" y="52" width="269" height="294" rx="13" fill="white" stroke="#cddbe6"/><text x="41" y="78" class="sub">Projected attack path</text><text x="41" y="97" class="txt">ℓ∞ feasible set</text><rect x="103" y="124" width="170" height="170" rx="4" fill="#e8f5f3" stroke="#058e89" stroke-width="1.6" stroke-dasharray="6 4"/><defs><clipPath id="set"><rect x="103" y="124" width="170" height="170"/></clipPath></defs><g clip-path="url(#set)" stroke="#dd8734" fill="none" opacity=".26"><ellipse cx="298.5" cy="162.25" rx="37" ry="27"/><ellipse cx="298.5" cy="162.25" rx="71" ry="47"/><ellipse cx="298.5" cy="162.25" rx="105" ry="77"/><ellipse cx="298.5" cy="162.25" rx="141" ry="108"/></g><path d="M115.75 281.25 L149.75 247.25 L183.75 213.25 L217.75 179.25 L251.75 145.25 L273.00 179.25 L273.00 145.25" fill="none" stroke="#cddbe6" stroke-width="2.2" stroke-dasharray="4 5"/><circle cx="115.75" cy="281.25" r="4" fill="#4a78af"/><text x="106" y="318" class="txt">−ε</text><text x="257" y="318" class="txt">+ε</text><text x="41" y="337" class="txt">α = 0.40 · ε = 1</text><circle cx="285.75" cy="179.25" r="5.5" fill="none" stroke="#be6685" stroke-width="2" stroke-dasharray="3 2"/><path d="M285.75 179.25 H273" stroke="#be6685" stroke-width="2" stroke-dasharray="3 3"/><text x="286" y="165" class="txt" text-anchor="middle">Π</text><text x="364" y="78" class="sub">Attack loss J</text><text x="364" y="99" class="txt">More inner steps, higher loss</text><path d="M391 143 V286 H588" fill="none" stroke="#cddbe6" stroke-width="1.6"/><line x1="391" y1="208" x2="587" y2="208" stroke="#e8eff5"/><text x="374" y="288" class="txt">−3</text><text x="380" y="153" class="txt">2</text><text x="393" y="307" class="txt">0</text><text x="575" y="307" class="txt">6</text><text x="466" y="331" class="txt">PGD step</text><path d="M391.00 284.14 L422.80 231.98 L454.60 194.04 L486.40 170.35 L518.20 160.92 L550.00 157.57 L581.80 157.57" fill="none" stroke="#dd8734" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M115.75 281.25 L149.75 247.25 L183.75 213.25 L217.75 179.25 L251.75 145.25 L273.00 179.25 L273.00 145.25" fill="none" stroke="#058e89" stroke-width="3" stroke-linejoin="round"/><circle cx="273.00" cy="145.25" r="7" fill="#058e89" stroke="white" stroke-width="2.5"/><circle cx="581.80" cy="157.57" r="6.5" fill="#dd8734" stroke="white" stroke-width="2"/></svg>
