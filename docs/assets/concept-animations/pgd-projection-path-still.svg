<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">PGD: repeated input-gradient updates projected to a bounded box</title><desc id="desc">A two-dimensional projected sign-gradient ascent path starting at (-0.85,-0.85). Steps of size 0.4 lead to the feasible right boundary, where a raw update exceeds epsilon and is projected. The analytic attack loss increases from approximately -2.93 to 1.90. Synthetic illustration, not a measured classifier.</desc><style>.hd{font:700 18px Arial,Helvetica,sans-serif;fill:#18354c}.sub{font:700 13px Arial,Helvetica,sans-serif;fill:#18354c}.txt{font:12px Arial,Helvetica,sans-serif;fill:#6c8192}.num{font:700 12px Arial,Helvetica,sans-serif;fill:#18354c}</style><rect width="640" height="360" fill="#f5f8fb" /><text x="24" y="34" class="hd">PGD · Repeat, then project</text><text x="616" y="32" text-anchor="end" class="txt">ANALYTIC EXAMPLE</text><rect x="24" y="52" width="309" height="294" rx="13" fill="white" stroke="#cddbe6" /><rect x="347" y="52" width="269" height="294" rx="13" fill="white" stroke="#cddbe6" /><text x="41" y="78" class="sub">Projected attack path</text><text x="41" y="97" class="txt">ℓ∞ feasible set</text><rect x="103" y="124" width="170" height="170" rx="4" fill="#e8f5f3" stroke="#058e89" stroke-width="1.6" stroke-dasharray="6 4" /><defs><clipPath id="set"><rect x="103" y="124" width="170" height="170" /></clipPath></defs><g clip-path="url(#set)" stroke="#dd8734" fill="none" opacity=".26"><ellipse cx="298.5" cy="162.25" rx="38.01315561749642" ry="28.074576010722193" /><ellipse cx="298.5" cy="162.25" rx="69.40220937885671" ry="51.256928578219814" /><ellipse cx="298.5" cy="162.25" rx="104.10331406828506" ry="76.88539286732973" /><ellipse cx="298.5" cy="162.25" rx="143.07631996012944" ry="105.66886528637038" /></g><path d="M115.75 281.25 L149.75 247.25 L183.75 213.25 L217.75 179.25 L251.75 145.25 L273.00 179.25 L273.00 145.25" fi