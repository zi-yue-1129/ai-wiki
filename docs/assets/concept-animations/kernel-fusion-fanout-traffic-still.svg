<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Fusion with fan-out</title><desc id="desc">The same expression has two outputs. Separate kernels transfer six elements, partially fused kernels transfer five because z remains needed, and full fusion transfers three. The count increases as each logical transfer is revealed.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b9c9dc"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="12" fill="#101b2d"/><text x="320" y="30" font-size="23" fill="#eef4ff" text-anchor="middle">Fusion across a shared intermediate</text><rect x="22" y="52" width="78" height="34" rx="5" fill="#192a40"/><text x="61" y="75" font-size="18" fill="#eef4ff" text-anchor="middle">x</text><rect x="145" y="52" width="98" height="34" rx="5" fill="#192a40"/><text x="194" y="75" font-size="18" fill="#eef4ff" text-anchor="middle">z = x+1</text><rect x="300" y="43" width="136" height="34" rx="5" fill="#192a40"/><text x="368" y="66" font-size="18" fill="#eef4ff" text-anchor="middle">y₁ = 2z</text><rect x="300" y="83" width="136" height="34" rx="5" fill="#192a40"/><text x="368" y="106" font-size="18" fill="#eef4ff" text-anchor="middle">y₂ = z²</text><path d="M104 69L140 69" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247 68L295 60" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247 71L295 99" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="529" y="64" font-size="18" fill="#b9c9dc" text-anchor="middle">x=2, z=3</text><text x="529" y="91" font-size="18" fill="#b9c9dc" text-anchor="middle">y₁=6, y₂=9</text><text x="22" y="139" font-size="17" fill="#b9c9dc" text-anchor="start">Logical transfers</text><text x="596" y="139" font-size="14" fill="#b9c9dc" text-anchor="middle">Count</text><text x="22" y="180" font-size="19" fill="#eef4ff" text-anchor="start">Separate</text><rect x="133" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="133" y="153" width="66" height="37" rx="5" fill="#417dae"/><text x="166" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R x</text><rect x="205" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="205" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="238" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">W z</text><rect x="277" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="277" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="310" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R z</text><rect x="349" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="349" y="153" width="66" height="37" rx="5" fill="#238b80"/><text x="382" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">W y₁</text><rect x="421" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="421" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="454" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R z</text><rect x="493" y="153" width="66" height="37" rx="5" fill="#192a40"/><rect x="493" y="153" width="66" height="37" rx="5" fill="#238b80"/><text x="526" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">W y₂</text><text x="596" y="180" font-size="21" fill="#eef4ff" text-anchor="middle">6</text><text x="22" y="235" font-size="19" fill="#eef4ff" text-anchor="start">Partial</text><rect x="133" y="208" width="66" height="37" rx="5" fill="#192a40"/><rect x="133" y="208" width="66" height="37" rx="5" fill="#417dae"/><text x="166" y="233" font-size="17" fill="#eef4ff" text-anchor="middle">R x</text><rect x="205" y="208" width="66" height="37" rx="5" fill="#192a40"/><rect x="205" y="208" width="66" height="37" rx="5" fill="#b67b36"/><text x="238" y="233" font-size="17" fill="#eef4ff" text-anchor="middle">W z</text><rect x="277" y="208" width="66" height="37" rx="5" fill="#192a40"/><rect x="277" y="208" width="66" height="37" rx="5" fill="#238b80"/><text x="310" y="233" font-size="17" fill="#eef4ff" text-anchor="middle">W y₁</text><rect x="349" y="208" width="66" height="37" rx="5" fill="#192a40"/><rect x="349" y="208" width="66" height="37" rx="5" fill="#b67b36"/><text x="382" y="233" font-size="17" fill="#eef4ff" text-anchor="middle">R z</text><rect x="421" y="208" width="66" height="37" rx="5" fill="#192a40"/><rect x="421" y="208" width="66" height="37" rx="5" fill="#238b80"/><text x="454" y="233" font-size="17" fill="#eef4ff" text-anchor="middle">W y₂</text><text x="596" y="235" font-size="21" fill="#eef4ff" text-anchor="middle">5</text><text x="22" y="290" font-size="19" fill="#eef4ff" text-anchor="start">Full</text><rect x="133" y="263" width="66" height="37" rx="5" fill="#192a40"/><rect x="133" y="263" width="66" height="37" rx="5" fill="#417dae"/><text x="166" y="288" font-size="17" fill="#eef4ff" text-anchor="middle">R x</text><rect x="205" y="263" width="66" height="37" rx="5" fill="#192a40"/><rect x="205" y="263" width="66" height="37" rx="5" fill="#238b80"/><text x="238" y="288" font-size="17" fill="#eef4ff" text-anchor="middle">W y₁</text><rect x="277" y="263" width="66" height="37" rx="5" fill="#192a40"/><rect x="277" y="263" width="66" height="37" rx="5" fill="#238b80"/><text x="310" y="288" font-size="17" fill="#eef4ff" text-anchor="middle">W y₂</text><text x="596" y="290" font-size="21" fill="#eef4ff" text-anchor="middle">3</text><rect x="23" y="322" width="13" height="13" rx="2" fill="#417dae"/><text x="42" y="334" font-size="16" fill="#b9c9dc" text-anchor="start">Read input</text><rect x="208" y="322" width="13" height="13" rx="2" fill="#b67b36"/><text x="227" y="334" font-size="16" fill="#b9c9dc" text-anchor="start">Materialize / reload z</text><rect x="467" y="322" width="13" height="13" rx="2" fill="#238b80"/><text x="486" y="334" font-size="16" fill="#b9c9dc" text-anchor="start">Write output</text><rect x="20" y="345" width="600" height="5" rx="2" fill="#506580"/><rect x="20" y="345" width="600" height="5" rx="2" fill="#238b80"/></svg>
