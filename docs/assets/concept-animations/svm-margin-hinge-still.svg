<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svgt svgdesc"><title id="svgt">SVM: margin violation and hinge loss</title><desc id="svgdesc">An illustrative positive sample moves across a fixed unit-margin boundary. A linked cursor follows the hinge-loss curve; the sample is not an optimiser trajectory.</desc><style>text{font-family:Inter,Arial,sans-serif;font-weight:600} .small{font-size:10px;letter-spacing:0.7px}</style><rect width="640" height="360" rx="16" fill="#f5f9fc"/><text x="22" y="35" fill="#203b50" font-size="14" font-weight="700">SVM · MARGIN VIOLATION</text><rect x="20" y="60" width="290" height="270" rx="13" fill="white" stroke="#d5e4ed"/><rect x="325" y="60" width="295" height="270" rx="13" fill="white" stroke="#d5e4ed"/><text x="40" y="86" fill="#627c8e" font-size="11" letter-spacing="1">DECISION SPACE</text><text x="345" y="86" fill="#627c8e" font-size="11" letter-spacing="1">HINGE LOSS</text><rect x="40" y="104" width="124" height="190" rx="4" fill="#eaf1fc"/><rect x="164" y="104" width="125" height="190" rx="4" fill="#e6f7f3"/><rect x="119" y="104" width="90" height="190" fill="#e8eff4" opacity=".58"/><path d="M164 102V294" stroke="#203b50" stroke-width="2.5"/><path d="M119 104V294M209 104V294" stroke="#e09d3a" stroke-width="1.6" stroke-dasharray="5 5"/><text x="165" y="309" fill="#203b50" font-size="11" text-anchor="middle">0</text><text x="119" y="309" fill="#627c8e" font-size="11" text-anchor="middle">−1</text><text x="209" y="309" fill="#627c8e" font-size="11" text-anchor="middle">+1</text><circle cx="64" cy="126" r="8" fill="#3778b9" stroke="white" stroke-width="2"/><circle cx="78" cy="169" r="8" fill="#3778b9" stroke="white" stroke-width="2"/><circle cx="100" cy="234" r="8" fill="#3778b9" stroke="white" stroke-width="2"/><circle cx="85" cy="277" r="8" fill="#3778b9" stroke="white" stroke-width="2"/><circle cx="242" cy="130" r="8" fill="#07998b" stroke="white" stroke-width="2"/><circle cx="269" cy="155" r="8" fill="#07998b" stroke="white" stroke-width="2"/><circle cx="247" cy="255" r="8" fill="#07998b" stroke="white" stroke-width="2"/><circle cx="275" cy="279" r="8" fill="#07998b" stroke="white" stroke-width="2"/><path d="M130 194H255" stroke="#e09d3a" stroke-width="1.5" stroke-dasharray="4 5" opacity=".55"/><circle cx="164" cy="194" r="11" fill="#e09d3a" stroke="white" stroke-width="3"></circle><text x="245" y="216" fill="#e09d3a" font-size="11" text-anchor="middle">+ sample</text><path d="M378 290V108M378 290H598" stroke="#627c8e" stroke-width="1.6"/><path d="M390 168L520 284L590 284" fill="none" stroke="#d96554" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M520 284V112" stroke="#e09d3a" stroke-dasharray="4 6" opacity=".45"/><text x="391" y="304" fill="#627c8e" font-size="10" text-anchor="middle">−1</text><text x="455" y="304" fill="#627c8e" font-size="10" text-anchor="middle">0</text><text x="520" y="304" fill="#627c8e" font-size="10" text-anchor="middle">1</text><text x="587" y="304" fill="#627c8e" font-size="10" text-anchor="middle">2</text><text x="600" y="318" fill="#203b50" font-size="11" text-anchor="end">yf(x)</text><text x="356" y="117" fill="#627c8e" font-size="10" >loss</text><text x="345" y="347" fill="#203b50" font-size="13" >L = max(0, 1 − yf(x))</text><circle cx="455" cy="226" r="8" fill="#e09d3a" stroke="white" stroke-width="3"></circle><text x="40" y="346" fill="#627c8e" font-size="11" >Boundary fixed · one point changes</text></svg>