<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>Convolution sliding window input reuse</title><desc>Three windows produce eight, twelve and sixteen. Reloading reads nine inputs; retaining the overlapping values reads five.</desc><g font-family="system-ui,Arial,sans-serif"><rect x="0" y="0" width="640" height="360" rx="8" fill="#0B1426" stroke="#0B1426"/><rect x="8" y="8" width="624" height="344" rx="8" fill="#101E34" stroke="#304361"/><text x="320" y="39" font-size="26" fill="#E9F1FC" text-anchor="middle">SLIDING WINDOW REUSE</text><text x="25" y="83" font-size="23" fill="#ACBDD2" text-anchor="start">Input</text><text x="25" y="208" font-size="23" fill="#ACBDD2" text-anchor="start">Output</text><path d="M24 257 L616 257" stroke="#304361" stroke-width="3" fill="none"/><text x="25" y="294" font-size="23" fill="#ACBDD2" text-anchor="start">Input reads</text><text x="25" y="330" font-size="22" fill="#FFBD6A" text-anchor="start">Reload</text><text x="335" y="330" font-size="22" fill="#45DDC4" text-anchor="start">Reuse</text><g id="state-0" opacity="1"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">Kernel [1, 2, 1]</text><rect x="100" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="139" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">1</text><rect x="198" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="237" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">2</text><rect x="296" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="335" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">3</text><rect x="394" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="433" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">4</text><rect x="492" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="531" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">5</text><rect x="180" y="208" width="78" height="40" rx="8" fill="#0B1426" stroke="#304361"/><text x="219" y="237" font-size="25" fill="#E9F1FC" text-anchor="middle">—</text><rect x="278" y="208" width="78" height="40" rx="8" fill="#0B1426" stroke="#304361"/><text x="317" y="237" font-size="25" fill="#E9F1FC" text-anchor="middle">—</text><rect x="376" y="208" width="78" height="40" rx="8" fill="#0B1426" stroke="#304361"/><text x="415" y="237" font-size="25" fill="#E9F1FC" text-anchor="middle">—</text><rect x="135" y="310" width="180" height="22" rx="8" fill="#0B1426" stroke="#304361"/><rect x="425" y="310" width="180" height="22" rx="8" fill="#0B1426" stroke="#304361"/><text x="225" y="302" font-size="24" fill="#FFBD6A" text-anchor="middle">0</text><text x="515" y="302" font-size="24" fill="#45DDC4" text-anchor="middle">0</text><animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g id="state-1" opacity="0"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">1 + 2 × 2 + 3 = 8</text><rect x="100" y="99" width="78" height="63" rx="8" fill="#624A2F" stroke="#FFBD6A"/><text x="139" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">1</text><rect x="198" y="99" width="78" height="63" rx="8" fill="#624A2F" stroke="#FFBD6A"/><text x="237" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">2</text><rect x="296" y="99" width="78" height="63" rx="8" fill="#624A2F" stroke="#FFBD6A"/><text x="335" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">3</text><rect x="394" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="433" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">4</text><rect x="492" y="99" width="78" height="63" rx="8" fill="#0B1426" stroke="#304361"/><text x="531" y="140" font-size="29" fill="#E9F1FC" text-anchor="middle">5</text><rect x="96" y="94" width="282" height