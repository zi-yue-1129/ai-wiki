<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">FedAvg local training and weighted aggregation</title><desc id="desc">Three clients start with the same global model, diverge through local SGD, and send models for a data-size-weighted average: minus 1, plus 0.5 and plus 2 with sizes 2, 3 and 5 combine to 0.95.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf5fa"/></linearGradient><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7" fill="none" stroke="#409a9f" stroke-width="1.4"/></marker></defs><style>text{font-family:Inter,Arial,system-ui,sans-serif;fill:#274355}.head{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#668195}.name{font-size:17px;font-weight:750}.key{font-size:13px;fill:#678297}.value{font-size:18px;font-weight:750}.panel{fill:#fff;stroke:#cddfe8;stroke-width:1.6}.track{stroke:#cfdfeb;stroke-width:4;stroke-linecap:round}.teal{fill:#148d91}.final{opacity:0}@media(prefers-reduced-motion:reduce){.initial,.motion{display:none!important}.final{opacity:1!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="30" y="37" class="head">FEDAVG · ONE COMMUNICATION ROUND</text><text x="30" y="57" class="key">Broadcast → local SGD → weighted aggregation</text><rect class="panel" x="231" y="68" width="178" height="71" rx="15"/><text class="head" x="320" y="91" text-anchor="middle">GLOBAL MODEL</text><text class="value" x="320" y="120" text-anchor="middle" fill="#148d91">θ = 0.95</text><path d="M320 140 Q116 151 116 178" stroke="#bfd2dc" stroke-width="2.5" fill="none" stroke-dasharray="5 7"/><rect class="panel" x="32" y="181" width="168" height="129" rx="15"/><text class="name" x="48" y="207">CLIENT A</text><text class="key" x="48" y="229">n = 2 samples</text><path class="track" d="M52 263H180"/><path d="M116 253V273" stroke="#d0dfe7" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="73" cy="263" r="9" fill="#ad7a50"/><text class="value" x="116" y="296" text-anchor="middle">w = −1.0</text><path d="M116 180Q116 153 320 140" stroke="#ad7a50" stroke-width="3" opacity=".7" fill="none"/><path d="M320 140 Q320 151 320 178" stroke="#bfd2dc" stroke-width="2.5" fill="none" stroke-dasharray="5 7"/><rect class="panel" x="236" y="181" width="168" height="129" rx="15"/><text class="name" x="252" y="207">CLIENT B</text><text class="key" x="252" y="229">n = 3 samples</text><path class="track" d="M256 263H384"/><path d="M320 253V273" stroke="#d0dfe7" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="340" cy="263" r="9" fill="#3a8ca8"/><text class="value" x="320" y="296" text-anchor="middle">w = +0.5</text><path d="M320 180Q320 153 320 140" stroke="#3a8ca8" stroke-width="3" opacity=".7" fill="none"/><path d="M320 140 Q524 151 524 178" stroke="#bfd2dc" stroke-width="2.5" fill="none" stroke-dasharray="5 7"/><rect class="panel" x="440" y="181" width="168" height="129" rx="15"/><text class="name" x="456" y="207">CLIENT C</text><text class="key" x="456" y="229">n = 5 samples</text><path class="track" d="M460 263H588"/><path d="M524 253V273" stroke="#d0dfe7" stroke-width="1.5" stroke-dasharray="2 4"/><circle cx="568" cy="263" r="9" fill="#148d91"/><text class="value" x="524" y="296" text-anchor="middle">w = +2.0</text><path d="M524 180Q524 153 320 140" stroke="#148d91" stroke-width="3" opacity=".7" fill="none"/><text x="320" y="337" text-anchor="middle" class="key">SERVER WEIGHTS BY DATA SIZE: 2 : 3 : 5</text></svg>
