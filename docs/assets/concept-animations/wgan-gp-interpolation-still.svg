<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">WGAN-GP interpolation gradient penalty</title><desc id="d">An interpolated point moves between a fake and real sample; a schematic one-dimensional critic has a gradient norm that crosses one and a squared gradient penalty that vanishes at one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#008f86"/></marker></defs><rect x="1" y="1" width="638" height="358" rx="16" fill="#f5f9fc" stroke="#d8e3eb"/><text x="26" y="43" fill="#17344c" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">WGAN-GP</text><text x="150" y="42" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start">Interpolation penalty</text><rect x="19" y="66" width="356" height="263" rx="10" fill="#fff" stroke="#d8e3eb"/><rect x="388" y="66" width="234" height="263" rx="10" fill="#fff" stroke="#d8e3eb"/><text x="37" y="91" fill="#17344c" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Interpolated samples</text><line x1="94" y1="189" x2="330" y2="189" stroke="#d8e3eb" stroke-width="7"  stroke-linecap="round"/><line x1="94" y1="189" x2="330" y2="189" stroke="#3e6da8" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/><circle cx="94" cy="189" r="10" fill="#df8a23" stroke="#fff" stroke-width="2"/><circle cx="330" cy="189" r="10" fill="#008f86" stroke="#fff" stroke-width="2"/><text x="94" y="219" fill="#df8a23" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAKE</text><text x="330" y="219" fill="#008f86" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle">REAL</text><text x="212" y="138" fill="#17344c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="middle">x̂ = (1−ε)·fake + ε·real</text><text x="34" y="273" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="start">Gradient direction</text><line x1="95" y1="292" x2="342" y2="292" stroke="#d8e3eb" stroke-width="1.5"  stroke-linecap="round"/><line x1="212" y1="164" x2="239" y2="164" stroke="#008f86" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round"></line><circle cx="212" cy="189" r="9" fill="#3e6da8" stroke="#fff" stroke-width="2"></circle><text x="405" y="91" fill="#17344c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Gradient norm</text><text x="412" y="111" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" text-anchor="start">1.4</text><text x="412" y="163" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" text-anchor="start">1.0</text><text x="412" y="217" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" text-anchor="start">0.6</text><line x1="438" y1="113" x2="438" y2="216" stroke="#d8e3eb" stroke-width="1.5"  stroke-linecap="round"/><line x1="438" y1="164" x2="599" y2="164" stroke="#008f86" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><line x1="438" y1="207" x2="599" y2="120" stroke="#3e6da8" stroke-width="3"  stroke-linecap="round"/><circle cx="519" cy="164" r="6" fill="#df8a23" stroke="#fff" stroke-width="2"></circle><text x="405" y="239" fill="#17344c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Penalty</text><text x="597" y="239" fill="#60778b" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="end">λ = 10</text><path d="M438.0 249.0 L442.0 255.0 L446.1 261.0 L450.1 266.0 L454.1 272.0 L458.1 277.0 L462.1 281.0 L466.2 285.0 L470.2 289.0 L474.2 293.0 L478.3 296.0 L482.3 299.0 L48