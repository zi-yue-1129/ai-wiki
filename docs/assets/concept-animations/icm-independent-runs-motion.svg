<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 294" role="img" aria-labelledby="title description">
<title id="title">Independent Monte Carlo sample means, drawn step by step</title>
<desc id="description">Two seeded sequences of twenty independent illustrative draws from the same three-outcome distribution trace different running means. Both use expectation 3.017; their final means are 2.786 and 3.002. Fixed distribution, no model learning or training. Reduced-motion users see both completed traces.</desc>
