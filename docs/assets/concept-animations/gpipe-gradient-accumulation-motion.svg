bd7df"/><text x="511" y="93" class="tiny">11</text><path d="M530 80V99" stroke="#cbd7df"/><text x="549" y="93" class="tiny">12</text><path d="M568 80V99" stroke="#cbd7df"/><text x="587" y="93" class="tiny">STEP</text><path d="M112 75V306" stroke="#d48632" stroke-width="2.4"><animateTransform attributeName="transform" type="translate" values="0 0;494 0" dur="14s" repeatCount="indefinite"/></path><text x="24" y="126" class="sub">GRADIENTS</text><text x="24" y="164" class="row">GPU 1</text><rect x="110" y="136" width="369" height="46" rx="10" fill="#e8eef3" stroke="#d4e0e8"/><text x="494" y="163" class="sub">Σg</text><circle cx="150" cy="159" r="16" fill="#d7e1e8"/><text x="150" y="163" class="tiny" fill="#526b7d">B4</text><g opacity="0"><circle cx="150" cy="159" r="16" fill="#138a81"/><text x="150" y="163" class="tiny" style="fill:#fff">B4</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64286;0.65857;1" dur="14s" repeatCount="indefinite"/></g><circle cx="239" cy="159" r="16" fill="#d7e1e8"/><text x="239" y="163" class="tiny" fill="#526b7d">B3</text><g opacity="0"><circle cx="239" cy="159" r="16" fill="#138a81"/><text x="239" y="163" class="tiny" style="fill:#fff">B3</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.71429;0.73000;1" dur="14s" repeatCount="indefinite"/></g><circle cx="328" cy="159" r="16" fill="#d7e1e8"/><text x="328" y="163" class="tiny" fill="#526b7d">B2</text><g opacity="0"><circle cx="328" cy="159" r="16" fill="#138a81"/><text x="328" y="163" class="tiny" style="fill:#fff">B2</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78571;0.80143;1" dur="14s" repeatCount="indefinite"/></g><circle cx="417" cy="159" r="16" fill="#d7e1e8"/><text x="417" y="163" class="tiny" fill="#526b7d">B1</text><g opacity="0"><circle cx="417" cy="159" r="16" fill="#138a81"/><text x="417" y="163" class="tiny" style="fill:#fff">B1</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85714;0.87286;1