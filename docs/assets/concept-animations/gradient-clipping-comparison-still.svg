<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Global norm clipping versus per-coordinate clipping</title><desc id="desc">The same synthetic gradient grows along a fixed direction. The teal norm-clipped vector stays on a radius-two circle without rotating; the orange coordinate-clipped vector changes direction after hitting per-coordinate caps of 1.5. The right panel shows the x and y components for both rules. Not a measured training trajectory.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" /><text x="32" y="43" fill="#1b354d" font-size="23" font-weight="750" >GRADIENT CLIPPING</text><text x="32" y="66" fill="#647c90" font-size="13" font-weight="500" >Global L₂ norm vs independent coordinate caps</text><rect x="22" y="82" width="380" height="306" rx="15" fill="#ffffff" stroke="#dbe7ef"/><rect x="416" y="82" width="362" height="306" rx="15" fill="#ffffff" stroke="#dbe7ef"/><text x="43" y="115" fill="#1b354d" font-size="14" font-weight="700" >VECTOR GEOMETRY</text><text x="437" y="115" fill="#1b354d" font-size="14" font-weight="700" >COMPONENT RESPONSE</text><defs><marker id="arrGray" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#8298a7"/></marker><marker id="arrTeal" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#078c84"/></marker><marker id="arrOrange" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#d57637"/></marker></defs><line x1="43" y1="203" x2="371" y2="203" stroke="#ecf2f6" stroke-width="1" stroke-linecap="round" /><line x1="201" y1="145" x2="201" y2="261" stroke="#ecf2f6" stroke-width="1" stroke-linecap="round" /><line x1="43" y1="153" x2="371" y2="153" stroke="#ecf2f6" stroke-width="1" stroke-linecap="round" /><line x1="251" y1="145" x2="251" y2="261" stroke="#ecf2f6" stroke-width="1" stroke-linecap="round" /><line x1="43" y1="253" x2="373" y2="253" stroke="#8298a7" stroke-width="1.5" stroke-linecap="round" /><line x1="151" y1="261" x2="151" y2="142" stroke="#8298a7" stroke-width="1.5" stroke-linecap="round" /><circle cx="151" cy="253" r="100" fill="none" stroke="#078c84" stroke-width="1.7" stroke-dasharray="6 6" opacity=".65"/><text x="136" y="272" fill="#647c90" font-size="11" font-weight="500" >0</text><text x="363" y="272" fill="#647c90" font-size="13" font-weight="500" >x</text><text x="160" y="140" fill="#647c90" font-size="13" font-weight="500" >y</text><text x="229" y="148" fill="#078c84" font-size="12" font-weight="600" >τ = 2</text><line x1="151" y1="253" stroke="#8298a7" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#arrGray)" x2="351.00" y2="153.00"/><line x1="151" y1="253" stroke="#d57637" stroke-width="4" stroke-linecap="round"  marker-end="url(#arrOrange)" x2="226.00" y2="178.00"/><line x1="151" y1="253" stroke="#078c84" stroke-width="4" stroke-linecap="round"  marker-end="url(#arrTeal)" x2="240.44" y2="208.28"/><line x1="56" y1="373" x2="77" y2="373" stroke="#8298a7" stroke-width="4" stroke-linecap="round" /><text x="85" y="377" fill="#647c90" font-size="12" font-weight="600" >Raw</text><line x1="150" y1="373" x2="171" y2="373" stroke="#078c84" stroke-width="4" stroke-linecap="round" /><text x="179" y="377" fill="#647c90" font-size="12" font-weight="600" >Norm</text><line x1="258" y1="373" x2="279" y2="373" stroke="#d57637" stroke-width="4" stroke-linecap="round" /><text x="287" y="377" fill="#647c90" font-size="12" font-weight="600" >Value</text><text x="438" y="146" fill="#1b354d" font-size="15" font-weight="700" >L₂ norm cap</text><text x="442" y="186" fill="#647c90" font-size="12" font-weight="700" >x</text><rect x="482" y="173" width="221" height="15" rx="7" fill="#edf3f7" /><rect x="482" y="173" width="98.83" height="15" rx="7" fill="#078c84" /><text x="442" y="220" fill="#647c90" font-size="12" font-weight="700" >y</text><rect x="482" y="207" width="221" height="15" rx="7" fill="#edf3f7" /><rect x="482" y="207" width="49.42" height="15" rx="7" fill="#078c84" /><text x="438" y="265" fill="#1b354d" font-size="15" font-weight="700" >Coordinate cap</text><text x="442" y="305" fill="#647c90" font-size="12" font-weight="700" >x</text><rect x="482" y="292" width="221" height="15" rx="7" fill="#edf3f7" /><rect x="482" y="292" width="82.88" height="15" rx="7" fill="#d57637" /><text x="442" y="339" fill="#647c90" font-size="12" font-weight="700" >y</text><rect x="482" y="326" width="221" height="15" rx="7" fill="#edf3f7" /><rect x="482" y="326" width="82.88" height="15" rx="7" fill="#d57637" /><text x="482" y="350" fill="#647c90" font-size="11" font-weight="500" >0</text><text x="592.5" y="350" fill="#647c90" font-size="11" font-weight="500" text-anchor="middle">2</text><text x="703" y="350" fill="#647c90" font-size="11" font-weight="500" text-anchor="end">4</text><text x="438" y="375" fill="#647c90" font-size="11.5" font-weight="500" >Input: g(s) = s(4, 2),   0.35 ≤ s ≤ 1</text></svg>