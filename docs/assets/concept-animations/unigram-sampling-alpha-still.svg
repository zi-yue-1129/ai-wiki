<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Unigram sampling concentration</title><desc id="desc">Seven possible segmentations of abab are normalized after raising each segmentation probability to alpha. Animated probability bars shift from flatter to more concentrated as alpha increases, then return.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f6f9fc" stroke="none" /><text x="24" y="35" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >Subword regularisation</text><text x="24" y="56" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" >abab · same pieces, different paths</text><rect x="470" y="21" width="146" height="28" rx="9" fill="#e9eefb" stroke="none" /><text x="485" y="40" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >low α  ⇄  high α</text><rect x="20" y="76" width="600" height="224" rx="15" fill="#fff" stroke="#d5e1eb" /><text x="44" y="100" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >Segmentation</text><text x="360" y="100" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >Sampling probability</text><rect x="36" y="109" width="192" height="29" rx="8" fill="#e1f4f0" stroke="none" /><text x="52" y="128" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >ab | ab</text><rect x="352" y="111" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="113" width="140.79" height="16" rx="4" fill="#008f88"></rect><rect x="36" y="152" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="171" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >abab</text><rect x="352" y="154" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="156" width="44" height="16" rx="4" fill="#df8952"></rect><rect x="36" y="195" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="214" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >a | bab</text><rect x="352" y="197" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="199" width="7.04" height="16" rx="4" fill="#6276b6"></rect><rect x="36" y="238" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="257" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >other 4</text><rect x="352" y="240" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="242" width="14.17" height="16" rx="4" fill="#b6c5d3"></rect><text x="354" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" >0</text><text x="456" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="middle">50%</text><text x="563" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="end">100%</text><path d="M 88 326 H 550" stroke="#d5e1eb" stroke-width="7" stroke-linecap="round"/><path d="M 88 326 H 550" stroke="#6276b6" stroke-width="2.2" stroke-linecap="round"/><text x="30" y="329" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >α .3</text><text x="556" y="329" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >3.0</text><circle cx="319" cy="326" r="10" fill="#6276b6" stroke="#fff" stroke-width="3"></circle><text x="320" y="354" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="middle">7 valid segmentations · illustrative, not measured</text></svg>
