<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Buffer lifetime reuse</title><desc id="desc">Four consecutive pure operations produce a, b, c, d. At each operation the input and output coexist; a and c reuse slot A, b and d reuse slot B. Input x is external. No in-place aliasing.</desc><rect width="640" height="360" rx="12" fill="#101b2d"/><text x="320" y="35" font-size="28" fill="#eef4ff" text-anchor="middle">Buffer lifetime reuse</text><text x="320" y="65" font-size="20" fill="#aebed1" text-anchor="middle">Live during operation</text><rect x="10" y="126" width="620" height="66" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="20" y="167" font-size="25" fill="#eef4ff" text-anchor="start">Slot A</text><rect x="10" y="204" width="620" height="66" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="20" y="245" font-size="25" fill="#eef4ff" text-anchor="start">Slot B</text><g id="column-0" opacity="1"><animate attributeName="opacity" calcMode="discrete" values="1;1;1;1;1;1" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/><text x="208" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">a=f(x)</text><rect x="186" y="137" width="44" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="208" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><text x="208" y="244" font-size="23" fill="#aebed1" text-anchor="middle">—</text></g><g id="column-1" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;1;1;1;1;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/><text x="328" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">b=g(a)</text><rect x="306" y="137" width="44" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="328" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="306" y="215" width="44" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="328" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">b</text></g><g id="column-2" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;1;1;1;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/><text x="448" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">c=h(b)</text><rect x="426" y="137" width="44" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="448" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">c</text><rect x="426" y="215" width="44" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="448" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">b</text></g><g id="column-3" opacity="0.2"><animate attributeName="opacity" calcMode="discrete" values="0.2;0.2;0.2;1;1;0.2" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/><text x="568" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">d=k(c)</text><rect x="546" y="137" width="44" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="568" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">c</text><rect x="546" y="215" width="44" height="43" rx="7" fill="#315e91" stroke="none" stroke-width="1"/><text x="568" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">d</text></g><rect id="cursor" x="150" y="79" width="116" height="193" rx="9" fill="none" stroke="#f2b65d" stroke-width="3"><animate attributeName="x" calcMode="discrete" values="150;270;390;510;510;150" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/></rect><rect x="148" y="283" width="480" height="6" rx="3" fill="#33455d"/><rect x="148" y="283" width="0" height="6" rx="3" fill="#f2b65d"><animate attributeName="width" calcMode="linear" values="0;120;240;360;480;480" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="10s" repeatCount="indefinite"/></rect><rect x="12" y="306" width="300" height="41" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><rect x="328" y="306" width="300" height="41" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="162" y="333" font-size="24" fill="#eef4ff" text-anchor="middle">4 logical values</text><text x="478" y="333" font-size="24" fill="#eef4ff" text-anchor="middle">2 physical slots</text></svg>