<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" tabindex="0" aria-labelledby="title desc">
<title id="title">MoCo FIFO queue-timing counterfactual</title><desc id="desc">Correct old queue A to F gives positive probability 0.813. Incorrect early queue B to G contains positive G as a false negative, reducing probability to 0.451. Toy values at temperature 0.20. Focus or hover to pause animation.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#21394d}
.title{font-size:22px;font-weight:700;letter-spacing:.2px}
.label{font-size:18px;font-weight:600}
.token{font-size:20px;font-weight:700}
.small{font-size:16px;fill:#526879}
.num{font-family:monospace;font-size:18px;font-weight:700}

@keyframes arrive{0%,16%{opacity:0;transform:translate(74px,-33px)}36%,82%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(74px,-33px)}}
@keyframes reveal{0%,33%{opacity:0}47%,82%{opacity:1}100%{opacity:0}}
@keyframes halo{0%,32%,100%{opacity:0}42%,67%{opacity:1}82%{opacity:0}}
.arrive{animation:arrive 5s ease-in-out infinite}
.reveal{animation:reveal 5s ease-in-out infinite}
.halo{animation:halo 5s ease-in-out infinite}
svg:hover .arrive,svg:focus .arrive,svg:hover .reveal,svg:focus .reveal,svg:hover .halo,svg:focus .halo{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.arrive,.reveal,.halo{animation:none!important;opacity:1!important;transform:none!important}}

</style>
<rect x="1" y="1" width="638" height="242" rx="12" fill="#f8fbfd" stroke="#b9cbd6"/>
<text x="19" y="33" class="title" >MoCo / queue timing</text><text x="619" y="32" class="small" text-anchor="end">τ = 0.20 · TOY</text><text x="19" y="84" class="label" >Correct</text><rect x="148" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="172.5" y="82" class="token" text-anchor="middle">A</text><rect x="208" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="232.5" y="82" class="token" text-anchor="middle">B</text><rect x="268" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="292.5" y="82" class="token" text-anchor="middle">C</text><rect x="328" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="352.5" y="82" class="token" text-anchor="middle">D</text><rect x="388" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="412.5" y="82" class="token" text-anchor="middle">E</text><rect x="448" y="57" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="472.5" y="82" class="token" text-anchor="middle">F</text><rect x="148" y="99" width="360" height="11" rx="5" fill="#eed4cd"/><rect x="148" y="99" width="292.7" height="11" rx="5" fill="#168574"/><text x="520" y="110" class="num" >P+ 0.813</text><text x="19" y="154" class="label" >Too early</text><rect x="148" y="127" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="172.5" y="152" class="token" text-anchor="middle">B</text><rect x="208" y="127" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="232.5" y="152" class="token" text-anchor="middle">C</text><rect x="268" y="127" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="292.5" y="152" class="token" text-anchor="middle">D</text><rect x="328" y="127" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="352.5" y="152" class="token" text-anchor="middle">E</text><rect x="388" y="127" width="49" height="36" rx="7" fill="#e8f1f5" stroke="#a8bfcc" stroke-width="1"/><text x="412.5" y="152" class="token" text-anchor="middle">F</text><g class="arrive"><rect x="448" y="127" width="49" height="36" rx="7" fill="#ffdfd5" stroke="#b8503b" stroke-width="2"/><text x="472.5" y="152" class="token" text-anchor="middle">G</text></g><rect class="halo" x="444" y="123" width="57" height="44" rx="10" fill="none" stroke="#dc6445" stroke-width="3"/><rect x="148" y="169" width="360" height="11" rx="5" fill="#eed4cd"/><g class="reveal"><rect x="148" y="169" width="162.4" height="11" rx="5" fill="#168574"/><text x="520" y="180" class="num" >P+ 0.451</text></g><path d="M148 195 H620" stroke="#dbe6ed" stroke-width="1"/><text x="19" y="221" class="small" >G = positive key</text><text x="276" y="221" class="small" >Early G = false negative</text></svg>