<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Eigenvectors fix directions under a symmetric linear map</title><desc id="desc">The orange unit input vector rotates along a circle while the teal A x endpoint sweeps an ellipse. Eigenvector directions are fixed; the axes have eigenvalues three and one.</desc><defs><marker id="tip-t" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#0a8f91"/></marker><marker id="tip-o" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#e1844f"/></marker></defs><rect width="800" height="420" rx="18" fill="#f7fafc"/><text x="34" y="43" font-family="system-ui,Arial,sans-serif" font-size="21" fill="#17304a" font-weight="750" >EIGEN-DIRECTIONS</text><text x="34" y="63" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="500" >A = Q diag(3, 1) Qᵀ</text><rect x="34" y="84" width="344" height="288" rx="17" fill="#fff" stroke="#dae3ed" stroke-width="1.5"/><rect x="422" y="84" width="344" height="288" rx="17" fill="#fff" stroke="#dae3ed" stroke-width="1.5"/><text x="62" y="119" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#e1844f" font-weight="750" >INPUT • x</text><text x="450" y="119" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#0a8f91" font-weight="750" >OUTPUT • Ax</text><line x1="61.00" y1="231.00" x2="351.00" y2="231.00" stroke="#e6edf4" stroke-width="1.3" /><line x1="206.00" y1="118.00" x2="206.00" y2="344.00" stroke="#e6edf4" stroke-width="1.3" /><circle cx="206" cy="231" r="3.4" fill="#17304a"/><line x1="91.32" y1="311.30" x2="320.68" y2="150.70" stroke="#6683d6" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="286.30" y1="345.68" x2="125.70" y2="116.32" stroke="#a1b1c4" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="441.00" y1="231.00" x2="731.00" y2="231.00" stroke="#e6edf4" stroke-width="1.3" /><line x1="586.00" y1="118.00" x2="586.00" y2="344.00" stroke="#e6edf4" stroke-width="1.3" /><circle cx="586" cy="231" r="3.4" fill="#17304a"/><line x1="471.32" y1="311.30" x2="700.68" y2="150.70" stroke="#6683d6" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="666.30" y1="345.68" x2="505.70" y2="116.32" stroke="#a1b1c4" stroke-width="1.6" stroke-dasharray="5 5"/><circle cx="206" cy="231" r="69" fill="none" stroke="#d2dce7" stroke-width="2"/><ellipse cx="586" cy="231" rx="153" ry="51" transform="rotate(-35 586 231)" fill="#e5f5f4" stroke="#9dd0ce" stroke-width="2.8"/><line x1="206" y1="231" x2="215.60" y2="162.67" stroke="#e1844f" stroke-width="4.6" stroke-linecap="round" marker-end="url(#tip-o)"></line><circle cx="215.60" cy="162.67" r="5.8" fill="#e1844f" stroke="#fff" stroke-width="2"></circle><line x1="586" y1="231" x2="650.08" y2="140.60" stroke="#0a8f91" stroke-width="4.6" stroke-linecap="round" marker-end="url(#tip-t)"></line><circle cx="650.08" cy="140.60" r="5.8" fill="#0a8f91" stroke="#fff" stroke-width="2"></circle><text x="63" y="345" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="500" >Unit circle</text><text x="451" y="345" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="500" >Mapped ellipse</text><text x="296" y="166" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#6683d6" font-weight="700" >λ₁ = 3</text><text x="293" y="292" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#61788e" font-weight="700" >λ₂ = 1</text><rect x="32" y="392" width="736" height="2" rx="1" fill="#dae3ed"/><text x="34" y="409" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#61788e" font-weight="600" >SYNTHETIC • FIXED MATRIX • CONTINUOUS ANGLE SWEEP</text></svg>