<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">LARS weight and gradient norms determine layerwise scaling</title><desc id="desc">Two layers with weight norms 2 and 6 and gradient norms 8 and 3 gradually reveal their trust ratios 0.025 and 0.2 and step norms 0.2 and 0.6. Toy values use trust coefficient 0.1, unit global learning rate, zero decay and zero momentum.</desc><style>text{font-family:Inter,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.still{display:inline}.motion{display:none}}</style><rect x="0" y="0" width="640" height="360" rx="0" fill="#f5f8fc" stroke="none"/><rect x="19" y="16" width="6" height="22" rx="3" fill="#069b91" stroke="none"/><text x="37" y="34" font-size="17" fill="#15324a" font-weight="800" text-anchor="start">LARS  /  LAYERWISE TRUST RATIO</text><text x="611" y="33" font-size="11" fill="#657e91" font-weight="650" text-anchor="end">WEIGHT → GRADIENT → STEP</text><line x1="26" y1="47" x2="614" y2="47" stroke="#dbe6ef" stroke-width="1.2" /><text x="168" y="74" font-size="10" fill="#657e91" font-weight="700" text-anchor="start">WEIGHT NORM</text><text x="294" y="74" font-size="10" fill="#657e91" font-weight="700" text-anchor="start">GRAD NORM</text><text x="410" y="74" font-size="10" fill="#657e91" font-weight="700" text-anchor="start">TRUST ρ</text><text x="516" y="74" font-size="10" fill="#657e91" font-weight="700" text-anchor="start">STEP NORM</text><rect x="28" y="88" width="584" height="88" rx="12" fill="#fff" stroke="#dce7ef"/><rect x="29" y="89" width="6" height="86" rx="3" fill="#4d8ac9" stroke="none"/><text x="49" y="117" font-size="15" fill="#15324a" font-weight="750" text-anchor="start">Layer A</text><text x="49" y="138" font-size="11" fill="#657e91" font-weight="500" text-anchor="start">small weights</text><rect x="168" y="118" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="168" y="118" width="28" height="14" rx="5" fill="#4d8ac9"></rect><text x="168" y="156" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||w|| = 2</text><rect x="294" y="118" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="294" y="118" width="80" height="14" rx="5" fill="#e5a344"></rect><text x="294" y="156" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||g|| = 8</text><rect x="410" y="111" width="78" height="33" rx="8" fill="#e9f8f6" stroke="none"/><g ><text x="449" y="133" font-size="15" fill="#069b91" font-weight="750" text-anchor="middle">0.025</text></g><rect x="516" y="118" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="516" y="118" width="23" height="14" rx="5" fill="#069b91"></rect><text x="516" y="156" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||Δw|| = 0.2</text><rect x="28" y="184" width="584" height="88" rx="12" fill="#fff" stroke="#dce7ef"/><rect x="29" y="185" width="6" height="86" rx="3" fill="#069b91" stroke="none"/><text x="49" y="213" font-size="15" fill="#15324a" font-weight="750" text-anchor="start">Layer B</text><text x="49" y="234" font-size="11" fill="#657e91" font-weight="500" text-anchor="start">large weights</text><rect x="168" y="214" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="168" y="214" width="84" height="14" rx="5" fill="#4d8ac9"></rect><text x="168" y="252" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||w|| = 6</text><rect x="294" y="214" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="294" y="214" width="30" height="14" rx="5" fill="#e5a344"></rect><text x="294" y="252" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||g|| = 3</text><rect x="410" y="207" width="78" height="33" rx="8" fill="#e9f8f6" stroke="none"/><g ><text x="449" y="229" font-size="15" fill="#069b91" font-weight="750" text-anchor="middle">0.200</text></g><rect x="516" y="214" width="92" height="14" rx="5" fill="#e9eff5" stroke="none"/><rect x="516" y="214" width="69" height="14" rx="5" fill="#069b91"></rect><text x="516" y="252" font-size="11" fill="#15324a" font-weight="600" text-anchor="start">||Δw|| = 0.6</text><line x1="27" y1="323" x2="613" y2="323" stroke="#dbe6ef" stroke-width="1" /><text x="31" y="344" font-size="11" fill="#657e91" font-weight="500" text-anchor="start">Illustrative: η = 0.1  ·  γ = 1  ·  decay = 0  ·  momentum = 0</text></svg>