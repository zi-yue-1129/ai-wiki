<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Heavy-ball and gradient descent on an illustrative quadratic</title><desc id="desc">On a quadratic with initial parameter 3, the turquoise gradient descent trajectory monotonically approaches zero, while purple heavy-ball momentum crosses the optimum before settling. Both use learning rate 0.2 and the momentum coefficient is 0.7. Diagram shows computed iterates, not model measurements.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#263f53}.k{font-size:12px;font-weight:700;letter-spacing:1px;fill:#617e91}.lab{font-size:12px;font-weight:600}.num{font-size:13px;font-weight:700}.panel{fill:#fff;stroke:#dce7ed;stroke-width:1.5}.axis{stroke:#b9cbd7;stroke-width:1.3}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="18" fill="#f4f8fb"/><rect class="panel" x="22" y="58" width="404" height="251" rx="15"/><rect class="panel" x="438" y="58" width="180" height="251" rx="15"/>
