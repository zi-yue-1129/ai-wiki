<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Whisper: timestamp-guided window shift</title><desc id="desc">A 30-second window ends inside caption B, which starts at 24 seconds. The next window begins at 24 seconds, so B now spans local seconds 0 to 10.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="4" fill="#f1f6fa" stroke="none"/><rect x="18" y="52" width="604" height="290" rx="4" fill="#ffffff" stroke="none"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">Whisper: timestamp-guided window shift</text><g class="motion"><text x="32" y="80" font-size="16" fill="#233b52" text-anchor="start">Recording time</text><path d="M48 109L588 109" stroke="#233b52" stroke-width="2" fill="none"/><path d="M48 109L48 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="48" y="136" font-size="15" fill="#233b52" text-anchor="middle">0</text><path d="M138 109L138 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="138" y="136" font-size="15" fill="#233b52" text-anchor="middle">10</text><path d="M228 109L228 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="228" y="136" font-size="15" fill="#233b52" text-anchor="middle">20</text><path d="M318 109L318 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="318" y="136" font-size="15" fill="#233b52" text-anchor="middle">30</text><path d="M408 109L408 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="408" y="136" font-size="15" fill="#233b52" text-anchor="middle">40</text><path d="M498 109L498 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="498" y="136" font-size="15" fill="#233b52" text-anchor="middle">50</text><path d="M588 109L588 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="588" y="136" font-size="15" fill="#233b52" text-anchor="middle">60 s</text><rect x="55.2" y="86" width="208.8" height="23" rx="4" fill="#21678d" stroke="none"/><rect x="264" y="86" width="90" height="23" rx="4" fill="#a95516" stroke="none"/><text x="159" y="103" font-size="17" fill="white" text-anchor="middle">A</text><text x="309" y="103" font-size="17" fill="white" text-anchor="middle">B</text><path d="M318 141L318 175" stroke="#a95516" stroke-width="1.5" fill="none"/><text x="48" y="194" font-size="16" fill="#233b52" text-anchor="start">First window</text><rect x="48" y="201" width="270" height="28" rx="4" fill="#e1edf4" stroke="#21678d"/><text x="183" y="221" font-size="17" fill="#21678d" text-anchor="middle">0–30 s</text><text x="264" y="249" font-size="16" fill="#233b52" text-anchor="start">Next window</text><rect x="264" y="258" width="270" height="28" rx="4" fill="#e2f1ec" stroke="#087d70"/><text x="399" y="278" font-size="17" fill="#087d70" text-anchor="middle">24–54 s</text><rect x="48" y="148" width="270" height="27" rx="5" fill="none" stroke="#087d70" stroke-width="3"><animate attributeName="x" values="48;48;264;264" keyTimes="0;0.35;0.6;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.6;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="320" y="319" font-size="19" fill="#087d70" text-anchor="middle">B: local 0–10 s → absolute 24–34 s</text></g></g><g class="still"><text x="32" y="80" font-size="16" fill="#233b52" text-anchor="start">Recording time</text><path d="M48 109L588 109" stroke="#233b52" stroke-width="2" fill="none"/><path d="M48 109L48 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="48" y="136" font-size="15" fill="#233b52" text-anchor="middle">0</text><path d="M138 109L138 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="138" y="136" font-size="15" fill="#233b52" text-anchor="middle">10</text><path d="M228 109L228 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="228" y="136" font-size="15" fill="#233b52" text-anchor="middle">20</text><path d="M318 109L318 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="318" y="136" font-size="15" fill="#233b52" text-anchor="middle">30</text><path d="M408 109L408 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="408" y="136" font-size="15" fill="#233b52" text-anchor="middle">40</text><path d="M498 109L498 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="498" y="136" font-size="15" fill="#233b52" text-anchor="middle">50</text><path d="M588 109L588 119" stroke="#233b52" stroke-width="2" fill="none"/><text x="588" y="136" font-size="15" fill="#233b52" text-anchor="middle">60 s</text><rect x="55.2" y="86" width="208.8" height="23" rx="4" fill="#21678d" stroke="none"/><rect x="264" y="86" width="90" height="23" rx="4" fill="#a95516" stroke="none"/><text x="159" y="103" font-size="17" fill="white" text-anchor="middle">A</text><text x="309" y="103" font-size="17" fill="white" text-anchor="middle">B</text><path d="M318 141L318 175" stroke="#a95516" stroke-width="1.5" fill="none"/><text x="48" y="194" font-size="16" fill="#233b52" text-anchor="start">First window</text><rect x="48" y="201" width="270" height="28" rx="4" fill="#e1edf4" stroke="#21678d"/><text x="183" y="221" font-size="17" fill="#21678d" text-anchor="middle">0–30 s</text><text x="264" y="249" font-size="16" fill="#233b52" text-anchor="start">Next window</text><rect x="264" y="258" width="270" height="28" rx="4" fill="#e2f1ec" stroke="#087d70"/><text x="399" y="278" font-size="17" fill="#087d70" text-anchor="middle">24–54 s</text><rect x="264" y="148" width="270" height="27" rx="4" fill="none" stroke="#087d70"/><text x="320" y="319" font-size="19" fill="#087d70" text-anchor="middle">B: local 0–10 s → absolute 24–34 s</text></g></svg>