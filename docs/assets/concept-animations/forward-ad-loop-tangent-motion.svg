<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Tangent decay through an iterative map</title><desc id="desc">For x next = 0.5 x + 1 starting at 4 with input seed 1, the primal approaches 2 while the tangent is multiplied by 0.5 each iteration. Six exact hand-calculated steps animate as paired moving markers.</desc><rect width="800" height="420" rx="18" fill="#f4f8fb"/><rect x="16" y="16" width="768" height="388" rx="16" fill="white" stroke="#dbe6ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="51" fill="#1d3548" font-size="22" font-weight="bold">Forward AD · tangent through a loop</text><text x="36" y="77" fill="#62788a" font-size="13">xₜ₊₁ = 0.5 xₜ + 1     •     x₀ = 4     •     seed = 1</text><rect x="36" y="96" width="728" height="252" rx="12" fill="#f8fbfd" stroke="#dbe6ed"/><text x="57" y="122" fill="#087f86" font-size="16" font-weight="bold">Primal xₜ</text><text x="423" y="122" fill="#ca6e22" font-size="16" font-weight="bold">Tangent dxₜ</text><text x="57" y="140" fill="#62788a" font-size="12">Approaches fixed point 2</text><text x="423" y="140" fill="#62788a" font-size="12">Sensitivity halves each step</text><path d="M86 154 L86 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M135 154 L135 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M184 154 L184 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M233 154 L233 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M282 154 L282 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M331 154 L331 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M452 154 L452 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M501 154 L501 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M550 154 L550 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M599 154 L599 295" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M648 154 L648 295" f