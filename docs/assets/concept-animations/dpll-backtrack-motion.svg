<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><style>@media(prefers-reduced-motion:reduce){.phase{opacity:0!important}.phase.final{opacity:1!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfe" stroke="#dce7ef" stroke-width="1.4"/><title id="title">DPLL: propagation, conflict and backtracking</title><desc id="desc">CNF clauses not A or B, not A or not B, A or C. Decide A true forces B true and a conflict; backtrack A false forces C true, yielding SAT. Illustrative formula.</desc><rect x="22" y="17" width="144" height="40" rx="9" fill="#edf3f8" stroke="#d7e2ea" stroke-width="1.4"/><text x="94" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#647d90" text-anchor="middle">CNF</text><rect x="176" y="17" width="144" height="40" rx="9" fill="#edf3f8" stroke="#d7e2ea" stroke-width="1.4"/><text x="248" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#647d90" text-anchor="middle">Decide</text><rect x="330" y="17" width="144" height="40" rx="9" fill="#edf3f8" stroke="#d7e2ea" stroke-width="1.4"/><text x="402" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#647d90" text-anchor="middle">Conflict</text><rect x="484" y="17" width="144" height="40" rx="9" fill="#edf3f8" stroke="#d7e2ea" stroke-width="1.4"/><text x="556" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#647d90" text-anchor="middle">Backtrack</text><rect x="21" y="78" width="286" height="194" rx="12" fill="#ffffff" stroke="#dce6ee" stroke-width="1.4"/><text x="39" y="101" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#647d90" text-anchor="start">CNF</text><rect x="37" y="114" width="252" height="39" rx="8" fill="#f7fafc" stroke="#dce6ee" stroke-width="1.4"/><text x="55" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#647d90" text-anchor="start">C1</text><text x="183" y="140" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#20374c" text-anchor="middle">¬A ∨ B</text><rect x="37" y="162" width="252" height="39" rx="8" fill="#f7fafc" stroke="#dce6ee" stroke-width="1.4"/><text x="55" y="187" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#647d90" text-anchor="start">C2</text><text x="183" y="188" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#20374c" text-anchor="middle">¬A ∨ ¬B</text><rect x="37" y="210" width="252" height="39" rx="8" fill="#f7fafc" stroke="#dce6ee" stroke-width="1.4"/><text x="55" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#647d90" text-anchor="start">C3</text><text x="183" y="236" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#20374c" text-anchor="middle">A ∨ C</text><text x="347" y="95" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#647d90" text-anchor="start">SEARCH</text><path d="M480 136L408 206" stroke="#bdcfdd" stroke-width="2.6" stroke-linecap="round"  fill="none"/><path d="M480 136L552 206" stroke="#bdcfdd" stroke-width="2.6" stroke-linecap="round"  fill="none"/><circle cx="480" cy="119" r="26" fill="#fff" stroke="#b5c8d6" stroke-width="2"/><text x="480" y="125" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#20374c" text-anchor="middle">A?</text><rect x="352" y="211" width="112" height="41" rx="9" fill="#ffffff" stroke="#d9e4eb" stroke-width="1.4"/><text x="408" y="237" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#20374c" text-anchor="middle">A = 1</text><rect x="496" y="211" width="112" height="41" rx="9" fill="#ffffff" stroke="#d9e4eb" stroke-width="1.4"/><text x="552" y="237" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#20374c" text-anchor="middle">A = 0</text><rect x="20" y="288" width="600" height="54" rx="10" fill="#ffffff" stroke="#dce6ee" stroke-width="1.4"/><g class="phase " opacity="1"><rect x="22" y="17" width="144" height="40" rx="9" fill="#e1f3f0" stroke="#087f80" stroke-width="1.4"/><text x="94" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#087f80" text-anchor="middle">CNF</text><text x="318" y="319" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#647d90" text-anchor="middle">Choose an unassigned variable</text><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g><g class="phase " opacity="0"><rect x="176" y="17" width="144" height="40" rx="9" fill="#e1f3f0" stroke="#087f80" stroke-width="1.4"/><text x="248" y="42" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" fill="#087f80" text-anchor="middle">Decide</text><path d="M480 136L408 206" stroke="#bf5361" stroke-width="4" stroke-linecap="round"  fill="none"/><rect x="352" y="211" width="112" height="41" rx="9" fill="#fceef0" stroke="#bf5361" stroke-width="1.4"/><text x="408" y="237" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#bf5361" text-anchor="middle">A = 1</text><rect x="36" y="295" width="116" height="38" rx="8" fill="#fff0ec" stroke="#e3b0a9" stroke-width="1.4"/><text x="94" y="320" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#bf5361" text-anchor="middle">B = 1</text><text x="410" y="320" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#647d90" text-anchor="middle">Unit propagation</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g><g class="phase " opacity="0"><rect x="330" y="17" width="144" height="40" rx="9" fill="#