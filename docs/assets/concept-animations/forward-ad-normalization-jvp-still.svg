<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Unit-vector normalization JVP removes radial input perturbations</title><desc id="desc">At x=(3,4), the normalized vector u=(0.6,0.8). A unit input seed rotates from radial to tangential; its radial component is eliminated and the output JVP grows along the tangent. The output arrow is magnified five times for visibility.</desc><defs><marker id="arr-teal" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#13868b"/></marker><marker id="arr-amber" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c98132"/></marker><marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7461a5"/></marker></defs><rect x="0.00" y="0.00" width="800.00" height="420.00" rx="18" fill="#f1f7fa" stroke="none"/><rect x="16.00" y="16.00" width="768.00" height="388.00" rx="16" fill="#fff" stroke="#d8e4eb"/><text x="38.00" y="52.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#19384b" text-anchor="start" font-weight="700">Normalization removes radial sensitivity</text><text x="38.00" y="78.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5b7383" text-anchor="start">u = x / ||x||       x = (3,4)       ||x|| = 5</text><rect x="37.00" y="104.00" width="380.00" height="276.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><rect x="435.00" y="104.00" width="329.00" height="276.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><text x="56.00" y="133.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19384b" text-anchor="start" font-weight="700">Input seed v</text><text x="455.00" y="133.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19384b" text-anchor="start" font-weight="700">Normalized output tangent</text><circle cx="233.00" cy="259.00" r="98" fill="none" stroke="#d8e4eb" stroke-width="1.4"/><line x1="120.00" y1="259.00" x2="346.00" y2="259.00" stroke="#d8e4eb" stroke-width="1.3" stroke-linecap="round"/><line x1="233.00" y1="146.00" x2="233.00" y2="372.00" stroke="#d8e4eb" stroke-width="1.3" stroke-linecap="round"/><line x1="233.00" y1="259.00" x2="291.80" y2="180.60" stroke="#13868b" stroke-width="3" stroke-linecap="round"/><circle cx="291.80" cy="180.60" r="4.5" fill="#13868b" stroke="none" stroke-width="1"/><text x="307.00" y="178.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#13868b" text-anchor="start" font-weight="700">u</text><line x1="233" y1="259" x2="262.40" y2="219.80" stroke="#13868b" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"></line><line x1="262.40" y1="219.80" x2="194.50" y2="168.88" stroke="#7461a5" stroke-width="4" stroke-linecap="round"></line><line x1="233" y1="259" x2="194.50" y2="168.88" stroke="#c98132" stroke-width="3.5" marker-end="url(#arr-amber)"></line><circle cx="620.00" cy="253.00" r="76" fill="none" stroke="#d8e4eb" stroke-width="1.4"/><line x1="529.00" y1="253.00" x2="711.00" y2="253.00" stroke="#d8e4eb" stroke-width="1.3" stroke-linecap="round"/><line x1="620.00" y1="162.00" x2="620.00" y2="344.00" stroke="#d8e4eb" stroke-width="1.3" stroke-linecap="round"/><line x1="620.00" y1="253.00" x2="665.60" y2="192.20" stroke="#13868b" stroke-width="4" stroke-linecap="round"/><circle cx="665.60" cy="192.20" r="5" fill="#13868b" stroke="none" stroke-width="1"/><line x1="665.60" y1="192.20" x2="612.95" y2="152.71" stroke="#7461a5" stroke-width="5" marker-end="url(#arr-purple)"></line><text x="454.00" y="344.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#13868b" text-anchor="start" font-weight="700">Radial part → 0</text><text x="454.00" y="366.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7461a5" text-anchor="start">Jv = (I − uuᵀ)v / 5</text><text x="749.00" y="396.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b7383" text-anchor="end">Jv arrow ×5</text><text x="40.00" y="396.00" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b7383" text-anchor="start">Synthetic geometry · exact analytic JVP</text></svg>