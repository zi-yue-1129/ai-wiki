<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">DPR: continuous dot-product ranking</title><desc id="description">A query vector turns between two fixed passage vectors; their inner-product scores change and the leading passage changes. Toy 2D embeddings.</desc><rect width="640" height="360" fill="#f7fbfd"/><g font-family="Arial, Helvetica, sans-serif"><text x="27" y="35" text-anchor="start" fill="#16364f" font-size="19" font-weight="700">DPR</text><text x="82" y="35" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">one vector per passage</text><rect x="24" y="58" width="310" height="257" rx="14" fill="#ffffff" stroke="#d5e4ed"/><rect x="347" y="58" width="269" height="257" rx="14" fill="#ffffff" stroke="#d5e4ed"/><text x="43" y="82" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">Embedding space</text><line x1="65" y1="222" x2="311" y2="222" stroke="#c9dbe6" stroke-width="1.5" /><line x1="166" y1="282" x2="166" y2="102" stroke="#c9dbe6" stroke-width="1.5" /><path d="M 262 222 A 96 96 0 0 0 166 126" stroke="#d9e7ee" fill="none" stroke-width="2" stroke-dasharray="5 6"/><line x1="166" y1="222" x2="262" y2="222" stroke="#087e99" stroke-width="4" stroke-linecap="round"/><circle cx="262" cy="222" r="5" fill="#087e99"/><line x1="166" y1="222" x2="166" y2="126" stroke="#7565b9" stroke-width="4" stroke-linecap="round"/><circle cx="166" cy="126" r="5" fill="#7565b9"/><text x="269" y="218" text-anchor="start" fill="#087e99" font-size="12" font-weight="500">pA</text><text x="174" y="129" text-anchor="start" fill="#7565b9" font-size="12" font-weight="500">pB</text><line x1="166" y1="222" x2="210.18" y2="136.77" stroke="#de8546" stroke-width="5" stroke-linecap="round"></line><circle cx="210.18" cy="136.77" r="5" fill="#de8546"></circle><text x="43" y="291" text-anchor="start" fill="#de8546" font-size="12" font-weight="500">q · query</text><text x="368" y="82" text-anchor="start" fill="#526c7f" font-size="13" font-weight="500">Inner-product scores</text><text x="371" y="149" text-anchor="start" fill="#087e99" font-size="14" font-weight="700">A</text><rect x="398" y="130" width="183" height="30" rx="6" fill="#eaf1f5" /><rect x="398" y="130" rx="6" width="72.71" height="30" fill="#087e99"></rect><text x="371" y="222" text-anchor="start" fill="#7565b9" font-size="14" font-weight="700">B</text><rect x="398" y="203" width="183" height="30" rx="6" fill="#eaf1f5" /><rect x="398" y="203" rx="6" width="140.27" height="30" fill="#7565b9"></rect><text x="399" y="273" text-anchor="start" fill="#526c7f" font-size="11" font-weight="500">0</text><text x="580" y="273" text-anchor="end" fill="#526c7f" font-size="11" font-weight="500">1</text><text x="469" y="297" text-anchor="middle" fill="#16364f" font-size="13" font-weight="500">score = q · p</text><text x="320" y="344" text-anchor="middle" fill="#526c7f" font-size="11" font-weight="500">Illustrative 2D vectors · Not trained embeddings</text></g></svg>