<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Youden J ≠ minimum cost</title><desc id="desc">For a synthetic six-case ranking plus minus plus plus minus minus, Youden J is largest at k equals four. In a deployment with ten-percent prevalence, false-positive cost one, and variable false-negative cost one through five, the minimum expected cost switches from k equals one to k equals four at false-negative cost 4.5.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#22394a}.head{font-size:17px;font-weight:750}.sub{font-size:11px;fill:#567081}.cap{font-size:12px;font-weight:700}.tiny{font-size:10px;fill:#567081}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="24" y="32" class="head">Youden J ≠ minimum cost</text><rect x="20" y="55" width="294" height="262" rx="12" fill="#fff" stroke="#d2e0e9"/><rect x="326" y="55" width="294" height="262" rx="12" fill="#fff" stroke="#d2e0e9"/><text x="38" y="77" class="cap">ROC · YOUDEN J</text><text x="343" y="77" class="cap">DEPLOYMENT COST</text><line x1="72" y1="281" x2="267" y2="281" stroke="#819bab" stroke-width="1.5"/><line x1="72" y1="281" x2="72" y2="106" stroke="#819bab" stroke-width="1.5"/><path d="M72,281 L72,224.3 L135.3,224.3 L135.3,167.7 L135.3,111 L198.7,111 L262,111" stroke="#c1cbd3" stroke-width="2" stroke-dasharray="5 4" fill="none"/><circle cx="72" cy="224.33333333333334" r="7" fill="#d97747" stroke="white" stroke-width="2"/><circle cx="135.33333333333331" cy="111" r="7" fill="#207a92" stroke="white" stroke-width="2"/><text x="88" y="218" class="cap">k = 1</text><text x="146" y="103" class="cap">k = 4</text><text x="46" y="102" class="tiny">TPR</text><text x="168" y="307" class="sub" text-anchor="middle">False positive rate</text><text x="87" y="157" class="sub">Best J = 0.667</text><line x1="359" y1="270" x2="590" y2="270" stroke="#819bab" stroke-width="1.5"/><line x1="359" y1="270" x2="359" y2="110" stroke="#819bab" stroke-width="1.5"/><line x1="359" y1="173" x2="590" y2="173" stroke="#e2ebf0"/><path d="M359,248.52 L590,162.59" stroke="#d97747" stroke-width="3" fill="none"/><line x1="359" y1="173.33333333333334" x2="590" y2="173.33333333333334" stroke="#207a92" stroke-width="3"/><text x="376" y="227" class="cap" fill="#d97747">k=1</text><text x="548" y="146" class="cap" fill="#207a92">k=4</text><text x="359" y="287" class="tiny">1</text><text x="590" y="287" class="tiny" text-anchor="end">5</text><text x="475" y="306" class="sub" text-anchor="middle">False-negative cost</text><text x="360" y="103" class="tiny">Expected cost</text><g class="moving"><line x1="359" x2="359" y1="116" y2="270" stroke="#91a9bb" stroke-dasharray="3 5"><animate attributeName="x1" values="359;590;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="359;590;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></line><circle r="6" fill="#d97747" stroke="white" stroke-width="2"><animateMotion dur="12s" repeatCount="indefinite" path="M359,248.52 L590,162.59 L359,248.52"/></circle><circle cx="359" cy="173.33333333333334" r="6" fill="#207a92" stroke="white" stroke-width="2"><animate attributeName="cx" values="359;590;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><text x="23" y="344" class="tiny">SYNTHETIC RATES · NOT MODEL MEASUREMENTS</text></svg>