<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Youden J and expected error cost can prefer different thresholds</title><desc id="desc">Six hypothetical ranked cases demonstrate J maximization at top two versus minimum expected loss at predicting all cases positive.</desc><style>text{font-family:Inter,Arial,sans-serif}.moving{display:inline}.static-final{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.static-final{display:inline}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f2f8fb"/><text x="24" y="35" fill="#234457" font-size="24" font-weight="750">THRESHOLD: J vs COST</text><text x="24" y="57" fill="#688698" font-size="13" font-weight="500">6 ranked cases   ·   p = 0.40   ·   FN cost = 5, FP cost = 1</text><rect x="24" y="78" width="216" height="207" rx="12" fill="#ffffff" stroke="#cbe1ec"/><rect x="253" y="78" width="364" height="207" rx="12" fill="#ffffff" stroke="#cbe1ec"/><text x="43" y="106" fill="#688698" font-size="13" font-weight="700">RANKED LABELS</text><circle cx="52" cy="139" r="12" fill="#2d9c8f"/><text x="52" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">+</text><circle cx="82" cy="139" r="12" fill="#2d9c8f"/><text x="82" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">+</text><circle cx="112" cy="139" r="12" fill="#e89859"/><text x="112" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">−</text><circle cx="142" cy="139" r="12" fill="#e89859"/><text x="142" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">−</text><circle cx="172" cy="139" r="12" fill="#e89859"/><text x="172" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">−</text><circle cx="202" cy="139" r="12" fill="#2d9c8f"/><text x="202" y="143" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">+</text><text x="44" y="185" fill="#688698" font-size="12" font-weight="500">Selected top k</text><g class="moving"><text opacity="1" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 0<animate attributeName="opacity" values="1;0;0;0;0;0;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 1<animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 2<animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 3<animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 4<animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 5<animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0.000000;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143;1.000000" dur="14s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="213" fill="#234457" font-size="19" font-weight="600">k = 6<animate attributeName="opacity" values="0;0;0;0;0;0;1;1" k