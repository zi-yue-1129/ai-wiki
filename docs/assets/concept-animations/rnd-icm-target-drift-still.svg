<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="title desc"><title id="title">Three snapshots of fixed and trainable feature targets</title><desc id="desc">Start: the two methods have the same illustrative prediction gap. Encoder update: the RND target stays fixed, while the ICM feature target moves right for an unchanged raw observation. Predictor update: trainable predictions move toward their respective targets. All coordinates are artificial.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-weight:700;fill:#253951}.muted{fill:#587086}.panel{fill:#fff;stroke:#cedbe8;stroke-width:1.5}.axis{stroke:#d8e2ec;stroke-width:3;stroke-linecap:round}.gap{stroke:#8c75ba;stroke-width:5;stroke-linecap:round}.target{fill:#fff;stroke:#15958c;stroke-width:4}.predict{fill:#f1a452;stroke:#ae6d28;stroke-width:1.8}.reduced-frame{display:none}@media(prefers-reduced-motion:reduce){.live{display:none}.reduced-frame{display:block}}</style><rect width="360" height="540" rx="18" fill="#f7f9fd"/><text x="17" y="30" class="title" font-size="18">TARGET STABILITY</text><text x="17" y="49" class="muted" font-size="12">One fixed input · three hypothetical snapshots</text><circle class="target" cx="24" cy="72" r="6"/><text x="37" y="76" class="muted" font-size="12">Target</text><rect class="predict" x="124" y="66" width="12" height="12" rx="2"/><text x="146" y="76" class="muted" font-size="12">Prediction</text><line class="gap" x1="250" x2="262" y1="72" y2="72" stroke-width="3"/><text x="272" y="76" class="muted" font-size="12">Gap</text><rect class="panel" x="14" y="92" width="332" height="128" rx="13"/><text x="28" y="115" class="title" font-size="14">1 · START</text><text x="329" y="115" text-anchor="end" class="muted" font-size="11">Same gap</text><text x="30" y="157" class="title" font-size="14">RND</text><line class="axis" x1="97" y1="152" x2="319" y2="152"/><line class="gap" x1="112" y1="152" x2="225" y2="152" stroke-width="3"/><rect class="predict" x="106" y="146" width="12" height="12" rx="2"/><circle class="target" cx="225" cy="152" r="7"/><text x="30" y="196" class="title" font-size="14">ICM</text><line class="axis" x1="97" y1="191" x2="319" y2="191"/><line class="gap" x1="112" y1="191" x2="225" y2="191" stroke-width="3"/><rect class="predict" x="106" y="185" width="12" height="12" rx="2"/><circle class="target" cx="225" cy="191" r="7"/><rect class="panel" x="14" y="229" width="332" height="128" rx="13"/><text x="28" y="252" class="title" font-size="14">2 · ENCODER</text><text x="329" y="252" text-anchor="end" class="muted" font-size="11">ICM target shifts</text><text x="30" y="294" class="title" font-size="14">RND</text><line class="axis" x1="97" y1="289" x2="319" y2="289"/><line class="gap" x1="112" y1="289" x2="225" y2="289" stroke-width="3"/><rect class="predict" x="106" y="283" width="12" height="12" rx="2"/><circle class="target" cx="225" cy="289" r="7"/><text x="30" y="333" class="title" font-size="14">ICM</text><line class="axis" x1="97" y1="328" x2="319" y2="328"/><line class="gap" x1="112" y1="328" x2="291" y2="328" stroke-width="3"/><rect class="predict" x="106" y="322" width="12" height="12" rx="2"/><circle class="target" cx="291" cy="328" r="7"/><rect class="panel" x="14" y="366" width="332" height="128" rx="13"/><text x="28" y="389" class="title" font-size="14">3 · PREDICTOR</text><text x="329" y="389" text-anchor="end" class="muted" font-size="11">Gap shrinks</text><text x="30" y="431" class="title" font-size="14">RND</text><line class="axis" x1="97" y1="426" x2="319" y2="426"/><line class="gap" x1="219" y1="426" x2="225" y2="426" stroke-width="3"/><rect class="predict" x="213" y="420" width="12" height="12" rx="2"/><circle class="target" cx="225" cy="426" r="7"/><text x="30" y="470" class="title" font-size="14">ICM</text><line class="axis" x1="97" y1="465" x2="319" y2="465"/><line class="gap" x1="279" y1="465" x2="291" y2="465" stroke-width="3"/><rect class="predict" x="273" y="459" width="12" height="12" rx="2"/><circle class="target" cx="291" cy="465" r="7"/><text x="18" y="517" class="muted" font-size="11">Not measured rewards or recorded optimization steps.</text></svg>