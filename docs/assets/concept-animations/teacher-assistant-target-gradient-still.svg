<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Teacher assistant: target-dependent gradient direction</title><desc id="desc">The teacher and assistant supply fixed different class probabilities. A toy student moves from 50 to 70 percent on class A. Direct and assistant gradients are both negative at the first state, but have opposite signs at the second. The sweep compares states, not a training trajectory.</desc><rect width="640" height="360" rx="10" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="27" font-size="21" fill="#24374a" text-anchor="middle">Teacher assistant: change the target</text><rect x="16" y="44" width="176" height="144" rx="4" fill="#e8eef4"></rect><text x="104" y="65" font-size="17" fill="#24374a" text-anchor="middle">Teacher</text><text x="104" y="83" font-size="12" fill="#24374a" text-anchor="middle">Large · fixed</text><rect x="38" y="101.4" width="34" height="57.599999999999994" rx="4" fill="#315c85"></rect><text x="55" y="177" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="55" y="96.4" font-size="12" fill="#315c85" text-anchor="middle">80.0%</text><rect x="87" y="148.2" width="34" height="10.799999999999999" rx="4" fill="#315c85"></rect><text x="104" y="177" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="104" y="143.2" font-size="12" fill="#315c85" text-anchor="middle">15.0%</text><rect x="136" y="155.4" width="34" height="3.5999999999999996" rx="4" fill="#315c85"></rect><text x="153" y="177" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="153" y="150.4" font-size="12" fill="#315c85" text-anchor="middle">5.0%</text><path d="M194 120h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2.5" stroke-linejoin="round"/><rect x="232" y="44" width="176" height="144" rx="4" fill="#e8eef4"></rect><text x="320" y="65" font-size="17" fill="#24374a" text-anchor="middle">Assistant</text><text x="320" y="83" font-size="12" fill="#24374a" text-anchor="middle">Medium · fixed</text><rect x="254" y="112.2" width="34" height="46.8" rx="4" fill="#08766f"></rect><text x="271" y="177" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="271" y="107.2" font-size="12" fill="#08766f" text-anchor="middle">65.0%</text><rect x="303" y="144.6" width="34" height="14.399999999999999" rx="4" fill="#08766f"></rect><text x="320" y="177" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="320" y="139.6" font-size="12" fill="#08766f" text-anchor="middle">20.0%</text><rect x="352" y="148.2" width="34" height="10.799999999999999" rx="4" fill="#08766f"></rect><text x="369" y="177" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="369" y="143.2" font-size="12" fill="#08766f" text-anchor="middle">15.0%</text><path d="M410 120h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2.5" stroke-linejoin="round"/><rect x="448" y="44" width="176" height="144" rx="4" fill="#e8eef4"></rect><text x="536" y="65" font-size="17" fill="#24374a" text-anchor="middle">Student</text><text x="536" y="83" font-size="12" fill="#24374a" text-anchor="middle">Same state for both</text><rect x="470" y="108.6" width="34" height="50.4" rx="4" fill="#a05c20"></rect><text x="487" y="177" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="487" y="103.6" font-size="12" fill="#a05c20" text-anchor="middle">70.0%</text><rect x="519" y="148.2" width="34" height="10.799999999999999" rx="4" fill="#a05c20"></rect><text x="536" y="177" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="536" y="143.2" font-size="12" fill="#a05c20" text-anchor="middle">15.0%</text><rect x="568" y="148.2" width="34" height="10.799999999999999" rx="4" fill="#a05c20"></rect><text x="585" y="177" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="585" y="143.2" font-size="12" fill="#a05c20" text-anchor="middle">15.0%</text><rect x="16" y="202" width="608" height="142" rx="4" fill="#f4f6f8"></rect><text x="30" y="225" font-size="16" fill="#24374a" text-anchor="start">Student logit gradient</text><text x="510" y="225" font-size="12" fill="#24374a" text-anchor="middle">Start</text><text x="585" y="225" font-size="12" fill="#24374a" text-anchor="middle">Now</text><line x1="395" y1="237" x2="395" y2="316" stroke="#9aabb9" stroke-width="2"/><text x="395" y="332" font-size="12" fill="#24374a" text-anchor="middle">0</text><text x="30" y="255" font-size="15" fill="#315c85" text-anchor="start">Direct</text><text x="30" y="300" font-size="15" fill="#08766f" text-anchor="start">Via assistant</text><text x="510" y="255" font-size="15" fill="#315c85" text-anchor="middle">−0.30</text><text x="510" y="300" font-size="15" fill="#08766f" text-anchor="middle">−0.15</text><rect x="345" y="239" width="50" height="22" rx="4" fill="#315c85"></rect><rect x="395" y="284" width="25" height="22" rx="4" fill="#08766f"></rect><text x="585" y="255" font-size="15" fill="#315c85" text-anchor="middle">−0.10</text><text x="585" y="300" font-size="15" fill="#08766f" text-anchor="middle">+0.05</text><text x="30" y="332" font-size="13" fill="#24374a" text-anchor="start">P(A): 50.0% → 70.0%</text></g></svg>