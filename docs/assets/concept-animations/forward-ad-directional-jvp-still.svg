<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Directional Jacobian-vector product</title><desc id="desc">Rotating a unit seed changes the directional derivative: Jv equals five cosine theta plus two sine theta. The orange unit vector and the teal graph cursor move together. Synthetic exact calculus, not model measurements.</desc><rect width="800" height="420" rx="18" fill="#f5f9fc"/><rect x="17" y="16" width="766" height="386" rx="16" fill="#fff" stroke="#dce7ee"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="52" font-size="22" fill="#20364b" font-weight="700">JVP • seed direction</text><text x="40" y="73" font-size="13" fill="#64798e" >f(x,y) = xy + 2x   •   (x,y) = (2,3)</text><rect x="37" y="91" width="278" height="264" rx="13" fill="#f8fafc" stroke="#dce7ef"/><rect x="332" y="91" width="432" height="264" rx="13" fill="#f8fafc" stroke="#dce7ef"/><text x="52" y="115" font-size="15" fill="#20364b" font-weight="700">Unit seed v</text><text x="349" y="115" font-size="15" fill="#20364b" font-weight="700">Directional derivative</text><circle cx="163" cy="226" r="80" fill="#fff" stroke="#c6d6e4" stroke-width="2"/><circle cx="243.0" cy="226.0" r="2" fill="#c7d5e2"/><circle cx="219.6" cy="169.4" r="2" fill="#c7d5e2"/><circle cx="163.0" cy="146.0" r="2" fill="#c7d5e2"/><circle cx="106.4" cy="169.4" r="2" fill="#c7d5e2"/><circle cx="83.0" cy="226.0" r="2" fill="#c7d5e2"/><circle cx="106.4" cy="282.6" r="2" fill="#c7d5e2"/><circle cx="163.0" cy="306.0" r="2" fill="#c7d5e2"/><circle cx="219.6" cy="282.6" r="2" fill="#c7d5e2"/><path d="M67 226 H260 M163 325 V127" stroke="#d0dce7" stroke-width="1.5" fill="none"/><text x="263" y="230" font-size="13" fill="#64798e" >x</text><text x="170" y="135" font-size="13" fill="#64798e" >y</text><path d="M163 226 L223.35 201.86" stroke="#0b8b8a" stroke-width="5" stroke-linecap="round"/><circle cx="223.35" cy="201.86" r="6" fill="#0b8b8a"/><text x="207" y=