<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">StreamingLLM-style cache eviction: attention sink and sliding recent window</title><desc id="desc">Four states illustrate an example cache with four slots. Token zero is always retained as the attention sink while a three-token recent window slides forward as new tokens arrive. This is a schematic policy, not an attention score measurement.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5c7889"/></marker></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#24465b}.head{font-size:18px;font-weight:750;letter-spacing:.65px}.label{font-size:13px;font-weight:700;letter-spacing:.7px}.small{font-size:11.5px;fill:#5c7889}.token{font-size:15px;font-weight:750}.stage{opacity:0}@media(prefers-reduced-motion:reduce){.stage{opacity:0!important}.stage-0{opacity:1!important}}</style><rect width="640" height="360" rx="16" fill="#f5f9fc"/><text x="28" y="35" class="head" >STREAMING KV EVICTION</text><text x="28" y="57" class="small" >Keep the sink + recent window</text><text x="40" y="112" class="label" >STREAM</text><text x="40" y="223" class="label" >CACHE</text><rect x="149" y="85" width="44" height="43" rx="7" fill="#dff5ef" stroke="#168b82" stroke-width="1.5"/><text x="171" y="112" class="token" text-anchor="middle">0</text><rect x="205" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="227" y="112" class="token" text-anchor="middle">1</text><rect x="261" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="283" y="112" class="token" text-anchor="middle">2</text><rect x="317" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="339" y="112" class="token" text-anchor="middle">3</text><rect x="373" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="395" y="112" class="token" text-anchor="middle">4</text><rect x="429" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="451" y="112" class="token" text-anchor="middle">5</text><rect x="485" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="507" y="112" class="token" text-anchor="middle">6</text><rect x="541" y="85" width="44" height="43" rx="7" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="563" y="112" class="token" text-anchor="middle">7</text><rect x="137" y="188" width="465" height="74" rx="12" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="40" y="284" class="small" >SINK</text><rect x="140" y="272" width="32" height="9" rx="3" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><text x="233" y="284" class="small" >RECENT</text><rect x="282" y="272" width="32" height="9" rx="3" fill="#e5eff8" stroke="#427eae" stroke-width="1"/><text x="28" y="330" class="small" >Illustrative 4-slot cache budget</text><rect x="160" y="202" width="78" height="46" rx="8" fill="#dff5ef" stroke="#168b82" stroke-width="1.8"/><text x="199" y="231" class="token" text-anchor="middle">0</text><rect x="269" y="202" width="78" height="46" rx="8" fill="#e5eff8" stroke="#427eae" stroke-width="1.8"/><text x="308" y="231" class="token" text-anchor="middle">4</text><rect x="378" y="202" width="78" height="46" rx="8" fill="#e5eff8" stroke="#427eae" stroke-width="1.8"/><text x="417" y="231" class="token" text-anchor="middle">5</text><rect x="487" y="202" width="78" height="46" rx="8" fill="#e5eff8" stroke="#427eae" stroke-width="1.8"/><text x="526" y="231" class="token" text-anchor="middle">6</text><rect x="485" y="79" width="44" height="55" rx="8" fill="none" stroke="#c38a37" stroke-width="3"/><text x="540" y="166" class="label" text-anchor="middle">t4</text><text x="304" y="167" class="small" text-anchor="middle">NEW TOKEN</text></svg>