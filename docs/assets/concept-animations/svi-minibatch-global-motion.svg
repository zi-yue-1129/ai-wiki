eName="cy" values="153;153;200;200;247;247;153" keyTimes="0;.31;.34;.64;.67;.98;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle><text x="509" y="314" class="tiny" text-anchor="middle">three stochastic steps</text></svg>