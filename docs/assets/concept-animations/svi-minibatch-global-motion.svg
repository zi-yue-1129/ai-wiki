<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Stochastic variational inference minibatches and global updates</title><desc id="desc">Three selected minibatches of a 12-point dataset each yield a scaled global-parameter proposal. The global parameter moves incrementally toward each proposal with a declining learning rate. Illustrative numeric values.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#203b52}.h{font-size:13px;font-weight:760;letter-spacing:.35px}.cap{font-size:10px;letter-spacing:1.3px;font-weight:800;fill:#60788b}.lbl{font-size:12px;fill:#60788b}.num{font-size:14px;font-weight:750}.tiny{font-size:10px;fill:#60788b}@media(prefers-reduced-motion:reduce){animate,animateMotion,animateTransform{display:none!important}}</style><rect width="640" height="360" rx="18" fill="#f5f9fc"/><rect x="18" y="52" width="604" height="288" rx="16" fill="white" stroke="#d7e4eb"/><text x="27" y="31" class="cap">STOCHASTIC VARIATIONAL INFERENCE</text><rect x="30" y="64" width="190" height="258" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><rect x="231" y="64" width="167" height="258" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><rect x="409" y="64" width="200" height="258" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><text x="45" y="84" class="cap">DATA  N = 12</text><text x="247" y="84" class="cap">LOCAL  B = 3</text><text x="423" y="84" class="cap">GLOBAL  λ</text><circle cx="60" cy="124" r="12" fill="#dce8f1"/><circle cx="60" cy="124" r="5" fill="#3469ac" opacity=".55"/><circle cx="60" cy="124" r="17" fill="none" stroke="#008c85" stroke-width="3" opacity="1"><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;.333333;.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><circle cx="105" cy="124" r="12" fill="#dce8f1"/><circle cx="105" cy="124" r="5" fill="#3469ac" opacity=".55"/><circle cx="105" cy="124" r="17" fill="none" strok