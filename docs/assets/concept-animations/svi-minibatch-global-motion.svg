imate attributeName="opacity" values="1;0;0;0" keyTimes="0;.333333;.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><circle cx="105" cy="228" r="12" fill="#dce8f1"/><circle cx="105" cy="228" r="5" fill="#3469ac" opacity=".55"/><circle cx="105" cy="228" r="17" fill="none" stroke="#3469ac" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.333333;.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><circle cx="150" cy="228" r="12" fill="#dce8f1"/><circle cx="150" cy="228" r="5" fill="#3469ac" opacity=".55"/><circle cx="195" cy="228" r="12" fill="#dce8f1"/><circle cx="195" cy="228" r="5" fill="#3469ac" opacity=".55"/><circle cx="195" cy="228" r="17" fill="none" stroke="#e39943" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.333333;.666667;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><text x="124" y="293" class="lbl" text-anchor="middle">3 selected / 12</text><text x="247" y="109" class="lbl">Batch estimate</text><line x1="262" y1="153" x2="362" y2="153" stroke="#d7e4eb" stroke-width="6" stroke-linecap="round"/><line x1="262" y1="153" x2="342.0" y2="153" stroke="#008c85" stroke-width="6" stroke-linecap="round"/><circle cx="342.0" cy="153" r="5" fill="#008c85" stroke="white" stroke-width="2"><animate attributeName="r" values="5;10;5;5;5" keyTimes="0;.12;.3;.6;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle><text x="247" y="157" class="num">1</text><line x1="262" y1="200" x2="362" y2="200" stroke="#d7e4eb" stroke-width="6" stroke-linecap="round"/><line x1="262" y1="200" x2="312.0" y2="200" stroke="#3469ac" stroke-width="6" stroke-linecap="round"/><circle cx="312.0" cy="200" r="5" fill="#3469ac" stroke="white" stroke-width="2"><animate attributeName="r" values="5;10;5;5;5" keyTimes="0;.12;.3;.6;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle><text x="247" y="204" class="num">2</tex