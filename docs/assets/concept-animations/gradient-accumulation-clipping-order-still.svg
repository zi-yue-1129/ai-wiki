<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Clipping before and after gradient accumulation do not commute</title><desc id="desc">For two synthetic microbatch gradients g1=(4,0) and g2=(0,2), and global L2 cap tau=2, averaging the individually clipped gradients gives (1,1). Clipping the mean gradient (2,1) gives approximately (1.789,0.894). During the animation the second gradient is scaled continuously from 0 to 2. These curves are counterfactual mathematical choices and not a training-time sequence.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" /><text x="32" y="43" fill="#1b354d" font-size="23" font-weight="750" >CLIPPING ORDER MATTERS</text><text x="32" y="65" fill="#647c90" font-size="13" font-weight="500" >Average first, or clip each gradient first?</text><rect x="22" y="83" width="362" height="305" rx="15" fill="#ffffff" stroke="#dbe7ef"/><text x="44" y="115" fill="#1b354d" font-size="15" font-weight="700" >CLIP EACH → MEAN</text><text x="44" y="140" fill="#647c90" font-size="12" font-weight="600" >g₁ = (4, 0)   g₂(t) = (0, 2t)</text><line x1="106" y1="146" x2="106" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="186" y1="146" x2="186" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="66" y1="146" x2="66" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="226" y1="146" x2="226" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="40" y1="249" x2="354" y2="249" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><line x1="146" y1="261" x2="146" y2="154" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><circle cx="146" cy="249" r="80" fill="none" stroke="#078c84" stroke-width="1.5" stroke-dasharray="6 6" opacity=".42"/><text x="136" y="269" fill="#647c90" font-size="11" font-weight="500" >0</text><text x="338" y="266" fill="#647c90" font-size="12" font-weight="500" >x</text><text x="155" y="153" fill="#647c90" font-size="12" font-weight="500" >y</text><line x1="146" y1="249" x2="226.00" y2="209.00" stroke="#8298a7" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"></line><line  x1="146" y1="249" x2="186.00" y2="209.00" stroke="#d57637" stroke-width="5" stroke-linecap="round" marker-end="url(#tipOrange)"/><text x="44" y="351" fill="#d57637" font-size="15" font-weight="700" >Final: (1.00, 1.00)</text><text x="44" y="373" fill="#647c90" font-size="12" font-weight="600" >τ = 2</text><rect x="416" y="83" width="362" height="305" rx="15" fill="#ffffff" stroke="#dbe7ef"/><text x="438" y="115" fill="#1b354d" font-size="15" font-weight="700" >MEAN → CLIP ONCE</text><text x="438" y="140" fill="#647c90" font-size="12" font-weight="600" >g₁ = (4, 0)   g₂(t) = (0, 2t)</text><line x1="500" y1="146" x2="500" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="580" y1="146" x2="580" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="460" y1="146" x2="460" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="620" y1="146" x2="620" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="434" y1="249" x2="748" y2="249" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><line x1="540" y1="261" x2="540" y2="154" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><circle cx="540" cy="249" r="80" fill="none" stroke="#078c84" stroke-width="1.5" stroke-dasharray="6 6" opacity=".42"/><text x="530" y="269" fill="#647c90" font-size="11" font-weight="500" >0</text><text x="732" y="266" fill="#647c90" font-size="12" font-weight="500" >x</text><text x="549" y="153" fill="#647c90" font-size="12" font-weight="500" >y</text><line x1="540" y1="249" x2="620.00" y2="209.00" stroke="#8298a7" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"></line><line  x1="540" y1="249" x2="611.55" y2="213.22" stroke="#078c84" stroke-width="5" stroke-linecap="round" marker-end="url(#tipTeal)"/><text x="438" y="351" fill="#078c84" font-size="15" font-weight="700" >Final: (1.79, 0.89)</text><text x="438" y="373" fill="#647c90" font-size="12" font-weight="600" >τ = 2</text><defs><marker id="tipOrange" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#d57637"/></marker><marker id="tipTeal" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#078c84"/></marker></defs><text x="400" y="407" fill="#647c90" font-size="12" font-weight="500" text-anchor="middle">g₂(t) = (0, 2t),  0 ≤ t ≤ 1   ·   schematic input sweep, not training steps</text></svg>