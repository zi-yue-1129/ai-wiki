<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Activity-silent working memory"><title>Activity-silent working memory</title><desc>Original schematic teaching animation; values and traces are illustrative, not recorded neural data.</desc><g transform="scale(0.888888889 0.9)"><rect x="0.5" y="0.5" width="719" height="399" rx="16" fill="#ffffff" stroke="#dce6f2"/><text x="25" y="39" fill="#17324d" font-size="22" font-family="Arial,sans-serif" font-weight="700">Activity-silent working memory</text><text x="25" y="62" fill="#7590a6" font-size="12" font-family="Arial,sans-serif">Schematic sequence: encode → quiet delay → refresh</text><rect x="24" y="86" width="672" height="284" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><text x="42" y="117" text-anchor="start" fill="#3274e5" font-size="12" font-weight="700" font-family="Arial,sans-serif">SPIKING</text><text x="42" y="253" text-anchor="start" fill="#009e9b" font-size="12" font-weight="700" font-family="Arial,sans-serif">SYNAPTIC TRACE</text><line x1="111" y1="193" x2="670" y2="193" stroke="#bac9d8" stroke-width="2"/><line x1="111" y1="333" x2="670" y2="333" stroke="#bac9d8" stroke-width="2"/><rect x="208" y="132" width="320" height="51" rx="9" fill="#e6eff9" opacity=".65"/><text x="368" y="155" text-anchor="middle" fill="#7590a6" font-size="12" font-weight="700" font-family="Arial,sans-serif">QUIET DELAY</text><line x1="133" y1="193" x2="133" y2="158" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="145" y1="193" x2="145" y2="134" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="155" y1="193" x2="155" y2="160" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="165" y1="193" x2="165" y2="145" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="179" y1="193" x2="179" y2="171" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="553" y1="193" x2="553" y2="152" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="564" y1="193" x2="564" y2="134" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="578" y1="193" x2="578" y2="155" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="591" y1="193" x2="591" y2="143" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="603" y1="193" x2="603" y2="168" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><polyline points="111,332 131,332 146,258 176,260 209,274 300,294 410,310 525,320 553,259 575,261 624,277 668,289" fill="none" stroke="#009e9b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="152" y="360" text-anchor="middle" fill="#7590a6" font-size="11" font-weight="700" font-family="Arial,sans-serif">ENCODE</text><text x="361" y="360" text-anchor="middle" fill="#7590a6" font-size="11" font-weight="700" font-family="Arial,sans-serif">MAINTAIN</text><text x="572" y="360" text-anchor="middle" fill="#7590a6" font-size="11" font-weight="700" font-family="Arial,sans-serif">REFRESH</text></g></svg>