<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Threshold selection on validation and evaluation on untouched test data</title><desc id="desc">Four artificial thresholds have validation utility .72, .84, .91, .80. The third is selected only from validation, then frozen and independently tested at synthetic utility .76. The visual illustrates selection then evaluation, not a claim that test scores must be smaller.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.head{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:11px;fill:#607888}.tick{font-size:10px;fill:#607888}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#eff7fa"/><text x="22" y="31" class="head">Select first · evaluate once</text><rect x="20" y="46" width="600" height="290" rx="12" fill="white" stroke="#cfdee6"/><text x="41" y="76" class="label">VALIDATION</text><text x="222" y="76" class="small">Utility</text><text x="391" y="76" class="label">HELD-OUT TEST</text><line x1="344" y1="64" x2="344" y2="284" stroke="#deebef"/><rect x="38" y="94" width="279" height="36" rx="7" fill="#f2f8fb"/><text x="52" y="117" class="label">TA</text><text x="87" y="117" class="small">0.35</text><rect x="135" y="106" width="128" height="11" rx="5" fill="#dde9ee"/><rect x="135" y="106" width="92" height="11" rx="5" fill="#75afb6"/><text x="274" y="116" class="small">.72</text><rect x="38" y="137" width="279" height="36" rx="7" fill="#f2f8fb"/><text x="52" y="160" class="label">TB</text><text x="87" y="160" class="small">0.50</text><rect x="135" y="149" width="128" height="11" rx="5" fill="#dde9ee"/><rect x="135" y="149" width="108" height="11" rx="5" fill="#75afb6"/><text x="274" y="159" class="small">.84</text><rect x="38" y="180" width="279" height="36" rx="7" fill="#f2f8fb"/><text x="52" y="203" class="label">TC</text><text x="87" y="203" class="small">0.65</text><rect x="135" y="192" width="128" height="11" rx="5" fill="#dde9ee"/><rect x="135" y="192" width="116" height="11" rx="5" fill="#75afb6"/><text x="274" y="202" class="small">.91</text><rect x="38" y="223" width="279" height="36" rx="7" fill="#f2f8fb"/><text x="52" y="246" class="label">TD</text><text x="87" y="246" class="small">0.80</text><rect x="135" y="235" width="128" height="11" rx="5" fill="#dde9ee"/><rect x="135" y="235" width="102" height="11" rx="5" fill="#75afb6"/><text x="274" y="245" class="small">.80</text><g><rect x="38" y="180" width="279" height="36" rx="7" fill="none" stroke="#d78638"/><rect x="309" y="194" width="6" height="10" rx="3" fill="#d78638"/></g><g><rect x="375" y="94" width="218" height="35" rx="6" fill="#f2f8fb"/><text x="389" y="116" class="label">Selected:  T C</text><rect x="375" y="139" width="218" height="68" rx="7" fill="#eff8f6" stroke="#83b7aa"/><text x="390" y="161" class="small">Test utility</text><rect x="390" y="172" width="131" height="12" rx="5" fill="#dae9e7"/><rect x="390" y="172" width="100" height="12" rx="5" fill="#37918f"/><text x="541" y="183" class="label">.76</text></g><g><rect x="375" y="139" width="218" height="68" rx="7" fill="none" stroke="#37918f"/></g><text x="379" y="233" class="small">Keep test labels unseen</text><text x="379" y="250" class="small">during threshold search</text><line x1="49" y1="298" x2="576" y2="298" stroke="#a8bbc7" stroke-width="1.4"/><text x="145" y="322" class="label" text-anchor="middle">Choose</text><text x="320" y="322" class="label" text-anchor="middle">Freeze</text><text x="490" y="322" class="label" text-anchor="middle">Evaluate</text><path d="M235 304 l8 5 l-8 5 z" fill="#537e8c"/><path d="M406 304 l8 5 l-8 5 z" fill="#537e8c"/><text x="22" y="351" class="tick">Synthetic utility values; observed validation and test scores may differ.</text></svg>