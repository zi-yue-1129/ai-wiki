<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" tabindex="0" aria-labelledby="title desc"><title id="title">Causal linear attention: recurrent state accumulation</title><desc id="desc">An illustrative scalar-feature recurrent linear attention. Each token contributes phi(k) times v to state S and phi(k) to state z. The normalized causal output is S divided by z for phi(q)=1. Exact cumulative states are 1/1, 1/3, 4/4, and 8/6.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf3f8"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;fill:#24465b} .top{font-weight:750;font-size:18px;letter-spacing:.3px}.small{font-size:12px;fill:#647f92}.tag{font-size:13px;font-weight:750}.value{font-size:21px;font-weight:760}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace} .dim{fill:#6d8495} @media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}.travel{display:none!important}}svg:hover animate,svg:focus animate{animation-play-state:paused}</style><rect width="800" height="432" rx="20" fill="url(#paper)"/><text x="26" y="38" class="top">RECURRENT LINEAR ATTENTION</text><text x="771" y="37" class="small" text-anchor="end">SCALAR FEATURE · φ(q) = 1</text><rect x="23" y="63" width="225" height="324" rx="14" fill="white" stroke="#d5e3ee"/><text x="43" y="92" class="tag">INPUT TOKENS</text><rect x="43" y="119" width="185" height="51" rx="9" fill="#f1f6fa" stroke="#dce7ee"/><text x="59" y="140" class="tag">t1</text><text x="59" y="158" class="small mono">k=1    v=1</text><rect x="40" y="116" width="191" height="57" rx="11" stroke="#e99c4d" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0.05;1;1;0.05;0.05" keyTimes="0.00000;0.01250;0.21500;0.25000;1.00000" dur="9s" repeatCount="indefinite"/></rect><rect x="43" y="181" width="185" height="51" rx="9" fill="#f1f6fa" stroke="#dce7ee"/><text x="59" y="202" class="tag">t2</text><text x="59" y="220" class="small mono">k=2    v=0</text><rect x="40" y="178" width="191" height="57" rx="11" stroke="#e99c4d" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.25000;0.26250;0.46500;0.50000;1.00000" dur="9s" repeatCount="indefinite"/></rect><rect x="43" y="243" width="185" height="51" rx="9" fill="#f1f6fa" stroke="#dce7ee"/><text x="59" y="264" class="tag">t3</text><text x="59" y="282" class="small mono">k=1    v=3</text><rect x="40" y="240" width="191" height="57" rx="11" stroke="#e99c4d" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.50000;0.51250;0.71500;0.75000;1.00000" dur="9s" repeatCount="indefinite"/></rect><rect x="43" y="305" width="185" height="51" rx="9" fill="#f1f6fa" stroke="#dce7ee"/><text x="59" y="326" class="tag">t4</text><text x="59" y="344" class="small mono">k=2    v=2</text><rect x="40" y="302" width="191" height="57" rx="11" stroke="#e99c4d" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05" keyTimes="0.00000;0.75000;0.76250;0.96500;1.00000" dur="9s" repeatCount="indefinite"/></rect><rect x="270" y="103" width="256" height="245" rx="14" fill="white" stroke="#d5e3ee"/><text x="289" y="135" class="tag">RUNNING STATE</text><path d="M298 149L498 149" stroke="#dce7ee" stroke-width="2" opacity="1" fill="none" /><text x="298" y="192" class="top">S</text><text x="298" y="258" class="top">z</text><rect x="349" y="156" width="144" height="52" rx="10" fill="#eaf5f8"/><rect x="349" y="222" width="144" height="52" rx="10" fill="#eaf5f8"/><g class="state-step" data-step="1" opacity="0"><text x="421" y="192" class="value mono" text-anchor="middle">1</text><text x="421" y="258" class="value mono" text-anchor="middle">1</text><animate attributeName="opacity" values="0.05;1;1;0.05;0.05" keyTimes="0.00000;0.01250;0.21500;0.25000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="state-step" data-step="2" opacity="0"><text x="421" y="192" class="value mono" text-anchor="middle">1</text><text x="421" y="258" class="value mono" text-anchor="middle">3</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.25000;0.26250;0.46500;0.50000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="state-step" data-step="3" opacity="0"><text x="421" y="192" class="value mono" text-anchor="middle">4</text><text x="421" y="258" class="value mono" text-anchor="middle">4</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.50000;0.51250;0.71500;0.75000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="state-step" data-step="4" opacity="0"><text x="421" y="192" class="value mono" text-anchor="middle">8</text><text x="421" y="258" class="value mono" text-anchor="middle">6</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05" keyTimes="0.00000;0.75000;0.76250;0.96500;1.00000" dur="9s" repeatCount="indefinite"/></g><text x="400" y="310" class="small mono" text-anchor="middle">S += k × v     z += k</text><rect x="555" y="148" width="222" height="157" rx="14" fill="white" stroke="#d5e3ee"/><text x="577" y="181" class="tag">NORMALISED</text><text x="577" y="198" class="tag">OUTPUT</text><rect x="575" y="216" width="180" height="57" rx="9" fill="#eaf5f8"/><g class="output-step" data-step="1" opacity="0"><text x="665" y="254" class="value mono" text-anchor="middle">1.00</text><animate attributeName="opacity" values="0.05;1;1;0.05;0.05" keyTimes="0.00000;0.01250;0.21500;0.25000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="output-step" data-step="2" opacity="0"><text x="665" y="254" class="value mono" text-anchor="middle">0.33</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.25000;0.26250;0.46500;0.50000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="output-step" data-step="3" opacity="0"><text x="665" y="254" class="value mono" text-anchor="middle">1.00</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.50000;0.51250;0.71500;0.75000;1.00000" dur="9s" repeatCount="indefinite"/></g><g class="output-step" data-step="4" opacity="0"><text x="665" y="254" class="value mono" text-anchor="middle">1.33</text><animate attributeName="opacity" values="0.05;0.05;1;1;0.05" keyTimes="0.00000;0.75000;0.76250;0.96500;1.00000" dur="9s" repeatCount="indefinite"/></g><path d="M249 219L270 219" stroke="#009eaa" stroke-width="3" opacity="1" fill="none" stroke-linecap="round"/><path d="M527 219L554 219" stroke="#009eaa" stroke-width="3" opacity="1" fill="none" stroke-linecap="round"/><circle class="travel" r="6" fill="#e99c4d"><animateMotion path="M249 219L268 219" dur="1.25s" repeatCount="indefinite"/></circle><circle class="travel" r="6" fill="#009eaa"><animateMotion path="M528 219L554 219" dur="1.25s" repeatCount="indefinite"/></circle><text x="26" y="414" class="small">One token updates the state; earlier keys/values are not replayed</text><circle cx="588" cy="351" r="7" fill="#dce7ee"/><circle cx="588" cy="351" r="7" fill="#009eaa" opacity="0"><animate attributeName="opacity" values="0.05;1;1;0.05;0.05" keyTimes="0.00000;0.01250;0.21500;0.25000;1.00000" dur="9s" repeatCount="indefinite"/></circle><circle cx="630" cy="351" r="7" fill="#dce7ee"/><circle cx="630" cy="351" r="7" fill="#009eaa" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.25000;0.26250;0.46500;0.50000;1.00000" dur="9s" repeatCount="indefinite"/></circle><circle cx="672" cy="351" r="7" fill="#dce7ee"/><circle cx="672" cy="351" r="7" fill="#009eaa" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05;0.05" keyTimes="0.00000;0.50000;0.51250;0.71500;0.75000;1.00000" dur="9s" repeatCount="indefinite"/></circle><circle cx="714" cy="351" r="7" fill="#dce7ee"/><circle cx="714" cy="351" r="7" fill="#009eaa" opacity="0"><animate attributeName="opacity" values="0.05;0.05;1;1;0.05" keyTimes="0.00000;0.75000;0.76250;0.96500;1.00000" dur="9s" repeatCount="indefinite"/></circle></svg>