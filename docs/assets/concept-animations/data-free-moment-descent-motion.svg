<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Synthetic moment matching</title><desc>A synthetic pair m minus s and m plus s approaches target mean 2 and standard deviation 1. The orange mean marker and blue spread move over five gradient descent steps; the loss decreases by a factor of four each step.</desc><rect width="640" height="360" fill="#fff"/><text x="320" y="28" font-size="21" text-anchor="middle" fill="#243447">Match frozen feature statistics</text><rect x="18" y="47" width="604" height="245" rx="4" fill="#f2f5f8" /><text x="31" y="72" font-size="15" text-anchor="start" fill="#243447">Target moments</text><text x="31" y="151" font-size="15" text-anchor="start" fill="#243447">Synthetic</text><line x1="80" y1="83" x2="80" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="80" y="255" font-size="12" text-anchor="middle" fill="#243447">-2</text><line x1="160" y1="83" x2="160" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="160" y="255" font-size="12" text-anchor="middle" fill="#243447">-1</text><line x1="240" y1="83" x2="240" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="240" y="255" font-size="12" text-anchor="middle" fill="#243447">0</text><line x1="320" y1="83" x2="320" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="320" y="255" font-size="12" text-anchor="middle" fill="#243447">1</text><line x1="400" y1="83" x2="400" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="400" y="255" font-size="12" text-anchor="middle" fill="#243447">2</text><line x1="480" y1="83" x2="480" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="480" y="255" font-size="12" text-anchor="middle" fill="#243447">3</text><line x1="560" y1="83" x2="560" y2="238" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="560" y="255" font-size="12" text-anchor="middle" fill="#243447">4</text><line x1="80" y1="104" x2="560" y2="104" stroke="#8494a8" stroke-width="1"/><line x1="80" y1="183" x2="560" y2="183" stroke="#8494a8" stroke-width="1"/><circle cx="320" cy="104" r="10" fill="#08766f" ></circle><circle cx="480" cy="104" r="10" fill="#08766f" ></circle><line x1="400" y1="88" x2="400" y2="120" stroke="#08766f" stroke-width="3"/><text x="400" y="78" font-size="13" text-anchor="middle" fill="#08766f">Mean 2</text><circle cx="140" cy="183" r="11" fill="none" stroke="#8494a8" stroke-width="2" stroke-dasharray="3 3"></circle><circle cx="180" cy="183" r="11" fill="none" stroke="#8494a8" stroke-width="2" stroke-dasharray="3 3"></circle><circle cx="140" cy="183" r="8" fill="#315c85" ><animate attributeName="cx" values="140;140;230;275;297.5;308.75;314.375;314.375;140" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="180" cy="183" r="8" fill="#315c85" ><animate attributeName="cx" values="180;180;330;405;442.5;461.25;470.625;470.625;180" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/></circle><rect x="158" y="168" width="4" height="30" fill="#a05c20"><animate attributeName="x" values="158;158;278;338;368;383;390.5;390.5;158" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/></rect><line x1="140" y1="212" x2="180" y2="212" stroke="#315c85" stroke-width="3"><animate attributeName="x1" values="140;140;230;275;297.5;308.75;314.375;314.375;140" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="180;180;330;405;442.5;461.25;470.625;470.625;180" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/></line><text x="31" y="279" font-size="13" text-anchor="start" fill="#243447">Dashed circles: start</text><text x="610" y="279" font-size="13" text-anchor="end" fill="#243447">Orange: mean</text><text x="22" y="319" font-size="15" text-anchor="start" fill="#243447">Moment loss</text><rect x="145" y="304" width="460" height="19" rx="4" fill="#e2e8f0" /><rect x="145" y="304" width="460" height="19" rx="4" fill="#a05c20"><animate attributeName="width" values="460;460;115;28.75;7.1875;1.7969;0.4492;0.4492;460" keyTimes="0;0.1;0.25;0.4;0.55;0.7;0.84;0.96;1" dur="12s" repeatCount="indefinite"/></rect><text x="145" y="344" font-size="12" text-anchor="start" fill="#243447">0</text><text x="605" y="344" font-size="12" text-anchor="end" fill="#243447">9.5625</text></svg>
