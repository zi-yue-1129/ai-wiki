<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Prioritized replay: store, prioritize, sample and refresh</title><desc id="desc">Six transitions enter a replay buffer, receive priorities, one high-priority example is sampled for a learner, and its priority is refreshed after a new TD-error estimate. Selection is stochastic, not a deterministic maximum.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#ffffff" stroke="none" /><text x="28" y="38" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#0f172a" font-weight="700">Prioritized experience replay</text><rect x="24" y="67" width="476" height="233" rx="13" fill="#f8fafc" stroke="#d8e3ed" /><rect x="520" y="131" width="102" height="111" rx="13" fill="#edf5fb" stroke="#9ebed6" /><text x="571" y="172" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#215b8a" text-anchor="middle" font-weight="700">Learner</text><text x="571" y="194" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#53738d" text-anchor="middle">TD error</text><text x="38" y="94" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#334155" font-weight="700">Replay buffer</text><rect x="40" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="73" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T1</text><rect x="61" y="207" width="24" height="21" rx="4" fill="#7ba9cb" stroke="none" /><line x1="52" y1="229" x2="94" y2="229" stroke="#cbd5e1" stroke-width="1" /><rect x="115" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="148" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T2</text><rect x="136" y="191" width="24" height="37" rx="4" fill="#7ba9cb" stroke="none" /><line x1="127" y1="229" x2="169" y2="229" stroke="#cbd5e1" stroke-width="1" /><rect x="190" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="223" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T3</text><rect x="211" y="201" width="24" height="27" rx="4" fill="#7ba9cb" stroke="none" /><line x1="202" y1="229" x2="244" y2="229" stroke="#cbd5e1" stroke-width="1" /><rect x="265" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="298" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T4</text><rect x="286" y="159" width="24" height="69" rx="4" fill="#e8a15a" stroke="none" /><line x1="277" y1="229" x2="319" y2="229" stroke="#cbd5e1" stroke-width="1" /><rect x="340" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="373" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T5</text><rect x="361" y="197" width="24" height="31" rx="4" fill="#7ba9cb" stroke="none" /><line x1="352" y1="229" x2="394" y2="229" stroke="#cbd5e1" stroke-width="1" /><rect x="415" y="118" width="66" height="140" rx="9" fill="#ffffff" stroke="#cddbe8" /><text x="448" y="142" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">T6</text><rect x="436" y="184" width="24" height="44" rx="4" fill="#7ba9cb" stroke="none" /><line x1="427" y1="229" x2="469" y2="229" stroke="#cbd5e1" stroke-width="1" /><path d="M 491 177 L 518 177 L 510 172 M 518 177 L 510 182" fill="none" stroke="#2775b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 521 218 L 493 218 L 501 213 M 493 218 L 501 223" fill="none" stroke="#dc6b43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g opacity="1"><rect x="415" y="116" width="70" height="144" rx="10" fill="none" stroke="#2775b6" stroke-width="3"/><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="59" y="205" width="28" height="25" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><rect x="134" y="189" width="28" height="41" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><rect x="209" y="199" width="28" height="31" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><rect x="284" y="157" width="28" height="73" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><rect x="359" y="195" width="28" height="35" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><rect x="434" y="182" width="28" height="48" rx="5" fill="none" stroke="#2775b6" stroke-width="2"/><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="265" y="116" width="70" height="144" rx="10" fill="none" stroke="#e28b35" stroke-width="3"/><rect x="522" y="129" width="98" height="115" rx="12" fill="none" stroke="#e28b35" stroke-width="3"/><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="265" y="116" width="70" height="144" rx="10" fill="none" stroke="#2775b6" stroke-width="3"/><rect x="285" y="158" width="26" height="70" rx="3" fill="#ffffff" stroke="none" /><rect x="286" y="193" width="24" height="35" rx="3" fill="#2775b6" stroke="none" /><animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g opacity="1"><rect x="506" y="13" width="110" height="32" rx="16" fill="#e8f1f9" stroke="none" /><text x="561" y="34" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#215b8a" text-anchor="middle" font-weight="700">1/4 STORE</text><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1" keyTimes="0;0.25;0.