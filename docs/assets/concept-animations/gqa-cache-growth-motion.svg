<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Incremental KV-cache growth with grouped-query attention</title><desc id="d">Ten decoding tokens grow an eight-head multi-head cache by eight key/value-head slots each versus two per token with two-head GQA. Endpoint counts are eighty and twenty, respectively.</desc>
<rect x="0" y="0" width="640" height="360" rx="18" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#26334c}.small{font-size:12px}.tiny{font-size:10px}.title{font-size:19px;font-weight:700}.label{font-size:14px;font-weight:650}</style>
<text x="28" y="36" class="title">KV cache grows one token at a time</text><text x="28" y="57" class="small" fill="#64748b" style="fill:#64748b">Hq = 8  |  Hkv = 2</text><path d="M86 282.0H500" stroke="#edf1f7" stroke-width="1"/><path d="M86 234.0H500" stroke="#edf1f7" stroke-width="1"/><path d="M86 186.0H500" stroke="#edf1f7" stroke-width="1"/><path d="M86 138.0H500" stroke="#edf1f7" stroke-width="1"/><path d="M86 90.0H500" stroke="#edf1f7" stroke-width="1"/><path d="M86.0 282.0 L500.0 282.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M86.0 282.0 L86.0 83.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="78" y="286.0" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="end">0</text><text x="78" y="238.0" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="end">20</text><text x="78" y="190.0" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="end">40</text><text x="78" y="142.0" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="end">60</text><text x="78" y="94.0" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="end">80</text><text x="88" y="85" class="small" fill="#64748b" style="fill:#64748b">KV slots</text><text x="304" y="86" class="small" fill="#64748b" style="fill:#64748b" text-anchor="middle">Decoded tokens →</text><text x="86" y="300" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="middle">1</text><text x="224" y="300" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="middle">4</text><text x="362" y="300" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="middle">7</text><text x="500" y="300" class="tiny" fill="#64748b" style="fill:#64748b" text-anchor="middle">10</text><path d="M86.0 262.8 L132.0 243.6 L178.0 224.4 L224.0 205.2 L270.0 186.0 L316.0 166.8 L362.0 147.6 L408.0 128.4 L454.0 109.2 L500.0 90.0" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M86.0 277.2 L132.0 272.4 L178.0 267.6 L224.0 262.8 L270.0 258.0 L316.0 253.2 L362.0 248.4 L408.0 243.6 L454.0 238.8 L500.0 234.0" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="500.0" cy="90.0" r="9" fill="#2563eb" stroke="#fff" stroke-width="2.8"><animate attributeName="cx" values="86.0;132.0;178.0;224.0;270.0;316.0;362.0;408.0;454.0;500.0" dur="11s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="cy" values="262.8;243.6;224.4;205.2;186.0;166.8;147.6;128.4;109.2;90.0" dur="11s" calcMode="discrete" repeatCount="indefinite"/></circle><circle cx="500.0" cy="234.0" r="9" fill="#0d9488" stroke="#fff" stroke-width="2.8"><animate attributeName="cx" values="86.0;132.0;178.0;224.0;270.0;316.0;362.0;408.0;454.0;500.0" dur="11s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="cy" values="277.2;272.4;267.6;262.8;258.0;253.2;248.4;243.6;238.8;234.0" dur="11s" calcMode="discrete" repeatCount="indefinite"/></circle><rect x="518" y="80" width="104" height="52" rx="8" fill="#eff6ff"/><text x="528" y="99" class="small" fill="#2563eb" style="fill:#2563eb">MHA · 8 KV</text><text x="528" y="119" class="label" fill="#2563eb" style="fill:#2563eb">80 slots</text><rect x="518" y="209" width="104" height="52" rx="8" fill="#e7f9f5"/><text x="528" y="228" class="small" fill="#0d9488" style="fill:#0d9488">GQA · 2 KV</text><text x="528" y="248" class="label" fill="#0d9488" style="fill:#0d9488">20 slots</text><rect x="73" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="86" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">1</text><rect x="119" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="132" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">2</text><rect x="165" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="178" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">3</text><rect x="211" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="224" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">4</text><rect x="257" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="270" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">5</text><rect x="303" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="316" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">6</text><rect x="349" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="362" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">7</text><rect x="395" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="408" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">8</text><rect x="441" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="454" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">9</text><rect x="487" y="318" width="26" height="23" rx="4" fill="#e2e8f0" stroke="#b7c3d3"/><text x="500" y="334" class="tiny" fill="#475569" style="fill:#475569" text-anchor="middle">10</text><rect x="485" y="315" width="30" height="29" rx="5" fill="none" stroke="#ea580c" stroke-width="3"><animate attributeName="x" values="71;117;163;209;255;301;347;393;439;485" dur="11s" calcMode="discrete" repeatCount="indefinite"/></rect></svg>