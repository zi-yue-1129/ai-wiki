<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>RoPE cache eviction: why packed indices must not replace rotary positions</title><desc>For synthetic key index two and query index six the relative distance is four. Evicting indices one, three and four and incorrectly reindexing the retained tokens makes it two. At rotation frequency pi over six, cosine changes from negative to positive one half.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#0b1324" /><text x="24" y="37" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">RoPE / POSITION-INDEX INTEGRITY</text><text x="24" y="61" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500">One rotary pair · omega = pi/6 · q = k = (1,0)</text><rect x="18" y="77" width="604" height="120" rx="12" fill="#15243a" /><rect x="18" y="210" width="604" height="124" rx="12" fill="#15243a" /><text x="34" y="99" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Original indices</text><text x="34" y="229" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Packed indices · incorrect reindexing</text><rect x="40" y="120" width="49" height="42" rx="7" fill="#344962" /><text x="64.5" y="145" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">0</text><rect x="102" y="120" width="49" height="42" rx="7" fill="#344962" /><path d="M 109 127 L 144 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><path d="M 144 127 L 109 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><text x="126.5" y="145" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text><rect x="164" y="120" width="49" height="42" rx="7" fill="#6de6cb" /><text x="188.5" y="145" fill="#0b1324" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text><rect x="226" y="120" width="49" height="42" rx="7" fill="#344962" /><path d="M 233 127 L 268 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><path d="M 268 127 L 233 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><text x="250.5" y="145" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text><rect x="288" y="120" width="49" height="42" rx="7" fill="#344962" /><path d="M 295 127 L 330 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><path d="M 330 127 L 295 155" fill="none" stroke="#ff788a" stroke-width="2.7" stroke-linecap="round" /><text x="312.5" y="145" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">4</text><rect x="350" y="120" width="49" height="42" rx="7" fill="#344962" /><text x="374.5" y="145" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">5</text><rect x="412" y="120" width="49" height="42" rx="7" fill="#ffba75" /><text x="436.5" y="145" fill="#0b1324" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">6</text><text x="170" y="183" fill="#6de6cb" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">K: 2</text><text x="346" y="183" fill="#ffba75" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Q: 6</text><rect x="45" y="246" width="55" height="42" rx="7" fill="#344962" /><text x="72" y="272" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">0</text><text x="72" y="311" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">0</text><rect x="127" y="246" width="55" height="42" rx="7" fill="#6de6cb" /><text x="154" y="272" fill="#0b1324" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="154" y="311" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">1</text><rect x="209" y="246" width="55" height="42" rx="7" fill="#344962" /><text x="236" y="272" fill="#e8f0fa" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">5</text><text x="236" y="311" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">2</text><rect x="291" y="246" width="55" height="42" rx="7" fill="#ffba75" /><text x="318" y="272" fill="#0b1324" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">6</text><text x="318" y="311" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">3</text><text x="45" y="326" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="500">Token IDs above, new positions below</text><rect x="497" y="113" width="108" height="65" rx="9" fill="#263d55" /><text x="508" y="135" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">delta = 4</text><text x="508" y="159" fill="#6de6cb" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">cos(4w) = -0.5</text><rect x="497" y="245" width="108" height="65" rx="9" fill="#263d55" /><text x="508" y="266" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">delta = 2</text><text x="508" y="290" fill="#ffba75" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">cos(2w) = +0.5</text><text x="24" y="351" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">Storage index != position index</text></svg>