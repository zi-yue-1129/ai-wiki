th="3" /><text x="334" y="113" fill="#233b52" font-size="17" text-anchor="start">Dot product</text><text x="334" y="223" fill="#233b52" font-size="17" text-anchor="start">Cosine</text><text x="349" y="144" fill="#087d70" font-size="16" text-anchor="middle">A</text><rect x="370" y="126" width="225" height="23" rx="4" fill="#edf2f6" /><text x="349" y="179" fill="#a95516" font-size="16" text-anchor="middle">B</text><rect x="370" y="161" width="225" height="23" rx="4" fill="#edf2f6" /><rect x="370" y="161" width="90" height="23" rx="4" fill="#a95516" /><text x="349" y="254" fill="#087d70" font-size="16" text-anchor="middle">A</text><rect x="370" y="236" width="225" height="23" rx="4" fill="#edf2f6" /><rect x="370" y="236" width="120" height="23" rx="4" fill="#087d70" /><text x="349" y="289" fill="#a95516" font-size="16" text-anchor="middle">B</text><rect x="370" y="271" width="225" height="23" rx="4" fill="#edf2f6" /><rect x="370" y="271" width="90" height="23" rx="4" fill="#a95516" /><text x="370" y="320" fill="#233b52" font-size="14" text-anchor="middle">0</text><text x="445" y="320" fill="#233b52" font-size="14" text-anchor="middle">0.5</text><text x="520" y="320" fill="#233b52" font-size="14" text-anchor="middle">1</text><text x="595" y="320" fill="#233b52" font-size="14" text-anchor="middle">1.5</text><line x1="48" y1="262" x2="108" y2="217" stroke="#087d70" stroke-width="4" /><circle cx="108" cy="217" r="6" fill="#087d70"></circle><rect x="370" y="126" width="60" height="23" rx="4" fill="#087d70" /></svg>