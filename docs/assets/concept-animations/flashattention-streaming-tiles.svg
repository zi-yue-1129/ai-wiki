<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" tabindex="0" aria-labelledby="fa-title fa-desc">
<title id="fa-title">FlashAttention: streaming key-value tiles through on-chip SRAM</title>
<desc id="fa-desc">A fixed query block is paired with four successive key-value blocks. The active score tile advances across SRAM, and all running output rows update together. Animation pauses when the standalone SVG receives keyboard focus. Reduced-motion mode shows the first tile without animation.</desc>
<defs>
  <linearGradient id="fa-bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#eef5f7"/></linearGradient>
  <marker id="fa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#68899a" stroke-width="1.6" stroke-linejoin="round"/></marker>
</defs>
<style>
  text{font-family:system-ui,-apple-system,sans-serif;fill:#244153} .heading{font-size:19px;font-weight:720;letter-spacing:.25px}.sub{font-size:11px;fill:#6c8493;letter-spacing:1.2px;font-weight:650}.tag{font-size:13px;font-weight:700;letter-spacing:1px}.small{font-size:11px;font-weight:650;fill:#78919f}
  .frame{fill:#fff;stroke:#cbdce4;stroke-width:1.4}.wire{fill:none;stroke:#88a3b1;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#fa-arrow)}
  .phase0{animation:fa0 8s steps(1,end) infinite}.phase1{animation:fa1 8s steps(1,end) infinite}.phase2{animation:fa2 8s steps(1,end) infinite}.phase3{animation:fa3 8s steps(1,end) infinite}
  .output-fill{transform-box:fill-box;transform-origin:left center;animation:fa-out 8s steps(1,end) infinite}
  @keyframes fa0{0%,24.99%{opacity:1}25%,100%{opacity:.23}}@keyframes fa1{0%,24.99%{opacity:.23}25%,49.99%{opacity:1}50%,100%{opacity:.23}}@keyframes fa2{0%,49.99%{opacity:.23}50%,74.99%{opacity:1}75%,100%{opacity:.23}}@keyframes fa3{0%,74.99%{opacity:.23}75%,100%{opacity:1}}
  @keyframes fa-out{0%,24.99%{transform:scaleX(.25)}25%,49.99%{transform:scaleX(.48)}50%,74.99%{transform:scaleX(.72)}75%,100%{transform:scaleX(1)}}
  svg:hover .phase0,svg:hover .phase1,svg:hover .phase2,svg:hover .phase3,svg:hover .output-fill,svg:focus .phase0,svg:focus .phase1,svg:focus .phase2,svg:focus .phase3,svg:focus .output-fill{animation-play-state:paused}
  @media(prefers-reduced-motion:reduce){.phase0,.phase1,.phase2,.phase3,.output-fill{animation:none}.phase0{opacity:1}.phase1,.phase2,.phase3{opacity:.23}.output-fill{transform:scaleX(.25)}}
</style>
<rect width="760" height="370" rx="20" fill="url(#fa-bg)"/>
<text x="34" y="40" class="heading">FlashAttention</text><text x="34" y="61" class="sub">STREAMED TILES · ONLINE SOFTMAX</text>
<text x="107" y="99" class="tag" text-anchor="middle">Q</text><text x="107" y="209" class="tag" text-anchor="middle">K / V</text><text x="380" y="99" class="tag" text-anchor="middle">SRAM</text><text x="635" y="99" class="tag" text-anchor="middle">RUNNING O</text>
<path class="wire" d="M180 144H244Q267 144 293 170"/><path class="wire" d="M180 275H244Q266 275 293 247"/><path class="wire" d="M473 201H554"/>
<rect x="35" y="110" width="145" height="74" rx="13" class="frame"/>
