<rect class="phase3" x="427" y="168" width="32" height="32" rx="6"/>
<rect class="phase3" x="427" y="205" width="32" height="32" rx="6"/>
<rect class="phase3" x="427" y="242" width="32" height="32" rx="6"/>
</g>
<rect x="554" y="117" width="170" height="172" rx="16" class="frame"/>
<g fill="#e7eef2"><rect x="572" y="139" width="130" height="18" rx="6"/><rect x="572" y="175" width="130" height="18" rx="6"/><rect x="572" y="211" width="130" height="18" rx="6"/><rect x="572" y="247" width="130" height="18" rx="6"/></g>
<g fill="#438db0"><rect class="output-fill" x="572" y="139" width="120" height="18" rx="6"/><rect class="output-fill" x="572" y="175" width="87" height="18" rx="6"/><rect class="output-fill" x="572" y="211" width="108" height="18" rx="6"/><rect class="output-fill" x="572" y="247" width="69" height="18" rx="6"/></g>
<text x="380" y="322" text-anchor="middle" class="small">ONE TEMPORARY SCORE TILE AT A TIME</text>
</svg>
