<rect x="293" y="117" width="180" height="172" rx="16" fill="#eaf2f5" stroke="#b8cfd9" stroke-width="1.5"/>
<g fill="#3b9b93">
<rect class="phase0" x="307" y="131" width="32" height="32" rx="6"/>
