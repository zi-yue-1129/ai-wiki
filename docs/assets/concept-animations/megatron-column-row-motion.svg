<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Megatron tensor-parallel MLP: column split then row split</title><desc id="desc">Both ranks receive the same input X. Each computes a distinct column partition of the first projection, a local GeLU and a row partition of the second projection. Two partial outputs are combined by one all-reduce to obtain Y on both ranks. Illustrative timing.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.title{font-size:19px;font-weight:700}.sub{font-size:11px;fill:#526b7d}.row{font-size:13px;font-weight:700}.small{font-size:11px;font-weight:700}.tiny{font-size:10px;font-weight:700;text-anchor:middle}.white{fill:#fff}.center{text-anchor:middle}@media (prefers-reduced-motion: reduce){.motion-particle{opacity:0!important}#tp-partial-0,#tp-partial-1,#tp-output{opacity:1!important}}</style><rect width="640" height="360" rx="18" fill="#f7fafc"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d7e2e9"/><text x="24" y="35" class="title" >Megatron · column → row parallel</text><text x="24" y="56" class="sub" >Local GeLU · local partial sums · one all-reduce</text><rect x="280" y="74" width="80" height="35" rx="6" fill="#e8eff7" stroke="#9eb9d0"/><text x="320" y="97" class="row center" >X</text><path d="M305 109Q247 122 176 143 M335 109Q393 122 464 143" stroke="#9eb1bf" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="45" y="143" width="258" height="132" rx="6" fill="#fff" stroke="#d7e2e9"/><text x="63" y="165" class="row" >GPU 0</text><rect x="63" y="186" width="66" height="39" rx="6" fill="#4e87bf" /><text x="96" y="210" class="tiny" style="fill:#fff">A1</text><path d="M131 205h10" stroke="#9eb1bf" stroke-width="2"/><rect x="143" y="186" width="66" height="39" rx="6" fill="#e9eff3" /><text x="176" y="210" class="tiny" >GeLU</text><path d="M211 205h10" stroke="#9eb1bf" stroke-width="2"/><rect x="223" y="186" widt