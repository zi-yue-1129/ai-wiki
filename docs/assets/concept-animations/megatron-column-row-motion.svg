ttributeName="opacity" values="0;0;1;1" keyTimes="0;.45;.50;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></g><circle class="motion-particle" r="5" fill="#e69a42" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.015;0.030;0.210;0.225;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M320 109 Q394 123 468 143" keyPoints="0;0;1;1" keyTimes="0;0.030;0.210;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></circle><circle class="motion-particle" r="5" fill="#e69a42" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.215;0.230;0.430;0.445;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M388 206 H553" keyPoints="0;0;1;1" keyTimes="0;0.230;0.430;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></circle><path d="M238 268Q261 288 296 303 M530 268Q432 290 344 303" stroke="#9eb1bf" stroke-width="2" stroke-dasharray="5 5" fill="none"/><circle class="motion-particle" r="5" fill="#8d6ac2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.505;0.520;0.700;0.715;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M238 268 Q261 288 296 303" keyPoints="0;0;1;1" keyTimes="0;0.520;0.700;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></circle><circle class="motion-particle" r="5" fill="#8d6ac2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.505;0.520;0.700;0.715;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M530 268 Q432 290 344 303" keyPoints="0;0;1;1" keyTimes="0;0.520;0.700;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></circle><rect x="265" y="292" width="111" height="36" rx="6" fill="#e9f5f2" stroke="#73b5ab"/><text x="320" y="315" class="small center" >All-reduce</text><path d="M376 310H405" stroke="#9eb1bf" stroke-width="2.5"/><g id="tp-output" opacity="0"><rect x="411" y="292" width="74" height="36" rx="6" fill="#138a81" /><text x="448" y="315" class="row center" style=