<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">OpenVLA dual visual encoders</title><desc id="desc">One camera image flows through DINOv2 and SigLIP. Patch-aligned channel features are concatenated and projected to Llama tokens. This is a schematic data flow, not recorded model activations.</desc><style>@media(prefers-reduced-motion:reduce){.motion-overlay{display:none!important}.static-overlay{display:inline!important}}text{font-family:Arial,Helvetica,sans-serif}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbfe" stroke="none"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d7e4ee"/><text x="25" y="37" text-anchor="start" font-size="21" font-weight="700" fill="#21374d">OpenVLA</text><text x="25" y="59" text-anchor="start" font-size="13" font-weight="500" fill="#53697d">Parallel visual encoding and patch-aligned fusion</text><rect x="26" y="113" width="120" height="166" rx="8" fill="#fff" stroke="#d7e4ee"/><text x="86" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#21374d">Camera</text><rect x="38" y="151" width="96" height="103" rx="6" fill="#dfedf2" stroke="none"/><path d="M38 224L67 196L97 207L134 182L134 254L38 254Z" fill="#bfd6db"/><path d="M48 166H64L83 201" fill="none" stroke="#4f8491" stroke-width="7" stroke-linecap="round"/><circle cx="83" cy="201" r="7" fill="#edf7f8"/><rect x="81" y="212" width="39" height="26" rx="4" fill="#d5a97a" stroke="none"/><rect x="176" y="110" width="108" height="70" rx="11" fill="#eaf3fd" stroke="#bfd5e8"/><text x="230" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#477cac">DINOv2</text><text x="230" y="159" text-anchor="middle" font-size="12" font-weight="500" fill="#53697d">Features</text><rect x="176" y="208" width="108" height="70" rx="11" fill="#fff2e2" stroke="#efd4af"/><text x="230" y="239" text-anchor="middle" font-size="16" font-weight="700" fill="#c47d38">SigLIP</text><text x="230" y="258" text-anchor="middle" font-size="12" font-weight="500" fill="#53697d">Features</text><path d="M146 197H160V145H176" fill="none" stroke="#477cac" stroke-width="2.4"/><path d="M160 197V243H176" fill="none" stroke="#c47d38" stroke-width="2.4"/><path d="M284 145L318 145" stroke="#477cac" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="" fill="none"/><path d="M284 243L318 243" stroke="#c47d38" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="" fill="none"/><rect x="318" y="110" width="114" height="170" rx="8" fill="#fff" stroke="#d7e4ee"/><text x="375" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#53697d">Patches</text><rect x="333" y="149" width="13" height="44" rx="2" fill="#477cac" stroke="none"/><rect x="350" y="149" width="13" height="44" rx="2" fill="#477cac" stroke="none"/><rect x="367" y="149" width="13" height="44" rx="2" fill="#477cac" stroke="none"/><rect x="384" y="149" width="13" height="44" rx="2" fill="#477cac" stroke="none"/><rect x="401" y="149" width="13" height="44" rx="2" fill="#477cac" stroke="none"/><rect x="333" y="223" width="13" height="44" rx="2" fill="#c47d38" stroke="none"/><rect x="350" y="223" width="13" height="44" rx="2" fill="#c47d38" stroke="none"/><rect x="367" y="223" width="13" height="44" rx="2" fill="#c47d38" stroke="none"/><rect x="384" y="223" width="13" height="44" rx="2" fill="#c47d38" stroke="none"/><rect x="401" y="223" width="13" height="44" rx="2" fill="#c47d38" stroke="none"/><text x="375" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#21374d">Concat</text><rect x="460" y="170" width="68" height="52" rx="10" fill="#efeafa" stroke="#d2c5ed"/><text x="494" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#7760af">MLP</text><rect x="550" y="170" width="74" height="52" rx="10" fill="#e6f7ef" stroke="#c2e3d3"/><text x="587" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#168569">Llama</text><text x="587" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#168569">2</text><path d="M432 195L460 195" stroke="#7760af" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="" fill="none"/><path d="M528 195L550 195" stroke="#168569" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="" fill="none"/><text x="86" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#53697d">One image</text><text x="230" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#53697d">Two encoders</text><text x="375" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#53697d">Channel fusion</text><text x="541" y="311" text-anchor="middle" font-size="13" font-weight="500" fill="#53697d">VLM tokens</text><path d="M27 327L614 327" stroke="#d7e4ee" stroke-width="1" stroke-linecap="round" stroke-dasharray="" fill="none"/><text x="27" y="347" text-anchor="start" font-size="10" font-weight="500" fill="#53697d">Schematic features; not a measured forward pass</text><g class="motion-overlay"><circle cx="146" cy="183" r="5" fill="#477cac"><animate attributeName="cx" values="146;160;160;176;176;146" keyTimes="0;0.12;0.30;0.44;0.94;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="183;183;145;145;145;183" keyTimes="0;0.12;0.30;0.44;0.94;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="284" cy="145" r="5" fill="#477cac"><animate attributeName="cx" values="284;284;320;320;284" keyTimes="0;0.35;0.56;0.94;1" dur="10s" repeatCount="indefinite"/></circle><rect x="333" y="149" width="13" height="44" fill="#fff" opacity="0.7"><animate attributeName="x" values="333;333;401;401;333" keyTimes="0;0.42;0.63;0.94;1" dur="10s" repeatCount="indefinite"/></rect><circle cx="146" cy="212" r="5" fill="#c47d38"><animate attributeName="cx" values="146;160;160;176;176;146" keyTimes="0;0.12;0.30;0.44;0.94;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="212;