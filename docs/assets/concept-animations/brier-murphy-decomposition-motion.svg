<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Murphy decomposition of the Brier score</title><desc id="desc">Ten illustrative binary outcomes in two forecast groups, five at 0.2 with observed rate 0.4, five at 0.8 with observed rate 0.6. The Brier score is uncertainty 0.25, plus reliability 0.04, minus resolution 0.01, giving 0.28. A moving marker traces each term. These are constructed cases, not model measurements.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#223c51}.heading{font-size:16px;font-weight:750;letter-spacing:.5px}.tag{font-size:11px;font-weight:700;letter-spacing:.5px;fill:#617c8f}.number{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}.metric{font-size:14px;font-weight:750}.small{font-size:11px;fill:#677e91}.moving{display:inline}.static-stage{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.static-stage{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#eef5fa"/><rect x="14" y="14" width="612" height="332" rx="13" fill="#fff" stroke="#d7e4ed"/><text x="32" y="42" class="heading">BRIER SCORE  ·  THREE COMPONENTS</text><rect x="30" y="60" width="280" height="235" fill="#f7fafc" rx="10" stroke="#dce8ef"/><rect x="324" y="60" width="284" height="235" fill="#f7fafc" rx="10" stroke="#dce8ef"/><text x="46" y="81" class="tag">FORECAST  /  OBSERVED</text><text x="344" y="81" class="tag">UNCERTAINTY  ±  SKILL</text><text x="46" y="106" class="metric">LOW · n=5</text><text x="46" y="126" class="small">p</text><rect x="70" y="116" width="35" height="12" fill="#329ab5" rx="3"/><text x="261" y="126" class="small" text-anchor="end">0.2</text><text x="46" y="151" class="small">y</text><rect x="70" y="140" width="70" height="12" fill="#f0a760" rx="3"/><text x="261" y="151" class="small" text-anchor="end">0.4</text><rect x="70" y="157" width="175" height="1" fill="#c8d7e0"/><text x="46" y="191" class="metric">HIGH · n=5</text><text x="46" y="211" class="small">p</text><rect x="70" y="201" width="140" height="12" fill="#329ab5" rx="3"/><text x="261" y="211" class="small" text-anchor="end">0.8</text><text x="46" y="236" class="small">y</text><rect x="70" y="225" width="105" height="12" fill="#f0a760" rx="3"/><text x="261" y="236" class="small" text-anchor="end">0.6</text><rect x="70" y="242" width="175" height="1" fill="#c8d7e0"/><text x="46" y="274" class="small">BLUE  forecast</text><text x="172" y="274" class="small">ORANGE  observed</text><text x="343" y="119" class="metric">UNC  +0.250</text><rect x="345" y="135" width="180" height="23" fill="#b3cadb" rx="5"/><text x="343" y="187" class="metric">REL  +0.040</text><rect x="525" y="172" width="29" height="23" fill="#f0a760" rx="4"/><text x="343" y="238" class="metric">RES  −0.010</text><rect x="547" y="223" width="7" height="23" fill="#ed8290" rx="2"/><rect x="345" y="257" width="202" height="5" fill="#258f9e" rx="2"/><text x="345" y="282" class="number">BS = 0.280</text><g class="moving"><circle cx="525" cy="146" r="9" fill="#fff" stroke="#187f95" stroke-width="3"><animate attributeName="cx" values="525;525;554;554;547;547;525" keyTimes="0;.28;.40;.63;.72;.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="146;146;183;183;235;235;259" keyTimes="0;.28;.40;.63;.72;.92;1" dur="12s" repeatCount="indefinite"/></circle><rect x="342" y="126" width="186" height="41" rx="7" fill="none" stroke="#137f9e" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.06;0.3;0.345;1" dur="12s" repeatCount="indefinite"/></rect><rect x="522" y="168" width="35" height="30" rx="5" fill="none" stroke="#137f9e" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.39999999999999997;0.64;0.685;1" dur="12s" repeatCount="indefinite"/></rect><rect x="543" y="219" width="14" height="30" rx="4" fill="none" stroke="#137f9e" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7200000000000001;0.92;0.9650000000000001;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="static-stage"><circle cx="547" cy="259" r="7" fill="#187f95"/></g><rect x="30" y="310" width="578" height="22" fill="#eaf1f5" rx="5"/><text x="44" y="325" class="small">10 constructed observations  •  5 positives  •  identical probabilities within each group</text></svg>