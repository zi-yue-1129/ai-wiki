<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Temperature scaling: static softmax confidence with unchanged winning class</title><desc id="desc">Fixed illustrative logits 3, 1, 0 produce softmax probabilities that change with temperature. The predicted class A remains unchanged. The animation samples the exact softmax formula at 41 temperature points; intermediate frames are interpolated, not model measurements.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4f9"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#29465a}.muted{fill:#6b8293}.tag{font-size:12px;font-weight:700;letter-spacing:1px}.name{font-size:15px;font-weight:700}.small{font-size:12px}.bold{font-weight:700}@media(prefers-reduced-motion:reduce){animate{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#paper)"/><text x="28" y="35" class="tag muted">TEMPERATURE SCALING</text><text x="28" y="64" class="small muted">Fixed logits</text><rect x="166" y="44" width="86" height="30" rx="9" fill="white" stroke="#d8e3ec"/><text x="209" y="64" text-anchor="middle" class="small bold">A: 3</text><rect x="268" y="44" width="86" height="30" rx="9" fill="white" stroke="#d8e3ec"/><text x="311" y="64" text-anchor="middle" class="small bold">B: 1</text><rect x="370" y="44" width="86" height="30" rx="9" fill="white" stroke="#d8e3ec"/><text x="413" y="64" text-anchor="middle" class="small bold">C: 0</text><rect x="30" y="90" width="580" height="206" rx="12" fill="white" stroke="#d8e3ec"/><path d="M87 260H556" stroke="#bacbd6" stroke-width="1.5"/><line x1="87" y1="112" x2="556" y2="112" stroke="#e8eef3"/><text x="76" y="116" text-anchor="end" class="small muted">1.0</text><line x1="87" y1="186" x2="556" y2="186" stroke="#e8eef3"/><text x="76" y="190" text-anchor="end" class="small muted">0.5</text><line x1="87" y1="260" x2="556" y2="260" stroke="#e8eef3"/><text x="76" y="264" text-anchor="end" class="small muted">0</text><rect x="145" y="135.118" width="76" height="124.882" rx="5" fill="#247fa3"></rect><text x="183" y="283" text-anchor="middle" class="name">A</text><rect x="292" y="243.099" width="76" height="16.901" rx="5" fill="#e2a253"></rect><text x="330" y="283" text-anchor="middle" class="name">B</text><rect x="439" y="253.783" width="76" height="6.217" rx="5" fill="#91a5b4"></rect><text x="477" y="283" text-anchor="middle" class="name">C</text><text x="30" y="326" class="small muted">T = 0.5</text><text x="547" y="326" class="small muted">2.0</text><rect x="104" y="315" width="427" height="8" rx="4" fill="#d5e3eb"/><circle cx="246.333" cy="319" r="11" fill="#234f72" stroke="white" stroke-width="3"></circle><text x="350" y="346" text-anchor="middle" class="small muted">Illustrative softmax · Argmax = A at every T &gt; 0</text></svg>