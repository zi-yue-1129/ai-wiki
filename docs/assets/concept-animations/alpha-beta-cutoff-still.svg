<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Alpha-beta pruning: a provably safe cutoff</title><desc id="desc">A left MIN subtree yields 3, setting MAX alpha to 3. The first right MIN leaf is 2, setting beta to 2; the unvisited sibling is pruned. Root minimax value remains 3. Illustrative leaf values.</desc><defs><marker id="gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#718599" stroke-width="1.5"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#147d83" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3d70b7" stroke-width="1.5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c2763b" stroke-width="1.5"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#8059ad" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#dce6ed" stroke-width="1"/><rect x="24" y="18" width="143" height="41" rx="9" fill="#eff4f8" stroke="#dce6ed" stroke-width="1"/><text x="95.5" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.8" font-weight="600" fill="#718599">Left MIN</text><rect x="177" y="18" width="143" height="41" rx="9" fill="#eff4f8" stroke="#dce6ed" stroke-width="1"/><text x="248.5" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.8" font-weight="600" fill="#718599">Root α = 3</text><rect x="330" y="18" width="143" height="41" rx="9" fill="#eff4f8" stroke="#dce6ed" stroke-width="1"/><text x="401.5" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.8" font-weight="600" fill="#718599">Right β = 2</text><rect x="483" y="18" width="143" height="41" rx="9" fill="#eff4f8" stroke="#dce6ed" stroke-width="1"/><text x="554.5" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.8" font-weight="600" fill="#718599">Cutoff</text><path d="M300 120 L169 174" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 120 L472 174" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M147 206 L98 258" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M171 206 L213 258" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M476 206 L424 258" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M498 206 L551 258" fill="none" stroke="#718599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="104" r="30" fill="#ffffff" stroke="#aec0ce" stroke-width="2"/><text x="320" y="100" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#718599">MAX</text><rect x="115" y="169" width="86" height="43" rx="10" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="158" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#718599">MIN</text><rect x="442" y="169" width="86" height="43" rx="10" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="485" y="185" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#718599">MIN</text><rect x="64" y="257" width="58" height="46" rx="9" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="93" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#26374b">3</text><rect x="190" y="257" width="58" height="46" rx="9" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="219" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#26374b">5</text><rect x="392" y="257" width="58" height="46" rx="9" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="421" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#26374b">2</text><rect x="524" y="257" width="58" height="46" rx="9" fill="#ffffff" stroke="#dce6ed" stroke-width="1.7"/><text x="553" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#26374b">?</text><text x="158" y="202" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#147d83">3</text><text x="485" y="202" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c2763b">≤ 2</text><text x="320" y="116" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#147d83">3</text><rect x="520" y="254" width="66" height="52" rx="10" fill="#f1f4f7" stroke="#b6c5d1" stroke-width="1.5"/><path d="M529 261 L576 299" fill="none" stroke="#8059ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M576 261 L529 299" fill="none" stroke="#8059ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="315" width="584" height="30" rx="7" fill="#eff4f8" stroke="#eff4f8" stroke-width="1"/><text x="320" y="335" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#26374b">α = 3 ≥ β = 2 → prune right sibling</text></svg>