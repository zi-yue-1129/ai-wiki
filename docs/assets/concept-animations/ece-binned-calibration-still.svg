<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Expected calibration error: weighted reliability gaps</title><desc id="desc">Schematic 40 predictions in three confidence bins. Bin average confidences 0.25, 0.55, 0.85; accuracies 0.20, 0.40, 0.60; counts 10, 20, 10 (2, 8, 6 correct). Weighted absolute gaps 0.0125, 0.0750, 0.0625 sum to ECE 0.1500. The moving pulse visits each gap then its weighted contribution. All data are illustrative, not model measurements.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#ecf4f8"/></linearGradient></defs><style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#24445a}.muted{fill:#677f91}.heading{font-size:18px;font-weight:750}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.25px}.small{font-size:12px}.big{font-size:22px;font-weight:750}.number{font-size:15px;font-weight:700}.panel{fill:#fff;stroke:#d9e5ed;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect width="720" height="400" fill="url(#bg)" rx="20"/><text x="30" y="36" class="eyebrow muted" >CALIBRATION • RELIABILITY</text><text x="30" y="66" class="heading" >Weighted calibration gaps</text><rect x="30" y="82" width="660" height="254" rx="5" fill="white" stroke="#d9e5ed"/><path d="M81 275L650 275" stroke="#e1ebf1" stroke-width="1.4" fill="none" /><text x="69" y="279" class="small muted" text-anchor="end">0.0</text><path d="M81 193.5L650 193.5" stroke="#e1ebf1" stroke-width="1.4" fill="none" /><text x="69" y="197.5" class="small muted" text-anchor="end">0.5</text><path d="M81 112L650 112" stroke="#e1ebf1" stroke-width="1.4" fill="none" /><text x="69" y="116" class="small muted" text-anchor="end">1.0</text><text x="30" y="104" class="small muted" >Accuracy</text><text x="638" y="312" class="small muted" >Bin</text><rect x="142" y="234.25" width="