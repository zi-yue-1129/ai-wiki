 fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M423 83 L430 89 L423 95" stroke="#098e98" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="432" y="59" width="180" height="61" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="522" y="86" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#23364c" text-anchor="middle">Explore</text><text x="522" y="108" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#098e98" text-anchor="middle">a = μ + ε</text><rect x="26" y="143" width="287" height="166" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="42" y="169" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#098e98" text-anchor="start">OU   /   stateful</text><rect x="327" y="143" width="287" height="166" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="343" y="169" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c94b82" text-anchor="start">IID   /   memoryless</text><path d="M48 229 H292 M349 229 H593" stroke="#dce6f1" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="54" y="292" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" fill="#61758b" text-anchor="middle">0</text><text x="354" y="292" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" fill="#61758b" text-anchor="middle">0</text><circle cx="54" cy="227" r="4" fill="#098e98"/><circle cx="354" cy="227" r="4" fill="#c94b82"/><text x="92" y="292" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" fill="#61758b" text-anchor="middle">1</text><text x="392" y="292" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" fill="#61758b" text-anchor="middle">1</text><path d="M54.0 227.00 L92.0 211.00" stroke="#098e98" stroke-width="3" fill="none" st