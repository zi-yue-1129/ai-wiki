<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="RMSNorm versus LayerNorm: response to additive input shift"><title>RMSNorm versus LayerNorm: response to additive input shift</title><desc>An illustrative two-feature input (1+b, 3+b) is shifted by b from zero to two and back. Input bars change. RMSNorm output changes since it does not subtract the mean. LayerNorm always produces (-1, 1) in this idealised epsilon-zero, unit-gain comparison. Axes are individually scaled and this is not benchmark data.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#0f172a" stroke="none"/><text x="24" y="32" font-size="17" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">RMSNORM vs LAYERNORM</text><text x="615" y="31" font-size="12" fill="#adc0d8" font-family="Arial, sans-serif" font-weight="500" text-anchor="end">ADD THE SAME OFFSET</text><rect x="24" y="63" width="174" height="253" rx="14" fill="#19243b" stroke="#31435b"/><text x="37" y="87" font-size="13" fill="#a6a1ff" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">INPUT</text><text x="37" y="104" font-size="11" fill="#adc0d8" font-family="Arial, sans-serif" font-weight="500" text-anchor="start">1+b, 3+b</text><line x1="42" y1="271" x2="181" y2="271" stroke="#5b7090" stroke-width="1.4"/><rect x="64" y="244" width="34" height="27" rx="5" fill="#a6a1ff"><animate attributeName="y" values="244;237.25;230.50;223.75;217;210.25;203.50;196.75;190;196.75;203.50;210.25;217;223.75;230.50;237.25;244" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="height" values="27;33.75;40.50;47.25;54;60.75;67.50;74.25;81;74.25;67.50;60.75;54;47.25;40.50;33.75;27" dur="12s" begin="0s" repeatCount="indefinite"/></rect><text x="81" y="298" font-size="12" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="600" text-anchor="middle">x₁</text><rect x="129" y="190" width="34" height="81" rx="5" fill="#a6a1ff"><animate attributeName="y" values="190;183.25;176.50;169.75;163;156.25;149.50;142.75;136;142.75;149.50;156.25;163;169.75;176.50;183.25;190" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="height" values="81;87.75;94.50;101.25;108;114.75;121.50;128.25;135;128.25;121.50;114.75;108;101.25;94.50;87.75;81" dur="12s" begin="0s" repeatCount="indefinite"/></rect><text x="146" y="298" font-size="12" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="600" text-anchor="middle">x₂</text><rect x="233" y="63" width="174" height="253" rx="14" fill="#19243b" stroke="#31435b"/><text x="246" y="87" font-size="13" fill="#34d5b4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">RMSNORM</text><text x="246" y="104" font-size="11" fill="#adc0d8" font-family="Arial, sans-serif" font-weight="500" text-anchor="start">x / RMS(x)</text><line x1="251" y1="218" x2="390" y2="218" stroke="#5b7090" stroke-width="1.4"/><rect x="273" y="192.96" width="34" height="25.04" rx="5" fill="#34d5b4"><animate attributeName="y" values="192.96;189.57;186.80;184.51;182.58;180.95;179.54;178.32;177.25;178.32;179.54;180.95;182.58;184.51;186.80;189.57;192.96" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="height" values="25.04;28.43;31.20;33.49;35.42;37.05;38.46;39.68;40.75;39.68;38.46;37.05;35.42;33.49;31.20;28.43;25.04" dur="12s" begin="0s" repeatCount="indefinite"/></rect><text x="290" y="298" font-size="12" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="600" text-anchor="middle">x₁</text><rect x="338" y="142.87" width="34" height="75.13" rx="5" fill="#34d5b4"><animate attributeName="y" values="142.87;144.08;145.21;146.23;147.16;148.01;148.77;149.46;150.09;149.46;148.77;148.01;147.16;146.23;145.21;144.08;142.87" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="height" values="75.13;73.92;72.79;71.77;70.84;69.99;69.23;68.54;67.91;68.54;69.23;69.99;70.84;71.77;72.79;73.92;75.13" dur="12s" begin="0