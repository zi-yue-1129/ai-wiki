<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>Output stationary versus partial-sum spilling</title><desc>Three products accumulate to twenty. Keeping the partial sum local requires one final write; spilling it requires five global-buffer transfers.</desc><g font-family="system-ui,Arial,sans-serif"><rect x="0" y="0" width="640" height="360" rx="8" fill="#0B1426" stroke="#0B1426"/><rect x="8" y="8" width="624" height="344" rx="8" fill="#101E34" stroke="#304361"/><text x="320" y="39" font-size="26" fill="#E9F1FC" text-anchor="middle">PARTIAL SUM TRAFFIC</text><text x="215" y="94" font-size="23" fill="#ACBDD2" text-anchor="middle">Local PE</text><text x="485" y="94" font-size="23" fill="#ACBDD2" text-anchor="middle">Global buffer</text><path d="M345 107 L345 286" stroke="#304361" stroke-width="3" fill="none"/><text x="26" y="139" font-size="22" fill="#45DDC4" text-anchor="start">Keep local</text><text x="26" y="237" font-size="22" fill="#FFBD6A" text-anchor="start">Spill</text><path d="M24 190 L616 190" stroke="#304361" stroke-width="3" fill="none"/><text x="25" y="320" font-size="23" fill="#ACBDD2" text-anchor="start">Transfers</text><g id="state-0" opacity="1"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">Start</text><rect x="170" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#45DDC4"/><text x="215" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">0</text><rect x="440" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="485" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="170" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="215" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="440" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#FFBD6A"/><text x="485" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><text x="270" y="321" font-size="24" fill="#45DDC4" text-anchor="middle">Keep: 0</text><text x="480" y="321" font-size="24" fill="#FFBD6A" text-anchor="middle">Spill: 0</text><animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g id="state-1" opacity="0"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">0 + 1 × 2</text><rect x="170" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#45DDC4"/><text x="215" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">2</text><rect x="440" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="485" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="170" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="215" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="440" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#FFBD6A"/><text x="485" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">2</text><path d="M270 249 L430 249" stroke="#FFBD6A" stroke-width="3" fill="none"/><path d="M421 243 L430 249 L421 255" stroke="#FFBD6A" stroke-width="3" fill="none"/><text x="270" y="321" font-size="24" fill="#45DDC4" text-anchor="middle">Keep: 0</text><text x="480" y="321" font-size="24" fill="#FFBD6A" text-anchor="middle">Spill: 1</text><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g id="state-2" opacity="0"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">2 + 2 × 3</text><rect x="170" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#45DDC4"/><text x="215" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">8</text><rect x="440" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="485" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="170" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="215" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="440" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#FFBD6A"/><text x="485" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">8</text><path d="M270 249 L430 249" stroke="#FFBD6A" stroke-width="3" fill="none"/><path d="M421 243 L430 249 L421 255" stroke="#FFBD6A" stroke-width="3" fill="none"/><path d="M430 277 L270 277" stroke="#FFBD6A" stroke-width="3" fill="none"/><path d="M279 271 L270 277 L279 283" stroke="#FFBD6A" stroke-width="3" fill="none"/><text x="270" y="321" font-size="24" fill="#45DDC4" text-anchor="middle">Keep: 0</text><text x="480" y="321" font-size="24" fill="#FFBD6A" text-anchor="middle">Spill: 3</text><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g id="state-3" opacity="0"><text x="320" y="70" font-size="24" fill="#E9F1FC" text-anchor="middle">8 + 3 × 4</text><rect x="170" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#45DDC4"/><text x="215" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="440" y="126" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="485" y="159" font-size="29" fill="#E9F1FC" text-anchor="middle">20</text><path d="M270 151 L430 151" stroke="#45DDC4" stroke-width="3" fill="none"/><path d="M421 145 L430 151 L421 157" stroke="#45DDC4" stroke-width="3" fill="none"/><rect x="170" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#304361"/><text x="215" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">—</text><rect x="440" y="224" width="90" height="48" rx="8" fill="#0B1426" stroke="#FFBD6A"/><text x="485" y="257" font-size="29" fill="#E9F1FC" text-anchor="middle">20</text><path d="M270 249 L430 249" stroke="#FFBD6A" stroke-width="3" fill="none"/><path d="M421 2