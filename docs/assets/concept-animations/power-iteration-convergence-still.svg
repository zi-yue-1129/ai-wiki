<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Power iteration converges to a dominant eigenvector</title><desc id="desc">A normalised vector repeatedly multiplied by a symmetric matrix rotates toward the dominant eigenvector. The dominant component rises while the orthogonal component falls.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eef5fa"/></linearGradient><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4 0 7" stroke="#0b948e" stroke-width="1.8" fill="none"/></marker></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#294659}.eyebrow{font-size:12px;letter-spacing:1.1px;font-weight:700;fill:#668397}.panel{fill:#fff;stroke:#d5e2eb;stroke-width:1.4}</style><rect width="640" height="360" rx="16" fill="url(#paper)"/><text class="eyebrow" x="28" y="36">POWER ITERATION</text><rect class="panel" x="28" y="66" width="388" height="269" rx="14"/><rect class="panel" x="430" y="66" width="182" height="269" rx="14"/>
    <text x="44" y="92" font-size="12" fill="#668397">Apply A, then normalize</text><line x1="97.51" y1="263.21" x2="316.49" y2="146.79" stroke="#2b83a3" stroke-width="2.3" opacity=".7" stroke-dasharray="7 6"/><text x="331.81" y="138.64" text-anchor="middle" font-size="15" font-weight="700" fill="#2b83a3">q1</text><line x1="265.21" y1="314.49" x2="148.79" y2="95.51" stroke="#e2ac56" stroke-width="2.3" opacity=".7" stroke-dasharray="7 6"/><text x="268.13" y="319.96" text-anchor="middle" font-size="15" font-weight="700" fill="#e2ac56">q2</text><circle cx="207" cy="205" r="124" fill="none" stroke="#e1eaf0" stroke-width="1.5"/><line x1="207" y1="205" x2="320.21" y2="154.4" stroke="#0b948e" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)"></line><circle cx="207" cy="205" r="5" fill="#203e53"/><text x="448" y="98" font-size="12" fill="#668397">Projection magnitudes</text><text x="448" y="137" font-size="15" font-weight="600">|q1 · v|</text><rect x="448" y="151" width="146" height="14" rx="7" fill="#edf3f7"/><rect x="448" y="151" width="145.66" height="14" rx="7" fill="#2b83a3"></rect><text x="448" y="205" font-size="15" font-weight="600">|q2 · v|</text><rect x="448" y="220" width="146" height="14" rx="7" fill="#edf3f7"/><rect x="448" y="220" width="9.97" height="14" rx="7" fill="#d9a247"></rect><text x="448" y="285" font-size="13" fill="#668397">λ1 = 1.60</text><text x="448" y="309" font-size="13" fill="#668397">λ2 = 0.45</text></svg>