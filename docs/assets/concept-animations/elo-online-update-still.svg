<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Elo: an observed win moves two ratings</title><desc id="desc">Two systems start at 1500. Under an illustrative online Elo update with K=64, A beats B, moving A to 1532 and B to 1468. The next expected win probability of A is about 0.591; this is not a fitted Arena rating.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244153}.small{font-size:12px}.cap{font-size:11px;font-weight:700;letter-spacing:.8px;fill:#668196}.bold{font-weight:700}.number{font-size:15px;font-weight:700}.frame{fill:#fff;stroke:#d4e1e9;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f4f8fb"/><text x="28" y="31" class="cap" >ELO · ONE OBSERVED WIN</text><text x="28" y="52" class="small" >Expected score → outcome → update</text><rect x="27" y="69" width="586" height="217" rx="11" class="frame"/><text x="48" y="102" class="number" fill="#12877f">A</text><text x="48" y="173" class="number" fill="#c77930">B</text><path d="M148 123H550" stroke="#c4d5df" stroke-width="3" stroke-linecap="round"/><circle cx="365" cy="123" r="6" fill="#c5d4dd"/><path d="M365 123h92.8" fill="none" stroke="#158c86" stroke-width="4" stroke-dasharray="4 4" opacity=".45"/><circle cx="457.8" cy="123" r="10" fill="#158c86" stroke="white" stroke-width="3"></circle><text x="148" y="108" class="small" >1500 → 1532</text><path d="M148 194H550" stroke="#c4d5df" stroke-width="3" stroke-linecap="round"/><circle cx="365" cy="194" r="6" fill="#c5d4dd"/><path d="M365 194h-92.8" fill="none" stroke="#df9650" stroke-width="4" stroke-dasharray="4 4" opacity=".45"/><circle cx="272.2" cy="194" r="10" fill="#df9650" stroke="white" stroke-width="3"></circle><text x="148" y="179" class="small" >1500 → 1468</text><text x="49" y="233" class="cap" >OBSERVED: A WINS</text><rect x="265" y="211" width="190" height="32" rx="16" fill="#e4f2ec" stroke="#a6d0c6"/><text x="360" y="231" class="small bold" text-anchor="middle">A: 1    B: 0</text><path d="M360 243V268" stroke="#158c86" stroke-width="3" stroke-linecap="round"></path><rect x="27" y="295" width="586" height="53" rx="11" fill="#e5f1f2"/><text x="43" y="316" class="cap" >NEXT P(A WINS)</text><rect x="226" y="314" width="246" height="15" rx="7" fill="#cfdee4"/><rect x="226" y="314" width="145.4" height="15" rx="7" fill="#158c86"></rect><text x="482" y="328" class="small bold" >0.500 → 0.591</text></svg>