<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Matched sparsity, different outputs</title><desc id="desc">Two masks retain two of four weights. For input one the dense output is 13, magnitude mask output 3 and alternate mask output 10. For input two the outputs are 7, 7 and 0. Mean squared deviations are 50 and 29; this is not a benchmark.</desc><rect x="1" y="1" width="638" height="358" rx="14" fill="#f9fbfe" stroke="#dae5ef"/><text x="20" y="31" font-size="21" text-anchor="start" fill="#23364a">Matched sparsity, different outputs</text><text x="22" y="65" font-size="15" text-anchor="start" fill="#23364a">Weights</text><text x="22" y="100" font-size="15" text-anchor="start" fill="#23364a">Magnitude</text><text x="22" y="135" font-size="15" text-anchor="start" fill="#23364a">Alternate</text><rect x="147" y="43" width="100" height="28" rx="4" fill="#315c85"/><text x="197" y="62" font-size="15" text-anchor="middle" fill="white">4</text><rect x="147" y="78" width="100" height="28" rx="4" fill="#08766f"/><text x="197" y="97" font-size="15" text-anchor="middle" fill="white">4</text><rect x="147" y="113" width="100" height="28" rx="4" fill="#dce6ee"/><text x="197" y="132" font-size="15" text-anchor="middle" fill="#23364a">×</text><rect x="262" y="43" width="100" height="28" rx="4" fill="#315c85"/><text x="312" y="62" font-size="15" text-anchor="middle" fill="white">3</text><rect x="262" y="78" width="100" height="28" rx="4" fill="#08766f"/><text x="312" y="97" font-size="15" text-anchor="middle" fill="white">3</text><rect x="262" y="113" width="100" height="28" rx="4" fill="#dce6ee"/><text x="312" y="132" font-size="15" text-anchor="middle" fill="#23364a">×</text><rect x="377" y="43" width="100" height="28" rx="4" fill="#315c85"/><text x="427" y="62" font-size="15" text-anchor="middle" fill="white">2</text><rect x="377" y="78" width="100" height="28" rx="4" fill="#dce6ee"/><text x="427" y="97" font-size="15" text-anchor="middle" fill="#23364a">×</text><rect x="377" y="113" width="100" height="28" rx="4" fill="#a05c20"/><text x="427" y="132" font-size="15" text-anchor="middle" fill="white">2</text><rect x="492" y="43" width="100" height="28" rx="4" fill="#315c85"/><text x="542" y="62" font-size="15" text-anchor="middle" fill="white">1</text><rect x="492" y="78" width="100" height="28" rx="4" fill="#dce6ee"/><text x="542" y="97" font-size="15" text-anchor="middle" fill="#23364a">×</text><rect x="492" y="113" width="100" height="28" rx="4" fill="#a05c20"/><text x="542" y="132" font-size="15" text-anchor="middle" fill="white">1</text><rect x="20" y="158" width="292" height="155" rx="4" fill="#edf2f7"/><text x="166" y="180" font-size="15" text-anchor="middle" fill="#23364a">x₁ = (0, 1, 3, 4)</text><text x="30" y="213" font-size="14" text-anchor="start" fill="#23364a">Dense</text><rect x="92" y="196" width="182" height="20" rx="4" fill="#d5dfe8"/><rect x="92" y="196" width="182" height="20" rx="4" fill="#315c85"/><text x="300" y="212" font-size="15" text-anchor="end" fill="#23364a">13</text><text x="30" y="247" font-size="14" text-anchor="start" fill="#23364a">Mag.</text><rect x="92" y="230" width="182" height="20" rx="4" fill="#d5dfe8"/><rect x="92" y="230" width="42" height="20" rx="4" fill="#08766f"/><text x="300" y="246" font-size="15" text-anchor="end" fill="#23364a">3</text><text x="30" y="281" font-size="14" text-anchor="start" fill="#23364a">Alt.</text><rect x="92" y="264" width="182" height="20" rx="4" fill="#d5dfe8"/><rect x="92" y="264" width="140" height="20" rx="4" fill="#a05c20"/><text x="300" y="280" font-size="15" text-anchor="end" fill="#23364a">10</text><rect x="328" y="158" width="292" height="155" rx="4" fill="#edf2f7"/><text x="474" y="180" font-size="15" text-anchor="middle" fill="#23364a">x₂ = (1, 1, 0, 0)</text><text x="338" y="213" font-size="14" text-anchor="start" fill="#23364a">Dense</text><rect x="400" y="196" width="182" height="20" rx="4" fill="#d5dfe8"/><rect x="400" y="196" width="98" height="20" rx="4" fill="#315c85"/><text x="608" y="212" font-size="15" text-anchor="end" fill="#23364a">7</text><text x="338" y="247" font-size="14" text-anchor="start" fill="#23364a">Mag.</text><rect x="400" y="230" width="182" height="20" rx="4" fill="#d5dfe8"/><rect x="400" y="230" width="98" height="20" rx="4" fill="#08766f"/><text x="608" y="246" font-size="15" text-anchor="end" fill="#23364a">7</text><text x="338" y="281" font-size="14" text-anchor="start" fill="#23364a">Alt.</text><rect x="400" y="264" width="182" height="20" rx="4" fill="#d5dfe8"/><text x="608" y="280" font-size="15" text-anchor="end" fill="#23364a">0</text><text x="22" y="338" font-size="15" text-anchor="start" fill="#23364a">MSE</text><text x="122" y="338" font-size="16" text-anchor="start" fill="#08766f">Magnitude: 50</text><text x="368" y="338" font-size="16" text-anchor="start" fill="#a05c20">Alternate: 29</text></svg>
