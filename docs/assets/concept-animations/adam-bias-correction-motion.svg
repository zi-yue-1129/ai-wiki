<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Adam bias correction: zero-start first and second moments</title><desc id="desc">For a constant unit gradient, raw zero-initialized first and second moments rise toward one; corrected moments remain one. A synchronized cursor traces steps one through six with schematic linear interpolation. Beta values are illustrative.</desc><style>text{font-family:Inter,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.cursor{opacity:0!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" stroke="none"/><text x="34" y="40" font-size="16" fill="#18344c" font-weight="750" text-anchor="start">ADAM · ZERO-INITIALISED MOMENTS</text><text x="34" y="65" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">Constant gradient g = 1</text><rect x="25" y="80" width="360" height="300" rx="14" fill="white" stroke="#d8e5ec"/><text x="45" y="110" font-size="17" fill="#18344c" font-weight="750" text-anchor="start">First moment  m  ·  beta1 = 0.8</text><path d="M63 325.0 H337" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="53" y="330.0" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">0</text><path d="M63 222.5 H337" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="53" y="227.5" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">0.5</text><path d="M63 120.0 H337" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="53" y="125.0" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">1</text><path d="M63 120 V325 H337" fill="none" stroke="#6f8799" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M63.0 325.0 L108.7 284.0 L154.3 251.2 L200.0 225.0 L245.7 204.0 L291.3 187.2 L337.0 173.7" fill="none" stroke="#2876b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M108.7 120 H337" fill="none" stroke="#079a89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="108.7" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">1</text><text x="200.0" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">3</text><text x="337.0" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">6</text><text x="359" y="347" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">t</text><text x="334" y="137" font-size="11" fill="#079a89" font-weight="600" text-anchor="end">corrected</text><text x="227.4" y="255.0" font-size="12" fill="#2876b5" font-weight="700" text-anchor="end">raw</text><line class="cursor" x1="108.7" x2="108.7" y1="120" y2="325" stroke="#6f8799" stroke-width="1.5" stroke-dasharray="4 4"><animate attributeName="x1" values="108.7;154.3;200.0;245.7;291.3;337.0" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="108.7;154.3;200.0;245.7;291.3;337.0" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></line><circle cx="108.7" cy="284.0" r="7" fill="#2876b5" stroke="white" stroke-width="2"><animate attributeName="cx" values="108.7;154.3;200.0;245.7;291.3;337.0" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="284.0;251.2;225.0;204.0;187.2;173.7" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="108.7" cy="120" r="6" fill="#079a89" stroke="white" stroke-width="2"><animate attributeName="cx" values="108.7;154.3;200.0;245.7;291.3;337.0" keyTimes="0;.2;.4;.6;.8;1" dur="10s" repeatCount="indefinite"/></circle><rect x="415" y="80" width="360" height="300" rx="14" fill="white" stroke="#d8e5ec"/><text x="435" y="110" font-size="17" fill="#18344c" font-weight="750" text-anchor="start">Second moment  v  ·  beta2 = 0.5</text><path d="M453 325.0 H727" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="443" y="330.0" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">0</text><path d="M453 222.5 H727" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="443" y="227.5" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">0.5</text><path d="M453 120.0 H727" fill="none" stroke="#d8e5ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="443" y="125.0" font-size="12" fill="#6f8799" font-weight="550" text-anchor="end">1</text><path d="M453 120 V325 H727" fill="none" stroke="#6f8799" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M453.0 325.0 L498.7 222.5 L544.3 171.3 L590.0 145.6 L635.7 132.8 L681.3 126.4 L727.0 123.2" fill="none" stroke="#dc8740" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M498.7 120 H727" fill="none" stroke="#079a89" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="498.7" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">1</text><text x="590.0" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">3</text><text x="727.0" y="347" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">6</text><text x="749" y="347" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">t</text><text x="724" y="137" font-size="11" fill="#079a89" font-weight="600" text-anchor="end">corrected</text><text x="617.4" y="175.6" font-size="12" fill="#dc8740" font-weight="700" text-anchor="end">raw</text><line class="cursor" x1="498.7" x2="498.7" y1="120" y2="325" stroke="#6f8799" stroke-width="1.5" stroke-dasharray="4 4"><animate attributeName="x1" values="498.7;544.3;590.0;635.7;681.3;727.0" keyTimes="0;.2;.4;.