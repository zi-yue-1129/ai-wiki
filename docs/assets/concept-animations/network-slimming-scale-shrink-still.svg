nt-size="16" fill="#294456" text-anchor="middle">−0.5</text><text x="412" y="152" font-size="16" fill="#08756e" text-anchor="middle">−0.4</text><path d="M445 146H476m-6 -4 6 4-6 4" stroke="#08756e" stroke-width="2" fill="none"/><rect x="480" y="133" width="112" height="26" rx="5" fill="#08756e"/><text x="536" y="152" font-size="17" fill="#ffffff" text-anchor="middle">B</text><text x="42" y="203" font-size="18" fill="#294456" text-anchor="middle">C</text><rect x="70" y="184" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="184" width="20" height="26" rx="5" fill="#35678f"></rect><text x="300" y="203" font-size="16" fill="#294456" text-anchor="middle">+0.3</text><text x="356" y="203" font-size="16" fill="#294456" text-anchor="middle">+0.2</text><text x="412" y="203" font-size="16" fill="#08756e" text-anchor="middle">+0.1</text><text x="536" y="204" font-size="25" fill="#a26420" text-anchor="middle">×</text><text x="42" y="254" font-size="18" fill="#294456" text-anchor="middle">D</text><rect x="70" y="235" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="235" width="0" height="26" rx="5" fill="#35678f"></rect><text x="300" y="254" font-size="16" fill="#294456" text-anchor="middle">−0.2</text><text x="356" y="254" font-size="16" fill="#294456" text-anchor="middle">−0.1</text><text x="412" y="254" font-size="16" fill="#08756e" text-anchor="middle">0.0</text><text x="536" y="255" font-size="25" fill="#a26420" text-anchor="middle">×</text><path d="M100 73V278" stroke="#a26420" stroke-width="2" stroke-dasharray="5 4"/><text x="112" y="302" font-size="16" fill="#a26420" text-anchor="middle">τ = 0.15</text><text x="320" y="337" font-size="23" fill="#08756e" text-anchor="middle">4 → 2 channels</text></g></svg>
