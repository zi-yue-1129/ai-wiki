<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Prefix tuning: query redistribution toward learned prefix keys</title><desc id="desc">A fixed query attends to two virtual prefix slots and two ordinary token slots. As the synthetic prefix logits change, normalized softmax attention moves from real tokens toward prefix slots; frozen token logits remain unchanged. Not a model training trace.</desc><style>text{font-family:Inter,system-ui,-apple-system,Arial,sans-serif} @media(prefers-reduced-motion:reduce){animate{display:none!important}}</style><rect width="640" height="360" rx="16" fill="#F1F7FA"/><text x="28" y="32" fill="#26445C" font-size="16" font-weight="750">PREFIX TUNING   •   KV ATTENTION</text><text x="28" y="54" fill="#6C8293" font-size="12" >Virtual prefix keys compete with real token keys</text><rect x="24" y="76" width="349" height="218" rx="11" fill="#fff" stroke="#D6E2EB"/><rect x="388" y="76" width="229" height="218" rx="11" fill="#fff" stroke="#D6E2EB"/><text x="45" y="99" fill="#6C8293" font-size="12" font-weight="700">KEY / VALUE SLOTS</text><text x="405" y="99" fill="#6C8293" font-size="12" font-weight="700">QUERY ATTENTION</text><path d="M 170 123 L 284 183" fill="none" stroke="#EA9851" stroke-linecap="round" stroke-width="5.983" opacity="0.784"></path><rect x="44" y="110" width="126" height="26" rx="7" fill="#FFF0DF" stroke="#E6BB83" stroke-dasharray="4 3"/><text x="60" y="127" fill="#EA9851" font-size="13" font-weight="700">P₁</text><text x="98" y="127" fill="#6C8293" font-size="11" >prefix</text><text x="404" y="127" fill="#EA9851" font-size="12" font-weight="700">P₁</text><rect x="434" y="114" width="164" height="18" rx="5" fill="#E9F0F4" stroke="none"/><rect x="434" y="114" width="152.327" height="18" rx="5" fill="#EA9851"></rect><path d="M 170 163 L 284 183" fill="none" stroke="#EA9851" stroke-linecap="round" stroke-width="1.824" opacity="0.380"></path><rect x="44" y="150" width="126" height="26" rx="7" fill="#FFF0DF" stroke="#E6BB83" stroke-dasharray="4 3"/><text x="60" y="167" fill="#EA9851" font-size="13" font-weight="700">P₂</text><text x="98" y="167" fill="#6C8293" font-size="11" >prefix</text><text x="404" y="167" fill="#EA9851" font-size="12" font-weight="700">P₂</text><rect x="434" y="154" width="164" height="18" rx="5" fill="#E9F0F4" stroke="none"/><rect x="434" y="154" width="25.180" height="18" rx="5" fill="#EA9851"></rect><path d="M 170 203 L 284 183" fill="none" stroke="#28799B" stroke-linecap="round" stroke-width="1.824" opacity="0.380"></path><rect x="44" y="190" width="126" height="26" rx="7" fill="#EAF3F8" stroke="#B9D3E1" /><text x="60" y="207" fill="#28799B" font-size="13" font-weight="700">T₁</text><text x="98" y="207" fill="#6C8293" font-size="11" >token</text><text x="404" y="207" fill="#28799B" font-size="12" font-weight="700">T₁</text><rect x="434" y="194" width="164" height="18" rx="5" fill="#E9F0F4" stroke="none"/><rect x="434" y="194" width="25.180" height="18" rx="5" fill="#28799B"></rect><path d="M 170 243 L 284 183" fill="none" stroke="#28799B" stroke-linecap="round" stroke-width="1.370" opacity="0.336"></path><rect x="44" y="230" width="126" height="26" rx="7" fill="#EAF3F8" stroke="#B9D3E1" /><text x="60" y="247" fill="#28799B" font-size="13" font-weight="700">T₂</text><text x="98" y="247" fill="#6C8293" font-size="11" >token</text><text x="404" y="247" fill="#28799B" font-size="12" font-weight="700">T₂</text><rect x="434" y="234" width="164" height="18" rx="5" fill="#E9F0F4" stroke="none"/><rect x="434" y="234" width="11.314" height="18" rx="5" fill="#28799B"></rect><circle cx="311" cy="183" r="26" fill="#F1F7FA" stroke="#148A83" stroke-width="2"/><text x="311" y="189" fill="#148A83" font-size="17" font-weight="800" text-anchor="middle">Q</text><text x="311" y="219" fill="#6C8293" font-size="11" text-anchor="middle">frozen</text><text x="407" y="274" fill="#6C8293" font-size="10" >0</text><text x="598" y="274" fill="#6C8293" font-size="10" text-anchor="end">0.75</text><rect x="30" y="311" width="580" height="31" rx="8" fill="#E8F0F5" stroke="none"/><text x="44" y="331" fill="#EA9851" font-size="11" font-weight="700">TRAINABLE PREFIX K/V</text><text x="295" y="331" fill="#28799B" font-size="11" font-weight="700">FROZEN TOKENS</text><text x="491" y="331" fill="#6C8293" font-size="11" >SOFTMAX</text></svg>