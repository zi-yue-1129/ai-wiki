<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">T5 span-corruption pretraining</title><desc id="d">Original tokens B,C and H,I form two removed spans. The encoder sees sentinel tokens S0 and S1, and the decoder generates the sentinel-marked removed spans followed by S2. Synthetic 10-token example, not the paper’s 15 percent masking rate.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7faff"/><text x="22" y="34" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1d3550">T5  /  span corruption</text><text x="22" y="64" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#61758c">Original</text><rect x="115" y="43" width="41" height="36" rx="7" fill="#fff" stroke="#d6e0ec"/><text x="135.5" y="66" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1d3550">A</text><rect x="162" y="43" width="41" height="36" rx="7" fill="#fff0f2" stroke="#d45f6c"/><text x="182.5" y="66" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1d3550">B</text><rect x="209" y="43" width="41" height="36" rx="7" fill="#fff0f2" stroke="#d45f6c"/><text x="229.5" y="66" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1d3550">C</text><rect x="256" y="43" width="41" height="36" rx="7" fill="#fff" stroke="#d6e0ec"/><text x="276.5" y="66" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1d3550">D</text><rect x="303" y="43" width="41" height="36" rx="7" fill="#fff" stroke="#d6e0ec"/><text x="323.5" y="66" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1d3550">E</text><rect x="350" y="43" width="41" height="36" rx="7" fill="#fff" stroke="#d6e0ec"/><text x="370.5" y="66" font