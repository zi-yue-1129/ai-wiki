<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Muon spectral orthogonalization through a classical Newton Schulz illustration</title><desc id="desc">The two singular values of an illustrative two by two diagonal matrix approach one under a classical cubic polar Newton Schulz iteration. The actual Muon implementation uses different polynomial coefficients, a Nesterov-style momentum update and scaling; these are not depicted.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f9fbff" stroke="#dce7ef" stroke-width="1"/><line x1="30" y1="59" x2="610" y2="59" stroke="#dce7ef" stroke-width="1" /><text x="30" y="36" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#263c52" font-weight="700" text-anchor="start">MUON</text><text x="107" y="36" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657c91" font-weight="600" text-anchor="start">SPECTRAL BALANCING</text><rect x="28" y="75" width="198" height="210" rx="12" fill="white" stroke="#dce7ef" stroke-width="1.3"/><text x="48" y="103" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657c91" font-weight="700" text-anchor="start">MOMENTUM</text><text x="127" y="140" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#263c52" font-weight="700" text-anchor="middle">M</text><text x="127" y="174" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#263c52" font-weight="600" text-anchor="middle">[ 1.5   0 ]</text><text x="127" y="205" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#263c52" font-weight="600" text-anchor="middle">[ 0    0.3 ]</text><text x="127" y="246" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657c91" font-weight="500" text-anchor="middle">2 × 2 example</text><path d="M230 170 H268" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/><path d="M263 163 L272 170 L263 177" stroke="#0d9488" fill="none" stroke-width="3" stroke-linecap="round"/><rect x="281" y="75" width="330" height="210" rx="12" fill="white" stroke="#dce7ef" stroke-width="1.3"/><text x="303" y="103" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#657c91" font-weight="700" text-anchor="start">SINGULAR VALUES</text><text x="308" y="153" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d27b39" font-weight="700" text-anchor="start">σ₁</text><text x="308" y="227" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0d9488" font-weight="700" text-anchor="start">σ₂</text><line x1="348" y1="169" x2="579" y2="169" stroke="#dce7ef" stroke-width="1" /><line x1="348" y1="242" x2="579" y2="242" stroke="#dce7ef" stroke-width="1" /><rect x="348" y="128" width="210" height="29" rx="6" fill="none" stroke="#dce7ef" stroke-width="1.5"/><rect x="348" y="201" width="140" height="29" rx="6" fill="none" stroke="#dce7ef" stroke-width="1.5"/><rect x="348" y="128" width="140.000" height="29" rx="5" fill="#d27b39" ></rect><rect x="348" y="201" width="139.996" height="29" rx="5" fill="#0d9488" ></rect><line x1="488" y1="122" x2="488" y2="238" stroke="#dce7ef" stroke-width="1.2" stroke-dasharray="4 4"/><text x="493" y="117" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="600" text-anchor="start">target = 1</text><text x="30" y="308" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="700" text-anchor="start">CLASSICAL N–S ITERATION</text><circle cx="305" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="305" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">0</text><circle cx="351" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="351" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">1</text><circle cx="397" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="397" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">2</text><circle cx="443" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="443" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">3</text><circle cx="489" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="489" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">4</text><circle cx="535" cy="305" r="5" fill="#dbe7ee" stroke="#b5c9d6" stroke-width="1"/><text x="535" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">5</text><circle cx="581" cy="305" r="5" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="581" y="328" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#657c91" font-weight="500" text-anchor="middle">6</text><line x1="305" y1="305" x2="581" y2="305" stroke="#dce7ef" stroke-width="1.5" /><circle cx="581" cy="305" r="9" fill="none" stroke="#397db8" stroke-width="2.3"/><text x="30" y="347" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#657c91" font-weight="500" text-anchor="start">Illustrative cubic iteration · not Muon’s production polynomial</text></svg>