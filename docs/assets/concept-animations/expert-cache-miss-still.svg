<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">EXPERT OFFLOADING</title><desc id="desc">A routed expert E2 is absent from a two-slot GPU cache. A moving amber transfer marker carries E2 from host memory to the GPU while the E1 cache entry is released. After replacement, routing E2 again is a cache hit without another host transfer.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#253c52}.hd{font-size:19px;font-weight:700}.lab{font-size:13px;font-weight:700;letter-spacing:.7px;fill:#62788a}.small{font-size:11px;fill:#62788a}.cell{font-size:17px;font-weight:700}@media(prefers-reduced-motion:reduce){.particle{display:none!important}}</style><rect width="640" height="360" rx="16" fill="#f5f9fc"/><text class="hd" x="26" y="37">EXPERT OFFLOADING</text><text class="lab" x="29" y="85" >HOST MEMORY</text><text class="lab" x="447" y="85" >GPU CACHE</text><rect x="36" y="116" width="70" height="65" rx="10" fill="#f0f5f8" stroke="#cddde8" stroke-width="1.7"/><text class="cell" x="71" y="154" text-anchor="middle">E0</text><rect x="122" y="116" width="70" height="65" rx="10" fill="#f0f5f8" stroke="#cddde8" stroke-width="1.7"/><text class="cell" x="157" y="154" text-anchor="middle">E1</text><rect x="208" y="116" width="70" height="65" rx="10" fill="#fff0db" stroke="#d68a30" stroke-width="1.7"/><text class="cell" x="243" y="154" text-anchor="middle">E2</text><rect x="312" y="123" width="75" height="51" rx="12" fill="#e6edf4" stroke="#92aabd" stroke-width="1.5"/><text class="small" x="350" y="153" text-anchor="middle">ROUTER</text><path d="M279 147H310" stroke="#cddde8" stroke-width="2" stroke-dasharray="4 4"/><rect x="439" y="116" width="70" height="65" rx="10" fill="#dcf3ef" stroke="#128e8b" stroke-width="1.7"/><text class="cell" x="474" y="154" text-anchor="middle">E0</text><rect x="525" y="116" width="70" height="65" rx="10" fill="#fff" stroke="#cddde8" stroke-width="1.7"/><g opacity="1"><rect x="527" y="118" width="66" height="61" rx="8" fill="#e7f0fa" stroke="#397cbb" stroke-width="1.7"/><text class="cell" x="560" y="155" text-anchor="middle">E1</text></g><g ><rect x="527" y="118" width="66" height="61" rx="8" fill="#fff0db" stroke="#d68a30" stroke-width="1.7"/><text class="cell" x="560" y="155" text-anchor="middle">E2</text></g><path d="M243 190 Q345 247 556 190" stroke="#d68a30" stroke-width="2.5" stroke-dasharray="6 6" fill="none" opacity=".5"/><g opacity="0"><rect x="77" y="268" width="219" height="43" rx="10" fill="#fff1e2" stroke="#d68a30" stroke-width="1.7"/><text class="lab" x="186" y="296" text-anchor="middle">MISS · HOST TRANSFER</text></g><g ><rect x="344" y="268" width="216" height="43" rx="10" fill="#def4eb" stroke="#128e8b" stroke-width="1.7"/><text class="lab" x="452" y="296" text-anchor="middle">HIT · GPU REUSE</text></g><text class="small" x="30" y="334" >Final state after one cache replacement · schematic</text></svg>