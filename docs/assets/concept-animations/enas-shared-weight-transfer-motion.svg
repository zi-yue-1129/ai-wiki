<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">ENAS shared parameter update</title><desc id="desc">A schematic gradient step on sampled network A updates its shared weight from 0.40 to 0.60. Candidate B inherits the changed shared weight without an independent training step. The animation travels from A through the shared weight to B.</desc><rect width="800" height="420" fill="#f8fbff"/><style>text{font-family:Inter,Arial,sans-serif;fill:#172c41}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:18px;font-weight:700}.heading{font-size:23px;font-weight:750}.muted{fill:#526879}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style><text x="40" y="42" class="heading" >ENAS  /  shared weights</text><text x="40" y="65" class="small muted" >One sampled path updates parameters reused by another</text><rect x="42" y="92" width="335" height="141" rx="17" fill="#fff" stroke="#c9d8e6" stroke-width="1.5"/><rect x="423" y="92" width="335" height="141" rx="17" fill="#fff" stroke="#c9d8e6" stroke-width="1.5"/><text x="63" y="119" class="label" >A  ·  sampled</text><text x="444" y="119" class="label" >B  ·  not sampled</text><text x="64" y="148" class="small muted" >Shared  +  A-only</text><text x="444" y="148" class="small muted" >Shared  +  B-only</text><rect x="63" y="162" width="116" height="41" rx="9" fill="#d5f3f0" stroke="#087d82" stroke-width="1.5"/><rect x="209" y="162" width="145" height="41" rx="9" fill="#e7e3f9" stroke="#6750b5" stroke-width="1.5"/><text x="80" y="188" class="label" >Shared</text><text x="223" y="188" class="label" >A-only</text><line x1="179" y1="182" x2="207" y2="182" stroke="#526879" stroke-width="2" /><text x="80" y="219" class="tiny muted" >0.40  →  0.60</text><text x="223" y="219" class="tiny muted" >0.20  →  0.40</text><rect x="444" y="162" width="116" height="41" rx="9" fill="#d5f3f0" stroke="#087d82" stroke-width="1.5"/><rect x="590" y="162" width="145" height="41" rx="9" fill="#f0f3f7" stroke="#c9d8e6" stroke-width="1.5"/><text x="461" y="188" class="label" >Shared</text><text x="606" y="188" class="label" >B-only</text><line x1="560" y1="182" x2="588" y2="182" stroke="#526879" stroke-width="2" /><text x="461" y="219" class="tiny muted" >0.40  →  0.60</text><text x="606" y="219" class="tiny muted" >−0.30  fixed</text><path d="M 400 250 V 234 M 400 250 H 199 V 235 M 400 250 H 601 V 235" stroke="#c9d8e6" stroke-width="2" fill="none" stroke-dasharray="5 6"/><rect x="143" y="271" width="514" height="118" rx="16" fill="#eef7fd" stroke="#c9d8e6" stroke-width="1.5"/><text x="167" y="303" class="label" >Shared parameter</text><text x="167" y="330" class="small muted" >w = 0.40  →  0.60</text><rect x="167" y="346" width="360" height="17" rx="8" fill="#dce6ed" stroke="#dce6ed" stroke-width="1.5"/><rect x="167" y="346" height="17" width="216" rx="7" fill="#087d82"><animate attributeName="width" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.25;0.65;0.95;1" values="144;144;216;216;144"/></rect><text x="546" y="360" class="small" fill="#087d82">Δ +0.20</text><circle r="6" fill="#ca6634" stroke="#fff" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.19;0.59;0.80;1" values="0;1;1;0;0"/><animateMotion dur="10s" repeatCount="indefinite" path="M 199 234 L 199 250 L 400 250 L 601 250 L 601 234"/></circle><text x="63" y="86" class="tiny muted" >Train A: target = 1</text><text x="443" y="86" class="tiny muted" >B output: 0.10  →  0.30</text></svg>