<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">AWQ: protect a salient channel by scaling</title><desc id="description">Schematic single-channel quantizer with x=4, w=0.37 and fixed spacing 0.25. Scale sweeps from 1 to 2, changing rounding and output error; this is not a real AWQ groupwise calibration.</desc><rect width="640" height="360" rx="15" fill="#f7fbff"/><rect x="1" y="1" width="638" height="358" rx="14" stroke="#dbe5ed" fill="none"/><text x="26" y="37" text-anchor="start" fill="#1b3651" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">AWQ</text><text x="129" y="37" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500">salient-channel scaling</text><rect x="24" y="62" width="287" height="257" rx="10" fill="#fff" stroke="#dbe5ed"/><rect x="329" y="62" width="287" height="257" rx="10" fill="#fff" stroke="#dbe5ed"/><text x="45" y="87" text-anchor="start" fill="#1b3651" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Before: no scaling</text><text x="350" y="87" text-anchor="start" fill="#1b3651" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">After: salient scale</text><text x="45" y="111" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500">x = 4, w = 0.37</text><text x="350" y="111" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500">x / s, w × s</text><path d="M64 126 L64 251" fill="none" stroke="#dbe5ed" stroke-width="1.2" /><path d="M116.50 126 L116.50 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M169 126 L169 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M221.50 126 L221.50 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M274 126 L274 251" fill="none" stroke="#dbe5ed" stroke-width="1.2" /><text x="64" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">0</text><text x="169" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">0.5</text><text x="274" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">1</text><path d="M64 183 L274 183" fill="none" stroke="#dbe5ed" stroke-width="1" /><path d="M64 234 L274 234" fill="none" stroke="#dbe5ed" stroke-width="1" /><path d="M369 126 L369 251" fill="none" stroke="#dbe5ed" stroke-width="1.2" /><path d="M421.50 126 L421.50 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M474 126 L474 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M526.50 126 L526.50 251" fill="none" stroke="#edf1f5" stroke-width="1.2" /><path d="M579 126 L579 251" fill="none" stroke="#dbe5ed" stroke-width="1.2" /><text x="369" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">0</text><text x="474" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">0.5</text><text x="579" y="269" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">1</text><path d="M369 183 L579 183" fill="none" stroke="#dbe5ed" stroke-width="1" /><path d="M369 234 L579 234" fill="none" stroke="#dbe5ed" stroke-width="1" /><text x="46" y="158" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">float</text><text x="46" y="212" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">round</text><text x="350" y="158" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">float</text><text x="350" y="212" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">round</text><circle cx="141.70" cy="183" r="8" fill="#4268a7" stroke="#fff" stroke-width="2"/><circle cx="116.50" cy="234" r="8" fill="#c35f55" stroke="#fff" stroke-width="2"/><path d="M141.70 190 L116.50 227" fill="none" stroke="#c35f55" stroke-width="2" stroke-dasharray="4 4"/><circle cx="524.40" cy="183" r="8" fill="#4268a7" stroke="#fff" stroke-width="2"></circle><circle cx="526.50" cy="234" r="8" fill="#087f83" stroke="#fff" stroke-width="2"></circle><line x1="524.40" y1="190" x2="526.50" y2="227" stroke="#087f83" stroke-width="2" stroke-dasharray="4 4"></line><text x="45" y="294" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">|output error|</text><text x="350" y="294" text-anchor="start" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">|output error|</text><rect x="131" y="281" width="136" height="14" rx="5" fill="#f2e8e7" stroke="none"/><rect x="131" y="281" width="124" height="14" rx="5" fill="#c35f55"/><rect x="438" y="281" width="136" height="14" rx="5" fill="#e4f3f0" stroke="none"/><rect x="438" y="281" width="5.17" height="14" rx="5" fill="#087f83"></rect><text x="193" y="313" text-anchor="middle" fill="#c35f55" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">0.48</text><text x="506" y="313" text-anchor="middle" fill="#087f83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">0.02</text><text x="320" y="341" text-anchor="middle" fill="#61788d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">Illustrative values · not model measurements</text></svg>
