<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 570" role="img" aria-labelledby="t d">
<title id="t">ICM: forward and inverse auxiliary losses train a shared encoder</title><desc id="d">A pair of observations passes through one shared encoder to two action-conditioned objectives. Orange forward loss and violet inverse loss have distinct parameter-gradient routes back to the shared representation, while only the forward prediction discrepancy supplies curiosity reward to the policy. Moving dots show the computation and learning dependencies, not empirical gradients.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.lab{font-weight:700;fill:#233f58}.edge{fill:none;stroke:#8da6bc;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}.pulse{stroke:#fff;stroke-width:1.2}@media(prefers-reduced-motion:reduce){.pulse{display:none}}</style>
