<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Checkpointing stores boundaries and recomputes segment activations</title><desc id="svgdesc">An eight-layer chain retains three boundary activations, while internal activations are recomputed locally during backward traversal. Animation is schematic.</desc><rect width="640" height="360" fill="#10192b"/><g font-family="Inter,Arial,sans-serif"><text x="24" y="36" font-size="18" font-weight="700" fill="#e7f1fb" text-anchor="start" >ACTIVATION CHECKPOINTING</text><text x="616" y="36" font-size="11" font-weight="500" fill="#9fb5c9" text-anchor="end" >8 layers · 2 segments</text><path d="M24 50 L616 50" stroke="#33475e" stroke-width="1" fill="none" stroke-linecap="round" /><text x="26" y="79" font-size="11" font-weight="700" fill="#42d8c2" text-anchor="start" >FORWARD</text><text x="317" y="79" font-size="11" font-weight="700" fill="#f5b763" text-anchor="start" >RECOMPUTE</text><text x="613" y="79" font-size="11" font-weight="700" fill="#ac9df8" text-anchor="end" >BACKWARD</text><rect x="26" y="94" width="588" height="78" rx="12" fill="#19273b" stroke="#33475e" stroke-width="1" /><path d="M76 132 L104 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M140 132 L168 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M204 132 L232 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M268 132 L296 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M332 132 L360 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M396 132 L424 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M460 132 L488 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M524 132 L552 132" stroke="#33475e" stroke-width="3" fill="none" stroke-linecap="round" /><circle cx="58" cy="132" r="16" fill="#42d8c2" stroke="#42d8c2" stroke-width="2"/><text x="58" y="136" font-size="11" font-weight="600" fill="#10192b" text-anchor="middle" >A0</text><circle cx="122" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="122" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A1</text><circle cx="186" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="186" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A2</text><circle cx="250" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="250" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A3</text><circle cx="314" cy="132" r="16" fill="#42d8c2" stroke="#42d8c2" stroke-width="2"/><text x="314" y="136" font-size="11" font-weight="600" fill="#10192b" text-anchor="middle" >A4</text><circle cx="378" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="378" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A5</text><circle cx="442" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="442" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A6</text><circle cx="506" cy="132" r="16" fill="#243950" stroke="#608099" stroke-width="1"/><text x="506" y="136" font-size="11" font-weight="600" fill="#e7f1fb" text-anchor="middle" >A7</text><circle cx="570" cy="132" r="16" fill="#42d8c2" stroke="#42d8c2" stroke-width="2"/><text x="570" y="136" font-size="11" font-weight="600" fill="#10192b" text-anchor="middle" >A8</text><text x="27" y="205" font-size="11" font-weight="700" fill="#42d8c2" text-anchor="start" >RETAINED</text><text x="616" y="205" font-size="11" font-weight="500" fill="#9fb5c9" text-anchor="end" >boundary tensors</text><rect x="26" y="214" width="588" height="55" rx="9" fill="#15283a" stroke="#33475e" stroke-width="1" /><path d="M58 148 L58 216" stroke="#42d8c2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="35" y="224" width="46" height="34" rx="7" fill="#165354" stroke="#42d8c2" stroke-width="1.4" /><text x="58" y="246" font-size="13" font-weight="700" fill="#dffbf6" text-anchor="middle" >A0</text><path d="M314 148 L314 216" stroke="#42d8c2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="291" y="224" width="46" height="34" rx="7" fill="#165354" stroke="#42d8c2" stroke-width="1.4" /><text x="314" y="246" font-size="13" font-weight="700" fill="#dffbf6" text-anchor="middle" >A4</text><path d="M570 148 L570 216" stroke="#42d8c2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="547" y="224" width="46" height="34" rx="7" fill="#165354" stroke="#42d8c2" stroke-width="1.4" /><text x="570" y="246" font-size="13" font-weight="700" fill="#dffbf6" text-anchor="middle" >A8</text><path d="M88 241 L284 241" stroke="#33475e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M344 241 L540 241" stroke="#33475e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/><text x="27" y="295" font-size="11" font-weight="700" fill="#f5b763" text-anchor="start" >TEMPORARY</text><text x="616" y="295" font-size="11" font-weight="500" fill="#9fb5c9" text-anchor="end" >local segment activations</text><rect x="26" y="304" width="588" height="33" rx="8" fill="#15283a" stroke="#33475e" stroke-width="1" /><rect x="108" y="310" width="28" height="21" rx="5" fill="#f5b763" opacity="0"></rect><rect x="172" y="310" width="28" height="21" rx="5" fill="#f5b763" opacity="0"></rect><rect x="236" y="310" width="28" height="21" rx="5" fill="#f5b763" opacity="0"></rect><rect x="364" y="310" width="28" height="21" rx="5" fill="#f5b763" opacity="1"></rect><rect x="428" y="310" width="28" height="21" rx="5" fill="#f5b763" opacity="1"></rect><rect x="492" y="310" width