<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Collider bias: conditioning on a common effect</title><desc id="art-desc">Four equally likely independent binary X and Y cases. S is 1 if X or Y is 1. Selecting on S=1 removes the X=0 Y=0 case, creating an association: P(Y=1 given X=0,S=1)=1 and given X=1,S=1)=0.5, whereas both unconditional probabilities are 0.5.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef4fa"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7b94a6"/></marker></defs>
<style>text{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;fill:#24465d}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#627e91}.tag{font-size:14px;font-weight:750}.big{font-size:22px;font-weight:750}.small{font-size:12px;fill:#648093}.val{font-size:17px;font-weight:700}.muted{fill:#7890a1}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style>
<rect width="800" height="430" rx="20" fill="url(#bg)"/><rect x="18" y="18" width="764" height="394" rx="16" fill="none" stroke="#d8e4ee"/>
<text x="42" y="53" class="label">COLLIDER SELECTION</text><text x="42" y="84" class="tag">Conditioning creates an association</text><rect x="557" y="39" width="212" height="111" rx="14" fill="#ffffff" stroke="#dce7ee"></rect><g aria-hidden="true"><path d="M610 80 L671 101" stroke="#bacbd8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M744 80 L686 101" stroke="#bacbd8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="600" cy="66" r="20" fill="#d9eff8" stroke="#bad0dd"/><text x="600" y="71" class="tag" text-anchor="middle">X</text><circle cx="754" cy="66" r="20" fill="#f7dfc9" stroke="#bad0dd"/><text x="754" y="71" class="tag" text-anchor="middle">Y</text><circle cx="678" cy="122" r="20" fill="#d4efdf" stroke="#bad0dd"/><text x="678" y="127" class="tag" text-anchor="middle">S</text></g><text x="42" y="135" class="label">EQUALLY LIKELY CASES</text><g><rect x="42" y="151" width="168" height="89" rx="12" fill="#ffffff" stroke="#d8e4ed"></rect><text x="58" y="181" class="tag">X = 0    Y = 0</text><text x="58" y="214" class="small">S = 0</text><rect x="161" y="196" width="31" height="10" rx="5" fill="#a8b5bd"></rect></g><g><rect x="230" y="151" width="168" height="89" rx="12" fill="#ffffff" stroke="#d8e4ed"></rect><text x="246" y="181" class="tag">X = 0    Y = 1</text><text x="246" y="214" class="small">S = 1</text><rect x="349" y="196" width="31" height="10" rx="5" fill="#249e8b"></rect></g><g><rect x="418" y="151" width="168" height="89" rx="12" fill="#ffffff" stroke="#d8e4ed"></rect><text x="434" y="181" class="tag">X = 1    Y = 0</text><text x="434" y="214" class="small">S = 1</text><rect x="537" y="196" width="31" height="10" rx="5" fill="#249e8b"></rect></g><g><rect x="606" y="151" width="168" height="89" rx="12" fill="#ffffff" stroke="#d8e4ed"></rect><text x="622" y="181" class="tag">X = 1    Y = 1</text><text x="622" y="214" class="small">S = 1</text><rect x="725" y="196" width="31" height="10" rx="5" fill="#249e8b"></rect></g><rect x="42" y="258" width="716" height="116" rx="13" fill="#ffffff" stroke="#dce7ee"></rect><text x="64" y="284" class="label">P(Y=1 | X)</text><text x="64" y="313" class="tag">X = 0</text><rect x="140" y="298" width="475" height="21" rx="6" fill="#e7edf2"></rect><rect x="140" y="298" width="475" height="21" rx="6" fill="#238f9b"></rect><text x="636" y="315" class="val" opacity="0">.50</text><text x="636" y="315" class="val">1.00</text><text x="64" y="351" class="tag">X = 1</text><rect x="140" y="336" width="475" height="21" rx="6" fill="#e7edf2"></rect><rect x="140" y="336" width="237.5" height="21" rx="6" fill="#e1835c"></rect><text x="636" y="353" class="val">.50</text><text x="43" y="400" class="label" opacity="0">ALL CASES</text><text x="758" y="400" class="label" text-anchor="end">SELECT S = 1</text></svg>