ndefinite"/><animate attributeName="y2" values="271;271;188.5;106;106;271" keyTimes="0;.18;.47;.76;.91;1" dur="12s" repeatCount="indefinite"/></line></g><g class="animated"><g transform="translate(352 271)"><circle r="11" fill="#d9913f" stroke="white" stroke-width="3"/><text x="18" y="-9" font-size="13" fill="#d9913f" font-weight="700">B</text><animateTransform attributeName="transform" type="translate" values="352 271;352 271;352 188.5;352 106;352 106;352 271" keyTimes="0;.18;.47;.76;.91;1" dur="12s" repeatCount="indefinite"/></g><g transform="translate(258.5 312.25)"><circle r="9" fill="#193449" stroke="white" stroke-width="2"/><text x="15" y="-9" font-size="13" fill="#193449" font-weight="700">P</text><animateTransform attributeName="transform" type="translate" values="258.5 312.25;258.5 312.25;258.5 291.625;258.5 271;258.5 271;258.5 312.25" keyTimes="0;.18;.47;.76;.91;1" dur="12s" repeatCount="indefinite"/></g></g><g class="reduced" display="none"><circle cx="352" cy="106" r="11" fill="#d9913f"/><circle cx="258.5" cy="271" r="9" fill="#193449"/><text x="366" y="100" font-size="13" fill="#d9913f" font-weight="700">B</text><text x="272" y="264" font-size="13" fill="#193449" font-weight="700">P</text></g><text x="56" y="365" font-size="13" fill="#637c90" font-weight="700">s : 0.5 → 2.0</text><text x="523" y="138" font-size="14" fill="#3478b5" font-weight="700">to A</text><rect x="523" y="154" width="213" height="24" rx="6" fill="#f4f8fb"/><rect x="523" y="154" width="95.01" height="24" rx="5" fill="#3478b5" class="animated"><animate attributeName="width" values="95.01;95.01;100.83;111.65;111.65;95.01" keyTimes="0;.18;.47;.76;.91;1" dur="12s" repeatCount="indefinite"/></rect><rect x="523" y="154" width="111.65" height="24" rx="5" fill="#3478b5" class="reduced" display="none"/><text x="523" y="199" font-size="12" fill="#637c90">5.35 → 6.29</text><text x="523" y="238" font-size="14" fill="#d9913f" font-weight="700">to B</text><rect x="523" y="254" width="213" height="