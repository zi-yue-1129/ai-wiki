<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Temperature-softened distillation</title><desc id="desc">Teacher probabilities become less peaked as temperature increases from 1 to 3; a student distribution then approaches the soft target. Illustrated probabilities only.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#087f82" stroke-width="1.8"/></marker><marker id="arrow-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7358bc" stroke-width="1.8"/></marker></defs><rect x="1" y="1" width="718" height="398" rx="16" fill="#f9fbfe" stroke="#dae5ef" stroke-width="1.4"/><text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#23364a" text-anchor="start">SOFT TARGET DISTILLATION</text><path d="M35 60 L685 60" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><text x="35" y="98" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#23364a" text-anchor="start">Teacher</text><text x="35" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#23364a" text-anchor="start">Student</text><text x="680" y="96" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="end">T = 3</text><text x="213" y="126" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#23364a" text-anchor="middle">A</text><rect x="188" y="133" width="50" height="102" rx="6" fill="#eaf2f8" stroke="#eaf2f8" stroke-width="1.4"/><path d="M174 235 L252 235" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><rect x="191" y="178.1" width="44" height="56.9" rx="5" fill="#087f82"></rect><rect x="188" y="285" width="50" height="82" rx="6" fill