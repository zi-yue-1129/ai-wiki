<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">COVERAGE UNDER DISTRIBUTION SHIFT</title><desc id="desc">Eight synthetic test scores move to a shifted hypothetical cohort while the calibration threshold remains fixed. Matched case has 7 of 8 scores at or below q; shifted case has 3 of 8. This is an illustrative sample, not an estimated coverage rate.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.2px}.tiny{font-size:12px}.label{font-size:14px;font-weight:700}.big{font-size:22px;font-weight:760}.muted{fill:#648094}@media(prefers-reduced-motion:reduce){animate{display:none!important}.reveal{opacity:1}}</style><rect width="640" height="360" rx="18" fill="#f4f8fc"/><text class="eyebrow" x="28" y="34">COVERAGE UNDER DISTRIBUTION SHIFT</text><text class="tiny muted" x="28" y="57">Fixed calibration q = 0.54  ·  alpha = 0.25</text><rect x="28" y="76" width="584" height="183" rx="13" fill="white" stroke="#d8e6ed"/><rect x="92" y="120" width="244.62" height="96" fill="#e8f6f2"/><path d="M92 214 H545" stroke="#a6bdcb" stroke-width="2"/><path d="M336.62 104 V222" stroke="#cf795a" stroke-width="3" stroke-dasharray="7 5"/><text x="315.62" y="99" class="tiny" font-weight="700">q = .54</text><text x="92" y="242" class="tiny muted" >0</text><text x="545" y="242" class="tiny muted" text-anchor="end">1</text><text x="105" y="140" class="tiny muted" >IN SET</text><text x="461" y="140" class="tiny muted" >OUT</text><circle cx="146.36" cy="167" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="250.55" cy="180" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="318.50" cy="193" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="359.27" cy="167" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="400.04" cy="180" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="431.75" cy="193" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="458.93" cy="167" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"></circle><circle cx="499.70" cy="180" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"></circle><rect x="28" y="272" width="269" height="61" rx="11" fill="#e9f6f3" stroke="#bdded6"/><rect x="312" y="272" width="300" height="61" rx="11" fill="#fff1ea" stroke="#f1d3c2"/><text x="45" y="295" class="tiny muted" >MATCHED TEST SAMPLE</text><text x="45" y="319" class="label" >7 / 8 in set</text><text x="329" y="295" class="tiny muted" >SHIFTED TEST SAMPLE</text><text x="329" y="319" class="label" >3 / 8 in set</text><text x="28" y="349" class="tiny muted" >Same calibration threshold; exchangeability may fail after shift</text></svg>