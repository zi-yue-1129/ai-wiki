<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">COVERAGE UNDER DISTRIBUTION SHIFT</ns0:title><ns0:desc id="desc">Eight synthetic test scores move to a shifted hypothetical cohort while the calibration threshold remains fixed. Matched case has 7 of 8 scores at or below q; shifted case has 3 of 8. This is an illustrative sample, not an estimated coverage rate.</ns0:desc><ns0:style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.2px}.tiny{font-size:12px}.label{font-size:14px;font-weight:700}.big{font-size:22px;font-weight:760}.muted{fill:#648094}</ns0:style><ns0:rect width="640" height="360" rx="18" fill="#f4f8fc" /><ns0:text class="eyebrow" x="28" y="34">COVERAGE UNDER DISTRIBUTION SHIFT</ns0:text><ns0:text class="tiny muted" x="28" y="57">Fixed calibration q = 0.54  ·  alpha = 0.25</ns0:text><ns0:rect x="28" y="76" width="584" height="183" rx="13" fill="white" stroke="#d8e6ed" /><ns0:rect x="92" y="120" width="244.62" height="96" fill="#e8f6f2" /><ns0:path d="M92 214 H545" stroke="#a6bdcb" stroke-width="2" /><ns0:path d="M336.62 104 V222" stroke="#cf795a" stroke-width="3" stroke-dasharray="7 5" /><ns0:text x="315.62" y="99" class="tiny" font-weight="700">q = .54</ns0:text><ns0:text x="92" y="242" class="tiny muted">0</ns0:text><ns0:text x="545" y="242" class="tiny muted" text-anchor="end">1</ns0:text><ns0:text x="105" y="140" class="tiny muted">IN SET</ns0:text><ns0:text x="461" y="140" class="tiny muted">OUT</ns0:text><ns0:circle cx="146.36" cy="167" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="250.55" cy="180" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="318.5" cy="193" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="359.27" cy="167" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="400.04" cy="180" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="431.75" cy="193" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="458.93" cy="167" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9" /><ns0:circle cx="499.7" cy="180" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9" /><ns0:rect x="28" y="272" width="269" height="61" rx="11" fill="#e9f6f3" stroke="#bdded6" /><ns0:rect x="312" y="272" width="300" height="61" rx="11" fill="#fff1ea" stroke="#f1d3c2" /><ns0:text x="45" y="295" class="tiny muted">START ENDPOINT</ns0:text><ns0:text x="45" y="319" class="label">7 / 8 in set</ns0:text><ns0:text x="329" y="295" class="tiny muted">END ENDPOINT</ns0:text><ns0:text x="329" y="319" class="label">3 / 8 in set</ns0:text><ns0:text x="28" y="349" class="tiny muted">Toy interpolation; colours switch at q. Hold, then reset.</ns0:text></ns0:svg>