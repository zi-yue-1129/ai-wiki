<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">JumpReLU: discontinuous threshold activation</title><desc id="desc">A moving preactivation crosses a positive feature threshold. Below or at threshold output is zero; above threshold the full preactivation is retained.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#243f53}.cap{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#6f8798}.small{font-size:13px;font-weight:600}.panel{fill:white;stroke:#d5e1e9;stroke-width:1.5} @media(prefers-reduced-motion:reduce){animate{display:none}} @media(prefers-reduced-motion:reduce){.motion-values{display:none!important}.reduced-values{display:inline!important}}</style><rect width="640" height="360" rx="18" fill="#f5f9fc" /><text x="28" y="37" class="cap">JUMPRELU</text><text x="28" y="58" class="small">Activation jumps at the threshold</text><rect class="panel" x="28" y="80" width="360" height="251" rx="12" /><rect class="panel" x="404" y="80" width="207" height="251" rx="12" /><path d="M74 292H358 M74 292V115" stroke="#6f8798" stroke-width="2" /><path d="M70 122L74 115L78 122 M352 288L358 292L352 296" stroke="#6f8798" stroke-width="2" fill="none" /><text x="362" y="307" class="small">z</text><text x="52" y="106" class="small">f(z)</text><path d="M201.5 126V292" stroke="#dc8a3d" stroke-width="2" stroke-dasharray="5 5" /><text x="187" y="320" class="small">θ=1.5</text><path d="M74 292H201.5" stroke="#91a8b8" stroke-width="4" fill="none" stroke-linecap="round" /><path d="M201.5 211L329 130" fill="none" stroke="#168f89" stroke-width="5" stroke-linecap="round" /><circle cx="201.5" cy="292" r="5" fill="#91a8b8" /><circle cx="201.5" cy="211" r="6" fill="white" stroke="#168f89" stroke-width="3" /><text x="422" y="118" class="cap">THRESHOLD</text><text x="422" y="147" class="small">1.5</text><text x="422" y="181" class="cap">INPUT</text><rect x="422" y="197" width="160" height="14" rx="7" fill="#f5f9fc" /><text x="422" y="246" class="cap">OUTPUT</text><rect x="422" y="261" width="160" height="14" rx="7" fill="#f5f9fc" /><text x="421" y="304" class="small">0 if z ≤ θ · z if z &gt; θ</text><g id="low-branch" class="motion-values" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;.45;1" dur="9s" repeatCount="indefinite" calcMode="discrete" /><circle id="low-marker" cx="74" cy="292" r="8" fill="#dc8a3d" stroke="white" stroke-width="2"><animate attributeName="cx" values="74;329;329" keyTimes="0;.9;1" dur="9s" repeatCount="indefinite" calcMode="linear" /></circle></g><g id="high-branch" class="motion-values" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;.45;1" dur="9s" repeatCount="indefinite" calcMode="discrete" /><circle id="high-marker" cx="74" cy="292" r="8" fill="#dc8a3d" stroke="white" stroke-width="2"><animate attributeName="cx" values="74;329;329" keyTimes="0;.9;1" dur="9s" repeatCount="indefinite" calcMode="linear" /><animate attributeName="cy" values="292;130;130" keyTimes="0;.9;1" dur="9s" repeatCount="indefinite" calcMode="linear" /></circle><rect id="output-value" x="422" y="261" width="0" height="14" rx="7" fill="#168f89"><animate attributeName="width" values="0;150;150" keyTimes="0;.9;1" dur="9s" repeatCount="indefinite" calcMode="linear" /></rect></g><rect id="input-value" class="motion-values" x="422" y="197" width="0" height="14" rx="7" fill="#dc8a3d"><animate attributeName="width" values="0;150;150" keyTimes="0;.9;1" dur="9s" repeatCount="indefinite" calcMode="linear" /></rect><g class="reduced-values" style="display:none"><circle cx="265.25" cy="170.5" r="8" fill="#dc8a3d" stroke="white" stroke-width="2" id="static-input-marker" /><rect x="422" y="197" width="112.5" height="14" rx="7" fill="#dc8a3d" /><rect x="422" y="261" width="112.5" height="14" rx="7" fill="#168f89" /></g></svg>
