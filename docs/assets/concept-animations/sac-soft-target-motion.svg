<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="sac-title sac-desc"><title id="sac-title">SAC: twin-critic soft Bellman backup</title><desc id="sac-desc">Two target critics form a conservative minimum, then an entropy bonus is added before reward and discount form the soft Q target. Schematic numbers only.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbff" stroke="none" stroke-width="0" /><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e5ef" stroke-width="1" /><text x="25" y="37" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">SAC / Soft Q target</text><rect x="471" y="16" width="143" height="29" rx="14" fill="#e9f0f6" stroke="none" stroke-width="0" /><text x="542" y="35" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle">modern SAC (2018b)</text><rect x="25" y="67" width="282" height="178" rx="12" fill="#fff" stroke="#d9e5ef" stroke-width="1.4" /><rect x="331" y="67" width="283" height="178" rx="12" fill="#fff" stroke="#d9e5ef" stroke-width="1.4" /><text x="44" y="99" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Twin critics</text><text x="347" y="99" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Entropy bonus</text><text x="48" y="136" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Q₁</text><text x="48" y="174" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Q₂</text><rect x="92" y="122" width="169" height="14" rx="7" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="92" y="160" width="169" height="14" rx="7" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="92" y="122" width="142" height="14" rx="7" fill="#3269ad" stroke="none" stroke-width="0" /><rect x="92" y="160" width="128" height="14" rx="7" fill="#078f91" stroke="none" stroke-width="0" /><text x="276" y="135" fill="#3269ad" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">4.2</text><text x="276" y="173" fill="#078f91" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">3.8</text><rect x="162" y="193" width="124" height="37" rx="10" fill="#dff5f2" stroke="none" stroke-width="0" /><text x="224" y="217" fill="#078f91" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">min = 3.8<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.27;.93;1" dur="10s" repeatCount="indefinite"/></text><text x="349" y="139" fill="#d77a36" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">−α log π</text><text x="349" y="172" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" text-anchor="start">−0.20 × (−0.70)</text><rect x="482" y="189" width="109" height="38" rx="10" fill="#fff0e1" stroke="none" stroke-width="0" /><text x="536" y="214" fill="#d77a36" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">+0.14<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.40;.50;.93;1" dur="10s" repeatCount="indefinite"/></text><path d="M226 245 L226 260 Q226 269 242 279" fill="none" stroke="#078f91" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M527 245 L527 260 Q527 269 398 279" fill="none" stroke="#d77a36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><rect x="181" y="277" width="278" height="65" rx="14" fill="#fff" stroke="#d9e5ef" stroke-width="1.8" /><text x="320" y="300" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="middle">r + γ [ min Q − α log π ]</text><text x="320" y="331" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle">1 + 0.9 × 3.94 = 4.546<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.73;.94;1" dur="10s" repeatCount="indefinite"/></text><rect class="moving" x="91" y="159" width="130" height="16" rx="8" fill="none" stroke="#078f91" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".10;1;.1;.1;.1" keyTimes="0;.16;.32;.65;1" dur="10s" repeatCount="indefinite"/></rect><rect class="moving" x="481" y="188" width="111" height="40" rx="11" fill="none" stroke="#d77a36" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".1;.1;.2;1;.1" keyTimes="0;.22;.48;.70;1" dur="10s" repeatCount="indefinite"/></rect><rect class="moving" x="178" y="274" width="284" height="70" rx="15" fill="none" stroke="#6957bd" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".1;.1;.1;1;.1" keyTimes="0;.42;.60;.85;1" dur="10s" repeatCount="indefinite"/></rect><circle class="moving" r="5" fill="#078f91" opacity="0.95"><animateMotion path="M226 245 L226 260 Q226 269 242 279" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.83;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle class="moving" r="5" fill="#d77a36" opacity="0.95"><animateMotion path="M527 245 L527 260 Q527 269 398 279" dur="10s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.83;1" dur="10s" begin="1.2s" repeatCount="indefinite"/></circle></svg>