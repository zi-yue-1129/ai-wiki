<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Real NVP affine coupling: conditioning, transform and inverse</title><desc id="desc">Four-stage toy affine coupling with xA=0.5, xB=1, scale ln2 and shift -0.5. The transformed channel is 1.5 and inverse recovers 1; schematic not model measurements.</desc><defs><marker id="muted-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#73899b" stroke-width="1.5"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#087f83" stroke-width="1.5"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#3678b5" stroke-width="1.5"/></marker><marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#d18a32" stroke-width="1.5"/></marker><marker id="violet-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#8757ad" stroke-width="1.5"/></marker><marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#3b9779" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#c8d7e2" stroke-width="1"/><rect x="27" y="105" width="106" height="146" rx="13" fill="#ffffff" stroke="#c8d7e2" stroke-width="1.5"/><text x="80" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#73899b">Input x</text><rect x="42" y="139" width="76" height="40" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1.5"/><text x="80" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#087f83">xA = 0.5</text><rect x="42" y="190" width="76" height="40" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1.5"/><text x="80" y="216" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3678b5">xB = 1</text><rect x="188" y="104" width="124" height="79" rx="13" fill="#ffffff" stroke="#c8d7e2" stroke-width="1.5"/><text x="250" y="129" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#23384b">s(xA), t(xA)</text><text x="250" y="155" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#d18a32">ln 2, −0.5</text><rect x="188" y="203" width="124" height="56" rx="12" fill="#ffffff" stroke="#c8d7e2" stroke-width="1.5"/><text x="250" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#23384b">exp(s) · xB + t</text><text x="250" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3678b5">= 1.5</text><rect x="367" y="105" width="110" height="146" rx="13" fill="#ffffff" stroke="#c8d7e2" stroke-width="1.5"/><text x="422" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#73899b">Output y</text><rect x="382" y="139" width="80" height="40" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1.5"/><text x="422" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#087f83">yA = 0.5</text><rect x="382" y="190" width="80" height="40" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1.5"/><text x="422" y="216" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3678b5">yB = 1.5</text><rect x="519" y="149" width="101" height="76" rx="12" fill="#ffffff" stroke="#c8d7e2" stroke-width="1.5"/><text x="569" y="173" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#8757ad">Inverse</text><text x="569" y="194" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#23384b">(yB−t)/eˢ</text><text x="569" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#3678b5">= 1</text><path d="M133 159 H170 V139 H188" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><path d="M133 210 H188" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><path d="M250 183 V203" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><path d="M312 231 H347 V210 H367" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><path d="M133 145 H159 V83 H339 V159 H367" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><path d="M477 208 H519" fill="none" stroke="#73899b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><rect x="28" y="302" width="584" height="39" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1"/><rect x="20" y="18" width="142" height="35" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1"/><text x="91" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#73899b">Split</text><rect x="173" y="18" width="142" height="35" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1"/><text x="244" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#73899b">Condition</text><rect x="326" y="18" width="142" height="35" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1"/><text x="397" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#73899b">Transform</text><rect x="479" y="18" width="142" height="35" rx="8" fill="#087f83" stroke="#087f83" stroke-width="1"/><text x="550" y="40" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#ffffff">Invert</text><path d="M133 159 H170 V139 H188" fill="none" stroke="#d18a32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-arrow)"/><rect x="185" y="101" width="130" height="85" rx="13" fill="none" stroke="#d18a32" stroke-width="3"/><path d="M250 183 V203" fill="none" stroke="#d18a32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-arrow)"/><text x="320" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#23384b">xA determines scale and shift</text><path d="M133 210 H188" fill="none" stroke="#3678b5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><rect x="185" y="200" width="130" height="62" rx="12" fill="none" stroke="#3678b5" stroke-width="3"/><path d="M312 231 H347 V210 H367" fill="none" stroke="#3678b5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><rect x="379" y="187" width="86" height="46" rx="8" fill="none" stroke="#3678b5" stroke-width="3"/><text x="320" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#23384b">xB changes; log |det J| = ln 2</text><path d="M477 208 H519" fill="none" stroke="#8757ad" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violet-arrow)"/><rect x="516" y="146" width="107" height="82" rx="12" fill="none" stroke="#8757ad" stroke-width="3"/><path d="M569 228 V277 H85 V252" fill="none" stroke="#8757ad" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#violet-arrow)"/><text x="320" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#8757ad">Inverse recovers xB exactly</text><rect x="28" y="302" width="584" height="39" rx="8" fill="#edf4f8" stroke="#c8d7e2" stroke-width="1"/><text x="320" y="328" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#23384b">Copy xA · transform xB · invert exactly</text></svg>