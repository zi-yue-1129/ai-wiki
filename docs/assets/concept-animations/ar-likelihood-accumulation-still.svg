<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Chain rule probability and negative log-likelihood</title><desc id="desc">Three conditional token probabilities 0.5, 0.2 and 0.4 multiply to 0.04. Orange marker traverses cumulative prefix probabilities 0.50, 0.10 and 0.04. Total negative log-likelihood is 3.22 nats.</desc><rect x="0" y="0" width="800" height="420" rx="16" fill="#f6fafc" stroke="#d8e4ec" stroke-width="1.3" /><text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >CHAIN RULE  /  LOG-LIKELIHOOD</text><text x="400" y="73" text-anchor="middle" font-size="13" font-weight="500" fill="#587185" font-family="Arial,Helvetica,sans-serif" >p(sequence) = product of next-token probabilities</text><rect x="47" y="92" width="202" height="139" rx="13" fill="#ffffff" stroke="#d8e4ec" stroke-width="1.3" /><rect x="66" y="109" width="164" height="41" rx="9" fill="#e9f4fc" stroke="#257db4" stroke-width="1.3" /><text x="148" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#257db4" font-family="Arial,Helvetica,sans-serif" >Drink</text><text x="148" y="181" text-anchor="middle" font-size="18" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >p = 0.50</text><text x="148" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="#587185" font-family="Arial,Helvetica,sans-serif" >−log = 0.69</text><rect x="299" y="92" width="202" height="139" rx="13" fill="#ffffff" stroke="#d8e4ec" stroke-width="1.3" /><rect x="318" y="109" width="164" height="41" rx="9" fill="#e9f4fc" stroke="#257db4" stroke-width="1.3" /><text x="400" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#257db4" font-family="Arial,Helvetica,sans-serif" >tea</text><text x="400" y="181" text-anchor="middle" font-size="18" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >p = 0.20</text><text x="400" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="#587185" font-family="Arial,Helvetica,sans-serif" >−log = 1.61</text><rect x="551" y="92" width="202" height="139" rx="13" fill="#ffffff" stroke="#d8e4ec" stroke-width="1.3" /><rect x="570" y="109" width="164" height="41" rx="9" fill="#e9f4fc" stroke="#257db4" stroke-width="1.3" /><text x="652" y="137" text-anchor="middle" font-size="17" font-weight="700" fill="#257db4" font-family="Arial,Helvetica,sans-serif" >EOS</text><text x="652" y="181" text-anchor="middle" font-size="18" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >p = 0.40</text><text x="652" y="208" text-anchor="middle" font-size="13" font-weight="500" fill="#587185" font-family="Arial,Helvetica,sans-serif" >−log = 0.92</text><text x="261" y="171" text-anchor="middle" font-size="26" font-weight="700" fill="#d78335" font-family="Arial,Helvetica,sans-serif" >×</text><text x="513" y="171" text-anchor="middle" font-size="26" font-weight="700" fill="#d78335" font-family="Arial,Helvetica,sans-serif" >×</text><text x="55" y="268" text-anchor="start" font-size="13" font-weight="550" fill="#587185" font-family="Arial,Helvetica,sans-serif" >prefix</text><line x1="94" y1="296" x2="714" y2="296" stroke="#d8e4ec" stroke-width="5" stroke-linecap="round" /><circle cx="173" cy="296" r="7" fill="#257db4"/><text x="173" y="327" text-anchor="middle" font-size="14" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >0.50</text><circle cx="408" cy="296" r="7" fill="#257db4"/><text x="408" y="327" text-anchor="middle" font-size="14" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >0.10</text><circle cx="643" cy="296" r="7" fill="#257db4"/><text x="643" y="327" text-anchor="middle" font-size="14" font-weight="650" fill="#20374c" font-family="Arial,Helvetica,sans-serif" >0.04</text><circle cx="643" cy="296" r="16" fill="none" stroke="#d78335" stroke-width="3"></circle><text x="400" y="363" text-anchor="middle" font-size="14" font-weight="500" fill="#587185" font-family="Arial,Helvetica,sans-serif" >cumulative probability</text><rect x="48" y="375" width="704" height="32" rx="10" fill="#e9f4f6" /><text x="400" y="397" text-anchor="middle" font-size="15" font-weight="700" fill="#138b84" font-family="Arial,Helvetica,sans-serif" >p = 0.50 × 0.20 × 0.40 = 0.04      •      NLL ≈ 3.22</text></svg>