<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Bootstrap resampling and out-of-bag cases</title><desc id="desc">An illustrative sample A C C E F F is drawn from six training cases, leaving B and D out of bag for this tree. The moving markers are conceptual draws, not model observations.</desc><rect x="0" y="0" width="800" height="420" rx="0" fill="#f5f9fc" /><rect x="16" y="15" width="768" height="390" rx="17" fill="#ffffff" stroke="#d4e1ea" stroke-width="1.5" /><text x="38" y="55" font-size="21" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Bootstrap with replacement</text><text x="38" y="79" font-size="13" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">One tree &#183; six draws &#183; duplicates remain in the bag</text><rect x="34" y="95" width="555" height="120" rx="14" fill="#f8fbfd" stroke="#d4e1ea" stroke-width="1.5" /><rect x="34" y="225" width="555" height="112" rx="14" fill="#f8fbfd" stroke="#d4e1ea" stroke-width="1.5" /><text x="54" y="119" font-size="12" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">TRAINING SET</text><text x="54" y="248" font-size="12" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">BOOTSTRAP BAG</text><circle cx="103" cy="173" r="26" fill="#ffffff" stroke="#467cae" stroke-width="3"/><text x="103" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">A</text><rect x="74" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="189" cy="173" r="26" fill="#ffffff" stroke="#d29646" stroke-width="3"/><text x="189" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">B</text><rect x="160" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="275" cy="173" r="26" fill="#ffffff" stroke="#278c86" stroke-width="3"/><text x="275" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">C</text><rect x="246" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="361" cy="173" r="26" fill="#ffffff" stroke="#aa759e" stroke-width="3"/><text x="361" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">D</text><rect x="332" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="447" cy="173" r="26" fill="#ffffff" stroke="#799e4d" stroke-width="3"/><text x="447" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">E</text><rect x="418" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="533" cy="173" r="26" fill="#ffffff" stroke="#d47861" stroke-width="3"/><text x="533" y="179" font-size="18" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">F</text><rect x="504" y="266" width="58" height="58" rx="10" fill="#ffffff" stroke="#d5e3ec" stroke-width="1.5" stroke-dasharray="5 4"/><g class="draw" data-draw="1" ><g transform="translate(103 295)"><circle cx="0" cy="0" r="24" fill="#467cae" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">A</text></g></g><g class="draw" data-draw="2" ><g transform="translate(189 295)"><circle cx="0" cy="0" r="24" fill="#278c86" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">C</text></g></g><g class="draw" data-draw="3" ><g transform="translate(275 295)"><circle cx="0" cy="0" r="24" fill="#278c86" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">C</text></g></g><g class="draw" data-draw="4" ><g transform="translate(361 295)"><circle cx="0" cy="0" r="24" fill="#799e4d" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">E</text></g></g><g class="draw" data-draw="5" ><g transform="translate(447 295)"><circle cx="0" cy="0" r="24" fill="#d47861" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">F</text></g></g><g class="draw" data-draw="6" ><g transform="translate(533 295)"><circle cx="0" cy="0" r="24" fill="#d47861" stroke="#ffffff" stroke-width="2.4"/><text x="0" y="6" font-size="18" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">F</text></g></g><rect x="608" y="95" width="154" height="242" rx="14" fill="#f1f7f9" stroke="#d4e1ea" stroke-width="1.5" /><text x="630" y="126" font-size="14" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">OUT OF BAG</text><text x="630" y="151" font-size="12" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Never drawn</text><g class="oob-motion" ><circle cx="649" cy="194" r="22" fill="#ffffff" stroke="#d29646" stroke-width="2.8"/><text x="649" y="200" font-size="17" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">B</text></g><g class="oob-motion" ><circle cx="649" cy="257" r="22" fill="#ffffff" stroke="#aa759e" stroke-width="2.8"/><text x="649" y="263" font-size="17" fill="#20384e" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">D</text></g><text x="45" y="378" font-size="13" fill="#087e88" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">With replacement</text><text x="200" y="378" font-size="13" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">&#8594; same item may appear more than once</text><text x="757" y="380" font-size="13" fill="#536f82" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="end">n = 6</text></svg>