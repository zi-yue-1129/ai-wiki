<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Sparse Jacobian recovery using two packed seed directions</title><desc id="desc">A four by four block-sparse Jacobian has eight known nonzero entries. The first seed probes columns one and two, which occupy disjoint output rows, and the second probes columns three and four. Together two exact JVPs recover all eight values rather than four one-column passes.</desc><rect width="800" height="420" rx="18" fill="#f2f7fa"/><rect x="16" y="16" width="768" height="388" rx="16" fill="#fff" stroke="#d8e6ec"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="53" fill="#17364a" font-size="22" font-weight="bold">Sparse Jacobian · packed tangent seeds</text><text x="38" y="79" fill="#617a8a" font-size="13" >Two JVP passes recover eight entries when sparsity is known</text><rect x="36" y="105" width="343" height="255" rx="12" fill="#f8fbfd" stroke="#d8e6ec"/><text x="55" y="137" fill="#17364a" font-size="17" font-weight="bold">Known sparsity pattern</text><text x="106" y="151" fill="#617a8a" font-size="11" text-anchor="middle">x1</text><text x="166" y="151" fill="#617a8a" font-size="11" text-anchor="middle">x2</text><text x="226" y="151" fill="#617a8a" font-size="11" text-anchor="middle">x3</text><text x="286" y="151" fill="#617a8a" font-size="11" text-anchor="middle">x4</text><rect x="80" y="158" width="51" height="39" rx="7" fill="#e4f4f3" stroke="#047e88"/><text x="105.5" y="184" fill="#047e88" font-size="18" text-anchor="middle" font-weight="bold">1</text><rect x="140" y="158" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="165.5" y="184" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="200" y="158" width="51" height="39" rx="7" fill="#fff0df" stroke="#c57219"/><text x="225.5" y="184" fill="#c57219" font-size="18" text-anchor="middle" font-weight="bold">2</text><rect x="260" y="158" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="285.5" y="184" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="80" y="204" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="105.5" y="230" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="140" y="204" width="51" height="39" rx="7" fill="#e4f4f3" stroke="#047e88"/><text x="165.5" y="230" fill="#047e88" font-size="18" text-anchor="middle" font-weight="bold">3</text><rect x="200" y="204" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="225.5" y="230" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="260" y="204" width="51" height="39" rx="7" fill="#fff0df" stroke="#c57219"/><text x="285.5" y="230" fill="#c57219" font-size="18" text-anchor="middle" font-weight="bold">4</text><rect x="80" y="250" width="51" height="39" rx="7" fill="#e4f4f3" stroke="#047e88"/><text x="105.5" y="276" fill="#047e88" font-size="18" text-anchor="middle" font-weight="bold">5</text><rect x="140" y="250" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="165.5" y="276" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="200" y="250" width="51" height="39" rx="7" fill="#fff0df" stroke="#c57219"/><text x="225.5" y="276" fill="#c57219" font-size="18" text-anchor="middle" font-weight="bold">6</text><rect x="260" y="250" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="285.5" y="276" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="80" y="296" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="105.5" y="322" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="140" y="296" width="51" height="39" rx="7" fill="#e4f4f3" stroke="#047e88"/><text x="165.5" y="322" fill="#047e88" font-size="18" text-anchor="middle" font-weight="bold">7</text><rect x="200" y="296" width="51" height="39" rx="7" fill="#f3f6f9" stroke="#e5ebef"/><text x="225.5" y="322" fill="#afbdc6" font-size="18" text-anchor="middle" font-weight="bold">0</text><rect x="260" y="296" width="51" height="39" rx="7" fill="#fff0df" stroke="#c57219"/><text x="285.5" y="322" fill="#c57219" font-size="18" text-anchor="middle" font-weight="bold">8</text><rect x="77" y="155" width="116" height="190" rx="9" fill="none" stroke="#047e88" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="opacity" values="1;1;0.13;0.13;1" keyTimes="0;0.48;0.50;0.98;1" dur="12s" repeatCount="indefinite"/></rect><rect x="197" y="155" width="116" height="190" rx="9" fill="none" stroke="#c57219" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="opacity" values="0.13;0.13;1;1;0.13" keyTimes="0;0.48;0.50;0.98;1" dur="12s" repeatCount="indefinite"/></rect><rect x="420" y="105" width="344" height="112" rx="12" fill="#f8fbfd" stroke="#d8e6ec"/><rect x="420" y="230" width="344" height="130" rx="12" fill="#f8fbfd" stroke="#d8e6ec"/><text x="437" y="132" fill="#047e88" font-size="16" font-weight="bold">Pass A</text><text x="437" y="159" fill="#17364a" font-size="15" >seed  (1, 1, 0, 0)</text><text x="437" y="189" fill="#047e88" font-size="16" font-weight="bold">Jv   (1, 3, 5, 7)</text><text x="437" y="259" fill="#c57219" font-size="16" font-weight="bold">Pass B</text><text x="437" y="288" fill="#17364a" font-size="15" >seed  (0, 0, 1, 1)</text><text x="437" y="318" fill="#c57219" font-size="16" font-weight="bold">Jv   (2, 4, 6, 8)</text><rect x="427" y="111" width="330" height="101" rx="9" stroke="#047e88" stroke-width="3" fill="none"><animate attributeName="opacity" values="1;1;0.12;0.12;1" keyTimes="0;0.48;0.5;0.98;1" dur="12s" repeatCount="indefinite"/></rect><rect x="427" y="236" width="330" height="117" rx="9" stroke="#c57219" stroke-width="3" fill="none"><animate attributeName="opacity" values="0.12;0.12;1;1;0.12" keyTimes="0;0.48;0.5;0.98;1" dur="12s" repeatCount="indefinite"/></rect><circle cx="397" cy="166" r="7" fill="#047e88"><animate attributeName="cy" values="166;166;292;292;166" keyTimes="0;0.48;0.50;0.98;1" dur="12s" repeatCount="indefinite"/><animate attributeName="fill" values="#047e88;#047e88;#c57219;#c57219;#047e88" keyTimes="0;0.48;0.50;0.98;1" dur="12s" repeatCount="indefinite"/></circle><text x="41" y="387" fill="#617a8a" font-size="12" >Color-grouped columns never collide in one output row</text><text x="758" y="387" fill="#617a8a" font-size="11" text-anchor="end">Exact synthetic 4×4 Jacobian</text></g></svg>