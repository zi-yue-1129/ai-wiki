<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Class prevalence changes accuracy, not balanced accuracy</title><desc id="desc">Holding positive recall at 0.8 and specificity at 0.9, the positive class prevalence smoothly changes from 10 to 90 percent and back. Overall accuracy moves from 0.89 to 0.81, whereas balanced accuracy stays 0.85.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#19354d}.title{font-size:17px;font-weight:760;letter-spacing:.7px}.sub{font-size:11px;fill:#647c91}.lab{font-size:12px;font-weight:650}.num{font-size:18px;font-weight:780}.static-stage{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.static-stage{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f2f7fb"/><rect x="14" y="14" width="612" height="332" rx="13" fill="#ffffff" stroke="#dce7ef"/><text x="34" y="45" class="title" >CLASS MIX  /  ACCURACY</text><text x="34" y="68" class="sub" >Fixed TPR = .80     TNR = .90</text><rect x="32" y="84" width="276" height="233" fill="#f8fbfd" rx="10" stroke="#e5edf3"/><rect x="320" y="84" width="288" height="233" fill="#f8fbfd" rx="10" stroke="#e5edf3"/><text x="48" y="111" class="lab" >Positive share</text><text x="48" y="137" class="sub" >10%</text><text x="278" y="137" class="sub" text-anchor="end">90%</text><rect x="48" y="149" width="246" height="19" fill="#e4ebf6" rx="6"/><text x="48" y="199" class="lab" >Accuracy</text><rect x="125" y="187" width="168" height="14" fill="#e0e9f0" rx="5"/><text x="48" y="244" class="lab" >Balanced</text><rect x="125" y="233" width="168" height="14" fill="#e0e9f0" rx="5"/><rect x="125" y="233" width="142.8" height="14" fill="#486fc2" rx="5"/><text x="48" y="282" class="sub" >Expected rates • no sampling</text><text x="340" y="111" class="lab" >Accuracy vs prevalence</text><line x1="356" y1="136" x2="580" y2="136" stroke="#dbe7ee" stroke-dasharray="3 5"/><line x1="356" y1="203" x2="580" y2="203" stroke="#dbe7ee" stroke-dasharray="3 5"/><line x1="356" y1="270" x2="580" y2="270" stroke="#dbe7ee" stroke-dasharray="3 5"/><text x="337" y="140" class="sub" >.90</text><text x="337" y="207" class="sub" >.85</text><text x="337" y="274" class="sub" >.80</text><path d="M359 149.4 L574 256.6" fill="none" stroke="#139a88" stroke-width="3.5" stroke-linecap="round"/><path d="M359 203 L574 203" fill="none" stroke="#486fc2" stroke-width="3" stroke-dasharray="7 5"/><text x="355" y="291" class="sub" >10%</text><text x="572" y="291" class="sub" text-anchor="end">90%</text><text x="460" y="309" class="sub" text-anchor="middle">Positive prevalence</text><text x="527" y="218" class="sub" >Acc</text><text x="583" y="194" class="sub" text-anchor="end">Bal</text><g class="moving"><rect x="48" y="149" width="24.6" height="19" rx="6" fill="#139a88"><animate attributeName="width" values="24.6;221.4;24.6" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></rect><rect x="125" y="187" width="149.52" height="14" rx="5" fill="#139a88"><animate attributeName="width" values="149.52;136.08;149.52" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></rect><line x1="359" x2="359" y1="132" y2="270" stroke="#24465f" stroke-width="1" stroke-dasharray="3 4" opacity=".6"><animate attributeName="x1" values="359;574;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="359;574;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></line><circle cx="359" cy="149.4" r="6" fill="#139a88" stroke="white" stroke-width="2"><animate attributeName="cx" values="359;574;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="149.4;256.6;149.4" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="359" cy="203" r="5" fill="#486fc2" stroke="white" stroke-width="2"><animate attributeName="cx" values="359;574;359" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="static-stage"><rect x="48" y="149" width="221.4" height="19" fill="#139a88" rx="6"/><rect x="125" y="187" width="136.08" height="14" fill="#139a88" rx="5"/><circle cx="574" cy="256.6" r="6" fill="#139a88" stroke="white" stroke-width="2"/><circle cx="574" cy="203" r="5" fill="#486fc2" stroke="white" stroke-width="2"/></g></svg>