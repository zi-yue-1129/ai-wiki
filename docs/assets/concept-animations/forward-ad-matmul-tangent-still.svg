<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Forward AD matrix product: two tangent paths</title><desc id="desc">For two-by-two matrices, the derivative of AB is dA times B plus A times dB. Teal and amber dotted flows contribute the exact output tangent matrix (3,1;1,0); the dashed paths animate continuously.</desc><rect x="0" y="0" width="800" height="420" rx="18" fill="#f1f7fa" stroke="none" /><rect x="16" y="16" width="768" height="388" rx="16" fill="#fff" stroke="#d7e5eb" /><text x="38" y="53" font-size="22" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700">Matrix-product tangent paths</text><text x="38" y="78" font-size="15" fill="#597386" font-family="Arial,Helvetica,sans-serif" >C = A B              δC = δA B + A δB</text><rect x="34" y="99" width="551" height="282" rx="11" fill="#f7fafc" stroke="#d7e5eb" /><rect x="602" y="162" width="164" height="177" rx="11" fill="#f7fafd" stroke="#d7e5eb" /><text x="51" y="134" font-size="15" fill="#087f88" font-family="Arial,Helvetica,sans-serif" font-weight="700">δA</text><rect x="48" y="145" width="105" height="78" rx="10" fill="#fff" stroke="#087f88" stroke-width="1.8"/><rect x="58" y="154" width="38" height="25" rx="4" fill="#f7fafc" stroke="#e6eef3" /><text x="77" y="172" font-size="16" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">0</text><rect x="101" y="154" width="38" height="25" rx="4" fill="#f7fafc" stroke="#e6eef3" /><text x="120" y="172" font-size="16" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">1</text><rect x="58" y="184" width="38" height="25" rx="4" fill="#f7fafc" stroke="#e6eef3" /><text x="77" y="202" font-size="16" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">0</text><rect x="101" y="184" width="38" height="25" rx="4" fill="#f7fafc" stroke="#e6eef3" /><text