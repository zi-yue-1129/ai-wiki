<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><title>Mean Teacher weight tracking</title><desc>The student parameter takes sharp illustrative training steps while the teacher parameter changes by exponential moving average with alpha 0.75. Student gets gradients; teacher updates only through EMA.</desc><rect width="640" height="360" fill="#f7fafc"/><text x="22" y="33" fill="#193248" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Mean Teacher &#183; student updates, teacher follows</text><text x="618" y="32" fill="#66788c" font-size="14" font-weight="600" text-anchor="end" font-family="Arial,Helvetica,sans-serif">&#945; = 0.75</text><rect x="20" y="49" width="600" height="222" rx="13" fill="#ffffff" stroke="#d8e4ed"/><text x="38" y="72" fill="#66788c" font-size="11" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SCALAR WEIGHT (illustrative)</text><line x1="65" y1="238" x2="585" y2="238" stroke="#d9e5ed" stroke-width="2"  stroke-linecap="round"/><line x1="65" y1="87" x2="65" y2="238" stroke="#d9e5ed" stroke-width="2"  stroke-linecap="round"/><line x1="65" y1="238" x2="585" y2="238" stroke="#e4ecf1" stroke-width="1.1"  stroke-linecap="round"/><text x="55" y="242" fill="#66788c" font-size="10" font-weight="500" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0.00</text><line x1="65" y1="203" x2="585" y2="203" stroke="#e4ecf1" stroke-width="1.1"  stroke-linecap="round"/><text x="55" y="207" fill="#66788c" font-size="10" font-weight="500" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0.25</text><line x1="65" y1="168" x2="585" y2="168" stroke="#e4ecf1" stroke-width="1.1"  stroke-linecap="round"/><text x="55" y="172" fill="#66788c" font-size="10" font-weight="500" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0.50</text><line x1="65" y1="133" x2="585" y2="133" stroke="#e4ecf1" stroke-width="1.1"  stroke-linecap="round"/><text x="55" y="137" fill="#66788c" font-size="10" font-weight="500" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0.75</text><line x1="65" y1="98" x2="585" y2="98" stroke="#e4ecf1" stroke-width="1.1"  stroke-linecap="round"/><text x="55" y="102" fill="#66788c" font-size="10" font-weight="500" text-anchor="end" font-family="Arial,Helvetica,sans-serif">1.00</text><path d="M82 217.00 L202 119.00 L322 189.00 L442 105.00 L562 168.00" stroke="#2877ac" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M82 217.00 L202 192.50 L322 191.63 L442 169.97 L562 169.48" stroke="#169b86" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="82" y="255" fill="#66788c" font-size="11" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><circle cx="82" cy="217" r="3.5" fill="#2877ac"/><circle cx="82" cy="217" r="3.5" fill="#169b86"/><text x="202" y="255" fill="#66788c" font-size="11" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><circle cx="202" cy="119" r="3.5" fill="#2877ac"/><circle cx="202" cy="192.5" r="3.5" fill="#169b86"/><text x="322" y="255" fill="#66788c" font-size="11" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">2</text><circle cx="322" cy="189" r="3.5" fill="#2877ac"/><circle cx="322" cy="191.625" r="3.5" fill="#169b86"/><text x="442" y="255" fill="#66788c" font-size="11" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">3</text><circle cx="442" cy="105" r="3.5" fill="#2877ac"/><circle cx="442" cy="169.96875" r="3.5" fill="#169b86"/><text x="562" y="255" fill="#66788c" font-size="11" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">4</text><circle cx="562" cy="168" r="3.5" fill="#2877ac"/><circle cx="562" cy="169.4765625" r="3.5" fill="#169b86"/><text x="322" y="267" fill="#66788c" font-size="10" font-weight="500" text-anchor="middl