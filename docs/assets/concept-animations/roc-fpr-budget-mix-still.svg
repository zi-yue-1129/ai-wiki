<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Randomized ROC policy under a false-positive-rate budget</title><desc id="desc">For constructed six-item ranking plus minus plus plus minus minus, a randomized rule mixes threshold k equals one with k equals four. The ROC point moves from false-positive rate zero and true-positive rate one third to false-positive rate one third and true-positive rate one. The dashed false-positive-rate budget at one sixth is reached halfway. Expected cost decreases from eight fifteenths to one fifth as the probability of choosing k equals four increases, but the points beyond one half violate the budget. The feasible optimum within this two-rule family is the halfway mix, with expected cost eleven thirtieths. Not model measurements.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#233d50}.head{font-size:17px;font-weight:750}.cap{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#526e80}.tiny{font-size:10px;fill:#5a7587}.teal{fill:#207c86}.rust{fill:#b9683f}.moving{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="23" y="31" class="head">FPR budget · randomized policy</text><rect x="20" y="52" width="293" height="266" rx="12" fill="white" stroke="#d2e0e9"/><rect x="326" y="52" width="294" height="266" rx="12" fill="white" stroke="#d2e0e9"/><text x="39" y="75" class="cap">ROC · MIXED OPERATING POINT</text><text x="344" y="75" class="cap">COST · MIXING PROBABILITY</text><rect x="70" y="106" width="32.5" height="169" fill="#e2f3ee"/><rect x="102.5" y="106" width="162.5" height="169" fill="#fcf0e9" opacity=".65"/><line x1="70" y1="275" x2="266" y2="275" stroke="#819bab" stroke-width="1.6"/><line x1="70" y1="275" x2="70" y2="103" stroke="#819bab" stroke-width="1.6"/><text x="42" y="102" class="tiny">TPR</text><text x="170" y="301" class="sub" text-anchor="middle">False positive rate</text><line x1="102.5" y1="105" x2="102.5" y2="275" stroke="#617f93" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M70,220 L102.5,165" fill="none" stroke="#207c86" stroke-width="4" stroke-linecap="round"/><path d="M102.5,165 L135,110" fill="none" stroke="#b9683f" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="70" cy="220" r="5.5" fill="#207c86" stroke="white" stroke-width="2"/><circle cx="135" cy="110" r="5.5" fill="#b9683f" stroke="white" stroke-width="2"/><circle cx="102.5" cy="165" r="8" fill="white" stroke="#207c86" stroke-width="3"/><text x="78" y="235" class="tiny">k=1</text><text x="146" y="110" class="tiny">k=4</text><text x="113" y="161" class="cap teal">CAP</text><text x="89" y="291" class="tiny">1/6</text><rect x="358" y="105" width="115.5" height="162" fill="#e2f3ee"/><rect x="473.5" y="105" width="115.5" height="162" fill="#fcf0e9" opacity=".7"/><line x1="358" y1="267" x2="589" y2="267" stroke="#819bab" stroke-width="1.6"/><line x1="358" y1="267" x2="358" y2="103" stroke="#819bab" stroke-width="1.6"/><text x="359" y="97" class="tiny">Expected cost</text><line x1="473.5" y1="106" x2="473.5" y2="267" stroke="#617f93" stroke-dasharray="4 4" stroke-width="1.5"/><path d="M358,135 L589,257" fill="none" stroke="#b9683f" stroke-width="3.5" stroke-linecap="round"/><circle cx="358" cy="135" r="5" fill="#b9683f" stroke="white" stroke-width="2"/><circle cx="589" cy="257" r="5" fill="#b9683f" stroke="white" stroke-width="2"/><circle cx="473.5" cy="196" r="8" fill="white" stroke="#207c86" stroke-width="3"/><text x="485" y="181" class="cap teal">0.367</text><text x="365" y="123" class="tiny">0.533</text><text x="569" y="245" class="tiny">0.200</text><text x="462" y="289" class="cap teal">0.5</text><text x="357" y="289" class="tiny">0</text><text x="589" y="289" text-anchor="end" class="tiny">1</text><text x="476" y="307" text-anchor="middle" class="sub">P(choose k=4