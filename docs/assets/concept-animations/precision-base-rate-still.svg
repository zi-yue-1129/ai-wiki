<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Base rate effect on precision</title><desc id="desc">Fixed sensitivity 90 percent and false-positive rate 5 percent: changing positive prevalence from one to fifty percent alters the fraction of positive alerts that are correct. Animated probability masses and curve show Bayes base-rate effect.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#19354d}.title{font-size:17px;font-weight:760;letter-spacing:.55px}.sub{font-size:11px;fill:#607b91}.lab{font-size:12px;font-weight:650}.tiny{font-size:10px;fill:#607b91}.num{font-size:17px;font-weight:780}.moving{display:inline}.static-stage{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.static-stage{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" fill="#f2f7fb" rx="16"/><rect x="14" y="14" width="612" height="332" fill="#fff" rx="13" stroke="#dce7ef"/><text x="32" y="45" class="title" >BASE RATE  /  PRECISION</text><text x="32" y="67" class="sub" >Sensitivity 90%     False-positive rate 5%   •   Schematic</text><rect x="30" y="84" width="283" height="237" fill="#f8fbfd" rx="10" stroke="#dce7ef"/><rect x="324" y="84" width="285" height="237" fill="#f8fbfd" rx="10" stroke="#dce7ef"/><text x="48" y="114" class="lab" >Positive prevalence</text><text x="48" y="133" class="sub" >1%</text><text x="295" y="133" class="sub" text-anchor="end">50%</text><rect x="48" y="147" width="245" height="17" fill="#e3ebf0" rx="5"/><text x="48" y="191" class="lab" >Composition of positive alerts</text><rect x="48" y="204" width="245" height="30" fill="#e3ebf0" rx="6"/><rect x="48" y="251" width="11" height="11" fill="#168d80" rx="2"/><text x="64" y="261" class="tiny" >Correct alert (TP)</text><rect x="177" y="251" width="11" height="11" fill="#d88e46" rx="2"/><text x="193" y="261" class="tiny" >False alert (FP)</tex