<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="vtitle vdesc"><title id="vtitle">He initialisation: fan-in versus fan-out ReLU gain</title><desc id="vdesc">For a ReLU layer of 128 input and 512 output channels, fan-in mode yields forward gain 1 and backward gain 4; fan-out mode yields forward gain 0.25 and backward gain 1. Tracers continuously interpolate the analytic scale, not measurements.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203650}.meta{font-size:11px;letter-spacing:1.3px;font-weight:bold;fill:#657b92}.sub{font-size:12px;fill:#60788c}.label{font-size:14px;font-weight:bold}.tick{font-size:11px;fill:#73869a}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style><rect width="640" height="360" rx="18" fill="#f5f8fc"/><text class="meta" x="30" y="32">INITIALISATION · SCHEMATIC</text><text x="30" y="61" font-size="19" font-weight="bold">One variance cannot preserve both directions</text><text class="sub" x="30" y="81">ReLU  ·  128 inputs → 512 outputs  ·  common gain scale</text><rect x="26" y="97" width="588" height="228" rx="15" fill="white" stroke="#dbe5ee"/><line x1="142" y1="141" x2="142" y2="269" stroke="#e8eef4" stroke-dasharray="3 5"/><text class="tick" x="142" y="287" text-anchor="middle">0</text><line x1="244" y1="141" x2="244" y2="269" stroke="#c2d4e1" stroke-dasharray="4 4"/><text class="tick" x="244" y="287" text-anchor="middle">1</text><line x1="346" y1="141" x2="346" y2="269" stroke="#e8eef4" stroke-dasharray="3 5"/><text class="tick" x="346" y="287" text-anchor="middle">2</text><line x1="448" y1="141" x2="448" y2="269" stroke="#e8eef4" stroke-dasharray="3 5"/><text class="tick" x="448" y="287" text-anchor="middle">3</text><line x1="550" y1="141" x2="550" y2="269" stroke="#e8eef4" stroke-dasharray="3 5"/><text class="tick" x="550" y="287" text-anchor="middle">4</text><text class="sub" x="47" y="124">Gain</text><rect x="142" y="155" width="408" height="27" rx="7" fill="#ecf2f6"/><rect x="142" y="220" width="408" height="27" rx="7" fill="#ecf2f6"/><text class="label" x="43" y="174">Forward</text><text class="label" x="43" y="239">Backward</text><rect x="142" y="155" width="102.00" height="27" rx="7" fill="#159b9d"></rect><rect x="142" y="220" width="408.00" height="27" rx="7" fill="#8461c6"></rect><text x="554" y="202" text-anchor="end" class="tick">1 → 0.25</text><text x="554" y="262" text-anchor="end" class="tick">4 → 1</text><line x1="142" y1="307" x2="547" y2="307" stroke="#9bb1c6" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="307" r="6" fill="#263e60"></circle><text class="sub" x="142" y="344" text-anchor="middle">fan-in</text><text class="sub" x="547" y="344" text-anchor="middle">fan-out</text><text class="sub" x="345" y="342" text-anchor="middle">hypothetical variance interpolation</text></svg>
