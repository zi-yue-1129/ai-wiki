<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Fake quantisation forward snapping and backward straight-through gradient</title><desc id="desc">A floating point input moves continuously from 0 to 3 while its 2-bit quantised value jumps between integer levels; a separate arrow illustrates the surrogate gradient used during backpropagation.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5f9"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#7664b2" stroke-width="1.7"/></marker></defs><style>text{dominant-baseline:auto}@media(prefers-reduced-motion:reduce){svg{animation:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#paper)"/><text x="27" y="37" font-family="Inter,Arial,system-ui,sans-serif" font-size="17" fill="#18364b" font-weight="750" text-anchor="start">FAKE QUANTISATION</text><text x="27" y="58" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#7890a2" font-weight="650" text-anchor="start">2-BIT UNSIGNED  ·  STEP = 1</text><rect x="25" y="78" width="590" height="155" rx="15" fill="white" stroke="#d6e2eb"/><text x="45" y="106" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#7890a2" font-weight="700" text-anchor="start">FORWARD</text><text x="48" y="146" font-family="Inter,Arial,system-ui,sans-serif" font-size="15" fill="#dc8b32" font-weight="750" text-anchor="start">x</text><text x="48" y="197" font-family="Inter,Arial,system-ui,sans-serif" font-size="15" fill="#0b8e89" font-weight="750" text-anchor="start">q</text><line x1="130" y1="139" x2="548" y2="139" stroke="#b9cbd9" stroke-width="2" /><line x1="130" y1="190" x2="548" y2="190" stroke="#b9cbd9" stroke-width="2" /><line x1="145" y1="129" x2="145" y2="200" stroke="#d8e4eb" stroke-width=