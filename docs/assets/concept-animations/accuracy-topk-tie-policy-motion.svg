<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Equal scores change top-2 accuracy under different tie-break rules</title><desc id="desc">One synthetic four-class score vector has A at point nine, B and C tied at point seven, and D at point two. The true class is C. With k equal to two, selecting lower index B excludes C and scores zero, whereas selecting higher index C includes it and scores one.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173349}.title{font-weight:700;font-size:19px}.caption{font-size:11px;fill:#607889}.lab{font-size:13px;font-weight:650}.cell{font-size:14px;font-weight:700}.count{font-size:23px;font-weight:700}.good{fill:#087f72}.bad{fill:#a45e30}.phase{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.phase{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f1f6fa" stroke="none" /><rect x="14" y="14" width="612" height="332" rx="13" fill="white" stroke="#d8e5ed" /><text x="33" y="47" class="title" text-anchor="start" >TOP-k  /  SCORE TIES</text><text x="33" y="68" class="caption" text-anchor="start" >One sample · true class C · k = 2</text><text x="116" y="139" class="caption" text-anchor="middle" >A .90</text><text x="226" y="139" class="caption" text-anchor="middle" >B .70</text><text x="336" y="139" class="caption" text-anchor="middle" >C .70</text><text x="448" y="139" class="caption" text-anchor="middle" >D .20</text><rect x="38" y="283" width="560" height="44" rx="9" fill="#f2f6fa" stroke="none" /><text x="58" y="302" class="caption" text-anchor="start" >Equal scores at the k-boundary need a tie policy</text><text x="58" y="317" class="caption" text-anchor="start" >Illustrative rank ordering, not model measurements</text><g class="phase" opacity="1"><rect x="46" y="92" width="352" height="35" rx="7" fill="#fff0e5" stroke="#d49b5e" /><text x="222" y="115" class="lab" text-anchor="middle" >LOW INDEX FIRST</text><text x="76" y="165" class="caption" text-anchor="start" >Rank</text><text x="553" y="165" class="lab" text-anchor="middle" >Top-2</text><rect x="47" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="90" y="202" class="caption" text-anchor="middle" >1</text><text x="90" y="224" class="cell" text-anchor="middle" >A</text><rect x="154" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="197" y="202" class="caption" text-anchor="middle" >2</text><text x="197" y="224" class="cell" text-anchor="middle" >B</text><rect x="261" y="180" width="86" height="59" rx="9" fill="#fff1c9" stroke="#b47a12" stroke-width="2"/><text x="304" y="202" class="caption" text-anchor="middle" >3</text><text x="304" y="224" class="cell" text-anchor="middle" >C</text><rect x="368" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="411" y="202" class="caption" text-anchor="middle" >4</text><text x="411" y="224" class="cell" text-anchor="middle" >D</text><rect x="43" y="175" width="201" height="69" rx="10" fill="none" stroke="#087f72" stroke-width="3"/><text x="550" y="214" class="lab bad" text-anchor="middle" >NO</text><text x="550" y="235" class="lab" text-anchor="middle" >0 / 1</text><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="1;0;1" keyTimes="0;0.5;1"/></g><g class="phase" opacity="0"><rect x="46" y="92" width="352" height="35" rx="7" fill="#e0f5ee" stroke="#188d76" /><text x="222" y="115" class="lab" text-anchor="middle" >HIGH INDEX FIRST</text><text x="76" y="165" class="caption" text-anchor="start" >Rank</text><text x="553" y="165" class="lab" text-anchor="middle" >Top-2</text><rect x="47" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="90" y="202" class="caption" text-anchor="middle" >1</text><text x="90" y="224" class="cell" text-anchor="middle" >A</text><rect x="154" y="180" width="86" height="59" rx="9" fill="#fff1c9" stroke="#b47a12" stroke-width="2"/><text x="197" y="202" class="caption" text-anchor="middle" >2</text><text x="197" y="224" class="cell" text-anchor="middle" >C</text><rect x="261" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="304" y="202" class="caption" text-anchor="middle" >3</text><text x="304" y="224" class="cell" text-anchor="middle" >B</text><rect x="368" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="411" y="202" class="caption" text-anchor="middle" >4</text><text x="411" y="224" class="cell" text-anchor="middle" >D</text><rect x="43" y="175" width="201" height="69" rx="10" fill="none" stroke="#087f72" stroke-width="3"/><text x="550" y="214" class="lab good" text-anchor="middle" >YES</text><text x="550" y="235" class="lab" text-anchor="middle" >1 / 1</text><animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;1"/></g><g class="reduced"><rect x="46" y="92" width="352" height="35" rx="7" fill="#e0f5ee" stroke="#188d76" /><text x="222" y="115" class="lab" text-anchor="middle" >HIGH INDEX FIRST</text><text x="76" y="165" class="caption" text-anchor="start" >Rank</text><text x="553" y="165" class="lab" text-anchor="middle" >Top-2</text><rect x="47" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="90" y="202" class="caption" text-anchor="middle" >1</text><text x="90" y="224" class="cell" text-anchor="middle" >A</text><rect x="154" y="180" width="86" height="59" rx="9" fill="#fff1c9" stroke="#b47a12" stroke-width="2"/><text x="197" y="202" class="caption" text-anchor="middle" >2</text><text x="197" y="224" class="cell" text-anchor="middle" >C</text><rect x="261" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="304" y="202" class="caption" text-anchor="middle" >3</text><text x="304" y="224" class="cell" text-anchor="middle" >B</text><rect x="368" y="180" width="86" height="59" rx="9" fill="#edf3f8" stroke="#d3e0e9" stroke-width="1"/><text x="411" y="202" class="caption" text-anchor="middle" >4</text><text x="411" y="224" class="cell" text-anchor="middle" >D</text><rect x="43" y="175" width="201" height="69" rx="10" fill="none" stroke="#087f72" stroke-width="3"/><text x="550" y="214" class="lab good" text-anchor="middle" >YES</text><text x="550" y="235" class="lab" text-anchor="middle" >1 / 1</text></g></svg>