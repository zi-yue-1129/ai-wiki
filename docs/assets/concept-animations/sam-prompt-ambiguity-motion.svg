<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="motion-title motion-desc"><title id="motion-title">SAM ambiguous prompt and candidate masks</title><desc id="motion-desc">A point placed on a nested shape supports multiple valid masks at whole, part, and subpart granularity. An additional box prompt restricts the illustrative selection. This is not an output of a trained SAM model.</desc><rect x="0" y="0" width="800" height="460" rx="18" fill="#f9fbfe" stroke="none" stroke-width="1"></rect><rect x="1" y="1" width="798" height="458" rx="18" fill="none" stroke="#dbe4ee" stroke-width="1.4"></rect><text x="40" y="47" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#22354c" text-anchor="start" font-weight="700">One point · multiple valid masks</text><text x="40" y="70" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#597087" text-anchor="start" font-weight="500">Prompt-conditioned selection (schematic)</text><rect x="41" y="95" width="354" height="318" rx="16" fill="white" stroke="#dbe4ee" stroke-width="1"></rect><rect x="415" y="95" width="345" height="318" rx="16" fill="white" stroke="#dbe4ee" stroke-width="1"></rect><text x="218" y="123" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22354c" text-anchor="middle" font-weight="700">Image + prompt</text><text x="588" y="123" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22354c" text-anchor="middle" font-weight="700">Mask candidates</text><rect x="74" y="143" width="292" height="243" rx="12" fill="#eef7f3" stroke="none" stroke-width="1"></rect><path d="M 220 333 C170 310 142 256 156 213 C166 181 202 169 224 176 C250 147 292 159 306 192 C343 207 344 268 307 294 C292 328 251 346 220 333Z" fill="#a6dbc2" stroke="#448d71" stroke-width="2.5" /><path d="M217 303 C186 291 184 245 211 219 C227 205 248 208 267 226 C291 246 284 281 260 300 C248 309 231 310 217 303Z" fill="#60b3a8" stroke="#398f88" stroke-width="2" /><circle cx="239" cy="257" r="19" fill="#227e85" stroke="#f1fffa" stroke-width="2"></circle><circle cx="239" cy="257" r="4.5" fill="#fff9ec" stroke="#e5813b" stroke-width="2"></circle><circle cx="239" cy="257" r="12" fill="none" stroke="#e5813b" stroke-width="1.8"><animate attributeName="r" values="9;19;9;9" keyTimes="0;.35;.58;1" dur="10s" calcMode="linear" repeatCount="indefinite" /><animate attributeName="opacity" values=".95;.35;.95;.95" keyTimes="0;.35;.58;1" dur="10s" calcMode="linear" repeatCount="indefinite" /></circle><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.9;1" dur="10s" calcMode="discrete" repeatCount="indefinite" /><rect x="130" y="163" width="218" height="198" rx="6" fill="none" stroke="#e5813b" stroke-width="3" stroke-dasharray="8 5" /><text x="318" y="154" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#e5813b" text-anchor="end" font-weight="500">Box</text></g><rect x="436" y="149" width="300" height="76" rx="12" fill="#fbfdff" stroke="#dfebf2" stroke-width="1.2"></rect><circle cx="492" cy="187" r="31" fill="#b7e2cc" stroke="#539b7c" stroke-width="2"></circle><text x="545" y="194" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#22354c" text-anchor="start" font-weight="650">Whole</text><rect x="436" y="149" width="300" height="76" rx="12" fill="none" stroke="#e5813b" stroke-width="2.2"><animate attributeName="opacity" values="0;.25;1;1;0" keyTimes="0;.15;.45;.85;1" dur="10s" calcMode="linear" repeatCount="indefinite" /></rect><rect x="436" y="234" width="300" height="76" rx="12" fill="#fbfdff" stroke="#dfebf2" stroke-width="1.2"></rect><circle cx="492" cy="272" r="20.16" fill="#6ab9b0" stroke="#368e88" stroke-width="2"></circle><text x="545" y="279" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#22354c" text-anchor="start" font-weight="650">Part</text><rect x="436" y="234" width="300" height="76" rx="12" fill="none" stroke="#0f9689" stroke-width="2.2">