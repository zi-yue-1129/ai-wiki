<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Selection optimism from maximizing noisy estimates</title><desc id="desc">In a mathematical toy model, m independently noisy validation estimates are uniform between zero and one and all candidates have true expected utility one half. The expected selected validation maximum grows as m divided by m plus one. A genuinely independent test of the selected choice still has expected utility one half. This is an analytical illustration, not observed model performance.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.head{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:11px;fill:#607888}.tick{font-size:10px;fill:#607888}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#eff7fa"/><text x="22" y="31" class="head">Winner’s curse in threshold search</text><rect x="20" y="46" width="600" height="290" rx="12" fill="white" stroke="#cfdee6"/><text x="44" y="73" class="small">More candidates amplify selection noise</text><path d="M74 100 V294 H499" fill="none" stroke="#809eae" stroke-width="1.5"/><line x1="74" y1="261.67" x2="499" y2="261.67" stroke="#e6eef2"/><text x="65" y="266" class="tick" text-anchor="end">0.5</text><line x1="74" y1="197.00" x2="499" y2="197.00" stroke="#e6eef2"/><text x="65" y="201" class="tick" text-anchor="end">0.7</text><line x1="74" y1="132.33" x2="499" y2="132.33" stroke="#e6eef2"/><text x="65" y="136" class="tick" text-anchor="end">0.9</text><polyline points="74.00,261.67 121.22,207.78 168.44,180.83 215.67,164.67 262.89,153.89 310.11,146.19 357.33,140.42 404.56,135.93 451.78,132.33 499.00,129.39" fill="none" stroke="#de9452" stroke-width="3" stroke-linejoin="round"/><line x1="74" y1="261.67" x2="499" y2="261.67" stroke="#2b9a9a" stroke-width="3" stroke-dasharray="8 5"/><text x="74" y="312" class="tick" text-anchor="middle">1</text><text x="168" y="312" class="tick" text-anchor="middle">3</text><text x="263" y="312" class="tick" text-anchor="middle">5</text><text x="357" y="312" class="tick" text-anchor="middle">7</text><text x="499" y="312" class="tick" text-anchor="middle">10</text><text x="288" y="330" class="label" text-anchor="middle">Candidates tried (m)</text><text x="519" y="113" class="small" style="fill:#a7652e">Selected</text><text x="519" y="130" class="small" style="fill:#a7652e">validation</text><text x="519" y="178" class="small" style="fill:#278d90">Independent</text><text x="519" y="195" class="small" style="fill:#278d90">test</text><text x="519" y="234" class="label">At m = 10</text><text x="519" y="251" class="label">0.91 / 0.50</text><text x="22" y="351" class="tick">Toy model: independent U(0,1) estimates; all true expected utilities = 0.50.</text><g class="motion"><circle cx="74.0" cy="261.67" r="8" fill="#da8643" stroke="white" stroke-width="2"><animate attributeName="cx" values="74.0;121.22;168.44;215.67;262.89;310.11;357.33;404.56;451.78;499.0" keyTimes="0.0;0.1111111111111111;0.2222222222222222;0.3333333333333333;0.4444444444444444;0.5555555555555556;0.6666666666666666;0.7777777777777778;0.8888888888888888;1.0" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="261.67;207.78;180.83;164.67;153.89;146.19;140.42;135.93;132.33;129.39" keyTimes="0.0;0.1111111111111111;0.2222222222222222;0.3333333333333333;0.4444444444444444;0.5555555555555556;0.6666666666666666;0.7777777777777778;0.8888888888888888;1.0" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g class="motion"><circle cx="74.0" cy="261.67" r="7" fill="#2b9a9a" stroke="white" stroke-width="2"><animate attributeName="cx" values="74.0;121.22;168.44;215.67;262.89;310.11;357.33;404.56;451.78;499.0" keyTimes="0.0;0.1111111111111111;0.2222222222222222;0.3333333333333333;0.4444444444444444;0.5555555555555556;0.6666666666666666;0.7777777777777778;0.8888888888888888;1.0" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g></svg>