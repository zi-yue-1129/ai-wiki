<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CLIP prompt ensembling</title><desc id="desc">Two unit prompt vectors are averaged then normalised. For the fixed image equal to P2, class A changes from cosine 0 to 0.7071, overtaking B at 0.6. The intermediate mean is not yet a classifier vector.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="3" fill="#f1f6fa" /><text x="24" y="31" font-size="20" text-anchor="start" fill="#233b52">CLIP prompt ensembling</text><rect x="18" y="48" width="604" height="294" rx="3" fill="white" stroke="#d6e1e8"/><text x="175" y="77" font-size="17" text-anchor="middle" fill="#233b52">Prompt embeddings</text><text x="475" y="77" font-size="17" text-anchor="middle" fill="#233b52">Cosine to image</text><path d="M72 107 A180 180 0 0 1 252 287" fill="none" stroke="#e4edf2" stroke-width="2"/><line x1="72" y1="287" x2="72" y2="96" stroke="#e4edf2" stroke-width="2" /><line x1="72" y1="287" x2="263" y2="287" stroke="#e4edf2" stroke-width="2" /><line x1="72" y1="287" x2="252" y2="287" stroke="#21678d" stroke-width="2" /><line x1="72" y1="287" x2="72" y2="107" stroke="#21678d" stroke-width="2" /><circle cx="252" cy="287" r="5" fill="#21678d"/><circle cx="72" cy="107" r="5" fill="#21678d"/><text x="252" y="310" font-size="15" text-anchor="middle" fill="#233b52">P1</text><text x="84" y="100" font-size="14" text-anchor="start" fill="#21678d">P2 = image</text><text x="88" y="330" font-size="14" text-anchor="start" fill="#233b52">Unit vectors</text><line x1="320" y1="88" x2="320" y2="320" stroke="#e4edf2" stroke-width="2" /><text x="352" y="116" font-size="17" text-anchor="start" fill="#087d70">A</text><text x="352" y="190" font-size="17" text-anchor="start" fill="#a95516">B</text><rect x="378" y="98" width="206" height="24" rx="3" fill="#e4edf2" /><rect x="378" y="172" width="206" height="24" rx="3" fill="#e4edf2" /><rect x="378" y="172" width="123.6" height="24" rx="3" fill="#a95516" /><text x="601" y="190" font-size="14" text-anchor="middle" fill="#233b52">0.60</text><text x="378" y="224" font-size="13" text-anchor="middle" fill="#233b52">0</text><text x="584" y="224" font-size="13" text-anchor="middle" fill="#233b52">1</text><text x="475" y="256" font-size="16" text-anchor="middle" fill="#233b52">Winning class</text><text x="475" y="326" font-size="14" text-anchor="middle" fill="#233b52">B fixed at (0.8, 0.6)</text><g class="motion"><line id="ensemble-vector" x1="72" y1="287" x2="252" y2="287" stroke="#087d70" stroke-width="4"><animate attributeName="x2" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.4;0.6;0.82;0.9999;1" values="252;252;162;162;199.2792;199.2792;252"/><animate attributeName="y2" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.4;0.6;0.82;0.9999;1" values="287;287;197;197;159.7208;159.7208;287"/></line><circle cx="252" cy="287" r="6" fill="#087d70"><animate attributeName="cx" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.4;0.6;0.82;0.9999;1" values="252;252;162;162;199.2792;199.2792;252"/><animate attributeName="cy" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2;0.4;0.6;0.82;0.9999;1" values="287;287;197;197;159.7208;159.7208;287"/></circle><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;1;1;1;0"/><line x1="252" y1="287" x2="162" y2="197" stroke="#21678d" stroke-width="2" stroke-dasharray="4 4"/><line x1="72" y1="107" x2="162" y2="197" stroke="#21678d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="162" cy="197" r="5" fill="white" stroke="#087d70" stroke-width="2"/><text x="145" y="192" font-size="15" text-anchor="end" fill="#087d70">Mean</text></g><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="1;0;0;0;0;1"/><text x="300" y="120" font-size="15" text-anchor="end" fill="#233b52">P1 only</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;1;0;0;0;0"/><text x="300" y="120" font-size="15" text-anchor="end" fill="#233b52">Build mean</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;1;0;0;0"/><text x="300" y="120" font-size="15" text-anchor="end" fill="#233b52">Average</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;0;1;0;0"/><text x="300" y="120" font-size="15" text-anchor="end" fill="#233b52">Normalise</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;0;0;1;0"/><text x="300" y="120" font-size="15" text-anchor="end" fill="#087d70">Normalised</text></g><rect id="class-a-score" x="378" y="98" width="0" height="24" rx="3" fill="#087d70"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.82;1" values="0;0;145.664;0"/></rect><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="1;0;0;0;0;1"/><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">0.00</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#a95516">B</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;1;0;0;0"/><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">—</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#233b52">—</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;1;0;0;0;0"/><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">—</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#233b52">—</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;0;1;0;0"/><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">—</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#233b52">—</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.82;1" values="0;0;0;0;1;0"/><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">0.71</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#087d70">A</text></g></g><g class="still"><line x1="72" y1="287" x2="199.2792" y2="159.7208" stroke="#087d70" stroke-width="2" style="stroke-width:4"/><circle cx="199.2792" cy="159.7208" r="6" fill="#087d70"/><line x1="252" y1="287" x2="162" y2="197" stroke="#21678d" stroke-width="2" stroke-dasharray="4 4"/><line x1="72" y1="107" x2="162" y2="197" stroke="#21678d" stroke-width="2" stroke-dasharray="4 4"/><circle cx="162" cy="197" r="5" fill="white" stroke="#087d70" stroke-width="2"/><text x="145" y="192" font-size="15" text-anchor="end" fill="#087d70">Mean</text><text x="300" y="120" font-size="15" text-anchor="end" fill="#087d70">Normalised</text><rect id="still-class-a-score" x="378" y="98" width="145.664" height="24" rx="3" fill="#087d70"></rect><text x="601" y="116" font-size="14" text-anchor="middle" fill="#233b52">0.71</text><text x="475" y="287" font-size="25" text-anchor="middle" fill="#087d70">A</text></g></svg>