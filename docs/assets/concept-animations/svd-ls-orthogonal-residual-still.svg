<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Least-squares projection and residual orthogonality</title><desc id="svgdesc">A two-dimensional observation b is projected onto the one-dimensional column space of A=(2,1). A smooth parameter sweep moves Ax, the residual and the squared error, whose minimum 0.8 occurs at x=1.2 with orthogonal residual. Not an optimiser iteration.</desc><defs><marker id="tipT" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#0f827f" stroke-width="1.7"/></marker><marker id="tipO" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#e0943c" stroke-width="1.7"/></marker><marker id="tipB" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#4b70b3" stroke-width="1.7"/></marker></defs><rect x="1" y="1" width="798" height="418" rx="18" fill="#f6f9fc" stroke="#d2e0ea"/><rect x="19" y="72" width="357" height="328" rx="16" fill="white" stroke="#d6e3eb"/><rect x="391" y="72" width="389" height="328" rx="16" fill="white" stroke="#d6e3eb"/><text x="28" y="40" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#243c50" text-anchor="start" font-weight="700">Least-squares projection</text><text x="28" y="62" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#5a7281" text-anchor="start" font-weight="500">A = (2, 1)ᵀ   ·   b = (2, 2)ᵀ</text><text x="41" y="104" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243c50" text-anchor="start" font-weight="650">Column space</text><text x="414" y="104" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243c50" text-anchor="start" font-weight="650">Squared residual</text><line x1="51" y1=