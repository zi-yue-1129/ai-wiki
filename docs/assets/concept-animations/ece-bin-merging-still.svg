<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Expected calibration error hides cancelling gaps after bin merging</title><desc id="desc">Eight constructed binary predictions: four predict 0.3 with observed rate 0.5, four predict 0.7 with observed rate 0.5. Two separate bins have ECE 0.2. Merging into one bin yields forecast 0.5 and rate 0.5, ECE zero although the subgroup calibration gaps persist. Animation moves a visual indicator between separated and merged estimates.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#223c51}.heading{font-size:16px;font-weight:750;letter-spacing:.5px}.tag{font-size:11px;font-weight:700;letter-spacing:.5px;fill:#617c8f}.number{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}.metric{font-size:14px;font-weight:750}.small{font-size:11px;fill:#677e91}.moving{display:inline}.static-stage{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.static-stage{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#eef5fa"/><rect x="14" y="14" width="612" height="332" rx="13" fill="#fff" stroke="#d7e4ed"/><text x="32" y="42" class="heading">ECE  ·  BINNING CAN HIDE ERRORS</text><rect x="29" y="62" width="280" height="239" fill="#f7fafc" rx="10" stroke="#dce8ef"/><rect x="330" y="62" width="279" height="239" fill="#f7fafc" rx="10" stroke="#dce8ef"/><text x="47" y="85" class="tag">2 BINS  ·  n=4 EACH</text><text x="349" y="85" class="tag">1 BIN  ·  n=8</text><text x="96" y="108" class="small" text-anchor="middle">LOW</text><rect x="72" y="204.2" width="20" height="34.8" fill="#329ab5" rx="3"/><rect x="97" y="181" width="20" height="58" fill="#f0a760" rx="3"/><text x="82" y="257" class="small" text-anchor="middle">0.3</text><text x="107" y="257" class="small" text-anchor="middle">0.5</text><path d="M121 204.2 V181" stroke="#d35d6f" stroke-width="3" fill="none"/><text x="228" y="108" class="small" text-anchor="middle">HIGH</text><rect x="204" y="157.8" width="20" height="81.19999999999999" fill="#329ab5" rx="3"/><rect x="229" y="181" width="20" height="58" fill="#f0a760" rx="3"/><text x="214" y="257" class="small" text-anchor="middle">0.7</text><text x="239" y="257" class="small" text-anchor="middle">0.5</text><path d="M253 157.8 V181" stroke="#d35d6f" stroke-width="3" fill="none"/><text x="48" y="286" class="number">ECE  0.200</text><text x="470" y="108" class="small" text-anchor="middle">MERGED</text><rect x="437" y="181" width="25" height="58" fill="#329ab5" rx="3"/><rect x="474" y="181" width="25" height="58" fill="#f0a760" rx="3"/><text x="449" y="257" class="small" text-anchor="middle">0.5</text><text x="486" y="257" class="small" text-anchor="middle">0.5</text><text x="347" y="286" class="number">ECE  0.000</text><rect x="29" y="312" width="580" height="23" fill="#eaf1f5" rx="5"/><text x="44" y="327" class="small">BLUE  forecast     ORANGE  event rate     •     Same 8 cases; only binning changes</text><rect x="426" y="115" width="83" height="132" rx="6" fill="none" stroke="#168f98" stroke-width="2.5"/></svg>