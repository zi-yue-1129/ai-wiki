<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Causal FlashAttention skips fully future tiles and masks diagonal tiles</title><desc id="desc">For eight causal tokens and tile width two, a four by four block scan contains six fully valid past tiles, four diagonals with three valid scores each, and six future tiles skipped. Exactly 36 of 64 directed query-key pairs remain. The cursor follows each tile in order and the cumulative curve advances by each tile pair count.</desc><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fafc" stroke="none" stroke-width="1"/><rect x="12" y="12" width="616" height="336" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">Causal attention · tiled score scan</text><text x="28" y="67" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">8 tokens · block size 2 · 4 × 4 tiles</text><text x="34" y="98" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" font-weight="600" text-anchor="start">Q↓</text><text x="76.5" y="98" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">K1</text><text x="136.5" y="98" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">K2</text><text x="196.5" y="98" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">K3</text><text x="256.5" y="98" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">K4</text><text x="34" y="135" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">Q1</text>