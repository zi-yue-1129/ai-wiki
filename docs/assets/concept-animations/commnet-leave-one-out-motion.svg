<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" width="640" height="360"><title id="title">CommNet excludes a receiver own state from the communication average</title><desc id="desc">Three agents have schematic scalar messages A 0.20, B 0.80 and C 0.60. The selected receiver B combines only A and C so its incoming message is (0.20 + 0.60) / 2 = 0.40. Animated pulses flow from A and C, while B input is excluded.</desc><rect width="640" height="360" fill="#f5f8fc" /><text x="320" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1d334b">CommNet: leave-one-out mean</text><rect x="49" y="73" width="132" height="84" rx="12" fill="#e8f3fc" stroke="#2776b7" stroke-width="2" /><text x="115" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1d334b">Agent A</text><text x="115" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2776b7">0.20</text><rect x="254" y="73" width="132" height="84" rx="12" fill="#fff4e4" stroke="#bb721c" stroke-width="2" /><text x="320" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1d334b">Agent B</text><text x="320" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#bb721c">0.80</text><rect x="459" y="73" width="132" height="84" rx="12" fill="#e5f5f1" stroke="#008e89" stroke-width="2" /><text x="525" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1d334b">Agent C</text><text x="525" y="133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#008e89">0.60</text><text x="115" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#2776b7">source</text><text x="344" y="189" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#bb721c">excluded</text><text x="525" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#008e89">source</text><path d="M115 159 Q146 211 255 233" stroke="#2776b7" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M525 159 Q494 211 385 233" stroke="#008e89" stroke-width="3" fill="none" stroke-linecap="round" /><path d="M320 158 L320 206" stroke="#bb721c" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" fill="none" /><path d="M311 194 L329 212" stroke="#bb721c" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M329 194 L311 212" stroke="#bb721c" stroke-width="2.5" stroke-linecap="round" fill="none" /><rect x="248" y="218" width="144" height="47" rx="12" fill="#ffffff" stroke="#cad9e6" stroke-width="1.6" /><text x="320" y="237" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1d334b">MEAN</text><text x="320" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526781">(0.20 + 0.60) / 2</text><path d="M320 266 L320 281" stroke="#008e89" stroke-width="3" stroke-linecap="round" fill="none" /><polyline points="314,273 320,280 326,273" stroke="#008e89" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="241" y="283" width="158" height="52" rx="12" fill="#e5f5f1" stroke="#008e89" stroke-width="2" /><text x="320" y="305" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#008e89">c_B = 0.40</text><rect x="283" y="314" width="74" height="10" rx="5" fill="#ffffff" stroke="#b8d1d5" stroke-width="1" /><rect x="284" y="315" width="0" height="8" rx="4" fill="#008e89" class="comm-motion-only"><animate attributeName="width" values="0.00000000;0.00000000;29.2000000