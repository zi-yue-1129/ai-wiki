<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" font-family="system-ui,sans-serif"><title>Rolling-origin evaluation</title><desc>At each retrospective origin, only observations through T are available when issuing a two-step last-value forecast. Held-out observations appear in the scoring phase. Three fold MAEs are 1, 1.5 and 3.5. The bottom strip summarises the completed evaluation.</desc><rect width="640" height="360" fill="white"/><text x="320" y="28" font-size="23" fill="#243447" text-anchor="middle">Rolling-origin evaluation</text><rect x="20" y="43" width="600" height="225" rx="3" fill="#f2f5f8" /><text x="36" y="62" font-size="13" fill="#243447" text-anchor="start">Value</text><line x1="55" y1="231" x2="595" y2="231" stroke="#d8e0e8" /><text x="46" y="236" font-size="13" fill="#243447" text-anchor="end">0</text><line x1="55" y1="197" x2="595" y2="197" stroke="#d8e0e8" /><text x="46" y="202" font-size="13" fill="#243447" text-anchor="end">2</text><line x1="55" y1="163" x2="595" y2="163" stroke="#d8e0e8" /><text x="46" y="168" font-size="13" fill="#243447" text-anchor="end">4</text><line x1="55" y1="129" x2="595" y2="129" stroke="#d8e0e8" /><text x="46" y="134" font-size="13" fill="#243447" text-anchor="end">6</text><line x1="55" y1="95" x2="595" y2="95" stroke="#d8e0e8" /><text x="46" y="100" font-size="13" fill="#243447" text-anchor="end">8</text><text x="70" y="252" font-size="15" fill="#243447" text-anchor="middle">1</text><text x="140" y="252" font-size="15" fill="#243447" text-anchor="middle">2</text><text x="210" y="252" font-size="15" fill="#243447" text-anchor="middle">3</text><text x="280" y="252" font-size="15" fill="#243447" text-anchor="middle">4</text><text x="350" y="252" font-size="15" fill="#243447" text-anchor="middle">5</text><text x="420" y="252" font-size="15" fill="#243447" text-anchor="middle">6</text><text x="490" y="252" font-size="15" fill="#243447" text-anchor="middle">7</text><text x=