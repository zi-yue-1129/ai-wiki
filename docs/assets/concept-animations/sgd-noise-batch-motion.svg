<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">SGD noise scale as minibatch size grows</title><desc id="desc">The analytic noise-scale curve g equals 0.1 times (128 over batch size minus one). The moving cursor follows increasing batch size from 4 to 64, while a schematic scatter cloud narrows in inverse proportion to the square root of batch size. Scatter is illustrative, not sampled training outcomes.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#263f53}.k{font-size:12px;font-weight:700;letter-spacing:1px;fill:#617e91}.lab{font-size:12px;font-weight:600}.num{font-size:13px;font-weight:700}.panel{fill:#fff;stroke:#dce7ed;stroke-width:1.5}.axis{stroke:#b9cbd7;stroke-width:1.3}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="18" fill="#f4f8fb"/><text x="30" y="36" class="k">SGD NOISE SCALE / BATCH SIZE</text>
