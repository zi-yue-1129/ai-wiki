<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">CQL conservative regularization with dataset and unseen actions</title><desc id="desc">With a toy two-action discrete CQL objective, dataset action Q starts at 2 and unseen action Q starts at 5. Four illustrative gradient steps with alpha 1, learning rate 0.5 and Bellman target 2 change the values to approximately 2.73 and 3.32. Dashed bars denote initial values.</desc><rect x="0" y="0" width="440" height="548" rx="18" fill="#f7fafc" stroke="#f7fafc" /><rect x="1" y="1" width="438" height="546" rx="17" fill="none" stroke="#dbe4ed" /><text x="25" y="42" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#25364d" text-anchor="start" font-weight="700">CQL · Conservative Q</text><text x="25" y="67" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="500">Data action vs unseen action</text><line x1="25" y1="82" x2="415" y2="82" stroke="#dbe4ed" stroke-width="1" /><text x="25" y="111" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#25364d" text-anchor="start" font-weight="700">Q at one fixed state</text><text x="30" y="159" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25364d" text-anchor="start" font-weight="700">A  Dataset</text><rect x="100" y="171" width="272" height="32" rx="7" fill="#e9f0f7" stroke="#e9f0f7" /><rect x="100" y="169" width="108.00" height="36" rx="7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="100" y="171" width="147.40" height="32" rx="7" fill="#0a8581" stroke="none" /><text x="384" y="194" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25364d" text-anchor="start" font-weight="700">2.73</text><text x="30" y="269" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25364d" text-anchor="start" font-weight="700">B  Unseen</text><rect x="100" y="281" width="272" height="32" rx="7" fill="#e9f0f7" stroke="#e9f0f7" /><rect x="100" y="279" width="270.00" height="36" rx="7" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="100" y="281" width="179.30" height="32" rx="7" fill="#d67c39" stroke="none" /><text x="384" y="304" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25364d" text-anchor="start" font-weight="700">3.32</text><line x1="25" y1="385" x2="415" y2="385" stroke="#dbe4ed" stroke-width="1" /><text x="25" y="416" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#25364d" text-anchor="start" font-weight="700">Conservative penalty</text><text x="25" y="450" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#25364d" text-anchor="start" font-weight="500">logsumexp(Q) − Q(data)</text><text x="25" y="479" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" text-anchor="start" font-weight="500">+ Bellman error</text><text x="25" y="513" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="500">Penalty</text><rect x="94" y="498" width="248" height="18" rx="6" fill="#e9f0f7" stroke="#e9f0f7" /><rect x="94" y="498" width="82" height="18" rx="6" fill="#3975cb" stroke="none" /><text x="25" y="536" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="500">Toy gradient steps · not measured</text></svg>