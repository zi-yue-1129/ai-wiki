<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" tabindex="0" aria-labelledby="title desc"><title id="title">Causal linear attention: recurrent state accumulation</title><desc id="desc">An illustrative scalar-feature recurrent linear attention. Each token contributes phi(k) times v to state S and phi(k) to state z. The normalized causal output is S divided by z for phi(q)=1. Exact cumulative states are 1/1, 1/3, 4/4, and 8/6.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf3f8"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;fill:#24465b} .top{font-weight:750;font-size:18px;letter-spacing:.3px}.small{font-size:12px;fill:#647f92}.tag{font-size:13px;font-weight:750}.value{font-size:21px;font-weight:760}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace} .dim{fill:#6d8495} @media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}.travel{display:none!important}}svg:hover animate,svg:focus animate{animation-play-state:paused}</style><rect width="800" height="432" rx="20" fill="url(#paper)"/><text x="26" y="38" class="top">RECURRENT LINEAR ATTENTION</text><text x="771" y="37" class="small" text-anchor="end">SCALAR FEATURE · φ(q) = 1</text><rect x="23" y="62" width="754" height="325" rx="14" fill="white" stroke="#d5e3ee"/><text x="65" y="104" class="tag" text-anchor="middle">t</text><text x="190" y="104" class="tag" text-anchor="middle">φ(k)</text><text x="296" y="104" class="tag" text-anchor="middle">v</text><text x="428" y="104" class="tag" text-anchor="middle">S</text><text x="545" y="104" class="tag" text-anchor="middle">z</text><text x="676" y="104" class="tag" text-anchor="middle">y = S/z</text><path d="M40 120L760 120" stroke="#dce7ee" stroke-width="2" opacity="1" fill="none" /><rect x="40" y="129" width="720" height="54" rx="8" fill="#f2f8fc"/><text x="65" y="155" class="value mono" text-anchor="middle">1</text><text x="190" y="155" class="value mono" text-anchor="middle">1</text><text x="296" y="155" class="value mono" text-anchor="middle">1</text><text x="428" y="155" class="value mono" text-anchor="middle">1</text><text x="545" y="155" class="value mono" text-anchor="middle">1</text><text x="676" y="155" class="value mono" text-anchor="middle">1.00</text><text x="65" y="215" class="value mono" text-anchor="middle">2</text><text x="190" y="215" class="value mono" text-anchor="middle">2</text><text x="296" y="215" class="value mono" text-anchor="middle">0</text><text x="428" y="215" class="value mono" text-anchor="middle">1</text><text x="545" y="215" class="value mono" text-anchor="middle">3</text><text x="676" y="215" class="value mono" text-anchor="middle">0.33</text><rect x="40" y="249" width="720" height="54" rx="8" fill="#f2f8fc"/><text x="65" y="275" class="value mono" text-anchor="middle">3</text><text x="190" y="275" class="value mono" text-anchor="middle">1</text><text x="296" y="275" class="value mono" text-anchor="middle">3</text><text x="428" y="275" class="value mono" text-anchor="middle">4</text><text x="545" y="275" class="value mono" text-anchor="middle">4</text><text x="676" y="275" class="value mono" text-anchor="middle">1.00</text><text x="65" y="335" class="value mono" text-anchor="middle">4</text><text x="190" y="335" class="value mono" text-anchor="middle">2</text><text x="296" y="335" class="value mono" text-anchor="middle">2</text><text x="428" y="335" class="value mono" text-anchor="middle">8</text><text x="545" y="335" class="value mono" text-anchor="middle">6</text><text x="676" y="335" class="value mono" text-anchor="middle">1.33</text><path d="M40 367L760 367" stroke="#dce7ee" stroke-width="2" opacity="1" fill="none" /><text x="40" y="404" class="small">Sₜ = Sₜ₋₁ + φ(kₜ)vₜ</text><text x="439" y="404" class="small">zₜ = zₜ₋₁ + φ(kₜ)</text></svg>