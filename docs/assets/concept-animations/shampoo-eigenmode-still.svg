<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Shampoo · correlated-mode attenuation</title><desc id="desc">Analytic toy: G=[[2,1],[1,2]], L_t=R_t=I+t G², U_t=L_t^-1/4 G R_t^-1/4. The eigenmode updates are 3/sqrt(1+9t) and 1/sqrt(1+t), t from 0 to 6; not actual model training.</desc><rect width="640" height="360" rx="14" fill="#fbfdff"></rect><rect x="1" y="1" width="638" height="358" rx="14" fill="none" stroke="#dce6ef"></rect><text x="25" y="29" text-anchor="start" font-size="17" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">Shampoo · correlated-mode attenuation</text><rect x="17" y="50" width="192" height="218" rx="8" fill="white" stroke="#dce6ef"></rect><text x="113" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">Gradient G</text><rect x="226" y="50" width="192" height="218" rx="8" fill="white" stroke="#dce6ef"></rect><text x="322" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">L and R</text><rect x="433" y="50" width="192" height="218" rx="8" fill="white" stroke="#dce6ef"></rect><text x="529" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">Update U</text><text x="322" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">I + t GGᵀ</text><rect x="76" y="116" width="34" height="34" rx="5" fill="#5389b6" stroke="#fff"></rect><text x="93" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Arial,Helvetica,sans-serif">2</text><rect x="115" y="116" width="34" height="34" rx="5" fill="#bad4e9" stroke="#fff"></rect><text x="132" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">1</text><rect x="76" y="155" width="34" height="34" rx="5" fill="#bad4e9" stroke="#fff"></rect><text x="93" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#243a50" font-family="Arial,Helvetica,sans-serif">1</text><rect x="115" y="155" width="34" height="34" rx="5" fill="#5389b6" stroke="#fff"></rect><text x="132" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Arial,Helvetica,sans-serif">2</text><rect x="283" y="116" width="34" height="34" rx="5" fill="#426b9b" opacity="0.52" stroke="white"></rect><rect x="490" y="116" width="34" height="34" rx="5" fill="#d06d32" opacity="0.33" stroke="white"></rect><rect x="322" y="116" width="34" height="34" rx="5" fill="#426b9b" opacity="0.43" stroke="white"></rect><rect x="529" y="116" width="34" height="34" rx="5" fill="#d06d32" opacity="0.13" stroke="white"></rect><rect x="283" y="155" width="34" height="34" rx="5" fill="#426b9b" opacity="0.43" stroke="white"></rect><rect x="490" y="155" width="34" height="34" rx="5" fill="#d06d32" opacity="0.13" stroke="white"></rect><rect x="322" y="155" width="34" height="34" rx="5" fill="#426b9b" opacity="0.52" stroke="white"></rect><rect x="529" y="155" width="34" height="34" rx="5" fill="#d06d32" opacity="0.33" stroke="white"></rect><text x="113" y="230" text-anchor="middle" font-size="11" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">σ = 3, 1</text><text x="322" y="230" text-anchor="middle" font-size="11" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">Two 2×2 accumulators</text><text x="529" y="230" text-anchor="middle" font-size="11" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">L⁻¹⁄⁴ G R⁻¹⁄⁴</text><line x1="211" y1="160" x2="224" y2="160" stroke="#008b89" stroke-width="3" stroke-linecap="round"></line><line x1="420" y1="160" x2="433" y2="160" stroke="#008b89" stroke-width="3" stroke-linecap="round"></line><line x1="96" y1="316" x2="553" y2="316" stroke="#b9cbd7" stroke-width="2" stroke-linecap="round"></line><text x="27" y="295" text-anchor="start" font-size="12" font-weight="700" fill="#d06d32" font-family="Arial,Helvetica,sans-serif">σ₁</text><text x="27" y="321" text-anchor="start" font-size="12" font-weight="700" fill="#008b89" font-family="Arial,Helvetica,sans-serif">σ₂</text><rect x="96" y="280" width="79.37" height="12" rx="6" fill="#d06d32"></rect><rect x="96" y="305" width="70" height="12" rx="6" fill="#008b89"></rect><text x="553" y="290" text-anchor="middle" font-size="11" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">mode</text><text x="25" y="343" text-anchor="start" font-size="11" font-weight="500" fill="#60768a" font-family="Arial,Helvetica,sans-serif">t = 0 → 6 · repeated toy gradient; bars show preconditioned modes</text></svg>