<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">GloVe one simultaneous gradient step</title><desc id="desc">At count 100, weight one, a constructed residual of one yields gradients (0,2), (2,0), 2, 2. A simultaneous SGD step of size 0.1 reduces residual to 0.2 and loss to 0.04. Not an empirical training trajectory.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="8" fill="#f1f6fa"/><text x="24" y="32" fill="#233b52" font-size="21" text-anchor="start">GloVe · one gradient step</text><rect x="18" y="52" width="604" height="280" rx="6" fill="white" stroke="#d6e1e8"/><g class="motion"><text x="170" y="83" fill="#21678d" font-size="18" text-anchor="middle">Before</text><text x="340" y="83" fill="#a95516" font-size="18" text-anchor="middle">Gradient</text><text x="510" y="83" fill="#087d70" font-size="18" text-anchor="middle">After</text><rect x="29" y="99" width="90" height="36" rx="6" fill="#f1f6fa" stroke="none"/><text x="74" y="123" fill="#233b52" font-size="16" text-anchor="middle">Word</text><rect x="124" y="99" width="139" height="36" rx="6" fill="#e5eff6" stroke="none"/><text x="193" y="123" fill="#21678d" font-size="16" text-anchor="middle">(1, 0)</text><line x1="266" y1="117" x2="276" y2="117" stroke="#8da4b4" stroke-width="2"/><rect x="278" y="99" width="124" height="36" rx="6" fill="#fbeee4" stroke="none"/><line x1="405" y1="117" x2="415" y2="117" stroke="#8da4b4" stroke-width="2"/><rect x="417" y="99" width="193" height="36" rx="6" fill="#e5f5ee" stroke="none"/><rect x="29" y="144" width="90" height="36" rx="6" fill="#f1f6fa" stroke="none"/><text x="74" y="168" fill="#233b52" font-size="16" text-anchor="middle">Context</text><rect x="124" y="144" width="139" height="36" rx="6" fill="#e5eff6" stroke="none"/><text x="193" y="168" fill="#21678d" font-size="16" text-anchor="middle">(0, 1)</text><line x1="266" y1="162" x2="276" y2="162" stroke="#8da4b4" stroke-width="2"/><rect x="278" y="144" width="124" height="36" rx="6" fill="#fbeee4" stroke="none"/><line x1="405" y1="162" x2="415" y2="162" stroke="#8da4b4" stroke-width="2"/><rect x="417" y="144" width="193" height="36" rx="6" fill="#e5f5ee" stroke="none"/><rect x="29" y="189" width="90" height="36" rx="6" fill="#f1f6fa" stroke="none"/><text x="74" y="213" fill="#233b52" font-size="16" text-anchor="middle">Bias 1</text><rect x="124" y="189" width="139" height="36" rx="6" fill="#e5eff6" stroke="none"/><text x="193" y="213" fill="#21678d" font-size="16" text-anchor="middle">log(100)+1</text><line x1="266" y1="207" x2="276" y2="207" stroke="#8da4b4" stroke-width="2"/><rect x="278" y="189" width="124" height="36" rx="6" fill="#fbeee4" stroke="none"/><line x1="405" y1="207" x2="415" y2="207" stroke="#8da4b4" stroke-width="2"/><rect x="417" y="189" width="193" height="36" rx="6" fill="#e5f5ee" stroke="none"/><rect x="29" y="234" width="90" height="36" rx="6" fill="#f1f6fa" stroke="none"/><text x="74" y="258" fill="#233b52" font-size="16" text-anchor="middle">Bias 2</text><rect x="124" y="234" width="139" height="36" rx="6" fill="#e5eff6" stroke="none"/><text x="193" y="258" fill="#21678d" font-size="16" text-anchor="middle">0</text><line x1="266" y1="252" x2="276" y2="252" stroke="#8da4b4" stroke-width="2"/><rect x="278" y="234" width="124" height="36" rx="6" fill="#fbeee4" stroke="none"/><line x1="405" y1="252" x2="415" y2="252" stroke="#8da4b4" stroke-width="2"/><rect x="417" y="234" width="193" height="36" rx="6" fill="#e5f5ee" stroke="none"/><text x="340" y="329" fill="#233b52" font-size="14" text-anchor="middle">SGD: step size 0.1</text><text x="193" y="309" fill="#21678d" font-size="19" text-anchor="middle">Loss 1.00</text><g opacity="0"><animate attributeName="opacity" values="0;1;