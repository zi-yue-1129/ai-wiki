<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DARTS continuous relaxation and discretisation</title><desc id="desc">Schematic softmax operation weights shift from nearly uniform to Conv 3 by 3 dominance. Candidate outputs are 1, 2 and 0.5; a fixed argmax chooses Conv 3 by 3. These are illustrative, not measured gradients.</desc><style>text{font-family:Inter,Arial,sans-serif} @media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" stroke="#f5f9fc" stroke-width="1"/><text x="26" y="33" font-size="14" fill="#263d51" text-anchor="start" font-weight="750">DARTS  /  SOFT OPERATION MIX</text><text x="26" y="56" font-size="11" fill="#637b91" text-anchor="start" font-weight="500">Same input • three candidate operations</text><rect x="23" y="76" width="594" height="220" rx="13" fill="white" stroke="#dce7ef" stroke-width="1"/><rect x="42" y="103" width="47" height="41" rx="10" fill="#e4edf8" stroke="#bdd4e9" stroke-width="1"/><text x="65" y="130" font-size="19" fill="#3977b8" text-anchor="middle" font-weight="750">x</text><path d="M89 123L108 123" fill="none" stroke="#3977b8" stroke-width="2"/><path d="M108 118L108 240" fill="none" stroke="#3977b8" stroke-width="2"/><path d="M108 117L120 117" fill="none" stroke="#3977b8" stroke-width="2"/><path d="M115 113l6 4-6 4" stroke="#3977b8" stroke-width="2" fill="none"/><path d="M108 178L120 178" fill="none" stroke="#3977b8" stroke-width="2"/><path d="M115 174l6 4-6 4" stroke="#3977b8" stroke-width="2" fill="none"/><path d="M108 239L120 239" fill="none" stroke="#3977b8" stroke-width="2"/><path d="M115 235l6 4-6 4" stroke="#3977b8" stroke-width="2" fill="none"/><rect x="123" y="93" width="172" height="49" rx="8" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="134" y="102" width="7" height="31" rx="3" fill="#3977b8" stroke="#3977b8" stroke-width="1"/><text x="151" y="113" font-size="13" fill="#263d51" text-anchor="start" font-weight="700">Skip</text><text x="151" y="130" font-size="11" fill="#637b91" text-anchor="start" font-weight="500">f(x) = 1.0</text><path d="M296 117L333 117" fill="none" stroke="#dce7ef" stroke-width="2"/><rect x="339" y="102" width="238" height="34" rx="7" fill="#eef3f7" stroke="#eef3f7" stroke-width="1"/><rect x="342" y="108" width="228" height="22" rx="5" fill="#e4eaf0" stroke="#e4eaf0" stroke-width="1"/><rect x="342" y="108" width="23" height="22" rx="5" fill="#3977b8"></rect><rect x="123" y="154" width="172" height="49" rx="8" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="134" y="163" width="7" height="31" rx="3" fill="#0c968c" stroke="#0c968c" stroke-width="1"/><text x="151" y="174" font-size="13" fill="#263d51" text-anchor="start" font-weight="700">Conv 3×3</text><text x="151" y="191" font-size="11" fill="#637b91" text-anchor="start" font-weight="500">f(x) = 2.0</text><path d="M296 178L333 178" fill="none" stroke="#dce7ef" stroke-width="2"/><rect x="339" y="163" width="238" height="34" rx="7" fill="#eef3f7" stroke="#eef3f7" stroke-width="1"/><rect x="342" y="169" width="228" height="22" rx="5" fill="#e4eaf0" stroke="#e4eaf0" stroke-width="1"/><rect x="342" y="169" width="171" height="22" rx="5" fill="#0c968c"></rect><rect x="123" y="215" width="172" height="49" rx="8" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="134" y="224" width="7" height="31" rx="3" fill="#8564ba" stroke="#8564ba" stroke-width="1"/><text x="151" y="235" font-size="13" fill="#263d51" text-anchor="start" font-weight="700">Pool</text><text x="151" y="252" font-size="11" fill="#637b91" text-anchor="start" font-weight="500">f(x) = 0.5</text><path d="M296 239L333 239" fill="none" stroke="#dce7ef" stroke-width="2"/><rect x="339" y="224" width="238" height="34" rx="7" fill="#eef3f7" stroke="#eef3f7" stroke-width="1"/><rect x="342" y="230" width="228" height="22" rx="5" fill="#e4eaf0" stroke="#e4eaf0" stroke-width="1"/><rect x="342" y="230" width="34" height="22" rx="5" fill="#8564ba"></rect><text x="346" y="91" font-size="11" fill="#637b91" text-anchor="start" font-weight="650">softmax(α)</text><path d="M300 275L330 275" fill="none" stroke="#dce7ef" stroke-width="2"/><rect x="36" y="309" width="257" height="34" rx="9" fill="#e4edf8" stroke="#d7e5f1" stroke-width="1"/><text x="165" y="331" font-size="13" fill="#3977b8" text-anchor="middle" font-weight="700">Mix = 1.675</text><text x="309" y="332" font-size="19" fill="#637b91" text-anchor="middle" font-weight="600">→</text><rect x="330" y="309" width="274" height="34" rx="9" fill="#ddf4ed" stroke="#bfe2d7" stroke-width="1"/><text x="463" y="331" font-size="13" fill="#0c968c" text-anchor="middle" font-weight="750">Discrete: Conv 3×3</text><text x="313" y="284" font-size="12" fill="#637b91" text-anchor="middle" font-weight="600">Search weights  →  final argmax</text></svg>