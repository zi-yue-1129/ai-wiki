<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">SHAP: weighted marginal contributions of feature A</title><desc id="dsc">A three-feature toy cooperative game. The four coalitions excluding A are evaluated, each marginal contribution bar grows, and its Shapley combinatorial weight builds a final total phi_A of 0.240. The numbers are exact for a constructed value function, not a measured model.</desc><style>text{font-family:Inter,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still-layer{opacity:1!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f4f8fb" /><text x="25" y="30" font-size="12" fill="#647f91" font-weight="750">SHAP  /  FEATURE A CREDIT</text><rect x="20" y="50" width="418" height="284" rx="14" fill="#ffffff" stroke="#dbe6ee" stroke-width="1" /><rect x="452" y="50" width="169" height="284" rx="14" fill="#ffffff" stroke="#dbe6ee" stroke-width="1" /><text x="36" y="75" font-size="10" fill="#647f91" font-weight="800">COALITION</text><text x="177" y="75" font-size="10" fill="#647f91" font-weight="800">ADD A:  ΔA</text><text x="364" y="75" font-size="10" fill="#647f91" font-weight="800">WEIGHT</text><rect x="34" y="85" width="390" height="48" rx="8" fill="#f8fbfd" /><rect x="45" y="92" width="81" height="30" rx="7" fill="#ecf3f8" /><text x="86" y="112" font-size="14" fill="#246996" font-weight="800" text-anchor="middle">∅</text><text x="138" y="111" font-size="13" fill="#eb8545" font-weight="800">+ A</text><rect x="195" y="96" width="142" height="17" rx="8" fill="#e9f0f4" /><rect x="195" y="96" width="83.5" height="17" rx="8" fill="#078a80" /><text x="344" y="110" font-size="11" fill="#213d54" font-weight="700">0.20</text><text x="385" y="110" font-size="13" fill="#213d54" font-weight="700">1/3</text><rect x="34" y="144" width="390" height="48" rx="8" fill="#f8fbfd" /><rect x="45" y="151" width="81" height="30" rx="7" fill="#ecf3f8" /><text x="86" y="171" font-size="14" fill="#246996" font-weight="800" text-anchor="middle">B</text><text x="138" y="170" font-size="13" fill="#eb8545" font-weight="800">+ A</text><rect x="195" y="155" width="142" height="17" rx="8" fill="#e9f0f4" /><rect x="195" y="155" width="133.6" height="17" rx="8" fill="#078a80" /><text x="344" y="169" font-size="11" fill="#213d54" font-weight="700">0.32</text><text x="385" y="169" font-size="13" fill="#213d54" font-weight="700">1/6</text><rect x="34" y="203" width="390" height="48" rx="8" fill="#f8fbfd" /><rect x="45" y="210" width="81" height="30" rx="7" fill="#ecf3f8" /><text x="86" y="230" font-size="14" fill="#246996" font-weight="800" text-anchor="middle">C</text><text x="138" y="229" font-size="13" fill="#eb8545" font-weight="800">+ A</text><rect x="195" y="214" width="142" height="17" rx="8" fill="#e9f0f4" /><rect x="195" y="214" width="50.1" height="17" rx="8" fill="#078a80" /><text x="344" y="228" font-size="11" fill="#213d54" font-weight="700">0.12</text><text x="385" y="228" font-size="13" fill="#213d54" font-weight="700">1/6</text><rect x="34" y="262" width="390" height="48" rx="8" fill="#f8fbfd" /><rect x="45" y="269" width="81" height="30" rx="7" fill="#ecf3f8" /><text x="86" y="289" font-size="14" fill="#246996" font-weight="800" text-anchor="middle">B+C</text><text x="138" y="288" font-size="13" fill="#eb8545" font-weight="800">+ A</text><rect x="195" y="273" width="142" height="17" rx="8" fill="#e9f0f4" /><rect x="195" y="273" width="125.3" height="17" rx="8" fill="#078a80" /><text x="344" y="287" font-size="11" fill="#213d54" font-weight="700">0.30</text><text x="385" y="287" font-size="13" fill="#213d54" font-weight="700">1/3</text><text x="468" y="80" font-size="10" fill="#647f91" font-weight="800">WEIGHTED SUM</text><text x="468" y="111" font-size="16" fill="#213d54" font-weight="800">Shapley φA</text><text x="468" y="143" font-size="11" fill="#647f91" font-weight="650">1/3  ·