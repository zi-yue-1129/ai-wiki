<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC-AUC with tied score comparisons</title><desc id="desc">Two synthetic positives with scores 0.90 and 0.80, two negatives with scores 0.80 and 0.20. A tie contributes half a win, giving ROC-AUC 3.5/4 = 0.875. The animation checks four score pairs sequentially.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#183c52}.title{font-size:19px;font-weight:750}.small{font-size:12px;font-weight:600}.mini{font-size:11px;font-weight:600}.num{font-size:19px;font-weight:760}.muted{fill:#5e788b}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" /><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#d8e6ee" /><text x="24" y="35" class="title">ROC-AUC  ·  TIE CREDIT</text><text x="24" y="56" class="small muted">Equal scores receive one-half pairwise credit</text><text x="25" y="342" class="mini muted">SYNTHETIC EXAMPLE  ·  NOT MODEL MEASUREMENTS</text><rect x="22" y="73" width="280" height="245" rx="12" fill="#fff" stroke="#d8e6ee" /><rect x="313" y="73" width="305" height="245" rx="12" fill="#fff" stroke="#d8e6ee" /><text x="40" y="100" class="small muted">ACTIVE SCORE PAIR</text><text x="331" y="100" class="small muted">POSITIVE × NEGATIVE</text><line x1="62" y1="255" x2="270" y2="255" stroke="#d8e6ee" stroke-width="2" /><text x="60" y="273" class="mini muted">0</text><text x="269" y="273" class="mini muted" text-anchor="end">1</text><text x="352" y="129" class="mini muted">N .80</text><text x="452" y="129" class="mini muted">N .20</text><text x="327" y="159" class="mini">P .90</text><text x="327" y="222" class="mini">P .80</text><g class="moving" opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1.0000" values="1;0;0;0;0;0" /><text x="46" y="132" class="small">P   0.90</text><text x="46" y="182" class="small">N   0.80</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="249.2" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="228.4" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">SCORE ORDER</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="171" class="small muted" text-anchor="middle">–</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="171" class="small muted" text-anchor="middle">–</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="234" class="small muted" text-anchor="middle">–</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="234" class="small muted" text-anchor="middle">–</text><text x="332" y="293" class="small">CREDIT  0 / 4</text></g><g class="moving" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1.0000" values="0;1;0;0;0;0" /><text x="46" y="132" class="small">P   0.90</text><text x="46" y="182" class="small">N   0.80</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="249.2" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="228.4" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">PAIR 1 OF 4</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#183c52" stroke-width="2" /><text x="438.5" y="171" class="num" text-anchor="middle">1</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="171" class="small muted" text-anchor="middle">–</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="234" class="small muted" text-anchor="middle">–</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="234" class="small muted" text-anchor="middle">–</text><text x="332" y="293" class="small">CREDIT  1 / 4</text></g><g class="moving" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1.0000" values="0;0;1;0;0;0" /><text x="46" y="132" class="small">P   0.90</text><text x="46" y="182" class="small">N   0.20</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="249.2" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="103.6" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">PAIR 2 OF 4</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="171" class="num" text-anchor="middle">1</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#183c52" stroke-width="2" /><text x="539.5" y="171" class="num" text-anchor="middle">1</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="234" class="small muted" text-anchor="middle">–</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="234" class="small muted" text-anchor="middle">–</text><text x="332" y="293" class="small">CREDIT  2 / 4</text></g><g class="moving" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1.0000" values="0;0;0;1;0;0" /><text x="46" y="132" class="small">P   0.80</text><text x="46" y="182" class="small">N   0.80</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="228.4" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="228.4" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">SCORES TIED</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="171" class="num" text-anchor="middle">1</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="171" class="num" text-anchor="middle">1</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#fff0d9" stroke="#183c52" stroke-width="2" /><text x="438.5" y="234" class="num" text-anchor="middle">½</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#f0f5f8" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="234" class="small muted" text-anchor="middle">–</text><text x="332" y="293" class="small">CREDIT  2.5 / 4</text></g><g class="moving" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2000;0.4000;0.6000;0.8000;1.0000" values="0;0;0;0;1;0" /><text x="46" y="132" class="small">P   0.80</text><text x="46" y="182" class="small">N   0.20</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="228.4" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="103.6" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">PAIR 4 OF 4</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="171" class="num" text-anchor="middle">1</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="171" class="num" text-anchor="middle">1</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#fff0d9" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="234" class="num" text-anchor="middle">½</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#183c52" stroke-width="2" /><text x="539.5" y="234" class="num" text-anchor="middle">1</text><text x="332" y="293" class="small">AUC   3.5 / 4  =  0.875</text></g><g class="still"><text x="46" y="132" class="small">P   0.80</text><text x="46" y="182" class="small">N   0.80</text><line x1="62" y1="160" x2="270" y2="160" stroke="#d8e6ee" stroke-dasharray="4 5" /><line x1="62" y1="210" x2="270" y2="210" stroke="#d8e6ee" stroke-dasharray="4 5" /><circle cx="228.4" cy="160" r="8.5" fill="#12877e" stroke="#fff" stroke-width="2" /><circle cx="228.4" cy="210" r="8.5" fill="#b66b27" stroke="#fff" stroke-width="2" /><text x="45" y="299" class="small muted">TIE ½ CREDIT</text><rect x="393" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="438.5" y="171" class="num" text-anchor="middle">1</text><rect x="494" y="140" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="171" class="num" text-anchor="middle">1</text><rect x="393" y="203" width="91" height="50" rx="9" fill="#fff0d9" stroke="#183c52" stroke-width="2" /><text x="438.5" y="234" class="num" text-anchor="middle">½</text><rect x="494" y="203" width="91" height="50" rx="9" fill="#d9f4ee" stroke="#d8e6ee" stroke-width="1" /><text x="539.5" y="234" class="num" text-anchor="middle">1</text><text x="332" y="293" class="small">AUC   3.5 / 4  =  0.875</text></g></svg>
