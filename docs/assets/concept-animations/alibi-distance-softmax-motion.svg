<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
<title id="title">ALiBi causal distance-bias sweep</title><desc id="description">Illustrative causal softmax with eight equal content logits. For key distance d, the ALiBi bias is negative m times d; each normalized weight equals exp(-m d) divided by the sum of eight exponentials. At slope zero the distribution is uniform and increasing the slope concentrates probability near the current token.</desc>
