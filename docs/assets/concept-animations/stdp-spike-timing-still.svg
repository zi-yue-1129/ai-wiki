<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">STDP: causal spike order changes synaptic weight</title><desc id="desc">The presynaptic spike stays fixed. A postsynaptic spike moves from earlier to later relative to it. The lower window displays depression when post fires first and potentiation when pre fires first, with magnitude decaying with separation. An illustrative pair-based rule, not measured plasticity. The illustrated samples use A+=A-=1, tau+=18 ms, tau-=14 ms; the marker skips undefined zero and advances in one-ms steps.</desc><style>@media (prefers-reduced-motion:reduce){.motion-only{display:none!important}.static-only{display:inline!important}}</style><rect x="1" y="1" width="638" height="358" rx="15" fill="#f8fbfd" stroke="#d7e4ed"/><text x="28" y="38" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#22394d">STDP</text><text x="610" y="38" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#637a8e">SPIKE TIMING</text><rect x="28" y="55" width="584" height="117" rx="12" fill="#fff" stroke="#d7e4ed"/><path d="M112 98L568 98" fill="none" stroke="#d7e4ed" stroke-width="1.6" stroke-linecap="round"/><path d="M160 94L160 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M232 94L232 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M304 94L304 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M376 94L376 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M448 94L448 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M520 94L520 102" fill="none" stroke="#d7e4ed" stroke-width="1" stroke-linecap="round"/><path d="M112 144L568 144" fill="none" stroke="#d7e4ed" stroke-width="1.6" stroke-linecap="round"/><p