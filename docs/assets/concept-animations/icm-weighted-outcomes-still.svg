<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 750" role="img" aria-labelledby="title desc">
<title id="title">ICM: changing outcome probabilities moves the conditional mean</title>
<desc id="desc">Three probability mixtures of the same discrete next-state feature locations. The mean and minimum expected squared error change when probabilities change; these are illustrative, not measured data.</desc>
<rect width="420" height="750" fill="#ffffff"/>
<rect x="12" y="12" width="396" height="222" rx="17" fill="#f7fafc" stroke="#c3d5e1"/>
<text x="29" y="44" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263e55">Favor 3</text>
<text x="278" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7759a7">Var 2.40</text>
<path d="M30 59H390" stroke="#d7e5ec"/>
<text x="29" y="81" font-family="Arial,sans-serif" font-size="13" fill="#48667a">P(1/2/3): 13/33/53%</text>
<circle cx="300" cy="153.4" r="11.13" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="300" cy="153.4" r="4" fill="#268a6b"/>
<text x="319" y="142.4" font-family="Arial,sans-serif" font-size="13" fill="#187259">1</text>
<circle cx="240" cy="194.7" r="14.33" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="240" cy="194.7" r="4" fill="#268a6b"/>
<text x="259" y="183.7" font-family="Arial,sans-serif" font-size="13" fill="#187259">2</text>
<circle cx="177" cy="163.2" r="17.53" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="177" cy="163.2" r="4" fill="#268a6b"/>
<text x="196" y="152.2" font-family="Arial,sans-serif" font-size="13" fill="#187259">3</text>
<circle cx="214.40" cy="172.39" r="15" fill="none" stroke="#775fb0" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="214.40" cy="172.39" r="6" fill="#e19748" stroke="#fff" stroke-width="2"/>
<path d="M29 211H391" stroke="#e2eaf0"/>
<text x="30" y="227" font-family="Arial,sans-serif" font-size="14" fill="#456176">Larger circle = higher P; ring = mean</text>
<rect x="12" y="252" width="396" height="222" rx="17" fill="#f7fafc" stroke="#c3d5e1"/>
<text x="29" y="284" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263e55">Equal</text>
<text x="278" y="283" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7759a7">Var 3.02</text>
<path d="M30 299H390" stroke="#d7e5ec"/>
<text x="29" y="321" font-family="Arial,sans-serif" font-size="13" fill="#48667a">P(1/2/3): 33/33/33%</text>
<circle cx="300" cy="393.4" r="14.33" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="300" cy="393.4" r="4" fill="#268a6b"/>
<text x="319" y="382.4" font-family="Arial,sans-serif" font-size="13" fill="#187259">1</text>
<circle cx="240" cy="434.7" r="14.33" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="240" cy="434.7" r="4" fill="#268a6b"/>
<text x="259" y="423.7" font-family="Arial,sans-serif" font-size="13" fill="#187259">2</text>
<circle cx="177" cy="403.2" r="14.33" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="177" cy="403.2" r="4" fill="#268a6b"/>
<text x="196" y="392.2" font-family="Arial,sans-serif" font-size="13" fill="#187259">3</text>
<circle cx="239.00" cy="410.43" r="15" fill="none" stroke="#775fb0" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="239.00" cy="410.43" r="6" fill="#e19748" stroke="#fff" stroke-width="2"/>
<path d="M29 451H391" stroke="#e2eaf0"/>
<text x="30" y="467" font-family="Arial,sans-serif" font-size="14" fill="#456176">Larger circle = higher P; ring = mean</text>
<rect x="12" y="492" width="396" height="222" rx="17" fill="#f7fafc" stroke="#c3d5e1"/>
<text x="29" y="524" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263e55">Favor 1</text>
<text x="278" y="523" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7759a7">Var 2.65</text>
<path d="M30 539H390" stroke="#d7e5ec"/>
<text x="29" y="561" font-family="Arial,sans-serif" font-size="13" fill="#48667a">P(1/2/3): 53/33/13%</text>
<circle cx="300" cy="633.4" r="17.53" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="300" cy="633.4" r="4" fill="#268a6b"/>
<text x="319" y="622.4" font-family="Arial,sans-serif" font-size="13" fill="#187259">1</text>
<circle cx="240" cy="674.7" r="14.33" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="240" cy="674.7" r="4" fill="#268a6b"/>
<text x="259" y="663.7" font-family="Arial,sans-serif" font-size="13" fill="#187259">2</text>
<circle cx="177" cy="643.2" r="11.13" fill="#d8efe5" stroke="#268a6b" stroke-width="1.8"/>
<circle cx="177" cy="643.2" r="4" fill="#268a6b"/>
<text x="196" y="632.2" font-family="Arial,sans-serif" font-size="13" fill="#187259">3</text>
<circle cx="263.60" cy="648.47" r="15" fill="none" stroke="#775fb0" stroke-width="2" stroke-dasharray="3 4"/>
<circle cx="263.60" cy="648.47" r="6" fill="#e19748" stroke="#fff" stroke-width="2"/>
<path d="M29 691H391" stroke="#e2eaf0"/>
<text x="30" y="707" font-family="Arial,sans-serif" font-size="14" fill="#456176">Larger circle = higher P; ring = mean</text>
</svg>
