<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">TRPO trust region and KL-aware backtracking line search</ns0:title><ns0:desc id="desc">Schematic trust-region ellipse around the old policy. An unconstrained proposed step violates an illustrative KL budget, and backtracking accepts a smaller step with a lower KL. The ellipse and KL values are illustrative, not policy measurements.</ns0:desc><ns0:style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.reduced{display:inline!important}}</ns0:style><ns0:rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1" /><ns0:text x="30" y="38" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">TRPO  ·  constrained policy update</ns0:text><ns0:text x="30" y="57" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Proposal → KL check → backtracking → accepted step</ns0:text><ns0:rect x="26" y="78" width="390" height="234" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5" /><ns0:rect x="430" y="78" width="184" height="234" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5" /><ns0:text x="43" y="104" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="start">Local policy coordinates</ns0:text><ns0:ellipse cx="190" cy="214" rx="116" ry="73" fill="#edf8f5" stroke="#0f9187" stroke-width="2" stroke-dasharray="6 5" /><ns0:text x="190" y="134" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">KL ≤ δ</ns0:text><ns0:path d="M190 214 L356 134" fill="none" stroke="#64778a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" /><ns0:circle cx="190" cy="214" r="6" fill="#2563eb" stroke="none" stroke-width="1" /><ns0:text x="180" y="238" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end">old π</ns0:text><ns0:circle cx="356" cy="134" r="7" fill="#da7b2c" stroke="none" stroke-width="1" /><ns0:text x="390" y="112" fill="#da7b2c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" text-anchor="end">proposed</ns0:text><ns0:circle cx="273" cy="174" r="7" fill="#0f9187" stroke="none" stroke-width="1" /><ns0:text x="312" y="194" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" text-anchor="start">accepted</ns0:text><ns0:text x="452" y="106" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">KL / δ</ns0:text><ns0:text x="453" y="145" fill="#da7b2c" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">1.8</ns0:text><ns0:text x="491" y="145" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="start">full step</ns0:text><ns0:path d="M452 158 H591" fill="none" stroke="#dbe5ed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><ns0:text x="453" y="194" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">0.55</ns0:text><ns0:text x="499" y="194" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="start">backtrack</ns0:text><ns0:path d="M452 212 H591" fill="none" stroke="#dbe5ed" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><ns0:text x="452" y="243" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="550" text-anchor="start">δ = 0.01</ns0:text><ns0:text x="452" y="302" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">schematic</ns0:text><ns0:circle cx="273" cy="174" r="13" fill="none" stroke="#0f9187" stroke-width="2.5" /><ns0:rect x="28" y="326" width="584" height="24" rx="8" fill="#edf2f7" stroke="none" stroke-width="0" /><ns0:text x="42" y="342" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Illustrative 2D geometry; true KL geometry is policy-dependent</ns0:text><ns0:text x="452" y="265" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500">surrogate improves</ns0:text><ns0:text x="452" y="284" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500">both checks required</ns0:text></ns0:svg>
