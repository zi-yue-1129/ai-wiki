<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Toy width-scaled hidden-weight update budget</title><desc id="d">Sixteen artificial equal-direction coordinate updates show how a per-coordinate learning rate inversely scaled with width keeps the sum of their magnitudes fixed, unlike a comparator with a fixed coordinate step. This is a toy arithmetic illustration, not actual muP network training.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b53}.k{font-size:11px;font-weight:700;letter-spacing:1px;fill:#657d92}.h{font-size:19px;font-weight:700}.s{font-size:12px;fill:#5a7085}.l{font-size:13px;font-weight:700}.sm{font-size:11px;fill:#61768a}.num{font-size:15px;font-weight:700}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="17" fill="#f3f7fb" /><text x="28" y="29" class="k">MUP · ARTIFICIAL ADAM-LIKE COORDINATE STEPS</text><text x="28" y="57" class="h">Step size and width: two different totals</text><text x="28" y="78" class="s">Toy equal-magnitude updates · reference width 4 · η₀ = 1</text><rect x="25" y="95" width="198" height="232" rx="13" fill="#fff" stroke="#dbe6ef" /><rect x="235" y="95" width="380" height="232" rx="13" fill="#fff" stroke="#dbe6ef" /><text x="43" y="122" class="l">Coordinates</text><text x="253" y="122" class="l">One coordinate: η₀ / n</text><rect x="46" y="143" width="31" height="24" rx="5" fill="#179d96" opacity="1" /><rect x="86" y="143" width="31" height="24" rx="5" fill="#179d96" opacity="1" /><rect x="126" y="143" width="31" height="24" rx="5" fill="#179d96" opacity="1" /><rect x="166" y="143" width="31" height="24" rx="5" fill="#179d96" opacity="1" /><rect x="46" y="177" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;1.000;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="86" y="177" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;1.000;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="126" y="177" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;1.000;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="166" y="177" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;1.000;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="46" y="211" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="86" y="211" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="126" y="211" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="166" y="211" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="46" y="245" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="86" y="245" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="126" y="245" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><rect x="166" y="245" width="31" height="24" rx="5" fill="#179d96" opacity="0.14"><animate attributeName="opacity" values="0.140;0.140;1.000;1.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><text x="45" y="307" class="sm">n = 4 → 8 → 16</text><rect x="256" y="138" width="318" height="18" rx="5" fill="#e6eef3" /><rect x="256" y="138" height="18" rx="5" fill="#0d9e97" width="224"><animate attributeName="width" values="224.000;112.000;56.000;56.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><text x="258" y="178" class="sm">Per-coordinate step falls as width grows</text><text x="253" y="206" class="l">Sum of absolute steps</text><text x="256" y="230" class="sm">Scaled with 1/n</text><text x="256" y="281" class="sm">Fixed 1/4 step</text><rect x="256" y="236" width="324" height="15" rx="4" fill="#e6eef3" /><rect x="256" y="286" width="324" height="15" rx="4" fill="#e6eef3" /><rect x="256" y="236" height="15" rx="4" fill="#0d9e97" width="72" /><rect x="256" y="286" height="15" rx="4" fill="#e38a47" width="72"><animate attributeName="width" values="72.000;144.000;288.000;288.000" keyTimes="0.0000;0.3300;0.6600;1.0000" dur="12s" calcMode="discrete" repeatCount="indefinite" /></rect><text x="335" y="249" class="sm" fill="#0d9e97">1</text><text x="433" y="318" class="sm">Fixed-step sum grows with n</text><text x="28" y="346" class="sm">Illustrative 