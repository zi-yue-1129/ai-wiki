<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="gibbsTitle gibbsDesc"><title id="gibbsTitle">Gibbs: disconnected support and block moves</title><desc id="gibbsDesc">Only states (0,0) and (1,1) have mass. Single-coordinate updates must stay at their starting mode; a joint block draw can move between the two modes.</desc><rect width="640" height="330" rx="16" fill="#f5f9fc"/><rect x="16" y="18" width="374" height="294" rx="12" fill="#fff" stroke="#d9e5ec"/><rect x="401" y="18" width="224" height="294" rx="12" fill="#fff" stroke="#d9e5ec"/><g font-family="system-ui,sans-serif" fill="#244259"><text x="34" y="44" font-size="17" font-weight="700">Disconnected support</text><text x="414" y="44" font-size="17" font-weight="700">Two kernels</text><text x="414" y="90" font-size="13">Single-site</text><text x="414" y="116" font-size="20" font-weight="700">P(stay) = 1</text><text x="414" y="174" font-size="13">Joint block</text><text x="414" y="200" font-size="20" font-weight="700">P(switch) = 0.5</text><text x="34" y="290" font-size="13" fill="#60778a">Only the diagonal states have mass</text></g><path d="M165 227 L265 128" fill="none" stroke="#168d85" stroke-width="5" stroke-dasharray="8 6"/><circle cx="165" cy="227" r="30" fill="#0a847a"/><circle cx="265" cy="128" r="30" fill="#e3f2ef" stroke="#8bc5be" stroke-width="2"/><circle cx="265" cy="227" r="28" fill="#e7ecf0"/><circle cx="165" cy="128" r="28" fill="#e7ecf0"/><g font-family="system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#516a7b"><text x="165" y="133">(0,1)</text><text x="265" y="232">(1,0)</text><text x="265" y="133">(1,1)</text><text x="165" y="232" fill="#fff">(0,0)</text></g></svg>
