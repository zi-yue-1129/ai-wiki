<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Matrix factorization: coupled SGD movement</title><desc id="desc">Five states (initial plus four regularization-free SGD updates) fit one illustrative rating. User and item vectors in a two-dimensional factor space move together, increasing the dot-product prediction toward the target and decreasing its residual.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eff5fa"/></linearGradient><marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#138d88"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#df8251"/></marker></defs><style>text{font-family:Inter,Arial,ui-sans-serif,sans-serif;fill:#264459}.head{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#657e90}.mini{font-size:13px;fill:#617b8c}.panel{fill:#fff;stroke:#dbe6ed;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="800" height="420" rx="20" fill="url(#paper)"/><text x="25" y="36" class="head">RECOMMENDER SYSTEMS · WORKED EXAMPLE</text><rect class="panel" x="20" y="63" width="388" height="315" rx="18"/><rect class="panel" x="424" y="63" width="356" height="315" rx="18"/><text x="44" y="95" class="head">SHARED FACTOR SPACE</text><circle cx="57" cy="123" r="5" fill="#138d88"/><text x="70" y="127" class="mini">User p</text><circle cx="217" cy="123" r="5" fill="#df8251"/><text x="230" y="127" class="mini">Item q</text><path d="M65 301H377 M195 350V153" stroke="#b5cad6" stroke-width="2"/><path d="M195 181H377 M75 221H367" stroke="#ecf1f5" stroke-width="1" stroke-dasharray="4 6"/><circle cx="195" cy="301" r="4.5" fill="#37556a"/><line x1="195" y1="301" x2="259" y2="269" stroke="#138d88" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)"></line><circle cx="259" cy="269" r="6" fill="#138d88" stroke="#fff" stroke-width="2"></circle><line x1="195" y1="301" x2="307" y2="253" stroke="#df8251" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"></line><circle cx="307" cy="253" r="6" fill="#df8251" stroke="#fff" stroke-width="2"></circle><text x="46" y="357" class="mini">Joint SGD: update both vectors</text><text x="450" y="95" class="head">PREDICTION VS TARGET</text><text x="450" y="135" class="mini">Predicted dot product</text><rect x="450" y="151" width="278" height="22" rx="11" fill="#edf3f6"/><rect x="450" y="151" width="91.12" height="22" rx="11" fill="#138d88"></rect><line x1="718" y1="143" x2="718" y2="183" stroke="#37566b" stroke-width="2.5"/><text x="705" y="202" class="mini">r = 1</text><text x="450" y="236" class="mini">Absolute residual</text><rect x="450" y="251" width="268" height="22" rx="11" fill="#edf3f6"/><rect x="450" y="251" width="176.88" height="22" rx="11" fill="#df8251"></rect><text x="450" y="316" class="mini">SGD step (illustrative)</text><circle cx="470" cy="344" r="6" fill="#e4ecf2" stroke="#b8cad6"/><circle cx="530" cy="344" r="6" fill="#e4ecf2" stroke="#b8cad6"/><circle cx="590" cy="344" r="6" fill="#e4ecf2" stroke="#b8cad6"/><circle cx="650" cy="344" r="6" fill="#e4ecf2" stroke="#b8cad6"/><circle cx="710" cy="344" r="6" fill="#e4ecf2" stroke="#b8cad6"/><circle cx="470" cy="344" r="6" fill="#193f55"></circle></svg>