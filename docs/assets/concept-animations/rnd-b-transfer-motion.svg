<svg xmlns="http://www.w3.org/2000/svg" width="380" height="500" viewBox="0 0 380 500" role="img" aria-labelledby="title desc">
<title id="title">RND: unseen state B can already have low predictor error</title>
<desc id="desc">A fixed green target for never-seen B and a hypothetical orange predictor gradually overlap as transfer increases. Squared-error bar decreases quadratically while transfer rises linearly. Counterfactual predictions, not model training measurements.</desc>
