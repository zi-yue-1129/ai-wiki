<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">TD3 target smoothing, twin critics, delayed actor</title><desc id="desc">The target actor adds clipped noise; two target critics form the minimum bootstrap target. Online critics update each step; actor and target networks update every second critic step. Schematic.</desc><defs><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#087f82" stroke-width="1.5"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c46a2b" stroke-width="1.5"/></marker><marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#718499" stroke-width="1.5"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.frame{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f9fbfe"/><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#dce6ef" stroke-width="1"/><rect x="28" y="24" width="140" height="40" rx="10" fill="#eef4f9" stroke="#dce6ef" stroke-width="1.5"/><text x="98" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#718499" text-anchor="middle">Smooth</text><rect x="176" y="24" width="140" height="40" rx="10" fill="#eef4f9" stroke="#dce6ef" stroke-width="1.5"/><text x="246" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#718499" text-anchor="middle">Min Q</text><rect x="324" y="24" width="140" height="40" rx="10" fill="#eef4f9" stroke="#dce6ef" stroke-width="1.5"/><text x="394" y="49" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#718499" text-anchor="middle">Critics ×2</text><rect x="472" y="2