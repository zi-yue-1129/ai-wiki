124 L482 124" stroke="#718499" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-gray)"/><path d="M441 166 L463 166 L463 140 L482 140" stroke="#718499" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-gray)"/><text x="317" y="201" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#718499" text-anchor="middle">Target critics</text><text x="320" y="223" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#23364a" text-anchor="middle">Online updates</text><rect x="32" y="244" width="171" height="57" rx="10" fill="#ffffff" stroke="#dce6ef" stroke-width="1.5"/><text x="117.5" y="277.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#23364a" text-anchor="middle">Q₁ + Q₂</text><rect x="241" y="244" width="156" height="57" rx="10" fill="#ffffff" stroke="#dce6ef" stroke-width="1.5"/><text x="319" y="277.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#23364a" text-anchor="middle">Actor π</text><rect x="438" y="244" width="171" height="57" rx="10" fill="#ffffff" stroke="#dce6ef" stroke-width="1.5"/><text x="523.5" y="277.5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#23364a" text-anchor="middle">Target nets</text><path d="M203 272 L237 272" stroke="#718499" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/><path d="M397 272 L434 272" stroke="#718499" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/><text x="117" y="325" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#718499" text-anchor="middle">every step</text><text x="319" y="325" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#718499" text-an