<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">SVD repeated singular values and rotating singular bases</title><desc id="svgdesc">For A=2I, equal singular values permit simultaneous orthonormal rotations of U and V. Rotating orange and blue axes change both singular-vector bases while the fixed input x and output Ax remain identical. The matrix stays unchanged.</desc><defs><marker id="tipT" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#0f827f" stroke-width="1.7"/></marker><marker id="tipO" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#e0943c" stroke-width="1.7"/></marker><marker id="tipB" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#4b70b3" stroke-width="1.7"/></marker></defs><rect x="1" y="1" width="798" height="418" rx="18" fill="#f6f9fc" stroke="#d2e0ea"/><rect x="19" y="72" width="358" height="326" rx="16" fill="white" stroke="#d6e3eb"/><rect x="392" y="72" width="388" height="326" rx="16" fill="white" stroke="#d6e3eb"/><text x="28" y="40" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#243c50" text-anchor="start" font-weight="700">Repeated singular values</text><text x="28" y="61" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5a7281" text-anchor="start" font-weight="500">A = 2I    ·    U = V = R(θ)    ·    Σ = 2I</text><text x="40" y="104" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243c50" text-anchor="start" font-weight="650">Input</text><text x="416" y="104" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#243c50" text-anchor="start" font-weight="650">Output</text><circle cx="185" cy="230" r="91" fill="#f8fcfc" stroke="#dfebf0" stroke-width="1.7"/><line x1="71" y1="230" x2="324" y2="230" stroke="#e3edf3" stroke-width="1.3" stroke-linecap="round"/><line x1="185" y1="112" x2="185" y2="338" stroke="#e3edf3" stroke-width="1.3" stroke-linecap="round"/><circle cx="185" cy="230" r="4.4" fill="#243c50"/><g transform="translate(185 230)"><g><line x1="0" y1="0" x2="75" y2="0" stroke="#e0943c" stroke-width="3" stroke-linecap="round" marker-end="url(#tipO)"/><line x1="0" y1="0" x2="0" y2="-75" stroke="#4b70b3" stroke-width="3" stroke-linecap="round" marker-end="url(#tipB)"/><animateTransform attributeName="transform" type="rotate" values="-35;-125;-215;-305;-395" dur="12s" repeatCount="indefinite"/></g></g><circle cx="565" cy="230" r="91" fill="#f8fcfc" stroke="#dfebf0" stroke-width="1.7"/><line x1="451" y1="230" x2="704" y2="230" stroke="#e3edf3" stroke-width="1.3" stroke-linecap="round"/><line x1="565" y1="112" x2="565" y2="338" stroke="#e3edf3" stroke-width="1.3" stroke-linecap="round"/><circle cx="565" cy="230" r="4.4" fill="#243c50"/><g transform="translate(565 230)"><g><line x1="0" y1="0" x2="75" y2="0" stroke="#e0943c" stroke-width="3" stroke-linecap="round" marker-end="url(#tipO)"/><line x1="0" y1="0" x2="0" y2="-75" stroke="#4b70b3" stroke-width="3" stroke-linecap="round" marker-end="url(#tipB)"/><animateTransform attributeName="transform" type="rotate" values="-35;-125;-215;-305;-395" dur="12s" repeatCount="indefinite"/></g></g><line x1="185" y1="230" x2="250" y2="207" stroke="#0f827f" stroke-width="4" stroke-linecap="round" marker-end="url(#tipT)"/><text x="263" y="203" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f827f" text-anchor="start" font-weight="700">x</text><line x1="565" y1="230" x2="694" y2="184" stroke="#0f827f" stroke-width="4" stroke-linecap="round" marker-end="url(#tipT)"/><text x="702" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0f827f" text-anchor="start" font-weight="700">Ax</text><text x="73" y="363" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a7281" text-anchor="start" font-weight="600">σ₁ = σ₂ = 2</text><text x="424" y="363" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#5a7281" text-anchor="start" font-weight="600">Same Ax for every θ</text><text x="377" y="252" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#0f827f" text-anchor="middle" font-weight="700">→</text></svg>