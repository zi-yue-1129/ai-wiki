3269ad" font-weight="700" text-anchor="middle">πθ</text><path d="M24 253 L616 253" fill="none" stroke="#dbe5ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#63788e" font-weight="700" text-anchor="start">TRAINING</text><rect x="43" y="284" width="74" height="44" rx="10" fill="#eff4f8" stroke="none" stroke-width="0"/><text x="80" y="311" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#23354a" font-weight="650" text-anchor="middle">state s</text><rect x="162" y="284" width="90" height="44" rx="10" fill="#e4f4f0" stroke="#078f91" stroke-width="1.5"/><text x="207" y="311" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#078f91" font-weight="700" text-anchor="middle">V(s)</text><rect x="301" y="284" width="105" height="44" rx="10" fill="#e4f4f0" stroke="#078f91" stroke-width="1.5"/><text x="353" y="310" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#078f91" font-weight="700" text-anchor="middle">GAE</text><rect x="461" y="284" width="135" height="44" rx="10" fill="#fff0e1" stroke="#d57d30" stroke-width="1.5"/><text x="528" y="310" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d57d30" font-weight="700" text-anchor="middle">PPO update</text><path d="M117 306 L160 306" fill="none" stroke="#078f91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarrow)"/><path d="M252 306 L299 306" fill="none" stroke="#078f91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tealarrow)"/><path d="M406 306 L459 306" fill="none" stroke="#d57d30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orangearrow)"/><path d="M529 282 L529 265 Q529 226 415 230 Q325 238 303 208" fill="none" stroke="#bb518a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pinkarrow)"/><text x="407" y="247" font-family="Ari