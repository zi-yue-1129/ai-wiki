<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">MAPPO: shared policy and centralised training</title><desc id="dsc">Two local observations use the same policy parameters; a centralised value estimate supports advantages and a clipped PPO update feeding back into shared parameters. Example advantages are illustrative, not measured.</desc><defs><marker id="bluearrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3269ad"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#078f91"/></marker><marker id="pinkarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bb518a"/></marker><marker id="orangearrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d57d30"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.pulse{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbff" stroke="none" stroke-width="0"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#dbe5ef" stroke-width="1"/><text x="26" y="38" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#23354a" font-weight="700" text-anchor="start">MAPPO / Shared policy update</text><rect x="501" y="17" width="111" height="27" rx="14" fill="#eff4f8" stroke="none" stroke-width="0"/><text x="556" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#63788e" font-weight="700" text-anchor="middle">CTDE</text><rect x="24" y="65" width="592" height="179" rx="14" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.3"/><text x="43" y="88" font-family="Arial,Helvetica,sans-serif