<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">BPR: pairwise ranking-gradient update</title><desc id="desc">A fixed user factor and one sampled observed-unobserved item pair are shown over four zero-regularization BPR-MF item-factor gradient-ascent updates. The observed score rises, the unobserved score falls, and the pairwise logistic loss decreases.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eff5fa"/></linearGradient><marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#138d88"/></marker><marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#df8251"/></marker></defs><style>text{font-family:Inter,Arial,ui-sans-serif,sans-serif;fill:#264459}.head{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#657e90}.mini{font-size:13px;fill:#617b8c}.panel{fill:#fff;stroke:#dbe6ed;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="800" height="420" rx="20" fill="url(#paper)"/><text x="25" y="36" class="head">RECOMMENDER SYSTEMS · WORKED EXAMPLE</text><rect class="panel" x="20" y="63" width="365" height="315" rx="18"/><rect class="panel" x="401" y="63" width="379" height="315" rx="18"/><text x="44" y="95" class="head">PAIRWISE ITEM SCORES</text><circle cx="55" cy="124" r="5" fill="#138d88"/><text x="69" y="128" class="mini">Observed i</text><circle cx="222" cy="124" r="5" fill="#df8251"/><text x="235" y="128" class="mini">Unobserved j</text><text x="44" y="162" class="mini">Positive item</text><rect x="44" y="176" width="292" height="24" rx="12" fill="#ecf2f5"/><rect x="44" y="176" width="74.38" height="24" rx="12" fill="#138d88"><animate attributeName="width" values="74.38;115.43;148.85;175.61;197.23;175.61;148.85;115.43;74.38" keyT