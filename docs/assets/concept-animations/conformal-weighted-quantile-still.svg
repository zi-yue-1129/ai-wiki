<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Weighted covariate shift calibration: test-point infinity atom</title><desc id="desc">Five illustrative calibration scores plus the test point atom at positive infinity. Weight vectors change from 1,1,1,1,1 and test 1, to 4,3,1,1,1 and test 1. The first cumulative mass reaching 70 percent moves from score 0.58 to 0.31.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.head{font-size:14px;font-weight:750;letter-spacing:1.05px}.muted{font-size:12px;fill:#637d90}.lab{font-size:15px;font-weight:700}.small{font-size:12px;font-weight:650}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style><rect width="640" height="360" rx="18" fill="#f4f8fc"/><text x="28" y="35" class="head">WEIGHTED CALIBRATION</text><text x="28" y="58" class="muted">0.70 cumulative mass · test weight at +∞</text><rect x="28" y="77" width="584" height="236" rx="13" fill="white" stroke="#dae5ec"/><path d="M78 256H575" stroke="#9bb3c3" stroke-width="1.6"/><path d="M78 128H575" stroke="#e9f0f5" stroke-dasharray="4 5"/><text x="48" y="134" class="muted">w</text><rect x="99" y="144" width="34" height="112" rx="5" fill="#267da6" opacity="0.88"></rect><text x="116" y="278" text-anchor="middle" class="small">.10</text><rect x="168" y="172" width="34" height="84" rx="5" fill="#267da6" opacity="0.88"></rect><text x="185" y="278" text-anchor="middle" class="small">.22</text><rect x="237" y="228" width="34" height="28" rx="5" fill="#267da6" opacity="0.88"></rect><text x="254" y="278" text-anchor="middle" class="small">.31</text><rect x="306" y="228" width="34" height="28" rx="5" fill="#267da6" opacity="0.88"></rect><text x="323" y="278" text-anchor="middle" class="small">.44</text><rect x="375" y="228" width="34" height="28" rx="5" fill="#267da6" opacity="0.88"></rect><text x="392" y="278" text-anchor="middle" class="small">.58</text><rect x="497" y="228" width="34" height="28" rx="5" fill="#e29353" opacity="0.85"></rect><text x="514" y="278" text-anchor="middle" class="small">∞</text><text x="116" y="112" text-anchor="middle" class="muted">calibration scores</text><text x="514" y="112" text-anchor="middle" class="muted">test ∞</text><path d="M392 292v-6" stroke="#138978" stroke-width="1.5" opacity=".45"/><g transform="translate(254 0)"><path d="M-10 294L10 294L0 281Z" fill="#138978"/><text x="0" y="303" text-anchor="middle" class="small" fill="#138978">q</text></g><rect x="428" y="318" width="13" height="9" rx="2" fill="#e29353"/><text x="449" y="327" class="muted">+∞ test mass</text><text x="46" y="329" class="muted">weights: [1,1,1,1,1] → [4,3,1,1,1]</text></svg>