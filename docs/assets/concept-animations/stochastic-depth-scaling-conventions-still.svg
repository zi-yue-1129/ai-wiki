<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Stochastic depth: original and inverted scaling</title><desc id="desc">A single residual block has shortcut s equals two, branch f equals four, and survival probability 0.5. The two conventions use different train and evaluation branch scales while each matches its own expected preactivation.</desc><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f7fafc}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7fafc"/><text x="26" y="34" font-size="18" fill="#18344c" font-weight="700" text-anchor="start">STOCHASTIC DEPTH</text><text x="614" y="34" font-size="12" fill="#088a82" font-weight="700" text-anchor="end">s = 2  ·  f = 4  ·  p = 0.5</text><rect x="23" y="56" width="290" height="283" rx="12" fill="#fff" stroke="#cbd8e2"/><rect x="325" y="56" width="292" height="283" rx="12" fill="#fff" stroke="#cbd8e2"/><text x="45" y="86" font-size="15" fill="#18344c" font-weight="700" text-anchor="start">ORIGINAL</text><text x="347" y="86" font-size="15" fill="#18344c" font-weight="700" text-anchor="start">INVERTED</text><text x="45" y="108" font-size="12" fill="#506578" font-weight="400" text-anchor="start">train: s + b·f</text><text x="347" y="108" font-size="12" fill="#506578" font-weight="400" text-anchor="start">train: s + b·f/p</text><text x="45" y="130" font-size="12" fill="#088a82" font-weight="650" text-anchor="start">eval: s + p·f = 4</text><text x="347" y="130" font-size="12" fill="#088a82" font-weight="650" text-anchor="start">eval: s + f = 6</text><rect x="43" y="143" width="240" height="28" rx="14" fill="#e9eff3"/><rect x="345" y="143" width="240" height="28" rx="14" fill="#e9eff3"/><text x="163" y="162" font-size="12" fill="#18344c" font-weight="700" text-anchor="middle">KEEP  /  SKIP</text><text x="465" y="162" font-size="12" fill="#18344c" font-weight="700" text-anchor="middle">KEEP  /  SKIP</text><circle cx="72" cy="157" r="9" fill="#ed8759"></circle><path d="M64 292h204" stroke="#cbd8e2" stroke-width="2"/><path d="M64 250.4h204" stroke="#088a82" stroke-width="2" stroke-dasharray="5 4"/><rect x="74" y="271.2" width="38" height="20.8" rx="3" fill="#a9bccb"/><rect x="74" y="229.6" width="38" height="41.6" rx="3" fill="#ed8759"></rect><rect x="172" y="250.4" width="38" height="41.6" rx="3" fill="#088a82" opacity="0.75"/><text x="92" y="309" font-size="11" fill="#18344c" font-weight="700" text-anchor="middle">TRAIN</text><text x="191" y="309" font-size="11" fill="#18344c" font-weight="700" text-anchor="middle">EVAL</text><text x="92" y="329" font-size="10" fill="#506578" font-weight="400" text-anchor="middle">sample</text><text x="191" y="329" font-size="10" fill="#506578" font-weight="400" text-anchor="middle">mean</text><circle cx="374" cy="157" r="9" fill="#ed8759"></circle><path d="M366 292h204" stroke="#cbd8e2" stroke-width="2"/><path d="M366 229.6h204" stroke="#088a82" stroke-width="2" stroke-dasharray="5 4"/><rect x="376" y="271.2" width="38" height="20.8" rx="3" fill="#a9bccb"/><rect x="376" y="188" width="38" height="83.2" rx="3" fill="#ed8759"></rect><rect x="474" y="229.6" width="38" height="62.400000000000006" rx="3" fill="#088a82" opacity="0.75"/><text x="394" y="309" font-size="11" fill="#18344c" font-weight="700" text-anchor="middle">TRAIN</text><text x="493" y="309" font-size="11" fill="#18344c" font-weight="700" text-anchor="middle">EVAL</text><text x="394" y="329" font-size="10" fill="#506578" font-weight="400" text-anchor="middle">sample</text><text x="493" y="329" font-size="10" fill="#506578" font-weight="400" text-anchor="middle">mean</text></svg>