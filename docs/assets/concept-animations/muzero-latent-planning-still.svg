<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title>MuZero representation, latent dynamics, prediction and MCTS</title><desc>Four stages show an observation encoded into a latent state, imagined transitions producing rewards, policy and value predictions, and search selecting a real action. The diagram is schematic, not a measured trajectory.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="0"/><rect x="18" y="84" width="604" height="256" rx="15" fill="#fff" stroke="#cbd8e4" stroke-width="1"/><text x="320" y="109" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#213449">Learned latent model</text><rect x="22" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="93.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Represent</text><rect x="177" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="248.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Dynamics</text><rect x="332" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="403.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Predict</text><rect x="487" y="24" width="143" height="33" rx="8" fill="#087e83" stroke="#087e83" stroke-width="1"/><text x="558.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#fff">Search</text><rect x="42" y="143" width="165" height="118" rx="10" fill="#edf4fa" stroke="#cbd8e4" stroke-width="1.5"/><text x="125" y="167" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#213449">MCTS</text><circle cx="124" cy="193" r="14" fill="#e5f4f1" stroke="#087e83" stroke-width="2"/><circle cx="91" cy="236" r="11" fill="#fff" stroke="#4169a7" stroke-width="2"/><circle cx="156" cy="236" r="11" fill="#fff" stroke="#4169a7" stroke-width="2"/><path d="M116 205 L95 225" fill="none" stroke="#4169a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 205 L151 225" fill="none" stroke="#4169a7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="74" y="223" width="35" height="28" rx="6" fill="none" stroke="#087e83" stroke-width="3"/><path d="M209 201 L275 201" fill="none" stroke="#087e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 197 L275 201 L268 205" fill="none" stroke="#087e83" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="283" y="164" width="284" height="76" rx="11" fill="#e5f4f1" stroke="#087e83" stroke-width="2"/><text x="425" y="189" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#213449">Select real action</text><text x="425" y="217" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">from root visit counts</text><text x="321" y="293" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Search branches through imagined states</text><text x="321" y="316" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#61738a">Rewards, policies, values guide planning</text></svg>