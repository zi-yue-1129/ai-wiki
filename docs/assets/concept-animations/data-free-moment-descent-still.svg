<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Synthetic moment descent</title><desc>Two synthetic activations approach frozen target moments. A completed-step marker on a log loss chart descends by two log2 units per gradient step; the loss bar shows the last completed iterate.</desc><rect width="640" height="360" fill="#fff"/><text x="320" y="27" font-size="21" text-anchor="middle" fill="#243447">Match frozen feature statistics</text><rect x="18" y="42" width="604" height="161" rx="7" fill="#f2f5f8"/><text x="30" y="62" font-size="14" text-anchor="start" fill="#243447">Target moments</text><text x="30" y="127" font-size="14" text-anchor="start" fill="#243447">Synthetic</text><text x="610" y="62" font-size="14" text-anchor="end" fill="#08766f">Mean 2 · SD 1</text><line x1="80" y1="71" x2="80" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="80" y="194" font-size="12" text-anchor="middle" fill="#243447">-2</text><line x1="160" y1="71" x2="160" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="160" y="194" font-size="12" text-anchor="middle" fill="#243447">-1</text><line x1="240" y1="71" x2="240" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="240" y="194" font-size="12" text-anchor="middle" fill="#243447">0</text><line x1="320" y1="71" x2="320" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="320" y="194" font-size="12" text-anchor="middle" fill="#243447">1</text><line x1="400" y1="71" x2="400" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="400" y="194" font-size="12" text-anchor="middle" fill="#243447">2</text><line x1="480" y1="71" x2="480" y2="176" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 4"/><text x="480" y="194" font-size="12" text-anchor="middle" fill="#243447">3</text><line x1="560" y1="71" x2="560" y2="176" stroke="#849