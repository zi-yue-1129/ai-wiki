<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>FP8 magnitude windows with scaling</title><desc>The positive representable input magnitude intervals of E5M2 and E4M3 slide left when tensor scaling grows from one to sixteen. Fixed low and high input samples illustrate underflow and overflow tradeoffs.</desc><rect width="640" height="360" rx="18" fill="#0B1426"/><rect x="12" y="12" width="616" height="336" rx="14" fill="#101E34" stroke="#304361"/><text x="34" y="39" fill="#E9F1FC" font-family="system-ui,Arial,sans-serif" font-size="22" text-anchor="start">FP8 SCALING</text><text x="36" y="62" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="12" text-anchor="start">input magnitude before cast</text><text x="407" y="60" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="12" text-anchor="start">Scale s</text><line x1="477" y1="56" x2="565" y2="56" stroke="#304361" stroke-width="5" /><text x="472" y="75" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="start">1</text><text x="570" y="75" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="end">16</text><circle cx="477" cy="56" r="7" fill="#FFBD6A" stroke="#0B1426" stroke-width="2"><animate attributeName="cx" values="477;565;477" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></circle><line x1="110" y1="91" x2="110" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="110" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^-6</text><line x1="150" y1="91" x2="150" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="190" y1="91" x2="190" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="190" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^-4</text><line x1="230" y1="91" x2="230" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="270" y1="91" x2="270" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="270" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^-2</text><line x1="310" y1="91" x2="310" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="350" y1="91" x2="350" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="350" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^0</text><line x1="390" y1="91" x2="390" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="430" y1="91" x2="430" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="430" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^2</text><line x1="470" y1="91" x2="470" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="510" y1="91" x2="510" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="510" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^4</text><line x1="550" y1="91" x2="550" y2="295" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="550" y="316" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="10" text-anchor="middle">10^5</text><line x1="90" y1="295" x2="570" y2="295" stroke="#ACBDD2" stroke-width="1.2" /><text x="328" y="339" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="12" text-anchor="middle">log10 |input|</text><text x="92" y="111" fill="#A993F9" font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="start">E5M2</text><rect x="157.34" y="122" width="383" height="29" rx="7" fill="#A993F9" fill-opacity="0.25" stroke="#A993F9" stroke-width="2"><animate attributeName="x" values="157.34;109.18;157.34" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><text x="92" y="186" fill="#45DDC4" font-family="system-ui,Arial,sans-serif" font-size="14" text-anchor="start">E4M3</text><rect x="241.63" y="197" width="214.42" height="29" rx="7" fill="#45DDC4" fill-opacity="0.25" stroke="#45DDC4" stroke-width="2"><animate attributeName="x" values="241.63;193.47;241.63" keyTimes="0;0.5;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><line x1="217.96" y1="112" x2="217.96" y2="280" stroke="#45DDC4" stroke-width="1.4" stroke-dasharray="3 6"/><circle cx="217.96" cy="280" r="6" fill="#45DDC4"/><text x="217.96" y="270" fill="#45DDC4" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">low</text><line x1="470" y1="112" x2="470" y2="280" stroke="#FFBD6A" stroke-width="1.4" stroke-dasharray="3 6"/><circle cx="470" cy="280" r="6" fill="#FFBD6A"/><text x="470" y="270" fill="#FFBD6A" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">high</text></svg>