<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Deep ensembles: agreement, spread, and probability averaging</title><desc id="desc">Three hypothetical classifiers predict a class probability for two inputs. For low disagreement the members give 0.72, 0.76, 0.80, mean 0.76. For high disagreement the members give 0.20, 0.50, 0.80, mean 0.50. Animated dots travel from the member source to their probabilities; each mean and member range appear after aggregation. Model outputs are illustrative, not empirical results. Disagreement is not guaranteed epistemic uncertainty.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9fcfe"/><stop offset="1" stop-color="#ecf4f8"/></linearGradient></defs><style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#24445a}.muted{fill:#677f91}.heading{font-size:18px;font-weight:750}.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.25px}.small{font-size:12px}.big{font-size:22px;font-weight:750}.number{font-size:15px;font-weight:700}.panel{fill:#fff;stroke:#d9e5ed;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect width="720" height="400" fill="url(#bg)" rx="20"/><text x="30" y="36" class="eyebrow muted" >DEEP ENSEMBLES</text><text x="30" y="66" class="heading" >Member probability → ensemble mean</text><rect x="30" y="88" width="660" height="129" rx="5" fill="white" stroke="#d9e5ed"/><text x="46" y="115" class="number" >Low disagreement</text><text x="46" y="136" class="small muted" >3 members</text><path d="M172 169L605 169" stroke="#b3c8d8" stroke-width="3" fill="none" /><path d="M172 163L172 175" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="172" y="197" class="small muted" text-anchor="middle">0.0</text><path d="M280.25 163L280.25 175" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><path d="M388.5 163L388.5 175" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="388.5" y="197" class="small muted" text-anchor="middle">0.5</text><path d="M496.75 163L496.75 175" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><path d="M605 163L605 175" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="605" y="197" class="small muted" text-anchor="middle">1.0</text><rect x="483.76" y="138" width="34.6400000000001" height="15" rx="5" fill="#dbe6fa" opacity="0"><animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.40;0.56;0.92;1" dur="8s" repeatCount="indefinite"/></rect><circle cx="150" cy="156" r="7.5" fill="#238ca3" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;483.76;483.76;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="150" cy="148" r="7.5" fill="#db9a3f" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;501.08;501.08;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="150" cy="140" r="7.5" fill="#9c73cb" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;518.40;518.40;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><path d="M501.08 126L501.08 167" stroke="#284b72" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.60;0.9;1" dur="8s" repeatCount="indefinite"/></path><text x="623" y="112" class="number" text-anchor="middle">μ=0.76</text><rect x="30" y="231" width="660" height="129" rx="5" fill="white" stroke="#d9e5ed"/><text x="46" y="258" class="number" >High disagreement</text><text x="46" y="279" class="small muted" >3 members</text><path d="M172 312L605 312" stroke="#b3c8d8" stroke-width="3" fill="none" /><path d="M172 306L172 318" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="172" y="340" class="small muted" text-anchor="middle">0.0</text><path d="M280.25 306L280.25 318" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><path d="M388.5 306L388.5 318" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="388.5" y="340" class="small muted" text-anchor="middle">0.5</text><path d="M496.75 306L496.75 318" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><path d="M605 306L605 318" stroke="#b3c8d8" stroke-width="1.4" fill="none" /><text x="605" y="340" class="small muted" text-anchor="middle">1.0</text><rect x="258.6" y="281" width="259.80000000000007" height="15" rx="5" fill="#dbe6fa" opacity="0"><animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.40;0.56;0.92;1" dur="8s" repeatCount="indefinite"/></rect><circle cx="150" cy="299" r="7.5" fill="#238ca3" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;258.60;258.60;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="150" cy="291" r="7.5" fill="#db9a3f" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;388.50;388.50;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><circle cx="150" cy="283" r="7.5" fill="#9c73cb" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="150;518.40;518.40;150" keyTimes="0;0.42;0.90;1" dur="8s" repeatCount="indefinite"/></circle><path d="M388.5 269L388.5 310" stroke="#284b72" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.60;0.9;1" dur="8s" repeatCount="indefinite"/></path><text x="623" y="255" class="number" text-anchor="middle">μ=0.50</text><rect x="31" y="371" width="660" height="19" rx="5" fill="#e1edf5" /><text x="46" y="385" class="small muted" >Same averaging rule · Different member spread · Illustrative outputs</text></svg>