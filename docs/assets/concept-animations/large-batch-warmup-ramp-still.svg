<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Linear warm-up versus immediate large-batch learning rate</title><desc id="desc">For a fourfold batch scaling, the immediate rate stays at 0.4, while warm-up gradually increases from 0.1 to 0.4 by epoch five. The resulting step magnitudes for a fixed gradient increase together with learning rate.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eef5fa"/></linearGradient><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1L7 4 0 7" stroke="#0b948e" stroke-width="1.8" fill="none"/></marker></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#294659}.eyebrow{font-size:12px;letter-spacing:1.1px;font-weight:700;fill:#668397}.panel{fill:#fff;stroke:#d5e2eb;stroke-width:1.4}</style><rect width="640" height="360" rx="16" fill="url(#paper)"/><text class="eyebrow" x="28" y="36">LINEAR WARM-UP · 4× BATCH</text><rect class="panel" x="28" y="66" width="406" height="269" rx="14"/><rect class="panel" x="447" y="66" width="165" height="269" rx="14"/>
    <text x="45" y="91" font-size="12" fill="#668397">Learning rate by epoch</text><line x1="68" y1="278" x2="417" y2="278" stroke="#9aafbf" stroke-width="1.5"/><line x1="68" y1="101" x2="68" y2="278" stroke="#9aafbf" stroke-width="1.5"/><line x1="68" y1="118" x2="416" y2="118" stroke="#dce7ef" stroke-dasharray="3 6"/>
    <line x1="68" y1="136" x2="416" y2="136" stroke="#dbe7ed" stroke-dasharray="3 6"/><line x1="285.5" y1="115" x2="285.5" y2="278" stroke="#dbe7ed" stroke-dasharray="4 5"/>
    <text x="43" y="142" font-size="12">0.4</text><text x="43" y="248" font-size="12">0.1</text><text x="64" y="299" font-size="12">0</text><text x="278" y="299" font-size="12">5</text><text x="410" y="299" font-size="12">8</text><text x="197" y="319" font-size="12" fill="#668397">epoch</text>
    <path d="M68 136H416" fill="none" stroke="#e5a15b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M68 242.44 L285.5 135.78 L416 135.78" fill="none" stroke="#0b948e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="457" y="96" font-size="12" fill="#668397">Fixed gradient</text><text x="460" y="137" font-size="14" font-weight="600">Instant 4×</text><rect x="460" y="154" width="134" height="12" fill="#eff3f6" rx="6"/><rect x="460" y="154" width="134" height="12" fill="#e5a15b" rx="6"/>
    <text x="460" y="211" font-size="14" font-weight="600">Warm-up</text><rect x="460" y="229" width="134" height="12" fill="#eff3f6" rx="6"/><line x1="176.75" y1="110" x2="176.75" y2="278" stroke="#718a9b" stroke-width="1.3" stroke-dasharray="4 6"></line><circle cx="176.75" cy="136" r="6" fill="#e5a15b" stroke="#fff" stroke-width="2"></circle><circle cx="176.75" cy="189.11" r="7" fill="#0b948e" stroke="#fff" stroke-width="2"></circle><rect x="460" y="229" width="83.75" height="12" fill="#0b948e" rx="6"></rect><text x="460" y="283" font-size="12" fill="#668397">Step ∝ learning rate</text><text x="460" y="306" font-size="12" fill="#668397">g held constant</text></svg>