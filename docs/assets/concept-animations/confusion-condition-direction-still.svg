<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Conditioning directions in a confusion matrix</title><desc id="desc">Using the same 100 hypothetical classifications, compare normalization by actual class (recall and specificity) against normalization by predicted class (precision and negative predictive value). Every animated stage highlights one denominator and shows its two fractions; the fallback compares recall and precision.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif}.moving{pointer-events:none}</style><rect width="640" height="360" rx="20" fill="#0b1424"/><rect x="12" y="12" width="616" height="336" rx="16" fill="#101c2d" stroke="#273c50"/><text x="30" y="40" font-size="15" font-weight="750" fill="#edf6fc" text-anchor="start" letter-spacing=".5">SAME COUNTS · DIFFERENT DENOMINATORS</text><text x="30" y="64" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >100 synthetic cases</text><text x="84" y="89" font-size="11" font-weight="650" fill="#a8c2d8" text-anchor="start" >PRED +</text><text x="178" y="89" font-size="11" font-weight="650" fill="#a8c2d8" text-anchor="start" >PRED −</text><text x="25" y="137" font-size="12" font-weight="750" fill="#b5cddd" text-anchor="start" >T +</text><text x="25" y="201" font-size="12" font-weight="750" fill="#b5cddd" text-anchor="start" >T −</text><rect x="69" y="95" width="199" height="141" rx="13" fill="#15273c" stroke="#3a5269"/><rect x="79" y="103" width="88" height="58" rx="11" fill="#1b3047"/><text x="123" y="127" font-size="12" font-weight="700" fill="#45cbb6" text-anchor="middle" >TP</text><text x="123" y="150" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >40</text><rect x="173" y="103" width="88" height="58" rx="11" fill="#1b3047"/><text x="217" y="127" font-size="12" font-weight="700" fill="#faaf60" text-anchor="middle" >FN</text><text x="217" y="150" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >20</text><rect x="79" y="167" width="88" height="58" rx="11" fill="#1b3047"/><text x="123" y="191" font-size="12" font-weight="700" fill="#faaf60" text-anchor="middle" >FP</text><text x="123" y="214" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >10</text><rect x="173" y="167" width="88" height="58" rx="11" fill="#1b3047"/><text x="217" y="191" font-size="12" font-weight="700" fill="#45cbb6" text-anchor="middle" >TN</text><text x="217" y="214" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >30</text><text x="30" y="264" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >Row totals: 60 / 40</text><text x="30" y="283" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >Column totals: 50 / 50</text><g><rect x="79" y="103" width="88" height="58" rx="11" fill="none" stroke="#64d8f3" stroke-width="2"/><rect x="173" y="103" width="88" height="58" rx="11" fill="none" stroke="#64d8f3" stroke-width="2"/><rect x="83" y="107" width="80" height="50" rx="8" fill="none" stroke="#d9b4fe" stroke-width="1.3"/><rect x="83" y="171" width="80" height="50" rx="8" fill="none" stroke="#d9b4fe" stroke-width="1.3"/><rect x="317" y="91" width="281" height="188" rx="15" fill="#101f32" stroke="#37516a" stroke-width="1"/><text x="334" y="114" font-size="12" font-weight="700" fill="#9ddded" text-anchor="start" >ROW · TRUE +</text><text x="583" y="114" font-size="15" font-weight="700" fill="#fcdb9c" text-anchor="end" >÷ 60</text><rect x="334" y="124" width="250" height="32" rx="7" fill="#0c1525"/><rect x="334" y="124" width="166.67" height="32" rx="7" fill="#45cbb6"/><rect x="493.67" y="124" width="7" height="32" fill="#45cbb6"/><rect x="500.67" y="124" width="83.33" height="32" fill="#faaf60"/><text x="417" y="146" font-size="13" font-weight="750" fill="#092332" text-anchor="middle" >66.7%</text><text x="542" y="146" font-size="13" font-weight="750" fill="#092332" text-anchor="middle" >33.3%</text><text x="334" y="175" font-size="13" font-weight="650" fill="#cbdff1" text-anchor="start" >Recall</text><text x="583" y="175" font-size="16" font-weight="750" fill="#e9fff6" text-anchor="end" >0.667</text><line x1="334" y1="188" x2="583" y2="188" stroke="#37516a"/><text x="334" y="206" font-size="12" font-weight="700" fill="#d9b4fe" text-anchor="start" >COLUMN · PRED +</text><text x="583" y="206" font-size="15" font-weight="700" fill="#fcdb9c" text-anchor="end" >÷ 50</text><rect x="334" y="214" width="250" height="31" rx="7" fill="#0c1525"/><rect x="334" y="214" width="200" height="31" rx="7" fill="#45cbb6"/><rect x="527" y="214" width="7" height="31" fill="#45cbb6"/><rect x="534" y="214" width="50" height="31" fill="#faaf60"/><text x="434" y="235" font-size="13" font-weight="750" fill="#092332" text-anchor="middle" >80%</text><text x="559" y="235" font-size="13" font-weight="750" fill="#092332" text-anchor="middle" >20%</text><text x="334" y="265" font-size="13" font-weight="650" fill="#cbdff1" text-anchor="start" >Precision</text><text x="583" y="265" font-size="16" font-weight="750" fill="#e9fff6" text-anchor="end" >0.800</text></g><text x="31" y="323" font-size="10" font-weight="650" fill="#90bace" text-anchor="start" >CONDITION ON TRUE</text><text x="318" y="323" font-size="10" font-weight="650" fill="#90bace" text-anchor="start" >CONDITION ON PRED</text><rect x="29" y="332" width="582" height="3" rx="1.5" fill="#2a455e"/><rect x="29" y="332" width="145.5" height="3" rx="1.5" fill="#61d4c4"/></svg>