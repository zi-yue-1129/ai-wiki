<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Conditioning directions in a confusion matrix</title><desc id="desc">Using the same 100 hypothetical classifications, compare normalization by actual class (recall and specificity) against normalization by predicted class (precision and negative predictive value). Every animated stage highlights one denominator and shows its two fractions; the fallback depicts recall.</desc><style>text{font-family:Inter,Arial,Helvetica,sans-serif}.moving{pointer-events:none}</style><rect width="640" height="360" rx="20" fill="#0b1424"/><rect x="12" y="12" width="616" height="336" rx="16" fill="#101c2d" stroke="#273c50"/><text x="30" y="40" font-size="15" font-weight="750" fill="#edf6fc" text-anchor="start" letter-spacing=".5">SAME COUNTS · DIFFERENT DENOMINATORS</text><text x="30" y="64" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >100 synthetic cases</text><text x="84" y="89" font-size="11" font-weight="650" fill="#a8c2d8" text-anchor="start" >PRED +</text><text x="178" y="89" font-size="11" font-weight="650" fill="#a8c2d8" text-anchor="start" >PRED −</text><text x="25" y="137" font-size="12" font-weight="750" fill="#b5cddd" text-anchor="start" >T +</text><text x="25" y="201" font-size="12" font-weight="750" fill="#b5cddd" text-anchor="start" >T −</text><rect x="69" y="95" width="199" height="141" rx="13" fill="#15273c" stroke="#3a5269"/><rect x="79" y="103" width="88" height="58" rx="11" fill="#1b3047"/><text x="123" y="127" font-size="12" font-weight="700" fill="#45cbb6" text-anchor="middle" >TP</text><text x="123" y="150" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >40</text><rect x="173" y="103" width="88" height="58" rx="11" fill="#1b3047"/><text x="217" y="127" font-size="12" font-weight="700" fill="#faaf60" text-anchor="middle" >FN</text><text x="217" y="150" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >20</text><rect x="79" y="167" width="88" height="58" rx="11" fill="#1b3047"/><text x="123" y="191" font-size="12" font-weight="700" fill="#faaf60" text-anchor="middle" >FP</text><text x="123" y="214" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >10</text><rect x="173" y="167" width="88" height="58" rx="11" fill="#1b3047"/><text x="217" y="191" font-size="12" font-weight="700" fill="#45cbb6" text-anchor="middle" >TN</text><text x="217" y="214" font-size="19" font-weight="750" fill="#f4f8fc" text-anchor="middle" >30</text><text x="30" y="264" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >Row totals: 60 / 40</text><text x="30" y="283" font-size="11" font-weight="500" fill="#8ea6ba" text-anchor="start" >Column totals: 50 / 50</text><g class="moving" opacity="1"><rect x="79" y="103" width="88" height="58" rx="11" fill="none" stroke="#64d8f3" stroke-width="2"/><rect x="173" y="103" width="88" height="58" rx="11" fill="none" stroke="#64d8f3" stroke-width="2"/><rect x="317" y="91" width="281" height="188" rx="15" fill="#101f32" stroke="#37516a" stroke-width="1"/><text x="334" y="118" font-size="11" font-weight="700" fill="#8ac2dd" text-anchor="start" letter-spacing="1.4">ROW</text><text x="581" y="118" font-size="12" font-weight="700" fill="#edf8ff" text-anchor="end" >TRUE +</text><text x="334" y="146" font-size="24" font-weight="700" fill="#fcdb9c" text-anchor="start" >÷ 60</text><text x="583" y="145" font-size="13" font-weight="600" fill="#a8bcce" text-anchor="end" >TP + FN</text><rect x="334" y="161" width="250" height="48" rx="10" fill="#0c1525"/><rect x="334.00" y="161" width="166.67" height="48" rx="10" fill="#45cbb6"/><rect x="490.67" y="161" width="10" height="48" fill="#45cbb6"/><text x="417.33" y="189" font-size="16" font-weight="750" fill="#092332" text-anchor="middle" >66.7%</text><text x="417.33" y="231" font-size="12" font-weight="600" fill="#c8d9e7" text-anchor="middle" >TP 40</text><rect x="500.67" y="161" width="83.33" height="48" rx="0" fill="#faaf60"/><text x="542.33" y="189" font-size="16" font-weight="750" fill="#092332" text-anchor="middle" >33.3%</text><text x="542.33" y="231" font-size="12" font-weight="600" fill="#c8d9e7" text-anchor="middle" >FN 20</text><line x1="584.0" y1="161" x2="584.0" y2="209" stroke="#112338" stroke-width="1"/><rect x="333" y="245" width="252" height="28" rx="8" fill="#152a3f"/><text x="345" y="263" font-size="13" font-weight="650" fill="#cbdff1" text-anchor="start" >Recall</text><text x="574" y="264" font-size="17" font-weight="750" fill="#e9fff6" text-anchor="end" >0.667</text></g><text x="31" y="323" font-size="10" font-weight="650" fill="#90bace" text-anchor="start" >CONDITION ON TRUE</text><text x="318" y="323" font-size="10" font-weight="650" fill="#90bace" text-anchor="start" >CONDITION ON PRED</text><rect x="29" y="332" width="582" height="3" rx="1.5" fill="#2a455e"/><rect x="29" y="332" width="145.5" height="3" rx="1.5" fill="#61d4c4"/></svg>