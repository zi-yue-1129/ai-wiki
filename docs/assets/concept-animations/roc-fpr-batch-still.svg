<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Population FPR versus three-negative batch variability</title><desc id="desc">Three independent negative cases each have hypothetical false positive probability one sixth. Four possible false positive counts from zero to three yield observed false positive rates of zero, one third, two thirds, and one. A binomial bar chart shows probabilities 125, 75, 15 and one out of 216 respectively. Counts one, two and three exceed a population FPR cap of one sixth; their combined probability is 91 over 216, about 42.1 percent. The cycling outcomes illustrate possibilities, not their frequency, model measurements, or sequential accumulation.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#263d4d}.head{font-size:17px;font-weight:700}.cap{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#597181}.tiny{font-size:10px;fill:#597181}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="22" y="31" class="head">Population FPR ≠ observed batch FPR</text><rect x="20" y="51" width="294" height="273" rx="12" fill="white" stroke="#d2e0e9"/><rect x="326" y="51" width="294" height="273" rx="12" fill="white" stroke="#d2e0e9"/><text x="36" y="75" class="cap">THREE NEGATIVES · ONE BATCH</text><text x="343" y="75" class="cap">BINOMIAL · n=3, p=1/6</text><text x="36" y="96" class="sub">Each case: P(false alarm) = 1/6</text><line x1="345" y1="250" x2="605" y2="250" stroke="#9bb2bf" stroke-width="1.5"/><rect x="368" y="127.4" width="38" height="122.6" rx="5" fill="#277e86" opacity=".88"/><text x="387" y="120.4" text-anchor="middle" class="tiny">57.9%</text><text x="387" y="267" text-anchor="middle" class="sub">0</text><rect x="430" y="175.7" width="38" height="74.3" rx="5" fill="#c57d52" opacity=".88"/><text x="449" y="168.7" text-anchor="middle" class="tiny">34.7%</text><text x="449" y="267" text-anchor="middle" class="sub">1</text><rect x="492" y="233.5" width="38" height="16.5" rx="5" fill="#c57d52" opacity=".88"/><text x="511" y="226.5" text-anchor="middle" class="tiny">6.9%</text><text x="511" y="267" text-anchor="middle" class="sub">2</text><rect x="554" y="247.0" width="38" height="3.0" rx="5" fill="#c57d52" opacity=".88"/><text x="573" y="240.0" text-anchor="middle" class="tiny">0.5%</text><text x="573" y="267" text-anchor="middle" class="sub">3</text><text x="343" y="285" class="sub">False alarms, K</text><rect x="342" y="298" width="262" height="23" rx="6" fill="#f9eae0"/><text x="473" y="314" font-size="12" font-weight="700" fill="#955329" text-anchor="middle">P(K ≥ 1) = 91/216 = 42.1%</text><rect x="50" y="118" width="54" height="65" rx="9" fill="#fff2e9" stroke="#c57d52" stroke-width="1.6"/><circle cx="77" cy="143" r="10" fill="#c57d52"/><text x="77" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#c57d52">FP</text><rect x="139" y="118" width="54" height="65" rx="9" fill="#e8f5f3" stroke="#277e86" stroke-width="1.6"/><circle cx="166" cy="143" r="10" fill="#277e86"/><text x="166" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#277e86">TN</text><rect x="228" y="118" width="54" height="65" rx="9" fill="#e8f5f3" stroke="#277e86" stroke-width="1.6"/><circle cx="255" cy="143" r="10" fill="#277e86"/><text x="255" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#277e86">TN</text><text x="36" y="211" class="sub">Observed FPR</text><text x="36" y="247" font-size="27" font-weight="700">1/3</text><rect x="174" y="222" width="117" height="29" rx="8" fill="#f9e9de"/><text x="233" y="241" font-size="12" font-weight="700" fill="#ad6335" text-anchor="middle">OVER CAP</text><text x="36" y="285" class="sub">Population cap = 1/6</text><rect x="427" y="174.7" width="44" height="76.3" rx="6" fill="none" stroke="#263d4d" stroke-width="2.5"/><text x="22" y="346" class="tiny">SYNTHETIC · INDEPENDENT NEGATIVES · POSSIBLE OUTCOMES, NOT FREQUENCIES</text></svg>