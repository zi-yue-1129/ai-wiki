<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dreamer imagined lambda returns computed backward</title><desc id="desc">An imagined rollout with rewards 1, 0, 2 bootstraps from V3 equal to 1.5. A backward lambda-return recursion with gamma 0.9 and lambda 0.8 yields G2 3.350, G1 2.610 and G0 3.023. Illustrative values, not experimental measurements.</desc><defs><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376cae"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8a"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34f7c"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="0" fill="#f4f7fb" stroke="#f4f7fb" /><text x="28" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#087f8a">DREAMER</text><text x="612" y="38" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#19334a">Backward λ-return</text><rect x="19" y="64" width="602" height="148" rx="12" fill="#ffffff" stroke="#d7e2ec" /><rect x="19" y="226" width="602" height="117" rx="12" fill="#ffffff" stroke="#d7e2ec" /><text x="43" y="87" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">IMAGINED LATENT ROLLOUT</text><text x="43" y="250" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">BOOTSTRAPPED TARGETS</text><circle cx="95" cy="139" r="25" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="95" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s0</text><path d="M122 139 L213 139" fill="none" stroke="#376cae" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="169" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">r1=1</text><circle cx="243" cy="139" r="25" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="243" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s1</text><path d="M270 139 L361 139" fill="none" stroke="#376cae" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="317" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">r2=0</text><circle cx="391" cy="139" r="25" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="391" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s2</text><path d="M418 139 L509 139" fill="none" stroke="#376cae" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/><text x="465" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">r3=2</text><circle cx="539" cy="139" r="25" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="539" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s3</text><rect x="442" y="171" width="148" height="29" rx="7" fill="#e7f7f2" stroke="none" /><text x="516" y="190" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#087f8a">V₃ = 1.5</text><text x="582" y="250" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#b34f7c">right → left</text><rect x="39" y="269" width="112" height="55" rx="9" fill="#f9eaf2" stroke="#e5b7ce" /><text x="95" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#63788c">G0</text><text x="95" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">3.023</text><rect x="187" y="269" width="112" height="55" rx="9" fill="#f9eaf2" stroke="#e5b7ce" /><text x="243" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#63788c">G1</text><text x="243" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">2.610</text><path d="M185 297 L153 297" fill="none" stroke="#b34f7c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-pink)"/><rect x="335" y="269" width="112" height="55" rx="9" fill="#f9eaf2" stroke="#e5b7ce" /><text x="391" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#63788c">G2</text><text x="391" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">3.350</text><path d="M333 297 L301 297" fill="none" stroke="#b34f7c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-pink)"/><rect x="483" y="269" width="112" height="55" rx="9" fill="#e7f7f2" stroke="#087f8a" /><text x="539" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#63788c">G3</text><text x="539" y="312" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">1.500</text><path d="M481 297 L449 297" fill="none" stroke="#b34f7c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-pink)"/></svg>