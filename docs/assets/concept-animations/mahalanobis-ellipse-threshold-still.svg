<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Mahalanobis squared-distance decision in feature space</title><desc id="d">Two Gaussian class centres share covariance diag(4,1). An illustrative feature moves from (2,1), where minimum squared Mahalanobis distance is 2, to (0,2), where it is 4, crossing a threshold of 3. Dashed ellipses are distance contours and not empirical feature densities.</desc><rect width="640" height="360" fill="#0b1526"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" fill="#e7f1fc" font-size="22" font-weight="750" text-anchor="start" >Mahalanobis</text><text x="186" y="37" fill="#9fb7cc" font-size="13" font-weight="500" text-anchor="start" >Shared-covariance distance</text><rect x="24" y="60" width="366" height="227" rx="15" fill="#15263d" /><rect x="401" y="60" width="215" height="227" rx="15" fill="#15263d" /><text x="44" y="86" fill="#9fb7cc" font-size="11" font-weight="700" text-anchor="start" >FEATURE SPACE</text><text x="417" y="86" fill="#9fb7cc" font-size="10" font-weight="700" text-anchor="start" >MIN SQUARED DISTANCE</text><line x1="54" y1="218" x2="355" y2="218" stroke="#405a74" stroke-width="1.5" /><line x1="129" y1="94" x2="129" y2="266" stroke="#405a74" stroke-width="1.5" /><ellipse cx="129" cy="218" rx="103.923" ry="51.962" stroke="#af9df3" stroke-width="1.8" fill="none" stroke-dasharray="6 4"/><circle cx="129" cy="218" r="5" fill="#af9df3" /><text x="129" y="237" fill="#e7f1fc" font-size="13" font-weight="650" text-anchor="middle" >μ₁</text><ellipse cx="249" cy="218" rx="103.923" ry="51.962" stroke="#af9df3" stroke-width="1.8" fill="none" stroke-dasharray="6 4"/><circle cx="249" cy="218" r="5" fill="#af9df3" /><text x="249" y="237" fill="#e7f1fc" font-size="13" font-weight="650" text-anchor="middle" >μ₂</text><text x="246" y="126" fill="#9fb7cc" font-size="11" font-weight="500" text-anchor="start" >Σ = diag(4, 1)</text><text x="282" y="102" fill="#af9df3" font-size="12" font-weight="600" text-anchor="start" >D² = 3</text><line x1="189" y1="188" x2="129" y2="158" stroke="#53d6d0" stroke-width="2" stroke-dasharray="4 4" opacity=".55"/><circle cx="189" cy="188" r="6" fill="none" stroke="#9fb7cc" stroke-width="2"/><circle cx="129" cy="158" r="6" fill="none" stroke="#9fb7cc" stroke-width="2"/><circle cx="189" cy="188" r="7" fill="#53d6d0" opacity=".7"/><circle cx="129" cy="158" r="8" fill="#53d6d0" stroke="#e7f1fc" stroke-width="2"/><text x="202" y="182" fill="#e7f1fc" font-size="12" font-weight="650" text-anchor="start" >z₀</text><text x="115" y="146" fill="#e7f1fc" font-size="12" font-weight="650" text-anchor="start" >z₁</text><text x="420" y="116" fill="#e7f1fc" font-size="12" font-weight="600" text-anchor="start" >min class D²</text><line x1="425" y1="179" x2="590" y2="179" stroke="#405a74" stroke-width="2" /><text x="425" y="196" fill="#9fb7cc" font-size="11" font-weight="500" text-anchor="start" >0</text><text x="590" y="196" fill="#9fb7cc" font-size="11" font-weight="500" text-anchor="end" >6</text><line x1="507.5" y1="146" x2="507.5" y2="239" stroke="#ffca74" stroke-width="1.8" stroke-dasharray="4 4"/><text x="507.5" y="139" fill="#ffca74" font-size="12" font-weight="700" text-anchor="middle" >3</text><circle cx="480.0" cy="179" r="7" fill="#83e7aa" /><circle cx="535.0" cy="179" r="7" fill="#ff9caa" /><text x="428" y="232" fill="#83e7aa" font-size="12" font-weight="700" text-anchor="start" >2  Accept</text><text x="573" y="255" fill="#ff9caa" font-size="12" font-weight="700" text-anchor="end" >4  Reject</text><rect x="24" y="301" width="592" height="42" rx="12" fill="#111f34" /><text x="43" y="326" fill="#e7f1fc" font-size="13" font-weight="600" text-anchor="start" >μ₁ = (0,0)</text><text x="201" y="326" fill="#e7f1fc" font-size="13" font-weight="600" text-anchor="start" >μ₂ = (4,0)</text><text x="365" y="326" fill="#53d6d0" font-size="13" font-weight="600" text-anchor="start" >z: (2,1) → (0,2)</text></g></svg>