<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CLIP logit scale</title><desc id="desc">Fixed cosine scores 0.8 and 0.4 retain their order as inverse temperature rises from 1 to 10. The probabilities separate. The static view shows scale 10.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="3" fill="#f1f6fa" /><text x="24" y="31" font-size="20" text-anchor="start" fill="#233b52">CLIP logit scale</text><rect x="18" y="48" width="604" height="294" rx="3" fill="white" stroke="#d6e1e8"/><text x="205" y="77" font-size="17" text-anchor="middle" fill="#233b52">Softmax probability</text><text x="476" y="77" font-size="17" text-anchor="middle" fill="#233b52">Fixed cosine scores</text><line x1="65" y1="282" x2="344" y2="282" stroke="#e4edf2" stroke-width="2" /><text x="56" y="287" font-size="13" text-anchor="end" fill="#233b52">0.00</text><line x1="65" y1="234.5" x2="344" y2="234.5" stroke="#e4edf2" stroke-width="2" /><text x="56" y="239.5" font-size="13" text-anchor="end" fill="#233b52">0.25</text><line x1="65" y1="187" x2="344" y2="187" stroke="#e4edf2" stroke-width="2" /><text x="56" y="192" font-size="13" text-anchor="end" fill="#233b52">0.50</text><line x1="65" y1="139.5" x2="344" y2="139.5" stroke="#e4edf2" stroke-width="2" /><text x="56" y="144.5" font-size="13" text-anchor="end" fill="#233b52">0.75</text><line x1="65" y1="92" x2="344" y2="92" stroke="#e4edf2" stroke-width="2" /><text x="56" y="97" font-size="13" text-anchor="end" fill="#233b52">1.00</text><text x="65" y="302" font-size="14" text-anchor="middle" fill="#233b52">1</text><text x="96" y="302" font-size="14" text-anchor="middle" fill="#233b52">2</text><text x="189" y="302" font-size="14" text-anchor="middle" fill="#233b52">5</text><text x="344" y="302" font-size="14" text-anchor="middle" fill="#233b52">10</text><text x="205" y="325" font-size="15" text-anchor="middle" fill="#233b52">Inverse temperature</text><text x="451" y="110" font-size="16" text-anchor="start" fill="#21678d">A = 0.8</text><text x="451" y="136" font-size="16" text-anchor="start" fill="#a95516">B = 0.4</text><text x="476" y="175" font-size="16" text-anchor="middle" fill="#233b52">Probability</text><path d="M65 168.2493 L72.75 163.7327 L80.5 159.3253 L88.25 155.0443 L96 150.9048 L103.75 146.9196 L111.5 143.0989 L119.25 139.4506 L127 135.9803 L134.75 132.6914 L142.5 129.5851 L150.25 126.6608 L158 123.9165 L165.75 121.3484 L173.5 118.9517 L181.25 116.7206 L189 114.6486 L196.75 112.7284 L204.5 110.9526 L212.25 109.3134 L220 107.8028 L227.75 106.4131 L235.5 105.1363 L243.25 103.9649 L251 102.8916 L258.75 101.9092 L266.5 101.0109 L274.25 100.1904 L282 99.4415 L289.75 98.7585 L297.5 98.1361 L305.25 97.5693 L313 97.0534 L320.75 96.5841 L328.5 96.1574 L336.25 95.7697 L344 95.4174" fill="none" stroke="#21678d" stroke-width="3"/><path d="M65 205.7507 L72.75 210.2673 L80.5 214.6747 L88.25 218.9557 L96 223.0952 L103.75 227.0804 L111.5 230.9011 L119.25 234.5494 L127 238.0197 L134.75 241.3086 L142.5 244.4149 L150.25 247.3392 L158 250.0835 L165.75 252.6516 L173.5 255.0483 L181.25 257.2794 L189 259.3514 L196.75 261.2716 L204.5 263.0474 L212.25 264.6866 L220 266.1972 L227.75 267.5869 L235.5 268.8637 L243.25 270.0351 L251 271.1084 L258.75 272.0908 L266.5 272.9891 L274.25 273.8096 L282 274.5585 L289.75 275.2415 L297.5 275.8639 L305.25 276.4307 L313 276.9466 L320.75 277.4159 L328.5 277.8426 L336.25 278.2303 L344 278.5826" fill="none" stroke="#a95516" stroke-width="3"/><text x="385" y="216" font-size="16" text-anchor="start" fill="#21678d">A</text><text x="385" y="258" font-size="16" text-anchor="start" fill="#a95516">B</text><rect x="410" y="199" width="185" height="22" rx="3" fill="#e4edf2" /><rect x="410" y="241" widt