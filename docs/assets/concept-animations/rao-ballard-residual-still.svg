<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Hierarchical predictive coding residual correction</title><desc id="desc">An artificial signal remains fixed, while its top-down prediction increases and the bottom-up residual decreases. Dashed outlines in the still show initial values.</desc><rect width="640" height="360" rx="18" fill="#f7fafc"/><rect x="14" y="14" width="612" height="332" rx="16" fill="#ffffff" stroke="#e0e9f1" stroke-width="1.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="53" fill="#20374f" font-size="19" font-weight="700" >Prediction error correction</text><text x="40" y="79" fill="#657c91" font-size="11" font-weight="600" letter-spacing="1">TOP-DOWN PREDICTION  /  BOTTOM-UP ERROR</text><text x="40" y="140" fill="#243b53" font-size="16" font-weight="600" >Input</text><rect x="179" y="122" width="335" height="23" rx="11" fill="#edf2f7" /><rect x="179" y="122" width="285" height="23" rx="10" fill="#2e84ad" opacity=".88"></rect><circle cx="464" cy="133.5" r="7" fill="#ffffff" stroke="#2e84ad" stroke-width="3"></circle><text x="40" y="206" fill="#243b53" font-size="16" font-weight="600" >Prediction</text><rect x="179" y="188" width="335" height="23" rx="11" fill="#edf2f7" /><rect x="179" y="188" width="268" height="23" rx="10" fill="#6f6bd5" opacity=".88"></rect><circle cx="447" cy="199.5" r="7" fill="#ffffff" stroke="#6f6bd5" stroke-width="3"></circle><text x="40" y="272" fill="#243b53" font-size="16" font-weight="600" >Residual</text><rect x="179" y="254" width="335" height="23" rx="11" fill="#edf2f7" /><rect x="179" y="254" width="17" height="23" rx="10" fill="#e28c4b" opacity=".88"></rect><circle cx="196" cy="265.5" r="7" fill="#ffffff" stroke="#e28c4b" stroke-width="3"></circle><path d="M538 112 V280" stroke="#dce5ee" stroke-width="2" stroke-dasharray="4 5"/><text x="537" y="114" fill="#7590a4" font-size="10" font-weight="500" >1</text><text x="40" y="327" fill="#8699a9" font-size="12" font-weight="500" >0</text><text x="178" y="327" fill="#8699a9" font-size="12" font-weight="500" >0</text><text x="505" y="327" fill="#8699a9" font-size="12" font-weight="500" >1</text><text x="280" y="321" fill="#566f83" font-size="13" font-weight="600" >Initial  →  corrected</text><rect x="179" y="188" width="84" height="23" rx="11" fill="none" stroke="#554ac2" stroke-width="2" stroke-dasharray="5 3"/><rect x="179" y="254" width="201" height="23" rx="11" fill="none" stroke="#cd7835" stroke-width="2" stroke-dasharray="5 3"/></g></svg>