<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Glorot rectangular width alternation: cumulative forward variance</title><desc id="desc">For unit-gain linearised layers of widths 100, 400, 100, 400, 100, 400, 100, Glorot forward variance multiplies alternately by 0.4 and 1.6. Each pair multiplies by 0.64, so alternating widths do not restore the original variance.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203650}.meta{font-size:11px;letter-spacing:1.2px;font-weight:700;fill:#71859a}.small{font-size:12px;fill:#71859a}.bold{font-size:13px;font-weight:650}@media(prefers-reduced-motion:reduce){animateMotion,animate{visibility:hidden}}</style><rect width="640" height="360" rx="18" fill="#f6f9fd"/><text class="meta" x="30" y="34">INITIALISATION · ANALYTIC MODEL</text><text x="30" y="61" font-size="17" font-weight="700">Alternating widths do not cancel scale drift</text><text class="small" x="30" y="80">Forward variance / input variance  ·  unit-gain linear approximation</text><rect x="25" y="98" width="590" height="218" rx="15" fill="white" stroke="#d9e5ee" stroke-width="1.3"/><line x1="92" y1="277.00" x2="572" y2="277.00" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="78" y="281.0" class="small" text-anchor="end">0</text><line x1="92" y1="244.59" x2="572" y2="244.59" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="78" y="248.6" class="small" text-anchor="end">0.25</text><line x1="92" y1="212.19" x2="572" y2="212.19" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="78" y="216.2" class="small" text-anchor="end">0.5</text><line x1="92" y1="179.78" x2="572" y2="179.78" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="78" y="183.8" class="small" text-anchor="end">0.75</text><line x1="92" y1="147.37" x2="572" y2="147.37" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="78" y="151.4" class="small" text-anchor="end">1</text><line x1="92" y1="124" x2="92" y2="281" stroke="#9aacbd"/><line x1="92" y1="281" x2="576" y2="281" stroke="#9aacbd"/><text class="small" x="92.00" y="297" text-anchor="middle">0</text><text x="94.0" y="134.4" font-size="11" fill="#117c85" text-anchor="middle">1</text><text class="small" x="172.00" y="297" text-anchor="middle">1</text><text class="small" x="252.00" y="297" text-anchor="middle">2</text><text x="254.0" y="181.0" font-size="11" fill="#117c85" text-anchor="middle">0.64</text><text class="small" x="332.00" y="297" text-anchor="middle">3</text><text class="small" x="412.00" y="297" text-anchor="middle">4</text><text x="414.0" y="210.9" font-size="11" fill="#117c85" text-anchor="middle">0.41</text><text class="small" x="492.00" y="297" text-anchor="middle">5</text><text class="small" x="572.00" y="297" text-anchor="middle">6</text><text x="574.0" y="230.0" font-size="11" fill="#117c85" text-anchor="middle">0.262</text><path d="M92.00 147.37 L172.00 225.15" stroke="#d37d42" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="132.00" y="130" text-anchor="middle">×0.4</text><path d="M172.00 225.15 L252.00 194.04" stroke="#315da7" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="212.00" y="119" text-anchor="middle">×1.6</text><path d="M252.00 194.04 L332.00 243.81" stroke="#d37d42" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="292.00" y="130" text-anchor="middle">×0.4</text><path d="M332.00 243.81 L412.00 223.90" stroke="#315da7" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="372.00" y="119" text-anchor="middle">×1.6</text><path d="M412.00 223.90 L492.00 255.76" stroke="#d37d42" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="452.00" y="130" text-anchor="middle">×0.4</text><path d="M492.00 255.76 L572.00 243.02" stroke="#315da7" stroke-width="4.5" stroke-linecap="round" fill="none"/><text class="small" x="532.00" y="119" text-anchor="middle">×1.6</text><circle cx="92.00" cy="147.37" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="172.00" cy="225.15" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="252.00" cy="194.04" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="332.00" cy="243.81" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="412.00" cy="223.90" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="492.00" cy="255.76" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="572.00" cy="243.02" r="5.5" fill="white" stroke="#117c85" stroke-width="2.5"/><text class="small" x="334" y="311" text-anchor="middle">Layer depth  ·  widths 100 → 400 → 100 → 400 → 100 → 400 → 100</text><circle cx="0" cy="0" r="8" fill="#117c85" stroke="white" stroke-width="2"><animateMotion dur="12s" repeatCount="indefinite" path="M92.00 147.37 L172.00 225.15 L252.00 194.04 L332.00 243.81 L412.00 223.90 L492.00 255.76 L572.00 243.02 L572.00 243.02 L492.00 255.76 L412.00 223.90 L332.00 243.81 L252.00 194.04 L172.00 225.15 L92.00 147.37"/></circle><text class="small" x="31" y="340">q6 = (0.4 × 1.6)³ = 0.262144, not 1. Analytical, not measured.</text></svg>