<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CommNet repeated leave-one-out messages across layers</title><desc id="desc">Artificial scalar example with initial A 0.20 B 0.80 C 0.60. Under a half-own half-other-mean update, the next layer is A 0.45 B 0.60 C 0.55; B receives mean 0.50 at the second layer and updates to 0.55. The two rounds are schematic, not learned model values.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="0"/><text x="320" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1d334b">CommNet: successive communication layers</text><rect x="16" y="63" width="172" height="267" rx="14" fill="#fff" stroke="#cad9e6" stroke-width="1.5"/><text x="102" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d334b">Layer 0</text><rect x="41" y="111" width="122" height="43" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.5"/><text x="64" y="137" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2776b7">A</text><text x="128" y="137" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d334b">.20</text><rect x="41" y="169" width="122" height="43" rx="10" fill="#fff3e6" stroke="#bb721c" stroke-width="1.5"/><text x="64" y="195" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#bb721c">B</text><text x="128" y="195" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d334b">.80</text><rect x="41" y="227" width="122" height="43" rx="10" fill="#e5f5f1" stroke="#008e89" stroke-width="1.5"/><text x="64" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#008e89">C</t