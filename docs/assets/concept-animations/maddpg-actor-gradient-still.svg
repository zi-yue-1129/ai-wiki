<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">MADDPG: centralised critic, local actor gradient</title><desc id="dsc">Joint actions and observations train a central critic. Only agent 1 receives the indicated actor gradient through Q1, while at execution its actor uses local observation alone. Pulses are schematic.</desc><defs><marker id="bluearrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3269ad"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#078f91"/></marker><marker id="pinkarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bb518a"/></marker><marker id="orangearrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d57d30"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.pulse{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbff" stroke="none" stroke-width="0"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#dbe5ef" stroke-width="1"/><text x="26" y="38" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#23354a" font-weight="700" text-anchor="start">MADDPG / Actor gradient</text><rect x="501" y="17" width="111" height="27" rx="14" fill="#eff4f8" stroke="none" stroke-width="0"/><text x="556" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#63788e" font-weight="700" text-anchor="middle">CTDE</text><rect x="24" y="65" width="592" height="209" rx="14" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.3"/><text x="43" y="89" font-family="Arial,Helvetica,sans-serif" font-size="12" fil