<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Model collapse under recursive finite sampling</title><desc id="d">Toy multinomial resampling from six categories across generations, with a rare category disappearing; not a fitted model or empirical collapse rate.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f8fafc" stroke="none" /><text x="28" y="39" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="750" >RECURSIVE RESAMPLING</text><text x="612" y="39" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="end">FINITE-SAMPLE TOY EXAMPLE</text><rect x="28" y="69" width="408" height="244" rx="11" fill="#ffffff" stroke="#d8e3ec" stroke-width="1.5"/><text x="46" y="95" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" >Count</text><rect x="290" y="101" width="134" height="181" rx="7" fill="#fff3ec" stroke="none" /><text x="357" y="122" fill="#c46c58" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">RARE TAIL</text><path d="M49 274 H418" fill="none" stroke="#d8e3ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="39" y="278" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="end">0</text><path d="M49 199 H418" fill="none" stroke="#d8e3ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="39" y="203" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="end">10</text><path d="M49 124 H418" fill="none" stroke="#d8e3ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="39" y="128" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="end">20</text><rect x="66" y="184" width="23" height="90" rx="2" fill="#c4d6e3" stroke="none" /><rect x="91" y="206.5" width="19" height="67.5" rx="2" fill="#0c938c"></rect><text x="87" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">A</text><rect x="124" y="206.5" width="23" height="67.5" rx="2" fill="#c4d6e3" stroke="none" /><rect x="149" y="116.5" width="19" height="157.5" rx="2" fill="#0c938c"></rect><text x="145" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">B</text><rect x="182" y="236.5" width="23" height="37.5" rx="2" fill="#c4d6e3" stroke="none" /><rect x="207" y="273.9" width="19" height="0.1" rx="2" fill="#0c938c"></rect><text x="203" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">C</text><rect x="240" y="259" width="23" height="15" rx="2" fill="#c4d6e3" stroke="none" /><rect x="265" y="273.9" width="19" height="0.1" rx="2" fill="#0c938c"></rect><text x="261" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">D</text><rect x="298" y="266.5" width="23" height="7.5" rx="2" fill="#c4d6e3" stroke="none" /><rect x="323" y="273.9" width="19" height="0.1" rx="2" fill="#c46c58"></rect><text x="319" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">E</text><rect x="356" y="266.5" width="23" height="7.5" rx="2" fill="#c4d6e3" stroke="none" /><rect x="381" y="273.9" width="19" height="0.1" rx="2" fill="#c46c58"></rect><text x="377" y="296" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">F</text><text x="50" y="327" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="600" >Reference</text><rect x="115" y="318" width="13" height="9" rx="1" fill="#c4d6e3" stroke="none" /><text x="167" y="327" fill="#0c938c" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="600" >Current sample</text><rect x="267" y="318" width="13" height="9" rx="1" fill="#0c938c" stroke="none" /><rect x="451" y="69" width="161" height="244" rx="11" fill="#ffffff" stroke="#d8e3ec" stroke-width="1.5"/><text x="468" y="99" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="650" >Generation</text><text x="468" y="145" fill="#25374a" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="750" >G4</text><text x="468" y="174" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="650" >Tail E+F / 30</text><text x="468" y="215" fill="#c46c58" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="750" >0</text><path d="M468 239 H594" fill="none" stroke="#d8e3ec" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="468" y="260" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="600" >N = 30 draws</text><text x="468" y="281" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="500" >each generation</text><text x="28" y="346" fill="#5d7184" font-family="DejaVu Sans,Arial,sans-serif" font-size="10" font-weight="500" >Illustrative resamples; interpolation visualises steps, not continuous training.</text></svg>
