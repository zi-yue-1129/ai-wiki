<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="DDPG replay, target actor, target critic and terminal mask"><title>DDPG replay, target actor, target critic and terminal mask</title><desc>A nonterminal replay transition is bootstrapped by a target actor and target critic. Terminal transition B bypasses bootstrap and uses only its reward. All values are illustrative.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reveal{opacity:1!important}.complete{display:inline!important}}.moving{display:none}.complete{display:inline}</style><rect x="1" y="1" width="638" height="358" rx="16" fill="#f8fbff" stroke="#dce6f1" stroke-width="1.5"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#23364c" text-anchor="start">DDPG  /  Replay to Bellman target</text><rect x="25" y="67" width="210" height="235" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="42" y="92" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#61758b" text-anchor="start">REPLAY</text><rect x="38" y="107" width="182" height="67" rx="9" fill="#ecf7f7" stroke="#b5dfe0" stroke-width="1.5"/><text x="52" y="134" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#098e98" text-anchor="start">A    r=0.40</text><text x="52" y="155" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#61758b" text-anchor="start">done=0   /   s′</text><rect x="38" y="187" width="182" height="67" rx="9" fill="#fff3f6" stroke="#eed1dc" stroke-width="1.5"/><text x="52" y="214" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c94b82" text-anchor="start">B    r=1.20</text><text x="52" y="235" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#61758b" text-anchor="start">done=1   /   terminal</text><text x="45" y="282" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#61758b" text-anchor="start">Sampled minibatch</text><rect x="265" y="85" width="150" height="82" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="340" y="117" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#098e98" text-anchor="middle">Target actor</text><text x="340" y="142" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="650" fill="#23364c" text-anchor="middle">μ′(s′)</text><rect x="265" y="193" width="150" height="82" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="340" y="222" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#098e98" text-anchor="middle">Target critic</text><text x="340" y="249" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#23364c" text-anchor="middle">Q′ = 1.50</text><path d="M221 138 H263" stroke="#098e98" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M256 132 L263 138 L256 144" stroke="#098e98" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M340 168 V191" stroke="#098e98" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M335 185 L340 192 L345 185" stroke="#098e98" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M416 235 H447" stroke="#098e98" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M440 229 L447 235 L440 241" stroke="#098e98" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="448" y="85" width="167" height="214" rx="12" fill="#fff" stroke="#dce6f1" stroke-width="1.5"/><text x="462" y="113" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#61758b" text-anchor="start">TARGETS</text><text x="463" y="143" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#61758b" text-anchor="start">A  0.40 + 0.9×1.50</text><text x="463" y="177" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#098e98" text-anchor="start">y = 1.75</text><path d="M462 190 H598" stroke="#dce6f1" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="463" y="217" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" fill="#c94b82" text-anchor="start">B  no bootstrap</text><text x="463" y="254" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#c94b82" text-anchor="start">y = 1.20</text><path d="M220 221 H249 V290 H455 V264" stroke="#c94b82" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="249" cy="221" r="9" fill="#c94b82"/><text x="249" y="225" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">×</text><text x="30" y="332" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#61758b" text-anchor="start">Bootstrap is masked when done = 1</text></svg>