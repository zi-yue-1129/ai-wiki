="#168887" stroke-width="2.5" /><path d="M576 231L586 231" fill="none" stroke="#526a80" stroke-width="3" /><text x="681" y="184" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#1d3448" text-anchor="middle">Fusion</text><text x="681" y="208" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526a80" text-anchor="middle">[.40, .18, .50, 0]</text><rect x="615" y="224" width="132" height="51" rx="10" fill="#fff2e5" stroke="none"/><text x="681" y="258" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1d3448" text-anchor="middle">0.7465</text><text x="31" y="383" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526a80" text-anchor="start">Synthetic vectors and a hand-picked hidden map; no benchmark inference</text><circle r="7" fill="#3978b7"><animateMotion path="M 175 213 L 195 192 L 420 192 L 552 180 L 574 231 L 613 244" dur="10s" repeatCount="indefinite"/></circle><circle r="7" fill="#168887"><animateMotion path="M 175 213 L 177 288 L 196 298 L 423 298 L 552 292 L 574 231 L 613 244" dur="10s" repeatCount="indefinite"/></circle><circle cx="681" cy="250" r="31" fill="none" stroke="#d58a34" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;.7;0" keyTimes="0;.6;.75;.88;1" dur="10s" repeatCount="indefinite"/></circle></svg>