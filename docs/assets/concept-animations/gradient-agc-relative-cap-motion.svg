<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d"><title id="t">Adaptive gradient clipping uses weight-relative caps</title><desc id="d">As the same synthetic gradient grows from 0.4 to 3, small-weight and large-weight units are clipped to different relative thresholds, 0.5 and 2.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#dbeafe} .meta{fill:#a8b6cc;font-size:15px}.lab{font-size:17px;font-weight:600}.head{font-size:24px;font-weight:750;letter-spacing:.7px}.num{font-size:19px;font-weight:700} @media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}rect[fill="#e0a45d"]{width:426px!important}rect[fill="#6ed3ca"][y="158"]{width:71px!important}rect[fill="#8da9f9"]{width:284px!important}path[stroke="#bf9afb"]{stroke-dashoffset:0!important}rect[fill="#f1b66e"]{opacity:1!important}}</style><rect width="800" height="420" rx="22" fill="#111c2f"/><rect x="24" y="74" width="752" height="320" rx="15" fill="#17263d" stroke="#34465f"/><text class="head" x="35" y="48">ADAPTIVE GRADIENT CLIPPING</text><text x="42" y="105" class="lab">Small weights · ‖w‖ = 1</text>
