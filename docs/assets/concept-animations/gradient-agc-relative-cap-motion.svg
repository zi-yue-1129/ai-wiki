 <rect x="180" y="125" width="426" height="23" rx="7" fill="#e0a45d"><animate attributeName="width" dur="12s" values="56.800000000000004;426;56.800000000000004" keyTimes="0;.5;1" repeatCount="indefinite"/></rect>
