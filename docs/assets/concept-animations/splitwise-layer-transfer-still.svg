<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Layer-wise KV transfer</title><desc id="desc">Three layers take two units each to compute and one to transfer. Serial completion is nine units; overlapping transfer finishes at seven. Bar growth reveals completed work. Schematic, not measurements.</desc><style>text{font-family:system-ui,Arial,sans-serif;font-weight:600}@media(prefers-reduced-motion:reduce){.moving{display:none}.fallback{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" /><text x="26" y="35" font-size="20" text-anchor="start" fill="#24465b">LAYER-WISE KV TRANSFER</text><text x="26" y="60" font-size="14" text-anchor="start" fill="#5c7889">3 layers · illustrative time units</text><text x="26" y="104" font-size="18" text-anchor="start" fill="#24465b">Serial</text><text x="26" y="134" font-size="14" text-anchor="start" fill="#24465b">Compute</text><text x="26" y="166" font-size="14" text-anchor="start" fill="#24465b">Transfer</text><path d="M136 109V173" stroke="#d6e3ec"/><path d="M185 109V173" stroke="#d6e3ec"/><path d="M234 109V173" stroke="#d6e3ec"/><path d="M283 109V173" stroke="#d6e3ec"/><path d="M332 109V173" stroke="#d6e3ec"/><path d="M381 109V173" stroke="#d6e3ec"/><path d="M430 109V173" stroke="#d6e3ec"/><path d="M479 109V173" stroke="#d6e3ec"/><path d="M528 109V173" stroke="#d6e3ec"/><path d="M577 109V173" stroke="#d6e3ec"/><text x="26" y="219" font-size="18" text-anchor="start" fill="#24465b">Overlap</text><text x="26" y="249" font-size="14" text-anchor="start" fill="#24465b">Compute</text><text x="26" y="281" font-size="14" text-anchor="start" fill="#24465b">Transfer</text><path d="M136 224V288" stroke="#d6e3ec"/><path d="M185 224V288" stroke="#d6e3ec"/><path d="M234 224V288" stroke="#d6e3ec"/><path d="M283 224V288" stroke="#d6e3ec"/><path d="M332 224V288" stroke="#d6e3ec"/><path d="M381 224V288" stro