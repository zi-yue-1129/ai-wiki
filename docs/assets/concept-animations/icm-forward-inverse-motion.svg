  <animate attributeName="y2" values="229;229;190;162;151;151;229" keyTimes="0;.15;.44;.68;.84;.94;1" dur="8s" repeatCount="indefinite"/>
 </line>
 <circle cx="550" cy="229" r="9" fill="#d67737" stroke="#fff" stroke-width="3">
  <animate attributeName="cx" values="550;550;573;591;598;598;550" keyTimes="0;.15;.44;.68;.84;.94;1" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="229;229;190;162;151;151;229" keyTimes="0;.15;.44;.68;.84;.94;1" dur="8s" repeatCount="indefinite"/>
 </circle>
</g>
<text x="516" y="288" font-size="13" font-weight="700" fill="#53677f">Error → reward</text>
<rect x="516" y="302" width="138" height="16" rx="8" fill="#e8edf3"/>
<rect x="518" y="304" width="132" height="12" rx="6" fill="#d98a4a" class="animated">
 <animate attributeName="width" values="132;132;68;26;6;6;132" keyTimes="0;.15;.44;.68;.84;.94;1" dur="8s" repeatCount="indefinite"/>
</rect>
