<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="icm-title icm-desc">
<title id="icm-title">Intrinsic curiosity module: forward prediction error and inverse action training</title>
<desc id="icm-desc">State and next-state observations pass through an encoder. A forward model uses the current feature and action to predict the next feature, which approaches the encoded actual next feature as training proceeds. A separate inverse model learns to recover the action from the two features. Four input pulses trace the forward and inverse dependencies. A return pulse indicates a schematic loss-driven update of the forward model, after which the prediction improves over training iterations. Green and orange pulses distinguish the encoded next feature from the forward prediction before the comparison changes. A separate purple pulse exits the inverse model as a predicted action, not a target or reward. All positions are schematic.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif}
 .lbl{font-size:15px;fill:#263b52;font-weight:700}
 .edge{fill:none;stroke:#8497ad;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .resting{display:none}
 @media(prefers-reduced-motion:reduce){.animated{display:none}.resting{display:inline}}
</style>
