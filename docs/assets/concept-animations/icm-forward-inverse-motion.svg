 <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.055;0.080;0.220;0.245;1" dur="8s" repeatCount="indefinite"/>
</circle>
<circle r="4.5" fill="#d47c35" stroke="#fff" stroke-width="1.5" opacity="0">
