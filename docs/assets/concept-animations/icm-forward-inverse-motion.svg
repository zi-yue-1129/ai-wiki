 <animateMotion path="M321 292H367" keyPoints="0;0;1;1" keyTimes="0;0.420;0.600;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.395;0.420;0.600;0.625;1" dur="8s" repeatCount="indefinite"/>
