<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC-AUC pairwise comparisons</title><desc id="desc">For scores 0.90 and 0.60 (positive), 0.80 and 0.30 (negative), four ordered positive-negative pairs yield three wins, one loss and AUC 0.75. Animation enumerates each pair. All scores are illustrative.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5f8"/></linearGradient></defs><rect width="640" height="360" rx="16" fill="url(#paper)"/><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#183e55}.h{font-size:18px;font-weight:800}.s{font-size:12px}.m{font-size:11px;font-weight:650}.tiny{font-size:10px;font-weight:650}.muted{fill:#637f8e}.motion-layer{display:inline}.still-layer{display:none}@media(prefers-reduced-motion:reduce){.motion-layer{display:none!important}.still-layer{display:inline!important}}</style><text x="24" y="34" class="h" >ROC-AUC  ·  PAIRWISE RANKING</text><text x="24" y="54" class="s muted" >Compare every positive with every negative</text><rect x="24" y="72" width="267" height="234" fill="#fff" rx="13" stroke="#d9e6ec"/><rect x="304" y="72" width="312" height="234" fill="#fff" rx="13" stroke="#d9e6ec"/><text x="40" y="96" class="m muted" >POSITIVE × NEGATIVE</text><text x="321" y="96" class="m muted" >PAIRWISE WINS</text><text x="25" y="328" class="tiny muted" >SYNTHETIC EXAMPLE  ·  NOT MODEL MEASUREMENTS</text><text x="612" y="328" class="tiny muted" text-anchor="end">BILINGUAL CAPTIONS</text><text x="169" y="124" class="m muted" text-anchor="middle">N 0.80</text><text x="241" y="124" class="m muted" text-anchor="middle">N 0.30</text><text x="52" y="169" class="m" >P 0.90</text><text x="52" y="243" class="m" >P 0.60</text><rect x="141" y="139" width="55" height="53" fill="#f2f6f8" rx="9" stroke="#d6e3e9"/><rect x="214" y="139" width="55" height="53" fill="#f2f6f8" rx="9" stroke="#d6e3e9"/><rect x="141" y="212" width="55" height="53" fill="#f2f6f8" rx="9" stroke="#d6e3e9"/><rect x="214" y="212" width="55" height="53" fill="#f2f6f8" rx="9" stroke="#d6e3e9"/><text x="322" y="128" class="s muted" >Compare scores</text><text x="322" y="297" class="tiny muted" >WIN = 1    TIE = ½    LOSS = 0</text><rect x="141" y="139" width="55" height="53" fill="#d9f3ed" rx="9" stroke="#bdd5d9" stroke-width="1"/><text x="168.5" y="174" class="h" text-anchor="middle">✓</text><rect x="214" y="139" width="55" height="53" fill="#d9f3ed" rx="9" stroke="#bdd5d9" stroke-width="1"/><text x="241.5" y="174" class="h" text-anchor="middle">✓</text><rect x="141" y="212" width="55" height="53" fill="#ffebdc" rx="9" stroke="#bdd5d9" stroke-width="1"/><text x="168.5" y="247" class="h" text-anchor="middle">×</text><rect x="214" y="212" width="55" height="53" fill="#d9f3ed" rx="9" stroke="#183e55" stroke-width="2.4"/><text x="241.5" y="247" class="h" text-anchor="middle">✓</text><rect x="322" y="145" width="57" height="37" fill="#d9f3ed" rx="9"/><text x="350.5" y="169" class="m" text-anchor="middle">WIN</text><rect x="392" y="145" width="57" height="37" fill="#d9f3ed" rx="9"/><text x="420.5" y="169" class="m" text-anchor="middle">WIN</text><rect x="462" y="145" width="57" height="37" fill="#ffebdc" rx="9"/><text x="490.5" y="169" class="m" text-anchor="middle">LOSS</text><rect x="532" y="145" width="57" height="37" fill="#d9f3ed" rx="9"/><text x="560.5" y="169" class="m" text-anchor="middle">WIN</text><text x="323" y="216" class="h" >WINS   3 / 4</text><rect x="323" y="236" width="260" height="16" fill="#edf2f5" rx="8"/><rect x="323" y="236" width="195" height="16" fill="#258f93" rx="8"/><text x="323" y="273" class="s" >AUC = 0.750</text></svg>