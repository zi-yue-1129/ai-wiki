<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>ALiBi: changing recency mass across three attention heads</title><desc>Three causal attention heads use synthetic slopes 0.25, 0.5 and 1.0 to normalise equal content logits over growing prefixes. Larger slopes favour the most recent key.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#0b1324"  /><text x="24" y="38" fill="#eef5ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" >ALiBi / MULTI-HEAD RECENCY</text><text x="24" y="61" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" >Equal content logits · Growing causal prefix</text><rect x="18" y="76" width="604" height="215" rx="12" fill="#15243a"  /><text x="32" y="109" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" >SLOPE</text><text x="187" y="109" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" >Oldest</text><text x="514" y="109" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500" >Later →</text><text x="205" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">0</text><text x="253" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="301" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="349" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="397" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">4</text><text x="445" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">5</text><text x="493" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">6</text><text x="541" y="130" fill="#9eb2c9" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle">7</text><text x="34" y="177" fill="#6de6cb" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" >m = 0.25</text><rect x="187" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="187" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.100"/><rect x="235" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="235" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.111"/><rect x="283" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="283" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.126"/><rect x="331" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="331" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.145"/><rect x="379" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="379" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.169"/><rect x="427" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="427" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.200"/><rect x="475" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="475" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.239"/><rect x="523" y="152" width="36" height="32" rx="6" fill="#22334a"  /><rect x="523" y="152" width="36" height="32" rx="6" fill="#6de6cb"  opacity="0.290"/><text x="34" y="222" fill="#8aa8ff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" >m = 0.50</text><rect x="187" y="197" width="36" height="32" rx="6" fill="#22334a"  /><rect x="187" y="197" width="36" height="32" rx="6" fill="#8aa8ff"  opacity="0.071"/><rect x="235" y="197" width="36" height="32" rx="6" fill="#22334a"  /><rect x="235" y="197" width="36" height="32" rx="6" fill=