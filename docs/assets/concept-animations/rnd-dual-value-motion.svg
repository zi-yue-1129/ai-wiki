<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-labelledby="rnd-dual-title rnd-dual-desc">
<title id="rnd-dual-title">RND: two separately discounted reward streams and two value heads</title>
<desc id="rnd-dual-desc">Four future time steps feed extrinsic and intrinsic discounted returns with different gamma values. The extrinsic delayed reward yields 0.729; the intrinsic stream yields 1.468. Each sum targets a separate value head. All rewards and discounts are hypothetical, not parameters reported by the RND paper.</desc>
