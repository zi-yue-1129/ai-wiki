<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DPO preference margin and sigmoid probability</title><desc id="desc">An illustrative two-response example: frozen reference remains at 0.50 each, while policy moves chosen to 0.75 and rejected to 0.25. The DPO preference sigmoid increases from 0.50 to 0.75.</desc><rect x="0" y="0" width="640" height="360" rx="15" fill="#f7fafd" stroke="#dbe5ee" /><rect x="18" y="15" width="604" height="330" rx="14" fill="#ffffff" stroke="#dbe5ee" /><text x="36" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1e3349" text-anchor="start" font-weight="500">DPO · preference margin</text><text x="605" y="43" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758a" text-anchor="end" font-weight="500">β = 1</text><text x="36" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758a" text-anchor="start" font-weight="500">Policy probabilities</text><text x="475" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758a" text-anchor="end" font-weight="500">Reference: 0.50</text><text x="38" y="118" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="start" font-weight="600">Chosen</text><rect x="172" y="99" width="315" height="34" rx="8" fill="#e9f0f6" stroke="none" /><rect x="172" y="99" width="315" height="34" rx="8" fill="none" stroke="#dbe5ee" /><line x1="329.5" y1="96" x2="329.5" y2="136" stroke="#60758a" stroke-dasharray="3 3" stroke-width="1.5"/><rect x="172" y="105" height="22" rx="6" fill="#078c87" width="236.25"></rect><circle cy="116" r="6" fill="#ffffff" stroke="#078c87" stroke-width="3" cx="408.25"></circle><text x="510" y="121" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#078c87" text-anchor="start" font-weight="700">0.75</text><text x="38" y="181" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="start" font-weight="600">Rejected</text><rect x="172" y="162" width="315" height="34" rx="8" fill="#e9f0f6" stroke="none" /><rect x="172" y="162" width="315" height="34" rx="8" fill="none" stroke="#dbe5ee" /><line x1="329.5" y1="159" x2="329.5" y2="199" stroke="#60758a" stroke-dasharray="3 3" stroke-width="1.5"/><rect x="172" y="168" height="22" rx="6" fill="#de8743" width="78.75"></rect><circle cy="179" r="6" fill="#ffffff" stroke="#de8743" stroke-width="3" cx="250.75"></circle><text x="510" y="184" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#de8743" text-anchor="start" font-weight="700">0.25</text><line x1="36" y1="218" x2="604" y2="218" stroke="#dbe5ee"/><text x="36" y="245" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="start" font-weight="600">P(preferred)</text><text x="37" y="266" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758a" text-anchor="start" font-weight="500">σ(β · margin)</text><rect x="172" y="236" width="315" height="30" rx="8" fill="#e9f0f6" stroke="none" /><rect x="172" y="241" width="236.25" height="20" rx="5" fill="#615bd7"></rect><text x="510" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#615bd7" text-anchor="start" font-weight="700">0.75</text><rect x="35" y="289" width="570" height="42" rx="8" fill="#f1f6fb" stroke="none" /><text x="50" y="316" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758a" text-anchor="start" font-weight="500">Start: Δ = 0, P = 0.50</text><text x="580" y="316" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#078c87" text-anchor="end" font-weight="600">End: Δ = ln 3, P = 0.75</text></svg>