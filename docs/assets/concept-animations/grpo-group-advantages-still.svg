<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">GRPO reward baseline and normalised group advantage</title><desc id="svgDesc">A group of four completions has synthetic rewards 1, 2, 4, 5. The group mean is 3 and population standard deviation is square root of 2.5. Centred, normalised advantages are about negative 1.26, negative 0.63, positive 0.63, positive 1.26. No learned critic or measured model output is shown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#94a5b8" stroke-width="1.5" fill="none"/></marker></defs><style>@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect x="0" y="0" width="760" height="400" rx="16" fill="#f8fbff" stroke="none" stroke-width="0" /><rect x="1" y="1" width="758" height="398" rx="15" fill="none" stroke="#d9e5f0" stroke-width="1" /><text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#22344a" text-anchor="start" font-weight="700" >GRPO</text><text x="730" y="37" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="end" font-weight="500" >Within-group reward normalisation</text><text x="32" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="start" font-weight="600" >One prompt  ·  four sampled outputs</text><line x1="64" y1="202" x2="708" y2="202" stroke="#d9e5f0" stroke-width="1.5" /><rect x="96" y="82" width="86" height="124" rx="8" fill="#edf3f9" stroke="none" stroke-width="0" /><rect x="117" y="184" width="44" height="18" rx="5" fill="#426bc0" stroke="none" stroke-width="0" /><text x="139" y="96" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#22344a" text-anchor="middle" font-weight="600" >r = 1</text><text x="139" y="219" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="middle" font-weight="500" >o1</text><rect x="256" y="82" width="86" height="124" rx="8" fill="#edf3f9" stroke="none" stroke-width="0" /><rect x="277" y="166" width="44" height="36" rx="5" fill="#426bc0" stroke="none" stroke-width="0" /><text x="299" y="96" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#22344a" text-anchor="middle" font-weight="600" >r = 2</text><text x="299" y="219" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="middle" font-weight="500" >o2</text><rect x="416" y="82" width="86" height="124" rx="8" fill="#edf3f9" stroke="none" stroke-width="0" /><rect x="437" y="130" width="44" height="72" rx="5" fill="#426bc0" stroke="none" stroke-width="0" /><text x="459" y="96" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#22344a" text-anchor="middle" font-weight="600" >r = 4</text><text x="459" y="219" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="middle" font-weight="500" >o3</text><rect x="576" y="82" width="86" height="124" rx="8" fill="#edf3f9" stroke="none" stroke-width="0" /><rect x="597" y="112" width="44" height="90" rx="5" fill="#426bc0" stroke="none" stroke-width="0" /><text x="619" y="96" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#22344a" text-anchor="middle" font-weight="600" >r = 5</text><text x="619" y="219" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="middle" font-weight="500" >o4</text><line x1="115" x2="708" y1="148" y2="148" stroke="#d46a3a" stroke-width="2.5" stroke-dasharray="7 5" opacity="1"></line><rect x="22" y="134" width="82" height="23" rx="5" fill="#fff0e9" stroke="none" stroke-width="0" /><text x="63" y="150" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d46a3a" text-anchor="middle" font-weight="700" >mean = 3</text><text x="32" y="256" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="start" font-weight="600" >Normalised advantages</text><text x="728" y="256" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#697e96" text-anchor="end" font-weight="500" >σ = √2.5</text><line x1="65" y1="317" x2="708" y2="317" stroke="#94a5b8" stroke-width="1.5" /><rect x="118" y="317" width="42" height="46.805" rx="4" fill="#d46a3a" stroke="none" stroke-width="0" /><text x="139" y="377" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d46a3a" text-anchor="middle" font-weight="700" >-1.26</text><rect x="278" y="317" width="42" height="23.384" rx="4" fill="#d46a3a" stroke="none" stroke-width="0" /><text x="299" y="377" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d46a3a" text-anchor="middle" font-weight="700" >-0.63</text><rect x="438" y="293.616" width="42" height="23.384" rx="4" fill="#078a86" stroke="none" stroke-width="0" /><text x="459" y="278" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#078a86" text-anchor="middle" font-weight="700" >+0.63</text><rect x="598" y="270.195" width="42" height="46.805" rx="4" fill="#078a86" stroke="none" stroke-width="0" /><text x="619" y="278" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#078a86" text-anchor="middle" font-weight="700" >+1.26</text><text x="380" y="395" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#697e96" text-anchor="middle" font-weight="500" >A = (r − group mean) / group std   ·   illustrative values</text></svg>