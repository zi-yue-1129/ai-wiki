<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Q-learning and SARSA: different bootstrap targets from one transition</title><desc id="desc">The observed next action is Right with Q of 2, while Left is the greedy action with Q of 5. Q-learning bootstraps from max value 5 and updates Q from 2 to 3.75. SARSA bootstraps from taken action value 2 and updates from 2 to 2.40. Rewards and all values are illustrative.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#ffffff" stroke="none" /><text x="23" y="33" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#172d46" font-weight="bold" >Same transition, different backup</text><text x="23" y="56" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#64748b" font-weight="normal" >r = 1    γ = 0.9    α = 0.5</text><rect x="24" y="74" width="160" height="102" rx="12" fill="#f5f8fc" stroke="#d6e1ec" /><text x="38" y="103" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172d46" font-weight="bold" >Current (s,a)</text><text x="38" y="142" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#1769a8" font-weight="bold" >Q = 2.0</text><rect x="202" y="74" width="414" height="102" rx="12" fill="#f5f8fc" stroke="#d6e1ec" /><text x="216" y="98" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#172d46" font-weight="bold" >Next state s&#x27;</text><rect x="216" y="108" width="184" height="57" rx="9" fill="#e7f1fa" stroke="#a8cae3" /><rect x="413" y="108" width="189" height="57" rx="9" fill="#fff1e7" stroke="#edbf9f" /><text x="230" y="136" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1769a8" font-weight="bold" >Left</text><text x="230" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1769a8" font-weight="bold" >Q = 5</text><text x="386" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1769a8" font-weight="normal" text-anchor="end" >max</text><text x="427" y="136" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cb6b2d" font-weight="bold" >Right</text><text x="427" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#cb6b2d" font-weight="bold" >Q = 2</text><text x="588" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#cb6b2d" font-weight="normal" text-anchor="end" >taken</text><path d="M 300 166 L 300 189 Q 300 209 262 214 L 168 222" fill="none" stroke="#b4c4d3" stroke-width="2" stroke-dasharray="5 5"/><path d="M 506 166 L 506 193 Q 506 210 486 222" fill="none" stroke="#b4c4d3" stroke-width="2" stroke-dasharray="5 5"/><path id="greedy-route" d="M 300 166 L 300 189 Q 300 209 262 214 L 168 222" fill="none" stroke="#1769a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 15" opacity="1"></path><path id="sampled-route" d="M 506 166 L 506 193 Q 506 210 486 222" fill="none" stroke="#cb6b2d" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 15" opacity="1"></path><rect x="24" y="222" width="284" height="111" rx="12" fill="#f0f7fd" stroke="#c9e0f0" /><rect x="332" y="222" width="284" height="111" rx="12" fill="#fff7f1" stroke="#f0d5c3" /><rect x="37" y="237" width="5" height="23" rx="2" fill="#1769a8" stroke="none" /><rect x="345" y="237" width="5" height="23" rx="2" fill="#cb6b2d" stroke="none" /><text x="51" y="256" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1769a8" font-weight="bold" >Q-learning</text><text x="359" y="256" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#cb6b2d" font-weight="bold" >SARSA</text><g id="q-target" opacity="1"><text x="40" y="281" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#172d46" font-weight="bold" >1 + .9 × 5 = 5.50</text></g><g id="s-target" opacity="1"><text x="348" y="281" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#172d46" font-weight="bold" >1 + .9 × 2 = 2.80</text></g><rect x="40" y="294" width="178" height="17" rx="8" fill="#dce6ef" stroke="none" /><rect id="q-updated-bar" x="40" y="294" width="111.2" height="17" rx="8" fill="#1769a8"></rect><text x="40" y="327" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" font-weight="normal" >2.0</text><g id="q-updated" opacity="1"><text x="233" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1769a8" font-weight="bold" >3.75</text></g><rect x="348" y="294" width="178" height="17" rx="8" fill="#dce6ef" stroke="none" /><rect id="s-updated-bar" x="348" y="294" width="71.2" height="17" rx="8" fill="#cb6b2d"></rect><text x="348" y="327" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" font-weight="normal" >2.0</text><g id="s-updated" opacity="1"><text x="541" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cb6b2d" font-weight="bold" >2.40</text></g><rect x="510" y="24" width="18" height="7" rx="3" fill="#64748b" stroke="none" /><rect x="541" y="24" width="18" height="7" rx="3" fill="#1769a8" stroke="none" /><rect x="572" y="24" width="18" height="7" rx="3" fill="#cb6b2d" stroke="none" /></svg>