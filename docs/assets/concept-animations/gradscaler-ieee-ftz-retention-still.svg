<path d="M322 114 l14 11 M336 114 l-14 11" stroke="#23394a" stroke-width="1.7" stroke-linecap="round"/>
<rect x="312" y="148" width="34" height="21" rx="4" fill="url(#skip)" stroke="#607582" stroke-width="0.9"/>
<path d="M322 153 l14 11 M336 153 l-14 11" stroke="#23394a" stroke-width="1.7" stroke-linecap="round"/>
<path d="M15 180 H345" stroke="#c7d5de" stroke-width="1"/>
<rect x="18" y="193" width="14" height="11" rx="2" fill="#247e9d"/>
<text x="38" y="202" fill="#334d5f" font-size="10.5" font-family="Arial,sans-serif">LOW +</text>
<rect x="118" y="193" width="14" height="11" rx="2" fill="url(#lost)" stroke="#607582" stroke-width=".6"/>
<text x="138" y="202" fill="#334d5f" font-size="10.5" font-family="Arial,sans-serif">LOW 0</text>
<rect x="218" y="193" width="14" height="11" rx="2" fill="url(#skip)" stroke="#607582" stroke-width=".6"/>
<path d="M221 196 l8 5 M229 196 l-8 5" stroke="#23394a" stroke-width="1.2"/>
<text x="238" y="202" fill="#334d5f" font-size="10.5" font-family="Arial,sans-serif">INF / SKIP</text>
</svg>