<text x="235" y="78" text-anchor="middle" fill="#536978" font-size="11" font-family="Arial,sans-serif">1K</text>
<rect x="218" y="109" width="34" height="21" rx="4" fill="#247e9d" stroke="#607582" stroke-width="0.9"/>
<rect x="218" y="148" width="34" height="21" rx="4" fill="url(#lost)" stroke="#607582" stroke-width="0.9"/>
<text x="282" y="55" text-anchor="middle" fill="#223d51" font-size="11" font-family="Arial,sans-serif" font-weight="700">t5</text>
<text x="282" y="78" text-anchor="middle" fill="#536978" font-size="11" font-family="Arial,sans-serif">1K</text>
<rect x="265" y="109" width="34" height="21" rx="4" fill="#247e9d" stroke="#607582" stroke-width="0.9"/>
<rect x="265" y="148" width="34" height="21" rx="4" fill="url(#lost)" stroke="#607582" stroke-width="0.9"/>
