<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224" role="img" aria-labelledby="title desc">
<title id="title">GradScaler: six finite checks with different low-gradient retention under IEEE and hypothetical FTZ</title>
<desc id="desc">Toy scales 1024, 1024, 2048, 1024, 1024, 2048. IEEE retains a nonzero low gradient in four eligible steps, whereas hypothetical FTZ loses it in those same steps. Both policies skip t3 and t6 on overflow.</desc>
<defs>
<pattern id="lost" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><rect width="7" height="7" fill="#ffdfa9"/><path d="M0 0 V7" stroke="#a56622" stroke-width="2"/></pattern>
<pattern id="skip" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#a9b4be"/><path d="M0 0 V7" stroke="#546575" stroke-width="2"/></pattern>
</defs>
<rect x="1" y="1" width="358" height="222" rx="12" fill="#f8fafc" stroke="#c9d5df" stroke-width="1.5"/>
<text x="15" y="25" fill="#1d3345" font-size="13" font-family="Arial,sans-serif" font-weight="700">GRADSCALER · LOW</text>
<text x="344" y="25" fill="#687a88" font-size="9" font-family="Arial,sans-serif" text-anchor="end">SCHEMATIC</text>
<path d="M15 34 H345" stroke="#c7d5de" stroke-width="1"/>
<text x="16" y="78" fill="#536978" font-size="10" font-family="Arial,sans-serif" font-weight="700">SCALE</text>
<text x="16" y="123" fill="#2e566c" font-size="11.5" font-family="Arial,sans-serif" font-weight="700">IEEE</text>
<text x="16" y="162" fill="#80531e" font-size="11.5" font-family="Arial,sans-serif" font-weight="700">FTZ</text>
<text x="94" y="55" text-anchor="middle" fill="#223d51" font-size="11" font-family="Arial,sans-serif" font-weight="700">t1</text>
<text x="94" y="78" text-anchor="middle" fill="#536978" font-size="11" font-family="Arial,sans-serif">1K</text>
<rect x="77" y="109" width="34" height="21" rx="4" fill="#247e9d" stroke="#607582" stroke-width="0.9"/>
<rect x="77" y="148" width="34" height="21" rx="4" fill="url(#lost)" stroke="#607582" stroke-width="0.9"/>
<text x="141" y="55" text-anchor="middle" fill="#223d51" font-size="11" font-family="Arial,sans-serif" font-weight="700">t2</text>
<text x="141" y="78" text-anchor="middle" fill="#536978" font-size="11" font-family="Arial,sans-serif">1K</text>
<rect x="124" y="109" width="34" height="21" rx="4" fill="#247e9d" stroke="#607582" stroke-width="0.9"/>
<rect x="124" y="148" width="34" height="21" rx="4" fill="url(#lost)" stroke="#607582" stroke-width="0.9"/>
<text x="188" y="55" text-anchor="middle" fill="#223d51" font-size="11" font-family="Arial,sans-serif" font-weight="700">t3</text>
<text x="188" y="78" text-anchor="middle" fill="#536978" font-size="11" font-family="Arial,sans-serif">2K</text>
<rect x="171" y="109" width="34" height="21" rx="4" fill="url(#skip)" stroke="#607582" stroke-width="0.9"/>
<path d="M181 114 l14 11 M195 114 l-14 11" stroke="#23394a" stroke-width="1.7" stroke-linecap="round"/>
<rect x="171" y="148" width="34" height="21" rx="4" fill="url(#skip)" stroke="#607582" stroke-width="0.9"/>
<path d="M181 153 l14 11 M195 153 l-14 11" stroke="#23394a" stroke-width="1.7" stroke-linecap="round"/>
