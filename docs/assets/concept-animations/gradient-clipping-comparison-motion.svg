<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Global norm clipping versus per-coordinate clipping</title><desc id="desc">The same synthetic gradient grows along a fixed direction. The teal norm-clipped vector stays on a radius-two circle without rotating; the orange coordinate-clipped vector changes direction after hitting per-coordinate caps of 1.5. The right panel shows the x and y components for both rules. Not a measured training trajectory.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" /><text x="32" y="43" fill="#1b354d" font-size="23" font-weight="750" >GRADIENT CLIPPING</text><text x="32" y="66" fill="#647c90" font-size="13" font-weight="500" >Global L₂ norm vs independent coordinate caps</text><rect x="22" y="82" width="380" height="306" rx="15" fill="#ffffff" stroke="#dbe7ef"/><rect x="416" y="82" width="362" height="306" rx="15" fill="#ffffff" stroke="#dbe7ef"/><text x="43" y="115" fill="#1b354d" font-size="14" font-weight="700" >VECTOR GEOMETRY</text><text x="437" y="115" fill="#1b354d" font-size="14" font-weight="700" >COMPONENT RESPONSE</text><defs><marker id="arrGray" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#8298a7"/></marker><marker id="arrTeal" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#078c84"/></marker><marker id="arrOrange" markerWidth="7" markerHeight="7" refX="6.2" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#d57637"/></marker></defs><line x1="43" y1="203" x2="371" y2="203" stroke="#ecf2f6" stroke-width="1" stroke-linecap="round" /><line x1="201" y1="145" x2="201" y2="261" stroke="#