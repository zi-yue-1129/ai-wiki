<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CLIP bidirectional softmax</title><desc id="desc">The same two by two logit matrix is normalised by rows and columns independently. The matching diagonal probabilities differ; the two mean negative log probabilities are averaged.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="8" fill="#f1f6fa"/><text x="24" y="30" font-size="19" fill="#233b52" text-anchor="start">CLIP bidirectional softmax</text><rect x="18" y="48" width="192" height="224" rx="5" fill="white" stroke="#d6e1e8" /><text x="114" y="75" font-size="18" fill="#233b52" text-anchor="middle">Logits</text><text x="101" y="99" font-size="13" fill="#233b52" text-anchor="middle">T1</text><text x="169" y="99" font-size="13" fill="#233b52" text-anchor="middle">T2</text><text x="43" y="139" font-size="13" fill="#233b52" text-anchor="middle">I1</text><text x="43" y="201" font-size="13" fill="#233b52" text-anchor="middle">I2</text><rect x="68" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><rect x="68" y="110" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="100.5" y="142" font-size="16" fill="white" text-anchor="middle">2.0</text><rect x="136" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="136" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="168.5" y="142" font-size="16" fill="#233b52" text-anchor="middle">0.0</text><rect x="68" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="68" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="100.5" y="204" font-size="16" fill="#233b52" text-anchor="middle">1.2</text><rect x="136" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><rect x="136" y="172" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="168.5" y="204" font-size="16" fill="white" text-anchor="middle">1.6</text><text x="114" y="252" font-size="14" fill="#233b52" text-anchor="middle">Fixed scores</text><rect x="224" y="48" width="192" height="224" rx="5" fill="white" stroke="#d6e1e8" /><text x="320" y="75" font-size="18" fill="#233b52" text-anchor="middle">Image → text</text><text x="307" y="99" font-size="13" fill="#233b52" text-anchor="middle">T1</text><text x="375" y="99" font-size="13" fill="#233b52" text-anchor="middle">T2</text><text x="249" y="139" font-size="13" fill="#233b52" text-anchor="middle">I1</text><text x="249" y="201" font-size="13" fill="#233b52" text-anchor="middle">I2</text><rect x="274" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><rect x="342" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="274" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="342" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><text x="320" y="252" font-size="14" fill="#233b52" text-anchor="middle">Each row sums to 1</text><rect x="430" y="48" width="192" height="224" rx="5" fill="white" stroke="#d6e1e8" /><text x="526" y="75" font-size="18" fill="#233b52" text-anchor="middle">Text → image</text><text x="513" y="99" font-size="13" fill="#233b52" text-anchor="middle">T1</text><text x="581" y="99" font-size="13" fill="#233b52" text-anchor="middle">T2</text><text x="455" y="139" font-size="13" fill="#233b52" text-anchor="middle">I1</text><text x="455" y="201" font-size="13" fill="#233b52" text-anchor="middle">I2</text><rect x="480" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><rect x="548" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="480" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><rect x="548" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="#087d70" /><text x="526" y="252" font-size="14" fill="#233b52" text-anchor="middle">Each column sums to 1</text><rect x="18" y="286" width="604" height="56" rx="5" fill="white" stroke="#d6e1e8" /><text x="116" y="306" font-size="14" fill="#233b52" text-anchor="middle">Row loss</text><text x="320" y="306" font-size="14" fill="#233b52" text-anchor="middle">Column loss</text><text x="524" y="306" font-size="14" fill="#233b52" text-anchor="middle">Mean loss</text><rect x="274" y="110" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="306.5" y="142" font-size="16" fill="white" text-anchor="middle">0.881</text><rect x="342" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="374.5" y="142" font-size="16" fill="#233b52" text-anchor="middle">0.119</text><rect x="274" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="306.5" y="204" font-size="16" fill="#233b52" text-anchor="middle">0.401</text><rect x="342" y="172" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="374.5" y="204" font-size="16" fill="white" text-anchor="middle">0.599</text><rect x="480" y="110" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="512.5" y="142" font-size="16" fill="white" text-anchor="middle">0.690</text><rect x="548" y="110" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="580.5" y="142" font-size="16" fill="#233b52" text-anchor="middle">0.168</text><rect x="480" y="172" width="65" height="52" rx="5" fill="#e4edf2" stroke="none" /><text x="512.5" y="204" font-size="16" fill="#233b52" text-anchor="middle">0.310</text><rect x="548" y="172" width="65" height="52" rx="5" fill="#087d70" stroke="none" /><text x="580.5" y="204" font-size="16" fill="white" text-anchor="middle">0.832</text><text x="116" y="329" font-size="20" fill="#21678d" text-anchor="middle">0.3200</text>