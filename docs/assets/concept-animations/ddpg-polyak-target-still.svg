amily="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#cd5380">+0.200</text><text x="374" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#62768d">2</text><text x="374" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#078b94">-0.20</text><text x="374" y="301" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#cd5380">+0.120</text><text x="476" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#62768d">3</text><text x="476" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#078b94">+0.80</text><text x="476" y="301" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#cd5380">+0.256</text><text x="578" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#62768d">4</text><text x="578" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#078b94">+0.40</text><text x="578" y="301" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#cd5380">+0.285</text><text x="28" y="277" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#078b94">θ</text><text x="28" y="301" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#cd5380">θ′</text><path d="M26 317 H614" fill="none" stroke="#dce6f0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="33" y="340" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#62768d">Target follows; it never copies the online jump</text><text x="611" y="340" text-anchor="end"