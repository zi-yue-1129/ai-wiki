<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img"><title>Bootstrap particle filter resampling</title><desc>Ten illustrative predicted particles receive likelihood weights around an observation. Systematic resampling replicates high-weight ancestors; this depicts sampled ancestry, not posterior ground truth.</desc><rect width="640" height="360" rx="14" fill="#f7fafc"/><text x="36" y="36" font-size="15" font-weight="700" fill="#17324c" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">PARTICLE FILTER  •  RESAMPLING</text><text x="36" y="58" font-size="12" font-weight="500" fill="#62778b" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A likelihood-weighted population update</text><rect x="35" y="77" width="570" height="239" rx="11" fill="white" stroke="#e5edf2"/><text x="51" y="107" font-size="12" font-weight="600" fill="#62778b" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Predicted particles + weights</text><text x="51" y="281" font-size="12" font-weight="600" fill="#62778b" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Resampled population</text><line x1="69" y1="175" x2="574" y2="175" stroke="#c0d0dc" stroke-width="1.5"/><line x1="69" y1="302" x2="574" y2="302" stroke="#c0d0dc" stroke-width="1.5"/><rect x="360.0" y="119" width="88" height="200" rx="8" fill="#fff3df" opacity=".65"/><line x1="404" y1="117" x2="404" y2="315" stroke="#d88a35" stroke-width="1.5" stroke-dasharray="4 5"/><text x="404" y="116" font-size="11" font-weight="600" fill="#d88a35" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">Observation</text><rect x="117.0" y="168.0" width="14" height="0.0" rx="4" fill="#d88a35" opacity=".85"/><circle cx="124.0" cy="175" r="6" fill="#3e7eb7" stroke="white" stroke-width="1.5"/><rect x="172.0" y="167.9" width="14" height="0.1" rx="4" fill="#d88a35" opacity=".85"/><circle cx="179.0" cy="175" r="6" fill="#3e7eb7" stroke="w