<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">RT-2 autoregressive robot action token decoding</title><desc id="desc">Image and text condition a vision-language model that emits eight example integer action tokens in sequence. Stop flag plus six pose axes and gripper dimension decode to a robot command. Integers are illustrative, not measured commands.</desc><style>@media (prefers-reduced-motion:reduce){.motion-overlay{display:none!important}.static-overlay{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbfe" stroke="none" stroke-width="1"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d6e3ed" stroke-width="1"/><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#21374d" text-anchor="start">RT-2</text><text x="26" y="58" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#50677d" text-anchor="start">Observation + instruction → action tokens</text><rect x="24" y="76" width="175" height="88" rx="12" fill="#ffffff" stroke="#d6e3ed" stroke-width="1"/><text x="40" y="96" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#50677d" text-anchor="start">Camera</text><rect x="48" y="131" width="120" height="9" rx="3" fill="#c9d8e3" stroke="none" stroke-width="1"/><rect x="122" y="104" width="25" height="27" rx="5" fill="#f7cb93" stroke="#c46a2b" stroke-width="1.5"/><path d="M64 124 L91 110 L110 118" fill="none" stroke="#087f82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="124" r="8" fill="#087f82"/><circle cx="91" cy="110" r="6" fill="#087f82"/><rect x="214" y="76" width="125" height="88" rx="12" fill="#ffffff" stroke="#d6e3ed" stroke-width="1"/><text x="231" y="99" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#50677d" text-anchor="start">Instruction</text><text x="231" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#21374d" text-anchor="start">Pick cup</text><rect x="375" y="76" width="238" height="88" rx="12" fill="#e8f6f5" stroke="#7bc2bf" stroke-width="1.4"/><text x="494" y="113" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f82" text-anchor="middle">VLM</text><text x="494" y="138" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#50677d" text-anchor="middle">next-token decoding</text><path d="M343 119 L370 119" fill="none" stroke="#087f82" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M367 114 L374 119 L367 124" fill="none" stroke="#087f82" stroke-width="2.4"/><text x="26" y="193" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#21374d" text-anchor="start">8 action tokens</text><text x="611" y="193" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#50677d" text-anchor="end">256 bins per continuous axis</text><rect x="28" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="61" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">Stop</text><rect x="28" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="61" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">0</text><rect x="102" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="135" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">dx</text><rect x="102" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="135" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">128</text><rect x="176" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="209" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">dy</text><rect x="176" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="209" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">178</text><rect x="250" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="283" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">dz</text><rect x="250" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="283" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">84</text><rect x="324" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="357" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">rx</text><rect x="324" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="357" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">128</text><rect x="398" y="204" width="67" height="66" rx="9" fill="#e4edf4" stroke="#d6e3ed" stroke-width="1"/><text x="431" y="224" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#50677d" text-anchor="middle">ry</text><rect x="398" y="229" width="67" height="41" rx="8" fill="#e2f3ef" stroke="none" stroke-width="1"/><text x="431" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="middle">128</te