<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">GRID SEARCH: trial-by-trial coverage of an influential parameter</title>
<desc id="desc">A 2D search space with x as the important dimension and y as a weaker dimension. Sixteen configurations appear one by one. Grid search repeats four x settings across rows, while a representative fixed random draw samples sixteen distinct x values. A right-hand projection accumulates the x values.</desc>
