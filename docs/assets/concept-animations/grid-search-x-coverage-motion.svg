<text x="27" y="194" fill="#a8bdd3" font-family="Arial,Helvetica,sans-serif" font-size="11" transform="rotate(-90 27 194)" text-anchor="middle">y · weak</text>
<text x="416" y="106" fill="#d9e7f6" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing=".3">X COVERAGE</text>
<text x="416" y="127" fill="#8ba8c0" font-family="Arial,Helvetica,sans-serif" font-size="10">Each trial projects onto x</text>
