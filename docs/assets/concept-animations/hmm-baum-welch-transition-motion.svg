<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc"><title id="title">Baum-Welch update turns expected transition counts into stochastic transition rows</title><desc id="desc">The E step sums two adjacent-pair posterior tables into expected counts for A to A, A to B, B to A and B to B. The M step normalizes each source-state row into transition probabilities A prime. All values are exact calculations from a synthetic HMM, not fitted model measurements.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .t{fill:#1b334e;font-weight:700} .muted{fill:#5d758e} .small{font-size:13px} .tick{font-size:12px;font-weight:700} @media(prefers-reduced-motion:reduce){.travel{display:none!important}}</style><rect width="800" height="420" rx="18" fill="#f8fbff"/><rect x="1" y="1" width="798" height="418" rx="17" fill="none" stroke="#d1dfef"/><text x="32" y="44" font-size="23" font-weight="700" fill="#1b334e">Baum–Welch  E → M</text><text x="32" y="69" font-size="13" font-weight="400" fill="#5d758e">Expected counts become transition probabilities</text><rect x="30" y="91" width="347" height="269" rx="14" fill="white" stroke="#d1dfef"/><rect x="425" y="91" width="345" height="269" rx="14" fill="white" stroke="#d1dfef"/><text x="51" y="119" font-size="15" font-weight="700" fill="#1b334e">E-step: expected counts</text><text x="447" y="119" font-size="15" font-weight="700" fill="#1b334e">M-step: normalized rows</text><path d="M 382 218 L 419 218 M 411 211 L 419 218 L 411 225" fill="none" stroke="#537b9e" stroke-width="2.7"/><rect x="52" y="149" width="149" height="85" rx="11" fill="#e8f7f5" stroke="#0c8992" stroke-width="1.1"/><text x="65" y="174" font-size="14" font-weight="700" fill="#0c8992">A → A</text><g opacity="0"><text x="185" y="203" font-size="16" font-weight="700" fill="#1b334e" text-anchor="end">0.531</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0875;0.0917;0.9817;1" dur="12s" repeatCount="indefinite"/></g><rect x="216" y="149" width="149" height="85" rx="11" fill="#fff2e4" stroke="#d48836" stroke-width="1.1"/><text x="229" y="174" font-size="14" font-weight="700" fill="#d48836">A → B</text><g opacity="0"><text x="349" y="203" font-size="16" font-weight="700" fill="#1b334e" text-anchor="end">0.518</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1250;0.1292;0.9817;1" dur="12s" repeatCount="indefinite"/></g><rect x="52" y="252" width="149" height="85" rx="11" fill="#e8f7f5" stroke="#0c8992" stroke-width="1.1"/><text x="65" y="277" font-size="14" font-weight="700" fill="#0c8992">B → A</text><g opacity="0"><text x="185" y="306" font-size="16" font-weight="700" fill="#1b334e" text-anchor="end">0.408</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2208;0.2250;0.9817;1" dur="12s" repeatCount="indefinite"/></g><rect x="216" y="252" width="149" height="85" rx="11" fill="#fff2e4" stroke="#d48836" stroke-width="1.1"/><text x="229" y="277" font-size="14" font-weight="700" fill="#d48836">B → B</text><g opacity="0"><text x="349" y="306" font-size="16" font-weight="700" fill="#1b334e" text-anchor="end">0.543</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2583;0.2625;0.9817;1" dur="12s" repeatCount="indefinite"/></g><text x="447" y="150" font-size="14" font-weight="700" fill="#405e7d">From A</text><rect x="447" y="168" width="290" height="30" rx="6" fill="#e8edf4"/><rect x="447.000" y="168" width="0.000" height="30" rx="6" fill="#0c8992"><animate attributeName="width" values="0;0;146.883;146.883;0" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/></rect><rect x="593.883" y="168" width="0.000" height="30" rx="6" fill="#d48836"><animate attributeName="width" values="0;0;143.117;143.117;0" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x" values="447.000;447.000;593.883;593.883;447.000" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><text x="452" y="218" font-size="13" font-weight="700" fill="#0c8992">A  0.506</text><text x="732" y="218" font-size="13" font-weight="700" fill="#d48836" text-anchor="end">B  0.494</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7292;0.7333;0.9817;1" dur="12s" repeatCount="indefinite"/></g><text x="447" y="252" font-size="14" font-weight="700" fill="#405e7d">From B</text><rect x="447" y="270" width="290" height="30" rx="6" fill="#e8edf4"/><rect x="447.000" y="270" width="0.000" height="30" rx="6" fill="#0c8992"><animate attributeName="width" values="0;0;124.314;124.314;0" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/></rect><rect x="571.314" y="270" width="0.000" height="30" rx="6" fill="#d48836"><animate attributeName="width" values="0;0;165.686;165.686;0" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x" values="447.000;447.000;571.314;571.314;447.000" keyTimes="0;0.48;0.77;0.985;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><text x="452" y="320" font-size="13" font-weight="700" fill="#0c8992">A  0.429</text><text x="732" y="320" font-size="13" font-weight="700" fill="#d48836" text-anchor="end">B  0.571</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7292;0.7333;0.9817;1" dur="12s" repeatCount="indefinite"/></g><rect x="202" y="375" width="396" height="29" rx="9" fill="#e8f0fb"/><text x="400" y="394" font-size="13" font-weight="700" fill="#365f85" text-anchor="middle">Normalize each transition row to 1</text></svg>