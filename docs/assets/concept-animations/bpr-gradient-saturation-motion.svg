<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">BPR: gradient sensitivity to the ranking margin</title><desc id="desc">A moving point follows the exact logistic pairwise loss and its gradient magnitude as the observed-minus-unobserved score gap changes from negative to positive. For a wrong order with margin minus two, the gradient signal is approximately 0.881; at plus two, it is 0.119. All numbers are analytic illustrative values, not a trained model.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eff5fa"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#29475c}.head{font-size:13px;font-weight:700;letter-spacing:1.1px;fill:#607d90}.txt{font-size:15px;fill:#29475c}.small{font-size:13px;fill:#607d90}.panel{fill:white;stroke:#dbe6ed;stroke-width:1.6}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="800" height="420" rx="19" fill="url(#bg)"/><text x="24" y="36" class="head">RECOMMENDER SYSTEMS · WORKED EXAMPLE</text><rect x="20" y="62" width="470" height="316" rx="17" class="panel"/><rect x="507" y="62" width="273" height="316" rx="17" class="panel"/><text x="44" y="95" class="head">PAIRWISE MARGIN → LOSS &amp; GRADIENT</text><text x="530" y="95" class="head">UPDATE SIGNAL</text><line x1="76" y1="253" x2="442" y2="253" stroke="#b9ceda" stroke-width="1.5"/><line x1="76" y1="342" x2="442" y2="342" stroke="#b9ceda" stroke-width="1.5"/><text x="44" y="125" class="small">Loss</text><text x="44" y="289" class="small">Gradient</text><path d="M76.00 136.15 L80.58 138.86 L85.15 141.56 L89.73 144.25 L94.30 146.93 L98.88 149.59 L103.45 152.24 L108.02 154.88 L112.60 157.50 L117.17 160.10 L121.75 162.69 L126.33 165.26 L130.90 167.81 L135.48 170.34 L140.05 172.85 L144.63 175.33 L149.20 177.79 L153.77 180.22 L158.35 182.62 L162.93 185.00 L167.50 187.35 L172.07 189.6