<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">Fusion with fan-out</title><desc id="desc">The same expression has two outputs. Separate kernels transfer six elements, partially fused kernels transfer five because z remains needed, and full fusion transfers three. Read/write labels refer to logical transfers.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b9c9dc"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.animated{display:none}.fallback{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="12" fill="#101b2d"/><g class="animated"><text x="320" y="30" font-size="23" fill="#eef4ff" text-anchor="middle">Fusion across a shared intermediate</text><rect x="22" y="52" width="78" height="34" rx="5" fill="#192a40"/><text x="61" y="75" font-size="18" fill="#eef4ff" text-anchor="middle">x</text><rect x="145" y="52" width="98" height="34" rx="5" fill="#192a40"/><text x="194" y="75" font-size="18" fill="#eef4ff" text-anchor="middle">z = x+1</text><rect x="300" y="43" width="136" height="34" rx="5" fill="#192a40"/><text x="368" y="66" font-size="18" fill="#eef4ff" text-anchor="middle">y₁ = 2z</text><rect x="300" y="83" width="136" height="34" rx="5" fill="#192a40"/><text x="368" y="106" font-size="18" fill="#eef4ff" text-anchor="middle">y₂ = z²</text><path d="M104 69L140 69" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247 68L295 60" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M247 71L295 99" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="529" y="64" font-size="18" fill="#b9c9dc" text-anchor="middle">x=2, z=3</text><text x="529" y="91" font-size="18" fill="#b9c9dc" text-anchor="middle">y₁=6, y₂=9</text><text x="22" y="139" font-size="17" fill="#b9c9dc" text-anchor="start">Logical transfers</text><text x="22" y="180" font-size="19" fill="#eef4ff" text-anchor="start">Separate</text><rect x="133" y="153" width="66" height="37" rx="5" fill="#192a40"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.08;0.96;1" dur="12s" repeatCount="indefinite"/><rect x="133" y="153" width="66" height="37" rx="5" fill="#417dae"/><text x="166" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R x</text></g><rect x="205" y="153" width="66" height="37" rx="5" fill="#192a40"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.20;0.96;1" dur="12s" repeatCount="indefinite"/><rect x="205" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="238" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">W z</text></g><rect x="277" y="153" width="66" height="37" rx="5" fill="#192a40"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27999999999999997;0.32;0.96;1" dur="12s" repeatCount="indefinite"/><rect x="277" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="310" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R z</text></g><rect x="349" y="153" width="66" height="37" rx="5" fill="#192a40"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.39999999999999997;0.44;0.96;1" dur="12s" repeatCount="indefinite"/><rect x="349" y="153" width="66" height="37" rx="5" fill="#238b80"/><text x="382" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">W y₁</text></g><rect x="421" y="153" width="66" height="37" rx="5" fill="#192a40"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.56;0.96;1" dur="12s" repeatCount="indefinite"/><rect x="421" y="153" width="66" height="37" rx="5" fill="#b67b36"/><text x="454" y="178" font-size="17" fill="#eef4ff" text-anchor="middle">R z</text></g><rect x="493" y="153" width="66" height="