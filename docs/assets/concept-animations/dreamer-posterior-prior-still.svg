<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dreamer posterior conditioning and prior-only imagination</title><desc id="desc">Real observations condition posterior latent states during world-model learning; imagined future states and rewards are rolled forward by the prior without future observations. Original schematic, no model measurements.</desc><defs><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#376cae"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8a"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b34f7c"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="0" fill="#f4f7fb" stroke="#f4f7fb" /><text x="28" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#087f8a">DREAMER</text><text x="612" y="38" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#19334a">Posterior → Prior</text><rect x="19" y="64" width="602" height="137" rx="12" fill="#ffffff" stroke="#d7e2ec" /><rect x="19" y="214" width="602" height="128" rx="12" fill="#ffffff" stroke="#d7e2ec" /><text x="43" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">REAL EXPERIENCE</text><text x="43" y="239" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">MODEL IMAGINATION</text><rect x="51" y="104" width="91" height="77" rx="11" fill="#ebf2fb" stroke="#d7e2ec" /><text x="96" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" f