ecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><path d="M135 285 L222 285" fill="none" stroke="#087f8a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-cyan)"/><text x="179" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">a0</text><circle cx="108" cy="285" r="26" fill="#e7f7f2" stroke="#087f8a" stroke-width="2" /><text x="108" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s0</text><path d="M277 285 L364 285" fill="none" stroke="#087f8a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-cyan)"/><text x="321" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">a1</text><circle cx="250" cy="285" r="26" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="250" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s1</text><text x="250" y="327" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#087f8a">r1</text><path d="M419 285 L506 285" fill="none" stroke="#087f8a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-cyan)"/><text x="463" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#63788c">a2</text><circle cx="392" cy="285" r="26" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="392" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19334a">s2</text><text x="392" y="327" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#087f8a">r2</text><circle cx="534" cy="285" r="26" fill="#ebf2fb" stroke="#376cae" stroke-width="2" /><text x="534" y="29