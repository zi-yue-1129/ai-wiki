<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Temperature-softened distillation</title><desc id="desc">Teacher probabilities become less peaked as temperature increases from 1 to 3; a student distribution then approaches the soft target. Illustrated probabilities only.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#087f82" stroke-width="1.8"/></marker><marker id="arrow-p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#7358bc" stroke-width="1.8"/></marker></defs><rect x="1" y="1" width="718" height="398" rx="16" fill="#f9fbfe" stroke="#dae5ef" stroke-width="1.4"/><text x="34" y="44" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#23364a" text-anchor="start">SOFT TARGET DISTILLATION</text><path d="M35 60 L685 60" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><text x="35" y="98" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#23364a" text-anchor="start">Teacher</text><text x="35" y="260" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#23364a" text-anchor="start">Student</text><g opacity="1"><text x="680" y="96" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="end">T = 1</text><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.23;0.35;0.88;0.98;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="680" y="96" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f82" text-anchor="end">T = 3</text><animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.32;0.43;0.88;0.98;1" dur="12s" repeatCount="indefinite"/></g><text x="213" y="126" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#23364a" text-anchor="middle">A</text><rect x="188" y="133" width="50" height="102" rx="6" fill="#eaf2f8" stroke="#eaf2f8" stroke-width="1.4"/><path d="M174 235 L252 235" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><rect x="191" y="144.7" width="44" height="90.3" rx="5" fill="#087f82"><animate attributeName="y" values="144.7;144.7;178.1;178.1;178.1" keyTimes="0;0.25;0.55;0.75;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="90.3;90.3;56.9;56.9;56.9" keyTimes="0;0.25;0.55;0.75;1" dur="12s" repeatCount="indefinite"/></rect><rect x="188" y="285" width="50" height="82" rx="6" fill="#eaf2f8" stroke="#eaf2f8" stroke-width="1.4"/><path d="M174 367 L252 367" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><rect x="191" y="315.6" width="44" height="51.4" rx="5" fill="#7358bc"><animate attributeName="y" values="315.6;315.6;315.6;310.1;310.1" keyTimes="0;0.54;0.65;0.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="51.4;51.4;51.4;56.9;56.9" keyTimes="0;0.54;0.65;0.92;1" dur="12s" repeatCount="indefinite"/></rect><path d="M213 243 L213 275" stroke="#087f82" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><circle cx="213" cy="245" r="5" fill="#c46a2b" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.47;0.57;0.63;0.87;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="245;245;245;273;273" keyTimes="0;0.53;0.60;0.91;1" dur="12s" repeatCount="indefinite"/></circle><text x="390" y="126" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#23364a" text-anchor="middle">B</text><rect x="365" y="133" width="50" height="102" rx="6" fill="#eaf2f8" stroke="#eaf2f8" stroke-width="1.4"/><path d="M351 235 L429 235" stroke="#dae5ef" stroke-width="2.4" fill="none" stroke-linecap="round" /><rect x