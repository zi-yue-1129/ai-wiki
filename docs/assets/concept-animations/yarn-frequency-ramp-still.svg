<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">YaRN frequency-dependent rotary scaling</title><desc id="desc">Six schematic rotary frequency bands transition from unscaled angles to wavelength-conditioned interpolation: slow bands are compressed, middle bands blended and fast bands preserved. This demonstrates the NTK-by-parts component of YaRN, not a full model benchmark.</desc><rect width="640" height="360" rx="18" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e3eb" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203248}.head{font-size:20px;font-weight:700}.small{font-size:12px;fill:#5b7085}.axis{font-size:11px;fill:#607489}.tag{font-size:13px;font-weight:700}</style><text x="25" y="36" class="head">YaRN · band-wise RoPE scaling</text><text x="25" y="56" class="small">Example: scale s = 1 → 4 → 1</text><text x="25" y="82" class="small">Low frequency</text><text x="615" y="82" class="small" text-anchor="end">High frequency</text><rect x="62" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="66" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="69" y="107" width="34" height="44.5" rx="4" fill="#287cb6" opacity=".9" transform="translate(0 133.5)"></rect><text x="86" y="302" class="tag" text-anchor="middle">0.5</text><text x="86" y="317" class="axis" text-anchor="middle">L / λ</text><text x="86" y="340" class="axis" text-anchor="middle">scale</text><rect x="161" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="165" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="168" y="107" width="34" height="44.5" rx="4" fill="#287cb6" opacity=".9" transform="translate(0 133.5)"></rect><text x="185" y="302" class="tag" text-anchor="middle">1</text><text x="185" y="317" class="axis" text-anchor="middle">L / λ</text><text x="185" y="340" class="axis" text-anchor="middle">scale</text><rect x="260" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="264" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="267" y="107" width="34" height="66.75" rx="4" fill="#5d92bf" opacity=".9" transform="translate(0 111.25)"></rect><text x="284" y="302" class="tag" text-anchor="middle">1.5</text><text x="284" y="317" class="axis" text-anchor="middle">L / λ</text><text x="284" y="340" class="axis" text-anchor="middle">blend</text><rect x="359" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="363" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="366" y="107" width="34" height="89.0" rx="4" fill="#6e9fa2" opacity=".9" transform="translate(0 89.0)"></rect><text x="383" y="302" class="tag" text-anchor="middle">2</text><text x="383" y="317" class="axis" text-anchor="middle">L / λ</text><text x="383" y="340" class="axis" text-anchor="middle">blend</text><rect x="458" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="462" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="465" y="107" width="34" height="133.5" rx="4" fill="#65a68f" opacity=".9" transform="translate(0 44.5)"></rect><text x="482" y="302" class="tag" text-anchor="middle">3</text><text x="482" y="317" class="axis" text-anchor="middle">L / λ</text><text x="482" y="340" class="axis" text-anchor="middle">blend</text><rect x="557" y="107" width="48" height="178" rx="5" fill="#eff3f8" stroke="#dfe6ec"/><rect x="561" y="107" width="40" height="178" rx="4" fill="none" stroke="#bdd0da" stroke-dasharray="3 5"/><rect x="564" y="107" width="34" height="178.0" rx="4" fill="#27946d" opacity=".9" transform="translate(0 0.0)"></rect><text x="581" y="302" class="tag" text-anchor="middle">4</text><text x="581" y="317" class="axis" text-anchor="middle">L / λ</text><text x="581" y="340" class="axis" text-anchor="middle">keep</text></svg>