<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">ReLU differentiation follows the executed branch</title><desc id="desc">A point travels along the negative flat and positive sloping branches of ReLU. The tangent is zero for x negative and one for x positive with unit seed. The derivative is not uniquely defined at the kink x=0. Numbers are illustrative, not measured.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#4978ae" stroke-width="1.6"/></marker><marker id="skip-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#ca6e22" stroke-width="1.5"/></marker></defs><rect width="800" height="420" rx="18" fill="#f4f8fb"/><rect x="16" y="16" width="768" height="388" rx="16" fill="white" stroke="#dbe6ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="52" font-size="22" fill="#1d3548" font-weight="bold">ReLU  ·  differentiate the active branch</text><text x="38" y="75" font-size="13" fill="#62788a">y = max(0, x)     •     seed = 1     •     x = 0 is a kink</text><rect x="36" y="98" width="450" height="248" rx="13" fill="#f7fafc" stroke="#dbe6ed"/><rect x="502" y="98" width="261" height="248" rx="13" fill="#f7fafc" stroke="#dbe6ed"/><text x="54" y="124" font-size="14" fill="#1d3548" font-weight="bold">Primal</text><text x="520" y="124" font-size="14" fill="#1d3548" font-weight="bold">Tangent</text><path d="M77 300 L468 300" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 323 L300 143" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 300 L300 300" stroke="#4978ae" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M300 300 L452 155" stroke="#087f86" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="300" cy="300" r="8" fill="white" stroke="#ca6e22" stroke-width="2.5"/><text x="100" y="326" font-size="13" fill="#62788a" font-weight="normal" text-anchor="middle">−2</text><text x="300" y="326" font-size="13" fill="#62788a" font-weight="normal" text-anchor="middle">0</text><text x="452" y="326" font-size="13" fill="#62788a" font-weight="normal" text-anchor="middle">2</text><text x="457" y="289" font-size="13" fill="#62788a">x</text><text x="289" y="144" font-size="13" fill="#62788a">y</text><text x="138" y="186" font-size="14" fill="#4978ae" font-weight="bold">x &lt; 0</text><text x="356" y="185" font-size="14" fill="#087f86" font-weight="bold">x &gt; 0</text><path d="M533 299 L744 299" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M635 321 L635 150" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 288 L634 288" stroke="#4978ae" stroke-width="6" stroke-linecap="round"/><path d="M636 174 L741 174" stroke="#087f86" stroke-width="6" stroke-linecap="round"/><circle cx="635" cy="288" r="6" fill="white" stroke="#ca6e22" stroke-width="2"/><circle cx="635" cy="174" r="6" fill="white" stroke="#ca6e22" stroke-width="2"/><text x="525" y="289" font-size="14" fill="#4978ae" font-weight="bold">0</text><text x="725" y="165" font-size="14" fill="#087f86" font-weight="bold">1</text><text x="635" y="334" font-size="12" fill="#ca6e22" font-weight="bold" text-anchor="middle">x = 0: undefined</text><circle cx="187" cy="300" r="9" fill="#4978ae" stroke="white" stroke-width="2.5"/><circle cx="393" cy="211" r="9" fill="#087f86" stroke="white" stroke-width="2.5"/><circle cx="574" cy="288" r="7" fill="#4978ae" stroke="white" stroke-width="2"/><circle cx="700" cy="174" r="7" fill="#087f86" stroke="white" stroke-width="2"/><text x="42" y="387" font-size="13" fill="#62788a">Active path determines the tangent</text><text x="757" y="387" font-size="12" fill="#ca6e22" font-weight="bold" text-anchor="end">branchwise JVP</text></g></svg>