<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">RAPS rank penalty crosses a prediction-set cutoff</ns0:title><ns0:desc id="desc">Four synthetic ranked class probabilities 0.45, 0.30, 0.15, and 0.10 produce cumulative APS scores 0.45, 0.75, 0.90, 1.00. Rank-regularized RAPS with lambda 0.10 and kreg 2 yields 0.45, 0.75, 1.00, 1.20. At a hypothetical fixed cutoff 0.95 the score rule changes the included labels from A B C to A B. Thresholds would need recalibration if the score function changed.</ns0:desc><ns0:style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#224259}.title{font-size:16px;font-weight:750;letter-spacing:.6px}.meta{font-size:11px;fill:#60788d}.rowname{font-size:13px;font-weight:750}.number{font-size:12px;font-weight:700}.small{font-size:10px;fill:#60788d}</ns0:style><ns0:rect width="640" height="360" rx="18" fill="#f2f7fb" /><ns0:text x="28" y="33" class="title">RAPS · RANK PENALTY</ns0:text><ns0:text x="28" y="52" class="meta">TOY CLASSIFIER · k_reg = 2 · q = 0.95</ns0:text><ns0:text x="526" y="51" text-anchor="end" class="meta" opacity="0">λ = 0.00</ns0:text><ns0:text x="526" y="51" text-anchor="end" class="meta" opacity="1">λ = 0.10</ns0:text><ns0:rect x="24" y="69" width="592" height="273" rx="14" fill="#fff" stroke="#dce7ef" />
