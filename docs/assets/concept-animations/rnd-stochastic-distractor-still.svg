<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" role="img" aria-labelledby="rnd-noise-title rnd-noise-desc">
<title id="rnd-noise-title">RND: predictable observations versus stochastic distractors</title>
<desc id="rnd-noise-desc">Two illustrative sequences revisit the same source six times. The repeated identical observation yields decreasing predictor errors, while samples changing unpredictably from a stochastic source can keep the errors high. Every bar is a hypothetical example, not an empirical RND training trace or a universal law.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.strong{fill:#183248;font-weight:700}.muted{fill:#516778}.motion-only{display:inline}.still-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.still-only{display:inline!important}}</style>
<rect x="1" y="1" width="358" height="606" rx="16" fill="#fff" stroke="#cbd8e5"/>
<text class="strong" x="18" y="32" font-size="21">RND · stochastic inputs</text>
<text class="muted" x="18" y="54" font-size="13">Repeated visits need not lower error</text>
<rect x="12" y="69" width="336" height="238" rx="13" fill="#edf6fc" stroke="#c6dbe9"/>
<rect x="12" y="318" width="336" height="238" rx="13" fill="#fff6eb" stroke="#ead5b6"/>
<text class="strong" x="25" y="95" font-size="17">Fixed observation</text>
<text class="muted" x="334" y="95" font-size="10" text-anchor="end">SAME INPUT</text>
<text class="strong" x="25" y="344" font-size="17">Stochastic observation</text>
<text class="muted" x="334" y="344" font-size="10" text-anchor="end">VARIABLE INPUT</text>



