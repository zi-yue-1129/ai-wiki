<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 764" role="img" aria-labelledby="rnd-noise-title rnd-noise-desc">
<title id="rnd-noise-title">RND: noisy observations can retain or lose prediction error</title>
<desc id="rnd-noise-desc">Three six-visit toy sequences compare a fixed repeated observation, varying observations with weak predictor transfer, and the identical varying observations with stronger transfer. The fixed and strong-transfer errors decrease; weak-transfer errors can remain high. These are hypothetical outcomes, not trained-model measurements.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.strong{fill:#173147;font-weight:700}.muted{fill:#4c6375}.motion-only{display:inline}.still-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.still-only{display:inline!important}}</style>
