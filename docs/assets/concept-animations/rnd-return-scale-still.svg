<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 385" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">RND normalized reward static preview</title><desc id="svg-desc">Three counterfactual examples use identical raw bonus four but different standard deviations of intrinsic returns. The normalized bonus is four, two or one.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:19px;font-weight:700;fill:#29435d}.small{font-size:13px;fill:#526b84}.lbl{font-size:16px;font-weight:700;fill:#29435d}.line{stroke:#c3d2e0;stroke-width:2} .box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5} @media(prefers-reduced-motion:reduce){.motion-dot{display:none}}</style><rect width="380" height="385" rx="16" fill="#f7f9fd"/><text x="22" y="34" class="title">RND · REWARD SCALE</text><text x="22" y="56" class="small">Same raw error = 4 · illustrative cases</text><text x="25" y="91" class="small">Return σ</text><text x="166" y="91" class="small">Normalized bonus</text><rect x="22" y="113" width="336" height="62" rx="10" fill="#fff" stroke="#d3dfeb"/><rect x="35" y="127" width="70" height="32" rx="8" fill="#2876a7" opacity=".14"/><text x="70" y="149" text-anchor="middle" font-size="17" fill="#2876a7" font-weight="700">σ = 1</text><rect x="128" y="132" width="216" height="19" rx="7" fill="#e5edf5"/><rect x="128" y="132" width="216" height="19" rx="7" fill="#168a7d"/><text x="334" y="147" font-size="12" fill="white" text-anchor="end" font-weight="700">4.0</text><rect x="22" y="186" width="336" height="62" rx="10" fill="#fff" stroke="#d3dfeb"/><rect x="35" y="200" width="70" height="32" rx="8" fill="#148577" opacity=".14"/><text x="70" y="222" text-anchor="middle" font-size="17" fill="#148577" font-weight="700">σ = 2</text><rect x="128" y="205" width="216" height="19" rx="7" fill="#e5edf5"/><rect x="128" y="205" width="108" height="19" rx="7" fill="#168a7d"/><text x="226" y="220" font-size="12" fill="white" text-anchor="end" font-weight="700">2.0</text><rect x="22" y="259" width="336" height="62" rx="10" fill="#fff" stroke="#d3dfeb"/><rect x="35" y="273" width="70" height="32" rx="8" fill="#b4742a" opacity=".14"/><text x="70" y="295" text-anchor="middle" font-size="17" fill="#b4742a" font-weight="700">σ = 4</text><rect x="128" y="278" width="216" height="19" rx="7" fill="#e5edf5"/><rect x="128" y="278" width="54" height="19" rx="7" fill="#168a7d"/><text x="172" y="293" font-size="12" fill="#273e57" text-anchor="end" font-weight="700">1.0</text><text x="22" y="362" class="small">Divide by running return std, not mean-center</text></svg>