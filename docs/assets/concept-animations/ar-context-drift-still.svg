<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Diverging observed and generated prefixes</title><desc id="desc">Observed text We ate rice and sampled text We ate cake lead to different next-token contexts. Synthetic P(EOS) is 0.85 after rice versus 0.40 after cake.</desc><rect x="0" y="0" width="800" height="420" rx="16" fill="#f6fafc" stroke="#d9e6ee" stroke-width="1.5"/><text x="400" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#20374c">CONTEXT DRIFT</text><text x="400" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#61798c">Same start · different next-token context</text><rect x="24" y="85" width="752" height="206" rx="14" fill="#fff" stroke="#dce6ec" stroke-width="1.5"/><text x="52" y="118" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#257db4">Observed</text><text x="52" y="219" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#cf8133">Sampled</text><rect x="140" y="132" width="83" height="48" rx="11" fill="#fff" stroke="#257db4" stroke-width="1.5"/><text x="181.5" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#257db4">BOS</text><rect x="247" y="132" width="83" height="48" rx="11" fill="#fff" stroke="#257db4" stroke-width="1.5"/><text x="288.5" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#257db4">We</text><rect x="354" y="132" width="83" height="48" rx="11" fill="#fff" stroke="#257db4" stroke-width="1.5"/><text x="395.5" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#257db4">ate</text><path d="M224 156H240" stroke="#257db4" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M233 151L240 156 233 161" fill="none" stroke="#257db4" stroke-width="2"/><path d="M331 156H347" stroke="#257db4" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M340 151L347 156 340 161" fill="none" stroke="#257db4" stroke-width="2"/><rect x="140" y="232" width="83" height="48" rx="11" fill="#fff" stroke="#cf8133" stroke-width="1.5"/><text x="181.5" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#cf8133">BOS</text><rect x="247" y="232" width="83" height="48" rx="11" fill="#fff" stroke="#cf8133" stroke-width="1.5"/><text x="288.5" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#cf8133">We</text><rect x="354" y="232" width="83" height="48" rx="11" fill="#fff" stroke="#cf8133" stroke-width="1.5"/><text x="395.5" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#cf8133">ate</text><path d="M224 256H240" stroke="#cf8133" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M233 251L240 256 233 261" fill="none" stroke="#cf8133" stroke-width="2"/><path d="M331 256H347" stroke="#cf8133" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M340 251L347 256 340 261" fill="none" stroke="#cf8133" stroke-width="2"/><rect x="461" y="132" width="83" height="48" rx="11" fill="#fff" stroke="#257db4" stroke-width="1.5"/><text x="502.5" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="650" fill="#257db4">rice</text><path d="M438 156H455" stroke="#257db4" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M448 151L455 156 448 161" fill="none" stroke="#257db4" stroke-width="2"/><rect x="461" y="232" width="83" height="48" rx="11" fill="#fff" stroke="#cf8133" stroke-width="1.5"/><text x="502.5" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="1