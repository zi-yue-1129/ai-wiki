"650" text-anchor="middle">R</text><text x="278" y="300" font-size="21" font-weight="650" text-anchor="middle">¬R</text><path d="M357 295H425" stroke="#d5e2ec" stroke-width="3" stroke-linecap="round"/><path d="M418 290L425 295L418 300" fill="none" stroke="#d5e2ec" stroke-width="2"/><text x="387" y="283" font-size="11" text-anchor="middle" fill="#657c90">/R/</text><g class="resolution-output-2" opacity=".15"><text x="516" y="302" font-size="28" font-weight="750" text-anchor="middle" fill="#cc5965">□</text><animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.73;0.742;0.975;1" dur="12s" repeatCount="indefinite"/></g><g class="motion" opacity="0"><circle r="5" fill="#7856b5" stroke="white" stroke-width="1.5"><animateMotion path="M357 295L425 295" dur="4s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;0;1" keyTimes="0;.333333;.666667" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><text x="30" y="345" class="eyebrow" >CNF · REFUTATION</text><g opacity="0"><text x="460" y="345" font-size="13" font-weight="700" style="fill:#cc5965">UNSAT</text><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.72;.73;.75;.999;1" dur="12s" repeatCount="indefinite"/></g></svg>