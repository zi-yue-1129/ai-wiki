<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Resolution refutation: three complementary literal eliminations</title><desc id="desc">A propositional resolution proof: P or Q and not P or R derive Q or R, then not Q derives R, then not R derives the empty clause.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1b3448}.eyebrow{font-size:12px;letter-spacing:1.2px;font-weight:700;fill:#657c90}.node-label{font-size:15px;font-weight:700}.score{font-size:11px;fill:#657c90;font-weight:600}.key{font-size:12px;font-weight:700;fill:#1b3448}.hint{font-size:11px;fill:#657c90}.card{fill:white;stroke:#d5e2ec;stroke-width:1.4}@media(prefers-reduced-motion:reduce){.motion{display:none!important}}@media(prefers-reduced-motion:reduce){[class^="resolution-output-"],.resolution-derived-parent,.resolution-status{opacity:1!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f4f8fc" /><text x="27" y="30" class="eyebrow">RESOLUTION &#183; COMPLEMENTARY LITERALS</text><rect x="30.5" y="67" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="206.5" y="67" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="439.0" y="67" width="154" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><text x="102" y="100" font-size="21" font-weight="650" text-anchor="middle">P &#8744; Q</text><text x="278" y="100" font-size="21" font-weight="650" text-anchor="middle">&#172;P &#8744; R</text><path d="M357 95H425" stroke="#d5e2ec" stroke-width="3" stroke-linecap="round" /><path d="M418 90L425 95L418 100" fill="none" stroke="#d5e2ec" stroke-width="2" /><text x="387" y="83" font-size="11" text-anchor="middle" fill="#657c90">/P/</text><g class="resolution-output-0" opacity="0"><text x="516" y="102" font-size="28" font-weight="750" text-anchor="middle" fill="#0e9488">Q &#8744; R</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g><g class="motion" opacity="0"><circle r="5" fill="#7856b5" stroke="white" stroke-width="1.5" cx="357" cy="95"><animate attributeName="cx" values="357;425;425" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></circle><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite" /></g><rect x="30.5" y="167" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="206.5" y="167" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="439.0" y="167" width="154" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><g class="resolution-derived-parent" opacity="0"><text x="102" y="200" font-size="21" font-weight="650" text-anchor="middle">Q &#8744; R</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g><text x="278" y="200" font-size="21" font-weight="650" text-anchor="middle">&#172;Q</text><path d="M357 195H425" stroke="#d5e2ec" stroke-width="3" stroke-linecap="round" /><path d="M418 190L425 195L418 200" fill="none" stroke="#d5e2ec" stroke-width="2" /><text x="387" y="183" font-size="11" text-anchor="middle" fill="#657c90">/Q/</text><g class="resolution-output-1" opacity="0"><text x="516" y="202" font-size="28" font-weight="750" text-anchor="middle" fill="#0e9488">R</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g><g class="motion" opacity="0"><circle r="5" fill="#7856b5" stroke="white" stroke-width="1.5" cx="357" cy="195"><animate attributeName="cx" values="357;357;425;425" keyTimes="0;0.25;0.5;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></circle><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite" /></g><rect x="30.5" y="267" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="206.5" y="267" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><rect x="439.0" y="267" width="154" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4" /><g class="resolution-derived-parent" opacity="0"><text x="102" y="300" font-size="21" font-weight="650" text-anchor="middle">R</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g><text x="278" y="300" font-size="21" font-weight="650" text-anchor="middle">&#172;R</text><path d="M357 295H425" stroke="#d5e2ec" stroke-width="3" stroke-linecap="round" /><path d="M418 290L425 295L418 300" fill="none" stroke="#d5e2ec" stroke-width="2" /><text x="387" y="283" font-size="11" text-anchor="middle" fill="#657c90">/R/</text><g class="resolution-output-2" opacity="0"><text x="516" y="302" font-size="28" font-weight="750" text-anchor="middle" fill="#cc5965">&#9633;</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g><g class="motion" opacity="0"><circle r="5" fill="#7856b5" stroke="white" stroke-width="1.5" cx="357" cy="295"><animate attributeName="cx" values="357;357;425;425" keyTimes="0;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></circle><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite" /></g><text x="30" y="345" class="eyebrow">CNF &#183; REFUTATION</text><g opacity="0" class="resolution-status"><text x="460" y="345" font-size="13" font-weight="700" style="fill:#cc5965">UNSAT</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;.75;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></g></svg>
