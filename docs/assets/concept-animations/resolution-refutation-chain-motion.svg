<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Resolution refutation: three complementary literal eliminations</title><desc id="desc">A propositional resolution proof: P or Q and not P or R derive Q or R, then not Q derives R, then not R derives the empty clause.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1b3448}.eyebrow{font-size:12px;letter-spacing:1.2px;font-weight:700;fill:#657c90}.node-label{font-size:15px;font-weight:700}.score{font-size:11px;fill:#657c90;font-weight:600}.key{font-size:12px;font-weight:700;fill:#1b3448}.hint{font-size:11px;fill:#657c90}.card{fill:white;stroke:#d5e2ec;stroke-width:1.4}@media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f4f8fc"/><text x="27" y="30" class="eyebrow" >RESOLUTION · COMPLEMENTARY LITERALS</text><rect x="30.5" y="67" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4"/><rect x="206.5" y="67" width="143" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4"/><rect x="439.0" y="67" width="154" height="56" rx="11" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4"/><text x="102" y="100" font-size="21" font-weight="650" text-anchor="middle">P ∨ Q</text><text x="278" y="100" font-size="21" font-weight="650" text-anchor="middle">¬P ∨ R</text><path d="M357 95H425" stroke="#d5e2ec" stroke-width="3" stroke-linecap="round"/><path d="M418 90L425 95L418 100" fill="none" stroke="#d5e2ec" stroke-width="2"/><text x="387" y="83" font-size="11" text-anchor="middle" fill="#657c90">/P/</text><g class="resolution-output-0" opacity=".15"><text x="516" y="102" font-size="28" font-weight="750" text-anchor="middle" fill="#0e9488">Q ∨ R</text><animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.07;0.082;0.975;1" dur="12s" repeatCount="indefinite"/></g><g class="motion" opacity="0