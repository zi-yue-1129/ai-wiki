<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Repeated zero-alarm tests: unadjusted versus family-wise control</title><desc id="desc">Synthetic independent-batch example at the boundary false positive rate one sixth. Across one to ten prespecified batches, the chance of at least one zero-alarm result climbs to 36.95 percent for batches of seventeen negatives. Using thirty negatives per batch to satisfy Bonferroni alpha 0.005 for ten tests keeps the ten-test chance at 4.13 percent, below the 5 percent target. Curves are exact analytic probabilities, not measured performance.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.head{font-size:18px;font-weight:700}.label{font-size:12px;font-weight:600}.small{font-size:11px;fill:#637d8d}.tiny{font-size:10px;fill:#637d8d}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f0f7fb"/><text class="head" x="22" y="31">Repeated tests increase false passes</text><rect x="20" y="47" width="600" height="287" rx="12" fill="white" stroke="#d1e1ea"/><text class="label" x="75" y="74">Any pass at boundary p = 1/6</text><text class="small" x="324" y="74">independent batches</text><line x1="94" y1="118" x2="436" y2="118" stroke="#e4eef3"/><line x1="94" y1="198" x2="436" y2="198" stroke="#e4eef3"/><line x1="94" y1="278" x2="436" y2="278" stroke="#9db5c2"/><line x1="94" y1="118" x2="94" y2="278" stroke="#9db5c2"/><text class="tiny" x="86" y="122" text-anchor="end">42%</text><text class="tiny" x="86" y="202" text-anchor="end">21%</text><text class="tiny" x="86" y="282" text-anchor="end">0%</text><line x1="94" y1="258.95" x2="436" y2="258.95" stroke="#8a9eae" stroke-width="1.5" stroke-dasharray="5 4"/><text class="tiny" x="365" y="251.95">5% limit</text><path d="M94.00,260.83 L132.00,244.43 L170.00,228.77 L208.00,213.82 L246.00,199.54 L284.00,185.91 L322.00,172.89 L360.00,160.46 L398.00,148.58 L436.00,137.25" fill="none" stroke="#d27542" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M94.00,276.40 L132.00,274.80 L170.00,273.21 L208.00,271.62 L246.00,270.04 L284.00,268.47 L322.00,266.91 L360.00,265.35 L398.00,263.80 L436.00,262.25" fill="none" stroke="#237f87" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text class="tiny" x="94" y="295" text-anchor="middle">1</text><text class="tiny" x="246" y="295" text-anchor="middle">5</text><text class="tiny" x="436" y="295" text-anchor="middle">10</text><text class="label" x="268" y="317" text-anchor="middle">Number of tests (m)</text><rect x="469" y="89" width="133" height="217" rx="10" fill="#f1f7fa" stroke="#d3e4eb"/><text class="label" x="484" y="111">At m = 10</text><circle cx="486" cy="138" r="4.5" fill="#d27542"/><text class="small" x="496" y="141">Unadjusted</text><text class="head" x="485" y="165" style="font-size:21px;fill:#b96536">36.95%</text><text class="tiny" x="485" y="181">17 negatives / test</text><circle cx="486" cy="209" r="4.5" fill="#237f87"/><text class="small" x="496" y="212">Bonferroni</text><text class="head" x="485" y="237" style="font-size:21px;fill:#237f87">4.13%</text><text class="tiny" x="485" y="253">30 negatives / test</text><line x1="484" y1="266" x2="584" y2="266" stroke="#d3e4eb"/><text class="tiny" x="485" y="282">Family-wise α = 5%</text><text class="tiny" x="23" y="350">Analytic Bernoulli example · one fixed rule per batch · not model measurements</text><circle cx="436.00" cy="137.25" r="6.7" fill="#d27542" stroke="white" stroke-width="2.5"/><circle cx="436.00" cy="262.25" r="6.7" fill="#237f87" stroke="white" stroke-width="2.5"/></svg>