<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Unigram sampling concentration</title><desc id="desc">Seven possible segmentations of abab are normalized after raising each segmentation probability to alpha. Animated probability bars shift from flatter to more concentrated as alpha increases, then return.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f6f9fc" stroke="none" /><text x="24" y="35" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >Subword regularisation</text><text x="24" y="56" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" >abab · same pieces, different paths</text><rect x="470" y="21" width="146" height="28" rx="9" fill="#e9eefb" stroke="none" /><text x="485" y="40" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >low α  ⇄  high α</text><rect x="20" y="76" width="600" height="224" rx="15" fill="#fff" stroke="#d5e1eb" /><text x="44" y="100" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >Segmentation</text><text x="360" y="100" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >Sampling probability</text><rect x="36" y="109" width="192" height="29" rx="8" fill="#e1f4f0" stroke="none" /><text x="52" y="128" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >ab | ab</text><rect x="352" y="111" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="113" width="140.79" height="16" rx="4" fill="#008f88"><animate attributeName="width" values="62.61;87.75;140.79;186.61;199.85;186.61;140.79;87.75;62.61" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="12s" repeatCount="indefinite"/></rect><rect x="36" y="152" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="171" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >abab</text><rect x="352" y="154" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="156" width="44" height="16" rx="4" fill="#df8952"><animate attributeName="width" values="44.17;49.06;44.00;18.22;6.10;18.22;44.00;49.06;44.17" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="12s" repeatCount="indefinite"/></rect><rect x="36" y="195" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="214" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >a | bab</text><rect x="352" y="197" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="199" width="7.04" height="16" rx="4" fill="#6276b6"><animate attributeName="width" values="25.49;19.62;7.04;0.47;0.02;0.47;7.04;19.62;25.49" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="12s" repeatCount="indefinite"/></rect><rect x="36" y="238" width="192" height="29" rx="8" fill="#f0f4f8" stroke="none" /><text x="52" y="257" fill="#18324b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" >other 4</text><rect x="352" y="240" width="210" height="20" rx="5" fill="#edf2f7" stroke="none" /><rect x="354" y="242" width="14.17" height="16" rx="4" fill="#b6c5d3"><animate attributeName="width" values="73.74;49.57;14.17;0.70;0.03;0.70;14.17;49.57;73.74" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="12s" repeatCount="indefinite"/></rect><text x="354" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" >0</text><text x="456" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="middle">50%</text><text x="563" y="291" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="end">100%</text><path d="M 88 326 H 550" stroke="#d5e1eb" stroke-width="7" stroke-linecap="round"/><path d="M 88 326 H 550" stroke="#6276b6" stroke-width="2.2" stroke-linecap="round"/><text x="30" y="329" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >α .3</text><text x="556" y="329" fill="#6276b6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" >3.0</text><circle cx="208" cy="326" r="10" fill="#6276b6" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="88;122;208;379;550;379;208;122;88" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="12s" repeatCount="indefinite"/></circle><text x="320" y="354" fill="#617489" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="middle">7 valid segmentations · illustrative, not measured</text></svg>
