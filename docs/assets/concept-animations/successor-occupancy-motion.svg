<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Successor representation: discounted visitation and reward revaluation</title><desc id="desc">Discounted visits accumulate along a deterministic five-state terminal chain. The reward moves from S4 to S2 after the visits accumulate; the occupancy weights remain fixed, while the starting-state value changes from 0.24 to 0.49.</desc><rect width="640" height="360" rx="16" fill="#f5f9fc" /><style>text{font-family:Arial,Helvetica,sans-serif;fill:#233c50}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#698295}.muted{font-size:12px;fill:#698295}.label{font-size:13px;font-weight:700}</style><text x="28" y="35" class="eyebrow">SUCCESSOR OCCUPANCY</text><text x="29" y="60" class="muted">One episodic trajectory · γ = 0.7</text><rect x="28" y="74" width="584" height="237" rx="13" fill="white" stroke="#d7e3eb" /><text x="46" y="100" class="muted">STATES</text><path d="M115 145 H176" stroke="#d7e3eb" stroke-width="3" /><path d="M172 140 L178 145 L172 150" fill="none" stroke="#698295" stroke-width="2" /><circle cx="90" cy="145" r="22" fill="#f6fafc" stroke="#3b7fbb" stroke-width="2" /><text x="90" y="150" text-anchor="middle" class="label">S0</text><path d="M230 145 H291" stroke="#d7e3eb" stroke-width="3" /><path d="M287 140 L293 145 L287 150" fill="none" stroke="#698295" stroke-width="2" /><circle cx="205" cy="145" r="22" fill="#f6fafc" stroke="#3b7fbb" stroke-width="2" /><text x="205" y="150" text-anchor="middle" class="label">S1</text><path d="M345 145 H406" stroke="#d7e3eb" stroke-width="3" /><path d="M402 140 L408 145 L402 150" fill="none" stroke="#698295" stroke-width="2" /><circle cx="320" cy="145" r="22" fill="#f6fafc" stroke="#3b7fbb" stroke-width="2" /><text x="320" y="150" text-anchor="middle" class="label">S2</text><path d="M460 145 H521" stroke="#d7e3eb" stroke-width="3" /><path d="M517 140 L523 145 L517 150" fill="none" stroke="#698295" stroke-width="2" /><circle cx="435" cy="145" r="22" fill="#f6fafc" stroke="#3b7fbb" stroke-width="2" /><text x="435" y="150" text-anchor="middle" class="label">S3</text><circle cx="550" cy="145" r="22" fill="#f6fafc" stroke="#3b7fbb" stroke-width="2" /><text x="550" y="150" text-anchor="middle" class="label">S4</text><circle cx="90.00" cy="111" r="6" fill="#e79540" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="90;205;320;435;550;550" dur="12s" calcMode="linear" repeatCount="indefinite" keyTimes="0;.15;.3;.45;.6;1" /></circle><text x="46" y="207" class="muted">DISCOUNTED VISITS</text><rect x="72" y="223.0" width="36" height="50.0" rx="4" fill="#14867d"><animate attributeName="y" values="223.0;223.0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;1" /><animate attributeName="height" values="50.0;50.0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;1" /></rect><path d="M66 273 H114" stroke="#d7e3eb" stroke-width="2" /><text x="90" y="297" class="muted" text-anchor="middle">1.00</text><rect x="187" y="273" width="36" height="0" rx="4" fill="#14867d"><animate attributeName="y" values="273;238.0;238.0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.15000000;1" /><animate attributeName="height" values="0;35.0;35.0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.15000000;1" /></rect><path d="M181 273 H229" stroke="#d7e3eb" stroke-width="2" /><text x="205" y="297" class="muted" text-anchor="middle">0.70</text><rect x="302" y="273" width="36" height="0" rx="4" fill="#14867d"><animate attributeName="y" values="273;248.5;248.5" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.30000000;1" /><animate attributeName="height" values="0;24.499999999999996;24.499999999999996" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.30000000;1" /></rect><path d="M296 273 H344" stroke="#d7e3eb" stroke-width="2" /><text x="320" y="297" class="muted" text-anchor="middle">0.49</text><rect x="417" y="273" width="36" height="0" rx="4" fill="#14867d"><animate attributeName="y" values="273;255.85;255.85" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.45000000;1" /><animate attributeName="height" values="0;17.149999999999995;17.149999999999995" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.45000000;1" /></rect><path d="M411 273 H459" stroke="#d7e3eb" stroke-width="2" /><text x="435" y="297" class="muted" text-anchor="middle">0.34</text><rect x="532" y="273" width="36" height="0" rx="4" fill="#14867d"><animate attributeName="y" values="273;260.995;260.995" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.60000000;1" /><animate attributeName="height" values="0;12.004999999999997;12.004999999999997" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;0.60000000;1" /></rect><path d="M526 273 H574" stroke="#d7e3eb" stroke-width="2" /><text x="550" y="297" class="muted" text-anchor="middle">0.24</text><circle cx="574" cy="115" r="7" fill="#816ac1" opacity="1"><animate attributeName="opacity" values="1;0;0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;.8;1" /></circle><circle cx="344" cy="115" r="7" fill="#816ac1" opacity="0"><animate attributeName="opacity" values="0;1;1" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;.8;1" /></circle><text x="591" y="59" font-size="14" font-weight="700" text-anchor="end" opacity="0">V=0.24<animate attributeName="opacity" values="0;1;0;0" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;.6;.8;1" /></text><text x="591" y="59" font-size="14" font-weight="700" text-anchor="end" opacity="0">V=0.49<animate attributeName="opacity" values="0;1;1" dur="12s" calcMode="discrete" repeatCount="indefinite" keyTimes="0;.8;1" /></text><text x="28" y="337" class="muted">S4 reward → S2 reward: M fixed, V(S0) changes</text></svg>