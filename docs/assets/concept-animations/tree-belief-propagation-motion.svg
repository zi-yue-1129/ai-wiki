 stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-b)"/><path d="M410 181 L354 181" fill="none" stroke="#376ca8" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-b)"/><circle cx="320" cy="181" r="35" fill="none" stroke="#0f766e" stroke-width="3"/><text x="320" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#24354a">Leaf messages collect at the root</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g class="frame" opacity="0"><rect x="328" y="18" width="136" height="40" rx="9" fill="#7753a6" stroke="#7753a6" stroke-width="1"/><text x="396" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#fff">3  Distribute</text><path d="M289 181 L231 181" fill="none" stroke="#7753a6" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-p)"/><path d="M176 181 L119 181" fill="none" stroke="#7753a6" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-p)"/><path d="M351 181 L409 181" fill="none" stroke="#7753a6" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-p)"/><path d="M464 181 L521 181" fill="none" stroke="#7753a6" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-p)"/><circle cx="86" cy="181" r="35" fill="none" stroke="#7753a6" stroke-width="3"/><circle cx="554" cy="181" r="35" fill="none" stroke="#7753a6" stroke-width="3"/><text x="320" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#24354a">Send outward messages, excluding recipient</text><animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g class="frame" opacity="0"><rect x="480" y="18" width="136" height="40" rx="9" fill="#c47736" stroke="#c47736" stroke-width="1"/>