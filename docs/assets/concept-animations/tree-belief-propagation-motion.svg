<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Belief propagation: tree message schedule</title><desc id="desc">Tree-structured binary factor graph: apply unary evidence, collect messages from leaves to centre, distribute messages back to leaves, and normalise exact node marginals. Bars are calculated from illustrative potentials.</desc><defs><marker id="arrow-t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#376ca8" stroke-width="1.5"/></marker><marker id="arrow-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7753a6" stroke-width="1.5"/></marker><marker id="arrow-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c47736" stroke-width="1.5"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.frame{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#d7e2eb" stroke-width="1"/><rect x="24" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="92" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">1  Evidence</text><rect x="176" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="244" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">2  Collect</text><rect x="328" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="396" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">3  Distribute</text><rect x="480" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="548" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">4  Marginals</text><rect x="26" y="311" width="588" height="35" rx="8" fill="#edf4f8" stroke="#edf4f8" stroke-width="0"/><path d="M116 181 L176 181" fill="none" stroke="#d7e2eb" stroke-width="3" stroke-linecap="round"  /><path d="M228 181 L289 181" fill="none" stroke="#d7e2eb" stroke-width="3" stroke-linecap="round"  /><path d="M351 181 L412 181" fill="none" stroke="#d7e2eb" stroke-width="3" stroke-linecap="round"  /><path d="M464 181 L524 181" fill="none" stroke="#d7e2eb" stroke-width="3" stroke-linecap="round"  /><circle cx="86" cy="181" r="31" fill="#fff" stroke="#d7e2eb" stroke-width="2"/><text x="86" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">X1</text><circle cx="320" cy="181" r="31" fill="#fff" stroke="#d7e2eb" stroke-width="2"/><text x="320" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">X2</text><circle cx="554" cy="181" r="31" fill="#fff" stroke="#d7e2eb" stroke-width="2"/><text x="554" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">X3</text><rect x="176" y="155" width="52" height="52" rx="8" fill="#fff" stroke="#d7e2eb" stroke-width="2"/><text x="202" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#61758a">f12</text><rect x="412" y="155" width="52" height="52" rx="8" fill="#fff" stroke="#d7e2eb" stroke-width="2"/><text x="438" y="186" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#61758a">f23</t