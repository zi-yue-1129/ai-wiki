<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">MiniLLM on-policy reverse KL</title><desc id="desc">A uniform draw of 0.72 selects sequence C from the student distribution. Its teacher probability is smaller. The log ratio reward is negative; the full reverse KL is positive.</desc><rect x="1" y="1" width="638" height="358" rx="12" fill="#f9fbfe" stroke="#dae5ef"/><g font-family="Arial,Helvetica,sans-serif" font-weight="600"><text x="26" y="31" font-size="19" fill="#23364a" text-anchor="start">ON-POLICY SAMPLE</text><text x="26" y="62" font-size="17" fill="#23364a" text-anchor="start">Student q</text><rect x="26" y="77" width="174.4" height="48" rx="4" fill="#35678f" stroke="none"/><text x="114.2" y="98" font-size="17" fill="white" text-anchor="middle">A</text><text x="114.2" y="117" font-size="15" fill="white" text-anchor="middle">0.30</text><rect x="202.4" y="77" width="115.60000000000001" height="48" rx="4" fill="#35678f" stroke="none"/><text x="261.2" y="98" font-size="17" fill="white" text-anchor="middle">B</text><text x="261.2" y="117" font-size="15" fill="white" text-anchor="middle">0.20</text><rect x="320" y="77" width="292" height="48" rx="4" fill="#a26420" stroke="none"/><text x="467" y="98" font-size="17" fill="white" text-anchor="middle">C</text><text x="467" y="117" font-size="15" fill="white" text-anchor="middle">0.50</text><g opacity="1"><circle cx="449" cy="139" r="5" fill="#a26420"></circle></g><g opacity="1"><path d="M449 127V133" fill="none" stroke="#a26420" stroke-width="2" stroke-linecap="round"/><text x="449" y="163" font-size="16" fill="#a26420" text-anchor="middle">u = 0.72 → C</text></g><path d="M26 176H614" fill="none" stroke="#dae5ef" stroke-width="2" stroke-linecap="round"/><text x="26" y="201" font-size="17" fill="#23364a" text-anchor="start">Teacher p</text><rect x="26" y="212" width="262.6" height="40" rx="4" fill="#35678f" stroke="none"/><text x="158.3" y="237" font-size="15" fill="white" text-anchor="middle">A 0.45</text><rect x="290.6" y="212" width="262.6" height="40" rx="4" fill="#35678f" stroke="none"/><text x="422.90000000000003" y="237" font-size="15" fill="white" text-anchor="middle">B 0.45</text><rect x="555.2" y="212" width="56.800000000000004" height="40" rx="4" fill="#a26420" stroke="none"/><text x="584.6" y="237" font-size="15" fill="white" text-anchor="middle">C 0.10</text><g opacity="1"><path d="M449 170V184H585V209" fill="none" stroke="#a26420" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"></path><rect x="553" y="208" width="64" height="48" rx="6" fill="none" stroke="#a26420" stroke-width="2"/></g><path d="M26 270H614" fill="none" stroke="#dae5ef" stroke-width="2" stroke-linecap="round"/><g opacity="1"><rect x="26" y="284" width="280" height="52" rx="7" fill="#e6edf4" stroke="none"/><text x="166" y="306" font-size="16" fill="#23364a" text-anchor="middle">log(p(C) / q(C))</text><text x="166" y="326" font-size="19" fill="#a26420" text-anchor="middle">−1.609</text><rect x="330" y="284" width="284" height="52" rx="7" fill="#e6edf4" stroke="none"/><text x="472" y="306" font-size="16" fill="#23364a" text-anchor="middle">Reverse KL (all)</text><text x="472" y="326" font-size="19" fill="#08756e" text-anchor="middle">0.521</text></g></g></svg>
