ight="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="213" y="262" class="label" text-anchor="middle">WAIT</text><rect x="282" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="321" y="262" class="cell" text-anchor="middle">1</text><rect x="390" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="429" y="262" class="cell" text-anchor="middle">2</text><rect x="498" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="537" y="262" class="cell" text-anchor="middle">3</text><text x="29" y="334" class="note" >B exits after t1; C joins at t2</text></svg>