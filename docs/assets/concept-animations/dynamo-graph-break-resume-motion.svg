<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Execution across a graph break</title><desc id="desc">Input 2 passes through compiled addition, Python printing, and compiled multiplication. The values are 2, 3, 3, and 6.</desc><g font-family="system-ui,sans-serif"><rect x="1" y="1" width="638" height="358" rx="14" fill="#f8fafc" stroke="#cad5e2" stroke-width="2"/><text x="320" y="38" font-size="30" fill="#172b44" text-anchor="middle" font-weight="600">Graph break</text><text x="320" y="72" font-size="24" fill="#61758c" text-anchor="middle" font-weight="600">Compiled  →  Python  →  Compiled</text><rect x="25" y="102" width="172" height="116" rx="9" fill="#e6f5f2" stroke="#087f73" stroke-width="2"/><text x="111" y="141" font-size="26" fill="#087f73" text-anchor="middle" font-weight="600">Graph A</text><text x="111" y="186" font-size="30" fill="#172b44" text-anchor="middle" font-weight="600">+ 1</text><path d="M201 160 H229 M220 152 L229 160 L220 168" fill="none" stroke="#61758c" stroke-width="3"/><rect x="234" y="102" width="172" height="116" rx="9" fill="#fff2df" stroke="#a65a12" stroke-width="2"/><text x="320" y="141" font-size="26" fill="#a65a12" text-anchor="middle" font-weight="600">Python</text><text x="320" y="186" font-size="30" fill="#172b44" text-anchor="middle" font-weight="600">print(3)</text><path d="M410 160 H438 M429 152 L438 160 L429 168" fill="none" stroke="#61758c" stroke-width="3"/><rect x="443" y="102" width="172" height="116" rx="9" fill="#e6f5f2" stroke="#087f73" stroke-width="2"/><text x="529" y="141" font-size="26" fill="#087f73" text-anchor="middle" font-weight="600">Graph B</text><text x="529" y="186" font-size="30" fill="#172b44" text-anchor="middle" font-weight="600">× 2</text><text x="43" y="254" font-size="30" fill="#172b44" text-anchor="middle" font-weight="600">2</text><text x="43" y="282" font-size="20" fill="#61758c" text-anchor="middle" font-weight="600">Input</text><path d="M82 247 H602 M590 239 L602 247 L590 255" fill="none" stroke="#cad5e2" stroke-width="3"/><g id="value-0" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="80" y="267" width="62" height="45" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="111" y="300" font-size="28" fill="#087f73" text-anchor="middle" font-weight="600">3</text></g><g id="value-1" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="289" y="267" width="62" height="45" rx="9" fill="#ffffff" stroke="#a65a12" stroke-width="2"/><text x="320" y="300" font-size="28" fill="#a65a12" text-anchor="middle" font-weight="600">3</text></g><g id="value-2" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="498" y="267" width="62" height="45" rx="9" fill="#ffffff" stroke="#087f73" stroke-width="2"/><text x="529" y="300" font-size="28" fill="#087f73" text-anchor="middle" font-weight="600">6</text></g><text x="111" y="340" font-size="22" fill="#61758c" text-anchor="middle" font-weight="600">Tensor</text><text x="320" y="340" font-size="22" fill="#61758c" text-anchor="middle" font-weight="600">Printed</text><text x="529" y="340" font-size="22" fill="#61758c" text-anchor="middle" font-weight="600">Output</text><circle cx="82" cy="247" r="8" fill="#6851a5"><animate attributeName="cx" values="82;111;111;320;320;529;529;529" keyTimes="0;0.20;0.25;0.45;0.50;0.70;0.75;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.75;0.9;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><rect x="25" y="102" width="172" height="116" rx="9" fill="none" stroke="#087f73" stroke-width="5" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.25;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><rect x="234" y="102" width="172" height="116" rx="9" fill="none" stroke="#a65a12" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><rect x="443" y="102" width="172" height="116" rx="9" fill="none" stroke="#087f73" stroke-width="5" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect></g></svg>
