<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Disaggregated serving: prompt prefill, KV cache transfer and token decoding</title><desc id="desc">A four-phase teaching animation shows prompt processing in a prefill pool, KV-cache blocks being built and transferred, and token generation in a separate decoding pool. No timing or hardware utilization is measured.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5c7889"/></marker></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#24465b}.head{font-size:18px;font-weight:750;letter-spacing:.65px}.label{font-size:13px;font-weight:700;letter-spacing:.7px}.small{font-size:11.5px;fill:#5c7889}.token{font-size:15px;font-weight:750}.stage{opacity:0}@media(prefers-reduced-motion:reduce){.stage{opacity:0!important}.stage-0{opacity:1!important}}</style><rect width="640" height="360" rx="16" fill="#f5f9fc"/><text x="28" y="35" class="head" >PREFILL → DECODE</text><text x="28" y="56" class="small" >KV cache handoff</text><rect x="28" y="84" width="192" height="205" rx="14" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="124" y="109" class="label" text-anchor="middle">PREFILL</text><rect x="54" y="127" width="140" height="98" rx="12" fill="#e5eff8" stroke="#427eae" stroke-width="1.5"/><text x="124" y="151" class="small" text-anchor="middle">PROMPT</text><rect x="74" y="166" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="109" y="166" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="144" y="166" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="74" y="192" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="109" y="192" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="144" y="192" width="26" height="19" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1.2"/><rect x="246" y="119" width="146" height="147" rx="14" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="319" y="146" class="label" text-anchor="middle">KV TRANSFER</text><path d="M265 207 L373 207" fill="none" stroke="#5c7889" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="319" y="247" class="small" text-anchor="middle">KV BLOCKS</text><rect x="418" y="84" width="194" height="205" rx="14" fill="#fff" stroke="#c8d9e4" stroke-width="1.5"/><text x="515" y="109" class="label" text-anchor="middle">DECODE</text><rect x="440" y="128" width="150" height="97" rx="12" fill="#e5eff8" stroke="#427eae" stroke-width="1.5"/><text x="515" y="153" class="small" text-anchor="middle">TOKENS</text><text x="28" y="324" class="small" >1  PROMPT</text><text x="184" y="324" class="small" >2  BUILD KV</text><text x="348" y="324" class="small" >3  MOVE KV</text><text x="502" y="324" class="small" >4  GENERATE</text><path d="M220 186 L245 186" fill="none" stroke="#5c7889" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M392 186 L417 186" fill="none" stroke="#5c7889" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><g class="stage stage-0" opacity="1"><rect x="54" y="127" width="140" height="98" rx="12" fill="none" stroke="#c38a37" stroke-width="3"/><circle cx="124" cy="184" r="11" fill="#c38a37"/><animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g><g class="stage stage-1" opacity="0"><rect x="54" y="127" width="140" height="98" rx="12" fill="none" stroke="#c38a37" stroke-width="3"/><rect x="74" y="166" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><rect x="109" y="166" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><rect x="144" y="166" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><rect x="74" y="192" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><rect x="109" y="192" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><rect x="144" y="192" width="26" height="19" rx="4" fill="#fff0d7" stroke="#168b82" stroke-width="1.2"/><animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g><g class="stage stage-2" opacity="0"><rect x="246" y="119" width="146" height="147" rx="12" fill="none" stroke="#c38a37" stroke-width="3"/><rect x="272" y="177" width="20" height="19" rx="3" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><rect x="309" y="177" width="20" height="19" rx="3" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><rect x="346" y="177" width="20" height="19" rx="3" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g><g class="stage stage-3" opacity="0"><rect x="440" y="128" width="150" height="97" rx="12" fill="none" stroke="#c38a37" stroke-width="3"/><rect x="458" y="177" width="22" height="23" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><rect x="489" y="177" width="22" height="23" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><rect x="520" y="177" width="22" height="23" rx="4" fill="#dff5ef" stroke="#168b82" stroke-width="1"/><rect x="551" y="177" width="22" height="23" rx="4" fill="#fff0d7" stroke="#c38a37" stroke-width="1"/><animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/></g></svg>