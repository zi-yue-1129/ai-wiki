<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CTC: path vs. transcript probability</title><desc id="desc">Two frames each assign blank probability 0.6 and A probability 0.4. Greedy blank-blank has probability 0.36, but the three paths collapsing to A sum to 0.64, the most probable transcript.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa" stroke="none"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">CTC: path vs. transcript probability</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff" stroke="none"/><text x="82" y="78" font-size="17" fill="#233b52" text-anchor="middle">Path</text><text x="202" y="78" font-size="17" fill="#233b52" text-anchor="middle">Mass</text><text x="478" y="78" font-size="17" fill="#233b52" text-anchor="middle">Transcript mass</text><text x="508" y="102" font-size="20" fill="#233b52" text-anchor="middle">Empty</text><text x="508" y="217" font-size="20" fill="#233b52" text-anchor="middle">A</text><rect x="38" y="95" width="45" height="34" rx="5" fill="#e9f2f9" stroke="none"/><rect x="87" y="95" width="45" height="34" rx="5" fill="#e9f2f9" stroke="none"/><text x="60.5" y="119" font-size="20" fill="#21678d" text-anchor="middle">∅</text><text x="109.5" y="119" font-size="20" fill="#21678d" text-anchor="middle">∅</text><text x="202" y="119" font-size="20" fill="#233b52" text-anchor="middle">36%</text><path d="M244 112 L303 112 L390 127" fill="none" stroke="#a7b8c5" stroke-width="2" stroke-linejoin="round"/><text x="155" y="119" font-size="13" fill="#a95516" text-anchor="middle">Greedy</text><rect x="38" y="150" width="45" height="34" rx="5" fill="#e9f2f9" stroke="none"/><rect x="87"