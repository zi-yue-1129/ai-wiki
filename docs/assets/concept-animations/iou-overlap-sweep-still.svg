<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Intersection over union: moving masks</title><desc id="desc">The orange predicted mask continuously slides across the fixed blue reference mask; the green region is their intersection, and the IoU score follows the overlap-to-union ratio.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20364d}.head{font-weight:700;font-size:21px}.tag{font-size:13px;font-weight:600}.sub{font-size:12px;fill:#64748b}.num{font-size:14px;font-weight:700}</style><rect width="640" height="360" rx="18" fill="#f8fbfe"/><rect x="12" y="12" width="616" height="336" rx="15" fill="white" stroke="#d7e1eb"/><text x="32" y="44" class="head">Intersection / Union</text><text x="32" y="67" class="sub">Slide a prediction across a fixed reference</text><rect x="30" y="81" width="580" height="166" rx="12" fill="#f3f7fa" stroke="#d7e1eb"/><path d="M44 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M93 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M142 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M191 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M240 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M289 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M338 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M387 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M436 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M485 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M534 88V238" stroke="#e5edf4" stroke-width="1"/><path d="M583 88V238" stroke="#e5edf4" stroke-width="1"/><rect x="210" y="109" width="140" height="115" fill="#3f77b6" fill-opacity=".25"/><clipPath id="gtClip"><rect x="210" y="109" width="140" height="115"/></clipPath><rect x="280" y="109" width="140" height="115" fill="#d8874f" fill-opacity=".30" stroke="none"></rect><g clip-path="url(#gtClip)"><rect x="280" y="109" width="140" height="115" fill="#159987" fill-opacity=".80"></rect></g><rect x="210" y="109" width="140" height="115" fill="none" stroke="#3f77b6" stroke-width="2.5" rx="1"/><rect x="280" y="109" width="140" height="115" fill="none" stroke="#d8874f" stroke-width="2.5"></rect><text x="215" y="101" class="tag" fill="#3f77b6" style="fill:#3f77b6">GT</text><text x="280" y="236" class="tag" style="fill:#d8874f">Pred</text><text x="33" y="277" class="tag">IoU</text><rect x="104" y="259" width="481" height="20" rx="10" fill="#e8eff4"/><rect x="104" y="259" width="160.33" height="20" rx="10" fill="#159987" fill-opacity=".80"></rect><circle cx="264.33" cy="269" r="8" fill="#159987" stroke="white" stroke-width="2"></circle><text x="104" y="299" class="sub">0</text><text x="585" y="299" class="sub" text-anchor="end">1</text><circle cx="49" cy="327" r="6" fill="#3f77b6" fill-opacity=".8"/><text x="61" y="331" class="sub">Reference</text><circle cx="176" cy="327" r="6" fill="#d8874f"/><text x="188" y="331" class="sub">Prediction</text><circle cx="307" cy="327" r="6" fill="#159987"/><text x="319" y="331" class="sub">Intersection</text><text x="586" y="330" class="num" text-anchor="end">70 / 210 = 0.333</text></svg>