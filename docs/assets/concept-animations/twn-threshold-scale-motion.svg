ct x="505" y="223" width="70" height="34" rx="5" fill="#08756e"/><text x="540" y="246" font-size="19" fill="#fff" text-anchor="middle">+1</text><rect x="505" y="270" width="70" height="34" rx="5" fill="#08756e"/><text x="540" y="293" font-size="18" fill="#fff" text-anchor="middle">+0.9</text><text x="320" y="346" font-size="18" fill="#1b3651" text-anchor="middle">α = (1 + 0.8) / 2 = 0.9     ·     SSE = 0.22</text></g></svg>