<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><title id="title">Ternary weights: threshold and shared scale</title><desc id="description">A magnitude threshold removes two weights; the mean surviving magnitude gives the shared scale and reconstructed ternary weights.</desc><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.fallback{display:inline}}</style><g class="moving"><rect x="0" y="0" width="640" height="360" rx="14" fill="#f7fbff"/><text x="22" y="34" font-size="23" fill="#1b3651" text-anchor="start">TWN · threshold and shared scale</text><text x="22" y="59" font-size="16" fill="#1b3651" text-anchor="start">Δ = 0.7 × mean |w| = 0.42</text><rect x="16" y="73" width="608" height="250" rx="9" fill="#fff"/><text x="28" y="97" font-size="15" fill="#1b3651" text-anchor="start">Weight</text><text x="28" y="135" font-size="15" fill="#1b3651" text-anchor="start">|w|</text><text x="28" y="246" font-size="15" fill="#1b3651" text-anchor="start">Code</text><text x="28" y="292" font-size="15" fill="#1b3651" text-anchor="start">α × code</text><text x="180" y="97" font-size="18" fill="#1b3651" text-anchor="middle">-1.0</text><rect x="158" y="100" width="44" height="100" rx="4" fill="#35678f"/><text x="300" y="97" font-size="18" fill="#1b3651" text-anchor="middle">-0.2</text><rect x="278" y="180" width="44" height="20" rx="4" fill="#35678f"/><text x="420" y="97" font-size="18" fill="#1b3651" text-anchor="middle">0.4</text><rect x="398" y="160" width="44" height="40" rx="4" fill="#35678f"/><text x="540" y="97" font-size="18" fill="#1b3651" text-anchor="middle">0.8</text><rect x="518" y="120" width="44" height="80" rx="4" fill="#35678f"/><rect id="threshold-band" x="126" y="200" width="468" height="0" fill="#a26420" opacity="0.15"><animate attributeName="y" values="200;200;158;158" keyTimes="0;0.1;0.4;1" dur="12s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="height" values="0;0;42;42" keyTimes="0;0.1;0.4;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></rect><line id="threshold-line" x1="126" x2="594" y1="200" y2="200" stroke="#a26420" stroke-width="2" stroke-dasharray="6 4"><animate attributeName="y1" values="200;200;158;158" keyTimes="0;0.1;0.4;1" dur="12s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="y2" values="200;200;158;158" keyTimes="0;0.1;0.4;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><g opacity="0"><text x="116" y="163" font-size="15" fill="#a26420" text-anchor="end">0.42</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><line x1="126" y1="201" x2="594" y2="201" stroke="#dbe5ed" stroke-width="2" /><g opacity="0"><rect x="145" y="223" width="70" height="34" rx="5" fill="#08756e"/><text x="180" y="246" font-size="19" fill="#fff" text-anchor="middle">−1</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.46;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="145" y="270" width="70" height="34" rx="5" fill="#08756e"/><text x="180" y="293" font-size="18" fill="#fff" text-anchor="middle">−0.9</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="265" y="223" width="70" height="34" rx="5" fill="#e6edf2"/><text x="300" y="246" font-size="19" fill="#1b3651" text-anchor="middle">0</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.46;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="265" y="270" width="70" height="34" rx="5" fill="#e6edf2"/><text x="300" y="293" font-size="18" fill="#1b3651" text-anchor="middle">0</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="385" y="223" width="70" height="34" rx="5" fill="#e6edf2"/><text x="420" y="246" font-size="19" fill="#1b3651" text-anchor="middle">0</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.46;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="385" y="270" width="70" height="34" rx="5" fill="#e6edf2"/><text x="420" y="293" font-size="18" fill="#1b3651" text-anchor="middle">0</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="505" y="223" width="70" height="34" rx="5" fill="#08756e"/><text x="540" y="246" font-size="19" fill="#fff" text-anchor="middle">+1</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.46;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><rect x="505" y="270" width="70" height="34" rx="5" fill="#08756e"/><text x="540" y="293" font-size="18" fill="#fff" text-anchor="middle">+0.9</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="320" y="346" font-size="18" fill="#1b3651" text-anchor="middle">α = (1 + 0.8) / 2 = 0.9     ·     SSE = 0.22</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g></g><g class="fallback"><rect x="0" y="0" width="640" height="360" rx="14" fill="#f7fbff"/><text x="22" y="34" font-size="23" fill="#1b3651" text-anchor="start">TWN · threshold and shared scale</text><text x="22" y="59" font-size="16" fill="#1b3651" text-anchor="start">Δ = 0.7 × mean |w| = 0.42</text><rect x="16" y="73" width="608" height="250" rx="9" fill="#fff"/><text x="28" y="97" font-size="15" fill="#1b3651" text-anchor="start">Weight</text><text x="28" y="135" font-size="15" fill="#1b3651" text-anchor="start">|w|</text><t