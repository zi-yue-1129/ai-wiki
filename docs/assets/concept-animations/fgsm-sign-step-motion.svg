<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FGSM: input-gradient sign step</title><desc id="desc">The unconstrained gradient points northeast; the sign-gradient perturbation moves equally along both input coordinates to the upper-right corner of an L-infinity square. On a linearised loss, the increase reaches 1.35 for epsilon one. Hand-chosen analytic inputs, not measured model outputs.</desc><style>.hd{font:700 18px Arial,Helvetica,sans-serif;fill:#18354c}.sub{font:700 13px Arial,Helvetica,sans-serif;fill:#18354c}.txt{font:12px Arial,Helvetica,sans-serif;fill:#6c8192}.num{font:700 12px Arial,Helvetica,sans-serif;fill:#18354c}</style><defs><marker id="tipT" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#058e89"/></marker><marker id="tipO" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#dd8734"/></marker></defs><rect width="640" height="360" fill="#f5f8fb"/><text x="24" y="34" class="hd">FGSM · One sign-gradient step</text><text x="616" y="32" text-anchor="end" class="txt">ANALYTIC EXAMPLE</text><rect x="24" y="52" width="309" height="294" rx="13" fill="white" stroke="#cddbe6"/><rect x="347" y="52" width="269" height="294" rx="13" fill="white" stroke="#cddbe6"/><text x="41" y="78" class="sub">Input perturbation</text><text x="41" y="97" class="txt">ℓ∞ budget</text><rect x="103" y="126" width="170" height="170" rx="5" fill="#e8f5f3" stroke="#058e89" stroke-dasharray="6 4" stroke-width="1.6"/><path d="M188 126 V296 M103 211 H273" stroke="#cddbe6" stroke-width="1"/><circle cx="188" cy="211" r="5.5" fill="#4a78af" stroke="white" stroke-width="2"/><text x="169" y="231" class="txt">x</text><line x1="188" y1="211" x2="246" y2="182" stroke="#dd8734" stroke-width="3.5" marker-end="url(#tipO)"/><text x="249" y="186" class="num">g</text><path d="M188 211 L273 126" stroke="#058e89" stroke-width="1.8" stroke-dasharray="4 5" opacity=".5"/><text x="278" y="137" class="txt">ε</text><text x="107" y="315" class="txt">−ε</text><text x="265" y="315" class="txt">+ε</text><text x="41" y="336" class="txt">g = (0.90, 0.45)</text><text x="364" y="78" class="sub">First-order loss gain</text><text x="364" y="100" class="txt">ΔJ ≈ g · δ</text><path d="M391 141 V285 H591" fill="none" stroke="#cddbe6" stroke-width="1.6"/><path d="M391 285 L585 155" fill="none" stroke="#dd8734" stroke-width="2.2" stroke-dasharray="5 5" opacity=".6"/><text x="376" y="287" class="txt">0</text><text x="377" y="153" class="txt">1.35</text><text x="389" y="309" class="txt">0</text><text x="575" y="309" class="txt">ε</text><text x="475" y="330" class="txt">Step size</text><line x1="188" y1="211" x2="188" y2="211" stroke="#058e89" stroke-width="4" stroke-linecap="round"><animate attributeName="x2" values="188;273;273;188" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y2" values="211;126;126;211" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/></line><circle cx="188" cy="211" r="7" fill="#058e89" stroke="white" stroke-width="2.5"><animate attributeName="cx" values="188;273;273;188" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="211;126;126;211" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/></circle><circle cx="391" cy="285" r="7" fill="#dd8734" stroke="white" stroke-width="2.5"><animate attributeName="cx" values="391;585;585;391" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="285;155;155;285" keyTimes="0;.58;.77;1" dur="10s" repeatCount="indefinite"/></circle></svg>
