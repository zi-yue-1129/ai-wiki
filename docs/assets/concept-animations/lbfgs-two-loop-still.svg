<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">L-BFGS two-loop recursion</title><desc id="dsc">Four states: store recent curvature pairs, backward pass newest to oldest, initial inverse-Hessian scaling, forward pass oldest to newest to obtain the search direction.</desc><defs><marker id="teal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#008f88"/></marker><marker id="blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3e6da8"/></marker><marker id="amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#db8a24"/></marker><marker id="gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#8797a7"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><text x="25" y="33" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">L-BFGS · Two-loop recursion</text><text x="615" y="32" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="end">1 → 2 → 3 → 4</text><g id="stage-1"><rect x="24" y="55" width="282" height="137" rx="12" fill="white" stroke="#d6e0e8" stroke-width="1.5"/><rect x="36" y="67" width="23" height="23" rx="7" fill="#e1f3f1" stroke="none" stroke-width="1"/><text x="47.5" y="83" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="68" y="83" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Store curvature</text><rect x="64" y="113" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="91.5" y="130" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1, y1</text><rect x="129" y="113" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="156.5" y="130" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s2, y2</text><rect x="194" y="113" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="221.5" y="130" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s3, y3</text><path d="M235 126 L274 126" stroke="#008f88" stroke-width="2" fill="none" stroke-linecap="round"  marker-end="url(#teal)"/><text x="269" y="115" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="end">new</text><text x="165" y="169" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="middle">last m pairs</text></g><g id="stage-2"><rect x="334" y="55" width="282" height="137" rx="12" fill="white" stroke="#d6e0e8" stroke-width="1.5"/><rect x="346" y="67" width="23" height="23" rx="7" fill="#e1f3f1" stroke="none" stroke-width="1"/><text x="357.5" y="83" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="378" y="83" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Backward loop</text><rect x="444" y="100" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="117" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1, y1</text><rect x="444" y="128" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="145" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s2, y2</text><rect x="444" y="156" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="173" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s3, y3</text><path d="M432 171 L432 107" stroke="#3e6da8" stroke-width="3" fill="none" stroke-linecap="round"  marker-end="url(#blue)"/><text x="410" y="133" fill="#3e6da8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">q</text><text x="528" y="133" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">new → old</text></g><g id="stage-3"><rect x="24" y="202" width="282" height="137" rx="12" fill="white" stroke="#d6e0e8" stroke-width="1.5"/><rect x="36" y="214" width="23" height="23" rx="7" fill="#e1f3f1" stroke="none" stroke-width="1"/><text x="47.5" y="230" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="68" y="230" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Initial scale</text><rect x="113" y="261" width="103" height="46" rx="9" fill="#e1f3f1" stroke="#b2d6d2" stroke-width="1.3"/><text x="164" y="281" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">H₀</text><text x="164" y="296" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="500" text-anchor="middle">initial scale</text><path d="M64 285 L107 285" stroke="#3e6da8" stroke-width="3" fill="none" stroke-linecap="round"  marker-end="url(#blue)"/><path d="M222 285 L269 285" stroke="#008f88" stroke-width="3" fill="none" stroke-linecap="round"  marker-end="url(#teal)"/><text x="66" y="269" fill="#3e6da8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">q</text><text x="263" y="269" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">r</text></g><g id="stage-4"><rect x="334" y="202" width="282" height="137" rx="12" fill="white" stroke="#d6e0e8" stroke-width="1.5"/><rect x="346" y="214" width="23" height="23" rx="7" fill="#e1f3f1" stroke="none" stroke-width="1"/><text x="357.5" y="230" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="378" y="230" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Forward loop</text><rect x="444" y="247" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="264" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1, y1</text><rect x="444" y="275" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="292" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s2, y2</text><rect x="444" y="303" width="55" height="25" rx="5" fill="#e7f2f8" stroke="#cbd9e5" stroke-width="1"/><text x="471.5" y="320" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s3, y3</text><path d="M431 253 L431 316" stroke="#008f88" stroke-width="3" fill="none" stroke-linecap="round"  marker-end="url(#teal)"/><text x="407" y="290" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">r</text><text x="531" y="280" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">old → new</text><text x="554" y="316" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">d = −r</text></g><text x="320" y="353" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="middle">Schematic · not measured</text></svg>
