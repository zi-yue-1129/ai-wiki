<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">GQA pooling counterexample</title><desc id="desc">Two scalar query heads keep q=1 and values [0,4]. Original key logits produce outputs 3 and 1; averaging the keys gives equal attention and outputs 2 and 2. The animation reveals computation stages, not training.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b9c9dc"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="12" fill="#101b2d"/><text x="320" y="31" font-size="24" fill="#eef4ff" text-anchor="middle">Pooling keys changes attention</text><rect x="12" y="44" width="300" height="285" rx="8" fill="#192a40"/><rect x="328" y="44" width="300" height="285" rx="8" fill="#192a40"/><text x="162" y="72" font-size="22" fill="#eef4ff" text-anchor="middle">MHA</text><text x="478" y="72" font-size="22" fill="#eef4ff" text-anchor="middle">Pooled group</text><text x="320" y="94" font-size="16" fill="#b9c9dc" text-anchor="middle">q = 1  •  V = [0, 4]</text><text x="24" y="127" font-size="17" fill="#b9c9dc" text-anchor="start">H1</text><text x="175" y="127" font-size="19" fill="#eef4ff" text-anchor="middle">[0, ln 3]</text><path d="M170 134L170 144" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="150" width="224" height="26" rx="4" fill="#101b2d"/><rect x="64" y="150" width="56" height="26" rx="2" fill="#417dae"/><rect x="120" y="150" width="168" height="26" rx="2" fill="#238b80"/><text x="92" y="169" font-size="16" fill="#eef4ff" text-anchor="middle">25%</text><text x="204" y="169" font-size="16" fill="#eef4ff" text-anchor="middle">75%</text><text x="175" y="198" font-size="20" fill="#eef4ff" text-anchor="middle">Output = 3</text><text x="24" y="232" font-size="17" fill="#b9c9dc" text-anchor="start">H2</text><text x="175" y="232" font-size="19" fill="#eef4ff" text-anchor="middle">[ln 3, 0]</text><path d="M170 239L170 249" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="64" y="255" width="224" height="26" rx="4" fill="#101b2d"/><rect x="64" y="255" width="168" height="26" rx="2" fill="#417dae"/><rect x="232" y="255" width="56" height="26" rx="2" fill="#238b80"/><text x="148" y="274" font-size="16" fill="#eef4ff" text-anchor="middle">75%</text><text x="260" y="274" font-size="16" fill="#eef4ff" text-anchor="middle">25%</text><text x="175" y="303" font-size="20" fill="#eef4ff" text-anchor="middle">Output = 1</text><text x="340" y="127" font-size="17" fill="#b9c9dc" text-anchor="start">H1</text><text x="491" y="127" font-size="19" fill="#eef4ff" text-anchor="middle">[½ ln 3, ½ ln 3]</text><path d="M486 134L486 144" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="150" width="224" height="26" rx="4" fill="#101b2d"/><rect x="380" y="150" width="112" height="26" rx="2" fill="#417dae"/><rect x="492" y="150" width="112" height="26" rx="2" fill="#238b80"/><text x="436" y="169" font-size="16" fill="#eef4ff" text-anchor="middle">50%</text><text x="548" y="169" font-size="16" fill="#eef4ff" text-anchor="middle">50%</text><text x="491" y="198" font-size="20" fill="#eef4ff" text-anchor="middle">Output = 2</text><text x="340" y="232" font-size="17" fill="#b9c9dc" text-anchor="start">H2</text><text x="491" y="232" font-size="19" fill="#eef4ff" text-anchor="middle">[½ ln 3, ½ ln 3]</text><path d="M486 239L486 249" fill="none" stroke="#b9c9dc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="255" width="224" height="26" rx="4" fill="#101b2d"/><rect x="380" y="255" width="112" height="26" rx="2" fill="#417dae"/><rect x="492" y="255" width="112" height="26" rx="2" fill="#238b80"/><text x="436" y="274" font-size="16" fill="#eef4ff" text-anchor="middle">50%</text><text x="548" y="274" font-size="16" fill="#eef4ff" text-anchor="middle">