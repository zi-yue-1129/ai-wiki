<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Back-door adjustment: balancing confounder strata</title><desc id="art-desc">Illustrative binary confounder U. Observational X=0 and X=1 have U=1 proportions 0.2 and 0.8 and outcome risks 0.18 and 0.82. Standardising both to U=1 weight 0.5 changes risks to 0.30 and 0.70 and gap 0.64 to 0.40.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef4fa"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7b94a6"/></marker></defs>
<style>text{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;fill:#24465d}.label{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#627e91}.tag{font-size:14px;font-weight:750}.big{font-size:22px;font-weight:750}.small{font-size:12px;fill:#648093}.val{font-size:17px;font-weight:700}.muted{fill:#7890a1}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style>
<rect width="800" height="430" rx="20" fill="url(#bg)"/><rect x="18" y="18" width="764" height="394" rx="16" fill="none" stroke="#d8e4ee"/>
<text x="42" y="53" class="label">BACK-DOOR ADJUSTMENT</text><text x="42" y="84" class="tag">Balance U before comparing outcomes</text><rect x="490" y="40" width="265" height="128" rx="14" fill="#ffffff" stroke="#dce7ee"></rect><g aria-hidden="true"><path d="M637 78 L581 118" stroke="#bacbd8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><path d="M653 78 L707 118" stroke="#bacbd8" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><path d="M600 144 L679 144" stroke="#bacbd8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="642" cy="66" r="20" fill="#d9eff8" stroke="#bad0dd"/><text x="642" y="71" class="tag" text-anchor="middle">U</text><circle cx="573" cy="137" r="20" fill="#f7dfc9" stroke="#bad0dd"/><text x="573" y="142" class="tag" text-anchor="middle">X</text><circle cx="714" cy="137" r="20" fill="#d4efdf" stroke="#bad0dd"/><text x="714" y="142" class="tag" text-anchor="middle">Y</text></g><rect x="40" y="176" width="343" height="195" rx="14" fill="#ffffff" stroke="#dce7ee"></rect><text x="62" y="206" class="tag">X = 0</text><text x="62" y="241" class="label">U = 1 SHARE</text><rect x="62" y="252" width="230" height="18" rx="7" fill="#e7edf2"></rect><rect x="62" y="252" width="115" height="18" rx="7" fill="#238f9b"></rect><text x="311" y="267" class="val" opacity="0">.20</text><text x="311" y="267" class="val">.50</text><text x="62" y="304" class="label">P(Y=1)</text><rect x="62" y="315" width="230" height="20" rx="7" fill="#e7edf2"></rect><path d="M103.4 310 V340" stroke="#dba27f" stroke-width="2" stroke-dasharray="3 3"/><rect x="62" y="315" width="69" height="20" rx="7" fill="#e1835c"></rect><text x="311" y="332" class="val" opacity="0">0.18</text><text x="311" y="332" class="val">0.30</text><rect x="417" y="176" width="343" height="195" rx="14" fill="#ffffff" stroke="#dce7ee"></rect><text x="439" y="206" class="tag">X = 1</text><text x="439" y="241" class="label">U = 1 SHARE</text><rect x="439" y="252" width="230" height="18" rx="7" fill="#e7edf2"></rect><rect x="439" y="252" width="115" height="18" rx="7" fill="#238f9b"></rect><text x="688" y="267" class="val" opacity="0">.80</text><text x="688" y="267" class="val">.50</text><text x="439" y="304" class="label">P(Y=1)</text><rect x="439" y="315" width="230" height="20" rx="7" fill="#e7edf2"></rect><path d="M627.6 310 V340" stroke="#dba27f" stroke-width="2" stroke-dasharray="3 3"/><rect x="439" y="315" width="161" height="20" rx="7" fill="#e1835c"></rect><text x="688" y="332" class="val" opacity="0">0.82</text><text x="688" y="332" class="val">0.70</text><text x="44" y="399" class="label" opacity="0">OBSERVED   Δ = 0.64</text><text x="757" y="399" class="label" text-anchor="end">ADJUSTED   Δ = 0.40</text></svg>