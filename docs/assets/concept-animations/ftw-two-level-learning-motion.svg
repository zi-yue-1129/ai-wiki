<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">For The Win two-level population learning</title><desc id="desc">An illustrative population samples teammates and opponents for matches; sparse outcomes and learned internal rewards drive agent learning while outer population-based training adapts internal reward and hyperparameter settings.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduced{display:inline!important}}</style><rect x="1" y="1" width="638" height="358" rx="16" fill="#f5f9fd" stroke="#d6e3ee" stroke-width="2"/><text x="28" y="36" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#19314b" >FTW</text><text x="87" y="36" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#63758a" >POPULATION → MATCH → LEARNING</text><rect x="28" y="57" width="172" height="206" rx="13" fill="#fff" stroke="#d6e3ee" stroke-width="1.5"/><text x="45" y="83" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#19314b" >POPULATION</text><text x="45" y="105" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#63758a" >sample partners</text><rect x="50" y="123" width="60" height="45" rx="10" fill="#f7faff" stroke="#d6e3ee" stroke-width="1.5"/><circle cx="68" cy="145" r="10" fill="#0a8584"/><text x="90" y="151" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19314b" text-anchor="middle">A</text><rect x="118" y="123" width="60" height="45" rx="10" fill="#f7faff" stroke="#d6e3ee" stroke-width="1.5"/><circle cx="136" cy="145" r="10" fill="#3876be"/><text x="158" y="151" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19314b" text-anchor="middle">B</text><rect x="50" y="181" width="60" height="45" rx="10" fill="#f7faff" stroke="#d6e3ee" stroke-width="1.5"/><circle cx="68" cy="203" r="10" fill="#c66d3