<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Key quantization and outlier scale</title><desc id="desc">Two channels contain 0,1,2,3 and 0,10,20,30. A shared 2-bit scale of 10 reconstructs the low channel as zeros; independent scales of 1 and 10 preserve the toy values exactly. Low channel absolute error sum is six versus zero.</desc><style>text{font-family:Arial,system-ui,sans-serif}.motion{pointer-events:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.reveal{opacity:1!important}.initial{display:none!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="320" y="34" font-size="21" fill="#19394c" text-anchor="middle" font-weight="bold">Key quantization: outlier scale</text><text x="320" y="55" font-size="13" fill="#19394c" text-anchor="middle" >2-bit reconstruction · same input, different scale groups</text><rect x="16" y="74" width="196" height="238" rx="4" fill="#fff" stroke="#dae4ee"/><text x="114" y="99" font-size="17" fill="#19394c" text-anchor="middle" font-weight="bold">Input</text><text x="114" y="119" font-size="12" fill="#486378" text-anchor="middle" >Original</text><text x="114" y="139" font-size="12" fill="#35678f" text-anchor="middle" >Channel 1 · 0–3</text><rect x="34" y="151" width="34" height="30" rx="4" fill="#e5edf4" /><rect x="34" y="181" width="34" height="0" rx="3" fill="#35678f"  data-channel="1" data-panel="0" data-token="0" data-reconstructed="0"></rect><text x="51" y="198" font-size="14" fill="#19394c" text-anchor="middle" >0</text><rect x="76" y="151" width="34" height="30" rx="4" fill="#e5edf4" /><rect x="76" y="171" width="34" height="10" rx="3" fill="#35678f"  data-channel="1" data-panel="0" data-token="1" data-reconstructed="1"></rect><text x="93" y="198" font-size="14" fill="#19394c" text-anchor="middle" >1</text><rect x="118" y="151" width="34" height="30" rx="4" fill="#e5edf4" /><re