<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Forward AD through softmax: probability redistribution</title><desc id="desc">The three probabilities vary with a shared directional change in the logits while their sum stays one; at t zero the directional softmax tangent is (three eighths, minus one sixteenth, minus five sixteenths) and sums to zero.</desc><rect x="0" y="0" width="800" height="420" rx="18" fill="#f1f7fa" stroke="none" /><rect x="16" y="16" width="768" height="388" rx="16" fill="#fff" stroke="#d7e5eb" /><text x="38" y="53" font-size="22" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700">Softmax: shared tangent signal</text><text x="38" y="78" font-size="14" fill="#597386" font-family="Arial,Helvetica,sans-serif" >z(t) = (ln 2 + t, 0, -t)     v = (1, 0, -1)</text><rect x="35" y="102" width="454" height="272" rx="11" fill="#f7fafc" stroke="#d7e5eb" /><rect x="509" y="102" width="255" height="272" rx="11" fill="#f7fafc" stroke="#d7e5eb" /><text x="55" y="130" font-size="17" fill="#087f88" font-family="Arial,Helvetica,sans-serif" font-weight="700">Probability mass</text><text x="527" y="130" font-size="17" fill="#c47a26" font-family="Arial,Helvetica,sans-serif" font-weight="700">Tangent at t = 0</text><path d="M67 318 H463" stroke="#d7e5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="43" y="322" font-size="11" fill="#597386" font-family="Arial,Helvetica,sans-serif" >0</text><path d="M67 242 H463" stroke="#d7e5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="43" y="246" font-size="11" fill="#597386" font-family="Arial,Helvetica,sans-serif" >0.5</text><path d="M67 166 H463" stroke="#d7e5eb" stroke-width="1" stroke-dasharray="4 5"/><text x="43" y="170" font-size="11" fill="#597386" font-family="Arial,Helvetica,sans-serif" >1</text><rect x="93" y="242.00" width="70" height="76.00" rx="7" fill="#087f88" fill-opacity=".85"><animate attributeName="y" values="284.88;242.00;203.34;242.00;284.88" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="33.12;76.00;114.66;76.00;33.12" dur="10s" repeatCount="indefinite"/></rect><text x="128" y="340" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">p1</text><rect x="227" y="280.00" width="70" height="38.00" rx="7" fill="#6b9fad" fill-opacity=".85"><animate attributeName="y" values="281.14;280.00;292.24;280.00;281.14" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="36.86;38.00;25.76;38.00;36.86" dur="10s" repeatCount="indefinite"/></rect><text x="262" y="340" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">p2</text><rect x="361" y="280.00" width="70" height="38.00" rx="7" fill="#7057ac" fill-opacity=".85"><animate attributeName="y" values="235.98;280.00;306.42;280.00;235.98" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="82.02;38.00;11.58;38.00;82.02" dur="10s" repeatCount="indefinite"/></rect><text x="396" y="340" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700">p3</text><path d="M86 359 H441" stroke="#d7e5eb" stroke-width="3" stroke-linecap="round"/><text x="66" y="363" font-size="12" fill="#597386" font-family="Arial,Helvetica,sans-serif" >−t</text><text x="444" y="363" font-size="12" fill="#597386" font-family="Arial,Helvetica,sans-serif" >+t</text><circle cx="263" cy="359" r="6" fill="#c47a26" stroke="white" stroke-width="2"><animate attributeName="cx" values="86;263;441;263;86" dur="10s" repeatCount="indefinite"/></circle><text x="530" y="159" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700">δp1</text><text x="744" y="159" font-size="15" fill="#087f88" font-family="Arial,Helvetica,sans-serif" text-anchor="end" font-weight="700">+0.375</text><path d="M642 183 v17" stroke="#597386" stroke-width="1.2"/><path d="M642 191 H732.0" stroke="#087f88" stroke-width="10" stroke-linecap="round"/><text x="530" y="229" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700">δp2</text><text x="744" y="229" font-size="15" fill="#c47a26" font-family="Arial,Helvetica,sans-serif" text-anchor="end" font-weight="700">−0.0625</text><path d="M642 253 v17" stroke="#597386" stroke-width="1.2"/><path d="M642 261 H627.0" stroke="#c47a26" stroke-width="10" stroke-linecap="round"/><text x="530" y="299" font-size="15" fill="#17364a" font-family="Arial,Helvetica,sans-serif" font-weight="700">δp3</text><text x="744" y="299" font-size="15" fill="#c47a26" font-family="Arial,Helvetica,sans-serif" text-anchor="end" font-weight="700">−0.3125</text><path d="M642 323 v17" stroke="#597386" stroke-width="1.2"/><path d="M642 331 H567.0" stroke="#c47a26" stroke-width="10" stroke-linecap="round"/><text x="41" y="394" font-size="13" fill="#597386" font-family="Arial,Helvetica,sans-serif" >Σ p = 1</text><text x="398" y="394" font-size="13" fill="#597386" font-family="Arial,Helvetica,sans-serif" >Σ δp = 0</text><text x="758" y="394" font-size="11" fill="#597386" font-family="Arial,Helvetica,sans-serif" text-anchor="end">Exact synthetic example</text></svg>