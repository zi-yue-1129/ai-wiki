<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d"><title id="t">EWC coordinate-wise motion</title><desc id="d">Two coordinates with different Fisher stiffness move from a shared old-task anchor toward distinct regularized optima, 0.20 and 0.80.</desc><rect x="0" y="0" width="640" height="360" rx="12" fill="#ffffff" stroke="#dfe7f0"/><text x="24" y="35" fill="#19324d" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">EWC: Fisher-weighted parameter movement</text><text x="24" y="55" fill="#708398" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" text-anchor="start">Two independent quadratic coordinates · schematic</text><rect x="18" y="76" width="604" height="251" rx="12" fill="#f5f8fc" stroke="#dfe7f0"/><line x1="140" y1="118" x2="140" y2="300" stroke="#91a8c2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="540" y1="118" x2="540" y2="300" stroke="#91a8c2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 5"/><text x="37" y="130" fill="#3575e6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">HIGH F</text><text x="37" y="145" fill="#708398" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="start">λF = 4</text><line x1="140" y1="166" x2="540" y2="166" stroke="#d7e1ee" stroke-width="10" stroke-linecap="round" /><line x1="140" y1="166" x2="540" y2="166" stroke="#fff" stroke-width="2" stroke-linecap="round" /><circle cx="540" cy="166" r="8" fill="#fff" stroke="#e69a42" stroke-width="2" stroke-dasharray="3 3"/><line x1="140" y1="166" x2="220" y2="166" stroke="#3575e6" stroke-width="5" stroke-linecap="round"></line><circle cx="220" cy="166" r="11" fill="#3575e6" stroke="#fff" stroke-width="3"></circle><text x="220" y="145" text-anchor="middle" fill="#3575e6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" opacity="1">0.20</text><text x="37" y="237" fill="#009b99" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start">LOW F</text><text x="37" y="252" fill="#708398" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" text-anchor="start">λF = 0.25</text><line x1="140" y1="273" x2="540" y2="273" stroke="#d7e1ee" stroke-width="10" stroke-linecap="round" /><line x1="140" y1="273" x2="540" y2="273" stroke="#fff" stroke-width="2" stroke-linecap="round" /><circle cx="540" cy="273" r="8" fill="#fff" stroke="#e69a42" stroke-width="2" stroke-dasharray="3 3"/><line x1="140" y1="273" x2="460" y2="273" stroke="#009b99" stroke-width="5" stroke-linecap="round"></line><circle cx="460" cy="273" r="11" fill="#009b99" stroke="#fff" stroke-width="3"></circle><text x="460" y="252" text-anchor="middle" fill="#009b99" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" opacity="1">0.80</text><text x="140" y="318" fill="#708398" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Old anchor 0</text><text x="540" y="318" fill="#708398" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Task B optimum 1</text></svg>
