<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">One-step and three-step TD bootstrapping</title><desc id="desc">A four-state observation sequence has rewards +1, +2 and -1. Gamma is 0.9. One-step target is 1 plus 0.9 times 4, or 4.60; three-step target accumulates 1, 1.8, minus .81, plus .9 cubed times 5, giving 5.635. This is a constructed example, not training data.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduce-only{display:inline!important}}</style><rect x="0" y="0" width="440" height="548" rx="18" fill="#f7fafc" stroke="none" stroke-width="0"/><rect x="1" y="1" width="438" height="546" rx="17" fill="none" stroke="#dbe5ee" stroke-width="1"/><text x="220" y="43" fill="#24364c" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Multi-step · TD return</text><path d="M25 61H415" fill="none" stroke="#dbe5ee" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="89" fill="#61758c" font-size="15" font-weight="600" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Observed sequence</text><rect x="22" y="110" width="76" height="47" rx="10" fill="#e8effa" stroke="#dbe5ee" stroke-width="1.5"/><text x="60" y="138" fill="#3568b7" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">s0</text><path d="M99 133H125" fill="none" stroke="#61758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 128L125 133L118 138" stroke="#61758c" stroke-width="2" fill="none"/><rect x="128" y="110" width="76" height="47" rx="10" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="166" y="138" fill="#24364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">s1</text><path d="M205 133H231" fill="none" stroke="#61758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M224 128L231 133L224 138" stroke="#61758c" stroke-width="2" fill="none"/><rect x="234" y="110" width="76" height="47" rx="10" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="272" y="138" fill="#24364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">s2</text><path d="M311 133H337" fill="none" stroke="#61758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 128L337 133L330 138" stroke="#61758c" stroke-width="2" fill="none"/><rect x="340" y="110" width="76" height="47" rx="10" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="378" y="138" fill="#24364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">s3</text><text x="98" y="188" fill="#c56d31" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+1</text><text x="98" y="204" fill="#61758c" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">reward</text><text x="204" y="188" fill="#c56d31" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+2</text><text x="204" y="204" fill="#61758c" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">reward</text><text x="310" y="188" fill="#c56d31" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−1</text><text x="310" y="204" fill="#61758c" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">reward</text><rect x="22" y="226" width="396" height="73" rx="13" fill="#edf4fc" stroke="#dbe5ee" stroke-width="1.5"/><text x="40" y="250" fill="#3568b7" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1-step</text><text x="206" y="250" fill="#24364c" font-size="16" font-weight="600" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1 + 0.9 × 4</text><text x="392" y="283" fill="#3568b7" font-size="24" font-weight="700" text-anchor="end" font-family="Arial,Helvetica,sans-serif">4.60</text><text x="40" y="282" fill="#61758c" font-size="12" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">bootstrap at s1</text><text x="36" y="326" fill="#24364c" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">3-step · sequential accumulation</text><rect x="30" y="350" width="81" height="55" rx="9" fill="#e8effa" stroke="#dbe5ee" stroke-width="1.5"/><text x="70" y="381" fill="#24364c" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">1</text><text x="122" y="383" fill="#61758c" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">›</text><rect x="135" y="350" width="81" height="55" rx="9" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.5"/><text x="175" y="381" fill="#24364c" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+1.80</text><text x="227" y="383" fill="#61758c" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">›</text><rect x="240" y="350" width="81" height="55" rx="9" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.5"/><text x="280" y="381" fill="#c56d31" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−0.81</text><text x="332" y="383" fill="#61758c" font-size="24" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">›</text><rect x="345" y="350" width="81" height="55" rx="9" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.5"/><text x="385" y="381" fill="#117d67" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+3.645</text><text x="75" y="426" fill="#61758c" font-size="13" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">r0</text><text x="178" y="426" fill="#61758c" font-size="13" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">γr1</text><text x="281" y="426" fill="#61758c" font-size="13" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">γ²r2</text><text x="382" y="426" fill="#61758c" font-size="13" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">γ³V3</text><rect x="22" y="448" width="396" height="77" rx="12" fill="#e9f7f2" stroke="#cbe9e1" stroke-width="1.5"/><text x="41" y="476" fill="#117d67" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">3-step target</text><text x="392" y="500" fill="#117d67" font-size="28" font-weight="700" text-anchor="end" font-family="Arial,Helvetica,sans-serif">—</text><text x="40" y="506" fill="#61758c" font-size="12" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">all three rewards + bootstrap</text><rect class="moving" x="28" y="348" width="85" height="59" rx="11" fill="none" stroke="#117d67" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;.16;.32;.52;.72;.88;1" dur="11s" repeatCount="indefinite" calcMode="discrete"/></rect><rect class="moving" x="133" y="348" width="85" height="59" rx="11" fill="none" stroke="#117d67" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;.16;.32;.52;.72;.88;1" dur="11s" repeatCount="indefinite" calcMode="discrete"/></rect><rect class="moving" x="238" y="348" width="85" height="59" rx="11" fill="none" stroke="#c56d31" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;.16;.32;.52;.72;.88;1" dur="11s" repeatCount="indefinite" calcMode="discrete"/></rect><rect class="moving" x="343" y="348" width="85" height="59" rx="11" fill="none" stroke="#117d67" stroke-width="3" opacity="0"><animate attributeName