<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Truncated SVD residual reduction</title><desc id="desc">Illustrative three-by-four matrix with orthogonal rows. The animation sends three singular components to the reconstruction and lowers Frobenius residual; the static view compares exact rank-one, rank-two and rank-three approximations.</desc><rect x="0" y="0" width="800" height="420" rx="0" fill="#f6f9fc" stroke="none"/><text x="30" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1d3448">Truncated SVD</text><text x="30" y="59" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51677c">Adding orthogonal rank-one terms</text><line x1="30" y1="74" x2="770" y2="74" stroke="#d5e1ea" stroke-width="2" /><text x="34" y="104" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d3448">Singular components</text><text x="419" y="104" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d3448">Reconstruction Aₖ</text><rect x="26" y="119" width="340" height="215" rx="12" fill="#fff" stroke="#d5e1ea"/><rect x="407" y="119" width="363" height="215" rx="12" fill="#fff" stroke="#d5e1ea"/><rect x="46" y="130" width="297" height="48" rx="7" fill="#f5f9fc" stroke="none"/><text x="60" y="157" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#168887">σ1</text><rect x="112" y="144" width="168" height="14" rx="7" fill="#168887" stroke="none"/><text x="320" y="157" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#51677c">3√2</text><circle cx="336" cy="151" r="6" fill="#168887"><animate attributeName="cx" values="336;336;443;443" keyTimes="0;.07;.18;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.17;.19;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><rect x="46" y="191" width="297" height="48" rx="7" fill="#f5f9fc" stroke="none"/><text x="60" y="218" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#4279bb">σ2</text><rect x="112" y="205" width="112" height="14" rx="7" fill="#4279bb" stroke="none"/><text x="320" y="218" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#51677c">2√2</text><circle cx="336" cy="212" r="6" fill="#4279bb"><animate attributeName="cx" values="336;336;336;443;443" keyTimes="0;.34;.38;.48;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.37;.47;.49;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><rect x="46" y="252" width="297" height="48" rx="7" fill="#f5f9fc" stroke="none"/><text x="60" y="279" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#d18439">σ3</text><rect x="112" y="266" width="56" height="14" rx="7" fill="#d18439" stroke="none"/><text x="320" y="279" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#51677c">√2</text><circle cx="336" cy="273" r="6" fill="#d18439"><animate attributeName="cx" values="336;336;336;443;443" keyTimes="0;.61;.65;.75;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.60;.64;.74;.76;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><text x="430" y="142" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#51677c">3 × 4</text><rect x="443" y="168" width="58" height="38" rx="6" fill="#edf3f7" stroke="#d5e1ea"/><rect x="515" y="168" width="58" height="38" rx="6" fill="#edf3f7