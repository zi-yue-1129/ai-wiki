<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dependence erodes the coverage of an iid false-alarm upper limit</title><desc id="desc">Two calculated lines for an artificial thirty-record batch: the actual coverage of an incorrectly iid-calibrated one-sided 95 percent upper limit decreases from 97.05 percent to 16.67 percent as the whole-batch shared-shock probability rho rises from zero to one; the chance of zero observed false alarms grows from 0.42 percent to 83.33 percent. An animated cursor sweeps through the mixture weights, and the static view shows rho equal to one half. Neither series is a measurement.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#263d4d}.title{font-size:18px;font-weight:700}.legend{font-size:12px;font-weight:650}.sub{font-size:11px;fill:#586e7e}.tiny{font-size:10px;fill:#647d8e}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f0f7fb"/><text class="title" x="22" y="32">When iid coverage breaks under shared shocks</text><rect x="20" y="47" width="600" height="290" rx="12" fill="#fff" stroke="#d1e1ea"/><line x1="50" y1="70" x2="72" y2="70" stroke="#237f87" stroke-width="3"/><text class="legend" x="79" y="74">Actual coverage</text><line x1="250" y1="70" x2="272" y2="70" stroke="#c47a46" stroke-width="3"/><text class="legend" x="279" y="74">Zero-alarm probability</text><text class="tiny" x="506" y="74">n = 30</text><line x1="116" y1="102" x2="521" y2="102" stroke="#e3edf2"/><text class="tiny" x="105" y="106" text-anchor="end">100%</text><line x1="116" y1="189.0" x2="521" y2="189.0" stroke="#e3edf2"/><text class="tiny" x="105" y="193.0" text-anchor="end">50%</text><line x1="116" y1="276" x2="521" y2="276" stroke="#e3edf2"/><text class="tiny" x="105" y="280" text-anchor="end">0%</text><line x1="116.00" y1="276" x2="116.00" y2="280" stroke="#9eb4c0"/><text class="tiny" x="116.00" y="296" text-anchor="middle">0</text><line x1="318.50" y1="276" x2="318.50" y2="280" stroke="#9eb4c0"/><text class="tiny" x="318.50" y="296" text-anchor="middle">0.5</text><line x1="521.00" y1="276" x2="521.00" y2="280" stroke="#9eb4c0"/><text class="tiny" x="521.00" y="296" text-anchor="middle">1</text><text class="sub" x="320" y="315" text-anchor="middle">Shared-shock mixture weight &#961;</text><line x1="116" y1="110.7" x2="521" y2="110.7" stroke="#788b97" stroke-width="1.5" stroke-dasharray="4 4"/><text class="tiny" x="528" y="113.7">95%</text><path d="M116,107.13 L521,247.0" stroke="#237f87" fill="none" stroke-width="3.5" stroke-linecap="round"/><path d="M116,275.27 L521,131.0" stroke="#c47a46" fill="none" stroke-width="3.5" stroke-linecap="round"/><text class="tiny" x="31" y="330">SYNTHETIC &#183; n=30, p=1/6 &#183; one batch-level mixture switch</text><g><line x1="318.50" x2="318.50" y1="102" y2="276" stroke="#6e8998" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"></line><circle cx="318.50" cy="177.07" r="6" fill="#237f87" stroke="#fff" stroke-width="2"></circle><circle cx="318.50" cy="203.13" r="6" fill="#c47a46" stroke="#fff" stroke-width="2"></circle></g></svg>