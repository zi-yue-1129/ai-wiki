<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" role="img" font-family="Arial, sans-serif"><title>Matching compressed sparse operands</title><desc>Two sorted index-value streams. Skip the smaller index; multiply and accumulate only at matching indices. The two products are 18 and 32, summing to 50. This is a schematic merge, not the hardware microarchitecture.</desc><rect x="0" y="0" width="360" height="254" rx="10" fill="#102039" stroke="none"/><text x="18" y="23" fill="#f3f7ff" font-size="14" text-anchor="start">Sparse dot product</text><text x="342" y="23" fill="#7890a9" font-size="12" text-anchor="end">Index : value</text><text x="18" y="73" fill="#4ee0c2" font-size="15" text-anchor="start">A</text><text x="18" y="133" fill="#b9a3ff" font-size="15" text-anchor="start">B</text><rect x="75" y="46" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="105" y="62" fill="#4ee0c2" font-size="12" text-anchor="middle">0</text><text x="105" y="78" fill="#f3f7ff" font-size="15" text-anchor="middle">2</text><rect x="75" y="106" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="105" y="122" fill="#b9a3ff" font-size="12" text-anchor="middle">1</text><text x="105" y="138" fill="#f3f7ff" font-size="15" text-anchor="middle">7</text><rect x="160" y="46" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="190" y="62" fill="#4ee0c2" font-size="12" text-anchor="middle">2</text><text x="190" y="78" fill="#f3f7ff" font-size="15" text-anchor="middle">3</text><rect x="160" y="106" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="190" y="122" fill="#b9a3ff" font-size="12" text-anchor="middle">2</text><text x="190" y="138" fill="#f3f7ff" font-size="15" text-anchor="middle">6</text><rect x="245" y="46" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="275" y="62" fill="#4ee0c2" font-size="12" text-anchor="middle">5</text><text x="275" y="78" fill="#f3f7ff" font-size="15" text-anchor="middle">4</text><rect x="245" y="106" width="60" height="42" rx="6" fill="#172c46" stroke="#3b526c"/><text x="275" y="122" fill="#b9a3ff" font-size="12" text-anchor="middle">5</text><text x="275" y="138" fill="#f3f7ff" font-size="15" text-anchor="middle">8</text><rect x="16" y="168" width="328" height="72" rx="4" fill="#172c46" stroke="none"/><text x="27" y="188" fill="#7890a9" font-size="12" text-anchor="start">Accumulator</text><path d="M27 217 L333 217" fill="none" stroke="#3b526c" stroke-width="8" stroke-linecap="round"/><rect x="242" y="43" width="66" height="48" rx="7" fill="none" stroke="#f3f7ff"/><rect x="242" y="103" width="66" height="48" rx="7" fill="none" stroke="#f3f7ff"/><path d="M275 91 L275 103" fill="none" stroke="#4ee0c2" stroke-width="2.5" stroke-linecap="round"/><rect x="75" y="46" width="60" height="42" rx="6" fill="#102039" stroke="none" opacity="0.32"/><rect x="75" y="106" width="60" height="42" rx="6" fill="#102039" stroke="none" opacity="0.32"/><rect x="160" y="46" width="60" height="42" rx="6" fill="#102039" stroke="none" opacity="0.32"/><rect x="160" y="106" width="60" height="42" rx="6" fill="#102039" stroke="none" opacity="0.32"/><text x="333" y="188" fill="#4ee0c2" font-size="13" text-anchor="end">4 × 8</text><text x="27" y="205" fill="#f3f7ff" font-size="14" text-anchor="start">50</text><path d="M27 217 L333 217" fill="none" stroke="#4ee0c2" stroke-width="8" stroke-linecap="round"/></svg>
