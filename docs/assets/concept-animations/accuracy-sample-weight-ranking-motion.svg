<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Weighted accuracy can reverse model ranking</title><desc id="desc">Fixed predictions on five cases: model A correct on four, B correct on three. Uniform weights yield 0.800 versus 0.600; weighting case five by five gives 4/9 versus 7/9 and reverses the ranking.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15384c}.h{font-size:18px;font-weight:700}.sub{font-size:11px;fill:#687c8b}.label{font-size:12px;font-weight:700}.score{font-size:25px;font-weight:700}.value{font-size:15px;font-weight:700}.tick{font-size:15px;font-weight:700}.scene{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.scene{display:none!important}.reduced{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f1f6fa"/><rect x="14" y="14" width="612" height="332" rx="14" fill="white" stroke="#dce6ee"/><text x="34" y="47" class="h" text-anchor="start">WEIGHTED ACCURACY</text><text x="34" y="68" class="sub" text-anchor="start">Predictions fixed  ·  only sample importance changes</text><g class="scene" opacity="1"><rect x="33" y="84" width="354" height="241" rx="11" fill="#f8fbfd" stroke="#d9e5ed" stroke-width="1"/><text x="50" y="101" class="label" text-anchor="start">Fixed predictions</text><text x="64" y="153" class="sub" text-anchor="middle">1</text><rect x="92" y="134" width="54" height="29" rx="7" fill="#d8f2e8" stroke="none" stroke-width="1"/><path d="M113,146 l4,4 8,-10" stroke="#087f72" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="164" y="134" width="54" height="29" rx="7" fill="#d8f2e8" stroke="none" stroke-width="1"/><path d="M185,146 l4,4 8,-10" stroke="#087f72" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="258" y="139" width="77" height="18" rx="7" fill="#e2eaf0" stroke="none" stroke-width="1"/><rect