<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DDPM forward noising through progressive signal and noise mixing</title><desc id="desc">The centre panel evolves from a clean abstract pixel pattern toward a fixed pseudo-noise pattern. Paired bars move in opposite directions to illustrate the decreasing signal contribution and increasing noise contribution in the DDPM forward process. Neither the pixel values nor ratios are sampled model measurements.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#e9f3fc"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8fa8bc" flood-opacity=".15"/></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;fill:#28465e}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#66849b}.label{font-size:14px;font-weight:700;fill:#29495f}.small{font-size:12px;fill:#637e92;font-weight:500}.card{fill:#fff;stroke:#d4e3ef;stroke-width:1.5}@media(prefers-reduced-motion:reduce){.motion{display:none}.reduced{display:inline!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="30" y="39" class="eyebrow">DDPM  /  FORWARD NOISING</text><text x="30" y="67" class="small">Signal progressively mixes with noise</text><text x="97" y="97" class="label" text-anchor="middle">Clean  x₀</text><text x="307" y="97" class="label" text-anchor="middle">Noisy  xₜ</text><text x="516" y="97" class="label" text-anchor="middle">Noise  ε</text><defs><g id="clean-tile"><rect x="0" y="0" width="11.3" height="11.3" rx="1.1" fill="#eff7fb"/><rect x="12" y="0" width="11.3" height="11.3" rx="1.1" fill="#eff7fb"/><rect x="24" y="0" width="11.3" height="11.3" rx="1.1" fill="#eff7fb"/><rect x="36" y="0" width="11.3" height="11.3" rx="1.1" fill="#eff7fb"/