<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">GraphSAGE: Sample &amp; Aggregate</title><desc id="desc">Schematic one-hop GraphSAGE example: node v has feature 4 and six neighbours with features 1, 3, 2, 4, 5, 6. A fixed sample of three neighbours with features 1, 2, 5 gives mean 8/3, then the node feature 4 is concatenated before a learned transform.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7fafc" stroke="#dbe5ed" stroke-width="1"/><text x="24" y="37" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#24364b" text-anchor="start">GraphSAGE: Sample &amp; Aggregate</text><text x="24" y="58" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#62778a" text-anchor="start">Sample a fixed-size neighbourhood before the shared update.</text><rect x="24" y="82" width="287" height="240" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1"/><rect x="324" y="82" width="292" height="240" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1"/><text x="42" y="108" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">ONE-HOP NEIGHBOURHOOD</text><text x="342" y="108" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">SAMPLE  →  MEAN  →  CONCAT</text><line x1="160" y1="245" x2="64" y2="168" stroke="#3968ad" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="245" x2="121" y2="154" stroke="#dbe5ed" stroke-width="1.9" stroke-linecap="round"/><line x1="160" y1="245" x2="190" y2="147" stroke="#3968ad" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="245" x2="259" y2="170" stroke="#dbe5ed" stroke-width="1.9" stroke-linecap="round"/><line x1="160" y1="245" x2="68" y2="252" stroke="#3968ad" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="245" x2="257" y2="256" stroke="#dbe5ed" stroke-width="1.9" stroke-linecap="round"/><circle cx="160" cy="265" r="23" fill="#efe4f5" stroke="#8455a8" stroke-width="2.6"/><text x="160" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">v</text><circle cx="64" cy="149" r="18" fill="#e8f4fa" stroke="#3968ad" stroke-width="2.4"/><text x="64" y="154" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#24364b" text-anchor="middle">1</text><circle cx="121" cy="135" r="18" fill="#f0f3f6" stroke="#afbdca" stroke-width="1.5"/><text x="121" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#62778a" text-anchor="middle">3</text><circle cx="190" cy="128" r="18" fill="#e8f4fa" stroke="#3968ad" stroke-width="2.4"/><text x="190" y="133" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#24364b" text-anchor="middle">2</text><circle cx="259" cy="151" r="18" fill="#f0f3f6" stroke="#afbdca" stroke-width="1.5"/><text x="259" y="156" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#62778a" text-anchor="middle">4</text><circle cx="68" cy="233" r="18" fill="#e8f4fa" stroke="#3968ad" stroke-width="2.4"/><text x="68" y="238" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#24364b" text-anchor="middle">5</text><circle cx="257" cy="237" r="18" fill="#f0f3f6" stroke="#afbdca" stroke-width="1.5"/><text x="257" y="242" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#62778a" text-anchor="middle">6</text><text x="44" y="306" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#62778a" text-anchor="start">3 of 6 neighbours selected</text><text x="344" y="138" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">SAMPLED</text><rect x="343" y="150" width="58" height="39" rx="7" fill="#eaf4fb" stroke="#3968ad" stroke-width="1.2"/><text x="372" y="175" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24364b" text-anchor="middle">1</text><rect x="413" y="150" width="58" height="39" rx="7" fill="#eaf4fb" stroke="#3968ad" stroke-width="1.2"/><text x="442" y="175" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24364b" text-anchor="middle">2</text><rect x="483" y="150" width="58" height="39" rx="7" fill="#eaf4fb" stroke="#3968ad" stroke-width="1.2"/><text x="512" y="175" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24364b" text-anchor="middle">5</text><line x1="345" y1="199" x2="595" y2="199" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round"/><text x="344" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">MEAN</text><rect x="433" y="208" width="155" height="21" rx="6" fill="#eef4f8" stroke="none" stroke-width="1"/><rect x="433" y="208" width="105" height="21" rx="6" fill="#d7ebe9" stroke="none" stroke-width="1"/><text x="509" y="223" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#087f84" text-anchor="middle">2.67</text><text x="344" y="263" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">CONCAT</text><rect x="430" y="242" width="74" height="32" rx="7" fill="#efe4f5" stroke="none" stroke-width="1"/><text x="467" y="263" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#8455a8" text-anchor="middle">4</text><rect x="511" y="242" width="85" height="32" rx="7" fill="#e8f6f5" stroke="none" stroke-width="1"/><text x="553" y="263" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#087f84" text-anchor="middle">2.67</text><text x="344" y="306" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#62778a" text-anchor="start">Shared transform → embedding</text><text x="29" y="346" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#62778a" text-anchor="start">Illustrative features · no trained weights or inference</text></svg>