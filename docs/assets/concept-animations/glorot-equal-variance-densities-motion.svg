<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="vtitle vdesc"><title id="vtitle">Glorot: bounded uniform and unbounded Gaussian with equal variance</title><desc id="vdesc">Uniform from minus square root of three to plus square root of three and standard normal distribution both have zero mean and variance one, but their densities and tails differ. The animation continuously blends their densities as an illustrative equal-variance mixture, not a training result.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203650}.meta{font-size:11px;letter-spacing:1.3px;font-weight:bold;fill:#657b92}.sub{font-size:12px;fill:#60788c}.label{font-size:14px;font-weight:bold}.tick{font-size:11px;fill:#73869a}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}</style><rect width="640" height="360" rx="18" fill="#f5f8fc" /><text class="meta" x="30" y="32">INITIALISATION · PROBABILITY</text><text x="30" y="61" font-size="19" font-weight="bold">Equal variance ≠ equal distribution</text><text class="sub" x="30" y="81">Glorot uniform vs normal  ·  mean 0  ·  variance 1</text><rect x="26" y="97" width="588" height="228" rx="15" fill="white" stroke="#dbe5ee" /><line x1="105" y1="267.00" x2="537" y2="267.00" stroke="#e6edf4" /><text class="tick" x="92" y="271.00" text-anchor="end">0.00</text><line x1="105" y1="225.00" x2="537" y2="225.00" stroke="#e6edf4" /><text class="tick" x="92" y="229.00" text-anchor="end">0.15</text><line x1="105" y1="183.00" x2="537" y2="183.00" stroke="#e6edf4" /><text class="tick" x="92" y="187.00" text-anchor="end">0.30</text><line x1="105" y1="141.00" x2="537" y2="141.00" stroke="#e6edf4" /><text class="tick" x="92" y="145.00" text-anchor="end">0.45</text><text class="tick" x="104" y="289" text-anchor="middle">-3</text><text class="tick" x="176" y="289" text-anchor="middle">-2</text><text class="tick" x="248" y="289" text-anchor="middle">-1</text><text class="tick" x="320" y="289" text-anchor="middle">0</text><text class="tick" x="392" y="289" text-anchor="middle">1</text><text class="tick" x="464" y="289" text-anchor="middle">2</text><text class="tick" x="536" y="289" text-anchor="middle">3</text><line x1="195.29" y1="132" x2="195.29" y2="268" stroke="#dc9c59" stroke-dasharray="4 4" /><line x1="444.71" y1="132" x2="444.71" y2="268" stroke="#dc9c59" stroke-dasharray="4 4" /><path d="M 104.00 267 L 104.00 267.00 L 132.80 267.00 L 168.80 267.00 L 190.40 267.00 L 195.22 267.00 L 195.30 186.17 L 195.37 186.17 L 219.20 186.17 L 248.00 186.17 L 276.80 186.17 L 298.40 186.17 L 320.00 186.17 L 341.60 186.17 L 363.20 186.17 L 392.00 186.17 L 420.80 186.17 L 444.63 186.17 L 444.70 186.17 L 444.78 267.00 L 449.60 267.00 L 471.20 267.00 L 507.20 267.00 L 536.00 267.00 L 536.00 267 Z" fill="#dfaa6b" fill-opacity=".15" stroke="#c58737" stroke-width="2" stroke-linejoin="round" /><path d="M 104.00 267 L 104.00 267.00 L 132.80 267.00 L 168.80 267.00 L 190.40 267.00 L 195.22 267.00 L 195.30 186.17 L 195.37 186.17 L 219.20 186.17 L 248.00 186.17 L 276.80 186.17 L 298.40 186.17 L 320.00 186.17 L 341.60 186.17 L 363.20 186.17 L 392.00 186.17 L 420.80 186.17 L 444.63 186.17 L 444.70 186.17 L 444.78 267.00 L 449.60 267.00 L 471.20 267.00 L 507.20 267.00 L 536.00 267.00 L 536.00 267 Z" fill="#0e969c" fill-opacity=".14" stroke="#117f88" stroke-width="3" stroke-linejoin="round"><animate attributeName="d" values="M 104.00 267 L 104.00 267.00 L 132.80 267.00 L 168.80 267.00 L 190.40 267.00 L 195.22 267.00 L 195.30 186.17 L 195.37 186.17 L 219.20 186.17 L 248.00 186.17 L 276.80 186.17 L 298.40 186.17 L 320.00 186.17 L 341.60 186.17 L 363.20 186.17 L 392.00 186.17 L 420.80 186.17 L 444.63 186.17 L 444.70 186.17 L 444.78 267.00 L 449.60 267.00 L 471.20 267.00 L 507.20 267.00 L 536.00 267.00 L 536.00 267 Z;M 104.00 267 L 104.00 265.76 L 132.80 263.20 L 168.80 254.68 L 190.40 244.89 L 195.22 242.12 L 195.30 242.07 L 195.37 242.03 L 219.20 225.08 L 248.00 1