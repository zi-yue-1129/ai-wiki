<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Top-2 score ties: opposite results with identical scores</title><desc id="desc">Two synthetic rank-order panels have identical scores but different tie-breaking. The top two choices are A B when ties favor lower index, excluding true C; they are A C when ties favor higher index, including true C. Both use k equal to two.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173349}.title{font-weight:700;font-size:19px}.caption{font-size:11px;fill:#607889}.lab{font-size:13px;font-weight:650}.cell{font-size:14px;font-weight:700}.count{font-size:23px;font-weight:700}.good{fill:#087f72}.bad{fill:#a45e30}.phase{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.phase{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f1f6fa" stroke="none" /><rect x="14" y="14" width="612" height="332" rx="13" fill="white" stroke="#d8e5ed" /><text x="30" y="45" class="title" text-anchor="start" >TOP-2  /  TIE AT THE BOUNDARY</text><text x="30" y="66" class="caption" text-anchor="start" >True class C  ·  A .90  B .70  C .70  D .20</text><rect x="31" y="90" width="278" height="219" rx="12" fill="#f8fbfd" stroke="#d8e5ed" /><text x="48" y="116" class="lab" text-anchor="start" >LOW INDEX FIRST</text><rect x="50" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="77.5" y="168" class="caption" text-anchor="middle" >1</text><text x="77.5" y="190" class="cell" text-anchor="middle" >A</text><rect x="112" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="139.5" y="168" class="caption" text-anchor="middle" >2</text><text x="139.5" y="190" class="cell" text-anchor="middle" >B</text><rect x="174" y="143" width="55" height="60" rx="7" fill="#fff1c9" stroke="#b47a12" /><text x="201.5" y="168" class="caption" text-anchor="middle" >3</text><text x="201.5" y="190" class="cell" text-anchor="middle" >C</text><rect x="236" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="263.5" y="168" class="caption" text-anchor="middle" >4</text><text x="263.5" y="190" class="cell" text-anchor="middle" >D</text><rect x="47" y="138" width="125" height="70" rx="9" fill="none" stroke="#087f72" stroke-width="2.5"/><text x="54" y="238" class="lab bad" text-anchor="start" >MISSED</text><text x="54" y="274" class="lab" text-anchor="start" >Top-2 = 0 / 1</text><rect x="331" y="90" width="278" height="219" rx="12" fill="#f8fbfd" stroke="#d8e5ed" /><text x="348" y="116" class="lab" text-anchor="start" >HIGH INDEX FIRST</text><rect x="350" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="377.5" y="168" class="caption" text-anchor="middle" >1</text><text x="377.5" y="190" class="cell" text-anchor="middle" >A</text><rect x="412" y="143" width="55" height="60" rx="7" fill="#fff1c9" stroke="#b47a12" /><text x="439.5" y="168" class="caption" text-anchor="middle" >2</text><text x="439.5" y="190" class="cell" text-anchor="middle" >C</text><rect x="474" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="501.5" y="168" class="caption" text-anchor="middle" >3</text><text x="501.5" y="190" class="cell" text-anchor="middle" >B</text><rect x="536" y="143" width="55" height="60" rx="7" fill="#edf3f8" stroke="#d3e0e9" /><text x="563.5" y="168" class="caption" text-anchor="middle" >4</text><text x="563.5" y="190" class="cell" text-anchor="middle" >D</text><rect x="347" y="138" width="125" height="70" rx="9" fill="none" stroke="#087f72" stroke-width="2.5"/><text x="354" y="238" class="lab good" text-anchor="start" >FOUND</text><text x="354" y="274" class="lab" text-anchor="start" >Top-2 = 1 / 1</text><text x="37" y="331" class="caption" text-anchor="start" >Same scores; only the tie-breaking rule changes</text></svg>