<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><title id="title">BinaryConnect latent weight accumulation</title><desc id="description">Four schematic SGD increments move a stored real weight across zero; binary signs change only after the third update.</desc><style>.fallback{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.fallback{display:inline}}</style><g class="moving"><rect x="0" y="0" width="640" height="360" rx="14" fill="#f7fbff"/><text x="22" y="34" font-size="23" fill="#1b3651" text-anchor="start">BinaryConnect · latent updates</text><text x="22" y="59" font-size="16" fill="#1b3651" text-anchor="start">SGD increment +0.2 per step</text><rect x="16" y="73" width="608" height="250" rx="9" fill="#ffffff"/><line x1="115" y1="85" x2="598" y2="85" stroke="#dbe5ed" stroke-width="2" /><text x="101" y="90" font-size="14" fill="#1b3651" text-anchor="end">0.6</text><line x1="115" y1="145" x2="598" y2="145" stroke="#dbe5ed" stroke-width="2" stroke-dasharray="5 4"/><text x="101" y="150" font-size="14" fill="#1b3651" text-anchor="end">0</text><line x1="115" y1="205" x2="598" y2="205" stroke="#dbe5ed" stroke-width="2" /><text x="101" y="210" font-size="14" fill="#1b3651" text-anchor="end">-0.6</text><text x="28" y="116" font-size="15" fill="#1b3651" text-anchor="start">Latent w</text><text x="26" y="274" font-size="16" fill="#1b3651" text-anchor="start">Binary</text><text x="26" y="300" font-size="14" fill="#1b3651" text-anchor="start">sign(w)</text><line x1="150" y1="82" x2="150" y2="235" stroke="#dbe5ed" stroke-width="2" /><text x="150" y="244" font-size="14" fill="#1b3651" text-anchor="middle">Step 0</text><circle cx="150" cy="205" r="7" fill="#35678f" stroke="#fff" stroke-width="2"/><text x="150" y="192" font-size="17" fill="#35678f" text-anchor="middle">-0.6</text><rect x="115" y="257" width="70" height="44" rx="5" 