<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Original LSTM write retain read overview</title><desc id="desc">Input flows through a write gate to the self-recurrent cell state, then through a read gate to output. The 1997 two-gate LSTM design is illustrated; no forget gate is depicted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#86a2b1" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263d51}.heading{font-size:24px;font-weight:700}.tag{font-size:17px;font-weight:700}.tiny{font-size:12px;font-weight:600;letter-spacing:1px;fill:#6b8799}.frame{fill:#fff;stroke:#c7d9e3;stroke-width:1.5}.wire{fill:none;stroke:#86a2b1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style><rect width="760" height="380" rx="20" fill="#f7fafc"/><rect x="1" y="1" width="758" height="378" rx="19" fill="none" stroke="#dce8ef"/><text class="heading" x="32" y="42">LSTM memory cell</text><text class="tiny" x="32" y="64">ORIGINAL TWO-GATE DESIGN</text><path d="M474 158C558 76 203 76 288 158" fill="none" stroke="#c6d9e2" stroke-width="10" stroke-linecap="round"/><path d="M474 158C558 76 203 76 288 158" fill="none" stroke="#478eb2" stroke-width="3" stroke-dasharray="11 13" marker-end="url(#arrow)"/><path class="wire" d="M118 277H173"/><path class="wire" d="M228 277L314 226"/><path class="wire" d="M468 226L541 277"/><path class="wire" d="M596 277H646"/><rect class="frame" x="287" y="126" width="187" height="102" rx="17"/><text x="380" y="157" text-anchor="middle" class="tag">cell state</text><rect x="310" y="175" width="32" height="29" rx="7" fill="#288f86"/><rect x="350" y="175" width="32" height="29" rx="7" fill="#288f86"/><rect x="390" y="175" width="32" height="29" rx="7" fill="#288f86"/><rect x="430" y="175" width="22" height="29" rx="7" fill="#288f86"/><rect x="44" y="252" width="74" height="50" rx="12" fill="#e1edf3" stroke="#b9d1df" stroke-width="1.4"/><text x="81" y="282" class="tag" text-anchor="middle">input</text><circle cx="201" cy="277" r="27" fill="#fff" stroke="#c5d6de" stroke-width="2"/><circle cx="201" cy="277" r="20" fill="#288f86"/><text x="201" y="284" text-anchor="middle" font-size="19" font-weight="700" style="fill:white">×</text><circle cx="568" cy="277" r="27" fill="#fff" stroke="#c5d6de" stroke-width="2"/><circle cx="568" cy="277" r="20" fill="#c78d45"/><text x="568" y="284" text-anchor="middle" font-size="19" font-weight="700" style="fill:white">×</text><rect x="646" y="252" width="78" height="50" rx="12" fill="#e1edf3" stroke="#b9d1df" stroke-width="1.4"/><text x="685" y="282" class="tag" text-anchor="middle">output</text><text x="201" y="328" class="tiny" text-anchor="middle">WRITE</text><text x="380" y="328" class="tiny" text-anchor="middle">RETAIN</text><text x="568" y="328" class="tiny" text-anchor="middle">READ</text><rect x="161" y="343" width="80" height="5" rx="2" fill="#288f86"/><rect x="340" y="343" width="80" height="5" rx="2" fill="#478eb2"/><rect x="528" y="343" width="80" height="5" rx="2" fill="#c78d45"/></svg>