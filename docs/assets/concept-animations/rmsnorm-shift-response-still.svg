<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="RMSNorm and LayerNorm at zero input offset"><title>RMSNorm and LayerNorm at zero input offset</title><desc>An illustrative two-feature input (1+b, 3+b) is shifted by b from zero to two and back. Input bars change. RMSNorm output changes since it does not subtract the mean. LayerNorm always produces (-1, 1) in this idealised epsilon-zero, unit-gain comparison. Axes are individually scaled and this is not benchmark data.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#0f172a" stroke="none"/><text x="24" y="32" font-size="17" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">RMSNORM vs LAYERNORM</text><text x="615" y="31" font-size="12" fill="#adc0d8" font-family="Arial, sans-serif" font-weight="500" text-anchor="end">ADD THE SAME OFFSET</text><rect x="24" y="63" width="174" height="253" rx="14" fill="#19243b" stroke="#31435b"/><text x="37" y="87" font-size="13" fill="#a6a1ff" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">INPUT</text><text x="37" y="104" font-size="11" fill="#adc0d8" font-family="Arial, sans-serif" font-weight="500" text-anchor="start">1+b, 3+b</text><line x1="42" y1="271" x2="181" y2="271" stroke="#5b7090" stroke-width="1.4"/><rect x="64" y="244" width="34" height="27" rx="5" fill="#a6a1ff"></rect><text x="81" y="298" font-size="12" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="600" text-anchor="middle">x₁</text><rect x="129" y="190" width="34" height="81" rx="5" fill="#a6a1ff"></rect><text x="146" y="298" font-size="12" fill="#ecf3ff" font-family="Arial, sans-serif" font-weight="600" text-anchor="middle">x₂</text><rect x="233" y="63" width="174" height="253" rx="14" fill="#19243b" stroke="#31435b"/><text x="246" y="87" font-size="13" fill="#34d5b4" font-family="Arial, sans-serif" font-weight="700" text-anchor="start">RMSNORM</text><text x="246" y="104" fon