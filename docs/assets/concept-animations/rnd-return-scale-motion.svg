<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 412" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">RND bonus scaling across return variances</title><desc id="svg-desc">The same raw feature prediction error four is divided by three illustrative return standard deviations of one, two and four. The resulting bonus changes from four to two to one. These are synthetic counterfactual scales, not a training log.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:19px;font-weight:700;fill:#29435d}.small{font-size:13px;fill:#526b84}.lbl{font-size:16px;font-weight:700;fill:#29435d}.line{stroke:#c3d2e0;stroke-width:2} .box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5} @media(prefers-reduced-motion:reduce){.motion-dot{display:none}}</style><rect width="380" height="412" rx="16" fill="#f7f9fd"/><text x="22" y="34" class="title">RND · REWARD SCALE</text><text x="22" y="57" class="small">Same prediction error · different return spread</text>
<rect class="box" x="20" y="76" width="340" height="63" rx="12"/><text class="lbl" x="38" y="102">Raw bonus</text><rect x="38" y="113" width="282" height="12" rx="6" fill="#e5edf5"/><rect x="38" y="113" width="240" height="12" rx="6" fill="#e19a55"/><text x="326" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#a36829">4</text>
<text x="22" y="151" class="small">Running return standard deviation</text><g><rect x="24" y="155" width="98" height="48" rx="10" fill="#2876a7" opacity=".14"/><rect x="24" y="155" width="98" height="48" rx="10" fill="none" stroke="#2876a7" stroke-width="3" opacity="1"><animate attributeName="opacity" values="1;1;.25;.25;.25;.25;1" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="73" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#2876a7">σ = 1</text></g><g><rect x="141" y="155" width="98" height="48" rx="10" fill="#148577" opacity=".14"/><rect x="141" y="155" width="98" height="48" rx="10" fill="none" stroke="#148577" stroke-width="3" opacity="1"><animate attributeName="opacity" values=".25;.25;1;1;.25;.25;.25" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="190" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#148577">σ = 2</text></g><g><rect x="258" y="155" width="98" height="48" rx="10" fill="#b4742a" opacity=".14"/><rect x="258" y="155" width="98" height="48" rx="10" fill="none" stroke="#b4742a" stroke-width="3" opacity="1"><animate attributeName="opacity" values=".25;.25;.25;.25;1;1;.25" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="307" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#b4742a">σ = 4</text></g><path d="M190 211V245" fill="none" stroke="#8ea4b9" stroke-width="3"/><path d="M184 237L190 246 196 237" fill="none" stroke="#8ea4b9" stroke-width="3"/><rect class="box" x="20" y="255" width="340" height="107" rx="12"/><text x="38" y="282" class="lbl">Scaled bonus</text><text x="38" y="301" class="small">error / σ_return</text><rect x="38" y="316" width="282" height="20" rx="8" fill="#e5edf5"/><rect x="38" y="316" width="240" height="20" rx="8" fill="#168a7d"><animate attributeName="width" values="240;240;120;120;60;60;240" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="324" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#15796f" opacity="1"><animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/>4.0</text><text x="324" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#15796f" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/>2.0</text><text x="324" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#15796f" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.3;.32;.63;.65;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/>1.0</text><text x="22" y="396" class="small">σ comes from intrinsic return history</text></svg>