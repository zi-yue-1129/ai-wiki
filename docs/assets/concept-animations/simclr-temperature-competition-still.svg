-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">B1</text><rect x="322" y="134" width="240" height="20" rx="5" fill="#eef3f6" stroke="#eef3f6"/><rect x="322" y="134" width="56.727" height="20" rx="4" fill="none" stroke="#9aabba" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="322" y="137" width="27.649" height="14" rx="4" fill="#d48647"></rect><text x="257" y="193" fill="#667b8d" font-size="12" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">B2</text><rect x="322" y="178" width="240" height="20" rx="5" fill="#eef3f6" stroke="#eef3f6"/><rect x="322" y="178" width="42.024" height="20" rx="4" fill="none" stroke="#9aabba" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="322" y="181" width="6.169" height="14" rx="4" fill="#d48647"></rect><text x="257" y="237" fill="#667b8d" font-size="12" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">C1</text><rect x="322" y="222" width="240" height="20" rx="5" fill="#eef3f6" stroke="#eef3f6"/><rect x="322" y="222" width="31.132" height="20" rx="4" fill="none" stroke="#9aabba" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="322" y="225" width="1.377" height="14" rx="4" fill="#d48647"></rect><text x="257" y="281" fill="#667b8d" font-size="12" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">C2</text><rect x="322" y="266" width="240" height="20" rx="5" fill="#eef3f6" stroke="#eef3f6"/><rect x="322" y="266" width="25.489" height="20" rx="4" fill="none" stroke="#9aabba" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="322" y="269" width="0.506" height="14" rx="4" fill="#d48647"></rect><text x="255" y="304" fill="#667b8d" font-size="11" font-weight="600" text-anchor="start" font-family="Arial,Helvetica,sans-serif">τ: 1.0</text><text x="570" y="304" fill="#667b8d" font-size="11" font-weight="600" text-anchor="end" font-family="Arial,Helvetica,sans-serif">0.2</text><line x1="320" y1="301" x2="558" y2="301" stroke