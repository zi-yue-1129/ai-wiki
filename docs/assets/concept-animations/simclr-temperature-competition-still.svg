<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">SimCLR temperature softmax for one anchor</title><desc id="figdesc">An anchor has one positive and four negative in-batch views. Fixed illustrative cosine similarities are converted to a softmax. Lowering temperature from one to 0.2 sharpens the probability assigned to the strongest match; gray outlines show the high-temperature baseline.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="#f7fafc"/><text x="24" y="31" fill="#20364c" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SimCLR</text><text x="103" y="31" fill="#667b8d" font-size="13" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">NT-Xent · temperature competition</text><rect x="20" y="49" width="208" height="266" rx="10" fill="#fff" stroke="#dbe6ef"/><rect x="240" y="49" width="380" height="266" rx="10" fill="#fff" stroke="#dbe6ef"/><text x="35" y="70" fill="#667b8d" font-size="11" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">IN-BATCH VIEWS</text><text x="255" y="70" fill="#667b8d" font-size="11" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SOFTMAX WEIGHTS</text><circle cx="76" cy="180" r="28" fill="#e5f3ff" stroke="#3d80bb" stroke-width="2.5"/><text x="76" y="185" fill="#3d80bb" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><text x="76" y="222" fill="#667b8d" font-size="12" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">anchor</text><path d="M100 180 Q141 101 171 101" fill="none" stroke="#159988" stroke-width="4" opacity="1"/><circle cx="192" cy="101" r="16" fill="#e3f7ef" stroke="#159988" stroke-width="1.8"/><text x="192" y="105" fill="#159988" font-size="11" font-weight="700" text-anchor="middl