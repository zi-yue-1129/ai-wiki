<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A3C asynchronous worker rollouts and shared parameter updates</title><desc id="desc">Worker one and worker two collect different n-step trajectories on local parameter copies. Their gradient updates reach the global parameters at different times, so worker two may apply a stale gradient. Synthetic timing; not measured training.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1"/><text x="30" y="38" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">A3C  ·  asynchronous actor-learners</text><text x="30" y="57" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Two local rollouts, shared parameters, no gradient barrier</text><rect x="26" y="91" width="424" height="90" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5"/><rect x="39" y="104" width="75" height="27" rx="7" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="76" y="122" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">W1  θ₀</text><text x="40" y="160" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">local copy</text><circle cx="160" cy="135" r="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5"/><text x="160" y="139" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1</text><path d="M173 135 H203" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="216" cy="135" r="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5"/><text x="216" y="139" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s2</text><path d="M229 135 H259" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="272" cy="135" r="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5"/><text x="272" y="139" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s3</text><path d="M286 135 H330" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="330" y="116" width="94" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/><text x="377" y="141" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">g1</text><path d="M424 136 C465 136,455 130,480 130" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/><circle class="motion" cx="160" cy="135" r="5" fill="#2563eb"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.45;0.50;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cx" values="160;216;272;377;480;480" keyTimes="0;0.13;0.25;0.39;0.49;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="135;135;135;135;130;130" keyTimes="0;0.13;0.25;0.39;0.49;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><rect x="26" y="195" width="424" height="90" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5"/><rect x="39" y="208" width="75" height="27" rx="7" fill="#e7f7f4" stroke="none" stroke-width="0"/><text x="76" y="226" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">W2  θ₀</text><text x="40" y="264" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">local copy</text><circle cx="160" cy="239" r="13" fill="#e7f7f4" stroke="#0f9187" stroke-width="1.5"/><text x="160" y="243" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1</text><path d="M173 239 H203" fill="none" stroke="#0f9187" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="216" cy="239" r="13" fill="#e7f7f4" stroke="#0f9187" stroke-width="1.5"/><text x="216" y="243" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s2</text><path d="M229 239 H259" fill="none" stroke="#0f9187" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="272" cy="239" r="13" fill="#e7f7f4" stroke="#0f9187" stroke-width="1.5"/><text x="272" y="243" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s3</text><path d="M286 239 H330" fill="none" stroke="#0f9187" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="330" y="220" width="94" height="40" rx="8" fill="#ffffff" stroke="#0f9187" stroke-width="1.7"/><text x="377" y="245" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">g2</text><path d="M424 240 C465 240,455 236,480 236" fill="none" stroke="#0f9187" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 5"/><circle class="motion" cx="160" cy="239" r="5" fill="#0f9187"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.78;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cx" values="160;160;216;272;377;480" keyTimes="0;0.35;0.47;0.60;0.71;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="239;239;239;239;236;236" keyTimes="0;0.13;0.25;0.39;0.49;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><rect x="480" y="135" width="134" height="90" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5"/><text x="547" y="163" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Shared θ</text><path d="M481 130 L490 142" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M481 236 L490 217" fill="none" stroke="#0f9187" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><g class="motion" opacity="0"><text x="547" y="197" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">θ₀</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0;0.0001;0.42;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="motion" opacity="0"><text x="547" y="197" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">θ₁</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.4201;0.76;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="motion" opacity="0"><text x="547" y="197" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">θ₂</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.7601;0.99;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="motion" opacity="0"><path d="M497 216 H599" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.43;0.4301;0.52;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="motion" opacity="0"><path d="M497 216 H599" fill="none" stroke="#0f9187" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.77;0.7701;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="reduced" display="none"><text x="547" y="198" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">θ₀ → θ₂</text></g><rect x="28" y="304" width="584" height="36" rx="8" fill="#edf2f7" stroke="none" stroke-width="0"/><text x="42" y="326" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="start">W2 still uses its θ₀ snapshot when g₂ reaches shared θ</text><g class="motion" opacity="0"><rect x="35" y="300" width="150" height="4" rx="2" fill="#2563eb" stroke="none" stroke-width="0"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.0501;0.45;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g><g class="motion" opacity="0"><rect x="185" y="300" width="206" height="4" rx="2" fill="#0f9187" stroke="none" stroke-width="0"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.4501;0.75;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g></svg>