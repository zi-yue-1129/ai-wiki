<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">A3C asynchronous worker rollouts and shared parameter updates</ns0:title><ns0:desc id="desc">Worker one and worker two collect different n-step trajectories on local parameter copies. Their gradient updates reach the global parameters at different times, so worker two may apply a stale gradient. Synthetic timing; not measured training.</ns0:desc><ns0:style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.reduced{display:inline!important}}</ns0:style><ns0:rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1" /><ns0:text x="30" y="38" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">A3C  ·  asynchronous actor-learners</ns0:text><ns0:text x="30" y="57" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Two local rollouts, shared parameters, no gradient barrier</ns0:text><ns0:rect x="26" y="91" width="424" height="90" rx="13" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.5" /><ns0:rect x="39" y="104" width="75" height="27" rx="7" fill="#edf4ff" stroke="none" stroke-width="0" /><ns0:text x="76" y="122" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">W1  θ₀</ns0:text><ns0:text x="40" y="160" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">local copy</ns0:text><ns0:circle cx="160" cy="135" r="13" fill="#edf4ff" stroke="#2563eb" stroke-width="1.5" /><ns0:text x="160" y="139" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle">s1</ns0:text><ns0:path d="M173 135 H203" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" 