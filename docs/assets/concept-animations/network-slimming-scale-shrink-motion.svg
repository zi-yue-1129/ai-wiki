<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Network slimming scale shrinkage</title><desc id="desc">Four signed batch normalization scales shrink under two illustrative penalty-only updates. Magnitude threshold 0.15 retains A and B. The animation interpolates between discrete updates.</desc><rect width="640" height="360" rx="12" fill="#f7fafc"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="31" font-size="24" fill="#294456" text-anchor="middle">BN scale sparsity</text><text x="205" y="59" font-size="18" fill="#294456" text-anchor="middle">|γ|</text><text x="505" y="59" font-size="18" fill="#294456" text-anchor="middle">Kept channels</text><text x="42" y="102" font-size="18" fill="#294456" text-anchor="middle">A</text><rect x="70" y="82" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="82" width="180" height="26" rx="5" fill="#35678f"><animate attributeName="width" values="180;180;160;160;140;140;180" keyTimes="0;.10;.28;.36;.54;.98;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.6000000000000001;.98;1" dur="12s" repeatCount="indefinite"/><text x="298" y="101" font-size="16" fill="#294456" text-anchor="middle">+0.7</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.76;.98;1" dur="12s" repeatCount="indefinite"/><path d="M325 95L415 95" stroke="#08756e" stroke-width="2" fill="none"/><rect x="415" y="82" width="180" height="26" rx="5" fill="#08756e"/><text x="505" y="101" font-size="17" fill="#ffffff" text-anchor="middle">A</text></g><text x="42" y="153" font-size="18" fill="#294456" text-anchor="middle">B</text><rect x="70" y="133" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="133" width="120" height="26" rx="5" fill="#35678f"><animate attributeName="width" values="120;120;100;100;80;80;120" keyTimes="0;.10;.28;.36;.54;.98;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.6000000000000001;.98;1" dur="12s" repeatCount="indefinite"/><text x="298" y="152" font-size="16" fill="#294456" text-anchor="middle">−0.4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.76;.98;1" dur="12s" repeatCount="indefinite"/><path d="M325 146L415 146" stroke="#08756e" stroke-width="2" fill="none"/><rect x="415" y="133" width="180" height="26" rx="5" fill="#08756e"/><text x="505" y="152" font-size="17" fill="#ffffff" text-anchor="middle">B</text></g><text x="42" y="204" font-size="18" fill="#294456" text-anchor="middle">C</text><rect x="70" y="184" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="184" width="60" height="26" rx="5" fill="#35678f"><animate attributeName="width" values="60;60;40;40;20;20;60" keyTimes="0;.10;.28;.36;.54;.98;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.6000000000000001;.98;1" dur="12s" repeatCount="indefinite"/><text x="298" y="203" font-size="16" fill="#294456" text-anchor="middle">+0.1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.76;.98;1" dur="12s" repeatCount="indefinite"/><text x="465" y="204" font-size="24" fill="#a26420" text-anchor="middle">×</text></g><text x="42" y="255" font-size="18" fill="#294456" text-anchor="middle">D</text><rect x="70" y="235" width="200" height="26" rx="5" fill="#dce4eb"/><rect x="70" y="235" width="40" height="26" rx="5" fill="#35678f"><animate attributeName="width" values="40;40;20;20;0;0;40" keyTimes="0;.10;.28;.36;.54;.98;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.6000000000000001;.98;1" dur="12s" repeatCount="indefinite"/><text x="298" y="254" font-size="16" fill="#294456" text-anchor="middle">0.0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.76;.98;1" dur="12s" repeatCount="indefinite"/><text x="465" y="255" font-size="24" fill="#a26420" text-anchor="middle">×</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.66;.98;1" dur="12s" repeatCount="indefinite"/><path d="M100 70V283" stroke="#a26420" stroke-width="2" stroke-dasharray="5 4"/><text x="110" y="303" font-size="16" fill="#a26420" text-anchor="middle">τ = 0.15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.86;.98;1" dur="12s" repeatCount="indefinite"/><text x="320" y="337" font-size="23" fill="#08756e" text-anchor="middle">4 → 2 channels</text></g></g></svg>
