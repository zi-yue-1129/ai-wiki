<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tied prediction scores enter the ROC curve together</title><desc id="desc">Six synthetic ranked scores contain two positives and four negatives. At threshold 0.7 a tied group with one positive and two negatives enters simultaneously, jumping from ROC point false positive rate zero, true positive rate one half to false positive rate one half, true positive rate one. The connecting diagonal is an interpolation, not an intermediate deterministic threshold. AUC equals seven eighths.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.head{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:600}.small{font-size:11px;fill:#61798a}.tiny{font-size:10px;fill:#61798a}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f0f7fb"/><text x="22" y="31" class="head">ROC thresholds with tied scores</text><rect x="20" y="48" width="600" height="286" rx="12" fill="#fff" stroke="#d3e4eb"/><text x="44" y="75" class="label">Score order</text><text x="214" y="75" class="small">Class</text><text x="363" y="75" class="label">ROC curve</text><line x1="321" y1="63" x2="321" y2="320" stroke="#e1edf2"/><rect x="38" y="134" width="264" height="86" rx="10" fill="#fff5e9" stroke="#e8b47d" stroke-dasharray="5 3"/><text x="54" y="129" class="tiny" style="fill:#a16a2c">TIED: 0.70</text><rect x="48" y="88" width="243" height="23" rx="7" fill="#f5fbfd" stroke="#e2eaf0"/><text x="67" y="104" class="label">.90</text><circle cx="236" cy="97" r="8" fill="#22909a"/><text x="236" y="101" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">+</text><rect x="48" y="139" width="243" height="23" rx="7" fill="#fff9f1" stroke="#e2eaf0"/><text x="67" y="155" class="label">.70</text><circle cx="236" cy="148" r="8" fill="#22909a"/><text x="236" y="152" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">+</text><rect x="48" y="166" width="243" height="23" rx="7" fill="#fff9f1" stroke="#e2eaf0"/><text x="67" y="182" class="label">.70</text><circle cx="236" cy="175" r="8" fill="#9a77bc"/><text x="236" y="179" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">−</text><rect x="48" y="193" width="243" height="23" rx="7" fill="#fff9f1" stroke="#e2eaf0"/><text x="67" y="209" class="label">.70</text><circle cx="236" cy="202" r="8" fill="#9a77bc"/><text x="236" y="206" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">−</text><rect x="48" y="235" width="243" height="23" rx="7" fill="#f5fbfd" stroke="#e2eaf0"/><text x="67" y="251" class="label">.40</text><circle cx="236" cy="244" r="8" fill="#9a77bc"/><text x="236" y="248" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">−</text><rect x="48" y="264" width="243" height="23" rx="7" fill="#f5fbfd" stroke="#e2eaf0"/><text x="67" y="280" class="label">.20</text><circle cx="236" cy="273" r="8" fill="#9a77bc"/><text x="236" y="277" style="fill:white;font-size:10px;font-weight:700" text-anchor="middle">−</text><path d="M362 102 V296 H574" fill="none" stroke="#809ead" stroke-width="1.6"/><path d="M362 199 H574 M468 102 V296" fill="none" stroke="#e5eef2" stroke-width="1"/><text x="351" y="300" class="tiny" text-anchor="end">0</text><text x="362" y="311" class="tiny" text-anchor="middle">0</text><text x="468" y="311" class="tiny" text-anchor="middle">.5</text><text x="574" y="311" class="tiny" text-anchor="middle">1</text><text x="351" y="204" class="tiny" text-anchor="end">.5</text><text x="351" y="106" class="tiny" text-anchor="end">1</text><text x="461" y="329" class="label" text-anchor="middle">FPR</text><text x="362" y="90" class="small">TPR</text><path d="M362 296 L362 199 L468 102 L574 102" fill="none" stroke="#b9cbd4" stroke-width="4" stroke-linejoin="round"/><path d="M362 199 L468 102" fill="none" stroke="#db965b" stroke-width="4" stroke-dasharray="6 5"/><circle cx="362" cy="199" r="5" fill="white" stroke="#db965b" stroke-width="2"/><circle cx="468" cy="102" r="5" fill="white" stroke="#db965b" stroke-width="2"/><text x="490" y="135" class="small" style="fill:#a16a2c">tie jump</text><text x="44" y="315" class="label" style="fill:#287b84">AUC = 7/8 = 0.875</text><text x="23" y="351" class="tiny">Synthetic ranks · a diagonal between tie endpoints is not a selectable cutoff</text><circle cx="574" cy="102" r="8" fill="#237e88" stroke="white" stroke-width="3"/></svg>