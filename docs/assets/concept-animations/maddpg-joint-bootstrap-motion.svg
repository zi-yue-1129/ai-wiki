<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">MADDPG joint replay bootstrap and one-agent critic TD residual</title><desc id="dsc">Replayed next observations enter each target actor; joint next actions enter agent one target critic; reward and discount produce y=2.12 and the agent-one TD error=0.72. Example numbers are illustrative.</desc><defs><marker id="blue-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3468b2"/></marker><marker id="teal-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b8992"/></marker><marker id="magenta-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bb5087"/></marker><marker id="amber-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c17a25"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.pulse,.glow{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f6f9fe" stroke="#f6f9fe" stroke-width="1.3"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#dbe4ef" stroke-width="1"/><text x="27" y="37" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#24364b">MADDPG / joint TD target</text><rect x="485" y="17" width="127" height="28" rx="14" fill="#e9f1fd" stroke="#e9f1fd" stroke-width="0"/><text x="548" y="36" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3468b2">CTDE training</text><rect x="23" y="61" width="594" height="172" rx="12" fill="white" stroke="#dbe4ef" stroke-width="1.3"/><text x="43" y="85" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#62758a">NEXT-STEP BOOTSTRAP</text><rect x="43" y="102" width="135" height="94" rx="13" fill="#e9f1fd" stroke="#3468b2" stroke-width="1.5"/><text x="110.5" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#3468b2">Replay x′</text><rect x="243" y="102" width="136" height="94" rx="13" fill="#e4f5f3" stroke="#0b8992" stroke-width="1.5"/><text x="311" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0b8992">Target actors</text><rect x="436" y="102" width="158" height="94" rx="13" fill="#fbecf4" stroke="#bb5087" stroke-width="1.5"/><text x="515" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#bb5087">Target critic</text><text x="110" y="161" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#24364b">o′₁ , o′₂</text><text x="311" y="158" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0b8992">μ′₁ , μ′₂</text><text x="311" y="184" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#62758a">a′₁ , a′₂</text><text x="515" y="160" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#24364b">Q′₁(x′,a′)</text><text x="515" y="188" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#bb5087">1.80</text><path d="M178 148 L239 148" fill="none" stroke="#3468b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-tip)"/><path d="M379 148 L432 148" fill="none" stroke="#0b8992" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-tip)"/><rect x="23" y="246" width="594" height="94" rx="12" fill="white" stroke="#dbe4ef" stroke-width="1.3"/><text x="41" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#62758a">TARGET</text><text x="145" y="299" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#24364b">0.50 + 0.90 × 1.80</text><text x="145" y="322" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#62758a">r₁ + γQ′₁</text><path d="M270 292 L304 292" fill="none" stroke="#c17a25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-tip)"/><rect x="313" y="266" width="120" height="59" rx="11" fill="#fff3de" stroke="#c17a25" stroke-width="1.5"/><text x="373" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#c17a25">y₁</text><text x="373" y="311" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#24364b">2.12</text><path d="M436 292 L466 292" fill="none" stroke="#c17a25" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber-tip)"/><rect x="473" y="266" width="121" height="59" rx="11" fill="#fbecf4" stroke="#bb5087" stroke-width="1.5"/><text x="533" y="284" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#bb5087">Q₁ = 1.40</text><text x="533" y="311" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#24364b">δ = 0.72</text><text x="42" y="221" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#62758a">Joint next actions are recomputed by slow target actors.</text><rect class="glow" x="43" y="102" width="135" height="94" rx="12" fill="none" stroke="#3468b2" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0;0" keyTimes="0;.1;.15;.32;.38;1" begin="0s" dur="12s" repeatCount="indefinite"/></rect><rect class="glow" x="2