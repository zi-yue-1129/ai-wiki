<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">SVD: rotate, stretch, rotate</title><desc id="desc">Toy two-dimensional map A=R(+30 degrees) diag(2,0.65) R(-35 degrees). Right-hand circle continuously changes through V-transpose, Sigma and U; not a learned model.</desc><rect width="640" height="360" rx="16" fill="#f7fbfd" stroke="#cfdee7"/><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#087f83" stroke-width="1.8"/></marker><marker id="ambertip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#dc8a35" stroke-width="1.8"/></marker></defs><rect x="19" y="61" width="282" height="226" rx="14" fill="#fff" stroke="#d7e3ec"/><rect x="319" y="61" width="302" height="226" rx="14" fill="#fff" stroke="#d7e3ec"/><text x="160" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#20394e">Unit circle</text><text x="469" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#20394e">A = U Σ Vᵀ</text><circle cx="160" cy="170" r="63" fill="none" stroke="#d7e3ec" stroke-width="1.6"/><line x1="85" y1="170" x2="235" y2="170" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" /><line x1="160" y1="95" x2="160" y2="245" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" /><circle cx="466" cy="170" r="65" fill="none" stroke="#d7e3ec" stroke-width="1.6"/><line x1="389" y1="170" x2="543" y2="170" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" /><line x1="466" y1="93" x2="466" y2="247" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" /><circle cx="160" cy="170" r="54" stroke="#c4d7e2" fill="#e9f4f6" fill-opacity=".42" stroke-width="2"/><line x1="160" y1="170" x2="214" y2="170" stroke="#dc8a35" stroke-width="3" stroke-linecap="round" marker-end="url(#ambertip)"/><line x1="160" y1="170" x2="160" y2="116" stroke="#087f83" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/><text x="226" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#dc8a35">e₁</text><text x="166" y="110" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#087f83">e₂</text><g transform="translate(466 170) rotate(-30)"><ellipse rx="108" ry="35.1" fill="none" stroke="#a8bfcb" stroke-width="1.7" stroke-dasharray="4 6"/></g><style>@media(prefers-reduced-motion:reduce){.animated{display:none!important}.reduced{display:inline!important}}</style><g class="animated" transform="translate(466 170)"><g><animateTransform attributeName="transform" type="rotate" values="0;0;0;-30;-30" keyTimes="0;.44;.65;.86;1" dur="12s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;2 .65;2 .65;2 .65" keyTimes="0;.25;.49;.86;1" dur="12s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;35;35;35;35" keyTimes="0;.25;.49;.86;1" dur="12s" repeatCount="indefinite"/><circle r="54" fill="#087f83" fill-opacity=".10" stroke="#087f83" stroke-width="2.8"/><line x1="0" y1="0" x2="54" y2="0" stroke="#dc8a35" stroke-width="2.7" stroke-linecap="round" marker-end="url(#ambertip)"/><line x1="0" y1="0" x2="0" y2="-54" stroke="#397bb6" stroke-width="2.7" stroke-linecap="round" /></g></g></g></g><g class="reduced" display="none"><g transform="translate(466 170)"><g transform="rotate(-30)"><g transform="scale(2 .65)"><g transform="rotate(35)"><circle r="54" fill="#087f83" fill-opacity=".10" stroke="#087f83" stroke-width="2.8"/><line x1="0" y1="0" x2="54" y2="0" stroke="#dc8a35" stroke-width="2.7" stroke-linecap="round" marker-end="url(#ambertip)"/><line x1="0" y1="0" x2="0" y2="-54" stroke="#397bb6" stroke-width="2.7" stroke-linecap="round" /></g></g></g></g></g><rect x="21" y="297" width="597" height="48" rx="10" fill="#e9f2f7" stroke="#d7e3ec"/><circle cx="71" cy="320" r="5" fill="#dc8a35"/><text x="132" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#20394e">Vᵀ  −35°</text><circle cx="260" cy="320" r="5" fill="#087f83"/><text x="321" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#20394e">Σ  2 × 0.65</text><circle cx="453" cy="320" r="5" fill="#397bb6"/><text x="514" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#20394e">U  +30°</text></svg>