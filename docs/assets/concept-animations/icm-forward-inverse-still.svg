<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="icm-title icm-desc">
<title id="icm-title">Intrinsic curiosity module: forward prediction error and inverse action training (initial state)</title>
<desc id="icm-desc">State and next-state observations pass through an encoder. A forward model uses the current feature and action to predict the next feature, which approaches the encoded actual next feature as training proceeds. A separate inverse model predicts the action from the two features, shown by a purple output arrow separate from the next-feature target. All positions are schematic. Static first-frame preview; no motion is required to understand the pipeline.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif}
 .lbl{font-size:15px;fill:#263b52;font-weight:700}
 .edge{fill:none;stroke:#8497ad;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .resting{display:none}
 @media(prefers-reduced-motion:reduce){.animated{display:none}.resting{display:inline}}
</style>
<defs><marker id="icm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8497ad"/></marker></defs>
<rect width="680" height="370" rx="16" fill="#fff"/>
<text x="27" y="38" font-size="23" font-weight="700" fill="#142238">ICM · curiosity in feature space</text>
<text x="27" y="61" font-size="15" fill="#53677f">Action-conditioned prediction and inverse dynamics</text>
<!-- current observation, action, next observation -->
<rect x="27" y="104" width="93" height="52" rx="10" fill="#eff5fa" stroke="#c5d4e5" stroke-width="2"/>
<text x="73" y="136" font-size="22" font-weight="700" fill="#33577a" text-anchor="middle">s<tspan font-size="14" baseline-shift="sub">t</tspan></text>
<rect x="27" y="267" width="93" height="52" rx="10" fill="#eff5fa" stroke="#c5d4e5" stroke-width="2"/>
<text x="73" y="299" font-size="22" font-weight="700" fill="#33577a" text-anchor="middle">s<tspan font-size="14" baseline-shift="sub">t+1</tspan></text>
<rect x="252" y="192" width="88" height="46" rx="10" fill="#fff3e7" stroke="#efc698" stroke-width="2"/>
<text x="296" y="221" font-size="19" font-weight="700" fill="#9b5e2a" text-anchor="middle">Action</text>
<path class="edge" d="M120 130H146" marker-end="url(#icm-arrow)"/>
<path class="edge" d="M120 292H146" marker-end="url(#icm-arrow)"/>
<rect x="148" y="103" width="99" height="54" rx="11" fill="#e8f1fb" stroke="#97b6d9" stroke-width="2"/>
<rect x="148" y="266" width="99" height="54" rx="11" fill="#e8f1fb" stroke="#97b6d9" stroke-width="2"/>
<text x="197" y="136" class="lbl" text-anchor="middle">Encoder</text>
<text x="197" y="298" class="lbl" text-anchor="middle">Encoder</text>
<path class="edge" d="M247 130H288" marker-end="url(#icm-arrow)"/>
<path class="edge" d="M247 292H288" marker-end="url(#icm-arrow)"/>
<circle cx="306" cy="130" r="13" fill="#3f73b1" stroke="#fff" stroke-width="3"/>
<circle cx="306" cy="292" r="13" fill="#3f73b1" stroke="#fff" stroke-width="3"/>
<text x="301" y="111" font-size="14" fill="#355e8e" text-anchor="middle">φ<tspan font-size="11" baseline-shift="sub">t</tspan></text>
<text x="307" y="331" font-size="14" fill="#355e8e" text-anchor="middle">φ<tspan font-size="11" baseline-shift="sub">t+1</tspan></text>
<!-- forward depends on feature and action -->
<path class="edge" d="M320 129H363" marker-end="url(#icm-arrow)"/>
<path class="edge" d="M340 214H364V150" marker-end="url(#icm-arrow)"/>
<rect x="367" y="101" width="111" height="62" rx="12" fill="#edf7f4" stroke="#9ed3c4" stroke-width="2"/>
<text x="423" y="137" class="lbl" text-anchor="middle" fill="#097464">Forward</text>
<!-- inverse consumes both features and predicts action -->
<path class="edge" d="M328 130V181H367V271" stroke-dasharray="5 5" marker-end="url(#icm-arrow)"/>
<path class="edge" d="M321 292H367" marker-end="url(#icm-arrow)"/>
<rect x="369" y="268" width="108" height="50" rx="12" fill="#f3effb" stroke="#c3b5e1" stroke-width="2"/>
<text x="423" y="299" class="lbl" text-anchor="middle" fill="#7358a5">Inverse</text>
<!-- Inverse action prediction is separate from the forward next-feature target. -->
<path d="M477 293H499" fill="none" stroke="#8a69b7" stroke-width="2" stroke-linecap="round"/>
<path d="M494 289L500 293L494 297" fill="none" stroke="#8a69b7" stroke-width="2" stroke-linejoin="round"/>
<text x="504" y="299" font-size="14" fill="#7358a5" font-weight="700">â</text>
<!-- comparison window -->
<path class="edge" d="M478 132H505" marker-end="url(#icm-arrow)"/>
