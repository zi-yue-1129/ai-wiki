<text x="583" y="108" font-size="15" text-anchor="middle" font-weight="700" fill="#354860">Next feature</text>
<path d="M528 244H637M528 244V122" stroke="#c7d3e1" stroke-width="2"/>
<path d="M528 202H637M528 160H637M569 122V244M612 122V244" stroke="#e4ebf2" stroke-width="1.5"/>
<circle cx="604" cy="143" r="9" fill="#167e71" stroke="#fff" stroke-width="3"/>
