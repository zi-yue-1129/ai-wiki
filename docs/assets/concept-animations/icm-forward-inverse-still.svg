<g>
 <line x1="604" y1="143" x2="550" y2="229" stroke="#d67737" stroke-width="3" stroke-dasharray="5 5">
 </line>
 <circle cx="550" cy="229" r="9" fill="#d67737" stroke="#fff" stroke-width="3">
 </circle>
</g>
<text x="516" y="288" font-size="13" font-weight="700" fill="#53677f">Error → reward</text>
<rect x="516" y="302" width="138" height="16" rx="8" fill="#e8edf3"/>
<rect x="518" y="304" width="132" height="12" rx="6" fill="#d98a4a">
</rect>
<text x="27" y="353" font-size="13" fill="#66788e">Schematic training example; inverse learning encourages action-relevant features.</text>
</svg>
