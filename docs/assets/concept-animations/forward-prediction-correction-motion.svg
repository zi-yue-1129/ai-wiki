<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Forward model prediction and sensory correction</title><desc id="d">An initial position moves to predicted 0.60, a delayed sensory measurement at 0.90 appears, then a gain of 0.5 corrects the estimate to 0.75.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><rect x="16" y="16" width="608" height="328" rx="14" fill="#ffffff" stroke="#e2e8f0"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="34" y="48" fill="#0f172a" font-size="22" text-anchor="start">Forward model  /  sensory correction</text><text x="34" y="68" fill="#64748b" font-size="12" text-anchor="start">Prediction precedes delayed observation</text>
<rect x="36" y="85" width="175" height="74" rx="12" fill="#f8fafc" stroke="#dbe4ee"/><circle cx="56" cy="107" r="5" fill="#3b82f6"/><text x="70" y="112" fill="#334155" font-size="12" text-anchor="start">Predict</text><text x="56" y="144" fill="#3b82f6" font-size="20" text-anchor="start">0.60</text><rect x="232" y="85" width="175" height="74" rx="12" fill="#f8fafc" stroke="#dbe4ee"/><circle cx="252" cy="107" r="5" fill="#f97316"/><text x="266" y="112" fill="#334155" font-size="12" text-anchor="start">Sense</text><text x="252" y="144" fill="#f97316" font-size="20" text-anchor="start">0.90</text><rect x="428" y="85" width="175" height="74" rx="12" fill="#f8fafc" stroke="#dbe4ee"/><circle cx="448" cy="107" r="5" fill="#0d9488"/><text x="462" y="112" fill="#334155" font-size="12" text-anchor="start">Correct</text><text x="448" y="144" fill="#0d9488" font-size="20" text-anchor="start">0.75</text>
<line x1="96" y1="227" x2="547" y2="227" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="96" y1="219" x2="96" y2="236" stroke="#cbd5e1"/><text x="96" y="255" fill="#64748b" font-size="10" text-anchor="middle">0.0</text><line x1="185" y1="219" x2="185" y2="236" stroke="#cbd5e1"/><text x="185" y="255" fill="#64748b" font-size="10" text-anchor="middle">0.2</text><line x1="274" y1="219" x2="274" y2="236" stroke="#cbd5e1"/><text x="274" y="255" fill="#64748b" font-size="10" text-anchor="middle">0.4</text><line x1="363" y1="219" x2="363" y2="236" stroke="#cbd5e1"/><text x="363" y="255" fill="#64748b" font-size="10" text-anchor="middle">0.6</text><line x1="452" y1="219" x2="452" y2="236" stroke="#cbd5e1"/><text x="452" y="255" fill="#64748b" font-size="10" text-anchor="middle">0.8</text><line x1="541" y1="219" x2="541" y2="236" stroke="#cbd5e1"/><text x="541" y="255" fill="#64748b" font-size="10" text-anchor="middle">1.0</text>
<line x1="184" y1="177" x2="184" y2="218" stroke="#94a3b8" stroke-dasharray="3 4"/><text x="184" y="174" fill="#64748b" font-size="11" text-anchor="middle">Current</text><circle cx="184" cy="227" r="8" fill="#94a3b8" stroke="#fff" stroke-width="3"/>
<line x1="362" y1="199" x2="362" y2="218" stroke="#3b82f6" stroke-dasharray="3 4"/>
<line x1="495.5" y1="199" x2="495.5" y2="218" stroke="#f97316" stroke-dasharray="3 4"/>
<line x1="428.75" y1="199" x2="428.75" y2="218" stroke="#0d9488" stroke-dasharray="3 4"/>
<circle id="prediction" cx="362" cy="227" r="10" fill="#3b82f6" stroke="white" stroke-width="3"><animate attributeName="cx" values="184;184;362;362;362;362;184" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle id="sensation" cx="495.5" cy="227" r="10" fill="#f97316" stroke="white" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<circle id="correction" cx="428.75" cy="227" r="10" fill="#0d9488" stroke="white" stroke-width="3" opacity="0"><animate attributeName="cx" values="362;362;362;362;428.75;428.75;362" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle>
<g opacity="0"><path d="M362 276 v-7 H495.5 v7" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/><text x="428.75" y="293" fill="#ea580c" font-size="12" text-anchor="middle">error +0.30</text><animate attributeName="opacity" values="0;0;0;1;1;1;0" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g>
<g opacity="0"><path d="M362 302 H428.75" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/><text x="395.375" y="321" fill="#0d9488" font-size="11" text-anchor="middle">K = 0.50</text><animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.12;0.30;0.50;0.70;0.88;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></g></g></svg>