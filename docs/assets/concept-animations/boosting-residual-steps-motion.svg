<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Gradient boosting residual updates</title><desc id="desc">Six observed targets remain fixed while the model prediction moves from a constant mean through two additive two-leaf residual corrections at learning rate 0.6. Orange dashed residual lines shrink as the teal prediction updates. Values are illustrative, not measured model performance.</desc><rect width="640" height="360" rx="18" fill="#f7fafc"/><rect x="15" y="15" width="610" height="330" rx="17" fill="#fff" stroke="#dbe5ef" /><text x="29" y="43" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="750" fill="#172b4d" >GRADIENT BOOSTING</text><text x="29" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#64748b" >Fit residuals  ·  Add a small tree  ·  Recompute</text><rect x="28" y="77" width="400" height="243" rx="11" fill="#f9fbfe" stroke="#e2eaf3" /><text x="44" y="99" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" fill="#50627b" >TARGET vs PREDICTION</text><text x="44" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#78899e" >y</text><line x1="65" y1="131" x2="65" y2="292" stroke="#a9bbcc" stroke-width="1.5" /><line x1="65" y1="292" x2="407" y2="292" stroke="#a9bbcc" stroke-width="1.5" /><line x1="230" y1="130" x2="230" y2="289" stroke="#dde7f0" stroke-width="1.2" stroke-dasharray="4 6"/><line x1="93" y1="266" x2="93" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;235;247;247;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><line x1="144" y1="232" x2="144" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;235;247;247;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><line x1="195" y1="266" x2="195" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;235;247;247;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><line x1="274" y1="164" x2="274" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;174;161;161;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><line x1="325" y1="130" x2="325" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;174;161;161;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><line x1="376" y1="164" x2="376" y2="204" stroke="#e8aa57" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><animate attributeName="y2" values="204;174;161;161;204" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 75 204 H 230 V 204 H 411" fill="none" stroke="#168d86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><animate attributeName="d" values="M 75 204 H 230 V 204 H 411;M 75 235 H 230 V 174 H 411;M 75 247 H 230 V 161 H 411;M 75 247 H 230 V 161 H 411;M 75 204 H 230 V 204 H 411" keyTimes="0;0.29;0.62;0.91;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></path><circle cx="93" cy="266" r="6" fill="#fff" stroke="#294b6b" stroke-width="2.5"/><circle cx="93" cy="266" r="2.2" fill="#294b6b" stroke="none" /><circle cx="144" cy="232" r="6" fill="#fff" stroke="#294b6b" stroke-width="2.5"/><circle cx="144" cy="232" r="2.2" fill="#294b6b" stroke="none" /><circle cx="195" cy="266" r="6" fill="#fff" stroke="#294b6b" stroke-width="2.5"/><circle cx="195" cy="266" r="2.2" fill="#294b6b" stroke="none" /><circle cx="274" cy="164