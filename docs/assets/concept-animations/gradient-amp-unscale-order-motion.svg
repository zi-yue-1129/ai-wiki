<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Gradient clipping with automatic mixed precision loss scaling</title><desc id="desc">A synthetic gradient with L2 norm five is loss-scaled by four, giving norm twenty. Correct order: unscale to five then clip at two, final norm two. Incorrect: clip scaled gradient to two then unscale, final norm zero point five. Active stage reveals are algorithm stages, not measured training steps.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" fill="#f5f9fc" rx="18"></rect><text x="30" y="43" fill="#1b354d" font-size="23" font-weight="750">AMP: THE ORDER MATTERS</text><text x="30" y="66" fill="#647c90" font-size="12.5" font-weight="500">g = (3, 4) · loss scale S = 4 · L₂ cap τ = 2</text><rect x="22" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="43" y="123" fill="#1b354d" font-size="16" font-weight="750">UNSCALE → CLIP</text><rect x="408" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="429" y="123" fill="#1b354d" font-size="16" font-weight="750">CLIP → UNSCALE</text><text x="44" y="149" fill="#647c90" font-size="11" font-weight="600">Operation</text><text x="238" y="149" fill="#647c90" font-size="11" font-weight="600">L₂ magnitude</text><rect x="40" y="160" width="333" height="54" fill="#f4f8fb" rx="8" stroke="#e5edf2" stroke-width="1"></rect><text x="51" y="193" fill="#1b354d" font-size="16" font-weight="700">Scaled</text><rect x="199" y="180" width="113" height="15" fill="#e4ebf1" rx="7"></rect><rect x="199" y="180" width="113.0" height="15" fill="#078c84" rx="7"></rect><text x="359" y="192" fill="#078c84" font-size="15" 