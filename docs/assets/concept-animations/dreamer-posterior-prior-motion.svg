<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">Dreamer posterior conditioning and prior-only imagination</ns0:title><ns0:desc id="desc">Real observations condition posterior latent states during world-model learning; imagined future states and rewards are rolled forward by the prior without future observations. Original schematic, no model measurements.</ns0:desc><ns0:style>@media (prefers-reduced-motion: reduce){.motion-only{display:none!important}}</ns0:style><ns0:defs><ns0:marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#376cae" /></ns0:marker><ns0:marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#087f8a" /></ns0:marker><ns0:marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><ns0:path d="M0 0L10 5L0 10Z" fill="#b34f7c" /></ns0:marker></ns0:defs><ns0:rect x="0" y="0" width="640" height="360" rx="0" fill="#f4f7fb" stroke="#f4f7fb" /><ns0:text x="28" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#087f8a">DREAMER</ns0:text><ns0:text x="612" y="38" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#19334a">Posterior → Prior</ns0:text><ns0:rect x="19" y="64" width="602" height="137" rx="12" fill="#ffffff" stroke="#d7e2ec" /><ns0:rect x="19" y="214" width="602" height="128" rx="12" fill="#ffffff" stroke="#d7e2ec" /><ns0:text x="43" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788c">REAL EXPERIENCE</ns0:text><ns0:text x="300" y="239" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#63788