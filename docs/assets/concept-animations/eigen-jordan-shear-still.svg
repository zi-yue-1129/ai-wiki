<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Jordan shear</title><desc id="desc">Shearing a unit square keeps e1 fixed while e2 tilts; both eigenvalues remain one. At s greater than zero only the horizontal eigendirection exists.</desc><defs><marker id="teal-tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#0a8f91"/></marker><marker id="orange-tip" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#e1844f"/></marker></defs><rect width="800" height="420" rx="18" fill="#f7fafc"/><text x="34" y="43" font-family="Arial,sans-serif" font-size="21" fill="#17304a" font-weight="600">JORDAN SHEAR</text><text x="34" y="64" font-family="Arial,sans-serif" font-size="12" fill="#61788e" font-weight="500">A(s) = [[1, s], [0, 1]]     ·     s = 0 ... 1</text><rect x="34" y="88" width="344" height="281" rx="17" fill="white" stroke="#d9e5ed" stroke-width="1.5"/><rect x="422" y="88" width="344" height="281" rx="17" fill="white" stroke="#d9e5ed" stroke-width="1.5"/><text x="59" y="122" font-family="Arial,sans-serif" font-size="15" fill="#e1844f" font-weight="700">UNIT SQUARE</text><text x="446" y="122" font-family="Arial,sans-serif" font-size="15" fill="#0a8f91" font-weight="700">BASIS VECTORS</text><path d="M75 316H348M100 340V157" stroke="#e5edf3" stroke-width="1.5"/><rect x="100" y="208" width="108" height="108" fill="none" stroke="#e1844f" stroke-opacity=".37" stroke-dasharray="5 6" stroke-width="2"/><polygon points="100,316 208,316 316.00,208 208.00,208" stroke="#0a8f91" stroke-width="3" fill="#e9f6f5" fill-opacity=".72"></polygon><circle cx="100" cy="316" r="4" fill="#17304a"/><text x="215" y="334" font-family="Arial,sans-serif" font-size="14" fill="#17304a" font-weight="700">e₁</text><text x="73" y="198" font-family="Arial,sans-serif" font-size="14" fill="#61788e" font-weight="700">e₂</text><line x1="450" y1="317" x2="742" y2="317" stroke="#e5edf3" stroke-width="1.5"/><line x1="544" y1="145" x2="544" y2="342" stroke="#e5edf3" stroke-width="1.5"/><line x1="544" y1="317" x2="646" y2="317" stroke="#0a8f91" stroke-width="5" marker-end="url(#teal-tip)" stroke-linecap="round"/><text x="665" y="326" font-family="Arial,sans-serif" font-size="14" fill="#0a8f91" font-weight="700">e₁</text><path d="M544 214H647" stroke="#e1844f" stroke-opacity=".25" stroke-dasharray="6 6" stroke-width="2"/><line x1="544" y1="317" x2="647.00" y2="214" stroke="#e1844f" stroke-width="5" stroke-linecap="round" marker-end="url(#orange-tip)"></line><circle cx="647.00" cy="214" r="6" fill="#e1844f" stroke="white" stroke-width="2"></circle><text x="457" y="168" font-family="Arial,sans-serif" font-size="18" fill="#17304a" font-weight="700">λ₁ = λ₂ = 1</text><text x="573" y="198" font-family="Arial,sans-serif" font-size="13" fill="#61788e" font-weight="500">e₂ → e₂ + s e₁</text><text x="545" y="353" font-family="Arial,sans-serif" font-size="13" fill="#61788e" font-weight="500">e₁ fixed</text><text x="70" y="351" font-family="Arial,sans-serif" font-size="13" fill="#61788e" font-weight="500">s: 0 → 1 → 0</text><text x="34" y="398" font-family="Arial,sans-serif" font-size="11" fill="#61788e" font-weight="500">SCHEMATIC · REVIEWED STATE</text></svg>