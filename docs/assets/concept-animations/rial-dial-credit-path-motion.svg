<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">RIAL and DIAL communication credit paths</title><desc id="desc">RIAL learns discrete messages as actions through team reward and temporal-difference updates. DIAL adds a differentiable noisy communication channel during centralised training, so receiver loss gradients can travel to the sender. This is a schematic path, not a recorded training run.</desc><rect width="640" height="360" fill="#f5f8fc"/><text x="320" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1d334b">Communication and learning signals</text><rect x="18" y="60" width="294" height="279" rx="16" fill="#ffffff" stroke="#cad9e6" stroke-width="1.6"/><rect x="328" y="60" width="294" height="279" rx="16" fill="#ffffff" stroke="#cad9e6" stroke-width="1.6"/><rect x="32" y="73" width="85" height="26" rx="13" fill="#eaf0f6" stroke="none" stroke-width="0"/><text x="74" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#1d334b">RIAL</text><rect x="342" y="73" width="85" height="26" rx="13" fill="#e3f5f0" stroke="none" stroke-width="0"/><text x="384" y="91" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#008e89">DIAL</text><text x="170" y="93" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">discrete action</text><text x="499" y="93" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">differentiable training</text><rect x="36" y="125" width="83" height="62" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.6"/><text x="77.5" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1d334b">Sender</text><text x="77.5" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2776b7">A</text><rect x="345" y="125" width="83" height="62" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.6"/><text x="386.5" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1d334b">Sender</text><text x="386.5" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#2776b7">A</text><rect x="211" y="125" width="83" height="62" rx="10" fill="#f0f8f6" stroke="#008e89" stroke-width="1.6"/><text x="252.5" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d334b">Receiver</text><text x="252.5" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#008e89">B</text><rect x="520" y="125" width="83" height="62" rx="10" fill="#f0f8f6" stroke="#008e89" stroke-width="1.6"/><text x="561.5" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#1d334b">Receiver</text><text x="561.5" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#008e89">B</text><path d="M119 151 L211 151" stroke="#2776b7" stroke-width="3"  stroke-linecap="round" fill="none"/><polyline points="197,145 205,151 197,157" stroke="#2776b7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="144" y="164" width="43" height="23" rx="7" fill="#e7f2fa" stroke="#cad9e6" stroke-width="1.6"/><text x="165.5" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#2776b7">bit</text><path d="M428 151 L520 151" stroke="#2776b7" stroke-width="3"  stroke-linecap="round" fill="none"/><polyline points="506,145 514,151 506,157" stroke="#2776b7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="451" y="164" width="46" height="23" rx="7" fill="#e3f5f0" stroke="#008e89" stroke-width="1.6"/><text x="474" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#008e89">DRU</text><rect x="86" y="260" width="158" height="42" rx="10" fill="#fff6e8" stroke="#e4bd7d" stroke-width="1.6"/><text x="165" y="277" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#bb721c">Team reward</text><text x="165" y="291" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">TD update</text><path d="M126 260 Q77 240 77 192" fill="none" stroke="#bb721c" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="5 6"/><polyline points="71,187 77,194 83,187" stroke="#bb721c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="165" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526781">No cross-agent gradient</text><path d="M560 193 L560 222 L396 222 L396 193" fill="none" stroke="#ac4f91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="390,187 396,194 402,187" stroke="#ac4f91" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="478" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#ac4f91">∂L / ∂m</text><rect x="414" y="262" width="146" height="40" rx="10" fill="#fbeef7" stroke="#d8a8ca" stroke-width="1.6"/><text x="487" y="279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#ac4f91">Receiver loss</text><text x="487" y="293" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">backpropagation</text><path d="M557 262 L557 226" stroke="#ac4f91" stroke-width="2.4" stroke-dasharray="4 5" stroke-linecap="round" fill="none"/><polyline points="551,221 557,228 563,221" stroke="#ac4f91" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="164" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">Message: RL action</text><text x="476" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#526781">Gradient crosses channel</text><circle r="5.5" fill="#2776b7" stroke="#fff" stroke-width="1.3"><animateMotion path="M121 151 L208 151" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="0s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#2776b7" stroke="#fff" stroke-width="1.3"><animateMotion path="M430 151 L517 151" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="0s" repeatCount="indefinite"/></circle><circle r="5.5" fill="#ac4f91" stroke="#fff" stroke-width="1.3"><animateMotion path="M560 194 L560 222 L396 222 L396 194" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="8s" begin="2s" repeatCount="indefinite"/></circle><rect x="442" y="155" width="64" height="42" rx="9" fill="none" stroke="#008e89" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/></rect></svg>