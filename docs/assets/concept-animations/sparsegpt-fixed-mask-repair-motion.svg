<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif"><title id="title">SparseGPT fixed-mask reconstruction</title><desc id="desc">A fixed two-weight mask removes the second weight. Calibration outputs compare dense, removal alone and compensation; squared error falls from two to one.</desc><style>.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:inline}}</style><rect width="640" height="360" rx="14" fill="#f2f7fa"/><g class="moving"><text x="24" y="30" font-size="21" fill="#18364b" text-anchor="start" font-weight="700">SparseGPT · fixed-mask repair</text><text x="24" y="55" font-size="15" fill="#496477" text-anchor="start" font-weight="500">Calibration outputs</text><text x="370" y="55" font-size="15" fill="#496477" text-anchor="start" font-weight="500">Weight vector</text><rect x="24" y="76" width="592" height="70" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="36" y="99" font-size="17" fill="#18364b" text-anchor="start" font-weight="700">Dense target</text><text x="40" y="117" font-size="13" fill="#496477" text-anchor="start" font-weight="500">y1</text><rect x="78" y="105" width="210" height="12" rx="5" fill="#f2f7fa" /><rect x="78" y="105" width="210" height="12" rx="5" fill="#35678f" /><text x="300" y="117" font-size="14" fill="#18364b" text-anchor="middle" font-weight="700">3</text><rect x="370" y="98" width="57" height="34" rx="5" fill="#35678f" /><text x="398.5" y="120" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="40" y="134" font-size="13" fill="#496477" text-anchor="start" font-weight="500">y2</text><rect x="78" y="122" width="210" height="12" rx="5" fill="#f2f7fa" /><rect x="78" y="122" width="70" height="12" rx="5" fill="#35678f" /><text x="300" y="134" font-size="14" fill="#18364b" text-anchor="middle" font-weight="700">1</text><rect x="437" y="98" width="57" height="34" rx="5" fill="#35678f" /><text x="465.5" y="120" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="598" y="120" font-size="16" fill="#35678f" text-anchor="end" font-weight="700">SSE 0</text><rect x="24" y="156" width="592" height="70" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="36" y="179" font-size="17" fill="#18364b" text-anchor="start" font-weight="700">Prune only</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.2;.98;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><text x="40" y="197" font-size="13" fill="#496477" text-anchor="start" font-weight="500">y1</text><rect x="78" y="185" width="210" height="12" rx="5" fill="#f2f7fa" /><rect x="78" y="185" width="140" height="12" rx="5" fill="#a26420" /><text x="300" y="197" font-size="14" fill="#18364b" text-anchor="middle" font-weight="700">2</text><rect x="370" y="178" width="57" height="34" rx="5" fill="#a26420" /><text x="398.5" y="200" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="40" y="214" font-size="13" fill="#496477" text-anchor="start" font-weight="500">y2</text><rect x="78" y="202" width="210" height="12" rx="5" fill="#f2f7fa" /><rect x="78" y="202" width="0" height="12" rx="5" fill="#a26420" /><text x="300" y="214" font-size="14" fill="#18364b" text-anchor="middle" font-weight="700">0</text><rect x="437" y="178" width="57" height="34" rx="5" fill="#f2f7fa" /><text x="465.5" y="200" font-size="18" fill="#496477" text-anchor="middle" font-weight="700">0</text><text x="598" y="200" font-size="16" fill="#a26420" text-anchor="end" font-weight="700">SSE 2</text></g><rect x="24" y="236" width="592" height="70" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="36" y="259" font-size="17" fill="#18364b" text-anchor="start" font-weight="700">Repair</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.55;.98;1" calcMode="linear" dur="12s" repeat