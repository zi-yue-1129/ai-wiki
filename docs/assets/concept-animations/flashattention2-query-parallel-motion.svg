<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">FlashAttention-2 · Query-block parallelism</title><desc id="svg-desc">Three independent query-row blocks each iterate over four key/value tiles. Every query block owns a separate softmax state and output. Orange, blue and violet outlines visit their K/V tiles in a synchronized schematic wavefront; actual GPU scheduling can differ.</desc><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fafc" stroke="none" /><rect x="12" y="12" width="616" height="336" rx="13" fill="#ffffff" stroke="#e2e8f0" /><text x="27" y="43" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">FlashAttention-2 · Query-block parallelism</text><text x="27" y="64" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">3 Q blocks × 4 K/V tiles · independent output rows</text><rect x="25" y="82" width="435" height="245" rx="12" fill="#f8fafc" stroke="#e2e8f0" /><rect x="472" y="82" width="144" height="245" rx="12" fill="#f8fafc" stroke="#e2e8f0" /><text x="479" y="101" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="start">Independent O</text><text x="121" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">K0</text><text x="195" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">K1</text><text x="269" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">K2</text><text x="343" y="111" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">K3</text><text x="37" y="150" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0d9488" text-anchor="start">Q0</text><rect x="92" y="127" width="57" height="36" rx="6" fill="#f0fdfa" stroke="#cbd5e1" /><rect x="166" y="127" width="57" height="36" rx="6" fill="#f0fdfa" stroke="#cbd5e1" /><rect x="240" y="127" width="57" height="36" rx="6" fill="#f0fdfa" stroke="#cbd5e1" /><rect x="314" y="127" width="57" height="36" rx="6" fill="#f0fdfa" stroke="#cbd5e1" /><path d="M 381 145 H 482" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 478 141 L 484 145 L 478 149" stroke="#0d9488" fill="none" stroke-width="2"/><rect x="487" y="128" width="112" height="34" rx="8" fill="#ffffff" stroke="#0d9488" /><text x="543" y="150" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">O0</text><rect x="383" y="167" width="24" height="4" rx="2" fill="#0d9488" opacity="0.8"><animate attributeName="width" values="24;24;48;48;72;72;96;96;24" keyTimes="0;0.249;0.25;0.499;0.5;0.749;0.75;0.999;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></rect><rect x="91" y="125" width="60" height="40" rx="7" fill="none" stroke="#0d9488" stroke-width="3"><animate attributeName="x" values="91;91;165;165;239;239;313;313;91" keyTimes="0;0.249;0.25;0.499;0.5;0.749;0.75;0.999;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></rect><text x="37" y="214" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start">Q1</text><rect x="92" y="191" width="57" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" /><rect x="166" y="191" width="57" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" /><rect x="240" y="191" width="57" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" /><rect x="314" y="191" width="57" height="36" rx="6" fill="#eff6ff" stroke="#cbd5e1" /><path d="M 381 209 H 482" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 478 205 L 484 20