<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Projection shortcut for shape alignment</title><desc id="desc">A four by four one-channel input branches through a stride-two spatial convolution and a learnable stride-two pointwise projection. Each yields a two by two two-channel tensor, allowing elementwise addition.</desc><rect width="800" height="420" fill="#f7f9fc"/><defs><marker id="at" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#078e85"/></marker><marker id="ap" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#6d62b6"/></marker><marker id="ao" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#d38b29"/></marker><marker id="ab" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#3b80b5"/></marker></defs><text x="25" y="34" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1d3149" font-weight="700" text-anchor="start">Projection shortcut · shape alignment</text><text x="775" y="33" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#687c93" font-weight="500" text-anchor="end">Toy shapes · stride 2</text><rect x="20" y="55" width="760" height="341" rx="10" fill="#fff" stroke="#dae5ef" stroke-width="1.5"/><text x="41" y="84" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#687c93" font-weight="700" text-anchor="start">Spatial resolution ↓    channels ↑</text><text x="109" y="114" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1d3149" font-weight="700" text-anchor="middle">Input</text><rect x="61" y="139" width="20" height="20" rx="3" fill="#bee9dd" stroke="#078e85" stroke-width="1.5"/><rect x="84" y="139" width="20" height="20" rx="3" fill="#eaf0f