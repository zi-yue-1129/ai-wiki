<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Cross terms in joint pruning error</title><desc id="desc">Original CC BY-SA 4.0. Two removed coefficients, 2 and 1, act on inputs with fixed unit second moments and changing cross moment. The same-sign input yields squared error 9 and the opposite-sign input yields 1. As the mixture changes, the expected error moves above and below the fixed diagonal-only estimate of 5.</desc>
<rect width="640" height="360" rx="12" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172b40" font-size="16">
<text x="22" y="29" font-size="20" font-weight="bold">Joint pruning error</text>
<rect x="20" y="45" width="288" height="293" rx="9" fill="#fff" stroke="#d4dee8"/>
<rect x="320" y="45" width="300" height="293" rx="9" fill="#fff" stroke="#d4dee8"/>
<text x="36" y="73" font-weight="bold">Removed weights: (2, 1)</text>
<text x="36" y="102" font-size="14">Input</text><text x="153" y="102" font-size="14">Residual</text><text x="247" y="102" font-size="14">Error²</text>
<g text-anchor="middle"><rect x="36" y="113" width="46" height="38" rx="5" fill="#315c85"/><rect x="88" y="113" width="46" height="38" rx="5" fill="#315c85"/><text x="59" y="137" fill="white">+1</text><text x="111" y="137" fill="white">+1</text><text x="180" y="137">2+1</text><text x="269" y="137" font-weight="bold">9</text>
<rect x="36" y="161" width="46" height="38" rx="5" fill="#315c85"/><rect x="88" y="161" width="46" height="38" rx="5" fill="#a05c20"/><text x="59" y="185" fill="white">+1</text><text x="111" y="185" fill="white">−1</text><text x="180" y="185">2−1</text><text x="269" y="185" font-weight="bold">1</text></g>
<text x="36" y="224" font-size="14">Mixture</text>
<rect x="36" y="235" width="250" height="18" rx="3" fill="#a05c20"/>
<rect id="mixture" x="36" y="235" width="250" height="18" rx="3" fill="#315c85"></rect>
<text x="36" y="274" font-size="14" fill="#315c85">Same sign</text><text x="286" y="274" text-anchor="end" font-size="14" fill="#a05c20">Opposite sign</text>
<text x="36" y="311" font-size="15">Diagonal-only estimate = 5</text>
<text x="336" y="73" font-weight="bold">Expected squared error</text>
<g stroke="#d4dee8" stroke-width="1"><path d="M369 96V256H599" fill="none"/><path d="M369 96H599M369 176H599" stroke-dasharray="3 4"/></g>
<g font-size="13" text-anchor="end"><text x="360" y="101">10</text><text x="360" y="181">5</text><text x="360" y="261">0</text></g>
<path d="M369 176H599" stroke="#315c85" stroke-width="2" stroke-dasharray="6 4"/><path d="M369 240L599 112" stroke="#08766f" stroke-width="3" fill="none"/>
<line id="cursor" x1="599" x2="599" y1="96" y2="256" stroke="#8799aa" stroke-dasharray="3 3"></line>
<line id="cross" x1="599" x2="599" y1="176" y2="112" stroke="#a05c20" stroke-width="5"></line>
<circle id="total" cx="599" cy="112" r="6" fill="#08766f" stroke="#fff" stroke-width="2"></circle>
<g text-anchor="middle" font-size="13"><text x="369" y="275">0</text><text x="484" y="275">0.5</text><text x="599" y="275">1</text><text x="484" y="293">P(same sign)</text></g>
<path d="M337 315H355" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><text x="360" y="320" font-size="13">Diagonal</text><path d="M435 315H453" stroke="#a05c20" stroke-width="4"/><text x="458" y="320" font-size="13">Cross</text><path d="M517 315H535" stroke="#08766f" stroke-width="3"/><text x="540" y="320" font-size="13">Total</text>
</g></svg>
