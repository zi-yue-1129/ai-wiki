<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" tabindex="0" aria-labelledby="title desc"><title id="title">Causal sliding-window attention: moving four-token context</title><desc id="desc">A causal local attention mask with twelve tokens and a four-token window. A highlighted query row moves from token 4 to token 12, while the visible window slides over the current token and three previous tokens. The mask is banded, not a dense all-to-all attention matrix.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf3f8"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;fill:#24465b} .top{font-weight:750;font-size:18px;letter-spacing:.3px}.small{font-size:12px;fill:#647f92}.tag{font-size:13px;font-weight:750}.value{font-size:21px;font-weight:760}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace} .dim{fill:#6d8495} @media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}.travel{display:none!important}}svg:hover animate,svg:focus animate{animation-play-state:paused}</style><rect width="800" height="432" rx="20" fill="url(#paper)"/><text x="28" y="38" class="top">CAUSAL SLIDING WINDOW</text><text x="769" y="37" class="small" text-anchor="end">12 TOKENS · w = 4</text><rect x="21" y="63" width="330" height="340" rx="14" fill="white" stroke="#d5e3ee"/><rect x="368" y="63" width="411" height="340" rx="14" fill="white" stroke="#d5e3ee"/><text x="42" y="92" class="tag">ATTENTION MASK</text><text x="388" y="92" class="tag">LOCAL KEY RANGE</text><text x="67.5" y="112" class="small" text-anchor="middle">1</text><text x="88.5" y="112" class="small" text-anchor="middle">2</text><text x="109.5" y="112" class="small" text-anchor="middle">3</text><text x="130.5" y="112" class="small" tex