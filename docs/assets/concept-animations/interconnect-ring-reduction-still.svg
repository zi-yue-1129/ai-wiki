<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img"><title>Ring all-reduce</title><desc>Three ranks reduce three chunks, then gather complete chunks. The ring sends clockwise in each round.</desc><rect x="0" y="0" width="360" height="300" rx="10" fill="#102138" stroke="none"/><g font-family="system-ui,sans-serif" font-weight="600"><text x="180" y="27" fill="#e9f1fb" font-size="18" text-anchor="middle">Ring all-reduce</text><text x="180" y="49" fill="#9fb5ca" font-size="13" text-anchor="middle">A · B · C</text><g id="round-2" opacity="1"><text x="180" y="73" fill="#4ddbc7" font-size="15" text-anchor="middle">All-gather 1/2</text><rect x="10" y="85" width="100" height="86" rx="5" fill="#192e49" stroke="none"/><text x="60" y="104" fill="#e9f1fb" font-size="14" text-anchor="middle">Rank 0</text><text x="29" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">A</text><rect x="15" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="29" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><text x="60" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">B</text><rect x="46" y="130" width="28" height="30" rx="5" fill="#18534e" stroke="#4ddbc7"/><text x="60" y="150" fill="#4ddbc7" font-size="15" text-anchor="middle">15</text><text x="91" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">C</text><rect x="77" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="91" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><rect x="130" y="85" width="100" height="86" rx="5" fill="#192e49" stroke="none"/><text x="180" y="104" fill="#e9f1fb" font-size="14" text-anchor="middle">Rank 1</text><text x="149" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">A</text><rect x="135" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="149" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><text x="180" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">B</text><rect x="166" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="180" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><text x="211" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">C</text><rect x="197" y="130" width="28" height="30" rx="5" fill="#18534e" stroke="#4ddbc7"/><text x="211" y="150" fill="#4ddbc7" font-size="15" text-anchor="middle">18</text><rect x="250" y="85" width="100" height="86" rx="5" fill="#192e49" stroke="none"/><text x="300" y="104" fill="#e9f1fb" font-size="14" text-anchor="middle">Rank 2</text><text x="269" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">A</text><rect x="255" y="130" width="28" height="30" rx="5" fill="#18534e" stroke="#4ddbc7"/><text x="269" y="150" fill="#4ddbc7" font-size="15" text-anchor="middle">12</text><text x="300" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">B</text><rect x="286" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="300" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><text x="331" y="123" fill="#9fb5ca" font-size="11" text-anchor="middle">C</text><rect x="317" y="130" width="28" height="30" rx="5" fill="#102138" stroke="none"/><text x="331" y="150" fill="#9fb5ca" font-size="15" text-anchor="middle">–</text><text x="180" y="191" fill="#9fb5ca" font-size="13" text-anchor="middle">Send completed shard</text><text x="60" y="214" fill="#e9f1fb" font-size="14" text-anchor="middle">0 → 1</text><path d="M22 252L98 252" stroke="#4ddbc7" stroke-width="2" fill="none"/><path d="M92 247l6 5-6 5" stroke="#4ddbc7" fill="none" stroke-width="2"/><text x="60" y="235" fill="#4ddbc7" font-size="15" text-anchor="middle">B: 15</text><circle cx="22" cy="252" r="6" fill="#4ddbc7"></circle><text x="180" y="214" fill="#e9f1fb" font-size="14" text-anchor="middle">1 → 2</text><path d="M142 252L218 252" stroke="#4ddbc7" stroke-width="2" fill="none"/><path d="M212 2