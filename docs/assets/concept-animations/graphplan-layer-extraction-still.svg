<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Graphplan fact/action layers and backward extraction</title><desc id="desc">The graph grows from F0 and A0 to F1 and A1 to F2. Mutex is marked between At(A) and At(B) at F1. An orange trace extracts Move(A,B), then Move(B,C); implicit persistence/no-op arcs are simplified.</desc><style>@media(prefers-reduced-motion:reduce){.animated{display:none!important}.still-only{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfe" stroke="#dce5ed" stroke-width="1" /><text x="24" y="33" text-anchor="start" fill="#20314a" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">GRAPHPLAN</text><text x="24" y="52" text-anchor="start" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500">Layer expansion  →  backward extraction</text><rect x="22" y="70" width="104" height="260" rx="12" fill="#fff" stroke="#dce5ed" stroke-width="1.5" /><text x="74.0" y="90" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">F₀</text><rect x="154" y="70" width="88" height="260" rx="12" fill="#f0f5fa" stroke="#dce5ed" stroke-width="1.5" /><text x="198.0" y="90" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">A₀</text><rect x="270" y="70" width="104" height="260" rx="12" fill="#fff" stroke="#dce5ed" stroke-width="1.5" /><text x="322.0" y="90" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">F₁</text><rect x="398" y="70" width="88" height="260" rx="12" fill="#f0f5fa" stroke="#dce5ed" stroke-width="1.5" /><text x="442.0" y="90" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">A₁</text><rect x="512" y="70" width="106" height="260" rx="12" fill="#fff" stroke="#dce5ed" stroke-width="1.5" /><text x="565.0" y="90" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">F₂</text><path d="M565 280 L448 260 L322 232 L197 181 L74 149" stroke="#e07742" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5" fill="none" opacity=".8"/><g><rect x="35" y="132" width="78" height="34" rx="8" fill="#ebf3f9" stroke="#4b74b9" stroke-width="1.5" /><text x="74.0" y="154" text-anchor="middle" fill="#4b74b9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(A)</text></g><g opacity="1"><rect x="282" y="118" width="80" height="34" rx="8" fill="#ebf3f9" stroke="#4b74b9" stroke-width="1.5" /><text x="322.0" y="140" text-anchor="middle" fill="#4b74b9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(A)</text></g><g opacity="1"><rect x="282" y="216" width="80" height="34" rx="8" fill="#ebf3f9" stroke="#0b827e" stroke-width="1.5" /><text x="322.0" y="238" text-anchor="middle" fill="#0b827e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(B)</text></g><g opacity="1"><rect x="525" y="110" width="80" height="34" rx="8" fill="#ebf3f9" stroke="#4b74b9" stroke-width="1.5" /><text x="565.0" y="132" text-anchor="middle" fill="#4b74b9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(A)</text></g><g opacity="1"><rect x="525" y="185" width="80" height="34" rx="8" fill="#ebf3f9" stroke="#0b827e" stroke-width="1.5" /><text x="565.0" y="207" text-anchor="middle" fill="#0b827e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(B)</text></g><g opacity="1"><rect x="525" y="263" width="80" height="34" rx="8" fill="#ebf3f9" stroke="#0b827e" stroke-width="1.5" /><text x="565.0" y="285" text-anchor="middle" fill="#0b827e" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">At(C)</text></g><rect x="163" y="163" width="69" height="46" rx="10" fill="#f1f5fb" stroke="#aec6df" stroke-width="1.5" /><text x="197.5" y="181" text-anchor="middle" fill="#4b74b9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Move</text><text x="197.5" y="198" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500">A→B</text><rect x="407" y="242" width="69" height="46" rx="10" fill="#f1f5fb" stroke="#aec6df" stroke-width="1.5" /><text x="441.5" y="260" text-anchor="middle" fill="#4b74b9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700">Move</text><text x="441.5" y="277" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500">B→C</text><path d="M113 149 L163 181" fill="none" stroke="#4b74b9" opacity=".68" stroke-width="2.5" stroke-linecap="round"/><path d="M232 181 L282 232" fill="none" stroke="#0b827e" opacity=".68" stroke-width="2.5" stroke-linecap="round"/><path d="M362 232 L407 259" fill="none" stroke="#0b827e" opacity=".68" stroke-width="2.5" stroke-linecap="round"/><path d="M476 259 L525 280" fill="none" stroke="#0b827e" opacity=".68" stroke-width="2.5" stroke-linecap="round"/><path d="M112 160 Q205 98 282 135 M362 232 Q450 170 525 202" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="4 5" opacity=".65"/><path d="M365 151 L365 216" stroke="#e07742" stroke-width="2" stroke-dasharray="4 4"/><text x="346" y="187" text-anchor="middle" fill="#e07742" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">×</text><text x="320" y="347" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500">Mutex excludes At(A) + At(B) at F₁</text></svg>