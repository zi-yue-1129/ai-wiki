<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">NoisyNet: two parameter-noise samples change greedy action</title><desc id="desc">The same fixed input x equals one and base action values A 0.70, B 0.60. Noise draw one adds 0.20 to A and minus 0.20 to B, selecting A at values 0.90 and 0.40. A new noise draw adds minus 0.25 to A and plus 0.20 to B, selecting B at values 0.45 and 0.80. Illustrative samples, not measured weights; not epsilon greedy.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduce-only{display:inline!important}}</style><rect x="0" y="0" width="440" height="548" rx="18" fill="#f7fafc" stroke="none" stroke-width="0"/><rect x="1" y="1" width="438" height="546" rx="17" fill="none" stroke="#dbe5ee" stroke-width="1"/><text x="220" y="43" fill="#24364c" font-size="22" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">NoisyNet · Weight samples</text><path d="M25 61H415" fill="none" stroke="#dbe5ee" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="90" fill="#61758c" font-size="14" font-weight="600" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Shared input</text><rect x="164" y="70" width="112" height="40" rx="10" fill="#e8effa" stroke="#dbe5ee" stroke-width="1.5"/><text x="220" y="96" fill="#3568b7" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">x = 1</text><text x="34" y="136" fill="#61758c" font-size="14" font-weight="600" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Base Q</text><rect x="126" y="117" width="130" height="40" rx="9" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="191" y="142" fill="#24364c" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A  0.70</text><rect x="271" y="117" width="140" height="40" rx="9" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="342" y="142" fill="#24364c" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">B  0.60</text><path d="M220 110V116" fill="none" stroke="#61758c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="21" y="176" width="398" height="150" rx="13" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="37" y="201" fill="#24364c" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Noise draw 1</text><text x="405" y="201" fill="#c56d31" font-size="14" font-weight="600" text-anchor="end" font-family="Arial,Helvetica,sans-serif">ΔA +0.20   ΔB −0.20</text><text x="50" y="234" fill="#24364c" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><text x="50" y="276" fill="#24364c" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">B</text><rect x="72" y="220" width="255" height="21" rx="6" fill="#e8effa" stroke="none" stroke-width="0"/><rect x="72" y="262" width="255" height="21" rx="6" fill="#e8effa" stroke="none" stroke-width="0"/><rect x="72" y="220" width="230" height="21" rx="6" fill="#3568b7" stroke="none" stroke-width="0"/><rect x="72" y="262" width="102" height="21" rx="6" fill="#7dbbac" stroke="none" stroke-width="0"/><text x="343" y="237" fill="#24364c" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0.90</text><text x="343" y="279" fill="#24364c" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0.40</text><text x="36" y="310" fill="#3568b7" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">argmax Q = A</text><rect x="21" y="344" width="398" height="150" rx="13" fill="#fff" stroke="#dbe5ee" stroke-width="1.5"/><text x="37" y="369" fill="#24364c" font-size="16" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Noise draw 2</text><text x="405" y="369" fill="#c56d31" font-size="14" font-weight="600" text-anchor="end" font-family="Arial,Helvetica,sans-serif">ΔA −0.25   ΔB +0.20</text><text x="50" y="402" fill="#24364c" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><text x="50" y="444" fill="#24364c" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">B</text><rect x="72" y="388" width="255" height="21" rx="6" fill="#e8effa" stroke="none" stroke-width="0"/><rect x="72" y="430" width="255" height="21" rx="6" fill="#e8effa" stroke="none" stroke-width="0"/><rect x="72" y="388" width="115" height="21" rx="6" fill="#7ba5dd" stroke="none" stroke-width="0"/><rect x="72" y="430" width="204" height="21" rx="6" fill="#117d67" stroke="none" stroke-width="0"/><text x="343" y="405" fill="#24364c" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0.45</text><text x="343" y="447" fill="#24364c" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0.80</text><text x="36" y="478" fill="#117d67" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">argmax Q = B</text><text x="220" y="529" fill="#61758c" font-size="13" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Sample noise → perturb weights → act</text></svg>