<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Selective feedback correction</title><desc id="d">A task-relevant y perturbation is corrected back toward the target line while an x-only perturbation is left unchanged because it does not affect the goal.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><rect x="16" y="16" width="608" height="328" rx="14" fill="#ffffff" stroke="#e2e8f0"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="34" y="48" fill="#0f172a" font-size="21" text-anchor="start">Optimal feedback  /  selective correction</text><text x="34" y="68" fill="#64748b" font-size="12" text-anchor="start">Same goal manifold, different perturbation directions</text>
<rect x="30" y="86" width="280" height="239" rx="13" fill="#f8fafc" stroke="#e2e8f0"/><rect x="330" y="86" width="280" height="239" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="49" y="113" fill="#334155" font-size="14" text-anchor="start">Task-relevant</text><text x="349" y="113" fill="#334155" font-size="14" text-anchor="start">Task-irrelevant</text>
<text x="48" y="134" fill="#64748b" font-size="11" text-anchor="start">Error changes y</text><text x="349" y="134" fill="#64748b" font-size="11" text-anchor="start">Deviation only in x</text>
<path d="M56 240 H283 M356 240 H583" stroke="#0d9488" stroke-width="3" stroke-dasharray="8 6"/>
<text x="65" y="261" fill="#0d9488" font-size="11" text-anchor="start">Goal: y = 0</text><text x="365" y="261" fill="#0d9488" font-size="11" text-anchor="start">Goal: y = 0</text>
<path d="M190 240 V146" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="3 5"/><path d="M469 240 H391" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="3 5"/>
<circle cx="190" cy="240" r="8" fill="white" stroke="#0d9488" stroke-width="2"/><circle cx="469" cy="240" r="8" fill="white" stroke="#0d9488" stroke-width="2"/>
<circle id="relevant" cx="190" cy="240" r="12" fill="#f97316" stroke="white" stroke-width="3"></circle>
<circle id="irrelevant" cx="469" cy="240" r="12" fill="#3b82f6" stroke="white" stroke-width="3"></circle>
<g opacity="1"><path d="M212 157 V226" stroke="#0d9488" stroke-width="3" marker-end="url(#arr)"/><text x="227" y="184" fill="#0d9488" font-size="12" text-anchor="start">Correct</text></g>
<g opacity="1"><text x="360" y="184" fill="#2563eb" font-size="12" text-anchor="start">No x correction</text></g>
<text x="46" y="301" fill="#334155" font-size="12" text-anchor="start">y error → feedback</text><text x="346" y="301" fill="#334155" font-size="12" text-anchor="start">x shift → permitted</text></g></svg>