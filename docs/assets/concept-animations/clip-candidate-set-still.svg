<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CLIP candidate-set normalisation</title><desc id="desc">A third candidate with the same logit as A enters the softmax denominator. A and B keep their logits, but their probabilities change. The three-candidate result is shown in the fallback.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="8" fill="#f1f6fa"/><text x="24" y="30" font-size="19" fill="#233b52" text-anchor="start">CLIP candidate-set normalisation</text><rect x="18" y="48" width="604" height="294" rx="5" fill="white" stroke="#d6e1e8" /><text x="62" y="78" font-size="15" fill="#233b52" text-anchor="middle">Class</text><text x="158" y="78" font-size="15" fill="#233b52" text-anchor="middle">Logit</text><text x="388" y="78" font-size="17" fill="#233b52" text-anchor="middle">Softmax probability</text><rect x="30" y="97" width="64" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="116" y="97" width="84" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="226" y="105" width="350" height="26" rx="5" fill="#e4edf2" stroke="none" /><text x="62" y="124" font-size="19" fill="#233b52" text-anchor="middle">A</text><text x="158" y="124" font-size="19" fill="#233b52" text-anchor="middle">2</text><rect x="30" y="169" width="64" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="116" y="169" width="84" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="226" y="177" width="350" height="26" rx="5" fill="#e4edf2" stroke="none" /><text x="62" y="196" font-size="19" fill="#233b52" text-anchor="middle">B</text><text x="158" y="196" font-size="19" fill="#233b52" text-anchor="middle">0</text><rect x="30" y="241" width="64" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="116" y="241" width="84" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="226" y="249" width="350" height="26" rx="5" fill="#e4edf2" stroke="none" /><text x="226" y="316" font-size="13" fill="#233b52" text-anchor="start">0</text><text x="576" y="316" font-size="13" fill="#233b52" text-anchor="middle">1</text><text x="401" y="337" font-size="14" fill="#233b52" text-anchor="middle">Dashed marker = before</text><text x="62" y="268" font-size="19" fill="#233b52" text-anchor="middle">C</text><text x="158" y="268" font-size="19" fill="#233b52" text-anchor="middle">2</text><rect x="226" y="105" width="163.909" height="26" rx="5" fill="#21678d" stroke="none" /><text x="598" y="124" font-size="14" fill="#233b52" text-anchor="middle">0.468</text><line x1="534.279" x2="534.279" y1="101" y2="135" stroke="#233b52" stroke-width="2" stroke-dasharray="3 2"/><rect x="226" y="177" width="22.183" height="26" rx="5" fill="#a95516" stroke="none" /><text x="598" y="196" font-size="14" fill="#233b52" text-anchor="middle">0.063</text><line x1="267.721" x2="267.721" y1="173" y2="207" stroke="#233b52" stroke-width="2" stroke-dasharray="3 2"/><rect x="226" y="249" width="163.909" height="26" rx="5" fill="#087d70" stroke="none" /><text x="598" y="268" font-size="14" fill="#233b52" text-anchor="middle">0.468</text></svg>
