<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Adam momentum lags a gradient sign reversal</title><desc id="desc">Discrete toy gradient is positive for four steps, then negative from step five. Bias-corrected momentum stays positive at steps five and six, before turning negative at step seven. The animation cursor sweeps computed discrete states with interpolated movement.</desc><style>text{font-family:Inter,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.motion-highlight{opacity:.2}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f4f9fc" stroke="none"/><text x="34" y="38" font-size="17" fill="#17364c" font-weight="750" text-anchor="start">ADAM  /  SIGN REVERSAL MEMORY</text><text x="34" y="61" font-size="12" fill="#678397" font-weight="600" text-anchor="start">β₁ = 0.8     β₂ = 0.5     ε = 0     |g| = 1</text><rect x="26" y="79" width="748" height="119" rx="14" fill="white" stroke="#d6e5ee"/><rect x="26" y="212" width="748" height="160" rx="14" fill="white" stroke="#d6e5ee"/><text x="45" y="102" font-size="14" fill="#24485d" font-weight="700" text-anchor="start">Current gradient  g</text><text x="45" y="235" font-size="14" fill="#24485d" font-weight="700" text-anchor="start">Corrected momentum  m-hat  =  normalized update</text><path d="M62 145H742" fill="none" stroke="#678397" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 297H742" fill="none" stroke="#678397" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="122" font-size="11" fill="#678397" font-weight="550" text-anchor="end">+1</text><text x="58" y="192" font-size="11" fill="#678397" font-weight="550" text-anchor="end">-1</text><text x="58" y="252" font-size="11" fill="#678397" font-weight="550" text-anchor="end">+1</text><text x="58" y="347" font-size="11" fill="#678397" font-weight="550" text-anchor="end">-1</text><rect x="68" y="108" width="30" height="37" rx="5" fill="#2379bd" stroke="none"/><text x="83" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">1</text><rect x="135" y="108" width="30" height="37" rx="5" fill="#2379bd" stroke="none"/><text x="150" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">2</text><rect x="202" y="108" width="30" height="37" rx="5" fill="#2379bd" stroke="none"/><text x="217" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">3</text><rect x="269" y="108" width="30" height="37" rx="5" fill="#2379bd" stroke="none"/><text x="284" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">4</text><rect x="336" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="351" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">5</text><rect x="403" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="418" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">6</text><rect x="470" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="485" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">7</text><rect x="537" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="552" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">8</text><rect x="604" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="619" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">9</text><rect x="671" y="145" width="30" height="37" rx="5" fill="#df8650" stroke="none"/><text x="686" y="365" font-size="12" fill="#678397" font-weight="600" text-anchor="middle">10</text><path d="M318 110V355" fill="none" stroke="#df8650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="325" y="119" font-size="12" fill="#df8650" font-weight="650" text-anchor="start">flip</text><path d="M83.00 246.00 L150.00 246.00 L217.00 246.00 L284.00 246.00 L351.00 276.34 L418.00 295.77 L485.00 308.98 L552.00 318.36 L619.00 325.21 L686.00 330.31" fill="none" stroke="#078f84" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="83" cy="246.00" r="3.8" fill="#078f84"/><circle cx="150" cy="246.00" r="3.8" fill="#078f84"/><circle cx="217" cy="246.00" r="3.8" fill="#078f84"/><circle cx="284" cy="246.00" r="3.8" fill="#078f84"/><circle cx="351" cy="276.34" r="3.8" fill="#078f84"/><circle cx="418" cy="295.77" r="3.8" fill="#078f84"/><circle cx="485" cy="308.98" r="3.8" fill="#078f84"/><circle cx="552" cy="318.36" r="3.8" fill="#078f84"/><circle cx="619" cy="325.21" r="3.8" fill="#078f84"/><circle cx="686" cy="330.31" r="3.8" fill="#078f84"/><text x="720" y="354" font-size="12" fill="#678397" font-weight="600" text-anchor="end">step t</text><line class="motion-highlight" x1="418" x2="418" y1="110" y2="355" stroke="#17364c" stroke-width="1.5" stroke-dasharray="3 5" opacity=".65"></line><circle cx="418" cy="295.77" r="8.5" stroke="white" stroke-width="2.5" fill="#078f84"></circle><text x="400" y="405" font-size="12" fill="#678397" font-weight="500" text-anchor="middle">After the sign flip, momentum can still point in the previous direction.</text></svg>