<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">Adaptive prediction sets from cumulative class probabilities</ns0:title><ns0:desc id="desc">Four ranked class probabilities are added in descending order. The first two cumulative APS scores are at or below an illustrative conformal cutoff of 0.80. Adding class C crosses the cutoff; only A and B qualify under the inclusive score rule. This is not a calibrated model measurement.</ns0:desc><ns0:style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.head{font-size:15px;font-weight:750;letter-spacing:.8px}.muted{font-size:11px;fill:#61788d}.label{font-size:14px;font-weight:700}.value{font-size:13px;font-weight:650}.tick{font-size:11px;fill:#61788d}</ns0:style><ns0:rect width="640" height="360" rx="17" fill="#f2f7fb" /><ns0:text x="26" y="33" class="head">ADAPTIVE PREDICTION SETS · TOY CLASSIFIER</ns0:text><ns0:rect x="26" y="62" width="588" height="276" rx="14" fill="#fff" stroke="#d7e4ed" /><ns0:text x="48" y="87" class="muted">LABEL</ns0:text><ns0:text x="128" y="87" class="muted">CLASS PROB.</ns0:text><ns0:text x="408" y="87" class="muted">CUM. SCORE</ns0:text><ns0:text x="555" y="87" class="muted">IN SET</ns0:text><ns0:text x="50" y="125" class="label">A</ns0:text><ns0:rect x="126" y="108" width="204" height="22" rx="6" fill="#ecf2f8" /><ns0:rect x="126" y="108" width="200.0" height="22" rx="6" fill="#168d82" opacity=".84" /><ns0:text x="365" y="125" text-anchor="end" class="value">0.45</ns0:text><ns0:text x="444" y="125" class="value">0.45</ns0:text><ns0:g opacity="1"><ns0:circle cx="566" cy="120" r="11" fill="#168d82" /><ns0:text x="566" y="124" text-anchor="middle" style="font:700 14px Inter,system-ui,Arial,sans-serif;fill:#fff">✓</ns0:text></ns0:g><ns0:text x="50" y="167" class="label">B</ns0:text><ns0:rect x="126" y="150" width="204" height="22" rx="6" fill="#ecf2f8" /><ns0:rect x="126" y="150" width="133.3" height="22" rx="6" fill="#168d82" opacity=".84" /><ns0:text x="365" y="167" text-anchor="end" class="value">0.30</ns0:text><ns0:text x="444" y="167" class="value">0.75</ns0:text><ns0:g opacity="1"><ns0:circle cx="566" cy="162" r="11" fill="#168d82" /><ns0:text x="566" y="166" text-anchor="middle" style="font:700 14px Inter,system-ui,Arial,sans-serif;fill:#fff">✓</ns0:text></ns0:g><ns0:text x="50" y="209" class="label">C</ns0:text><ns0:rect x="126" y="192" width="204" height="22" rx="6" fill="#ecf2f8" /><ns0:rect x="126" y="192" width="66.7" height="22" rx="6" fill="#e8a15f" opacity=".84" /><ns0:text x="365" y="209" text-anchor="end" class="value">0.15</ns0:text><ns0:text x="444" y="209" class="value">0.90</ns0:text><ns0:g opacity="1"><ns0:circle cx="566" cy="204" r="11" fill="#bb6d31" /><ns0:text x="566" y="208" text-anchor="middle" style="font:700 14px Inter,system-ui,Arial,sans-serif;fill:#fff">×</ns0:text></ns0:g><ns0:text x="50" y="251" class="label">D</ns0:text><ns0:rect x="126" y="234" width="204" height="22" rx="6" fill="#ecf2f8" /><ns0:rect x="126" y="234" width="44.4" height="22" rx="6" fill="#e8a15f" opacity=".84" /><ns0:text x="365" y="251" text-anchor="end" class="value">0.10</ns0:text><ns0:text x="444" y="251" class="value">1.00</ns0:text><ns0:g opacity="1"><ns0:circle cx="566" cy="246" r="11" fill="#bb6d31" /><ns0:text x="566" y="250" text-anchor="middle" style="font:700 14px Inter,system-ui,Arial,sans-serif;fill:#fff">×</ns0:text></ns0:g><ns0:text x="48" y="293" class="muted">CUMULATIVE MASS</ns0:text><ns0:text x="558" y="293" text-anchor="end" class="muted">q = 0.80</ns0:text><ns0:rect x="115" y="307" width="400" height="15" rx="7" fill="#e5eef5" /><ns0:defs><ns0:clipPath id="mclip"><ns0:rect x="115" y="307" width="400" height="15" rx="7" /></ns0:clipPath></ns0:defs><ns0:g clip-path="url(#mclip)"><ns0:rect x="115" y="307" width="180" height="15" fill="#138f83" /><ns0:rect x="295" y="307" width="120" height="15" fill="#3bb2a2" /><ns0: