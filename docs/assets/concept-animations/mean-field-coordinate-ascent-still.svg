<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Mean-field coordinate ascent: updating factorised distributions</title><desc id="desc">Four coordinate ascent updates of two independent Gaussian factors. A fixed tilted posterior contour contrasts with the axis-aligned variational approximation, which moves one mean at a time while keeping diagonal covariance.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#244259}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#607b8f}.small{font-size:12px;fill:#607b8f}.stage{font-size:21px;font-weight:750}.phase{opacity:0}@media(prefers-reduced-motion:reduce){.phase{display:none!important}.phase-final{display:inline!important;opacity:1!important}}</style><rect width="640" height="360" rx="18" fill="#f4f9fc"/><rect x="20" y="53" width="401" height="284" rx="15" fill="#fff" stroke="#d5e3eb"/><rect x="436" y="53" width="184" height="284" rx="15" fill="#fff" stroke="#d5e3eb"/><text x="28" y="33" class="eyebrow" >MEAN-FIELD VARIATIONAL INFERENCE</text><text x="592" y="33" class="small" text-anchor="end">8 s loop</text><line x1="61" y1="294" x2="391" y2="294" stroke="#d3e0e8" stroke-width="1.5"  stroke-linecap="round"/><line x1="61" y1="294" x2="61" y2="86" stroke="#d3e0e8" stroke-width="1.5"  stroke-linecap="round"/><text x="397" y="300" class="small" >z₁</text><text x="52" y="79" class="small" >z₂</text><text x="82" y="79" class="small" >Target p</text><ellipse cx="242" cy="195" rx="148" ry="42" transform="rotate(-55 242 195)" fill="none" stroke="#a9becd" stroke-width="2"/><ellipse cx="242" cy="195" rx="112" ry="31" transform="rotate(-55 242 195)" fill="none" stroke="#a9becd" stroke-width="1.5"/><ellipse cx="242" cy="195" rx="77" ry="21" transform="rotate(-55 242 195)" fill="none" stroke="#a9becd" stroke-width="1.5"/><ellipse cx="276.5" cy="137.5" rx="40" ry="57" fill="none" stroke="#d4a678" stroke-width="1.7" stroke-dasharray="5 5" opacity=".7"/><ellipse cx="276.5" cy="153.6" rx="40" ry="57" fill="#c4eee5" fill-opacity=".43" stroke="#0c9489" stroke-width="3"/><line x1="61" y1="153.6" x2="276.5" y2="153.6" stroke="#8fc9c3" stroke-width="1.4" stroke-dasharray="4 6" stroke-linecap="round"/><line x1="276.5" y1="153.6" x2="276.5" y2="294" stroke="#8fc9c3" stroke-width="1.4" stroke-dasharray="4 6" stroke-linecap="round"/><circle cx="276.5" cy="153.6" r="5" fill="#0c9489"/><text x="454" y="139" class="eyebrow" >COORDINATE ASCENT</text><text x="454" y="172" class="stage" >Update q₂</text><text x="454" y="206" class="" font-size="24" font-weight="750" fill="#0c9489" style="fill:#0c9489">q₁ · q₂</text><line x1="454" y1="231" x2="601" y2="231" stroke="#d5e3eb" stroke-width="1.3"  stroke-linecap="round"/><text x="454" y="254" class="small" >Hold q₁ fixed</text><text x="454" y="275" class="small" >Refit one factor</text><text x="454" y="316" class="" font-size="12" font-weight="700" fill="#0c9489" style="fill:#0c9489">ELBO nondecreasing</text><circle cx="462" cy="89" r="14" fill="#eaf2f6"/><text x="462" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">1</text><circle cx="505" cy="89" r="14" fill="#eaf2f6"/><text x="505" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">2</text><circle cx="548" cy="89" r="14" fill="#eaf2f6"/><text x="548" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">3</text><circle cx="591" cy="89" r="14" fill="#0c9489"/><text x="591" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="fill:#fff">4</text></svg>