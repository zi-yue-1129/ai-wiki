<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 431" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">ICM weighted auxiliary gradients</title><desc id="svg-desc">A two-dimensional schematic of the joint shared-encoder gradient: inverse-loss gradient weighted by one minus beta plus forward-loss gradient weighted by beta. Arrows illustrate vector addition at beta zero, one half and one. Not trained model measurements.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:19px;font-weight:700;fill:#29435d}.small{font-size:13px;fill:#526b84}.lbl{font-size:16px;font-weight:700;fill:#29435d}.line{stroke:#c3d2e0;stroke-width:2} .box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5} @media(prefers-reduced-motion:reduce){.motion-dot{display:none}}</style><rect width="380" height="431" rx="16" fill="#f7f9fd"/><text x="20" y="32" class="title">ICM · LOSS BALANCE</text><text x="20" y="54" class="small">Shared encoder · 2D gradient slice</text><rect class="box" x="19" y="72" width="342" height="248" rx="13"/><path d="M45 253H335M188 299V95" fill="none" stroke="#d6e1ed" stroke-width="2"/><circle cx="188" cy="253" r="4" fill="#344d68"/><text x="28" y="306" class="small">Combined gradient</text><defs><marker id="inv" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5 0 5Z" fill="#8564b4"/></marker><marker id="fwd" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5 0 5Z" fill="#d5893e"/></marker><marker id="mix" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3 0 6Z" fill="#168a7d"/></marker></defs><line x1="188" y1="253" x2="283" y2="223" stroke="#8564b4" stroke-width="2" opacity=".2" stroke-dasharray="6 4"/><line x1="188" y1="253" x2="128" y2="165" stroke="#d5893e" stroke-width="2" opacity=".2" stroke-dasharray="6 4"/><line x1="188" y1="253" x2="283" y2="223" stroke="#8564b4" stroke-width="5" marker-end="url(#inv)"><animate attributeName="x2" values="283;283;235.5;235.5;188;188;283" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y2" values="223;223;238;238;253;253;223" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;1;1;0;0;1" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></line><line x1="283" y1="223" x2="283" y2="223" stroke="#d5893e" stroke-width="5" marker-end="url(#fwd)"><animate attributeName="x1" values="283;283;235.5;235.5;188;188;283" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y1" values="223;223;238;238;253;253;223" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="x2" values="283;283;205.5;205.5;128;128;283" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y2" values="223;223;194;194;165;165;223" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;1;1;0" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></line><line x1="188" y1="253" x2="283" y2="223" stroke="#168a7d" stroke-width="4.2" marker-end="url(#mix)"><animate attributeName="x2" values="283;283;205.5;205.5;128;128;283" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="y2" values="223;223;194;194;165;165;223" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></line><g><rect x="27" y="340" width="92" height="48" rx="10" fill="#e9f3f4"/><rect x="27" y="340" width="92" height="48" rx="10" fill="none" stroke="#168a7d" stroke-width="3" opacity="1"><animate attributeName="opacity" values="1;1;.25;.25;.25;.25;1" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="73" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#137468">β = 0</text></g><g><rect x="144" y="340" width="92" height="48" rx="10" fill="#e9f3f4"/><rect x="144" y="340" width="92" height="48" rx="10" fill="none" stroke="#168a7d" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values=".25;.25;1;1;.25;.25;.25" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="190" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#137468">β = .5</text></g><g><rect x="261" y="340" width="92" height="48" rx="10" fill="#e9f3f4"/><rect x="261" y="340" width="92" height="48" rx="10" fill="none" stroke="#168a7d" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values=".25;.25;.25;.25;1;1;.25" keyTimes="0;.29;.34;.62;.67;.96;1" dur="9s" calcMode="discrete" repeatCount="indefinite"/></rect><text x="307" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#137468">β = 1</text></g><g font-size="12"><rect x="26" y="400" width="12" height="12" rx="2" fill="#8564b4"/><text x="44" y="411" fill="#526b84">Inverse</text><rect x="132" y="400" width="12" height="12" rx="2" fill="#d5893e"/><text x="150" y="411" fill="#526b84">Forward</text><rect x="252" y="400" width="12" height="12" rx="2" fill="#168a7d"/><text x="270" y="411" fill="#526b84">Total</text></g></svg>