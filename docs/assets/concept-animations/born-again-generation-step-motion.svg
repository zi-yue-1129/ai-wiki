<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Born-again networks: fresh students and contraction</title><desc id="desc">Two students start with uniform probabilities, receive fixed targets from the preceding generation, and take one illustrative gradient step each. The lower plot reveals the L2 distance to uniform and a contraction bound at each generation.</desc><rect width="640" height="360" rx="10" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="26" font-size="21" fill="#24374a" text-anchor="middle">Born-again networks</text><rect x="16" y="41" width="176" height="180" rx="3" fill="#e8eef4" /><text x="104" y="61" font-size="17" fill="#24374a" text-anchor="middle">Generation 0</text><text x="104" y="80" font-size="14" fill="#24374a" text-anchor="middle">Fixed teacher</text><path d="M26 150.667H182" stroke="#63778a" stroke-dasharray="3 3" stroke-width="1.2" opacity=".8"/><rect x="35" y="114.000" width="34" height="70.000" rx="3" fill="#315c85" /><text x="52" y="202" font-size="13" fill="#24374a" text-anchor="middle">A</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.035;.96;.98;1" dur="12s" repeatCount="indefinite"/><text x="52" y="102" font-size="12" fill="#315c85" text-anchor="middle">70.0%</text></g><rect x="84" y="164.000" width="34" height="20.000" rx="3" fill="#315c85" /><text x="101" y="202" font-size="13" fill="#24374a" text-anchor="middle">B</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.035;.96;.98;1" dur="12s" repeatCount="indefinite"/><text x="101" y="102" font-size="12" fill="#315c85" text-anchor="middle">20.0%</text></g><rect x="133" y="174.000" width="34" height="10.000" rx="3" fill="#315c85" /><text x="150" y="202" font-size="13" fill="#24374a" text-anchor="middle">C</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.035;.96;.98;1" dur="12s" repeatCount="indefinite"/><text x="150" y="102" font-size="12" fill="#315c85" text-anchor="middle">10.0%</text></g><path d="M196 125h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2"/><circle cx="196" cy="125" r="4" fill="#a05c20" opacity="0"><animate attributeName="cx" values="196;196;228;228" keyTimes="0;0.06;0.2;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.06;0.08;0.18000000000000002;0.2;1" dur="12s" repeatCount="indefinite"/></circle><rect x="232" y="41" width="176" height="180" rx="3" fill="#e8eef4" /><text x="320" y="61" font-size="17" fill="#24374a" text-anchor="middle">Generation 1</text><text x="320" y="80" font-size="14" fill="#24374a" text-anchor="middle">Fresh logits → step</text><path d="M242 150.667H398" stroke="#63778a" stroke-dasharray="3 3" stroke-width="1.2" opacity=".8"/><rect x="251" y="150.667" width="34" height="33.333" rx="3" fill="#08766f"><animate attributeName="height" values="33.333;33.333;46.396;46.396;33.333;33.333" keyTimes="0;0.2;0.34;.96;.98;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="150.667;150.667;137.604;137.604;150.667;150.667" keyTimes="0;0.2;0.34;.96;.98;1" dur="12s" repeatCount="indefinite"/></rect><text x="268" y="202" font-size="13" fill="#24374a" text-anchor="middle">A</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.355;.96;.98;1" dur="12s" repeatCount="indefinite"/><text x="268" y="102" font-size="12" fill="#08766f" text-anchor="middle">46.4%</text></g><rect x="300" y="150.667" width="34" height="33.333" rx="3" fill="#08766f"><animate attributeName="height" values="33.333;33.333;28.141;28.141;33.333;33.333" keyTimes="0;0.2;0.34;.96;.98;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="150.667;150.667;155.859;155.859;150.667;150.667" keyTimes="0;0.2;0.34;.96;.98;1" dur="12s" repeatCount="indefinite"/></rect><te