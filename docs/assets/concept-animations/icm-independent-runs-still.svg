<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 294" role="img" aria-labelledby="title description">
<title id="title">Two independent illustrative sample-mean trajectories</title>
<desc id="description">Two deterministic pseudo-random streams from the same one-third probability for three possible outcomes yield different running-mean trajectories over twenty draws. Run 1 ends at 2.786, run 2 at 3.002, and both target an analytic expectation of 3.017. These numbers are illustrative, not model measurements.</desc>
<rect x="1" y="1" width="418" height="292" rx="14" fill="#f8fbfd" stroke="#b9cbd8"/>
<text x="20" y="30" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#213e53">Same distribution, different draws</text>
<text x="20" y="55" font-family="Arial,sans-serif" font-size="14" fill="#526a7d">p = (⅓, ⅓, ⅓)    ·    n = 20</text>
<path d="M51 88V210H389" fill="none" stroke="#667e8f" stroke-width="1.5"/>
<path d="M51 210.00H389" stroke="#dfe8ee" stroke-width="1"/><text x="39" y="214.00" font-size="13" text-anchor="end" fill="#526a7d">1</text><path d="M51 179.50H389" stroke="#dfe8ee" stroke-width="1"/><text x="39" y="183.50" font-size="13" text-anchor="end" fill="#526a7d">2</text><path d="M51 149.00H389" stroke="#dfe8ee" stroke-width="1"/><text x="39" y="153.00" font-size="13" text-anchor="end" fill="#526a7d">3</text><path d="M51 118.50H389" stroke="#dfe8ee" stroke-width="1"/><text x="39" y="122.50" font-size="13" text-anchor="end" fill="#526a7d">4</text><path d="M51 88.00H389" stroke="#dfe8ee" stroke-width="1"/><text x="39" y="92.00" font-size="13" text-anchor="end" fill="#526a7d">5</text><text x="51.00" y="229" font-size="13" text-anchor="middle" fill="#526a7d">1</text><text x="211.11" y="229" font-size="13" text-anchor="middle" fill="#526a7d">10</text><text x="389.00" y="229" font-size="13" text-anchor="middle" fill="#526a7d">20</text>
<path d="M51 148.47H389" stroke="#8163b0" stroke-width="2.5" stroke-dasharray="7 5"/>
<polyline points="51.00,141.38 68.79,141.38 86.58,135.11 104.37,136.68 122.16,137.62 139.95,138.24 157.74,144.42 175.53,149.05 193.32,148.19 211.11,151.52 228.89,150.60 246.68,153.17 264.47,155.34 282.26,154.35 300.05,153.48 317.84,155.23 335.63,156.77 353.42,158.14 371.21,156.27 389.00,155.53" stroke="#bf6d28" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="389.00" cy="155.53" r="4.2" fill="#bf6d28" stroke="white" stroke-width="1.5"/><polyline points="51.00,122.59 68.79,152.02 86.58,142.21 104.37,137.30 122.16,138.12 139.95,135.53 157.74,133.68 175.53,139.65 193.32,137.76 211.11,136.24 228.89,140.35 246.68,143.77 264.47,146.67 282.26,149.16 300.05,148.64 317.84,148.18 335.63,150.14 353.42,148.61 371.21,150.34 389.00,148.95" stroke="#268da3" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="389.00" cy="148.95" r="4.2" fill="#268da3" stroke="white" stroke-width="1.5"/>
