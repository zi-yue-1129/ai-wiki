<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Embedding lookup backward pass</title><desc id="desc">Three positions use IDs 2,0,2 with upstream gradients (1,2),(3,-1),(-2,1). Scatter-add accumulates row 0 (3,-1), row 1 (0,0), row 2 (-1,3); position order is illustrative.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="8" fill="#f1f6fa"/><text x="24" y="32" fill="#233b52" font-size="21" text-anchor="start">Embedding lookup backward pass</text><rect x="18" y="52" width="604" height="280" rx="4" fill="white" /><text x="115" y="83" fill="#233b52" font-size="18" text-anchor="middle">Position gradient</text><text x="506" y="83" fill="#233b52" font-size="18" text-anchor="middle">Table gradient</text><path d="M205 121 L415 261" fill="none" stroke="#9cb2c1" stroke-width="2" stroke-dasharray="5 4"/><path d="M205 191 L415 121" fill="none" stroke="#9cb2c1" stroke-width="2" stroke-dasharray="5 4"/><path d="M205 261 L415 261" fill="none" stroke="#9cb2c1" stroke-width="2" stroke-dasharray="5 4"/><rect x="33" y="97" width="172" height="48" rx="4" fill="#edf2f6" /><text x="47" y="127" fill="#21678d" font-size="17" text-anchor="start">ID 2</text><text x="187" y="127" fill="#233b52" font-size="18" text-anchor="end">(1, 2)</text><rect x="415" y="97" width="190" height="48" rx="4" fill="#e5f5ee" /><text x="428" y="127" fill="#087d70" font-size="17" text-anchor="start">Row 0</text><rect x="33" y="167" width="172" height="48" rx="4" fill="#edf2f6" /><text x="47" y="197" fill="#21678d" font-size="17" text-anchor="start">ID 0</text><text x="187" y="197" fill="#233b52" font-size="18" text-anchor="end">(3, −1)</text><rect x="415" y="167" width="190" height="48" rx="4" fill="#e5f5ee" /><text x="428" y="197" fill="#087d70" font-size="17" text-anchor="start">Row 1</text><rect x="33" y="237" width="172" height="48" rx="4" fill="#edf2f6" /><text x="47" y="267" fill="#21678d" font-size="17" text-anchor="start">ID 2</text><text x="187" y="267" fill="#233b52" font-size="18" text-anchor="end">(−2, 1)</text><rect x="415" y="237" width="190" height="48" rx="4" fill="#e5f5ee" /><text x="428" y="267" fill="#087d70" font-size="17" text-anchor="start">Row 2</text><text x="320" y="316" fill="#233b52" font-size="17" text-anchor="middle">Repeated IDs add</text><g class="motion"><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.23;.48;.73;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="590" y="127" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="197" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="267" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.23;.48;.73;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="590" y="127" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="197" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="267" fill="#087d70" font-size="18" text-anchor="end">(1, 2)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.23;.48;.73;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="590" y="127" fill="#087d70" font-size="18" text-anchor="end">(3, −1)</text><text x="590" y="197" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="267" fill="#087d70" font-size="18" text-anchor="end">(1, 2)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.23;.48;.73;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><text x="590" y="127" fill="#087d70" font-size="18" text-anchor="end">(3, −1)</text><text x="590" y="197" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="267" fill="#087d70" font-size="18" text-anchor="end">(−1, 3)</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.23;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle cx="205" cy="121" r="7" fill="#21678d"><animate attributeName="cx" values="205;205;415;415" keyTimes="0;0.04;0.23;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="121;121;261;261" keyTimes="0;0.04;0.23;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.29;0.48;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle cx="205" cy="191" r="7" fill="#21678d"><animate attributeName="cx" values="205;205;415;415" keyTimes="0;0.29;0.48;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="191;191;121;121" keyTimes="0;0.29;0.48;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.54;0.73;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle cx="205" cy="261" r="7" fill="#21678d"><animate attributeName="cx" values="205;205;415;415" keyTimes="0;0.54;0.73;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="261;261;261;261" keyTimes="0;0.54;0.73;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g></g><g class="still"><text x="590" y="127" fill="#087d70" font-size="18" text-anchor="end">(3, −1)</text><text x="590" y="197" fill="#087d70" font-size="18" text-anchor="end">(0, 0)</text><text x="590" y="267" fill="#087d70" font-size="18" text-anchor="end">(−1, 3)</text></g></svg>