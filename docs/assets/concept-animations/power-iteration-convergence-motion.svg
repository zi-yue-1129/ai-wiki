  <circle cx="197.82" cy="144.02" r="3.5" fill="#397bb6" opacity="0.65" id="iterate-1" />
  <circle cx="218.92" cy="157.57" r="3.5" fill="#397bb6" opacity="0.65" id="iterate-2" />
  <circle cx="226.04" cy="166.78" r="3.5" fill="#397bb6" opacity="0.65" id="iterate-3" />
  <circle cx="228.04" cy="170.34" r="3.5" fill="#397bb6" opacity="0.65" id="iterate-4" />
  <circle cx="228.65" cy="171.56" r="3.5" fill="#397bb6" opacity="0.65" id="iterate-5" />
  <text x="92" y="109" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#dc8a35">x₀</text>
