  <line x1="114" y1="195" x2="246" y2="195" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" />
  <line x1="180" y1="129" x2="180" y2="261" stroke="#d7e3ec" stroke-width="1.3" stroke-linecap="round" />
  <line x1="83.02506678707846" y1="240.22015400625483" x2="278.7875487869949" y2="148.93460947026375" stroke="#087f83" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 5" />
  <text x="280" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#087f83">q₁</text>
  <text x="184" y="327" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#20394e">xₖ₊₁ = Axₖ / ‖Axₖ‖</text>
