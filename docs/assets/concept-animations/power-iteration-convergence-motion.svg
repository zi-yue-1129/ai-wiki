<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Power iteration: apply A and normalise</title>
  <desc id="desc">Real symmetric A=Q diag(3,1) Q-transpose, leading eigenvector at 25 degrees. Five apply-and-normalize updates take x0 at 97 degrees to x5, with rows 0 through 5 showing exact angular errors. Illustrative transitions connect the calculated iterates.</desc>
  <rect width="640" height="360" rx="16" fill="#f7fbfd" stroke="#cfdee7" />
  <defs>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 3.5L0 7" fill="none" stroke="#087f83" stroke-width="1.8" />
    </marker>
    <marker id="ambertip" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 3.5L0 7" fill="none" stroke="#dc8a35" stroke-width="1.8" />
    </marker>
  </defs>
  <rect x="19" y="61" width="332" height="285" rx="14" fill="#fff" stroke="#d7e3ec" />
  <rect x="368" y="61" width="251" height="285" rx="14" fill="#fff" stroke="#d7e3ec" />
  <text x="184" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#20394e">Power iteration</text>
  <text x="495" y="42" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#20394e">Angular error</text>
