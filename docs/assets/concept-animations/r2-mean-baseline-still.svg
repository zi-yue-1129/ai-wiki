<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">R squared against a mean baseline</title><desc id="desc">Four targets and a changing set of predictions. Squared residuals shrink to zero, then grow larger than the mean-only baseline, causing R squared to become negative. Values are illustrative.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif} @media(prefers-reduced-motion:reduce){svg{animation:none}}</style><rect width="640" height="360" rx="19" fill="#F5F8FC"/><rect x="15" y="15" width="610" height="330" rx="16" fill="#FFF" stroke="#DDE6EF"/><text x="35" y="42" font-size="17" font-weight="800" fill="#23364A">R² AGAINST THE MEAN</text><text x="604" y="40" text-anchor="end" font-size="11" font-weight="700" fill="#75869B">n = 4</text><rect x="34" y="57" width="347" height="230" rx="11" fill="#F5F8FD"/><rect x="398" y="57" width="207" height="230" rx="11" fill="#F5F8FD"/><text x="51" y="77" fill="#64748B" font-size="10" font-weight="750">TARGETS / PREDICTIONS</text><line x1="52" y1="169" x2="362" y2="169" stroke="#94A8B8" stroke-width="1.4" stroke-dasharray="5 5"/><text x="359" y="161" text-anchor="end" font-size="10" fill="#6C8295">MEAN</text><line x1="91" y1="226" x2="91" y2="140.5" stroke="#D98756" stroke-width="3" stroke-linecap="round" opacity=".80"></line><circle cx="91" cy="226" r="7" fill="#1F708E" stroke="white" stroke-width="2"/><circle cx="91" cy="140.5" r="5.7" fill="#E38A57" stroke="white" stroke-width="1.7"></circle><line x1="168" y1="188" x2="168" y2="159.5" stroke="#D98756" stroke-width="3" stroke-linecap="round" opacity=".80"></line><circle cx="168" cy="188" r="7" fill="#1F708E" stroke="white" stroke-width="2"/><circle cx="168" cy="159.5" r="5.7" fill="#E38A57" stroke="white" stroke-width="1.7"></circle><line x1="245" y1="150" x2="245" y2="178.5" stroke="#D98756" stroke-width="3" stroke-linecap="round" opacity=".80"></line><circle cx="245" cy="150" r="7" fill="#1F708E" stroke="white" stroke-width="2"/><circle cx="245" cy="178.5" r="5.7" fill="#E38A57" stroke="white" stroke-width="1.7"></circle><line x1="322" y1="112" x2="322" y2="197.5" stroke="#D98756" stroke-width="3" stroke-linecap="round" opacity=".80"></line><circle cx="322" cy="112" r="7" fill="#1F708E" stroke="white" stroke-width="2"/><circle cx="322" cy="197.5" r="5.7" fill="#E38A57" stroke="white" stroke-width="1.7"></circle><circle cx="70" cy="268" r="5" fill="#1F708E"/><text x="81" y="272" font-size="10.5" fill="#526779">Truth</text><circle cx="187" cy="268" r="5" fill="#E38A57"/><text x="198" y="272" font-size="10.5" fill="#526779">Prediction</text><text x="416" y="78" font-weight="750" font-size="11" fill="#5B7185">SQUARED ERROR</text><text x="416" y="108" font-size="11" fill="#607387">TSS (mean)</text><rect x="416" y="117" width="168" height="13" rx="6.5" fill="#E2EAF0"/><rect x="416" y="117" width="70" height="13" rx="6.5" fill="#1F708E"/><text x="591" y="128" font-size="10" text-anchor="end" fill="#1F708E" font-weight="750">5.0</text><text x="416" y="170" font-size="11" fill="#607387">RSS (model)</text><rect x="416" y="180" width="168" height="13" rx="6.5" fill="#E2EAF0"/><rect x="416" y="180" width="157.5" height="13" rx="6.5" fill="#E38A57"></rect><text x="416" y="233" font-weight="760" font-size="12" fill="#334D62">R² = 1 − RSS/TSS</text><text x="416" y="260" font-size="10.5" fill="#B26943">IF RSS &gt; TSS, R² &lt; 0</text><text x="42" y="312" font-size="12" font-weight="780" fill="#334D62">R²</text><line x1="136" y1="310" x2="570" y2="310" stroke="#C9D7E1" stroke-width="6" stroke-linecap="round"/><line x1="222.8" y1="304" x2="222.8" y2="316" stroke="#8EA2B4" stroke-width="1.5"/><text x="222.8" y="330" text-anchor="middle" font-size="10" fill="#708294">-1</text><line x1="396.4" y1="304" x2="396.4" y2="316" stroke="#8EA2B4" stroke-width="1.5"/><text x="396.4" y="330" text-anchor="middle" font-size="10" fill="#708294">0</text><line x1="570" y1="304" x2="570" y2="316" stroke="#8EA2B4" stroke-width="1.5"/><text x="570" y="330" text-anchor="middle" font-size="10" fill="#708294">1</text><circle cx="179.4" cy="310" r="10" fill="#E38A57" stroke="white" stroke-width="2.5"></circle><text x="605" y="337" font-size="10" text-anchor="end" fill="#738599">SCHEMATIC</text></svg>