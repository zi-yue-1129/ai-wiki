<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">LSQ step-size sweep across fixed synthetic weights</title><desc id="desc">Four floating-point weights remain fixed while a learned-step-size quantisation lattice changes from 1.0 to 0.6 and back. Teal snapped values move with the grid, sometimes jumping to a different integer code.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfdff" /><stop offset="1" stop-color="#eef5f9" /></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#7664b2" stroke-width="1.7" /></marker></defs><style>text{dominant-baseline:auto}@media(prefers-reduced-motion:reduce){}</style><rect width="640" height="360" rx="18" fill="url(#paper)" /><text x="27" y="37" font-family="Inter,Arial,system-ui,sans-serif" font-size="17" fill="#18364b" font-weight="750" text-anchor="start">LEARNED STEP SIZE</text><text x="27" y="58" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#7890a2" font-weight="650" text-anchor="start">SIGNED 3-BIT · FIXED SYNTHETIC WEIGHTS</text><rect x="25" y="78" width="590" height="219" rx="15" fill="white" stroke="#d6e2eb" /><text x="44" y="105" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#dc8b32" font-weight="700" text-anchor="start">FLOAT</text><circle cx="103" cy="101" r="5" fill="#dc8b32" stroke="white" stroke-width="2.5" /><text x="174" y="105" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#0b8e89" font-weight="700" text-anchor="start">QUANTISED</text><circle cx="260" cy="101" r="5" fill="#0b8e89" stroke="white" stroke-width="2.5" /><text x="575" y="105" font-family="Inter,Arial,system-ui,sans-serif" font-size="11" fill="#7890a2" font-weight="600" text-anchor="end">s: 1.0 → 0.6 → 1.0</text><clipPath id="plotclip"><rect x="135" y="120" width="444" heigh