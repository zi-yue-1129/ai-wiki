<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="t d">
<title id="t">RND prediction loss and reward take different learning paths</title><desc id="d">Current observation feeds a frozen target and a trainable predictor. The feature discrepancy creates an intrinsic reward; gradient updates the predictor only, while reward is passed to the reinforcement-learning policy update. Animated dots follow each directed path. All signals are schematic.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{font-weight:700;fill:#273e57}.edge{fill:none;stroke:#8da6bd;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.pulse{stroke:#fff;stroke-width:1.3}@media(prefers-reduced-motion:reduce){.pulse{display:none}}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8da6bd"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d67b2f"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#178577"/></marker></defs>
<rect width="360" height="520" rx="17" fill="#f7f9fd"/>
<text x="17" y="30" class="label" font-size="18">RND · UPDATE PATHS</text><text x="17" y="49" fill="#536e87" font-size="12">Same input · separate training signals</text>
<rect x="17" y="86" width="94" height="56" rx="10" fill="#e7eef9" stroke="#a4bfdc" stroke-width="2"/><text x="64" y="111" text-anchor="middle" class="label" font-size="15">State</text><text x="64" y="128" text-anchor="middle" font-size="13" fill="#3e6b95">s</text>
<rect x="165" y="73" width="167" height="59" rx="11" fill="#e7f2fb" stroke="#a1c1dd" stroke-width="2"/><text x="249" y="98" text-anchor="middle" class="label" font-size="16">Target</text><text x="249" y="117" text-anchor="middle" font-size="13" fill="#47769e">FROZEN</text>
<rect x="165" y="169" width="167" height="59" rx="11" fill="#fff0e1" stroke="#e2b482" stroke-width="2"/><text x="249" y="194" text-anchor="middle" class="label" font-size="16">Predictor</text><text x="249" y="212" text-anchor="middle" font-size="13" fill="#a76b2c">TRAINABLE</text>
<rect x="165" y="277" width="167" height="86" rx="12" fill="#fff" stroke="#cddbe7" stroke-width="2"/><text x="249" y="303" text-anchor="middle" class="label" font-size="15">Feature gap²</text><rect x="189" y="318" width="119" height="12" rx="6" fill="#e7ebf0"/><rect x="191" y="320" width="90" height="8" rx="4" fill="#dd9144"><animate attributeName="width" values="90;90;90;90;40;40;90" keyTimes="0;.42;.54;.67;.85;.95;1" dur="10s" repeatCount="indefinite"/></rect><text x="249" y="351" text-anchor="middle" font-size="12" fill="#94612c">INTRINSIC BONUS</text>
<rect x="165" y="424" width="167" height="65" rx="11" fill="#e7f5ef" stroke="#9ccbbf" stroke-width="2"/><text x="249" y="452" text-anchor="middle" class="label" font-size="16">Policy</text><text x="249" y="472" text-anchor="middle" font-size="13" fill="#148475">RL UPDATE</text>
<path class="edge" d="M111 114H136V101H162" marker-end="url(#a)"/><path class="edge" d="M136 114V198H162" marker-end="url(#a)"/>
<path class="edge" d="M332 101H345V263H301V274" marker-end="url(#a)"/><path class="edge" d="M249 228V274" marker-end="url(#a)"/>
<path d="M162 318H125V198H162" fill="none" stroke="#d67b2f" stroke-width="3" stroke-dasharray="5 5" stroke-linejoin="round" marker-end="url(#o)"/>
<text x="18" y="273" fill="#b16c2d" font-size="14" font-weight="700">Gradient</text><text x="18" y="291" fill="#b16c2d" font-size="12">predictor only</text>
<path d="M249 365V421" fill="none" stroke="#178577" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#g)"/><text x="265" y="392" fill="#148475" font-size="13">reward</text>
<g class="pulse" fill="#2685bd">
<circle r="6" opacity="0"><animateMotion path="M111 114H136V101H162" keyPoints="0;0;1;1" keyTimes="0;.07;.23;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.07;.23;.24;1" dur="10s" repeatCount="indefinite"/></circle>
<circle r="6" opacity="0"><animateMotion path="M111 114H136V198H162" keyPoints="0;0;1;1" keyTimes="0;.07;.29;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.07;.29;.30;1" dur="10s" repeatCount="indefinite"/></circle>
<circle r="6" opacity="0"><animateMotion path="M332 101H345V263H301V274" keyPoints="0;0;1;1" keyTimes="0;.27;.43;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.26;.27;.43;.44;1" dur="10s" repeatCount="indefinite"/></circle>
<circle r="6" opacity="0"><animateMotion path="M249 228V274" keyPoints="0;0;1;1" keyTimes="0;.31;.43;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.30;.31;.43;.44;1" dur="10s" repeatCount="indefinite"/></circle>
</g>
<g class="pulse" fill="#d67b2f"><circle r="6.5" opacity="0"><animateMotion path="M162 318H125V198H162" keyPoints="0;0;1;1" keyTimes="0;.5;.75;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.5;.75;.76;1" dur="10s" repeatCount="indefinite"/></circle></g>
<g class="pulse" fill="#178577"><circle r="6.5" opacity="0"><animateMotion path="M249 365V421" keyPoints="0;0;1;1" keyTimes="0;.51;.72;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.50;.51;.72;.73;1" dur="10s" repeatCount="indefinite"/></circle></g>
<text x="18" y="508" font-size="12" fill="#61758b">Frozen target ≠ trainable predictor</text>
</svg>
