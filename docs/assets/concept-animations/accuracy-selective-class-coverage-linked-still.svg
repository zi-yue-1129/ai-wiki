<path d="M320 43V216" stroke="#d4deec" stroke-width="1.5" stroke-dasharray="4 5"/>
<g fill="#526783" font-family="Arial,sans-serif" font-weight="bold" font-size="14" text-anchor="middle"><text x="165" y="56">ALL</text><text x="476" y="56">SELECTIVE</text></g>
<g fill="#526783" font-family="Arial,sans-serif" font-size="13" font-weight="bold"><text x="24" y="112">POS</text><text x="24" y="178">NEG</text><text x="340" y="112">POS</text><text x="340" y="178">NEG</text></g>
