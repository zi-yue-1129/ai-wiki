<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" aria-labelledby="title desc"><title id="title">Class-conditional coverage before and after selective rejection</title><desc id="desc">All accepted: positive and negative class coverage are both four of four. Selective acceptance: positive coverage drops to one of four, while negative remains four of four.</desc>
