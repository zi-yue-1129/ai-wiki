<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 464" role="img" aria-labelledby="title desc">
<title id="title">Class coverage and rejected-case outcomes under selective acceptance</title>
<desc id="desc">Constructed example, not model measurements. All accepted: eight of eight accepted, six correct and none rejected. Selective: five accepted, all correct, with one of four positive and all four negative cases kept. Of three rejected cases, one was correct and two wrong. Rejection changes which outcomes are counted, not the predictions.</desc>
<rect width="380" height="464" rx="14" fill="#f8fafc"/><rect x="1" y="1" width="378" height="462" rx="13" fill="none" stroke="#d4deec"/>
<text x="20" y="28" fill="#526783" font-family="Arial,sans-serif" font-size="15" font-weight="bold">CLASS COVERAGE</text>
<rect x="14" y="43" width="352" height="180" rx="11" fill="#ffffff" stroke="#d4deec"/>
<rect x="14" y="260" width="352" height="180" rx="11" fill="#ffffff" stroke="#d4deec"/>
<g fill="#526783" font-family="Arial,sans-serif" font-weight="bold" font-size="14"><text x="30" y="68">ALL</text><text x="30" y="285">SELECTIVE</text></g>
<g fill="#526783" font-family="Arial,sans-serif" font-size="12" font-weight="bold"><text x="30" y="103">POS</text><text x="30" y="147">NEG</text><text x="30" y="177">OVERALL</text><text x="30" y="203">REJECTED</text><text x="30" y="320">POS</text><text x="30" y="364">NEG</text><text x="30" y="394">OVERALL</text><text x="30" y="420">REJECTED</text></g>
<g fill="#e5ebf2"><rect x="83" y="86" width="215" height="22" rx="6"/><rect x="83" y="130" width="215" height="22" rx="6"/><rect x="83" y="303" width="215" height="22" rx="6"/><rect x="83" y="347" width="215" height="22" rx="6"/></g>
<rect x="83" y="86" width="215" height="22" rx="6" fill="#087e85"/><rect x="83" y="130" width="215" height="22" rx="6" fill="#3c719d"/><rect x="83" y="303" width="53.75" height="22" rx="6" fill="#087e85"/><rect x="83" y="347" width="215" height="22" rx="6" fill="#3c719d"/>
<g fill="#172b4d" font-family="Arial,sans-serif" font-weight="bold" font-size="14" text-anchor="middle"><text x="325" y="103">4/4</text><text x="325" y="147">4/4</text><text x="325" y="320">1/4</text><text x="325" y="364">4/4</text></g>
<g fill="#172b4d" font-family="Arial,sans-serif" font-size="12"><text x="109" y="177">8/8 accepted · 6/8 correct</text><text x="109" y="203">0/8 rejected · accuracy N/A</text><text x="109" y="394">5/8 accepted · 5/5 correct</text><text x="109" y="420">3/8 rejected · 1/3 correct · 2/3 wrong</text></g>
