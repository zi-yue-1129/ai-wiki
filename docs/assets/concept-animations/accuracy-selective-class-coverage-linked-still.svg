<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 410" role="img" aria-labelledby="title desc">
<title id="title">Class-conditional coverage before and after selective rejection</title>
<desc id="desc">Constructed example, not model measurements. All eight examples accepted: six of eight correct, positive coverage four of four, negative coverage four of four. Selective acceptance: five of eight accepted and five of five correct; positive coverage one of four, negative coverage four of four.</desc>
