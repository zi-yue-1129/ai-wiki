<text x="286" y="520" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#193e69">P4</text><text x="314" y="521" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0d626a">✓</text>
<rect x="81" y="540" width="56" height="25" rx="6" fill="#e3f0ef" stroke="#087e85" stroke-width="1.5" data-case-id="N1" data-case-correct="true" data-case-accepted="true"/>
<text x="88" y="557" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#193e69">N1</text><text x="116" y="558" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0d626a">✓</text>
<rect x="147" y="540" width="56" height="25" rx="6" fill="#e3f0ef" stroke="#087e85" stroke-width="1.5" data-case-id="N2" data-case-correct="true" data-case-accepted="true"/>
<text x="154" y="557" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#193e69">N2</text><text x="182" y="558" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0d626a">✓</text>
<rect x="213" y="540" width="56" height="25" rx="6" fill="#e3f0ef" stroke="#087e85" stroke-width="1.5" data-case-id="N3" data-case-correct="true" data-case-accepted="true"/>
<text x="220" y="557" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#193e69">N3</text><text x="248" y="558" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0d626a">✓</text>
<rect x="279" y="540" width="56" height="25" rx="6" fill="#e3f0ef" stroke="#087e85" stroke-width="1.5" data-case-id="N4" data-case-correct="true" data-case-accepted="true"/>
<text x="286" y="557" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#193e69">N4</text><text x="314" y="558" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0d626a">✓</text>
<text x="28" y="587" fill="#526783" font-family="Arial,sans-serif" font-size="11">Teal accepted · Pale rejected · ✓ right · × wrong</text>
</svg>
