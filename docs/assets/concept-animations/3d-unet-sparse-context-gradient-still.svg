<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Sparse loss, shared context</title><desc id="desc">A five-output convolution of seven inputs has loss only at y1 and y3; the active backpropagation dependencies extend to x1 through x5 and overlap at x3, while other output losses are masked. A small pulse travels along active paths.</desc><rect width="640" height="360" rx="18" fill="#f7f9fc"/><rect x="12" y="12" width="616" height="336" rx="14" fill="white" stroke="#dbe4ee"/><text x="30" y="43" fill="#23364c" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Sparse loss, shared context</text><text x="30" y="64" fill="#6e7d90" font-family="Arial,Helvetica,sans-serif" font-size="11">Two labeled outputs still depend on neighboring unlabeled inputs</text><text x="37" y="91" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#23364c" font-weight="700" text-anchor="start">Outputs / loss mask</text><text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#23364c" font-weight="700" text-anchor="start">Input context</text><path d="M145 150 Q102.5 205 60 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M145 150 Q146.0 205 147 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M145 150 Q189.5 205 234 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M232 150 Q189.5 205 147 265" fill="none" stroke="#0b8589" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M232 150 Q233.0 205 234 265" fill="none" stroke="#0b8589" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M232 150 Q276.5 205 321 265" fill="none" stroke="#0b8589" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M319 150 Q276.5 205 234 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M319 150 Q320.0 205 321 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M319 150 Q363.5 205 408 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M406 150 Q363.5 205 321 265" fill="none" stroke="#d58a32" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M406 150 Q407.0 205 408 265" fill="none" stroke="#d58a32" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M406 150 Q450.5 205 495 265" fill="none" stroke="#d58a32" stroke-opacity="0.62" stroke-width="3" stroke-dasharray="8 8"></path><path d="M493 150 Q450.5 205 408 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M493 150 Q494.0 205 495 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><path d="M493 150 Q537.5 205 582 265" fill="none" stroke="#e1e8f0" stroke-opacity="0.54" stroke-width="1.1" ></path><circle cx="145" cy="136" r="17" fill="#edf2f7" stroke="#a9b8c9" stroke-width="2"/><text x="145" y="141" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6e7d90" font-weight="700" text-anchor="middle">y0</text><text x="145" y="105" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6e7d90" font-weight="500" text-anchor="middle">×</text><circle cx="232" cy="136" r="17" fill="#0b8589" stroke="#0b8589" stroke-width="2"/><text x="232" y="141" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="white" font-weight="700" text-anchor="middle">y1</text><text x="232" y="105" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#0b8589" font-weight="600" text-anchor="middle">loss</text><circle cx="319" cy="136" r="17" fill="#edf2f7" stroke="#a9b8c9" stroke-width="2"/><text x="319" y="141" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6e7d90" font-weight="700" text-anchor="middle">y2</text><tex