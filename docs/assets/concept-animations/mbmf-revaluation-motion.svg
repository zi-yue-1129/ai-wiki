<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Model based versus model free revaluation</title><desc id="desc">An illustrative one-step task: after Route A reward is devalued, a planner changes values immediately given an updated world model, while a cached action-value learner must receive feedback to update.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#d1e0e9" /><rect x="20" y="16" width="600" height="40" rx="10" fill="#eaf2f7"  /><text x="34" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#22364c" font-weight="bold">Model-based vs model-free</text><text x="607" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#63798e" text-anchor="end">Reward revaluation</text><rect x="26" y="70" width="588" height="90" rx="12" fill="#fff" stroke="#dfebf1" /><text x="43" y="91" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#63798e" font-weight="bold">World model</text><rect x="152" y="85" width="136" height="61" rx="10" fill="#ecf6f3" stroke="#b7d7d0" /><rect x="329" y="85" width="136" height="61" rx="10" fill="#ecf1f8" stroke="#bfcee0" /><text x="167" y="111" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#0b887e" font-weight="bold">Route A</text><text x="347" y="111" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#417eaa" font-weight="bold">Route B</text><g><text x="176" y="135" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0b887e" font-weight="bold">+5</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.32;.38;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="176" y="135" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#b55d56" font-weight="bold">0</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.32;.38;1" dur="12s" repeatCount="indefinite"/></g><text x="354" y="135" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#417eaa" font-weight="bold">+2</text><text x="484" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#63798e" >Reward</text><text x="484" y="132" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#63798e" >changes</text><rect x="26" y="174" width="287" height="140" rx="12" fill="#fff" stroke="#dfebf1" /><text x="42" y="198" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#22364c" font-weight="bold">MODEL-BASED</text><text x="289" y="198" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#63798e" text-anchor="end">Plan</text><text x="44" y="230" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0b887e" font-weight="bold">A</text><rect x="70" y="215" width="192" height="23" rx="5" fill="#edf4f8"  /><text x="44" y="276" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#417eaa" font-weight="bold">B</text><rect x="70" y="261" width="192" height="23" rx="5" fill="#edf4f8"  /><rect x="70" y="261" width="72" height="23" rx="5" fill="#417eaa"  /><rect x="70" y="215" width="180" height="23" rx="5" fill="#0b887e"><animate attributeName="width" values="180;180;0;0" keyTimes="0;.33;.46;1" dur="12s" repeatCount="indefinite"/></rect><rect x="327" y="174" width="287" height="140" rx="12" fill="#fff" stroke="#dfebf1" /><text x="343" y="198" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#22364c" font-weight="bold">MODEL-FREE</text><text x="590" y="198" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#63798e" text-anchor="end">Cache</text><text x="345" y="230" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0b887e" font-weight="bold">A</text><rect x="371" y="215" width="192" height="23" rx="5" fill="#edf4f8"  /><text x="345" y="276" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#417eaa" font-weight="bold">B</text><rect x="371" y="261" width="192" height="23" rx="5" fill="#edf4f8"  /><rect x="371" y="261" width="72" height="23" rx="5" fill="#417eaa"  /><rect x="371" y="215" width="180" height="23" rx="5" fill="#0b887e"><animate attributeName="width" values="180;180;180;54;54" keyTimes="0;.60;.68;.82;1" dur="12s" repeatCount="indefinite"/></rect><g><text x="578" y="233" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0b887e" font-weight="bold">A</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.75;.82;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="578" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#417eaa" font-weight="bold">B</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.75;.82;1" dur="12s" repeatCount="indefinite"/></g><g><text x="277" y="234" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#0b887e" font-weight="bold">A</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.34;.48;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="277" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#417eaa" font-weight="bold">B</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.34;.48;1" dur="12s" repeatCount="indefinite"/></g><line x1="48" y1="336" x2="590" y2="336" stroke="#dfebf1" stroke-width="4" stroke-linecap="round"/><circle cx="223" cy="336" r="5" fill="#d17b32"/><text x="223" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#63798e" text-anchor="middle">Revalue</text><circle cx="449" cy="336" r="5" fill="#d17b32"/><text x="449" y="330" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#63798e" text-anchor="middle">Feedback</text><circle cx="48" cy="336" r="6" fill="#d17b32"><animate attributeName="cx" from="48" to="590" dur="12s" repeatCount="indefinite"/></circle></svg>