<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Sigma reparameterisation: effective spectral norm fixed by learnable gamma</title><desc id="desc">An illustrative diagonal matrix with singular values 2s and 0.5s changes scale. Dividing by its top singular value and multiplying by fixed gamma 1.2 makes the effective singular values 1.2 and 0.3, while raw singular values vary. This is a fixed-gamma slice, not a training run or a bound on the entire network.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2f7"/></linearGradient></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#243f55}.tag{font-size:13px;font-weight:700;letter-spacing:1.2px}.heading{font-size:14px;font-weight:700}.micro{font-size:12px}.dim{fill:#657f90}.animate-view{display:inline}.still-view{display:none}@media(prefers-reduced-motion:reduce){.animate-view{display:none!important}.still-view{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="url(#bg)"/><text x="28" y="37" class="tag dim">SPECTRAL REPARAM</text><text x="610" y="37" text-anchor="end" class="micro dim">GAMMA = 1.2</text><rect x="28" y="76" width="284" height="219" rx="14" fill="#ffffff" stroke="#d4e2ec"/><text x="44" y="105" class="heading">RAW WEIGHT W</text><text x="44" y="124" class="micro dim">Singular values grow with input scale</text><rect x="328" y="76" width="284" height="219" rx="14" fill="#ffffff" stroke="#d4e2ec"/><text x="344" y="105" class="heading">EFFECTIVE WEIGHT</text><text x="344" y="124" class="micro dim">Divide by top singular value</text><g class="animate-view"><text x="47" y="171" class="heading">σ1</text><rect x="95" y="151" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="95" y="151" width="190.000" height="26" rx="6" fill="#d28d4b"><animate attributeName="width" values="47.500;58.680;69.792;80.766;91.535;102.032;112.194;121.956;131.259;140.046;148.263;155.858;162.785;169.001;174.468;179.153;183.026;186.063;188.246;189.561;190.000;189.561;188.246;186.063;183.026;179.153;174.468;169.001;162.785;155.858;148.263;140.046;131.259;121.956;112.194;102.032;91.535;80.766;69.792;58.680;47.500" dur="10s" repeatCount="indefinite"/></rect><text x="47" y="239" class="heading">σ2</text><rect x="95" y="219" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="95" y="219" width="47.500" height="26" rx="6" fill="#9981c3"><animate attributeName="width" values="11.875;14.670;17.448;20.191;22.884;25.508;28.048;30.489;32.815;35.012;37.066;38.964;40.696;42.250;43.617;44.788;45.756;46.516;47.061;47.390;47.500;47.390;47.061;46.516;45.756;44.788;43.617;42.250;40.696;38.964;37.066;35.012;32.815;30.489;28.048;25.508;22.884;20.191;17.448;14.670;11.875" dur="10s" repeatCount="indefinite"/></rect><text x="347" y="171" class="heading">σ1</text><rect x="395" y="151" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="395" y="151" width="28.500" height="26" rx="6" fill="#278a88"></rect><text x="347" y="239" class="heading">σ2</text><rect x="395" y="219" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="395" y="219" width="7.125" height="26" rx="6" fill="#56aaa6"></rect></g><g class="still-view"><text x="47" y="171" class="heading">σ1</text><rect x="95" y="151" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="95" y="151" width="190.000" height="26" rx="6" fill="#d28d4b"></rect><text x="47" y="239" class="heading">σ2</text><rect x="95" y="219" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="95" y="219" width="47.500" height="26" rx="6" fill="#9981c3"></rect><text x="347" y="171" class="heading">σ1</text><rect x="395" y="151" width="190" height="26" rx="6" fill="#eaf1f6"/><rect x="395" y="151" width="28.500" height="26" rx="6" fill="#278a88"></rect><text x="347" y="239" class="heading">σ2</text><rect x="395" y="219" width="190" height="26" rx="6" fill="#