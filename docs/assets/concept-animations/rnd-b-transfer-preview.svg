<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 700" role="img" aria-labelledby="rnd-title rnd-desc">
<title id="rnd-title">RND unseen observation B: different hypothetical predictor transfer strengths</title>
<desc id="rnd-desc">Three counterfactual predictions for the same unseen B with fixed target output. At zero, half, and full transfer, the illustrative squared error is 19.13, 4.78, and 0.00 respectively. This is not trained-model data.</desc>
