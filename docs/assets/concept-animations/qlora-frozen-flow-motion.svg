<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">QLoRA storage and trainable adapter data flow</title><desc id="dsc">The frozen four-bit base weights are dequantized for computation. Low-rank adapters contribute to the forward pass and receive parameter updates; the base weights remain frozen. Schematic only.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="none"/><text x="22" y="32" fill="#17324d" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">QLoRA · Frozen NF4, trainable adapters</text><rect x="18" y="55" width="212" height="265" rx="8" fill="#fff" stroke="#c9d8e4"/><rect x="246" y="55" width="153" height="265" rx="8" fill="#fff" stroke="#c9d8e4"/><rect x="415" y="55" width="207" height="265" rx="8" fill="#fff" stroke="#c9d8e4"/><text x="33" y="80" fill="#4475a8" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">NF4 · frozen</text><text x="261" y="80" fill="#17324d" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Compute</text><text x="430" y="80" fill="#008f88" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">LoRA · trainable</text><text x="34" y="102" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">4-bit base storage</text><rect x="41" y="122" width="34" height="29" rx="4" fill="#699abc" stroke="none"/><rect x="83" y="122" width="34" height="29" rx="4" fill="#477eaa" stroke="none"/><rect x="125" y="122" width="34" height="29" rx="4" fill="#22577e" stroke="none"/><rect x="167" y="122" width="34" height="29" rx="4" fill="#e4eef7" stroke="none"/><rect x="41" y="158" width="34" height="29" rx="4" fill="#cedeea" stroke="none"/><rect x="83" y="158" width="34" height="29" rx="4" fill="#9ebad0" stroke="none"/><rect x="125" y="158" width="34" height="29" rx="4" fill="#699abc" stroke="none"/><rect x="167" y="158" width="34" height="29" rx="4" fill="#477eaa" stroke="none"/><rect x="41" y="194" width="34" height="29" rx="4" fill="#22577e" stroke="none"/><rect x="83" y="194" width="34" height="29" rx="4" fill="#e4eef7" stroke="none"/><rect x="125" y="194" width="34" height="29" rx="4" fill="#cedeea" stroke="none"/><rect x="167" y="194" width="34" height="29" rx="4" fill="#9ebad0" stroke="none"/><rect x="41" y="230" width="34" height="29" rx="4" fill="#699abc" stroke="none"/><rect x="83" y="230" width="34" height="29" rx="4" fill="#477eaa" stroke="none"/><rect x="125" y="230" width="34" height="29" rx="4" fill="#22577e" stroke="none"/><rect x="167" y="230" width="34" height="29" rx="4" fill="#e4eef7" stroke="none"/><text x="35" y="292" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">Stored codes · no base updates</text><rect x="260" y="129" width="125" height="59" rx="8" fill="#edf4fb" stroke="#c6d8e8"/><text x="322" y="155" fill="#4475a8" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">Dequantise</text><text x="322" y="174" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="middle">for matmul</text><rect x="260" y="218" width="125" height="57" rx="8" fill="#eff8f6" stroke="#c4e4df"/><text x="322" y="243" fill="#008f88" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">Forward sum</text><text x="322" y="261" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="middle">base + BA</text><rect x="438" y="117" width="158" height="61" rx="8" fill="#eff8f6" stroke="#c4e4df"/><text x="517" y="141" fill="#008f88" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">B · A</text><text x="517" y="161" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="middle">low-rank update</text><rect x="438" y="222" width="158" height="61" rx="8" fill="#f3f0fc" stroke="#ddd4f1"/><text x="517" y="246" fill="#7257b5" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">Gradient update</text><text x="517" y="266" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="middle">adapters only</text><defs><marker id="forward" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#d98828"/></marker><marker id="back" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#7257b5"/></marker></defs><path d="M218 156 L258 156" fill="none" stroke="#d98828" stroke-width="2.5" marker-end="url(#forward)"/><circle r="4" fill="#d98828"><animateMotion path="M218 156 L258 156" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle><path d="M322 188 L322 216" fill="none" stroke="#d98828" stroke-width="2.5" marker-end="url(#forward)"/><circle r="4" fill="#d98828"><animateMotion path="M322 188 L322 216" dur="3.2s" begin="0.7s" repeatCount="indefinite"/></circle><path d="M436 148 L411 148 L411 247 L385 247" fill="none" stroke="#d98828" stroke-width="2.5" marker-end="url(#forward)"/><circle r="4" fill="#d98828"><animateMotion path="M436 148 L411 148 L411 247 L385 247" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle><path d="M385 264 L411 264 L411 251 L436 251" fill="none" stroke="#7257b5" stroke-width="2.5" marker-end="url(#back)"/><circle r="4" fill="#7257b5"><animateMotion path="M385 264 L411 264 L411 251 L436 251" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle><path d="M517 221 L517 180" fill="none" stroke="#7257b5" stroke-width="2.5" marker-end="url(#back)"/><circle r="4" fill="#7257b5"><animateMotion path="M517 221 L517 180" dur="3.2s" begin="2.1s" repeatCount="indefinite"/></circle><text x="320" y="344" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">Schematic dataflow · base is frozen, gradients update only A/B</text></svg>