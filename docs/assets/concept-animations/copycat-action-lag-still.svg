<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Copycat action history: one-step lag</title><desc id="desc">Expert action steps GO GO GO BRAKE BRAKE BRAKE GO GO. A copycat policy repeats the prior expert action, making a mistake when the action switches at t3 and t6. A moving time cursor reveals the delay.</desc><rect width="639" height="359" x=".5" y=".5" rx="16" fill="#f8fbfe" stroke="#d9e4eb"/><style>@media (prefers-reduced-motion: reduce) { .moving { display:none!important } .lamp { opacity:.1!important } .shortcut { width:7px!important } }</style><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#24394d" text-anchor="start">Copycat action history</text><text x="614" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#607588" text-anchor="end">One-step lag</text><rect x="22" y="54" width="596" height="220" rx="12" fill="#fff" stroke="#d9e4eb" stroke-width="1.2"/><text x="181" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t0</text><text x="235" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t1</text><text x="289" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t2</text><text x="343" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t3</text><text x="397" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t4</text><text x="451" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t5</text><text x="505" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t6</text><text x="559" y="83" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#607588" text-anchor="middle">t7</text><text x="35" y="140" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24394d" text-anchor="start">Expert</text><text x="35" y="216" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24394d" text-anchor="start">Copycat</text><rect x="159" y="110" width="44" height="43" rx="7" fill="#e8f7f3" stroke="#168779" stroke-width="1.8"/><text x="181" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#168779" text-anchor="middle">GO</text><rect x="213" y="110" width="44" height="43" rx="7" fill="#e8f7f3" stroke="#168779" stroke-width="1.8"/><text x="235" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#168779" text-anchor="middle">GO</text><rect x="267" y="110" width="44" height="43" rx="7" fill="#e8f7f3" stroke="#168779" stroke-width="1.8"/><text x="289" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#168779" text-anchor="middle">GO</text><rect x="321" y="110" width="44" height="43" rx="7" fill="#fff2df" stroke="#e4a045" stroke-width="1.8"/><text x="343" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#e4a045" text-anchor="middle">STOP</text><rect x="375" y="110" width="44" height="43" rx="7" fill="#fff2df" stroke="#e4a045" stroke-width="1.8"/><text x="397" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#e4a045" text-anchor="middle">STOP</text><rect x="429" y="110" width="44" height="43" rx="7" fill="#fff2df" stroke="#e4a045" stroke-width="1.8"/><text x="451" y="137" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#e4a045" text-anchor="middle">STOP</text><rect x="483" y="110" width="44" height="43" rx="7" fil