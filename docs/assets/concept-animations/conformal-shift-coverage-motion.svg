<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">COVERAGE UNDER DISTRIBUTION SHIFT</title><desc id="desc">Eight synthetic test scores move to a shifted hypothetical cohort while the calibration threshold remains fixed. Matched case has 7 of 8 scores at or below q; shifted case has 3 of 8. This is an illustrative sample, not an estimated coverage rate.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.2px}.tiny{font-size:12px}.label{font-size:14px;font-weight:700}.big{font-size:22px;font-weight:760}.muted{fill:#648094}@media(prefers-reduced-motion:reduce){animate{display:none!important}.reveal{opacity:1}}</style><rect width="640" height="360" rx="18" fill="#f4f8fc" /><text class="eyebrow" x="28" y="34">COVERAGE UNDER DISTRIBUTION SHIFT</text><text class="tiny muted" x="28" y="57">Fixed calibration q = 0.54  ·  alpha = 0.25</text><rect x="28" y="76" width="584" height="183" rx="13" fill="white" stroke="#d8e6ed" /><rect x="92" y="120" width="244.62" height="96" fill="#e8f6f2" /><path d="M92 214 H545" stroke="#a6bdcb" stroke-width="2" /><path d="M336.62 104 V222" stroke="#cf795a" stroke-width="3" stroke-dasharray="7 5" /><text x="315.62" y="99" class="tiny" font-weight="700">q = .54</text><text x="92" y="242" class="tiny muted">0</text><text x="545" y="242" class="tiny muted" text-anchor="end">1</text><text x="105" y="140" class="tiny muted">IN SET</text><text x="461" y="140" class="tiny muted">OUT</text><circle cx="123.71" cy="167" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="123.71;123.71;146.36;146.36" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#168575" keyTimes="0;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="159.95" cy="180" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="159.95;159.95;250.55;250.55" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#168575" keyTimes="0;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="196.19" cy="193" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="196.19;196.19;318.50;318.50" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#168575" keyTimes="0;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="227.90" cy="167" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="227.90;227.90;359.27;359.27" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#cf795a" keyTimes="0;0.693103448276" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="268.67" cy="180" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="268.67;268.67;400.04;400.04" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#cf795a" keyTimes="0;0.500689655172" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="304.91" cy="193" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="304.91;304.91;431.75;431.75" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#cf795a" keyTimes="0;0.335" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="318.50" cy="167" r="10" fill="#168575" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="318.50;318.50;458.93;458.93" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#168575;#cf795a" keyTimes="0;0.26" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><circle cx="390.98" cy="180" r="10" fill="#cf795a" stroke="white" stroke-width="2" opacity=".9"><animate attributeName="cx" values="390.98;390.98;499.70;499.70" keyTimes="0;.18;.80;1" dur="12s" repeatCount="indefinite" /><animate attributeName="fill" values="#cf795a;#cf795a" keyTimes="0;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></circle><rect x="28" y="272" width="269" height="61" rx="11" fill="#e9f6f3" stroke="#bdded6" /><rect x="312" y="272" width="300" height="61" rx="11" fill="#fff1ea" stroke="#f1d3c2" /><text x="45" y="295" class="tiny muted">START ENDPOINT</text><text x="45" y="319" class="label">7 / 8 in set</text><text x="329" y="295" class="tiny muted">END ENDPOINT</text><text x="329" y="319" class="label">3 / 8 in set</text><text x="28" y="349" class="tiny muted">Toy interpolation; colours switch at q. Hold, then reset.</text></svg>