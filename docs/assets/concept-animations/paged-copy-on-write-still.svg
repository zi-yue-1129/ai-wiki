<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">PagedAttention copy-on-write</title><desc id="desc">A and B share two KV blocks. B copies the partly filled P1 to P2, remaps its tail, and appends y; A appends x to P1. P0 remains shared. All tokens and counts are schematic.</desc><style>text{font-family:Arial,system-ui,sans-serif}.fallback{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.fallback{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="14" fill="#f5f9fc" stroke="none"/><text x="24" y="34" font-size="20" fill="#253c52" text-anchor="start" font-weight="700">COPY-ON-WRITE</text><rect x="24" y="66" width="282" height="240" rx="10" fill="#fff" stroke="#dbe5ed"/><rect x="322" y="66" width="294" height="240" rx="10" fill="#fff" stroke="#dbe5ed"/><text x="40" y="91" font-size="13" fill="#536b7d" text-anchor="start" font-weight="700">LOGICAL BLOCK TABLE</text><text x="338" y="91" font-size="13" fill="#536b7d" text-anchor="start" font-weight="700">PHYSICAL KV BLOCKS</text><text x="40" y="140" font-size="18" fill="#253c52" text-anchor="start" font-weight="700">A</text><text x="40" y="230" font-size="18" fill="#253c52" text-anchor="start" font-weight="700">B</text><text x="113" y="108" font-size="12" fill="#536b7d" text-anchor="middle">L0</text><text x="213" y="108" font-size="12" fill="#536b7d" text-anchor="middle">L1</text><text x="113" y="198" font-size="12" fill="#536b7d" text-anchor="middle">L0</text><text x="213" y="198" font-size="12" fill="#536b7d" text-anchor="middle">L1</text><rect x="71" y="116" width="84" height="38" rx="5" fill="#08756e" stroke="none"/><text x="113" y="141" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">P0</text><rect x="171" y="116" width="84" height="38" rx="5" fill="#35678f" stroke="none"/><text x="213" y="141" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">P1</text><rect x="71" y="206" width="84" height="38" rx="5" fill="#08756e" stroke="none"/><text x="113" y="231" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">P0</text><rect x="336" y="101" width="266" height="59" rx="6" fill="#f5f9fc" stroke="#dbe5ed"/><text x="347" y="124" font-size="15" fill="#08756e" text-anchor="start" font-weight="700">P0</text><rect x="420" y="114" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="470" y="114" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="336" y="168" width="266" height="59" rx="6" fill="#f5f9fc" stroke="#dbe5ed"/><text x="347" y="191" font-size="15" fill="#35678f" text-anchor="start" font-weight="700">P1</text><rect x="420" y="181" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="470" y="181" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="336" y="235" width="266" height="59" rx="6" fill="#f5f9fc" stroke="#dbe5ed"/><text x="347" y="258" font-size="15" fill="#a26420" text-anchor="start" font-weight="700">P2</text><rect x="420" y="248" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="470" y="248" width="44" height="32" rx="5" fill="#e6edf3" stroke="#dbe5ed"/><rect x="420" y="114" width="44" height="32" rx="5" fill="#08756e" stroke="none"/><text x="442" y="136" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">a</text><rect x="470" y="114" width="44" height="32" rx="5" fill="#08756e" stroke="none"/><text x="492" y="136" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">b</text><rect x="420" y="181" width="44" height="32" rx="5" fill="#35678f" stroke="none"/><text x="442" y="203" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">c</text><text x="594" y="144" font-size="14" fill="#536b7d" text-anchor="end" font-weight="700">refs 2</text><text x="24" y="337" font-size="15" fill="#536b7d" text-anchor="start">Shared full block stays shared; split the writable tail.</text><rect x="171" y="206" width="84" height="38" rx="5" fill="#a26420" stroke="none"/><text x="213" y="231" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">P2</text><text x="594" y="211" font-size="14" fill="#536b7d" text-anchor="end" font-weight="700">refs 1</text><text x="594" y="278" font-size="14" fill="#536b7d" text-anchor="end" font-weight="700">refs 1</text><rect x="470" y="181" width="44" height="32" rx="5" fill="#35678f" stroke="none"/><text x="492" y="203" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">x</text><rect x="420" y="248" width="44" height="32" rx="5" fill="#a26420" stroke="none"/><text x="442" y="270" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">c</text><rect x="470" y="248" width="44" height="32" rx="5" fill="#a26420" stroke="none"/><text x="492" y="270" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">y</text><text x="616" y="34" font-size="15" fill="#08756e" text-anchor="end" font-weight="700">Copy P1 → P2, then append</text></svg>
