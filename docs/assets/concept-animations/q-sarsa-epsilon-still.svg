<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 630" width="440" height="630" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Epsilon-greedy action choice and backup targets</title><desc id="diagram-desc">For epsilon 0.2 and two actions with values five and two, greedy action L has probability ninety percent, R ten percent. Q-learning uses max-value bootstrap of 5.50. SARSA takes one of two sampled-action targets, 5.50 or 2.80. Expected SARSA averages both with the behavior probabilities to 5.23. Values are illustrative.</desc>
<defs><style>text{font-family:Inter,Arial,DejaVu Sans,sans-serif} .small{font-size:13px;fill:#52637C} .medium{font-size:15px;font-weight:650;fill:#122542} .big{font-size:28px;font-weight:750;fill:#142846} .card{fill:#FFF;stroke:#CBD8E9;stroke-width:1.4} .mono{font-family:Arial,DejaVu Sans,sans-serif;font-variant-numeric:tabular-nums}</style></defs>
<rect width="440" height="630" rx="20" fill="#F4F8FE"/><rect x="1" y="1" width="438" height="628" rx="19" fill="none" stroke="#D7E2F2" stroke-width="2"/>
<text x="25" y="40" font-size="22" font-weight="750" fill="#102744">ε-greedy choices</text><text x="25" y="65" class="small mono">ε = 0.20       Q(L) = 5       Q(R) = 2</text>
<rect x="26" y="82" width="184" height="117" rx="13" class="card"/><rect x="230" y="82" width="184" height="117" rx="13" class="card"/>
<rect x="26" y="82" width="6" height="117" rx="3" fill="#3572D4"/><rect x="408" y="82" width="6" height="117" rx="3" fill="#E18A3E"/>
<text x="43" y="111" class="medium">L · greedy</text><text x="43" y="149" font-size="30" font-weight="750" fill="#2465B7">90%</text><text x="247" y="111" class="medium">R · explore</text><text x="247" y="149" font-size="30" font-weight="750" fill="#B55E28">10%</text>
<rect x="43" y="168" width="150" height="12" rx="6" fill="#E8EFF9"/><rect x="247" y="168" width="150" height="12" rx="6" fill="#F6EDE3"/>
<rect x="43" y="168" width="135" height="12" rx="6" fill="#3473CE"/><rect x="247" y="168" width="15" height="12" rx="6" fill="#E38B3C"/>
<path d="M119 200 V222" stroke="#3572D4" stroke-width="2.8" stroke-linecap="round"/><path d="M113 216 L119 224 L125 216" stroke="#3572D4" stroke-width="2.8" fill="none" stroke-linejoin="round"/>
<rect x="26" y="232" width="388" height="92" rx="13" class="card"/><rect x="38" y="244" width="364" height="67" rx="10" fill="#EDF4FF"/>
<text x="51" y="264" class="medium">Q-learning · max</text><text x="51" y="301" class="big mono">5.50</text><text x="244" y="289" font-size="15" fill="#35526F" font-weight="600">1 + .9 × 5</text>
<path d="M118 324 V338" stroke="#7892B8" stroke-width="2" stroke-dasharray="3 4"/><path d="M322 199 C420 210 420 300 400 339" fill="none" stroke="#E3A46D" stroke-width="2.2" stroke-dasharray="5 5"/>
<rect x="26" y="347" width="388" height="121" rx="13" class="card"/>
<text x="43" y="373" class="medium">SARSA · sample one action</text>
<rect x="42" y="390" width="171" height="65" rx="9" fill="#EEF5FF" stroke="#AAC9F3" stroke-width="1.3"/><rect x="227" y="390" width="171" height="65" rx="9" fill="#FFF4E9" stroke="#F0C7A2" stroke-width="1.3"/>
<text x="55" y="409" font-size="13" font-weight="650" fill="#3267A9">L · 90% chance</text><text x="55" y="441" font-size="26" font-weight="750" fill="#245FAF">5.50</text>
<text x="240" y="409" font-size="13" font-weight="650" fill="#A8662E">R · 10% chance</text><text x="240" y="441" font-size="26" font-weight="750" fill="#AE622C">2.80</text>
