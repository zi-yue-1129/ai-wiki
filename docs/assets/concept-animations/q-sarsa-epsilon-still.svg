<rect x="26" y="495" width="388" height="105" rx="13" class="card"/><rect x="38" y="507" width="364" height="81" rx="10" fill="#EDF7F3"/>
<text x="51" y="529" class="medium">Expected SARSA · average</text><text x="51" y="556" class="small mono">.90 × 5.50 + .10 × 2.80</text>
<text x="51" y="582" font-size="12" fill="#428275">policy-weighted target</text><text x="311" y="580" font-size="28" font-weight="750" fill="#237B67" class="mono">5.23</text>
