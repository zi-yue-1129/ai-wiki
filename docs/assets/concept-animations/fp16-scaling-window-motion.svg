<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">FP16 loss scaling: the representability window</title><desc id="d">Synthetic binary16 gradients 2 to minus 27 and 2 to 5 are multiplied by a common power of two. As the scale changes from 1 to 4096, the tiny gradient moves out of the zero-underflow region, while the larger gradient eventually overflows. For powers of two, both examples are representable between 8 and 1024 inclusive.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.motion-only{} .reduced-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.reduced-only{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="38" font-size="21" fill="#18364d" font-weight="750" >LOSS SCALE WINDOW</text><text x="24" y="59" font-size="12" fill="#60768c" font-weight="500" >Two gradients · one common power-of-two scale</text><rect x="95" y="89" width="40" height="179" rx="2" fill="#fde8dd" stroke="none" /><rect x="135" y="89" width="400" height="179" rx="2" fill="#e6f3ef" stroke="none" /><rect x="535" y="89" width="30" height="179" rx="2" fill="#fde8dd" stroke="none" /><text x="96" y="80" font-size="11" fill="#9e553a" font-weight="700" >UNDERFLOW</text><text x="274" y="80" font-size="12" fill="#167c76" font-weight="700" >FINITE FP16</text><text x="493" y="80" font-size="11" fill="#9e553a" font-weight="700" >OVERFLOW</text><line x1="95" y1="266" x2="565" y2="266" stroke="#9fb1bf" stroke-width="1.5"/><line x1="95" y1="264" x2="95" y2="271" stroke="#9fb1bf"/><text x="95" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">-28</text><line x1="135" y1="264" x2="135" y2="271" stroke="#9fb1bf"/><text x="135" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">-24</text><line x1="215" y1="264" x2="215" y2="271" stroke="#9fb1bf"/><text x="215" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">-16</text><line x1="375" y1="264" x2="375" y2="271" stroke="#9fb1bf"/><text x="375" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">0</text><line x1="455" y1="264" x2="455" y2="271" stroke="#9fb1bf"/><text x="455" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">8</text><line x1="535" y1="264" x2="535" y2="271" stroke="#9fb1bf"/><text x="535" y="283" font-size="10" fill="#526b82" font-weight="500" text-anchor="middle">16</text><text x="512" y="299" font-size="11" fill="#526b82" font-weight="700" >log2 |Sg|</text><text x="25" y="153" font-size="13" fill="#24435c" font-weight="700" >LOW</text><line x1="95" y1="148" x2="565" y2="148" stroke="#b0c2cf" stroke-width="1" stroke-dasharray="4 5"/><circle class="motion-only" cx="105" cy="148" r="10" fill="#247eb4" stroke="#ffffff" stroke-width="3"><animate attributeName="cx" values="105;225;105" keyTimes="0.000;0.500;1.000" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle><circle class="reduced-only" cx="205" cy="148" r="10" fill="#247eb4" stroke="#ffffff" stroke-width="3"/><text x="25" y="218" font-size="13" fill="#24435c" font-weight="700" >HIGH</text><line x1="95" y1="213" x2="565" y2="213" stroke="#b0c2cf" stroke-width="1" stroke-dasharray="4 5"/><circle class="motion-only" cx="425" cy="213" r="10" fill="#9a6e30" stroke="#ffffff" stroke-width="3"><animate attributeName="cx" values="425;545;425" keyTimes="0.000;0.500;1.000" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle><circle class="reduced-only" cx="525" cy="213" r="10" fill="#9a6e30" stroke="#ffffff" stroke-width="3"/><rect x="24" y="310" width="590" height="34" rx="8" fill="#ffffff" stroke="#dbe6ec" /><text x="37" y="333" font-size="12" fill="#93472f" font-weight="700" >S = 1</text><text x="157" y="333" font-size="12" fill="#13776f" font-weight="700" >S = 1024</text><text x="315" y="333" font-size="12" fill="#93472f" font-weight="700" >S = 4096</text><text x="487" y="333" font-size="11" fill="#60768c" font-weight="700" >SYNTHETIC</text></svg>