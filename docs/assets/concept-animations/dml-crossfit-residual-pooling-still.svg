<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Cross-fitting and residual pooling</title><desc id="desc">Two disjoint folds exchange training and held-out roles. Four toy residual pairs are pooled using the ratio of sums, not a mean of fold slopes.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#60768d"/></marker></defs><rect width="640" height="360" rx="16" fill="#f6f8fc"/><rect x="14" y="14" width="612" height="332" rx="8" fill="#ffffff" stroke="#d9e3ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="320" y="43" font-size="22" font-weight="600" fill="#203651" text-anchor="middle">Cross-fitting</text><text x="102" y="73" font-size="14" font-weight="600" fill="#60768d" text-anchor="middle">Train</text><text x="264" y="73" font-size="14" font-weight="600" fill="#60768d" text-anchor="middle">Nuisance fit</text><text x="491" y="73" font-size="14" font-weight="600" fill="#60768d" text-anchor="middle">Held-out residuals (V, U)</text><rect x="36" y="86" width="132" height="66" rx="8" fill="#f0f5fa" stroke="#d9e3ed"/><text x="102" y="114" font-size="20" font-weight="600" fill="#4268a7" text-anchor="middle">F2</text><text x="102" y="135" font-size="12" font-weight="600" fill="#60768d" text-anchor="middle">Training rows</text><path d="M168 119H203" fill="none" stroke="#4268a7" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="204" y="86" width="120" height="66" rx="8" fill="#f0f5fa" stroke="#d9e3ed"/><text x="264" y="114" font-size="21" font-weight="600" fill="#4268a7" text-anchor="middle">ℓ̂, m̂</text><text x="264" y="135" font-size="13" font-weight="600" fill="#60768d" text-anchor="middle">fit on F2</text><path d="M324 119H361" fill="none" stroke="#4268a7" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="362" y="86" width="238" height="66" rx="8" fill="#f8fbfd" stroke="#d9e3ed"/><text x="481" y="105" font-size="14" font-weight="600" fill="#087f82" text-anchor="middle">F1</text><text x="481" y="126" font-size="17" font-weight="600" fill="#203651" text-anchor="middle">(−1, −2)  (1, 2)</text><text x="481" y="143" font-size="13" font-weight="600" fill="#60768d" text-anchor="middle">ΣVU = 4     ΣV² = 2</text><rect x="36" y="171" width="132" height="66" rx="8" fill="#f0f5fa" stroke="#d9e3ed"/><text x="102" y="199" font-size="20" font-weight="600" fill="#087f82" text-anchor="middle">F1</text><text x="102" y="220" font-size="12" font-weight="600" fill="#60768d" text-anchor="middle">Training rows</text><path d="M168 204H203" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="204" y="171" width="120" height="66" rx="8" fill="#f0f5fa" stroke="#d9e3ed"/><text x="264" y="199" font-size="21" font-weight="600" fill="#087f82" text-anchor="middle">ℓ̂, m̂</text><text x="264" y="220" font-size="13" font-weight="600" fill="#60768d" text-anchor="middle">fit on F1</text><path d="M324 204H361" fill="none" stroke="#087f82" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="362" y="171" width="238" height="66" rx="8" fill="#f8fbfd" stroke="#d9e3ed"/><text x="481" y="190" font-size="14" font-weight="600" fill="#4268a7" text-anchor="middle">F2</text><text x="481" y="211" font-size="17" font-weight="600" fill="#203651" text-anchor="middle">(−2, −2)  (2, 4)</text><text x="481" y="228" font-size="13" font-weight="600" fill="#60768d" text-anchor="middle">ΣVU = 12     ΣV² = 8</text><path d="M600 119H610V249H320V262" fill="none" stroke="#60768d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M481 237V249H320V262" fill="none" stroke="#60768d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="165" y="264" width="310" height="65" rx="8" fill="#eaf7f5" stroke="#a6d8d2"/><text x="320" y="282" font-size="13" font-weight="600" fill="#087f82" text-anchor="middle">Pool held-out rows</text><text x="320" y="311" font-size="23" font-weight="600" fill="#087f82" text-anchor="middle">θ̂ = (4 + 12) / (2 + 8) = 1.6</text></g></svg>
