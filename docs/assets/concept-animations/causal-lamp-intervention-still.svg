<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Causal confusion: lamp intervention</title><desc id="desc">In a schematic brake example, hazard and expert brake stay fixed while an intervened brake lamp dims. A causal policy continues braking; a shortcut policy that copies the lamp loses its brake response.</desc><rect width="639" height="359" x=".5" y=".5" rx="16" fill="#f8fbfe" stroke="#d9e4eb"/><style>@media (prefers-reduced-motion: reduce) { .moving { display:none!important } .lamp { opacity:.1!important } .shortcut { width:7px!important } }</style><text x="26" y="35" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#24394d" text-anchor="start">Causal confusion</text><text x="614" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#607588" text-anchor="end">Lamp intervention</text><rect x="28" y="56" width="584" height="116" rx="12" fill="#fff" stroke="#d9e4eb" stroke-width="1.2"/><rect x="42" y="72" width="138" height="79" rx="10" fill="#f7fafc" stroke="#e2ebf0" stroke-width="1.2"/><text x="111" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#607588" text-anchor="middle">Hazard</text><rect x="249" y="72" width="138" height="79" rx="10" fill="#f7fafc" stroke="#e2ebf0" stroke-width="1.2"/><text x="318" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#607588" text-anchor="middle">Expert action</text><rect x="456" y="72" width="138" height="79" rx="10" fill="#f7fafc" stroke="#e2ebf0" stroke-width="1.2"/><text x="525" y="94" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#607588" text-anchor="middle">Brake lamp</text><path d="M111 103 L96 129 L126 129 Z" fill="#eaf3fb" stroke="#287bb5" stroke-width="2"/><path d="M111 111 V119" stroke="#287bb5" stroke-width="2.4" stroke-linecap="round"/><circle cx="111" cy="124" r="1.5" fill="#287bb5"/><circle cx="318" cy="117" r="17" fill="#e5f5f2" stroke="#168779" stroke-width="2"/><path d="M308 121 L314 128 L328 108" fill="none" stroke="#168779" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="525" cy="117" r="17" fill="#fff4de" stroke="#e4a045" stroke-width="2"/><circle cx="525" cy="117" r="10" class="lamp" fill="#e4a045" opacity="0.10"/><path d="M180 116 H245" stroke="#607588" stroke-width="2.2" fill="none"/><path d="M237 111 L245 116 L237 121" stroke="#607588" stroke-width="2.2" fill="none"/><path d="M387 116 H452" stroke="#607588" stroke-width="2.2" fill="none"/><path d="M444 111 L452 116 L444 121" stroke="#607588" stroke-width="2.2" fill="none"/><text x="28" y="197" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#607588" text-anchor="start">Predicted brake response</text><text x="33" y="225" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#24394d" text-anchor="start">Expert</text><rect x="179" y="205" width="393" height="23" rx="7" fill="#edf3f8" stroke="#e2ebf0" stroke-width="0.8"/><rect x="184" y="210" height="13" rx="5" class="fixed" fill="#168779" opacity=".93" width="376"/><text x="33" y="267" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#24394d" text-anchor="start">Causal policy</text><rect x="179" y="247" width="393" height="23" rx="7" fill="#edf3f8" stroke="#e2ebf0" stroke-width="0.8"/><rect x="184" y="252" height="13" rx="5" class="fixed" fill="#287bb5" opacity=".93" width="376"/><text x="33" y="309" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#24394d" text-anchor="start">Shortcut policy</text><rect x="179" y="289" width="393" height="23" rx="7" fill="#edf3f8" stroke="#e2ebf0" stroke-width="0.8"/><rect x="184" y="294" height="13" rx="5" class="shortcut" fill="#e4a045" opacity=".93" width="7"/><text x="29" y="341" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="400" fill="#607588" text-anchor="start">Toy normalized responses · hazard fixed · not empirical data</text></svg>