<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Averaged signals: mean vs fluctuation</title><desc id="desc">An average over independent unit-variance noise has constant expected output one and standard deviation decreasing as inverse square root of width. Four selected widths from four to thirty-two are highlighted sequentially; a static preview shows the final width.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263b53}.ey{font-size:11px;letter-spacing:.8px;font-weight:700;fill:#60788b}.title{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#587187}.axis{font-size:11px;fill:#647f91}.legend{font-size:12px;font-weight:700}.foot{font-size:11px;fill:#60788b}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="17" fill="#f3f7fb"/><text x="26" y="27" class="ey">MUP · OUTPUT MULTIPLIER</text><text x="26" y="54" class="title">Averaged signals: mean vs fluctuation</text><text x="26" y="76" class="sub">Toy iid channels: h = 1 + noise, Var(noise) = 1</text><rect x="25" y="91" width="590" height="237" rx="12" fill="#fff" stroke="#dbe7f0"/><line x1="107" y1="271" x2="581" y2="271" stroke="#e7eff4"/><text x="76" y="275" class="axis">0</text><line x1="107" y1="216" x2="581" y2="216" stroke="#e7eff4"/><text x="76" y="220" class="axis">0.50</text><line x1="107" y1="161" x2="581" y2="161" stroke="#e7eff4"/><text x="76" y="165" class="axis">1.00</text><path d="M107 128 V271 H581" stroke="#9bb0c0" stroke-width="1.2" fill="none"/><text x="146" y="294" class="axis" text-anchor="middle">4</text><text x="279" y="294" class="axis" text-anchor="middle">8</text><text x="412" y="294" class="axis" text-anchor="middle">16</text><text x="545" y="294" class="axis" text-anchor="middle">32</text><text x="344" y="313" class="axis" text-anchor="middle">width n</text><line x1="364" y1="111" x2="388" y2="111" stroke="#109b94" stroke-width="3"/><text x="395" y="115" class="legend">E[readout]</text><line x1="478" y1="111" x2="501" y2="111" stroke="#e28a49" stroke-width="3"/><text x="507" y="115" class="legend">SD(readout)</text><polyline points="146,161 279,161 412,161 545,161" stroke="#109b94" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="146,216 279,232.11 412,243.5 545,251.55" stroke="#e28a49" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="545" y1="128" x2="545" y2="271" stroke="#768ea1" stroke-width="1.5" stroke-dasharray="4 5" opacity=".75"></line><circle cx="545" cy="161" r="6.4" fill="#109b94" stroke="#fff" stroke-width="2.5"></circle><circle cx="545" cy="251.55" r="6.4" fill="#e28a49" stroke="#fff" stroke-width="2.5"></circle><text x="28" y="346" class="foot">Analytic iid toy; not measured feature or activation statistics.</text></svg>