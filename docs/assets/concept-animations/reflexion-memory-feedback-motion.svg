<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Reflexion feedback and episodic memory across trials</title><desc id="desc">An illustrative failure is evaluated, summarized as a verbal lesson, stored in episodic memory, and used to condition another attempt. Model weights stay fixed; success in the toy second trial is not guaranteed by the method.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" /><stop offset="1" stop-color="#edf5f9" /></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#8fa7b6" stroke-width="1.7" fill="none" /></marker></defs><rect width="640" height="360" fill="url(#bg)" /><text x="26" y="34" text-anchor="start" fill="#193449" font-size="22" font-weight="750" font-family="Arial,Helvetica,sans-serif">Reflexion</text><text x="26" y="55" text-anchor="start" fill="#647e91" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Feedback becomes memory, not a weight update</text><rect x="23" y="73" width="594" height="264" rx="18" fill="#f8fbfd" stroke="#d7e4eb" /><text x="38" y="92" text-anchor="start" fill="#647e91" font-size="11" font-weight="750" font-family="Arial,Helvetica,sans-serif">TRIAL 1</text><text x="38" y="229" text-anchor="start" fill="#647e91" font-size="11" font-weight="750" font-family="Arial,Helvetica,sans-serif">TRIAL 2</text><path d="M192 159 H238" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M396 159 H443" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M604 159 H610 V236 H604" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M443 236 H397" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M239 236 H30 V300 H36" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M192 300 H238" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M396 300 H443" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="36" y="103" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="36" y="103" width="5" height="63" rx="2.5" fill="#286fbc" /><text x="53" y="128" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTOR</text><text x="53" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Attempt 1</text><rect x="240" y="103" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="240" y="103" width="5" height="63" rx="2.5" fill="#d58a31" /><text x="257" y="128" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">EVALUATOR</text><text x="257" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Check outcome</text><rect x="444" y="103" width="160" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="444" y="103" width="5" height="63" rx="2.5" fill="#d58a31" /><text x="461" y="128" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">FAILED</text><text x="461" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Feedback</text><rect x="444" y="190" width="160" height="50" rx="12" fill="#f4eefb" stroke="#ddd1f0" stroke-width="1.5" /><text x="460" y="211" text-anchor="start" fill="#765eb4" font-size="13" font-weight="700" font-family="Arial,Helvetica,sans-serif">REFLECT</text><text x="460" y="228" text-anchor="start" fill="#193449" font-size="11" font-weight="500" font-family="Arial,Helvetica,sans-serif">Avoid error</text><rect x="240" y="177" width="156" height="63" rx="13" fill="#f4eefb" stroke="#ddd1f0" stroke-width="1.5" /><text x="256" y="201" text-anchor="start" fill="#765eb4" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">MEMORY</text><text x="256" y="222" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Saved lesson</text><rect x="36" y="244" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="36" y="244" width="5" height="63" rx="2.5" fill="#286fbc" /><text x="53" y="269" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTOR</text><text x="53" y="291" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Attempt 2</text><rect x="240" y="244" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="240" y="244" width="5" height="63" rx="2.5" fill="#d58a31" /><text x="257" y="269" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">EVALUATOR</text><text x="257" y="291" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Check again</text><rect x="444" y="244" width="160" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="444" y="244" width="5" height="63" rx="2.5" fill="#24876f" /><text x="461" y="269" text-anchor="start" fill="#24876f" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">PASSED</text><text x="461" y="291" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Toy outcome</text><rect x="447" y="17" width="167" height="28" rx="14" fill="#ecf1f5" stroke="#d4e0e7" /><text x="531" y="35" text-anchor="middle" fill="#647e91" font-size="11" font-weight="700" font-family="Arial,Helvetica,sans-serif">WEIGHTS FIXED</text><rect x="32" y="99" width="164" height="71" rx="17" fill="none" stroke="#286fbc" stroke-width="4" opacity="0" id="stage-0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.14;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="236" y="99" width="164" height="71" rx="17" fill="none" stroke="#d58a31" stroke-width="4" opacity="0" id="stage-1"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.14;0.28;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="440" y="99" width="168" height="71" rx="17" fill="none" stroke="#d58a31" stroke-width="4" opacity="0" id="stage-2"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.28;0.43;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="440" y="186" width="168" height="58" rx="17" fill="none" stroke="#765eb4" stroke-width="4" opacity="0" id="stage-3"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.43;0.56;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="236" y="173" width="164" height="71" rx="17" fill="none" stroke="#765eb4" stroke-width="4" opacity="0" id="stage-4"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.56;0.7;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="32" y="240" width="164" height="71" rx="17" fill="none" stroke="#286fbc" stroke-width="4" opacity="0" id="stage-5"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.7;0.82;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="236" y="240" width="164" height="71" rx="17" fill="none" stroke="#d58a31" stroke-width="4" opacity="0" id="stage-6"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.82;0.94;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="440" y="240" width="168" height="71" rx="17" fill="none" stroke="#24876f" stroke-width="4" opacity="0" id="stage-7"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.94;1" dur="12s" repeatCount="indefinite" calcMode="discrete" /></rect><circle r="5.5" fill="#765eb4" stroke="white" stroke-width="2" id="progress-marker" cx="114" cy="159"><animate attributeName="cx" values="114;114;318;318;524;524;610;610;580;580;318;318;30;30;114;114;318;318;524;524" keyTimes="0;0.05;0.14;0.19;0.28;0.32;0.35;0.4;0.43;0.47;0.56;0.6;0.64;0.68;0.7;0.74;0.82;0.86;0.94;1" dur="12s" repeatCount="indefinite" calcMode="linear" /><animate attributeName="cy" values="159;159;159;159;159;159;159;236;236;236;236;236;236;300;300;300;300;300;300;300" keyTimes="0;0.05;0.14;0.19;0.28;0.32;0.35;0.4;0.43;0.47;0.56;0.6;0.64;0.68;0.7;0.74;0.82;0.86;0.94;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></circle></svg>
