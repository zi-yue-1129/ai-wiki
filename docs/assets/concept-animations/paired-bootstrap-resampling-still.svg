<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Paired bootstrap: preserve each A/B pair</title><desc id="desc">Five paired differences are resampled with replacement. Each moving linked teal and orange pair is kept intact; example four is selected twice. One illustrative bootstrap mean is 0.20, compared with original 0.14.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244153}.small{font-size:12px}.cap{font-size:11px;font-weight:700;letter-spacing:.8px;fill:#668196}.bold{font-weight:700}.number{font-size:15px;font-weight:700}.frame{fill:#fff;stroke:#d4e1e9;stroke-width:1.5}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f4f8fb"/><text x="28" y="31" class="cap" >PAIRED BOOTSTRAP</text><text x="28" y="52" class="small" >Resample matched examples together</text><text x="30" y="79" class="cap" >ORIGINAL PAIRS  ·  A − B</text><rect x="55" y="90" width="92" height="58" rx="11" class="frame"/><text x="67" y="110" class="cap" >1</text><text x="101" y="130" class="number" text-anchor="middle">+0.3</text><rect x="170" y="90" width="92" height="58" rx="11" class="frame"/><text x="182" y="110" class="cap" >2</text><text x="216" y="130" class="number" text-anchor="middle">-0.1</text><rect x="285" y="90" width="92" height="58" rx="11" class="frame"/><text x="297" y="110" class="cap" >3</text><text x="331" y="130" class="number" text-anchor="middle">+0.2</text><rect x="400" y="90" width="92" height="58" rx="11" class="frame"/><text x="412" y="110" class="cap" >4</text><text x="446" y="130" class="number" text-anchor="middle">+0.5</text><rect x="515" y="90" width="92" height="58" rx="11" class="frame"/><text x="527" y="110" class="cap" >5</text><text x="561" y="130" class="number" text-anchor="middle">-0.2</text><text x="30" y="213" class="cap" >ONE BOOTSTRAP DRAW  ·  WITH REPLACEMENT</text><rect x="55" y="233" width="92" height="56" rx="11" class="frame"/><circle cx="128" cy="247" r="4" fill="#158c86"/><circle cx="137" cy="247" r="4" fill="#e29d43"/><text x="67" y="253" class="cap" >#4</text><text x="101" y="272" class="number" text-anchor="middle">+0.5</text><rect x="170" y="233" width="92" height="56" rx="11" class="frame"/><circle cx="243" cy="247" r="4" fill="#158c86"/><circle cx="252" cy="247" r="4" fill="#e29d43"/><text x="182" y="253" class="cap" >#2</text><text x="216" y="272" class="number" text-anchor="middle">-0.1</text><rect x="285" y="233" width="92" height="56" rx="11" class="frame"/><circle cx="358" cy="247" r="4" fill="#158c86"/><circle cx="367" cy="247" r="4" fill="#e29d43"/><text x="297" y="253" class="cap" >#4</text><text x="331" y="272" class="number" text-anchor="middle">+0.5</text><rect x="400" y="233" width="92" height="56" rx="11" class="frame"/><circle cx="473" cy="247" r="4" fill="#158c86"/><circle cx="482" cy="247" r="4" fill="#e29d43"/><text x="412" y="253" class="cap" >#1</text><text x="446" y="272" class="number" text-anchor="middle">+0.3</text><rect x="515" y="233" width="92" height="56" rx="11" class="frame"/><circle cx="588" cy="247" r="4" fill="#158c86"/><circle cx="597" cy="247" r="4" fill="#e29d43"/><text x="527" y="253" class="cap" >#5</text><text x="561" y="272" class="number" text-anchor="middle">-0.2</text><rect x="27" y="303" width="586" height="45" rx="10" fill="#e5f1f2"/><text x="43" y="329" class="cap" >Mean Δ</text><text x="130" y="330" class="number" >Original  +0.14</text><text x="343" y="330" class="number" fill="#158c86">Draw  +0.20</text></svg>