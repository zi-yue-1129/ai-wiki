<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FaceNet triplet margin on the unit circle</title><desc id="desc">Anchor and positive are fixed with squared distance 0.4. A negative moves along the circle. Its squared distance increases; the hinge is max(0.6 minus that distance, zero). The static view shows a semi-hard negative. Toy geometry, not a training trajectory.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="8" fill="#f1f6fa" stroke="none"/><rect x="18" y="48" width="292" height="280" rx="8" fill="#fff" stroke="#d6e1e8"/><rect x="322" y="48" width="300" height="280" rx="8" fill="#fff" stroke="#d6e1e8"/><text x="24" y="28" text-anchor="start" font-size="19" fill="#233b52">FaceNet · triplet margin</text><text x="34" y="72" text-anchor="start" font-size="16" fill="#233b52">Unit embeddings</text><text x="338" y="72" text-anchor="start" font-size="16" fill="#233b52">Triplet hinge</text><circle cx="162" cy="191" r="100" fill="none" stroke="#c1d0dc" stroke-width="2"/><line x1="62" y1="191" x2="262" y2="191" stroke="#b9c9d8" stroke-width="1" /><line x1="162" y1="91" x2="162" y2="291" stroke="#b9c9d8" stroke-width="1" /><line x1="262" y1="191" x2="242" y2="131" stroke="#21678d" stroke-width="2.5" /><circle cx="262" cy="191" r="6" fill="#21678d" stroke="none" stroke-width="2"/><circle cx="242" cy="131" r="6" fill="#21678d" stroke="none" stroke-width="2"/><text x="272" y="196" text-anchor="start" font-size="16" fill="#21678d">A</text><text x="222" y="141" text-anchor="end" font-size="16" fill="#21678d">P</text><text x="37" y="316" text-anchor="start" font-size="14" fill="#a95516">N = moving negative</text><rect x="346" y="93" width="104" height="182" rx="8" fill="#fbeee4" stroke="none"/><rect x="450" y="93" width="52" height="182" rx="8" fill="#fff5d8" stroke="none"/><rect x="502" y="93" width="104" height="182" rx="8" fill="#e5f5ee" stroke="none"/><text x="398" y="111" text-anchor="middle" font-size="13" fill="#233b52">Hard</text><text x="476" y="111" text-anchor="middle" font-size="13" fill="#233b52">Semi</text><text x="554" y="111" text-anchor="middle" font-size="13" fill="#233b52">Easy</text><line x1="346" y1="275" x2="606" y2="275" stroke="#8da4b4" stroke-width="1" /><line x1="450" y1="116" x2="450" y2="275" stroke="#21678d" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="502" y1="116" x2="502" y2="275" stroke="#087d70" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="346" y1="155" x2="502" y2="275" stroke="#a95516" stroke-width="3" /><line x1="502" y1="275" x2="606" y2="275" stroke="#a95516" stroke-width="3" /><text x="346" y="293" text-anchor="middle" font-size="13" fill="#233b52">0</text><text x="450" y="293" text-anchor="middle" font-size="13" fill="#233b52">0.4</text><text x="502" y="293" text-anchor="middle" font-size="13" fill="#233b52">0.6</text><text x="606" y="293" text-anchor="middle" font-size="13" fill="#233b52">1</text><text x="476" y="316" text-anchor="middle" font-size="14" fill="#233b52">Squared distance D(A,N)</text><text x="326" y="159" text-anchor="start" font-size="12" fill="#233b52">0.6</text><text x="338" y="135" text-anchor="start" font-size="13" fill="#a95516">Loss</text><line x1="262" y1="191" x2="237" y2="124.8562" stroke="#a95516" stroke-width="3"></line><circle cx="237" cy="124.8562" r="7" fill="#a95516" stroke="white" stroke-width="2"></circle><line x1="476" x2="476" y1="116" y2="275" stroke="#657c8d" stroke-dasharray="3 3"></line><circle cx="476" cy="255" r="6" fill="#a95516" stroke="white" stroke-width="2"></circle></svg>
