<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">KKT complementary slackness along a moving target</title><desc id="desc">One-dimensional illustrative minimization of (x-a) squared over 0 to 1. As a varies from 0.35 to 1.70, the optimizer follows a until the upper constraint binds at one; then its KKT multiplier increases as two times (a minus one).</desc><rect width="640" height="360" rx="16" fill="#f7fbfd" stroke="#d2e0e9"/><rect x="16" y="58" width="343" height="238" rx="14" fill="#ffffff" stroke="#d8e4ec"/><rect x="372" y="58" width="252" height="238" rx="14" fill="#ffffff" stroke="#d8e4ec"/><text x="187" y="38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#243b51" text-anchor="middle">Feasible range: 0 - 1</text><text x="498" y="38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#243b51" text-anchor="middle">KKT multiplier</text><rect x="54" y="89" width="147.43" height="172" rx="8" fill="#e4f4f2"/><line x1="201.43" y1="86" x2="201.43" y2="266" stroke="#078481" stroke-width="2" stroke-dasharray="5 4"/><line x1="54" y1="151" x2="312" y2="151" stroke="#cbd9e3" stroke-width="2"/><line x1="54" y1="229" x2="312" y2="229" stroke="#cbd9e3" stroke-width="2"/><text x="28" y="132" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#be6c32" text-anchor="start">a</text><text x="28" y="211" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#078481" text-anchor="start">x*</text><text x="54" y="284" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#567086" text-anchor="middle">0</text><text x="201.42857142857142" y="284" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#078481" text-anchor="middle">1</text><text x="304.6285714285714" y="284" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#567086" text-anchor="middle">1.7</text><circle cx="304.63" cy="151" r="9" fill="#dc8a35" stroke="#fff" stroke-width="2"></circle><circle cx="201.43" cy="229" r="9" fill="#087f83" stroke="#fff" stroke-width="2"></circle><text x="498" y="106" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#526b7d" text-anchor="middle">μ = 0 if a ≤ 1</text><line x1="423" y1="270" x2="583" y2="270" stroke="#b9cbd8" stroke-width="2"/><rect x="456" y="130.00" width="90" height="140.00" rx="6" fill="#078481"></rect><text x="498" y="317" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#426075" text-anchor="middle">μ = 2 max(a − 1, 0)</text><text x="320" y="344" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#61798c" text-anchor="middle">min (x − a)²  ·  0 to 1 bound  ·  a: 0.35 to 1.70</text></svg>