="10" fill="#607089">0</text><text x="459.8" y="293" font-family="Arial,sans-serif" font-size="10" fill="#607089" text-anchor="middle">0.8</text><text x="580.6" y="293" font-family="Arial,sans-serif" font-size="10" fill="#607089" text-anchor="end">1.6</text><text x="47" y="284" font-family="Arial,sans-serif" font-size="16" fill="#7154b7" font-weight="700">λ</text><line x1="75" y1="280" x2="280" y2="280" stroke="#dce5ef" stroke-width="5"/><text x="77" y="302" font-family="Arial,sans-serif" font-size="11" fill="#607089">0</text><text x="278" y="302" font-family="Arial,sans-serif" font-size="11" fill="#607089" text-anchor="end">1</text><text x="34" y="344" font-family="Arial,sans-serif" font-size="11" fill="#607089">One prediction p=(0.2, 0.7, 0.1); two hard-target terms</text><rect x="84" y="121" width="50.50" height="27" rx="4" fill="#008f86"></rect><rect x="84" y="193" width="151.50" height="27" rx="4" fill="#e98a20"></rect><rect x="339" y="139" width="60.76" height="16" rx="3" fill="#008f86"/><rect x="339" y="181" width="40.39" height="16" rx="3" fill="#e98a20"/><rect x="339" y="239" width="60.76" height="25" rx="2" fill="#008f86"></rect><rect x="399.76" y="239" width="40.39" height="25" rx="2" fill="#e98a20"></rect><circle cx="126.25" cy="280" r="7" fill="#7154b7" stroke="white" stroke-width="2"></circle></svg>