<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Batch normalisation: training and inference static preview</title><desc id="desc">Four teaching stages: batch A and shifted batch B use different batch means, training updates running statistics, and inference uses frozen running statistics for one sample. Positions are illustrative.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5fa"/></linearGradient><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#0d9488" stroke-width="1.3"/></marker></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.phase{transition:none}@media(prefers-reduced-motion:reduce){.phase{opacity:0!important}.phase.fallback{opacity:1!important}.pulse{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#paper)"/><g class="phase fallback" opacity="1"><text x="29" y="34" font-size="16" font-weight="800" fill="#203c50" text-anchor="start">BATCH NORMALISATION</text><text x="611" y="34" font-size="11" font-weight="750" fill="#0d9488" text-anchor="end">INFERENCE · SINGLE SAMPLE</text><rect x="24" y="76" width="286" height="196" rx="12" fill="#ffffff" stroke="#cbdce6" stroke-width="1.5"/><rect x="330" y="76" width="286" height="196" rx="12" fill="#ffffff" stroke="#cbdce6" stroke-width="1.5"/><text x="42" y="101" font-size="11" font-weight="700" fill="#6e8799" text-anchor="start">INPUT ACTIVATIONS</text><text x="348" y="101" font-size="11" font-weight="700" fill="#6e8799" text-anchor="start">NORMALISED OUTPUT</text><path d="M50 244L291 244" stroke="#cbdce6" stroke-width="1.6" fill="none"  stroke-linecap="round"/><path d="M350 244L593 244" stroke="#cbdce6" stroke-width="1.6" fill="none"  stroke-linecap="round"/><circle cx="239" cy="177" r="9" fill="#4b78b3" stroke="#ffffff" stroke-width="2"/><path d="M186.5 116L186.5 238" stroke="#df8b46" stroke-width="2" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/><text x="42" y="264" font-size="12" font-weight="650" fill="#4b78b3" text-anchor="start">frozen μrun, σrun</text><circle cx="535.5" cy="177" r="9" fill="#0d9488" stroke="#ffffff" stroke-width="2"/><path d="M472.5 116L472.5 238" stroke="#0d9488" stroke-width="2" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/><text x="348" y="264" font-size="12" font-weight="650" fill="#0d9488" text-anchor="start">no batch dependency</text><text x="29" y="304" font-size="12" font-weight="600" fill="#203c50" text-anchor="start">Use frozen training statistics at test time</text><rect x="250" y="326" width="34" height="17" rx="8" fill="#ffffff" stroke="#cbdce6" stroke-width="1"/><text x="267" y="338" font-size="10" font-weight="700" fill="#6e8799" text-anchor="middle">01</text><rect x="296" y="326" width="34" height="17" rx="8" fill="#ffffff" stroke="#cbdce6" stroke-width="1"/><text x="313" y="338" font-size="10" font-weight="700" fill="#6e8799" text-anchor="middle">02</text><rect x="342" y="326" width="34" height="17" rx="8" fill="#ffffff" stroke="#cbdce6" stroke-width="1"/><text x="359" y="338" font-size="10" font-weight="700" fill="#6e8799" text-anchor="middle">03</text><rect x="388" y="326" width="34" height="17" rx="8" fill="#0d9488" stroke="#0d9488" stroke-width="1"/><text x="405" y="338" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">04</text></g></svg>