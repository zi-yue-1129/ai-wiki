<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Clipped relative positions in relation-aware attention</title><desc id="desc">A scanning query moves across nine keys. The unbounded relative offset changes linearly, but with a clipping radius of two the learned relation bucket saturates for distant positions.</desc><rect width="640" height="360" rx="18" fill="#ffffff"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e3eb" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203248}.head{font-size:20px;font-weight:700}.small{font-size:12px;fill:#5b7085}.axis{font-size:11px;fill:#607489}.tag{font-size:13px;font-weight:700}</style><text x="24" y="36" class="head">Relative offsets · clipping</text><text x="24" y="56" class="small">Fixed key = 4 · clip radius = 2</text><rect x="64" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="87.5" y="93" class="tag" text-anchor="middle">0</text><rect x="124" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="147.5" y="93" class="tag" text-anchor="middle">1</text><rect x="184" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="207.5" y="93" class="tag" text-anchor="middle">2</text><rect x="244" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="267.5" y="93" class="tag" text-anchor="middle">3</text><rect x="304" y="71" width="47" height="34" rx="7" fill="#e5f5ee" stroke="#70b89f"/><text x="327.5" y="93" class="tag" text-anchor="middle">4</text><rect x="364" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="387.5" y="93" class="tag" text-anchor="middle">5</text><rect x="424" y="71" width="47" height="34" rx="7" fill="#f1f5f9" stroke="#dce5ee"/><text x="447.5" y="93" class="tag" text-anchor="middle">6</text><rect x="484" y="71" width="47" height="34" rx=