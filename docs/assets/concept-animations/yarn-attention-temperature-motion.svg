<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">YaRN attention logit scale and entropy</title><desc id="desc">For fixed toy content logits two, one, zero and minus one, raising the multiplier from 0.5 to 2 concentrates softmax mass on the top key and reduces Shannon entropy. The demonstration isolates attention logit scaling, distinct from YaRN frequency modification; all numbers are synthetic.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203248}.head{font-size:19px;font-weight:700}.small{font-size:12px;fill:#52677e}.axis{font-size:11px;fill:#607489}.tag{font-size:13px;font-weight:700}.value{font-size:16px;font-weight:700}</style><style>.still-layer{opacity:0}@media(prefers-reduced-motion:reduce){.motion-layer{display:none}.still-layer{opacity:1}}</style><g class="motion-layer"><rect x="0" y="0" width="640" height="360" fill="#fff" rx="18" /><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e3eb" stroke-width="2" /><text x="25" y="36" class="head">YaRN · attention logit scaling</text><text x="25" y="56" class="small">Fixed content logits · sharper softmax after scaling</text><rect x="25" y="74" width="282" height="233" fill="#f4f8fb" rx="12" stroke="#dce6ef" /><rect x="333" y="74" width="282" height="233" fill="#f4f8fb" rx="12" stroke="#dce6ef" /><text x="45" y="98" class="tag">Before</text><text x="45" y="117" class="small">scale 0.5</text><text x="353" y="98" class="tag">After scaling</text><text x="353" y="117" class="small">scale 0.5 → 2.0</text><line x1="50" y1="278" x2="290" y2="278" stroke="#b8c8d6" stroke-width="1.4" /><line x1="358" y1="278" x2="597" y2="278" stroke="#b8c8d6" stroke-width="1.4" /><rect x="62" y="199.641" width="30" height="77.359" fill="#97bbd0" rx="5" /><text x="77" y="295" class="axis" text-anchor="middle">k0</text><rect x="122" y="230.079" width="30" height="46.921" fill="#97bbd0" rx="5" /><text x="13