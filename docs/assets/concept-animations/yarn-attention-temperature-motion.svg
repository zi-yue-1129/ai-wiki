<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">YaRN attention logit scale and entropy</title><desc id="desc">For fixed toy content logits two, one, zero and minus one, raising the multiplier from 0.5 to 2 concentrates softmax mass on the top key and reduces Shannon entropy. The demonstration isolates attention logit scaling, distinct from YaRN frequency modification; all numbers are synthetic.</desc><rect x="0" y="0" width="640" height="360" fill="#fff" rx="18" /><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e3eb" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203248}.head{font-size:19px;font-weight:700}.small{font-size:12px;fill:#52677e}.axis{font-size:11px;fill:#607489}.tag{font-size:13px;font-weight:700}.value{font-size:16px;font-weight:700}</style><text x="25" y="36" class="head" >YaRN · attention logit scaling</text><text x="25" y="56" class="small" >Fixed content logits · sharper softmax after scaling</text><rect x="25" y="74" width="282" height="233" fill="#f4f8fb" rx="12" stroke="#dce6ef"/><rect x="333" y="74" width="282" height="233" fill="#f4f8fb" rx="12" stroke="#dce6ef"/><text x="45" y="98" class="tag" >Before</text><text x="45" y="117" class="small" >scale 0.5</text><text x="353" y="98" class="tag" >After scaling</text><text x="353" y="117" class="small" >scale 0.5 → 2.0</text><line x1="50" y1="278" x2="290" y2="278" stroke="#b8c8d6" stroke-width="1.4"/><line x1="358" y1="278" x2="597" y2="278" stroke="#b8c8d6" stroke-width="1.4"/><rect x="62" y="199.641" width="30" height="77.359" fill="#97bbd0" rx="5" /><text x="77" y="295" class="axis" text-anchor="middle">k0</text><rect x="122" y="230.079" width="30" height="46.921" fill="#97bbd0" rx="5" /><text x="137" y="295" class="axis" text-anchor="middle">k1</text><rect x="182" y="248.541" width="30" height="28.459" fill="#97bbd0" rx="5" /><text x="197" y="295" class="axis" text-anchor="middle">k2</text><rect x="242" y="259.739" width="30" height="17.261" fill="#97bbd0" rx="5" /><text x="257" y="295" class="axis" text-anchor="middle">k3</text><rect x="370" y="129.958" width="30" height="147.042" rx="5" fill="#e88d41"><animate attributeName="y" values="199.641;129.958;129.958;199.641" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="77.359;147.042;147.042;77.359" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/></rect><text x="385" y="295" class="axis" text-anchor="middle">k0</text><rect x="430" y="257.1" width="30" height="19.9" rx="5" fill="#167c9d"><animate attributeName="y" values="230.079;257.1;257.1;230.079" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="46.921;19.9;19.9;46.921" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/></rect><text x="445" y="295" class="axis" text-anchor="middle">k1</text><rect x="490" y="274.307" width="30" height="2.693" rx="5" fill="#167c9d"><animate attributeName="y" values="248.541;274.307;274.307;248.541" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="28.459;2.693;2.693;28.459" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/></rect><text x="505" y="295" class="axis" text-anchor="middle">k2</text><rect x="550" y="276.636" width="30" height="0.364" rx="5" fill="#167c9d"><animate attributeName="y" values="259.739;276.636;276.636;259.739" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/><animate attributeName="height" values="17.261;0.364;0.364;17.261" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/></rect><text x="565" y="295" class="axis" text-anchor="middle">k3</text><text x="25" y="335" class="small" >Entropy H</text><rect x="107" y="322" width="170" height="14" fill="#e9edf2" rx="7" /><rect x="107" y="322" width="152.712" height="14" fill="#167c9d" rx="7" /><text x="334" y="335" class="small" >Entropy H</text><rect x="416" y="322" width="170" height="14" fill="#e9edf2" rx="7" /><rect x="416" y="322" width="55.861" height="14" rx="7" fill="#e88d41"><animate attributeName="width" values="152.712;55.861;55.861;152.712" keyTimes="0;.4;.6;1" dur="10s" repeatCount="indefinite"/></rect></svg>