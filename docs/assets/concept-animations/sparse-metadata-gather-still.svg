<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Sparse metadata selection</title><desc id="desc">Two retained weight positions select matching activations; the two products sum to eighteen.</desc><rect width="640" height="360" rx="10" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="320" y="25" font-size="21" fill="#24374a" text-anchor="middle">2:4 sparse dot product</text><text x="75" y="70" font-size="17" fill="#24374a" text-anchor="middle">Weight</text><text x="75" y="118" font-size="17" fill="#24374a" text-anchor="middle">Input</text><text x="230" y="43" font-size="14" fill="#24374a" text-anchor="middle">1</text><rect x="193" y="50" width="74" height="36" rx="6" fill="#e8eef4"/><text x="230" y="75" font-size="19" fill="#24374a" text-anchor="middle">0</text><rect x="193" y="98" width="74" height="36" rx="6" fill="#e8eef4"/><text x="230" y="123" font-size="19" fill="#24374a" text-anchor="middle">2</text><text x="340" y="43" font-size="14" fill="#24374a" text-anchor="middle">2</text><rect x="303" y="50" width="74" height="36" rx="6" fill="#315c85"/><text x="340" y="75" font-size="19" fill="#ffffff" text-anchor="middle">−2</text><rect x="303" y="98" width="74" height="36" rx="6" fill="#e8eef4"/><text x="340" y="123" font-size="19" fill="#24374a" text-anchor="middle">−3</text><text x="450" y="43" font-size="14" fill="#24374a" text-anchor="middle">3</text><rect x="413" y="50" width="74" height="36" rx="6" fill="#e8eef4"/><text x="450" y="75" font-size="19" fill="#24374a" text-anchor="middle">0</text><rect x="413" y="98" width="74" height="36" rx="6" fill="#e8eef4"/><text x="450" y="123" font-size="19" fill="#24374a" text-anchor="middle">1</text><text x="560" y="43" font-size="14" fill="#24374a" text-anchor="middle">4</text><rect x="523" y="50" width="74" height="36" rx="6" fill="#315c85"/><text x="560" y="75" font-size="19" fill="#ffffff" text-anchor="middle">3</text><rect x="523" y="98" width="74" height="36" rx="6" fill="#e8eef4"/><text x="560" y="123" font-size="19" fill="#24374a" text-anchor="middle">4</text><text x="75" y="176" font-size="17" fill="#24374a" text-anchor="middle">Packed (w,k)</text><rect x="287" y="156" width="106" height="36" rx="6" fill="#315c85"/><text x="340" y="181" font-size="19" fill="#ffffff" text-anchor="middle">(−2, 2)</text><rect x="507" y="156" width="106" height="36" rx="6" fill="#315c85"/><text x="560" y="181" font-size="19" fill="#ffffff" text-anchor="middle">(3, 4)</text><rect x="303" y="98" width="74" height="36" rx="6" fill="#08766f"/><text x="340" y="123" font-size="19" fill="#ffffff" text-anchor="middle">−3</text><rect x="523" y="98" width="74" height="36" rx="6" fill="#08766f"/><text x="560" y="123" font-size="19" fill="#ffffff" text-anchor="middle">4</text><text x="75" y="230" font-size="17" fill="#24374a" text-anchor="middle">Gather</text><rect x="303" y="210" width="74" height="36" rx="6" fill="#08766f"/><text x="340" y="235" font-size="19" fill="#ffffff" text-anchor="middle">−3</text><rect x="523" y="210" width="74" height="36" rx="6" fill="#08766f"/><text x="560" y="235" font-size="19" fill="#ffffff" text-anchor="middle">4</text><path d="M340 192V208" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 192V208" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="278" font-size="17" fill="#24374a" text-anchor="middle">Multiply</text><text x="340" y="280" font-size="18" fill="#24374a" text-anchor="middle">−2 × −3 = 6</text><text x="560" y="280" font-size="18" fill="#24374a" text-anchor="middle">3 × 4 = 12</text><path d="M340 246V261" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 246V261" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 286V298H450V307" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 286V298H450" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="367" y="308" width="166" height="39" rx="6" fill="#08766f"/><text x="450" y="333" font-size="21" fill="#ffffff" text-anchor="middle">6 + 12 = 18</text></g></svg>
