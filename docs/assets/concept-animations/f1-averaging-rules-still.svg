<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Three F1 aggregation rules and an incorrect averaging shortcut</title><desc id="desc">In a synthetic 90-to-10 single-label dataset, k recovered minority B examples changes macro-F1, support-weighted F1 and micro-F1 in different ways. F1 of averaged per-class precision and recall is not generally macro-F1. Four k states are demonstrated; the static frame uses k equals five.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#294b5a}.head{font-size:18px;font-weight:700}.label{font-size:12px;font-weight:650}.small{font-size:11px;fill:#547383}.value{font-size:10px;fill:#526e7a}.v{font-size:11px;font-weight:700}.stage{font-size:12px;font-weight:700;fill:#2778ba}.k{font-size:22px;font-weight:700;fill:#2778ba}</style><rect width="640" height="360" rx="14" fill="#f0f7fa"/><text class="head" x="24" y="33">Why F1 averages disagree</text><rect x="20" y="70" width="395" height="263" rx="12" fill="white" stroke="#d6e4eb"/><rect x="427" y="70" width="193" height="263" rx="12" fill="white" stroke="#d6e4eb"/><text x="38" y="97" class="label">Summary scores</text><text x="193" y="97" class="small">0</text><text x="347" y="97" class="small">1</text><line x1="191" x2="191" y1="110" y2="285" stroke="#d3e2e9"/><line x1="351" x2="351" y1="110" y2="285" stroke="#d3e2e9"/><text x="37" y="132" class="label">Macro</text><text x="37" y="180" class="label">Weighted</text><text x="37" y="228" class="label">Micro</text><text x="37" y="276" class="label">F1(avg P,R)</text><text x="38" y="316" class="small">Dashed = average P/R first (not macro F1)</text><text x="442" y="97" class="label">Class F1</text><text x="445" y="133" class="label">A</text><text x="445" y="187" class="label">B</text><text x="442" y="221" class="small">Supports: 90 A / 10 B</text><text x="442" y="256" class="label">Recovered minority</text><text x="442" y="318" class="small">Remaining B predicted A</text><text x="24" y="351" class="small">Synthetic, single-label · fixed 90 class-A correct cases</text><rect x="191" y="118" width="160" height="16" rx="6" fill="#e7eff3"/><rect x="191" y="166" width="160" height="16" rx="6" fill="#e7eff3"/><rect x="191" y="214" width="160" height="16" rx="6" fill="#e7eff3"/><rect x="191" y="262" width="160" height="16" rx="6" fill="#e7eff3"/><rect x="480" y="122" width="100" height="13" rx="5" fill="#e7eff3"/><rect x="480" y="176" width="100" height="13" rx="5" fill="#e7eff3"/><g><text class="stage" x="596" y="55" text-anchor="end">B recovered: 5/10</text><rect x="191" y="118" width="131.17" height="16" rx="6" fill="#137f85" fill-opacity="0.86"/><text x="372" y="131" class="v" text-anchor="middle">0.820</text><rect x="191" y="166" width="150.77" height="16" rx="6" fill="#8062b2" fill-opacity="0.86"/><text x="372" y="179" class="v" text-anchor="middle">0.942</text><rect x="191" y="214" width="152.00" height="16" rx="6" fill="#2778ba" fill-opacity="0.86"/><text x="372" y="227" class="v" text-anchor="middle">0.950</text><rect x="191" y="262" width="135.57" height="16" rx="6" fill="#c48a44" fill-opacity="0.18" stroke-dasharray="4 3" stroke="#c48a44" stroke-width="1.7"/><text x="372" y="275" class="v" text-anchor="middle">0.847</text><rect x="480" y="122" width="97.30" height="13" rx="5" fill="#188d88"/><text x="613" y="133" class="value" text-anchor="end">0.973</text><rect x="480" y="176" width="66.67" height="13" rx="5" fill="#d28e48"/><text x="613" y="187" class="value" text-anchor="end">0.667</text><text class="k" x="522" y="285" text-anchor="middle">5 / 10</text></g></svg>