<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Teacher assistant: target-dependent gradient direction</title><desc id="desc">The teacher and assistant supply fixed different class probabilities. A toy student moves from 50 to 70 percent on class A. Direct and assistant gradients are both negative at the first state, but have opposite signs at the second. The sweep compares states, not a training trajectory.</desc><rect width="640" height="360" rx="10" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="27" font-size="21" fill="#24374a" text-anchor="middle">Teacher assistant: change the target</text><rect x="16" y="44" width="176" height="144" rx="4" fill="#e8eef4"></rect><text x="104" y="65" font-size="17" fill="#24374a" text-anchor="middle">Teacher</text><text x="104" y="83" font-size="12" fill="#24374a" text-anchor="middle">Large · fixed</text><rect x="38" y="101.4" width="34" height="57.599999999999994" rx="4" fill="#315c85"></rect><text x="55" y="177" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="55" y="96.4" font-size="12" fill="#315c85" text-anchor="middle">80.0%</text><rect x="87" y="148.2" width="34" height="10.799999999999999" rx="4" fill="#315c85"></rect><text x="104" y="177" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="104" y="143.2" font-size="12" fill="#315c85" text-anchor="middle">15.0%</text><rect x="136" y="155.4" width="34" height="3.5999999999999996" rx="4" fill="#315c85"></rect><text x="153" y="177" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="153" y="150.4" font-size="12" fill="#315c85" text-anchor="middle">5.0%</text><path d="M194 120h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2.5" stroke-linejoin="round"/><circle cx="194" cy="120" r="4" fill="#a05c20" opacity="0"><animate attributeName="cx" values="194;194;226;226;194" keyTimes="0;0.07;0.2;0.97;1" dur