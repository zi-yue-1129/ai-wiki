eyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="123;123;108.6;108.6;123" keyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/></rect><text x="487" y="177" font-size="13" fill="#24374a" text-anchor="middle">A</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.53;0.54;1" dur="12s" repeatCount="indefinite"/><text x="487" y="118" font-size="12" fill="#a05c20" text-anchor="middle">50.0%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.96;0.97;1" dur="12s" repeatCount="indefinite"/><text x="487" y="103.6" font-size="12" fill="#a05c20" text-anchor="middle">70.0%</text></g><rect x="519" y="141" width="34" height="18" rx="4" fill="#a05c20"><animate attributeName="height" values="18;18;10.799999999999999;10.799999999999999;18" keyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="141;141;148.2;148.2;141" keyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/></rect><text x="536" y="177" font-size="13" fill="#24374a" text-anchor="middle">B</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.53;0.54;1" dur="12s" repeatCount="indefinite"/><text x="536" y="136" font-size="12" fill="#a05c20" text-anchor="middle">25.0%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.96;0.97;1" dur="12s" repeatCount="indefinite"/><text x="536" y="143.2" font-size="12" fill="#a05c20" text-anchor="middle">15.0%</text></g><rect x="568" y="141" width="34" height="18" rx="4" fill="#a05c20"><animate attributeName="height" values="18;18;10.799999999999999;10.799999999999999;18" keyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="141;141;148.2;148.2;141" keyTimes="0;0.54;0.74;0.97;1" dur="12s" repeatCount="indefinite"/></rect><text x="585