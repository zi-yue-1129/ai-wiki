<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">Coordinate rescaling changes the measured sharpness of the same loss</title><desc id="dsc">The physical loss curve stays unchanged while its reparameterised view becomes steeper or flatter as the coordinate scaling changes. Both measure the same objective in different coordinates.</desc><rect width="640" height="360" fill="#f7fafc"/><text x="24" y="32" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#17324d" font-weight="700" text-anchor="start">One function · two coordinate systems</text><text x="615" y="31" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60758c" font-weight="500" text-anchor="end">Curvature is parameterisation-dependent</text><rect x="24" y="55" width="282" height="212" rx="12" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.4"/><text x="39" y="80" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#3e6da8" font-weight="700" text-anchor="start">Physical coordinate w</text><line x1="43" y1="235" x2="287" y2="235" stroke="#c6d4df" stroke-width="1.3"/><line x1="165" y1="93" x2="165" y2="240" stroke="#c6d4df" stroke-width="1" stroke-dasharray="3 5"/><path d="M47 172.792 L53.556 179.512 L60.111 185.848 L66.667 191.8 L73.222 197.368 L79.778 202.552 L86.333 207.352 L92.889 211.768 L99.444 215.8 L106 219.448 L112.556 222.712 L119.111 225.592 L125.667 228.088 L132.222 230.2 L138.778 231.928 L145.333 233.272 L151.889 234.232 L158.444 234.808 L165 235 L171.556 234.808 L178.111 234.232 L184.667 233.272 L191.222 231.928 L197.778 230.2 L204.333 228.088 L210.889 225.592 L217.444 222.712 L224 219.448 L230.556 215.8 L237.111 211.768 L243.667 207.352 L250.222 202.552 L256.778 197.368 L263.333 191.8 L269.889 185.848 L276.444 179.512 L283 172.792" stroke="#3e6da8" stroke-width="3.5" fill="none" stroke-linecap="round"></path><line x1="246.944" y1="205" x2="246.944" y2="235" stroke="#3e6da8" stroke-width="1.4" stroke-dasharray="4 4" opacity=".8"></line><circle cx="246.944" cy="205" r="10" fill="#3e6da8" opacity=".15"></circle><circle cx="246.944" cy="205" r="6" fill="#3e6da8" stroke="white" stroke-width="2"></circle><text x="162" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#60758c" font-weight="500" text-anchor="start">0</text><text x="273" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60758c" font-weight="500" text-anchor="start">w</text><text x="42" y="101" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758c" font-weight="500" text-anchor="start">L(w) = w²</text><rect x="334" y="55" width="282" height="212" rx="12" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.4"/><text x="349" y="80" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#db8a24" font-weight="700" text-anchor="start">Rescaled coordinate u</text><line x1="353" y1="235" x2="597" y2="235" stroke="#c6d4df" stroke-width="1.3"/><line x1="475" y1="93" x2="475" y2="240" stroke="#c6d4df" stroke-width="1" stroke-dasharray="3 5"/><path d="M357 119.94 L363.556 132.369 L370.111 144.088 L376.667 155.097 L383.222 165.396 L389.778 174.984 L396.333 183.862 L402.889 192.03 L409.444 199.488 L416 206.235 L422.556 212.272 L429.111 217.599 L435.667 222.216 L442.222 226.122 L448.778 229.318 L455.333 231.804 L461.889 233.58 L468.444 234.645 L475 235 L481.556 234.645 L488.111 233.58 L494.667 231.804 L501.222 229.318 L507.778 226.122 L514.333 222.216 L520.889 217.599 L527.444 212.272 L534 206.235 L540.556 199.488 L547.111 192.03 L553.667 183.862 L560.222 174.984 L566.778 165.396 L573.333 155.097 L579.889 144.088 L586.444 132.369 L593 119.94" stroke="#db8a24" stroke-width="3.5" fill="none" stroke-linecap="round"></path><line x1="556.944" y1="179.512" x2="556.944" y2="235" stroke="#db8a24" stroke-width="1.4" stroke-dasharray="4 4" opacity=".8"></line><circle cx="556.944" cy="179.512" r="10" fill="#db8a24" opacity=".15"></circle><circle cx="556.944" cy="179.512" r="6" fill="#db8a24" stroke="white" stroke-width="2"></circle><text x="472" y="250" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#60758c" font-weight="500" text-anchor="start">0</text><text x="583" y="250" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60758c" font-weight="500" text-anchor="start">u</text><text x="352" y="101" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#60758c" font-weight="500" text-anchor="start">L(u) = (a·u)²</text><rect x="24" y="277" width="592" height="56" rx="12" fill="#ffffff" stroke="#dbe5ee" stroke-width="1.4"/><text x="40" y="298" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#17324d" font-weight="700" text-anchor="start">Curvature</text><text x="40" y="317" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#60758c" font-weight="500" text-anchor="start">Hessian</text><text x="130" y="296" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#3e6da8" font-weight="600" text-anchor="start">H(w) = 2</text><rect x="130" y="304" width="62" height="13" rx="6" fill="#3e6da8"/><text x="336" y="296" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#db8a24" font-weight="600" text-anchor="start">H(u) = 2a²</text><rect x="336" y="304" width="114.675" height="13" rx="6" fill="#db8a24"></rect><text x="590" y="295" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#60758c" font-weight="500" text-anchor="end">a: 0.7 → 1.5</text><text x="320" y="352" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#60758c" font-weight="400" text-anchor="middle">Fixed coordinate radius · no training data</text></svg>