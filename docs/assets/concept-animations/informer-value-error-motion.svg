<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Query score is not output error</title><desc id="desc">With query and key logits fixed, change the fourth value from twelve to four. The skipped-context absolute error for Q2 decreases from four to zero, while Q3 decreases from 1.2 to 0.8. Q2 remains selected by its score.</desc><rect width="640" height="360" fill="#ffffff"/><text x="24" y="31" font-size="23" fill="#23354a" text-anchor="start">Query score is not output error</text><line x1="24" y1="43" x2="616" y2="43" stroke="#dce4ed" /><rect x="24" y="55" width="286" height="54" fill="#f1f5f9" rx="6"/><rect x="330" y="55" width="286" height="54" fill="#f1f5f9" rx="6"/><text x="40" y="77" font-size="18" fill="#08766f" text-anchor="start">Q2 · selected</text><text x="40" y="99" font-size="16" fill="#23354a" text-anchor="start">Score 1.65</text><text x="346" y="77" font-size="18" fill="#a05c20" text-anchor="start">Q3 · skipped</text><text x="346" y="99" font-size="16" fill="#23354a" text-anchor="start">Score 0.52</text><text x="24" y="138" font-size="18" fill="#23354a" text-anchor="start">Absolute error if skipped</text><line x1="74" y1="286" x2="598" y2="286" stroke="#dce4ed" /><text x="63" y="291" font-size="14" fill="#23354a" text-anchor="end">0</text><line x1="74" y1="254" x2="598" y2="254" stroke="#dce4ed" /><text x="63" y="259" font-size="14" fill="#23354a" text-anchor="end">1</text><line x1="74" y1="222" x2="598" y2="222" stroke="#dce4ed" /><text x="63" y="227" font-size="14" fill="#23354a" text-anchor="end">2</text><line x1="74" y1="190" x2="598" y2="190" stroke="#dce4ed" /><text x="63" y="195" font-size="14" fill="#23354a" text-anchor="end">3</text><line x1="74" y1="158" x2="598" y2="158" stroke="#dce4ed" /><text x="63" y="163" font-size="14" fill="#23354a" text-anchor="end">4</text><line x1="74" y1="286" x2="598" y2="286" stroke="#23354a" /><line x1="74" y1="158" x2="74" y2="286" stroke="#23354a" /><text x="74" y="307" font-size="15" fill="#23354a" text-anchor="middle">4</text><text x="205" y="307" font-size="15" fill="#23354a" text-anchor="middle">6</text><text x="336" y="307" font-size="15" fill="#23354a" text-anchor="middle">8</text><text x="467" y="307" font-size="15" fill="#23354a" text-anchor="middle">10</text><text x="598" y="307" font-size="15" fill="#23354a" text-anchor="middle">12</text><line x1="74" y1="286" x2="598" y2="158" stroke="#08766f" stroke-width="3"/><line x1="74" y1="260.4" x2="598" y2="247.6" stroke="#a05c20" stroke-width="3"/><line y1="153" y2="286" stroke="#23354a" stroke-dasharray="4 4" x1="598" x2="598"><animate attributeName="x1" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="598;598;74;74;598"/><animate attributeName="x2" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="598;598;74;74;598"/></line><circle r="6" fill="#08766f" stroke="#ffffff" stroke-width="2" cx="598" cy="158"><animate attributeName="cx" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="598;598;74;74;598"/><animate attributeName="cy" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="158;158;286;286;158"/></circle><circle r="6" fill="#a05c20" stroke="#ffffff" stroke-width="2" cx="598" cy="247.6"><animate attributeName="cx" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="598;598;74;74;598"/><animate attributeName="cy" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="247.6;247.6;260.4;260.4;247.6"/></circle><text x="336" y="331" font-size="17" fill="#23354a" text-anchor="middle">Last value V₄</text><line x1="412" y1="133" x2="433" y2="133" stroke="#08766f" stroke-width="3"/><text x="440" y="138" font-size="15" fill="#08766f" text-anchor="start">Q2</text><line x1="500" y1="133" x2="521" y2="133" stroke="#a05c20" stroke-width="3"/><text x="528" y="138" font-size=