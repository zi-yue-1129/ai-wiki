<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Predictive coding settling and local synaptic update</title><desc id="desc">Toy scalar inference with fixed input 0.2 and target 0.8, a hidden variable relaxes to 0.5 while opposing local errors balance, followed by a local weight-update cue. This is a schematic analogy, not a reproduction of the 2017 network.</desc><rect width="640" height="360" rx="18" fill="#f7fafc"/><rect x="14" y="14" width="612" height="332" rx="16" fill="#ffffff" stroke="#e0e9f1" stroke-width="1.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="38" y="52" fill="#20374f" font-size="19" font-weight="700" >Local-error inference &amp; learning</text><text x="38" y="77" fill="#657c91" font-size="11" font-weight="600" letter-spacing=".8">CLAMPED ENDPOINTS  /  SETTLING HIDDEN STATE</text><rect x="39" y="100" width="141" height="53" rx="11" fill="#e8f4f8" /><rect x="460" y="100" width="141" height="53" rx="11" fill="#fff0e4" /><text x="56" y="122" fill="#2c6178" font-size="13" font-weight="600" >Input</text><text x="56" y="143" fill="#2c6178" font-size="19" font-weight="700" >0.20</text><text x="476" y="122" fill="#ad6a3f" font-size="13" font-weight="600" >Target</text><text x="476" y="143" fill="#ad6a3f" font-size="19" font-weight="700" >0.80</text><path d="M181 126 H272 M367 126 H457" stroke="#a7b8c8" stroke-width="3" stroke-linecap="round"/><rect x="270" y="102" width="99" height="74" rx="12" fill="#eeebfc" /><text x="284" y="122" fill="#5c54b0" font-size="12" font-weight="600" >Hidden</text><text x="286" y="163" fill="#534bba" font-size="16" font-weight="700" >z = 0.50</text><text x="40" y="199" fill="#426b84" font-size="13" font-weight="600" >Left error</text><text x="40" y="238" fill="#aa6b42" font-size="13" font-weight="600" >Right error</text><text x="40" y="277" fill="#665ca4" font-size="13" font-weight="600" >Net drive</text><rect x="150" y="184" width="345" height="16" rx="8" fill="#edf2f7" /><rect x="150" y="184" width="102" height="16" rx="8" fill="#4295bd"></rect><rect x="150" y="223" width="345" height="16" rx="8" fill="#edf2f7" /><rect x="150" y="223" width="102" height="16" rx="8" fill="#e4a36b"></rect><rect x="150" y="262" width="345" height="16" rx="8" fill="#edf2f7" /><rect x="150" y="262" width="0" height="16" rx="8" fill="#8275d5"></rect><path d="M354 262 V279" stroke="#a39bd4" stroke-width="2" stroke-dasharray="3 4"/><text x="40" y="319" fill="#375467" font-size="13" font-weight="600" >Local update</text><circle cx="170" cy="315" r="10" fill="#468ab2"/><circle cx="254" cy="315" r="10" fill="#8171ca"/><path d="M183 315 H241" stroke="#8a9eaf" stroke-width="4" stroke-linecap="round"/><circle cx="214" cy="315" r="7" fill="#db8c49" opacity="1"></circle><text x="282" y="319" fill="#4c5e77" font-size="14" font-weight="600" >Δw ∝ error × activity</text></g></svg>