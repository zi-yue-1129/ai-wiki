<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Illustrative phase shift and communication gate. Sender and receiver rhythms slide from aligned to antiphase and back, with a toy gain proxy.</title><desc id="desc">The sender wave remains fixed while a receiver window slides in phase. A schematic gain proxy (one plus cosine of the phase offset, divided by two) shrinks and recovers. Phase offset alone is not measured coherence or causal evidence.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5fa"/></linearGradient><linearGradient id="band" x2="0" y2="1"><stop stop-color="#16a7a0" stop-opacity=".15"/><stop offset="1" stop-color="#16a7a0" stop-opacity=".02"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#29475c}.over{font-size:12px;font-weight:800;letter-spacing:1.1px}.label{font-size:13px;font-weight:700}.note{font-size:11px;fill:#637f93}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text class="over" x="28" y="35">COMMUNICATION THROUGH COHERENCE</text><rect x="26" y="59" width="588" height="273" rx="14" fill="#ffffff" stroke="#d9e7ef"/><rect x="44" y="77" width="471" height="116" rx="10" fill="#f3f8fc"/><rect x="44" y="203" width="471" height="103" rx="10" fill="#f3f8fc"/><rect x="522" y="77" width="73" height="229" rx="10" fill="#f3f8fc"/><text class="label" x="57" y="104">Sender</text><text class="label" x="57" y="222">Receiver</text><path d="M120 139H502M120 230H502" stroke="#ccdae4" stroke-dasharray="4 6"/><path d="M120.0,139.0 L125.0,132.9 L130.1,127.1 L135.1,122.1 L140.1,118.1 L145.1,115.4 L150.2,114.1 L155.2,114.3 L160.2,116.1 L165.2,119.3 L170.3,123.6 L175.3,129.0 L180.3,134.9 L185.3,141.1 L190.4,147.1 L195.4,152.7 L200.4,157.4 L205.4,161.0 L210.5,163.2 L215.5,16