<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Orca iteration-level scheduling: requests exit and enter between model iterations</title><desc id="desc">Four iteration columns show A and B active in the first iteration; B completes, C enters at the next iteration, and A later completes while C continues. The highlighted column and active batch update during playback. Token counts and timing are schematic.</desc>
<style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#284658}.head{font-size:17px;font-weight:750;letter-spacing:1px}.label{font-size:14px;font-weight:700;letter-spacing:.8px;fill:#607b8c}.cell{font-size:18px;font-weight:750}.note{font-size:12px;fill:#718a99}.phase{opacity:0}@media(prefers-reduced-motion:reduce){.phase{opacity:0!important}.phase0{opacity:1!important}.scan{display:none!important}}</style>
<rect width="640" height="360" rx="16" fill="#f5f9fc"/><text x="28" y="36" class="head" >CONTINUOUS BATCHING</text><text x="28" y="80" class="label" >REQUEST</text><text x="213" y="80" class="label" text-anchor="middle">t1</text><text x="321" y="80" class="label" text-anchor="middle">t2</text><text x="429" y="80" class="label" text-anchor="middle">t3</text><text x="537" y="80" class="label" text-anchor="middle">t4</text><text x="72" y="137" class="cell" text-anchor="middle">A</text><rect x="174" y="110" width="78" height="44" rx="9" fill="#d7f1ec" stroke="#269782" stroke-width="2"/><text x="213" y="138" class="cell" text-anchor="middle">1</text><rect x="282" y="110" width="78" height="44" rx="9" fill="#d7f1ec" stroke="#269782" stroke-width="2"/><text x="321" y="138" class="cell" text-anchor="middle">2</text><rect x="390" y="110" width="78" height="44" rx="9" fill="#d7f1ec" stroke="#269782" stroke-width="2"/><text x="429" y="138" class="cell" text-anchor="middle">3</text><rect x="498" y="110" width="78" height="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="537" y="138" class="label" text-anchor="middle">DONE</text><text x="72" y="199" class="cell" text-anchor="middle">B</text><rect x="174" y="172" width="78" height="44" rx="9" fill="#fff0da" stroke="#c08c3a" stroke-width="2"/><text x="213" y="200" class="cell" text-anchor="middle">1</text><rect x="282" y="172" width="78" height="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="321" y="200" class="label" text-anchor="middle">DONE</text><rect x="390" y="172" width="78" height="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="429" y="200" class="label" text-anchor="middle">DONE</text><rect x="498" y="172" width="78" height="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="537" y="200" class="label" text-anchor="middle">DONE</text><text x="72" y="261" class="cell" text-anchor="middle">C</text><rect x="174" y="234" width="78" height="44" rx="9" fill="#f0f3f6" stroke="#cbd6de" stroke-width="1.4"/><text x="213" y="262" class="label" text-anchor="middle">WAIT</text><rect x="282" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="321" y="262" class="cell" text-anchor="middle">1</text><rect x="390" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="429" y="262" class="cell" text-anchor="middle">2</text><rect x="498" y="234" width="78" height="44" rx="9" fill="#e0ebf8" stroke="#558dbb" stroke-width="2"/><text x="537" y="262" class="cell" text-anchor="middle">3</text><text x="29" y="334" class="note" >B exits after t1; C joins at t2</text><rect class="scan" x="166" y="98" width="94" height="194" rx="13" fill="none" stroke="#2a8497" stroke-width="3" stroke-dasharray="5 5"><animate attributeName="x" values="166;274;382;490;166" keyTimes="0;.25;.5;.75;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></rect><g class="phase phase0" opacity="1"><rect x="414" y="16" width="199" height="31" rx="9" fill="#e8f1f7" stroke="#c6d9e6" stroke-width="1"/><text x="514" y="37" class="label" text-anchor="middle">GPU: A + B</text><animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></g><g class="phase phase1" opacity="0"><rect x="414" y="16" width="199" height="31" rx="9" fill="#e8f1f7" stroke="#c6d9e6" stroke-width="1"/><text x="514" y="37" class="label" text-anchor="middle">GPU: A + C</text><animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></g><g class="phase phase2" opacity="0"><rect x="414" y="16" width="199" height="31" rx="9" fill="#e8f1f7" stroke="#c6d9e6" stroke-width="1"/><text x="514" y="37" class="label" text-anchor="middle">GPU: A + C</text><animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></g><g class="phase phase3" opacity="0"><rect x="414" y="16" width="199" height="31" rx="9" fill="#e8f1f7" stroke="#c6d9e6" stroke-width="1"/><text x="514" y="37" class="label" text-anchor="middle">GPU: C</text><animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;.249;.25;.499;.5;.749;.75;.999;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></g></svg>