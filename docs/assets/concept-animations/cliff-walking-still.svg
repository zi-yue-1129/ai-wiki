<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">Cliff-walking: greedy and exploratory-policy backups</title><desc id="desc">Schematic grid with a cliff. Q-learning's greedy target can prefer the short edge route, whereas SARSA accounts for exploration risk and can favor an inland route; a possible exploratory slip falls into the cliff and returns to start. These are illustrative paths, not trained policies.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#de8150"/></marker><marker id="r-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#bd4f51"/></marker></defs><rect width="440" height="548" rx="20" fill="#f5f8fc"/><text x="24" y="37" font-size="20" font-weight="700" fill="#193650" font-family="DejaVu Sans,Arial,sans-serif">Exploration shapes a route</text><text x="24" y="60" font-size="12.5" fill="#557185" font-family="DejaVu Sans,Arial,sans-serif">Cliff-walking · schematic, not measured</text><rect x="16" y="77" width="408" height="295" rx="14" fill="#fff" stroke="#d9e4ef" stroke-width="1.4"/><rect x="39" y="123" width="52" height="52" fill="#eef4fa" stroke="#dbe5ee"/><rect x="91" y="123" width="52" height="52" fill="#f8fbfe" stroke="#dbe5ee"/><rect x="143" y="123" width="52" height="52" fill="#eef4fa" stroke="#dbe5ee"/><rect x="195" y="123" width="52" height="52" fill="#f8fbfe" stroke="#dbe5ee"/><rect x="247" y="123" width="52" height="52" fill="#eef4fa" stroke="#dbe5ee"/><rect x="299" y="123" width="52" height="52" fill="#f8fbfe" stroke="#dbe5ee"/><rect x="351" y="123" width="52" height="52" fill="#eef4fa" stroke="#dbe5ee"/><rect x="39" y="175" width="52" height="52" fill="#f8fbfe" stroke="#dbe5ee"/><rect x="91" y="175" width="52" height="52" fill="#eef4fa" stroke="#dbe5ee"/><rect x="143" y="175" width="52" height="52" fill="#f8fbfe" stroke="#dbe5ee"/><rec