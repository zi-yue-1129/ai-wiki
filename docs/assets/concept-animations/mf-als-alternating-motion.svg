<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Matrix factorization: alternating least squares</title><desc id="desc">Two users and two items with scalar latent factors alternate exact ridge-regularized least-squares solves. User factors change while item factors stay fixed, then item factors change while user factors stay fixed. The regularized objective decreases across six block updates. Curved intermediate motion is illustrative.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eff5fa"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#29475c}.head{font-size:13px;font-weight:700;letter-spacing:1.1px;fill:#607d90}.txt{font-size:15px;fill:#29475c}.small{font-size:13px;fill:#607d90}.panel{fill:white;stroke:#dbe6ed;stroke-width:1.6}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="800" height="420" rx="19" fill="url(#bg)"/><text x="24" y="36" class="head">RECOMMENDER SYSTEMS · WORKED EXAMPLE</text><rect x="20" y="62" width="386" height="316" rx="17" class="panel"/><rect x="424" y="62" width="356" height="316" rx="17" class="panel"/><text x="44" y="95" class="head">ALTERNATING FACTOR SOLVES</text><text x="450" y="95" class="head">OBJECTIVE DECREASE</text><text x="45" y="119" class="small">Fix items → update users → fix users → update items</text><text x="44" y="158" class="txt">p1</text><rect x="82" y="140" width="230" height="20" rx="10" fill="#eef3f6"/><rect x="82" y="140" width="69.12" height="20" rx="10" fill="#0b8d86"><animate attributeName="width" values="69.12;168.33;168.33;173.73;173.73;171.66;171.66;171.66;173.73;173.73;168.33;168.33;69.12" keyTimes="0;0.083333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" dur="12s" repeatCount="indefinite"/></rect><text x="44" y="211" class="txt">p2</text><rect x="82" y="193" width="230" height="20" rx="10" fill="#eef3f6"/><rect x="82" y="193" width="103.68" height="20" rx="10" fill="#0b8d86"><animate attributeName="width" values="103.68;143.01;143.01;129.12;129.12;125.84;125.84;125.84;129.12;129.12;143.01;143.01;103.68" keyTimes="0;0.083333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" dur="12s" repeatCount="indefinite"/></rect><text x="44" y="264" class="txt">q1</text><rect x="82" y="246" width="230" height="20" rx="10" fill="#eef3f6"/><rect x="82" y="246" width="86.40" height="20" rx="10" fill="#dd8556"><animate attributeName="width" values="86.40;86.40;121.83;121.83;127.29;127.29;129.49;127.29;127.29;121.83;121.83;86.40;86.40" keyTimes="0;0.083333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" dur="12s" repeatCount="indefinite"/></rect><text x="44" y="317" class="txt">q2</text><rect x="82" y="299" width="230" height="20" rx="10" fill="#eef3f6"/><rect x="82" y="299" width="155.52" height="20" rx="10" fill="#dd8556"><animate attributeName="width" values="155.52;155.52;142.19;142.19;142.48;142.48;144.33;142.48;142.48;142.19;142.19;155.52;155.52" keyTimes="0;0.083333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" dur="12s" repeatCount="indefinite"/></rect><text x="45" y="365" class="small">Exact scalar ridge solves · λ = 0.1</text><path d="M456.00 170.00 L501.00 289.46 L546.00 311.93 L591.00 314.49 L636.00 314.94 L681.00 315.12 L726.00 315.24" fill="none" stroke="#577fad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="456.00" cy="170.00" r="4.5" fill="#dd8556"/><text x="450" y="344" class="small">0</text><circle cx="501.00" cy="289.46" r="4.5" fill="#577fad"/><text x="495" y="344" class="small">U</text><circle cx="546.00" cy="311.93" r="4.5" fill="#577fad"/><text x="540" y="344" class="small">V</text><circle cx="591.00" cy="314.49" r="4.5" fill="#577fad"/><text x="585" y="344" class="small">U</text><circle cx