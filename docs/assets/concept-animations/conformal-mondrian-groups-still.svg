<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">Group-conditional Mondrian calibration</ns0:title><ns0:desc id="desc">Two six-score synthetic calibration groups have separate conformal thresholds 0.60 and 0.85 at alpha 0.25. A hypothetical 0.72 test score is rejected in A but included in B. In motion the second threshold moves from the pooled-like 0.60 reference to its group-specific 0.85 value.</ns0:desc><ns0:style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#224259}.title{font-size:16px;font-weight:750;letter-spacing:.6px}.meta{font-size:11px;fill:#60788d}.rowname{font-size:13px;font-weight:750}.number{font-size:12px;font-weight:700}.small{font-size:10px;fill:#60788d}</ns0:style><ns0:rect width="640" height="360" rx="18" fill="#f2f7fb" /><ns0:text x="28" y="33" class="title">MONDRIAN · GROUP CALIBRATION</ns0:text><ns0:text x="28" y="52" class="meta">SPLIT CONFORMAL  ·  α = 0.25  ·  6 SCORES PER GROUP</ns0:text><ns0:rect x="24" y="68" width="592" height="274" rx="14" fill="#fff" stroke="#dce7ef" />
