<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Leaky rectifier: matching weight gain to negative slope</title><desc id="desc">An analytical sweep of the negative slope from zero to one. With fixed ReLU-scale weights the output second-moment multiplier rises from one to two. Matching the weight variance to the slope keeps the multiplier at one.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203650}.meta{font-size:11px;letter-spacing:1.2px;font-weight:700;fill:#71859a}.small{font-size:12px;fill:#71859a}.bold{font-size:13px;font-weight:650}@media(prefers-reduced-motion:reduce){animateMotion,animate{visibility:hidden}}</style><rect width="640" height="360" rx="18" fill="#f6f9fd"/><text class="meta" x="30" y="34">INITIALISATION · ANALYTIC MODEL</text><text x="30" y="61" font-size="17" font-weight="700">Leaky slope changes moment gain</text><text class="small" x="30" y="80">q(next) / q(input)  ·  symmetric preactivation assumption</text><rect x="25" y="98" width="590" height="218" rx="15" fill="white" stroke="#d9e5ee" stroke-width="1.3"/><line x1="93" y1="255.23" x2="572" y2="255.23" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="79" y="259.2" text-anchor="end" class="small">1</text><line x1="93" y1="198.31" x2="572" y2="198.31" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="79" y="202.3" text-anchor="end" class="small">1.5</text><line x1="93" y1="141.38" x2="572" y2="141.38" stroke="#e6edf4" stroke-dasharray="4 4"/><text x="79" y="145.4" text-anchor="end" class="small">2</text><line x1="93" y1="124" x2="93" y2="281" stroke="#9aacbd"/><line x1="93" y1="281" x2="578" y2="281" stroke="#9aacbd"/><text class="small" x="93.00" y="298" text-anchor="middle">0</text><text class="small" x="212.75" y="298" text-anchor="middle">0.25</text><text class="small" x="332.50" y="298" text-anchor="middle">0.5</text><text class="small" x="452.25" y="298" text-anchor="middle">0.75</text><text class="small" x="572.00" y="298" text-anchor="middle">1</text><text class="small" x="334" y="310" text-anchor="middle">Negative slope a</text><polyline points="93.0,255.2 103.0,255.2 113.0,255.0 122.9,254.8 132.9,254.4 142.9,254.0 152.9,253.5 162.9,252.8 172.8,252.1 182.8,251.2 192.8,250.3 202.8,249.3 212.8,248.1 222.7,246.9 232.7,245.5 242.7,244.1 252.7,242.6 262.6,241.0 272.6,239.2 282.6,237.4 292.6,235.5 302.6,233.4 312.5,231.3 322.5,229.1 332.5,226.8 342.5,224.3 352.5,221.8 362.4,219.2 372.4,216.5 382.4,213.7 392.4,210.8 402.4,207.7 412.3,204.6 422.3,201.4 432.3,198.1 442.3,194.7 452.3,191.2 462.2,187.6 472.2,183.9 482.2,180.1 492.2,176.2 502.1,172.2 512.1,168.1 522.1,163.9 532.1,159.6 542.1,155.2 552.0,150.7 562.0,146.1 572.0,141.4" stroke="#d37d42" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="93" x2="572" y1="255.23" y2="255.23" stroke="#117c85" stroke-width="4"/><rect x="333" y="111" width="11" height="11" rx="3" fill="#d37d42"/><text class="bold" x="351" y="121">Fixed ReLU</text><rect x="455" y="111" width="11" height="11" rx="3" fill="#117c85"/><text class="bold" x="473" y="121">Adjusted</text><circle cx="93" cy="255.23076923076923" r="6" fill="white" stroke="#117c85" stroke-width="2.5"/><circle cx="572" cy="141.3846153846154" r="6" fill="white" stroke="#d37d42" stroke-width="2.5"/><line x1="452.25" x2="452.25" y1="191.1923076923077" y2="278" stroke="#b4c1ce" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="452.25" cy="191.1923076923077" r="7" fill="#d37d42" stroke="white" stroke-width="2"/><circle cx="452.25" cy="255.23076923076923" r="7" fill="#117c85" stroke="white" stroke-width="2"/><text x="31" y="340" class="small">Fixed v = 2/n; adjusted v = 2 / [n (1 + a²)]. Illustrative expectations.</text></svg>