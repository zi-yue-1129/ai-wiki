<svg xmlns="http://www.w3.org/2000/svg" width="420" height="565" viewBox="0 0 420 565" role="img" aria-labelledby="title desc"><title id="title">ICM: sample averages versus expected squared error</title><desc id="desc">Three snapshots after 1, 5 and 20 reproducible draws. A fixed purple expected error is compared with an orange running mean that can move above or below it. Toy values, not model measurements.</desc><rect x="1" y="1" width="418" height="563" rx="19" fill="#f7fafc" stroke="#c7d9e4" stroke-width="2"/><text x="22" y="38" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#203d52">ICM · REPEATED DRAWS</text><text x="22" y="64" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#567083">Same probabilities, different samples</text><rect x="18" y="90" width="384" height="132" rx="12" fill="#ffffff" stroke="#d6e2ea"/><text x="33" y="117" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#29465c">n = 1</text><text x="389" y="117" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#60778a">0 – 6</text><rect x="56" y="139" width="308" height="18" rx="5" fill="#eaf1f6"/><line x1="210.9" x2="210.9" y1="134" y2="163" stroke="#775fb0" stroke-width="3"/><circle cx="222.8" cy="148" r="6" fill="#e19748" stroke="white" stroke-width="2"/><text x="33" y="182" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#775fb0">Expected 3.017</text><text x="389" y="182" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#a66323">Mean 3.250</text><rect x="34" y="195" width="23" height="20" rx="5" fill="#8672b4"/><text x="45.5" y="209" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" fill="white">3</text><rect x="18" y="235" width="384" height="132" rx="12" fill="#ffffff" stroke="#d6e2ea"/><text x="33" y="262" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fil