<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC fixed · precision shifts</title><desc id="desc">Synthetic populations retain TPR 0.80 and FPR 0.10 as positive prevalence varies from 5 to 60 percent. The ROC operating point remains fixed but positive predictive value rises from 29.6 to 92.3 percent.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#22394a}.head{font-size:17px;font-weight:750}.sub{font-size:11px;fill:#567081}.cap{font-size:12px;font-weight:700}.tiny{font-size:10px;fill:#567081}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="24" y="32" class="head">ROC fixed · precision shifts</text><rect x="20" y="55" width="294" height="262" rx="12" fill="#fff" stroke="#d2e0e9"/><rect x="326" y="55" width="294" height="262" rx="12" fill="#fff" stroke="#d2e0e9"/><text x="38" y="77" class="cap">ROC · FIXED</text><text x="343" y="77" class="cap">PRECISION · CHANGES</text><line x1="72" y1="281" x2="267" y2="281" stroke="#819bab" stroke-width="1.5"/><line x1="72" y1="281" x2="72" y2="105" stroke="#819bab" stroke-width="1.5"/><line x1="72" y1="196" x2="267" y2="196" stroke="#e2ebf0"/><line x1="167" y1="105" x2="167" y2="281" stroke="#e2ebf0"/><circle cx="91" cy="145" r="9" fill="#207a92" stroke="white" stroke-width="2"/><line x1="91" y1="145" x2="91" y2="281" stroke="#207a92" stroke-dasharray="3 5"/><line x1="72" y1="145" x2="91" y2="145" stroke="#207a92" stroke-dasharray="3 5"/><text x="94" y="112" class="cap" fill="#207a92">TPR 0.80</text><text x="94" y="130" class="sub">FPR 0.10</text><text x="170" y="303" class="sub" text-anchor="middle">False positive rate</text><text x="55" y="101" class="tiny">TPR</text><line x1="363" y1="271" x2="589" y2="271" stroke="#819bab" stroke-width="1.5"/><