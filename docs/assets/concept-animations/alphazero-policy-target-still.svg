<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">AlphaZero policy improvement: visits become training targets</title><desc id="desc">A hypothetical policy prior of 0.60, 0.30, 0.10 guides a tree search. Its final visit counts 12, 54, 34 become the policy target 0.12, 0.54, 0.34 for temperature one. Numbers are pedagogical, not experimental.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f8fc"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#223e5f" flood-opacity="0.07"/></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif} @media (prefers-reduced-motion:reduce){.motion-only{display:none}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="url(#paper)" stroke="none" stroke-width="1" /><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#d9e4ee" stroke-width="1" /><text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#213b58" >SEARCH → POLICY</text><text x="320" y="65" text-anchor="middle" font-size="16" font-weight="500" fill="#62768c" >τ = 1</text><rect x="20" y="85" width="176" height="240" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="108" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#233f5d" >Prior p</text><rect x="232" y="85" width="176" height="240" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="320" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#233f5d" >Visits N</text><rect x="444" y="85" width="176" height="240" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="532" y="117" text-anchor="middle" font-size="18" font-weight="700" fill="#233f5d" >Target π</text><path d="M33 277H173" stroke="#ced9e5" stroke-width="2"/><rect x="42" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="42" y="160" width="26" height="115" rx="4" fill="#5478d5" stroke="none" stroke-width="1" /><text x="55" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >A</text><rect x="90" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="90" y="217" width="26" height="58" rx="4" fill="#e39b4f" stroke="none" stroke-width="1" /><text x="103" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >B</text><rect x="138" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="138" y="256" width="26" height="19" rx="4" fill="#149f94" stroke="none" stroke-width="1" /><text x="151" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >C</text><path d="M245 277H385" stroke="#ced9e5" stroke-width="2"/><rect x="254" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="254" y="251" width="26" height="24" rx="4" fill="#5478d5" stroke="none" stroke-width="1" /><text x="267" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >A</text><rect x="302" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="302" y="167" width="26" height="108" rx="4" fill="#e39b4f" stroke="none" stroke-width="1" /><text x="315" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >B</text><rect x="350" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-width="1" /><rect x="350" y="207" width="26" height="68" rx="4" fill="#149f94" stroke="none" stroke-width="1" /><text x="363" y="298" text-anchor="600" font-size="16" font-weight="500" fill="#46586f" >C</text><path d="M457 277H597" stroke="#ced9e5" stroke-width="2"/><rect x="466" y="145" width="26" height="130" rx="5" fill="#eff4fa" stroke="none" stroke-