<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">Lagrange multipliers: objective contour meets the feasible set</title><desc id="dsc">A teal point moves along the blue constraint circle while amber objective contours contract. At the constrained minimizer the objective gradient is antiparallel to the outward constraint normal. Illustrative geometry, not model data.</desc><rect width="640" height="360" rx="16" fill="#f6f9fc"/><rect x="15" y="15" width="610" height="330" rx="14" fill="white" stroke="#d6e3ec"/><g font-family="Arial,Helvetica,sans-serif"><text x="35.00" y="46.00" font-size="19" fill="#203a52" font-weight="700" text-anchor="start">Lagrange multipliers</text><text x="35.00" y="65.00" font-size="12" fill="#6c8092" font-weight="400" text-anchor="start">Constraint tangency</text><defs><clipPath id="plot-clip"><rect x="34" y="82" width="400" height="231" rx="12"/></clipPath><marker id="arr-amber" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e39b42" stroke-width="1.4"/></marker><marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#148b87" stroke-width="1.4"/></marker></defs><rect x="34" y="82" width="400" height="231" rx="12" fill="#fbfdff" stroke="#d6e3ec"/><g clip-path="url(#plot-clip)"><line x1="62.00" y1="82.00" x2="62.00" y2="313.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="34.00" y1="98.00" x2="434.00" y2="98.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="146.00" y1="82.00" x2="146.00" y2="313.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="34.00" y1="148.00" x2="434.00" y2="148.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="230.00" y1="82.00" x2="230.00" y2="313.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="34.00" y1="198.00" x2="434.00" y2="198.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="314.00" y1="82.00" x2="314.00" y2="313.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="34.00" y1="248.00" x2="434.00" y2="248.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="398.00" y1="82.00" x2="398.00" y2="313.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><line x1="34.00" y1="298.00" x2="434.00" y2="298.00" stroke="#eff3f7" stroke-width="1" stroke-linecap="round" /><circle cx="225" cy="201" r="80" fill="#eaf4fc" fill-opacity=".40" stroke="#4c84b6" stroke-width="3"/><circle cx="385" cy="121" r="98.89" fill="none" stroke="#e39b42" stroke-width="2.8" stroke-dasharray="6 5" opacity=".9"></circle><circle cx="385" cy="121" r="4" fill="#e39b42"/><circle cx="296.5541752799933" cy="165.22291236000336" r="8" fill="#148b87" stroke="white" stroke-width="2"></circle><line x1="296.55" y1="165.22" x2="335.91" y2="145.55" stroke="#148b87" stroke-width="3.5" marker-end="url(#arr-teal)"></line><line x1="296.55" y1="165.22" x2="253.62" y2="186.69" stroke="#e39b42" stroke-width="3.5" marker-end="url(#arr-amber)"></line><circle cx="296.55" cy="165.22" r="4.2" fill="white" stroke="#148b87" stroke-width="2"/></g><rect x="447" y="82" width="163" height="231" rx="12" fill="#f8fbfd" stroke="#d6e3ec"/><text x="462.00" y="106.00" font-size="11" fill="#6c8092" font-weight="700" text-anchor="start">GEOMETRY</text><line x1="466.00" y1="133.00" x2="500.00" y2="133.00" stroke="#4c84b6" stroke-width="3.4" stroke-linecap="round" /><text x="511.00" y="137.00" font-size="12" fill="#203a52" font-weight="400" text-anchor="start">g(x) = 0</text><line x1="466.00" y1="161.00" x2="500.00" y2="161.00" stroke="#e39b42" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="6 4"/><text x="511.00" y="165.00" font-size="12" fill="#203a52" font-weight="400" text-anchor="start">f contours</text><line x1="466.00" y1="193.00" x2="500.00" y2="193.