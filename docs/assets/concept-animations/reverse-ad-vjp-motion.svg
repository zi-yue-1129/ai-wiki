<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Reverse-mode AD: adjoint accumulation</title><desc id="desc">Evaluate values, seed the output adjoint, propagate backwards, and sum gradients at shared inputs. Four-stage original educational example, not model measurements.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a5b4c4" stroke-width="1.3"/></marker><marker id="ahead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#d97728" stroke-width="1.6"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#d97728" stroke-width="1.6"/></marker></defs><rect width="640" height="360" rx="16" fill="#f7f9fc"/><rect x="16" y="15" width="608" height="329" rx="14" fill="#fff" stroke="#e1e8f1"/><text x="34" y="45" font-size="19" font-weight="700" fill="#24364b" font-family="Arial,Helvetica,sans-serif">Reverse-mode AD</text><text x="34" y="63" font-size="12" fill="#738399" font-family="Arial,Helvetica,sans-serif">f(x, y) = xy + 2x  (x = 2, y = 3)</text><g stroke="#b3c0ce" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M 160 117 L 261 117" marker-end="url(#arrow)"/><path d="M 160 247 C 198 230 225 154 261 132" marker-end="url(#arrow)"/><path d="M 160 131 C 198 151 227 222 261 239" marker-end="url(#arrow)"/><path d="M 361 118 C 416 123 453 159 483 175" marker-end="url(#arrow)"/><path d="M 361 246 C 416 239 453 209 483 195" marker-end="url(#arrow)"/></g><g font-family="Arial,Helvetica,sans-serif"><rect x="65" y="79" width="94" height="74" rx="12" fill="#f9fbfe" stroke="#cbd6e4" stroke-width="1.5"/><text x="112" y="110" font-size="17" font-weight="700" text-anchor="middle" fill="#24364b">x = 2</text><text x="112" y="126" font-size="12" text-anchor="middle" fill="#75859a">input</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="65" y="214" width="94" height="74" rx="12" fill="#f9fbfe" stroke="#cbd6e4" stroke-width="1.5"/><text x="112" y="245" font-size="17" font-weight="700" text-anchor="middle" fill="#24364b">y = 3</text><text x="112" y="261" font-size="12" text-anchor="middle" fill="#75859a">input</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="266" y="79" width="94" height="74" rx="12" fill="#f9fbfe" stroke="#cbd6e4" stroke-width="1.5"/><text x="313" y="110" font-size="17" font-weight="700" text-anchor="middle" fill="#24364b">a = 6</text><text x="313" y="126" font-size="12" text-anchor="middle" fill="#75859a">x · y</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="266" y="214" width="94" height="74" rx="12" fill="#f9fbfe" stroke="#cbd6e4" stroke-width="1.5"/><text x="313" y="245" font-size="17" font-weight="700" text-anchor="middle" fill="#24364b">b = 4</text><text x="313" y="261" font-size="12" text-anchor="middle" fill="#75859a">x + x</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="483" y="148" width="94" height="74" rx="12" fill="#f0f4ff" stroke="#9badde" stroke-width="1.5"/><text x="530" y="179" font-size="17" font-weight="700" text-anchor="middle" fill="#24364b">z = 10</text><text x="530" y="195" font-size="12" text-anchor="middle" fill="#75859a">a + b</text></g><g font-family="Arial,Helvetica,sans-serif" opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><rect x="396" y="25" width="204" height="38" rx="10" fill="#d97728" fill-opacity="0.09"/><text x="409" y="41" font-size="12" font-weight="700" fill="#d97728">PRIMAL</text><text x="409" y="56" font-size="11" fill="#4f647a">Record intermediate values</text></g><g font-family="Arial,Helvetica,sans-serif" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><rect x="396" y="25" width="204" height="38" rx="10" fill="#d97728" fill-opacity="0.09"/><text x="409" y="41" font-size="12" font-weight="700" fill="#d97728">SEED</text><text x="409" y="56" font-size="11" fill="#4f647a">Output adjoint = 1</text><rect x="479" y="144" width="102" height="82" rx="15" fill="none" stroke="#d97728" stroke-width="3"/><text x="530" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text></g><g font-family="Arial,Helvetica,sans-serif" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><rect x="396" y="25" width="204" height="38" rx="10" fill="#d97728" fill-opacity="0.09"/><text x="409" y="41" font-size="12" font-weight="700" fill="#d97728">BACKWARD</text><text x="409" y="56" font-size="11" fill="#4f647a">Split sensitivity</text><path d="M 361 118 C 416 123 453 159 483 175" fill="none" stroke="#d97728" stroke-width="4.5" stroke-linecap="round" marker-start="url(#back)"/><path d="M 361 246 C 416 239 453 209 483 195" fill="none" stroke="#d97728" stroke-width="4.5" stroke-linecap="round" marker-start="url(#back)"/><rect x="262" y="75" width="102" height="82" rx="15" fill="none" stroke="#d97728" stroke-width="3"/><rect x="262" y="210" width="102" height="82" rx="15" fill="none" stroke="#d97728" stroke-width="3"/><text x="530" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text><text x="313" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text><text x="313" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text></g><g font-family="Arial,Helvetica,sans-serif" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="8s" repeatCount="indefinite"/><rect x="396" y="25" width="204" height="38" rx="10" fill="#d97728" fill-opacity="0.09"/><text x="409" y="41" font-size="12" font-weight="700" fill="#d97728">ACCUMULATE</text><text x="409" y="56" font-size="11" fill="#4f647a">Sum contributions at x</text><path d="M 160 117 L 261 117" fill="none" stroke="#d97728" stroke-width="4.5" stroke-linecap="round" marker-start="url(#back)"/><path d="M 160 247 C 198 230 225 154 261 132" fill="none" stroke="#d97728" stroke-width="4.5" stroke-linecap="round" marker-start="url(#back)"/><path d="M 160 131 C 198 151 227 222 261 239" fill="none" stroke="#d97728" stroke-width="4.5" stroke-linecap="round" marker-start="url(#back)"/><rect x="61" y="75" width="102" height="82" rx="15" fill="none" stroke="#d97728" stroke-width="3"/><rect x="61" y="210" width="102" height="82" rx="15" fill="none" stroke="#d97728" stroke-width="3"/><text x="530" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text><text x="313" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text><text x="313" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 1</text><text x="112" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 5</text><text x="112" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#d97728">adj = 2</text><rect x="418" y="270" width="185" height="38" rx="11" fill="#d97728"/><text x="510" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">grad = (5, 2)</text></g><g font-family="Arial,Helvetica,sans-serif"><text x="33" y="333" font-size="11" fill="#8995a7">Illustrative arithmetic · not model measurements</text></g></svg>