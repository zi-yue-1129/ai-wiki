<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Shared gradient norm clipping versus per-layer clipping</title><desc id="desc">Two scalar layer gradient norms: gA=4 and gB=3s. As gB grows, a shared global L2 cap of four rescales both layers, reducing the output for A; separate per-layer caps of four leave both unchanged even though their combined norm becomes five. Synthetic mathematical parameter sweep, not measured training gradients.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" fill="#f5f9fc" rx="18"></rect><text x="30" y="43" fill="#1b354d" font-size="23" font-weight="750">GLOBAL vs PER-LAYER CLIPPING</text><text x="30" y="66" fill="#647c90" font-size="12.5" font-weight="500">Two layer-gradient groups · g₁ = 4, g₂ = 3s · 0 ≤ s ≤ 1</text><rect x="22" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="43" y="123" fill="#1b354d" font-size="16" font-weight="750">ONE SHARED L₂ BUDGET</text><rect x="408" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="429" y="123" fill="#1b354d" font-size="16" font-weight="750">TWO INDEPENDENT CAPS</text><line x1="161" y1="171" x2="161" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="288" x2="343" y2="288" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="200" y1="171" x2="200" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="249" x2="343" y2="249" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="239" y1="171" x2="239" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><l