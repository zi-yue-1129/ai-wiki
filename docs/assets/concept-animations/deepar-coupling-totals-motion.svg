<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Dependence changes totals</title><desc id="desc">Mixture of joint and independent draws preserves both marginals. Sum probabilities change from uniform quarters to eighths and three eighths; variance decreases from five to three.</desc><rect width="640" height="360" fill="#ffffff"/><text x="24" y="31" font-size="23" fill="#23354a" text-anchor="start">Dependence changes totals</text><line x1="24" y1="43" x2="616" y2="43" stroke="#dce4ed" /><text x="30" y="69" font-size="18" fill="#23354a" text-anchor="start">P(path sum)</text><text x="430" y="69" font-size="18" fill="#23354a" text-anchor="start">Fixed marginals</text><line x1="80" y1="94" x2="80" y2="251" stroke="#dce4ed" /><text x="80" y="271" font-size="16" fill="#23354a" text-anchor="middle">3</text><rect x="56" width="48" fill="#08766f" rx="3" y="201" height="50"><animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="201;201;226;226;201"/><animate attributeName="height" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="50;50;25;25;50"/></rect><rect x="56" y="201" width="48" height="50" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><line x1="168" y1="94" x2="168" y2="251" stroke="#dce4ed" /><text x="168" y="271" font-size="16" fill="#23354a" text-anchor="middle">5</text><rect x="144" width="48" fill="#08766f" rx="3" y="201" height="50"><animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="201;201;176;176;201"/><animate attributeName="height" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="50;50;75;75;50"/></rect><rect x="144" y="201" width="48" height="50" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><line x1="256" y1="94" x2="256" y2="251" stroke="#dce4ed" /><text x="256" y="271" font-size="16" fill="#23354a" text-anchor="middle">7</text><rect x="232" width="48" fill="#08766f" rx="3" y="201" height="50"><animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="201;201;176;176;201"/><animate attributeName="height" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="50;50;75;75;50"/></rect><rect x="232" y="201" width="48" height="50" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><line x1="344" y1="94" x2="344" y2="251" stroke="#dce4ed" /><text x="344" y="271" font-size="16" fill="#23354a" text-anchor="middle">9</text><rect x="320" width="48" fill="#08766f" rx="3" y="201" height="50"><animate attributeName="y" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="201;201;226;226;201"/><animate attributeName="height" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="50;50;25;25;50"/></rect><rect x="320" y="201" width="48" height="50" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><text x="47" y="256" font-size="13" fill="#23354a" text-anchor="end">0%</text><line x1="53" y1="251" x2="388" y2="251" stroke="#dce4ed" /><text x="47" y="206" font-size="13" fill="#23354a" text-anchor="end">25%</text><line x1="53" y1="201" x2="388" y2="201" stroke="#dce4ed" /><text x="47" y="156" font-size="13" fill="#23354a" text-anchor="end">50%</text><line x1="53" y1="151" x2="388" y2="151" stroke="#dce4ed" /><line x1="53" y1="251" x2="388" y2="251" stroke="#23354a" /><text x="220" y="294" font-size="16" fill="#23354a" text-anchor="middle">Path sum</text><rect x="32" y="312" width="18" height="13" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="5 3"/><text x="57" y="324" font-size="15" fill="#23354a" text-anchor="start">Joint</text><rect x="143" y="312" width="18" height="13" fill="#08766f" /><text x="168" y="324" font-size="15" fill="#23354a" text-anchor="start">Current mixture</text><line x1="406" y1="56" x2="406" y2="334" stroke="#dce4ed" /><text x="430" y="101" font-size="18" fill="#23354a" text-anchor="start">Z₁: 2, 4</text><text x="430" y="126" font-size="16" fill="#315c85" text-anchor="start">½, ½</text><text x="430" y="156" font-size="18" fill="#23354a" text-anchor="start">Z₂: 1, 3, 5</text><text x="430" y="181" font-size="16" fill="#315c85" text-anchor="start">¼, ½, ¼</text><text x="430" y="222" font-size="18" fill="#23354a" text-anchor="start">Var(sum)</text><rect x="430" y="233" width="150" height="17" fill="#f1f5f9" rx="3"/><rect x="430" y="233" height="17" rx="3" fill="#08766f" width="150"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.15;0.55;0.75;1" values="150;150;90;90;150"/></rect><text x="430" y="272" font-size="15" fill="#23354a" text-anchor="start">0</text><text x="520" y="272" font-size="15" fill="#23354a" text-anchor="middle">3</text><text x="580" y="272" font-size="15" fill="#23354a" text-anchor="end">5</text><line x1="520" y1="252" x2="520" y2="259" stroke="#23354a" /><line x1="580" y1="252" x2="580" y2="259" stroke="#23354a" /><text x="430" y="305" font-size="15" fill="#23354a" text-anchor="start">Joint → independent</text><text x="430" y="329" font-size="20" fill="#08766f" text-anchor="start">5 → 3</text></svg>
