<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FaceNet threshold and acceptance rates</title><desc id="desc">A threshold sweeps across four same-identity and four different-identity squared distances. True and false acceptance rates increase as observations become accepted. Static view at threshold 0.65.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="8" fill="#f1f6fa" stroke="none"/><text x="24" y="29" font-size="19" fill="#233b52" text-anchor="start">FaceNet · verification threshold</text><rect x="18" y="45" width="604" height="178" rx="8" fill="white" stroke="#d6e1e8"/><rect x="18" y="235" width="604" height="106" rx="8" fill="white" stroke="#d6e1e8"/><text x="35" y="70" font-size="15" fill="#21678d" text-anchor="start">Same identity</text><text x="35" y="132" font-size="15" fill="#a95516" text-anchor="start">Different identity</text><text x="605" y="70" font-size="14" fill="#087d70" text-anchor="end">Accept ≤ δ</text><line x1="80" x2="560" y1="101" y2="101" stroke="#b9c9d8"/><line x1="80" x2="560" y1="162" y2="162" stroke="#b9c9d8"/><text x="80" y="201" font-size="14" fill="#233b52" text-anchor="middle">0.0</text><text x="176" y="201" font-size="14" fill="#233b52" text-anchor="middle">0.2</text><text x="272" y="201" font-size="14" fill="#233b52" text-anchor="middle">0.4</text><text x="368" y="201" font-size="14" fill="#233b52" text-anchor="middle">0.6</text><text x="464" y="201" font-size="14" fill="#233b52" text-anchor="middle">0.8</text><text x="560" y="201" font-size="14" fill="#233b52" text-anchor="middle">1.0</text><text x="320" y="218" font-size="14" fill="#233b52" text-anchor="middle">Squared distance</text><text x="35" y="267" font-size="16" fill="#21678d" text-anchor="start">TAR</text><text x="35" y="312" font-size="16" fill="#a95516" text-anchor="start">FAR</text><rect x="102" y="250" width="440" height="21" rx="3" fill="#e4edf2" stroke="none"/><rect x="102" y="295" width="440" height="21" rx="3" fill="#e4edf2" stroke="none"/><text x="102" y="334" font-size="13" fill="#233b52" text-anchor="start">0%</text><text x="542" y="334" font-size="13" fill="#233b52" text-anchor="end">100%</text><g class="motion"><rect x="80" y="82" width="0" height="38" fill="#087d70" opacity=".12"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="0;480;480;0"/></rect><rect x="80" y="143" width="0" height="38" fill="#087d70" opacity=".12"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="0;480;480;0"/></rect><circle cx="128" cy="101" r="8" fill="#21678d" stroke="white" stroke-width="2"/><circle cx="224" cy="101" r="8" fill="#21678d" stroke="white" stroke-width="2"/><circle cx="320" cy="101" r="8" fill="#21678d" stroke="white" stroke-width="2"/><circle cx="416" cy="101" r="8" fill="#21678d" stroke="white" stroke-width="2"/><rect x="265" y="155" width="14" height="14" rx="2" fill="#a95516" stroke="white" stroke-width="2"/><rect x="361" y="155" width="14" height="14" rx="2" fill="#a95516" stroke="white" stroke-width="2"/><rect x="457" y="155" width="14" height="14" rx="2" fill="#a95516" stroke="white" stroke-width="2"/><rect x="505" y="155" width="14" height="14" rx="2" fill="#a95516" stroke="white" stroke-width="2"/><line id="threshold0" x1="80" x2="80" y1="82" y2="120" stroke="#087d70" stroke-width="2.5" stroke-dasharray="5 3"><animate attributeName="x1" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="80;560;560;80"/><animate attributeName="x2" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="80;560;560;80"/></line><line id="threshold1" x1="80" x2="80" y1="143" y2="181" stroke="#087d70" stroke-width="2.5" stroke-dasharray="5 3"><animate attributeName="x1" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="80;560;560;80"/><animate attributeName="x2" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8333333333333334;0.999999;1" values="80;560;560;80"/></line><rect id="tar" x="102" y="250" width="0" height="21" rx="3" fill="#21678d"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08333333333333333;0.25;0.4166666666666667;0.5833333333333334;1" values="0;110;220;330;440;0"/></rect><rect id="far" x="102" y="295" width="0" height="21" rx="3" fill="#a95516"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333333333333333;0.5;0.6666666666666666;0.75;1" values="0;110;220;330;440;0"/></rect><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08333333333333333;0.25;0.4166666666666667;0.5833333333333334;1" values="1;0;0;0;0;1"/><text x="550" y="266" font-size="14" fill="#21678d" text-anchor="start">0%</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08333333333333333;0.25;0.4166666666666667;0.5833333333333334;1" values="0;1;0;0;0;0"/><text x="550" y="266" font-size="14" fill="#21678d" text-anchor="start">25%</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08333333333333333;0.25;0.4166666666666667;0.5833333333333334;1" values="0;0;1;0;0;0"/><text x="550" y="266" font-size="14" fill="#21678d" text-anchor="start">50%</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.08333333