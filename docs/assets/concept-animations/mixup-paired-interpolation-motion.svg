<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">MIXUP · PAIRED INTERPOLATION</title><desc id="d">A single mixing coefficient moves the input along the line between two observations and applies the same weights to class targets.</desc><rect width="640" height="360" rx="18" fill="#f7f9fc"/><text x="34" y="40" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#152438">MIXUP · PAIRED INTERPOLATION</text><line x1="34" x2="606" y1="55" y2="55" stroke="#e8eff5" stroke-width="2"/><rect x="32" y="73" width="292" height="244" rx="8" fill="#fff" stroke="#e8eff5" stroke-width="1.5"/><rect x="338" y="73" width="270" height="244" rx="8" fill="#fff" stroke="#e8eff5" stroke-width="1.5"/><text x="169" y="100" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#607089">INPUT SPACE</text><text x="357" y="100" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#607089">SOFT TARGET</text><path d="M95 115 V270 H278" fill="none" stroke="#607089" stroke-width="1.6"/><path d="M95 95 L265 270" fill="none" stroke="#e8eff5" stroke-width="6" stroke-linecap="round"/><text x="277" y="290" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#607089">x₁</text><text x="78" y="137" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#607089">x₂</text><circle cx="95" cy="95" r="9" fill="#e98a20" stroke="white" stroke-width="2"/><circle cx="265" cy="270" r="9" fill="#008f86" stroke="white" stroke-width="2"/><text x="113" y="113" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e98a20">B</text><text x="277" y="259" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#008f86">A</text><circle cx="180" cy="182.5" r="14" fill="#7154b7" stroke="white" stroke-width="3"><animate attributeName="cx" values="180;265;95;180" keyTimes="0;0.33;0.67;1" dur="12s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="182.5;270;95;182.5" keyTimes="0;0.33;0.67;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><text x="357" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#008f86">Class A</text><text x="357" y="222" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#e98a20">Class B</text><rect x="357" y="153" width="220" height="25" rx="6" fill="#e8f6f3" stroke="#e8f6f3" stroke-width="1.5"/><rect x="357" y="235" width="220" height="25" rx="6" fill="#fff1df" stroke="#fff1df" stroke-width="1.5"/><rect x="357" y="153" width="110" height="25" rx="6" fill="#008f86"><animate attributeName="width" values="110;220;0;110" keyTimes="0;0.33;0.67;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></rect><rect x="357" y="235" width="110" height="25" rx="6" fill="#e98a20"><animate attributeName="width" values="110;0;220;110" keyTimes="0;0.33;0.67;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></rect><text x="357" y="289" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#152438">λ</text><text x="383" y="289" font-family="Arial,sans-serif" font-size="11" font-weight="500" text-anchor="start" fill="#607089">0</text><text x="581" y="289" font-family="Arial,sans-serif" font-size="11" font-weight="500" text-anchor="end" fill="#607089">1</text><path d="M395 286 H563" stroke="#e8eff5" stroke-width="4" stroke-linecap="round"/><circle cx="479" cy="286" r="7" stroke="white" stroke-width="2" fill="#7154b7"><animate attributeName="cx" values="479;563;395;479" keyTimes="0;0.33;0.67;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></circle><text x="37" y="343" font-family="Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#607089">Same λ for inputs and labels</text></svg>