<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">HMM filtering versus smoothing with future evidence</title><desc id="desc">For the same synthetic two-state, three-observation HMM, filtering uses observations so far. The backward message moves from third observation to first, updating marginal A probabilities to 0.733, 0.317, and 0.622. This is not model training data.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.dim{fill:#64748b}.strong{fill:#172b4d}.bold{font-weight:700}.light{font-size:13px}.small{font-size:12px}.cap{font-size:20px;font-weight:700;fill:#172b4d}@media(prefers-reduced-motion:reduce){.packet{display:none!important}.timed{opacity:1!important}}</style><rect width="800" height="420" rx="18" fill="#f8fbfe"/><rect x="1" y="1" width="798" height="418" rx="17" fill="none" stroke="#d4e1ed"/><text class="cap" x="32" y="38">Filtering vs smoothing</text><text class="dim light" x="32" y="61">Future evidence revises earlier beliefs</text><rect x="593" y="21" width="18" height="12" rx="3" fill="#098d90"/><text x="618" y="32" class="dim light">A</text><rect x="660" y="21" width="18" height="12" rx="3" fill="#efad53"/><text x="685" y="32" class="dim light">B</text><rect x="36" y="92" width="232" height="278" rx="14" fill="#fff" stroke="#d7e3ee"/><text x="152" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#20354d">t1</text><text class="dim light" x="60" y="139">Filter</text><rect x="60" y="169" width="184" height="24" rx="6" fill="#efad53"/><rect x="60" y="169" width="147.200" height="24" rx="6" fill="#098d90"></rect><text x="60" y="161" font-size="14" font-weight="700" fill="#17636a">A 80.0%</text><text class="dim light" x="60" y="241">Smooth</text><rect x="60" y="271" width="184" height="24" rx="6" fill="#efad53"/><rect x="60" y="271" width="147.200" height="24" rx="6" fill="#098d90"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.5833;0.6667;0.98;1" values="147.200;147.200;134.806;134.806;147.200"/></rect><text x="60" y="263" font-size="14" font-weight="700" fill="#17636a">A 80.0%<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5833;0.6667;0.98;1" dur="12s" repeatCount="indefinite"/></text><text x="60" y="263" opacity="0" font-size="14" font-weight="700" fill="#17636a">A 73.3%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5833;0.6667;0.98;1" dur="12s" repeatCount="indefinite"/></text><rect x="284" y="92" width="232" height="278" rx="14" fill="#fff" stroke="#d7e3ee"/><text x="400" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#20354d">t2</text><text class="dim light" x="308" y="139">Filter</text><rect x="308" y="169" width="184" height="24" rx="6" fill="#efad53"/><rect x="308" y="169" width="52.106" height="24" rx="6" fill="#098d90"></rect><text x="308" y="161" font-size="14" font-weight="700" fill="#17636a">A 28.3%</text><text class="dim light" x="308" y="241">Smooth</text><rect x="308" y="271" width="184" height="24" rx="6" fill="#efad53"/><rect x="308" y="271" width="52.106" height="24" rx="6" fill="#098d90"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.3333;0.4167;0.98;1" values="52.106;52.106;58.269;58.269;52.106"/></rect><text x="308" y="263" font-size="14" font-weight="700" fill="#17636a">A 28.3%<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3333;0.4167;0.98;1" dur="12s" repeatCount="indefinite"/></text><text x="308" y="263" opacity="0" font-size="14" font-weight="700" fill="#17636a">A 31.7%<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3333;0.4167;0.98;1" dur="12s" repeatCount="indefinite"/></text><rect x="532" y="92" width="232" height="278" rx="14" fill="#fff" stroke="#d7e3ee"/><text x="648" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#20354d">t3</text><text class="dim light" x="556" y="139">Filter</text><rect x="556" y="169" width="184" height="24" rx="6" fill="#efad53"/><rect x="556" y="169" width="114.507" height="24" rx="6" fill="#098d90"></rect><text x="556" y="161" font-size="14" font-weight="700" fill="#17636a">A 62.2%</text><text class="dim light" x="556" y="241">Smooth</text><rect x="556" y="271" width="184" height="24" rx="6" fill="#efad53"/><rect x="556" y="271" width="114.507" height="24" rx="6" fill="#098d90"></rect><text x="556" y="263" font-size="14" font-weight="700" fill="#17636a">A 62.2%</text><path d="M 700 390 L 90 390" stroke="#88aacb" stroke-width="2" stroke-dasharray="5 6" fill="none"/><text x="400" y="411" text-anchor="middle" class="dim light">Backward evidence</text><circle r="9" cy="390" cx="0" fill="#2966a3" opacity="0"><animateMotion path="M 700 0 L 90 0" dur="12s" repeatCount="indefinite" keyTimes="0;0.16;0.67;1" keyPoints="0;0;1;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.15;0.17;0.67;0.69;1" dur="12s" repeatCount="indefinite"/></circle></svg>