<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Clipping before and after gradient accumulation do not commute</title><desc id="desc">For two synthetic microbatch gradients g1=(4,0) and g2=(0,2), and global L2 cap tau=2, averaging the individually clipped gradients gives (1,1). Clipping the mean gradient (2,1) gives approximately (1.789,0.894). During the animation the second gradient is scaled continuously from 0 to 2. These curves are counterfactual mathematical choices and not a training-time sequence.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" /><text x="32" y="43" fill="#1b354d" font-size="23" font-weight="750" >CLIPPING ORDER MATTERS</text><text x="32" y="65" fill="#647c90" font-size="13" font-weight="500" >Average first, or clip each gradient first?</text><rect x="22" y="83" width="362" height="305" rx="15" fill="#ffffff" stroke="#dbe7ef"/><text x="44" y="115" fill="#1b354d" font-size="15" font-weight="700" >CLIP EACH → MEAN</text><text x="44" y="140" fill="#647c90" font-size="12" font-weight="600" >g₁ = (4, 0)   g₂ = (0, 2)</text><line x1="106" y1="146" x2="106" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="186" y1="146" x2="186" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="66" y1="146" x2="66" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="226" y1="146" x2="226" y2="268" stroke="#eff3f6" stroke-width="1" stroke-linecap="round" /><line x1="40" y1="249" x2="354" y2="249" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><line x1="146" y1="261" x2="146" y2="154" stroke="#8298a7" stroke-width="1.3" stroke-linecap="round" /><circl