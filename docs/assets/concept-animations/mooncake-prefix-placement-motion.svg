<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Mooncake: cache-aware placement</title><desc id="desc">Two hypothetical placements with three versus two cached blocks. Serial queue, transfer and remaining prefill costs total ten versus seven time units; the shorter prefix wins. Not a measured trace.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.reveal{opacity:1!important}.cursor{display:none}.animated{display:none}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc"/><text x="24" y="32" font-size="19" fill="#24465b" text-anchor="start" font-weight="750">PREFIX HIT ≠ FASTEST FINISH</text><text x="24" y="55" font-size="14" fill="#5c7889" text-anchor="start" font-weight="500">Estimated serial cost</text><path d="M176 77L176 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="176" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">0</text><path d="M246 77L246 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="246" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">2</text><path d="M316 77L316 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="316" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">4</text><path d="M386 77L386 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="386" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">6</text><path d="M456 77L456 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="456" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">8</text><path d="M526 77L526 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="526" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">10</text><path d="M596 77L596 270" stroke="#d9e4eb" stroke-width="1" fill="none"/><text x="596" y="285" font-size="12" fill="#5c7889" text-anchor="middle" font-weight="500">12</text><text x="24" y="106" font-size="16" fill="#24465b" text-anchor="start" font-weight="750">Node A</text><rect x="24" y="120" width="23" height="24" rx="4" fill="#427eae"/><rect x="52" y="120" width="23" height="24" rx="4" fill="#427eae"/><rect x="80" y="120" width="23" height="24" rx="4" fill="#427eae"/><rect x="108" y="120" width="23" height="24" rx="4" fill="#dbe5ed"/><text x="24" y="164" font-size="13" fill="#5c7889" text-anchor="start" font-weight="500">3/4 cached</text><g class="reveal" opacity="1"><text x="535" y="137" font-size="14" fill="#24465b" text-anchor="start" font-weight="750">=10</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.66667;.9999;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><text x="24" y="201" font-size="16" fill="#24465b" text-anchor="start" font-weight="750">Node B</text><rect x="24" y="215" width="23" height="24" rx="4" fill="#427eae"/><rect x="52" y="215" width="23" height="24" rx="4" fill="#427eae"/><rect x="80" y="215" width="23" height="24" rx="4" fill="#dbe5ed"/><rect x="108" y="215" width="23" height="24" rx="4" fill="#dbe5ed"/><text x="24" y="259" font-size="13" fill="#5c7889" text-anchor="start" font-weight="500">2/4 cached</text><g class="reveal" opacity="1"><text x="430" y="232" font-size="14" fill="#168b82" text-anchor="start" font-weight="750">=7</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.46667;.9999;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><defs><clipPath id="sweep"><rect x="176" y="95" width="420" height="155"><animate attributeName="width" values="0;420;420;0" keyTimes="0;.8;.9999;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect></clipPath></defs><g class="animated" clip-path="url(#sweep)"><g data-node="A" data-kind="queue" data-duration="5"><rect x="176" y="115" width="175" height="34" rx="3" fill="