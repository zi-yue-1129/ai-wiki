<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC randomized mixture of two operating decisions</title><desc id="desc">Two illustrative operating rules have (FPR,TPR) equal to A (0.10,0.60) and B (0.40,0.90). Mixing independently between their decisions moves expected rates continuously along the chord. The fifty-fifty mixture has FPR 0.25 and TPR 0.75. Not an empirical ROC experiment.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#eaf3f8"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#233e54}.title{font-size:18px;font-weight:750}.section{font-size:12px;font-weight:800;letter-spacing:.5px}.small{font-size:11px;font-weight:600;fill:#586e7e}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="15" fill="url(#wash)"/><text x="24" y="33" class="title" >ROC · RANDOMIZED OPERATING RULES</text><text x="24" y="51" class="small" >Mix two policies · expected rates interpolate</text><rect x="22" y="68" width="323" height="245" rx="10" fill="white" stroke="#d8e4eb"/><rect x="356" y="68" width="262" height="245" rx="10" fill="white" stroke="#d8e4eb"/><text x="42" y="93" class="section" >ROC SPACE</text><text x="372" y="93" class="section" >CONDITIONAL RATES</text><line x1="66" y1="112" x2="66" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="281" x2="311" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="127.25" y1="112" x2="127.25" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="238.75" x2="311" y2="238.75" stroke="#e8eef2" stroke-width="0.9" /><line x1="188.5" y1="112" x2="188.5" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="196.5" x2="311" y2="196.5" stroke="#e8eef2" stroke-width="0.9" /><line x1="249.75" y1="112" x2="249.75" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="154.25" x2="311" y2="154.25" stroke="#e8eef2" stroke-width="0.9" /><line x1="311" y1="112" x2="311" y2="281" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="112" x2="311" y2="112" stroke="#e8eef2" stroke-width="0.9" /><line x1="66" y1="281" x2="311" y2="281" stroke="#89a4b4" stroke-width="1.5" /><line x1="66" y1="112" x2="66" y2="281" stroke="#89a4b4" stroke-width="1.5" /><text x="190" y="301" class="small" text-anchor="middle">FPR</text><text x="45" y="125" class="small" >TPR</text><path d="M90.5,179.6 L164.0,128.9" stroke="#436fb9" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="90.5" cy="179.6" r="6" fill="#188b85" stroke="white" stroke-width="2"/><text x="88.5" y="203.6" class="section" >A</text><circle cx="164.0" cy="128.9" r="6" fill="#e28b59" stroke="white" stroke-width="2"/><text x="174.0" y="118.9" class="section" >B</text><g class="moving"><line x1="90.5" y1="179.6" x2="90.5" y2="281" stroke="#729bbd" stroke-dasharray="3 4"><animate attributeName="x1" values="90.5;164.0;90.5" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="90.5;164.0;90.5" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y1" values="179.6;128.9;179.6" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></line><line x1="66" y1="179.6" x2="90.5" y2="179.6" stroke="#729bbd" stroke-dasharray="3 4"><animate attributeName="x2" values="90.5;164.0;90.5" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y1" values="179.6;128.9;179.6" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y2" values="179.6;128.9;179.6" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></line><circle cx="90.5" cy="179.6" r="8" fill="#436fb9" stroke="white" stroke-width="2"><animate attributeName="cx" values="90.5;164.0;90.5" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="179.6;128.9;179.6" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><line x1="127.25" y1="154.25" x2="127.25" y2="281" stroke="#729bbd" stroke-width="1" stroke-dasharray="3 4"/><line x1="66" y1="154.25" x2="127.25" y2="154.25" stroke="#729bbd" stroke-width="1" stroke-dasharray="3 4"/><circle cx="127.3" cy="154.3" r="8" fill="#436fb9" stroke="white" stroke-width="2"/></g><text x="374" y="133" class="section" >TPR</text><rect x="374" y="146" width="217" height="15" rx="7" fill="#e4edf2"/><g class="moving"><rect x="374" y="146" width="130.2" height="15" rx="7" fill="#188b85"><animate attributeName="width" values="130.2;195.3;130.2" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="still"><rect x="374" y="146" width="162.8" height="15" rx="7" fill="#188b85"/></g><text x="374" y="183" class="small" >A 0.60</text><text x="589" y="183" class="small" text-anchor="end">B 0.90</text><text x="374" y="202" class="section" >FPR</text><rect x="374" y="215" width="217" height="15" rx="7" fill="#e4edf2"/><g class="moving"><rect x="374" y="215" width="21.7" height="15" rx="7" fill="#e28b59"><animate attributeName="width" values="21.7;86.8;21.7" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></rect></g><g class="still"><rect x="374" y="215" width="54.3" height="15" rx="7" fill="#e28b59"/></g><text x="374" y="252" class="small" >A 0.10</text><text x="589" y="252" class="small" text-anchor="end">B 0.40</text><text x="374" y="290" class="small" >MIDPOINT λ=.5: FPR .25, TPR .75</text><text x="24" y="347" class="small" >SCHEMATIC RATES · MIXTURE IS OVER RANDOMIZED DECISIONS</text></svg>