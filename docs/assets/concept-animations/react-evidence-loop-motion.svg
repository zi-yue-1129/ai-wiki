<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ReAct evidence-fed thought/action loop</title><desc id="desc">Two schematic cycles illustrate how search observations are appended and influence the following thought before a final answer. The example is an invented trace, not model-generated reasoning.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" /><stop offset="1" stop-color="#edf5f9" /></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#8fa7b6" stroke-width="1.7" fill="none" /></marker></defs><rect width="640" height="360" fill="url(#bg)" /><text x="26" y="34" text-anchor="start" fill="#193449" font-size="22" font-weight="750" font-family="Arial,Helvetica,sans-serif">ReAct</text><text x="26" y="55" text-anchor="start" fill="#647e91" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Thought → Action → Observation → Thought</text><rect x="23" y="72" width="594" height="248" rx="18" fill="#f8fbfd" stroke="#d7e4eb" /><path d="M196 153 H238" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M398 153 H442" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M524 160 V183 H44 V224" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M196 285 H238" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M398 285 H442" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><path d="M524 292 V314 H564 V324" fill="none" stroke="#8fa7b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" /><rect x="36" y="92" width="160" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="36" y="92" width="5" height="68" rx="2.5" fill="#286fbc" /><text x="53" y="117" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">THOUGHT 1</text><text x="53" y="139" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Plan search</text><rect x="240" y="92" width="158" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="240" y="92" width="5" height="68" rx="2.5" fill="#d58a31" /><text x="257" y="117" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTION 1</text><text x="257" y="139" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Search</text><rect x="444" y="92" width="160" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="444" y="92" width="5" height="68" rx="2.5" fill="#0c8d80" /><text x="461" y="117" text-anchor="start" fill="#0c8d80" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">OBSERVATION 1</text><text x="461" y="139" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Evidence A</text><rect x="36" y="224" width="160" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="36" y="224" width="5" height="68" rx="2.5" fill="#286fbc" /><text x="53" y="249" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">THOUGHT 2</text><text x="53" y="271" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Revise with A</text><rect x="240" y="224" width="158" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="240" y="224" width="5" height="68" rx="2.5" fill="#d58a31" /><text x="257" y="249" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTION 2</text><text x="257" y="271" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Verify</text><rect x="444" y="224" width="160" height="68" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5" /><rect x="444" y="224" width="5" height="68" rx="2.5" fill="#0c8d80" /><text x="461" y="249" text-anchor="start" fill="#0c8d80" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">OBSERVATION 2</text><text x="461" y="271" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Evidence B</text><rect x="525" y="327" width="79" height="24" rx="12" fill="#e2f3ee" stroke="#a9d7c6" /><text x="564" y="344" text-anchor="middle" fill="#24876f" font-size="11" font-weight="750" font-family="Arial,Helvetica,sans-serif">ANSWER</text><rect x="279" y="198" width="126" height="24" rx="15" fill="#fff" stroke="#d4e4eb" /><text x="342" y="214" text-anchor="middle" fill="#647e91" font-size="11" font-weight="600" font-family="Arial,Helvetica,sans-serif">Evidence returns</text><rect x="32" y="88" width="168" height="76" rx="17" fill="none" stroke="#286fbc" stroke-width="4" opacity="0" id="stage-0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.15;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="236" y="88" width="166" height="76" rx="17" fill="none" stroke="#d58a31" stroke-width="4" opacity="0" id="stage-1"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.15;0.3;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="440" y="88" width="168" height="76" rx="17" fill="none" stroke="#0c8d80" stroke-width="4" opacity="0" id="stage-2"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3;0.5;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="32" y="220" width="168" height="76" rx="17" fill="none" stroke="#286fbc" stroke-width="4" opacity="0" id="stage-3"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.65;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="236" y="220" width="166" height="76" rx="17" fill="none" stroke="#d58a31" stroke-width="4" opacity="0" id="stage-4"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.65;0.8;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="440" y="220" width="168" height="76" rx="17" fill="none" stroke="#0c8d80" stroke-width="4" opacity="0" id="stage-5"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.8;0.92;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><rect x="520" y="319" width="88" height="36" rx="17" fill="none" stroke="#24876f" stroke-width="4" opacity="0" id="stage-6"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.92;1" dur="14s" repeatCount="indefinite" calcMode="discrete" /></rect><circle r="5.5" fill="#0c8d80" stroke="white" stroke-width="2" id="progress-marker" cx="116" cy="153"><animate attributeName="cx" values="116;116;319;319;524;524;524;44;44;116;116;319;319;524;524;524;564;564;564" keyTimes="0;0.06;0.15;0.22;0.3;0.35;0.37;0.44;0.48;0.5;0.57;0.65;0.72;0.8;0.85;0.87;0.9;0.92;1" dur="14s" repeatCount="indefinite" calcMode="linear" /><animate attributeName="cy" values="153;153;153;153;153;153;183;183;285;285;285;285;285;285;285;314;314;327;327" keyTimes="0;0.06;0.15;0.22;0.3;0.35;0.37;0.44;0.48;0.5;0.57;0.65;0.72;0.8;0.85;0.87;0.9;0.92;1" dur="14s" repeatCount="indefinite" calcMode="linear" /></circle></svg>
