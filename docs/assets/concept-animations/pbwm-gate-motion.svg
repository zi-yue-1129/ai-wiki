<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="PBWM: gate what enters memory"><title>PBWM: gate what enters memory</title><desc>Original schematic teaching animation; values and traces are illustrative, not recorded neural data.</desc><g transform="scale(0.888888889 0.9)"><rect x="0.5" y="0.5" width="719" height="399" rx="16" fill="#ffffff" stroke="#dce6f2"/><text x="25" y="39" fill="#17324d" font-size="22" font-family="Arial,sans-serif" font-weight="700">PBWM: gate what enters memory</text><text x="25" y="62" fill="#7590a6" font-size="12" font-family="Arial,sans-serif">The gate accepts useful cues while rejecting an intervening distractor</text><rect x="24" y="83" width="672" height="88" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><rect x="24" y="188" width="672" height="109" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><rect x="24" y="314" width="672" height="59" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><text x="41" y="108" text-anchor="start" fill="#7590a6" font-size="11" font-weight="700" font-family="Arial,sans-serif">INPUT</text><rect x="91" y="117" width="150" height="40" rx="10" fill="white" stroke="#3274e5" stroke-width="2"/><text x="166" y="143" text-anchor="middle" fill="#3274e5" font-size="14" font-weight="700" font-family="Arial,sans-serif">CUE A</text><rect x="292" y="117" width="150" height="40" rx="10" fill="white" stroke="#e59a3b" stroke-width="2"/><text x="367" y="143" text-anchor="middle" fill="#e59a3b" font-size="14" font-weight="700" font-family="Arial,sans-serif">DISTRACTOR</text><rect x="493" y="117" width="150" height="40" rx="10" fill="white" stroke="#009e9b" stroke-width="2"/><text x="568" y="143" text-anchor="middle" fill="#009e9b" font-size="14" font-weight="700" font-family="Arial,sans-serif">CUE B</text><circle cx="166" cy="155" r="4" fill="#3274e5"><animate attributeName="cx" dur="12s" repeatCount="indefinite" keyTimes="0;0.335;0.67;1" values="166;367;568;568" calcMode="discrete"/