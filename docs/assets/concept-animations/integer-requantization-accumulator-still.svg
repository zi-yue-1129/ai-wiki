<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="Arial,sans-serif"><title>Integer accumulation and requantization</title><desc>Trace zero-point correction and products, accumulate, then compare mathematical scaling with the integer multiply, offset, shift and output code.</desc><rect width="640" height="360" rx="12" fill="#f8fafc"/><text x="20" y="32" font-size="17" fill="#20384c" text-anchor="start">Input q (z = 3)</text><rect x="207" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="32" font-size="19" fill="white" text-anchor="middle">7</text><rect x="339" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="32" font-size="19" fill="white" text-anchor="middle">2</text><rect x="471" y="10" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="32" font-size="19" fill="white" text-anchor="middle">5</text><text x="20" y="75" font-size="17" fill="#20384c" text-anchor="start">Centered q − z</text><rect x="207" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="75" font-size="19" fill="white" text-anchor="middle">4</text><rect x="339" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="75" font-size="19" fill="white" text-anchor="middle">−1</text><rect x="471" y="53" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="75" font-size="19" fill="white" text-anchor="middle">2</text><text x="20" y="118" font-size="17" fill="#20384c" text-anchor="start">Weight q (z = 0)</text><rect x="207" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="262" y="118" font-size="19" fill="white" text-anchor="middle">4</text><rect x="339" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="394" y="118" font-size="19" fill="white" text-anchor="middle">−2</text><rect x="471" y="96" width="110" height="32" rx="5" fill="#315c85"/><text x="526" y="118" font-size="19" fill="white" text-anchor="middle">1</text><text x="20" y="161" font-size="17" fill="#20384c" text-anchor="start">Products</text><rect x="207" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="262" y="161" font-size="19" fill="white" text-anchor="middle">16</text><rect x="339" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="394" y="161" font-size="19" fill="white" text-anchor="middle">2</text><rect x="471" y="139" width="110" height="32" rx="5" fill="#08766f"/><text x="526" y="161" font-size="19" fill="white" text-anchor="middle">2</text><text x="20" y="204" font-size="17" fill="#20384c" text-anchor="start">Running sum</text><rect x="207" y="182" width="110" height="32" rx="5" fill="#08766f"/><text x="262" y="204" font-size="19" fill="white" text-anchor="middle">16</text><rect x="339" y="182" width="110" height="32" rx="5" fill="#08766f"/><text x="394" y="204" font-size="19" fill="white" text-anchor="middle">18</text><rect x="471" y="182" width="110" height="32" rx="5" fill="#08766f"/><text x="526" y="204" font-size="19" fill="white" text-anchor="middle">20</text><path d="M526 216V230H88V242" fill="none" stroke="#a4b6c6" stroke-width="2"/><path d="M83 237L88 242L93 237" fill="none" stroke="#a4b6c6" stroke-width="2"/><path d="M242.5 230V242" fill="none" stroke="#a4b6c6" stroke-width="2"/><path d="M237.5 237L242.5 242L247.5 237" fill="none" stroke="#a4b6c6" stroke-width="2"/><rect x="20" y="246" width="135" height="75" rx="5" fill="#e6edf3"/><text x="87.5" y="270" font-size="14" fill="#20384c" text-anchor="middle">Scale × 5/16</text><text x="87.5" y="299" font-size="17" fill="#20384c" text-anchor="middle">20 → 6.25</text><rect x="175" y="246" width="135" height="75" rx="5" fill="#e6edf3"/><text x="242.5" y="270" font-size="14" fill="#20384c" text-anchor="middle">Multiply + offset</text><text x="242.5" y="299" font-size="17" fill="#20384c" text-anchor="middle">5×20+8 = 108</text><rect x="330" y="246" width="135" height="75" rx="5" fill="#e6edf3"/><text x="397.5" y="270" font-size="14" fill="#20384c" text-anchor="middle">Shift right 4</text><text x="397.5" y="299" font-size="17" fill="#20384c" text-anchor="middle">6</text><path d="M313 283L327 283m-5 -5 5 5-5 5" fill="none" stroke="#a4b6c6" stroke-width="2"/><rect x="485" y="246" width="135" height="75" rx="5" fill="#08766f"/><text x="552.5" y="270" font-size="14" fill="white" text-anchor="middle">Add z = 10</text><text x="552.5" y="299" font-size="17" fill="white" text-anchor="middle">q = 16</text><path d="M468 283L482 283m-5 -5 5 5-5 5" fill="none" stroke="#a4b6c6" stroke-width="2"/><text x="87.5" y="348" font-size="15" fill="#9a5a20" text-anchor="middle">Math only</text><text x="397" y="348" font-size="15" fill="#08766f" text-anchor="middle">Integer path</text><path d="M175 325V329H620V325" fill="none" stroke="#08766f" stroke-width="2"/></svg>
