<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A3C backward n-step bootstrapping</title><desc id="desc">Three rewards are accumulated backward from a bootstrapped state value: R3 1.0, R2 2.9, R1 2.61, R0 3.349, then subtract V(s0) 2.5 for advantage 0.849. All parameters are schematic, not model measurements.</desc><style>@media (prefers-reduced-motion:reduce){.motion{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fafc" stroke="#dbe5ed" stroke-width="1"/><text x="28" y="38" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">A3C · backward n-step return</text><text x="28" y="57" fill="#64778a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="start">Illustrative rewards · γ = 0.9 · bootstrap V(s₃) = 1</text><rect x="25" y="78" width="590" height="234" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="45" y="103" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Rewards and bootstrap</text><rect x="53" y="116" width="112" height="49" rx="8" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="109" y="144" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">r₀ = 1</text><rect x="185" y="116" width="112" height="49" rx="8" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="241" y="144" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">r₁ = 0</text><rect x="317" y="116" width="112" height="49" rx="8" fill="#edf4ff" stroke="none" stroke-width="0"/><text x="373" y="144" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">r₂ = 2</text><rect x="449" y="116" width="112" height="49" rx="8" fill="#e7f7f4" stroke="none" stroke-width="0"/><text x="505" y="144" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="650" text-anchor="middle">V(s₃) = 1</text><text x="44" y="192" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Backward returns</text><path d="M561 235 H49" fill="none" stroke="#dbe5ed" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 8"/><path d="M60 228 L49 235 L60 242" fill="none" stroke="#64778a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="53" y="211" width="112" height="47" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="109" y="239" fill="#c54983" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">R₀ = 3.349</text><rect x="185" y="211" width="112" height="47" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="241" y="239" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">R₁ = 2.610</text><rect x="317" y="211" width="112" height="47" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="373" y="239" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">R₂ = 2.900</text><rect x="449" y="211" width="112" height="47" rx="8" fill="#ffffff" stroke="#dbe5ed" stroke-width="1.4"/><text x="505" y="239" fill="#0f9187" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">R₃ = 1.000</text><rect x="48" y="207" width="120" height="55" rx="9" fill="none" stroke="#c54983" stroke-width="2.5"/><rect x="27" y="324" width="586" height="26" rx="8" fill="#edf2f7" stroke="none" stroke-width="0"/><text x="41" y="341" fill="#203448" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="650" text-anchor="start">A₀ = R₀ − V(s₀) = 3.349 − 2.5 = +0.849</text></svg>