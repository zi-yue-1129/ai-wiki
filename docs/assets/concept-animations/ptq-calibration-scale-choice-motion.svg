<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Calibration-dependent scale preference</title><desc>Two candidate scales have fixed weight errors but opposite linear output errors as the calibration mixture changes. Their output errors cross at probability one half. The static view shows the second input direction absent.</desc><rect width="640" height="360" fill="white"/><text x="320" y="28" font-size="22" text-anchor="middle" fill="#243447">Calibration changes scale preference</text><rect x="12" y="43" width="274" height="270" rx="3" fill="#f2f5f8" /><rect x="298" y="43" width="330" height="270" rx="3" fill="#f2f5f8" /><text x="26" y="65" font-size="16" text-anchor="start" fill="#243447">Weight SSE</text><text x="272" y="65" font-size="13" text-anchor="end" fill="#243447">fixed</text><text x="26" y="94" font-size="15" text-anchor="start" fill="#243447">s = 1</text><rect x="110" y="82" width="105" height="14" rx="3" fill="#e4eaf0" /><rect x="110" y="82" width="47.069" height="14" rx="3" fill="#315c85" /><text x="272" y="94" font-size="13" text-anchor="end" fill="#243447">0.0325</text><text x="26" y="132" font-size="15" text-anchor="start" fill="#243447">s = 0.6</text><rect x="110" y="120" width="105" height="14" rx="3" fill="#e4eaf0" /><rect x="110" y="120" width="105" height="14" rx="3" fill="#08766f" /><text x="272" y="132" font-size="13" text-anchor="end" fill="#243447">0.0725</text><text x="26" y="172" font-size="16" text-anchor="start" fill="#243447">Output MSE</text><text x="272" y="172" font-size="13" text-anchor="end" fill="#243447">variable</text><text x="26" y="197" font-size="15" text-anchor="start" fill="#243447">s = 1</text><rect x="110" y="184" width="145" height="14" rx="3" fill="#e4eaf0" /><rect id="mse-one" x="110" y="184" width="0" height="14" rx="3" fill="#315c85"><animate attributeName="width" values="0;0;72.5;72.5;145;145;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="26" y="235" font-size="15" text-anchor="start" fill="#243447">s = 0.6</text><rect x="110" y="222" width="145" height="14" rx="3" fill="#e4eaf0" /><rect id="mse-local" x="110" y="222" width="145" height="14" rx="3" fill="#08766f"><animate attributeName="width" values="145;145;72.5;72.5;0;0;145" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="26" y="276" font-size="14" text-anchor="start" fill="#243447">Weight SSE always favors s = 1</text><text x="26" y="298" font-size="14" text-anchor="start" fill="#243447">MSE depends on inputs</text><text x="463" y="65" font-size="16" text-anchor="middle" fill="#243447">Expected output MSE</text><line x1="355" y1="267" x2="607" y2="267" stroke="#8494a8" stroke-opacity=".35"/><text x="347" y="272" font-size="13" text-anchor="end" fill="#243447">0.00</text><line x1="355" y1="177" x2="607" y2="177" stroke="#8494a8" stroke-opacity=".35"/><text x="347" y="182" font-size="13" text-anchor="end" fill="#243447">0.02</text><line x1="355" y1="87" x2="607" y2="87" stroke="#8494a8" stroke-opacity=".35"/><text x="347" y="92" font-size="13" text-anchor="end" fill="#243447">0.04</text><line x1="355" y1="267" x2="355" y2="87" stroke="#243447" /><line x1="355" y1="267" x2="607" y2="267" stroke="#243447" /><line x1="355" y1="267" x2="607" y2="87" stroke="#315c85" stroke-width="3"/><line x1="355" y1="87" x2="607" y2="267" stroke="#08766f" stroke-width="3"/><line x1="481" y1="87" x2="481" y2="267" stroke="#8494a8" stroke-dasharray="4 4"/><line id="mix-cursor" x1="355" x2="355" y1="87" y2="267" stroke="#a05c20" stroke-dasharray="5 4" stroke-width="2"><animate attributeName="x1" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></line><circle id="curve-one" cx="355" cy="267" r="6" fill="#315c85" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="267;267;177;177;87;87;267" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></circle><circle id="curve-local" cx="355" cy="87" r="6" fill="#08766f" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="87;87;177;177;267;267;87" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></circle><text x="355" y="285" font-size="13" text-anchor="middle" fill="#243447">0</text><text x="481" y="285" font-size="13" text-anchor="middle" fill="#243447">0.5</text><text x="607" y="285" font-size="13" text-anchor="middle" fill="#243447">1</text><text x="481" y="304" font-size="15" text-anchor="middle" fill="#243447">P(x = (5, 2))</text><line x1="30" y1="333" x2="54" y2="333" stroke="#315c85" stroke-width="4"/><text x="62" y="338" font-size="15" text-anchor="start" fill="#243447">s = 1</text><line x1="157" y1="333" x2="181" y2="333" stroke="#08766f" stroke-width="4"/><text x="189" y="338" font-size="15" text-anchor="start" fill="#243447">s = 0.6</text><line x1="318" y1="333" x2="342" y2="333" stroke="#a05c20" stroke-width="2" stroke-dasharray="5 4"/><text x="350" y="338" font-size="15" text-anchor="start" fill="#243447">Calibration mixture</text></svg>
