<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Calibration changes scale preference</title><desc>Signed residual products cancel for one input direction for each candidate scale. The input mixture changes expected output error, although weight SSE stays fixed. The static view shows probability one for input (5, 2).</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="white"/><text x="320" y="28" font-size="22" text-anchor="middle" fill="#243447">Calibration changes scale preference</text><rect x="12" y="43" width="274" height="270" rx="3" fill="#f2f5f8"/><rect x="298" y="43" width="330" height="270" rx="3" fill="#f2f5f8"/><text x="26" y="64" font-size="16" text-anchor="start" fill="#243447">Weight SSE</text><text x="26" y="87" font-size="14" text-anchor="start" fill="#243447">s = 1</text><text x="126" y="87" font-size="14" text-anchor="end" fill="#315c85">0.0325</text><text x="154" y="87" font-size="14" text-anchor="start" fill="#243447">s = 0.6</text><text x="272" y="87" font-size="14" text-anchor="end" fill="#08766f">0.0725</text><line x1="26" y1="99" x2="272" y2="99" stroke="#8494a8" stroke-opacity="0.35"/><text x="26" y="119" font-size="15" text-anchor="start" fill="#243447">Signed residual products</text><text x="133" y="140" font-size="13" text-anchor="middle" fill="#243447">(5, 2)</text><text x="226" y="140" font-size="13" text-anchor="middle" fill="#243447">(3, 2)</text><rect id="input-highlight-0" x="89" y="147" width="88" height="67" rx="3" fill="#a05c20" opacity="0.05"><animate attributeName="opacity" values="0.05;0.05;0.145;0.145;0.24;0.24;0.05" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><rect id="input-highlight-1" x="182" y="147" width="88" height="67" rx="3" fill="#a05c20" opacity="0.24"><animate attributeName="opacity" values="0.24;0.24;0.145;0.145;0.05;0.05;0.24" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="26" y="167" font-size="13" text-anchor="start" fill="#315c85">s = 1</text><text x="133" y="164" font-size="12" text-anchor="middle" fill="#243447">0.5 − 0.3</text><text x="133" y="178" font-size="12" text-anchor="middle" fill="#243447">= 0.2</text><text x="226" y="164" font-size="12" text-anchor="middle" fill="#243447">0.3 − 0.3</text><text x="226" y="178" font-size="12" text-anchor="middle" fill="#243447">= 0</text><text x="26" y="195" font-size="13" text-anchor="start" fill="#08766f">s = 0.6</text><text x="133" y="192" font-size="12" text-anchor="middle" fill="#243447">−0.5 + 0.5</text><text x="133" y="206" font-size="12" text-anchor="middle" fill="#243447">= 0</text><text x="226" y="192" font-size="12" text-anchor="middle" fill="#243447">−0.3 + 0.5</text><text x="226" y="206" font-size="12" text-anchor="middle" fill="#243447">= 0.2</text><text x="26" y="235" font-size="16" text-anchor="start" fill="#243447">Output MSE</text><text x="26" y="256" font-size="13" text-anchor="start" fill="#315c85">s = 1</text><rect x="110" y="245" width="145" height="13" rx="3" fill="#e4eaf0"/><rect id="mse-one" x="110" y="245" height="13" rx="3" fill="#315c85" width="0"><animate attributeName="width" values="0;0;72.5;72.5;145;145;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="26" y="280" font-size="13" text-anchor="start" fill="#08766f">s = 0.6</text><rect x="110" y="269" width="145" height="13" rx="3" fill="#e4eaf0"/><rect id="mse-local" x="110" y="269" height="13" rx="3" fill="#08766f" width="145"><animate attributeName="width" values="145;145;72.5;72.5;0;0;145" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="26" y="302" font-size="13" text-anchor="start" fill="#243447">Same weights · different inputs</text><text x="463" y="65" font-size="16" text-anchor="middle" fill="#243447">Expected output MSE</text><line x1="355" y1="267" x2="607" y2="267" stroke="#8494a8" stroke-opacity="0.35"/><text x="347" y="272" font-size="13" text-anchor="end" fill="#243447">0.00</text><line x1="355" y1="177" x2="607" y2="177" stroke="#8494a8" stroke-opacity="0.35"/><text x="347" y="182" font-size="13" text-anchor="end" fill="#243447">0.02</text><line x1="355" y1="87" x2="607" y2="87" stroke="#8494a8" stroke-opacity="0.35"/><text x="347" y="92" font-size="13" text-anchor="end" fill="#243447">0.04</text><line x1="355" y1="267" x2="355" y2="87" stroke="#243447"/><line x1="355" y1="267" x2="607" y2="267" stroke="#243447"/><line x1="355" y1="267" x2="607" y2="87" stroke="#315c85" stroke-width="3"/><line x1="355" y1="87" x2="607" y2="267" stroke="#08766f" stroke-width="3"/><line x1="481" y1="87" x2="481" y2="267" stroke="#8494a8" stroke-dasharray="4 4"/><line id="mix-cursor" y1="87" y2="267" stroke="#a05c20" stroke-dasharray="5 4" stroke-width="2" x1="355" x2="355"><animate attributeName="x1" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></line><circle id="curve-one" r="6" fill="#315c85" stroke="white" stroke-width="1.5" cx="355" cy="267"><animate attributeName="cx" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="267;267;177;177;87;87;267" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></circle><circle id="curve-local" r="6" fill="#08766f" stroke="white" stroke-width="1.5" cx="355" cy="87"><animate attributeName="cx" values="355;355;481;481;607;607;355" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="87;87;177;177;267;267;87" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></circle><text x="355" y="285" font-size="13" text-anchor="middle" fill="#243447">0</text><text x="481" y="285" font-size="13" text-anchor="middle" fill="#243447">0.5</text><text x="607" y="285" font-size="13" text-anchor="middle" fill="#243447">1</text><text x="481" y="304" font-size="15" text-anchor="middle" fill="#243447">P(x = (5, 2))</text><line x1="30" y1="333" x2="54" y2="333" stroke="#315c85" stroke-width="3"/><text x="62" y="338" font-size="15" text-anchor="start" fill="#243447">s = 1</text><line x1="157" y1="333" x2="181" y2="333" stroke="#08766f" stroke-width="3"/><text x="189" y="338" font-size="15" text-anchor="start" fill="#243447">s = 0.6</text><line x1="318" y1="333" x2="342" y2="333" stroke="#a05c20" stroke-width="3" stroke-dasharray="5 4"/><text x="350" y="338" font-size="15" text-anchor="start" fill="#243447">Calibration mixture</text></svg>
