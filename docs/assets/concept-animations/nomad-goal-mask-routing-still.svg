<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">NoMaD goal masking switches exploration and goal navigation</title><desc id="desc">Two matched navigation scenes illustrate a single policy. With m equals one the goal token is blocked and a route is drawn toward a frontier; with m equals zero the goal is visible and a goal-directed candidate route is drawn. The routes are schematic, not sampled model output.</desc><style>.still{display:none}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}}</style><rect x="0" y="0" width="640" height="360" rx="15" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="0"/><text x="22" y="39" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20354b">NoMaD</text><text x="120" y="38" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="start" fill="#667c92">One diffusion policy · two goal-mask modes</text><rect x="23" y="61" width="290" height="261" rx="13" fill="#fff" stroke="#cddbe7" stroke-width="1.3"/><rect x="35" y="72" width="266" height="32" rx="8" fill="#fff1e3" stroke="#fff1e3" stroke-width="0"/><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#e18b42">m = 1</text><text x="286" y="94" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#e18b42">EXPLORE</text><rect x="40" y="116" width="61" height="36" rx="7" fill="#eaf1fa" stroke="#b2c8e4" stroke-width="1.3"/><text x="70" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#426db5">Obs</text><rect x="116" y="116" width="60" height="36" rx="7" fill="#f2f4f6" stroke="#acb7c2" stroke-width="1.3"/><text x="146" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#8b9aab">Goal</text><path d="M123 122 L168 146" fill="none" stroke="#a2aebc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M102 134 L114 134" fill="none" stroke="#cddbe7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M177 134 L194 134" fill="none" stroke="#b1beca" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><rect x="197" y="116" width="101" height="36" rx="7" fill="#f0f5f9" stroke="#b8cad9" stroke-width="1.3"/><text x="247" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#20354b">Policy</text><path d="M247 152 L247 174" fill="none" stroke="#426db5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M39 174 L297 174" fill="none" stroke="#e6edf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="67" cy="289" r="9" fill="#eaf1fa" stroke="#426db5" stroke-width="2"/><rect x="159" y="226" width="33" height="31" rx="6" fill="#e4eaf0" stroke="#8a9cac" stroke-width="1.3"/><text x="264" y="191" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#e18b42">FRONTIER</text><circle cx="264" cy="204" r="8" fill="#fff1e3" stroke="#e18b42" stroke-width="2"/><path d="M67 289 C96 248 83 203 139 198 S230 226 264 204" fill="none" stroke="#e18b42" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="327" y="61" width="290" height="261" rx="13" fill="#fff" stroke="#cddbe7" stroke-width="1.3"/><rect x="339" y="72" width="266" height="32" rx="8" fill="#e5f6f3" stroke="#e5f6f3" stroke-width="0"/><text x="352" y="94" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#0b898c">m = 0</text><text x="590" y="94" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="end" fill="#0b898c">NAVIGATE</text><rect x="344" y="116" width="61" height="36" rx="7" fill="#eaf1fa" stroke="#b2c8e4" stroke-width="1.3"/><text x="374" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#426db5">Obs</text><rect x="420" y="116" width="60" height="36" rx="7" fill="#e5f6f3" stroke="#0b898c" stroke-width="1.3"/><text x="450" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0b898c">Goal</text><path d="M406 134 L418 134" fill="none" stroke="#cddbe7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M481 134 L498 134" fill="none" stroke="#0b898c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="501" y="116" width="101" height="36" rx="7" fill="#f0f5f9" stroke="#b8cad9" stroke-width="1.3"/><text x="551" y="139" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#20354b">Policy</text><path d="M551 152 L551 174" fill="none" stroke="#426db5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M343 174 L601 174" fill="none" stroke="#e6edf4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="371" cy="289" r="9" fill="#eaf1fa" stroke="#426db5" stroke-width="2"/><rect x="463" y="226" width="33" height="31" rx="6" fill="#e4eaf0" stroke="#8a9cac" stroke-width="1.3"/><text x="572" y="191" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0b898c">GOAL</text><circle cx="572" cy="204" r="8" fill="#e5f6f3" stroke="#0b898c" stroke-width="2"/><path d="M371 289 C412 297 426 205 481 198 S534 205 572 204" fill="none" stroke="#0b898c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="344" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#667c92">Shared context encoder + diffusion action decoder</text></svg>