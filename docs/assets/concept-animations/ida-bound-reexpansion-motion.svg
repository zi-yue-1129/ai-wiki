<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">IDA-star depth-first iterative f-bound sweep</title><desc id="desc">Four bounds 4, 6, 7 and 8 revisit a depth-first path. Nodes carry illustrative f=g+h scores. The final bound reaches goal G at path cost 8.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#1b3448}.eyebrow{font-size:12px;letter-spacing:1.2px;font-weight:700;fill:#657c90}.node-label{font-size:15px;font-weight:700}.score{font-size:11px;fill:#657c90;font-weight:600}.key{font-size:12px;font-weight:700;fill:#1b3448}.hint{font-size:11px;fill:#657c90}.card{fill:white;stroke:#d5e2ec;stroke-width:1.4}@media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f4f8fc"/><text x="27" y="30" class="eyebrow" >IDA* · GROWING f-BOUND</text><rect x="24" y="45" width="397" height="284" rx="14" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4"/><rect x="434" y="45" width="182" height="284" rx="14" fill="#ffffff" stroke="#d5e2ec" stroke-width="1.4"/><path d="M198 87L100 157" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M198 87L300 157" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M100 157L71 228" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M100 157L182 228" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M300 157L329 228" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M71 228L71 298" stroke="#d5e2ec" stroke-width="4" stroke-linecap="round"/><path d="M198 87 L100 157 L71 228 L71 298" stroke="#0e9488" stroke-opacity=".45" stroke-width="4" fill="none" stroke-dasharray="6 7"/><circle cx="198" cy="87" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="198" y="92" class="node-label" text-anchor="middle">S</text><text x="220" y="67" class="score" >f=4</text><circle cx="100" cy="157" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="100" y="162" class="node-label" text-anchor="middle">A</text><text x="122" y="137" class="score" >f=6</text><circle cx="300" cy="157" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="300" y="162" class="node-label" text-anchor="middle">B</text><text x="322" y="137" class="score" >f=8</text><circle cx="71" cy="228" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="71" y="233" class="node-label" text-anchor="middle">C</text><text x="93" y="208" class="score" >f=7</text><circle cx="182" cy="228" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="182" y="233" class="node-label" text-anchor="middle">D</text><text x="204" y="208" class="score" >f=10</text><circle cx="329" cy="228" r="23" fill="#ffffff" stroke="#3578b8" stroke-width="2.8"/><text x="329" y="233" class="node-label" text-anchor="middle">E</text><text x="351" y="208" class="score" >f=9</text><circle cx="71" cy="298" r="23" fill="#ffffff" stroke="#0e9488" stroke-width="2.8"/><text x="71" y="303" class="node-label" text-anchor="middle">G</text><text x="93" y="278" class="score" >f=8</text><text x="449" y="78" class="eyebrow" >BOUND</text><text x="449" y="154" class="eyebrow" >REVISIT</text><text x="449" y="240" class="eyebrow" >RESULT</text><g opacity="0" class="motion"><text x="451" y="125" font-size="35" font-weight="750">4</text><text x="451" y="184" font-size="14" font-weight="650">S</text><text x="451" y="279" font-size="16" font-weight="700" style="fill:#df9940">CUTOFF</text><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><text x="451" y="125" font-size="35" font-weight="750">6</text><text x="451" y="184" font-size="14" font-weight="650">S → A</text><text x="451" y="279" font-size="16" font-weight="700" style="fill:#df9940">CUTOFF</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><text x="451" y="125" font-size="35" font-weight="750">7</text><text x="451" y="184" font-size="14" font-weight="650">S → A → C</text><text x="451" y="279" font-size="16" font-weight="700" style="fill:#df9940">CUTOFF</text><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><text x="451" y="125" font-size="35" font-weight="750">8</text><text x="451" y="184" font-size="14" font-weight="650">S → A → C → G</text><text x="451" y="279" font-size="16" font-weight="700" style="fill:#0e9488">GOAL</text><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><circle r="7" cx="0" cy="0" fill="#7856b5" stroke="white" stroke-width="2"><animateMotion path="M198 87 L100 157 L198 87 L300 157 L198 87" dur="3s" begin="0s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="1;0;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><circle r="7" cx="0" cy="0" fill="#7856b5" stroke="white" stroke-width="2"><animateMotion path="M198 87 L100 157 L71 228 L100 157 L182 228 L100 157 L198 87 L300 157 L198 87" dur="3s" begin="0s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><circle r="7" cx="0" cy="0" fill="#7856b5" stroke="white" stroke-width="2"><animateMotion path="M198 87 L100 157 L71 228 L71 298 L71 228 L100 157 L182 228 L100 157 L198 87 L300 157 L198 87" dur="3s" begin="0s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0" class="motion"><circle r="7" cx="0" cy="0" fill="#7856b5" stroke="white" stroke-width="2"><animateMotion path="M198 87 L100 157 L71 228 L71 298" dur="3s" begin="0s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><rect x="27" y="338" width="586" height="4" rx="2" fill="#d5e2ec"/><rect x="27" y="338" width="0" height="4" rx="2" fill="#7856b5" class="motion"><animate attributeName="width" values="0;586" keyTimes="0;1" dur="12s" repeatCount="indefinite"/></rect></svg>