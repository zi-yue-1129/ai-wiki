<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Reflexion feedback and episodic memory across trials</title><desc id="desc">An illustrative failure is evaluated, summarized as a verbal lesson, stored in episodic memory, and used to condition another attempt. Model weights stay fixed; success in the toy second trial is not guaranteed by the method.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf5f9"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" stroke="#8fa7b6" stroke-width="1.7" fill="none"/></marker></defs><rect width="640" height="360" fill="url(#bg)"/><text x="26" y="34" text-anchor="start" fill="#193449" font-size="22" font-weight="750" font-family="Arial,Helvetica,sans-serif">Reflexion</text><text x="26" y="55" text-anchor="start" fill="#647e91" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Feedback becomes memory, not a weight update</text><rect x="23" y="73" width="594" height="264" rx="18" fill="#f8fbfd" stroke="#d7e4eb"/><text x="38" y="92" text-anchor="start" fill="#647e91" font-size="11" font-weight="750" font-family="Arial,Helvetica,sans-serif">TRIAL 1</text><text x="38" y="229" text-anchor="start" fill="#647e91" font-size="11" font-weight="750" font-family="Arial,Helvetica,sans-serif">TRIAL 2</text><path d="M191 135 H238" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M395 135 H443" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M524 166 V190" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M443 202 H395" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M239 202 H112 V244" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M191 280 H238" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M395 280 H443" fill="none" stroke="#8fa7b6" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="36" y="103" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="36" y="103" width="5" height="63" rx="2.5" fill="#286fbc"/><text x="53" y="128" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTOR</text><text x="53" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Attempt 1</text><rect x="240" y="103" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="240" y="103" width="5" height="63" rx="2.5" fill="#d58a31"/><text x="257" y="128" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">EVALUATOR</text><text x="257" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Check outcome</text><rect x="444" y="103" width="160" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="444" y="103" width="5" height="63" rx="2.5" fill="#d58a31"/><text x="461" y="128" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">FAILED</text><text x="461" y="150" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Feedback</text><rect x="444" y="190" width="160" height="50" rx="12" fill="#f4eefb" stroke="#ddd1f0" stroke-width="1.5"/><text x="460" y="211" text-anchor="start" fill="#765eb4" font-size="13" font-weight="700" font-family="Arial,Helvetica,sans-serif">REFLECT</text><text x="460" y="228" text-anchor="start" fill="#193449" font-size="11" font-weight="500" font-family="Arial,Helvetica,sans-serif">Avoid error</text><rect x="240" y="177" width="156" height="63" rx="13" fill="#f4eefb" stroke="#ddd1f0" stroke-width="1.5"/><text x="256" y="201" text-anchor="start" fill="#765eb4" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">MEMORY</text><text x="256" y="222" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Saved lesson</text><rect x="36" y="244" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="36" y="244" width="5" height="63" rx="2.5" fill="#286fbc"/><text x="53" y="269" text-anchor="start" fill="#286fbc" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTOR</text><text x="53" y="291" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Attempt 2</text><rect x="240" y="244" width="156" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="240" y="244" width="5" height="63" rx="2.5" fill="#d58a31"/><text x="257" y="269" text-anchor="start" fill="#d58a31" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">EVALUATOR</text><text x="257" y="291" text-anchor="start" fill="#193449" font-size="12" font-weight="500" font-family="Arial,Helvetica,sans-serif">Check again</text><rect x="444" y="244" width="160" height="63" rx="13" fill="white" stroke="#d7e4eb" stroke-width="1.5"/><rect x="444" y="244" width="5" height="63" rx="2.5" fill="#24876f"/><text x="461" y="269" text-anchor="start" fill="#24876f" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">PASSED</text><text x="461" y=