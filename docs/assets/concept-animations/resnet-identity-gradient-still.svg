<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Residual addition and its backward gradient paths</title><desc id="desc">A scalar residual block takes x equal to two, F(x) equal to negative one, and sums to one. The output gradient splits through an identity shortcut and a residual derivative of negative one half, adding to an input gradient of one half.</desc><rect width="800" height="420" fill="#f7f9fc"/><defs><marker id="at" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#078e85"/></marker><marker id="ap" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#6d62b6"/></marker><marker id="ao" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#d38b29"/></marker><marker id="ab" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6Z" fill="#3b80b5"/></marker></defs><text x="25" y="34" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1d3149" font-weight="700" text-anchor="start">Residual block · forward and backward</text><text x="775" y="33" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#687c93" font-weight="500" text-anchor="end">Toy scalar · F(x) = −0.5x</text><rect x="20" y="54" width="760" height="161" rx="10" fill="#fff" stroke="#dae5ef" stroke-width="1.5"/><rect x="20" y="225" width="760" height="175" rx="10" fill="#fff" stroke="#dae5ef" stroke-width="1.5"/><text x="40" y="80" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#078e85" font-weight="700" text-anchor="start">Forward</text><text x="40" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d38b29" font-weight="700" text-anchor="start">Backward</text><rect x="50" y="118" width="113" height="52" rx="10" fill="#e9f5f1" stroke="#b9ddd4" stroke-width="1.5"/><text x="106" y="150" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#078e85" font-weight="700" text-anchor="middle">x = 2</text><rect x="291" y="100" width="139" height="55" rx="10" fill="#f0eef9" stroke="#d4cbed" stroke-width="1.5"/><text x="361" y="122" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#6d62b6" font-weight="700" text-anchor="middle">F(x)</text><text x="361" y="143" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6d62b6" font-weight="700" text-anchor="middle">−1</text><circle cx="589" cy="148" r="23" fill="#fff8e9" stroke="#ebcb8e" stroke-width="2"/><text x="589" y="157" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#d38b29" font-weight="700" text-anchor="middle">+</text><rect x="655" y="122" width="109" height="49" rx="10" fill="#e9f3fc" stroke="#bbd9ef" stroke-width="1.5"/><text x="709" y="153" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#3b80b5" font-weight="700" text-anchor="middle">y = 1</text><path d="M163 145H238V126H288" fill="none" stroke="#6d62b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ap)"/><path d="M430 126H541V148H563" fill="none" stroke="#6d62b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ap)"/><path d="M163 165V189H545V166H565" fill="none" stroke="#078e85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)"/><path d="M612 148H651" fill="none" stroke="#3b80b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><text x="235" y="113" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6d62b6" font-weight="700" text-anchor="start">residual</text><text x="255" y="183" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#078e85" font-weight="700" text-anchor="start">identity</text><rect x="50" y="301" width="126" height="51" rx="10" fill="#e9f5f1" stroke="#b9ddd4" stroke-width="1.5"/><text x="113" y="332" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#078e85" font-weight="700" text-anchor="middle">gₓ = 0.5</text><rect x="291" y="281" width="139" height="55" rx="10" fill="#f0eef9" stroke="#d4cbed" stroke-width="1.5"/><text x="361" y="313" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#6d62b6" font-weight="700" text-anchor="middle">F′ = −0.5</text><circle cx="589" cy="323" r="23" fill="#fff8e9" stroke="#ebcb8e" stroke-width="2"/><text x="589" y="332" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#d38b29" font-weight="700" text-anchor="middle">+</text><rect x="655" y="297" width="109" height="51" rx="10" fill="#fff5e8" stroke="#efd19f" stroke-width="1.5"/><text x="709" y="328" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#d38b29" font-weight="700" text-anchor="middle">gᵧ = 1</text><path d="M654 323H613" fill="none" stroke="#d38b29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ao)"/><path d="M564 310H536V310H432" fill="none" stroke="#6d62b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ap)"/><path d="M290 309H237V321H178" fill="none" stroke="#6d62b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ap)"/><path d="M564 335V373H211V336H178" fill="none" stroke="#078e85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)"/><text x="260" y="298" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6d62b6" font-weight="700" text-anchor="start">−0.5</text><text x="335" y="366" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#078e85" font-weight="700" text-anchor="start">+1 skip</text><text x="42" y="413" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#687c93" font-weight="500" text-anchor="start">Analytic illustrative derivatives; not a measured training gradient</text></sv