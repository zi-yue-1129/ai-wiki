<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Group-wise rounding and squared error accumulation</title><desc>Four small weights round in sequence on a shared scale of 4 and a local scale of 4/7. Individual squared error bars and a running sum update when each weight is rounded. The larger group is exact in both cases.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#fff"></rect><text x="320" y="28" font-size="22" text-anchor="middle" fill="#243447">Group-wise rounding</text><rect x="12" y="43" width="300" height="263" rx="5" fill="#f2f5f8"></rect><text x="162" y="66" font-size="17" text-anchor="middle" fill="#243447">Shared scale = 4</text><text x="26" y="91" font-size="13" text-anchor="start" fill="#243447">w</text><text x="132" y="91" font-size="13" text-anchor="middle" fill="#243447">Grid</text><text x="265" y="91" font-size="13" text-anchor="middle" fill="#243447">Error²</text><line x1="56" y1="101" x2="56" y2="232" stroke="#8494a8" stroke-width="1" stroke-dasharray="2 3"/><line x1="208" y1="101" x2="208" y2="232" stroke="#8494a8" stroke-width="1" stroke-dasharray="2 3"/><text x="26" y="120" font-size="15" text-anchor="start" fill="#243447">1</text><line x1="56" y1="115" x2="208" y2="115" stroke="#8494a8" stroke-width="1"/><line x1="94" y1="115" x2="56" y2="115" stroke="#a05c20" stroke-width="2"/><circle cx="94" cy="115" r="6" fill="white" stroke="#315c85" stroke-width="2"></circle><circle id="shared-dot-0" cx="56" cy="115" r="4.5" fill="#a05c20" stroke="none" stroke-width="2"></circle><rect x="224" y="109" width="74" height="12" rx="2" fill="#dce4eb"></rect><rect id="shared-error-0" x="224" y="109" width="32.8889" height="12" rx="2" fill="#a05c20"></rect><text x="26" y="156" font-size="15" text-anchor="start" fill="#243447">1.5</text><line x1="56" y1="151" x2="208" y2="151" stroke="#8494a8" stroke-width="1"/><line x1="113" y1="151" x2="56" y2="151" strok