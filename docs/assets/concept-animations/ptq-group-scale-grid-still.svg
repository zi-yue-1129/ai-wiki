<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Group-wise quantisation</title><desc>Each original small weight moves to its nearest grid point under a shared scale of 4 or a local scale of 4/7. The four large weights are exact under both scales. The final squared errors are 4.25 and 17/196.</desc><rect width="640" height="360" fill="#fff"/><text x="320" y="27" font-size="21" text-anchor="middle" fill="#243447">Shared vs group-local scale</text><rect x="15" y="44" width="295" height="255" rx="4" fill="#f2f5f8" /><text x="162" y="67" font-size="16" text-anchor="middle" fill="#243447">Shared scale = 4</text><line x1="80" y1="92" x2="80" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><text x="80" y="87" font-size="12" text-anchor="middle" fill="#243447">0</text><line x1="300" y1="92" x2="300" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><text x="300" y="87" font-size="12" text-anchor="middle" fill="#243447">4</text><text x="25" y="117" font-size="14" text-anchor="start" fill="#243447">1</text><line x1="80" y1="112" x2="300" y2="112" stroke="#8494a8" stroke-width="1"/><line x1="135" y1="112" x2="80" y2="112" stroke="#a05c20" stroke-width="3"/><circle cx="135" cy="112" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="80" cy="112" r="5" fill="#a05c20" ></circle><text x="25" y="161" font-size="14" text-anchor="start" fill="#243447">1.5</text><line x1="80" y1="156" x2="300" y2="156" stroke="#8494a8" stroke-width="1"/><line x1="162.5" y1="156" x2="80" y2="156" stroke="#a05c20" stroke-width="3"/><circle cx="162.5" cy="156" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="80" cy="156" r="5" fill="#a05c20" ></circle><text x="25" y="205" font-size="14" text-anchor="start" fill="#243447">3</text><line x1="80" y1="200" x2="300" y2="200" stroke="#8494a8" stroke-width="1"/><line x1="245" y1="200" x2="300" y2="200" stroke="#a05c20" stroke-width="3"/><circle cx="245" cy="200" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="300" cy="200" r="5" fill="#a05c20" ></circle><text x="25" y="249" font-size="14" text-anchor="start" fill="#243447">4</text><line x1="80" y1="244" x2="300" y2="244" stroke="#8494a8" stroke-width="1"/><line x1="300" y1="244" x2="300" y2="244" stroke="#a05c20" stroke-width="3"/><circle cx="300" cy="244" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="300" cy="244" r="5" fill="#a05c20" ></circle><text x="162" y="286" font-size="15" text-anchor="middle" fill="#a05c20">Final SSE = 4.25</text><rect x="330" y="44" width="295" height="255" rx="4" fill="#f2f5f8" /><text x="477" y="67" font-size="16" text-anchor="middle" fill="#243447">Group scale = 4/7</text><line x1="395" y1="92" x2="395" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><text x="395" y="87" font-size="12" text-anchor="middle" fill="#243447">0</text><line x1="426.4286" y1="92" x2="426.4286" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="457.8571" y1="92" x2="457.8571" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="489.2857" y1="92" x2="489.2857" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="520.7143" y1="92" x2="520.7143" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="552.1429" y1="92" x2="552.1429" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="583.5714" y1="92" x2="583.5714" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><line x1="615" y1="92" x2="615" y2="263" stroke="#8494a8" stroke-width="1" stroke-dasharray="3 3"/><text x="615" y="87" font-size="12" text-anchor="middle" fill="#243447">4</text><text x="340" y="117" font-size="14" text-anchor="start" fill="#243447">1</text><line x1="395" y1="112" x2="615" y2="112" stroke="#8494a8" stroke-width="1"/><line x1="450" y1="112" x2="457.8571" y2="112" stroke="#08766f" stroke-width="3"/><circle cx="450" cy="112" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="457.8571" cy="112" r="5" fill="#08766f" ></circle><text x="340" y="161" font-size="14" text-anchor="start" fill="#243447">1.5</text><line x1="395" y1="156" x2="615" y2="156" stroke="#8494a8" stroke-width="1"/><line x1="477.5" y1="156" x2="489.2857" y2="156" stroke="#08766f" stroke-width="3"/><circle cx="477.5" cy="156" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="489.2857" cy="156" r="5" fill="#08766f" ></circle><text x="340" y="205" font-size="14" text-anchor="start" fill="#243447">3</text><line x1="395" y1="200" x2="615" y2="200" stroke="#8494a8" stroke-width="1"/><line x1="560" y1="200" x2="552.1429" y2="200" stroke="#08766f" stroke-width="3"/><circle cx="560" cy="200" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="552.1429" cy="200" r="5" fill="#08766f" ></circle><text x="340" y="249" font-size="14" text-anchor="start" fill="#243447">4</text><line x1="395" y1="244" x2="615" y2="244" stroke="#8494a8" stroke-width="1"/><line x1="615" y1="244" x2="615" y2="244" stroke="#08766f" stroke-width="3"/><circle cx="615" cy="244" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><circle cx="615" cy="244" r="5" fill="#08766f" ></circle><text x="477" y="286" font-size="15" text-anchor="middle" fill="#08766f">Final SSE = 17/196</text><circle cx="38" cy="321" r="7" fill="white" stroke="#315c85" stroke-width="2"></circle><text x="52" y="326" font-size="14" text-anchor="start" fill="#243447">Original</text><circle cx="152" cy="321" r="5" fill="#08766f" ></circle><circle cx="164" cy="321" r="5" fill="#a05c20" ></circle><text x="177" y="326" font-size="14" text-anchor="start" fill="#243447">Rounded</text><text x="623" y="326" font-size="14" text-anchor="end" fill="#243447">Other group: 8, 16, 24, 28</text><text x="320" y="347" font-size="13" text-anchor="middle" fill="#243447">Signed 4-bit codes: -7 to 7 (symmetric)</text></svg>
