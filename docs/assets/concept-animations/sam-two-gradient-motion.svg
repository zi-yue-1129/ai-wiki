<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">Sharpness-Aware Minimisation: perturb then update</title><desc id="dsc">Four states: gradient at original weights, bounded ascent perturbation, gradient at perturbed weights, update from original weights.</desc><defs><marker id="teal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#008f88"/></marker><marker id="blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#3e6da8"/></marker><marker id="amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#db8a24"/></marker><marker id="gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#8797a7"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="none" stroke-width="1"/><text x="25" y="33" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">SAM · Two-gradient step</text><text x="615" y="32" fill="#8797a7" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="end">1 → 2 → 3 → 4</text><g id="stage-1"><animate attributeName="opacity" values="1;0.24;0.24;0.24" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/><rect x="24" y="55" width="282" height="137" rx="12" fill="white" stroke="#d6e0e8" stroke-width="1.5"/><rect x="36" y="67" width="23" height="23" rx="7" fill="#e1f3f1" stroke="none" stroke-width="1"/><text x="47.5" y="83" fill="#008f88" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="68" y="83" fill="#17324d" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start">Gradient at w</text><ellipse cx="174" cy="146" rx="29" ry="19" transform="rotate(-24 174 1