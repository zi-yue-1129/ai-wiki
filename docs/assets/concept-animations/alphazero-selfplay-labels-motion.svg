<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">AlphaZero self-play search and terminal outcome training targets</title><desc id="desc">Three successive positions receive Monte Carlo tree-search policy targets during play. After White wins, value targets become plus one, minus one, plus one from the player-to-move perspective. A schematic example, not a recorded game.</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4f8fc"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#223e5f" flood-opacity="0.07"/></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif} @media (prefers-reduced-motion:reduce){.motion-only{display:none}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="url(#paper)" stroke="none" stroke-width="1" /><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#d9e4ee" stroke-width="1" /><text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#213b58" >SELF-PLAY → TARGETS</text><text x="320" y="64" text-anchor="middle" font-size="15" font-weight="500" fill="#657b90" >π during search · z after the game</text><rect x="35" y="91" width="118" height="184" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="94" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#27425f" >s0</text><circle cx="94" cy="150" r="13" fill="#fff" stroke="#263f5c" stroke-width="2"/><text x="94" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#50657c" >White</text><rect x="69" y="211" width="13" height="27" rx="3" fill="#5478d5" stroke="none" stroke-width="1" /><rect x="90" y="227" width="13" height="11" rx="3" fill="#e39b4f" stroke="none" stroke-width="1" /><rect x="111" y="219" width="13" height="19" rx="3" fill="#149f94" stroke="none" stroke-width="1" /><text x="94" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#14877f" >π0</text><rect x="37" y="93" width="114" height="180" rx="13" fill="none" stroke="#efad5b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0;0;0" keyTimes="0;0.26;0.53;0.8;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></rect><rect x="185" y="91" width="118" height="184" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="244" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#27425f" >s1</text><circle cx="244" cy="150" r="13" fill="#21394e" stroke="#263f5c" stroke-width="2"/><text x="244" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#50657c" >Black</text><rect x="219" y="211" width="13" height="27" rx="3" fill="#5478d5" stroke="none" stroke-width="1" /><rect x="240" y="227" width="13" height="11" rx="3" fill="#e39b4f" stroke="none" stroke-width="1" /><rect x="261" y="219" width="13" height="19" rx="3" fill="#149f94" stroke="none" stroke-width="1" /><text x="244" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#14877f" >π1</text><rect x="187" y="93" width="114" height="180" rx="13" fill="none" stroke="#efad5b" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.26;0.53;0.8;1" dur="12s" calcMode="linear" repeatCount="indefinite"/></rect><rect x="335" y="91" width="118" height="184" rx="14" fill="#fff" stroke="#dfe7f1" stroke-width="1" filter="url(#shadow)"/><text x="394" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#27425f" >s2</text><circle cx="394" cy="150" r="13" fill="#fff" stroke="#263f5c" stroke-width="2"/><text x="394" y="184" text-anchor="middle" font-size="15" font-weight="500" fill="#50657c" >White</text><rect x="369" y="211" width="13" height="27" rx="3" fill="#5478d5" stroke="none" stroke-width="1" /><rect x="390" y="227" width="13" height="11"