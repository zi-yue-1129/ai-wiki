<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">SAC: entropy-temperature tradeoff</title><desc id="desc">A fixed three-action Q vector is converted to a Boltzmann distribution. Lower temperature concentrates probability on the best-valued action and reduces entropy. This is a finite-action analogy, not a measured SAC continuous-control policy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#ecf3fa"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#54c7bd"/><stop offset="1" stop-color="#238c91"/></linearGradient></defs><style>text{font-family:Inter,system-ui,sans-serif;fill:#263c50}.title{font-size:19px;font-weight:750}.micro{font-size:11px;font-weight:650;letter-spacing:.8px;fill:#698296}.label{font-size:15px;font-weight:650}.tick{font-size:12px;fill:#718598}.panel{fill:#fff;stroke:#d5e3ed;stroke-width:1.5}.grid{stroke:#e4edf3;stroke-width:1}.curve{fill:none;stroke:#2f91a6;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="760" height="420" rx="20" fill="url(#bg)"/><text x="29" y="36" class="title">SAC · ENTROPY–TEMPERATURE TRADEOFF</text><text x="29" y="58" class="micro">FIXED ACTION VALUES · SCHEMATIC DISTRIBUTIONS</text><rect class="panel" x="26" y="77" width="442" height="294" rx="16"/><rect class="panel" x="482" y="77" width="250" height="294" rx="16"/><text x="50" y="111" class="label">Action probabilities</text><text x="504" y="111" class="label">Entropy H(π)</text><text x="50" y="130" class="micro">Q = [2, 1, 0]</text><text x="504" y="129" class="micro">TEMPERATURE α</text><line class="grid" x1="79" y1="281.5" x2="448" y2="281.5"/><line class="grid" x1="79" y1="233" x2="448" y2="233"/><line class="grid" x1="79" y1="184.5" x2="448" y2="184.5"/><line class="grid" 