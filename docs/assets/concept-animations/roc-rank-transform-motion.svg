<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC-AUC rank invariance under monotone score transformations</title><desc id="desc">Four illustrative scores, positives 0.9 and 0.6 and negatives 0.8 and 0.3, move from square-root transformed locations to cubed transformed locations. Their order never changes, so the three winning positive-negative pairs out of four and ROC AUC 0.75 remain constant.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f6fbfe"/><stop offset="1" stop-color="#eaf4f8"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#204357}.title{font-size:19px;font-weight:750}.sub{font-size:12px;font-weight:550;fill:#668293}.label{font-size:13px;font-weight:700}.mini{font-size:11px;font-weight:600}.big{font-size:27px;font-weight:760}.still{display:none}.moving{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="url(#bg)"/><text x="26" y="35" class="title" >ROC-AUC · RANK INVARIANCE</text><text x="26" y="56" class="sub" >Strictly increasing score maps preserve every pairwise order</text><rect x="25" y="75" width="440" height="245" rx="12" fill="white" stroke="#d5e5ed"/><rect x="477" y="75" width="138" height="245" rx="12" fill="white" stroke="#d5e5ed"/><text x="48" y="106" class="label" >SCORE POSITION</text><text x="433" y="106" class="mini" text-anchor="end">0 → 1</text><text x="48" y="126" class="mini" >sqrt(s)  →  s³</text><text x="51" y="159" class="label" >P₁</text><line x1="170" y1="155" x2="414" y2="155" stroke="#e1edf1" stroke-width="6" stroke-linecap="round"/><line x1="347.88" y1="155" x2="401.48" y2="155" stroke="#258c83" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/><g class="moving"><circle cx="401.48" cy="155" r="8" fill="#258c83" stroke="white" stroke-width="2"><animate attributeName="cx" values="401.48;347.88;401.48" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><circle cx="401.48" cy="155" r="6" fill="none" stroke="#258c83" stroke-width="2"/><circle cx="347.88" cy="155" r="8" fill="#258c83"/></g><text x="51" y="198" class="label" >N₁</text><line x1="170" y1="194" x2="414" y2="194" stroke="#e1edf1" stroke-width="6" stroke-linecap="round"/><line x1="294.93" y1="194" x2="388.24" y2="194" stroke="#e69051" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/><g class="moving"><circle cx="388.24" cy="194" r="8" fill="#e69051" stroke="white" stroke-width="2"><animate attributeName="cx" values="388.24;294.93;388.24" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><circle cx="388.24" cy="194" r="6" fill="none" stroke="#e69051" stroke-width="2"/><circle cx="294.93" cy="194" r="8" fill="#e69051"/></g><text x="51" y="237" class="label" >P₂</text><line x1="170" y1="233" x2="414" y2="233" stroke="#e1edf1" stroke-width="6" stroke-linecap="round"/><line x1="222.70" y1="233" x2="359.00" y2="233" stroke="#258c83" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/><g class="moving"><circle cx="359.00" cy="233" r="8" fill="#258c83" stroke="white" stroke-width="2"><animate attributeName="cx" values="359.00;222.70;359.00" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><circle cx="359.00" cy="233" r="6" fill="none" stroke="#258c83" stroke-width="2"/><circle cx="222.70" cy="233" r="8" fill="#258c83"/></g><text x="51" y="276" class="label" >N₂</text><line x1="170" y1="272" x2="414" y2="272" stroke="#e1edf1" stroke-width="6" stroke-linecap="round"/><line x1="176.59" y1="272" x2="303.64" y2="272" stroke="#e69051" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/><g class="moving"><circle cx="303.64" cy="272" r="8" fill="#e69051" stroke="white" stroke-width="2"><animate attributeName="cx" values="303.64;176.59;303.64" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><circle cx="303.64" cy="272" r="6" fill="none" stroke="#e69051" stroke-width="2"/><circle cx="176.59" cy="272" r="8" fill="#e69051"/></g><text x="49" y="311" class="mini" >P = positive</text><text x="183" y="311" class="mini" >N = negative</text><text x="496" y="110" class="label" >AUC</text><text x="496" y="154" class="big" >0.750</text><text x="496" y="181" class="mini" >3 / 4 pairs</text><line x1="496" y1="199" x2="595" y2="199" stroke="#dae6ea"/><text x="496" y="226" class="mini" >Ranking</text><text x="496" y="244" class="label" >unchanged</text><text x="496" y="274" class="mini" >No calibration</text><text x="496" y="291" class="mini" >guarantee</text><text x="26" y="346" class="mini" >SYNTHETIC SCORES · INTERPOLATION OF TWO STRICTLY INCREASING MAPS</text></svg>