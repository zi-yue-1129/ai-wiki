<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Feature scaling changes nearest centre, before and after</title><desc id="desc">Two fixed prototypes A=(0,0), B=(4,2), and point P=(2.3,0.5) are compared after scaling the second feature from 0.5 to 2. Nearest-centre assignment changes from B to A. Synthetic, not measured.</desc><style>text{font-family:Arial,sans-serif}@media(prefers-reduced-motion:reduce){.animated{display:none!important}.reduced{display:inline!important}}</style><rect width="800" height="420" rx="17" fill="#f4f8fb"/><text x="31" y="43" font-size="16" fill="#193449" font-weight="700">K-MEANS · FEATURE SCALING</text><rect x="32" y="70" width="360" height="310" rx="14" fill="white" stroke="#d7e3eb"/><text x="54" y="105" font-size="16" fill="#193449" font-weight="700">s = 0.5</text><line x1="202" y1="270" x2="110" y2="280" stroke="#3478b5" stroke-width="2"/><line x1="202" y1="270" x2="270" y2="240" stroke="#d9913f" stroke-width="2"/><circle cx="110" cy="280" r="8.5" fill="#3478b5" stroke="white" stroke-width="2"/><text x="120" y="268" font-size="13" fill="#3478b5" font-weight="700">A</text><circle cx="270" cy="240" r="8.5" fill="#d9913f" stroke="white" stroke-width="2"/><text x="280" y="228" font-size="13" fill="#d9913f" font-weight="700">B</text><circle cx="202" cy="270" r="8.5" fill="#193449" stroke="white" stroke-width="2"/><text x="212" y="258" font-size="13" fill="#193449" font-weight="700">P</text><text x="54" y="320" font-size="13" fill="#637c90">d²(A)=5.35     d²(B)=3.45</text><text x="54" y="349" font-size="14" fill="#d9913f" font-weight="700">Nearest: B</text><rect x="408" y="70" width="360" height="310" rx="14" fill="white" stroke="#d7e3eb"/><text x="430" y="105" font-size="16" fill="#193449" font-weight="700">s = 2.0</text><line x1="578" y1="240" x2="486" y2="280" stroke="#3478b5" stroke-width="2"/><line x1="578" y1="240" x2="646" y2="120" stroke="#d9913f" stroke-width="2"/><circle cx="486" cy="280" r="8.5" fill="#3478b5" stroke="white" stroke-width="2"/><text x="496" y="268" font-size="13" fill="#3478b5" font-weight="700">A</text><circle cx="646" cy="120" r="8.5" fill="#d9913f" stroke="white" stroke-width="2"/><text x="656" y="108" font-size="13" fill="#d9913f" font-weight="700">B</text><circle cx="578" cy="240" r="8.5" fill="#193449" stroke="white" stroke-width="2"/><text x="588" y="228" font-size="13" fill="#193449" font-weight="700">P</text><text x="430" y="320" font-size="13" fill="#637c90">d²(A)=6.29     d²(B)=11.89</text><text x="430" y="349" font-size="14" fill="#3478b5" font-weight="700">Nearest: A</text><text x="32" y="405" font-size="12" fill="#637c90">Synthetic fixed prototypes · Not an iterative training run</text></svg>