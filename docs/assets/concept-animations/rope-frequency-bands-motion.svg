<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description"><title id="title">RoPE per-frequency relative phase wrap</title><desc id="description">Two schematic two-dimensional RoPE frequency pairs use pi over two and pi over ten radians per relative position. At an offset of four the fast phase wraps fully while the slow phase is only seventy-two degrees. The full model has many frequencies; this is an analytic toy phase example, not quality or context-length measurement.</desc><rect width="640" height="360" rx="18" fill="white"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#dbe5ee" stroke-width="2"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26384e}.heading{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#677a8e}.label{font-size:13px;font-weight:600}.tick{font-size:11px;fill:#677a8e}</style><text class="heading" x="26" y="36">RoPE · frequency bands</text><text class="sub" x="26" y="57">Same relative offset · different phase speeds</text><text class="label" x="178" y="87" text-anchor="middle" fill="#2865c8">Fast · ω=π/2</text><text class="label" x="450" y="87" text-anchor="middle" fill="#df8e2e">Slow · ω=π/10</text><circle cx="178" cy="154" r="56" fill="#f9fbfc" stroke="#d1dce7" stroke-width="2"/><line x1="135" y1="154" x2="221" y2="154" stroke="#dee7ef"/><line x1="178" y1="111" x2="178" y2="197" stroke="#dee7ef"/><g transform="rotate(0 178 154)"><path d="M178 154 L221 154" stroke="#2865c8" stroke-width="5" stroke-linecap="round"/><path d="M223 154 l-14 -8 v16 z" fill="#2865c8"/><animateTransform attributeName="transform" type="rotate" values="0 178 154;-1440 178 154;-1440 178 154" keyTimes="0;.984615;1" dur="12s" repeatCount="indefinite"/></g><circle cx="178" cy="154" r="4" fill="#26384e"/><circle cx="450" cy="154" r="56" fill="#f9fbfc" stroke="#d1dce7" stroke-width="2"/><line x1="407" y1="154" x2="493" y2="154" stroke="#dee7ef"/><line x1="450"