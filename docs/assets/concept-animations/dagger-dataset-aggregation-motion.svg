<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DAgger: learner rollouts, expert state labels, aggregated data, and retraining</title><desc id="desc">The learner deviates from an expert path; its visited states are labelled by the expert and added to the growing dataset. A later policy follows a closer schematic route. Illustrative, not measured.</desc><defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#087d85" stroke-width="1.5" /></marker><marker id="a-coral" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#e2705a" stroke-width="1.5" /></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3570b4" stroke-width="1.5" /></marker><marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#27956d" stroke-width="1.5" /></marker><marker id="a-grey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#647a8e" stroke-width="1.5" /></marker></defs><style>@media (prefers-reduced-motion: reduce) {.motion-overlay{display:none!important}.fallback-route{opacity:1!important}} @media (prefers-reduced-motion: reduce) {.dataset-row{opacity:1!important}}</style><rect width="640" height="360" rx="15" fill="#f7fafd" stroke="#dbe6ec" /><text x="24" y="33" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#213449">DAgger</text><text x="615" y="33" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="end" fill="#647a8e">On-policy state coverage</text><rect x="19" y="49" width="393" height="278" rx="12" fill="#ffffff" stroke="#dbe6ec" /><rect x="426" y="49