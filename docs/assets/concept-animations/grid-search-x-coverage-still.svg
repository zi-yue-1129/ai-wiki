<text x="607" y="41" text-anchor="end" fill="#9db1c8" font-family="Arial,Helvetica,sans-serif" font-size="11">16 trials · 2 parameters</text>
<rect x="57" y="79" width="319" height="222" rx="9" fill="#14263d" stroke="#2e415a"/>
<rect x="400" y="79" width="210" height="222" rx="9" fill="#14263d" stroke="#2e415a"/>
