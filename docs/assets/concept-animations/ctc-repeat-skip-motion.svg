<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CTC: when a blank is required</title><desc id="desc">From the first A state, a skip to B is legal but a skip to another A is forbidden. AB fits two frames; AA requires at least three frames with a separating blank.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">CTC: when a blank is required</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff"/><text x="38" y="74" font-size="18" fill="#233b52" text-anchor="start">Target AB</text><path d="M146 110 L292 110" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M348 110 L494 110" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M146 102 Q320 42 494 102" stroke="#087d70" stroke-width="2" fill="none" /><text x="320" y="66" font-size="16" fill="#087d70" text-anchor="middle">Skip allowed</text><rect x="90" y="93" width="56" height="34" rx="5" fill="#edf2f6"/><text x="118" y="117" font-size="23" fill="#21678d" text-anchor="middle">A</text><rect x="292" y="93" width="56" height="34" rx="5" fill="#edf2f6"/><text x="320" y="117" font-size="23" fill="#21678d" text-anchor="middle">∅</text><rect x="494" y="93" width="56" height="34" rx="5" fill="#edf2f6"/><text x="522" y="117" font-size="23" fill="#21678d" text-anchor="middle">B</text><text x="38" y="208" font-size="18" fill="#233b52" text-anchor="start">Target AA</text><path d="M146 244 L292 244" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M348 244 L494 244" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M146 236 Q320 176 494 236" stroke="#a95516" stroke-width="2" fill="none" stroke-dasharray="5 4"/><text x="320" y="200" font-size="16" fill="#a95516" text-anchor="middle">Skip blocked</text><text x="320" y="222" font-size="25" fill="#a95516" text-anchor="middle">×</text><rect x="90" y="227" width="56" height="34" rx="5" fill="#edf2f6"/><text x="118" y="251" font-size="23" fill="#21678d" text-anchor="middle">A</text><rect x="292" y="227" width="56" height="34" rx="5" fill="#edf2f6"/><text x="320" y="251" font-size="23" fill="#21678d" text-anchor="middle">∅</text><rect x="494" y="227" width="56" height="34" rx="5" fill="#edf2f6"/><text x="522" y="251" font-size="23" fill="#21678d" text-anchor="middle">A</text><g class="motion"><g id="short-0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="48" y="135" width="250" height="30" rx="5" fill="#e0f4ec"/><text x="173" y="156" font-size="17" fill="#087d70" text-anchor="middle">2 frames: A B</text></g><g id="long-0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.76;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="342" y="135" width="250" height="30" rx="5" fill="#e0f4ec"/><text x="467" y="156" font-size="17" fill="#087d70" text-anchor="middle">3 frames: A ∅ B</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.35;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="5" fill="#087d70"><animateMotion path="M146 102 Q320 42 494 102" keyPoints="0;0;1;1" keyTimes="0;0.08;0.35;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.44;0.58;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="5" fill="#087d70"><animateMotion path="M146 110 L292 110" keyPoints="0;0;1;1" keyTimes="0;0.44;0.58;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.61;0.76;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="5" fill="#087d70"><animateMotion path="M348 110 L494 110" keyPoints="0;0;1;1" keyTimes="0;0.61;0.76;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g id="short-1" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.35;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="48" y="269" width="250" height="30" rx="5" fill="#f8eee5"/><text x="173" y="290" font-size="17" fill="#a95516" text-anchor="middle">2 frames: impossible</text></g><g id="long-1" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.76;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="342" y="269" width="250" height="30" rx="5" fill="#e0f4ec"/><text x="467" y="290" font-size="17" fill="#087d70" text-anchor="middle">3 frames: A ∅ A</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.44;0.58;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="5" fill="#087d70"><animateMotion path="M146 244 L292 244" keyPoints="0;0;1;1" keyTimes="0;0.44;0.58;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.61;0.76;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="5" fill="#087d70"><animateMotion path="M348 244 L494 244" keyPoints="0;0;1;1" keyTimes="0;0.61;0.76;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g></g><g class="still"><rect x="48" y="135" width="250" height="30" rx="5" fill="#e0f4ec"/><text x="173" y="156" font-size="17" fill="#087d70" text-anchor="middle">2 frames: A B</text><rect x="342" y="135" width="250" height="30" rx="5" fill="#e0f4ec"/><text x="467" y="156" font-size="17" fill="#087d70" text-anchor="middle">3 frames: A ∅ B</text><rect x="48" y="269" width="250" height="30" rx="5" fill