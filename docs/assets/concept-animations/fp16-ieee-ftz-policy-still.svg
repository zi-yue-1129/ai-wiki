<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="title desc">
<title id="title">IEEE and FTZ loss-scale policies, synthetic thirteen-scale example</title>
<desc id="desc">At exponents zero through twelve, only IEEE exponents three through ten preserve both gradients. In the hypothetical FTZ policy the small gradient always vanishes before the large one overflows.</desc>
<defs><pattern id="zero" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ffe6b4"/><path d="M-2 6L6-2M1 8L8 1" stroke="#c48129" stroke-width="1.6"/></pattern><pattern id="inf" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#3d5062"/><path d="M0 0L6 6M6 0L0 6" stroke="#cbd5de" stroke-width="1"/></pattern></defs>
<rect x="1" y="1" width="358" height="224" rx="12" fill="#f7f9fc" stroke="#9db3c2" stroke-width="1.5"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#24394c">
<text x="13" y="24" font-size="12.5" font-weight="700">FP16 PAIR · IEEE / FTZ</text>
<text x="13" y="47" font-size="11">S = 2^k →</text>
<text x="13" y="85" font-size="11" font-weight="700">IEEE</text>
<text x="13" y="120" font-size="11" font-weight="700">FTZ</text>
<text x="68.6" y="47" font-size="10" text-anchor="middle">0</text><rect x="60.0" y="65" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="60.0" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="82.1" y="65" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="82.1" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="104.2" y="65" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="104.2" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><text x="134.9" y="47" font-size="10" text-anchor="middle">3</text><rect x="126.3" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="126.3" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="148.4" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="148.4" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="170.5" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="170.5" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><text x="201.2" y="47" font-size="10" text-anchor="middle">6</text><rect x="192.6" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="192.6" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="214.7" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="214.7" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="236.8" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="236.8" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="258.9" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="258.9" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><text x="289.6" y="47" font-size="10" text-anchor="middle">10</text><rect x="281.0" y="65" width="18" height="24" rx="2" fill="#168489" stroke="#597180" stroke-width=".5"/><rect x="281.0" y="100" width="18" height="24" rx="2" fill="url(#zero)" stroke="#597180" stroke-width=".5"/><rect x="303.1" y="65" width="18" height="24" rx="2" fill="url(#inf)" stroke="#597180" stroke-width=".5"/><rect x="303.1" y="100" width="18" height="24" rx="2" fill="url(#inf)" stroke="#597180" stroke-width=".5"/><text x="333.8" y="47" font-size="10" text-anchor="middle">12</text><rect x="325.2" y="65" width="18" height="24" rx="2" fill="url(#inf)" stroke="#597180" stroke-width=".5"/><rect x="325.2" y="100" width="18" height="24" rx="2" fill="url(#inf)" stroke="#597180" stroke-width=".5"/><g font-size="10.5">
<rect x="15" y="149" width="15" height="13" rx="2" fill="#168489"/><text x="35" y="160">SAFE</text>
<rect x="106" y="149" width="15" height="13" rx="2" fill="url(#zero)"/><text x="126" y="160">LOW 0</text>
<rect x="219" y="149" width="15" height="13" rx="2" fill="url(#inf)"/><text x="239" y="160">HIGH INF</text>
<text x="15" y="186" font-size="10">Synthetic: LOW 2^-27, HIGH 2^5</text>
<text x="15" y="204" font-size="10">FTZ applies at binary16 gradient storage only.</text>
</g></g></svg>