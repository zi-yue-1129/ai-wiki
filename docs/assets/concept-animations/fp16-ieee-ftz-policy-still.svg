<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 222" role="img" aria-labelledby="title desc">
<title id="title">Loss scale and gradient retention under IEEE binary16 and hypothetical FTZ</title>
<desc id="desc">For power-of-two scale exponents zero through twelve, IEEE preserves both nonzero finite gradients at exponents three to ten; FTZ silently zeros the small gradient until the large one overflows at eleven.</desc>
<defs>
<pattern id="zero" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#ffe6b4"/><path d="M-2 8L8-2M2 10L10 2" stroke="#c48129" stroke-width="2"/></pattern>
<pattern id="inf" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#3d5062"/><path d="M0 0L8 8M8 0L0 8" stroke="#cbd5de" stroke-width="1.25"/></pattern>
</defs>
<rect x="1" y="1" width="678" height="220" rx="14" fill="#f7f9fc" stroke="#9db3c2" stroke-width="2"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#24394c">
<text x="24" y="29" font-size="15" font-weight="700">LOSS SCALE · TWO STORAGE POLICIES</text>
<text x="24" y="54" font-size="11">S = 2^k →</text>
<text x="24" y="100" font-size="14" font-weight="700">IEEE</text>
<text x="24" y="142" font-size="14" font-weight="700">FTZ</text>
<text x="122" y="53" font-size="11" text-anchor="middle">0</text><rect x="105" y="68" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="105" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="147" y="68" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="147" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="189" y="68" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="189" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><text x="248" y="53" font-size="11" text-anchor="middle">3</text><rect x="231" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="231" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="273" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="273" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="315" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="315" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><text x="374" y="53" font-size="11" text-anchor="middle">6</text><rect x="357" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="357" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="399" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="399" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="441" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="441" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="483" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="483" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><text x="542" y="53" font-size="11" text-anchor="middle">10</text><rect x="525" y="68" width="35" height="29" rx="3" fill="#168489" stroke="#597180" stroke-width=".75"/><rect x="525" y="110" width="35" height="29" rx="3" fill="url(#zero)" stroke="#597180" stroke-width=".75"/><rect x="567" y="68" width="35" height="29" rx="3" fill="url(#inf)" stroke="#597180" stroke-width=".75"/><rect x="567" y="110" width="35" height="29" rx="3" fill="url(#inf)" stroke="#597180" stroke-width=".75"/><text x="626" y="53" font-size="11" text-anchor="middle">12</text><rect x="609" y="68" width="35" height="29" rx="3" fill="url(#inf)" stroke="#597180" stroke-width=".75"/><rect x="609" y="110" width="35" height="29" rx="3" fill="url(#inf)" stroke="#597180" stroke-width=".75"/><g font-size="11">
<rect x="27" y="174" width="19" height="14" rx="2" fill="#168489"/><text x="53" y="186">SAFE PAIR</text>
<rect x="188" y="174" width="19" height="14" rx="2" fill="url(#zero)"/><text x="214" y="186">LOW ZERO</text>
<rect x="338" y="174" width="19" height="14" rx="2" fill="url(#inf)"/><text x="364" y="186">HIGH INF</text>
<text x="27" y="209" font-size="10">Synthetic gradients: 2^-27 and 2^5 · FTZ at binary16 storage only</text>
</g></g></svg>