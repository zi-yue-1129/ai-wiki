<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Activation checkpoint spacing and peak activation slots</title><desc id="d">For a 16-layer chain divided into equal segments of size s, persistent boundaries are 16/s plus 1 and peak temporary internals are s minus 1. Across all segments, 16 minus 16/s internal activations are rebuilt, taking values 0, 8, 12, 14, and 15 for the five interval choices. These are not FLOPs or measured runtime. An amber bracket highlights the last active recomputation segment when s exceeds one; it disappears at s=1 because nothing needs rebuilding. It does not imply all segments are rebuilt at once. An equation at each step explicitly adds retained and rebuilt slots to give the peak. The illustrative total slots are 17, 10, 8, 10, and 17 for s equal to 1, 2, 4, 8, and 16.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.motion-only{} .reduced-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.reduced-only{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="38" font-size="21" fill="#18364d" font-weight="750" >CHECKPOINT SPACING</text><text x="24" y="59" font-size="12" fill="#60768c" font-weight="500" >16 layers · same-sized activation slots · schematic</text><text x="25" y="95" font-size="12" fill="#587189" font-weight="700" >LAYERS</text><rect x="110" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="139" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="168" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="197" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="226" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="255" y="80" width="25" height="18" rx="3" fill="#dfe7ef" stroke="none" /><rect x="284" y="80" width="25" 