<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">A zero-alarm certification test has limited power</title><desc id="desc">For seventeen independent truly negative cases, a one-sided ninety-five percent FPR upper limit is below one sixth only when no false alarms are observed. The probability of this passing event is (1 minus true FPR) to the seventeenth power. A moving dot follows the decreasing probability curve as true FPR increases. Examples: at one percent chance of false alarm, passing has 84.3 percent probability; at five percent, 41.8 percent; at the one-sixth cap, 4.5 percent. These numbers are hypothetical, not empirical.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.head{font-size:18px;font-weight:700}.label{font-size:12px;font-weight:600}.small{font-size:11px;fill:#637d8d}.tiny{font-size:10px;fill:#637d8d}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f0f7fb"/><text class="head" x="22" y="31">Zero alarms: chance of passing</text><rect x="20" y="47" width="600" height="287" rx="12" fill="white" stroke="#d1e1ea"/><text class="label" x="79" y="72">P(pass) = (1 - p)^17</text><text class="small" x="392" y="72">n = 17</text><line x1="78" y1="113" x2="458" y2="113" stroke="#e4eef3"/><line x1="78" y1="200" x2="458" y2="200" stroke="#e4eef3"/><line x1="78" y1="287" x2="458" y2="287" stroke="#9db5c2"/><text class="tiny" x="70" y="117" text-anchor="end">100%</text><text class="tiny" x="70" y="204" text-anchor="end">50%</text><text class="tiny" x="70" y="291" text-anchor="end">0%</text><line x1="78" y1="113" x2="78" y2="287" stroke="#9db5c2"/><path d="M78.00,113.00 L81.17,120.25 L84.33,127.21 L87.50,133.90 L90.67,140.33 L93.83,146.50 L97.00,152.42 L100.17,158.11 L103.33,163.58 L106.50,168.82 L109.67,173.86 L112.83,178.69 L116.00,183.33 L119.17,187.78 L122.33,192.05 L125.50,196.14 L128.67,200.07 L131.83,203.84 L135.00,207.46 L138.17,210.92 L141.33,214.25 L144.50,217.43 L147.67,220.49 L150.83,223.42 L154.00,226.23 L157.17,228.92 L160.33,231.49 L163.50,233.96 L166.67,236.33 L169.83,238.60 L173.00,240.77 L176.17,242.85 L179.33,244.84 L182.50,246.74 L185.67,248.57 L188.83,250.31 L192.00,251.99 L195.17,253.58 L198.33,255.12 L201.50,256.58 L204.67,257.98 L207.83,259.32 L211.00,260.60 L214.17,261.83 L217.33,263.00 L220.50,264.12 L223.67,265.19 L226.83,266.22 L230.00,267.20 L233.17,268.13 L236.33,269.02 L239.50,269.88 L242.67,270.69 L245.83,271.47 L249.00,272.21 L252.17,272.92 L255.33,273.60 L258.50,274.25 L261.67,274.87 L264.83,275.46 L268.00,276.02 L271.17,276.55 L274.33,277.07 L277.50,277.55 L280.67,278.02 L283.83,278.46 L287.00,278.89 L290.17,279.29 L293.33,279.67 L296.50,280.04 L299.67,280.39 L302.83,280.72 L306.00,281.04 L309.17,281.34 L312.33,281.63 L315.50,281.90 L318.67,282.16 L321.83,282.41 L325.00,282.64 L328.17,282.87 L331.33,283.08 L334.50,283.28 L337.67,283.48 L340.83,283.66 L344.00,283.84 L347.17,284.00 L350.33,284.16 L353.50,284.31 L356.67,284.45 L359.83,284.59 L363.00,284.72 L366.17,284.84 L369.33,284.95 L372.50,285.06 L375.67,285.17 L378.83,285.27 L382.00,285.36 L385.17,285.45 L388.33,285.54 L391.50,285.62 L394.67,285.69 L397.83,285.76 L401.00,285.83 L404.17,285.90 L407.33,285.96 L410.50,286.02 L413.67,286.07 L416.83,286.12 L420.00,286.17 L423.17,286.22 L426.33,286.26 L429.50,286.31 L432.67,286.35 L435.83,286.38 L439.00,286.42 L442.17,286.45 L445.33,286.48 L448.50,286.51 L451.67,286.54 L454.83,286.57 L458.00,286.60" fill="none" stroke="#237f87" stroke-width="3.5" stroke-linecap="round"/><rect x="289.11" y="113" width="168.89" height="174" fill="#d97b5f" fill-opacity=".065"/><line x1="289.11" y1="113" x2="289.11" y2="287" stroke="#d18a67" stroke-width="1.5" stroke-dasharray="4 4"/><text class="tiny" x="294.11" y="106">FPR cap 1/6</text><line x1="78" y1="287" x2="78" y2="292" stroke="#91aab8"/><text class="tiny" x="78" y="306" text-anchor="middle">0</text><line x1="268.00" y1="287" x2="268.00" y2="292" stroke="#91aab8"/><text class="tiny" x="268.00" y="306" text-anchor="middle">15%</text><line x1="458" y1="287" x2="458" y2="292" stroke="#91aab8"/><text class="tiny" x="458" y="306" text-anchor="middle">30%</text><text class="label" x="272" y="325" text-anchor="middle">True FPR p</text><rect x="484" y="88" width="115" height="202" rx="10" fill="#f1f7fa" stroke="#d3e4eb"/><text class="label" x="498" y="111">p</text><text class="label" x="558" y="111">Pass</text><line x1="496" y1="123" x2="584" y2="123" stroke="#d5e4eb"/><text class="small" x="496" y="150">1%</text><text class="label" x="554" y="150">84%</text><text class="small" x="496" y="182">5%</text><text class="label" x="554" y="182">42%</text><text class="small" x="496" y="214">10%</text><text class="label" x="554" y="214">17%</text><text class="small" x="496" y="246">1/6</text><text class="label" x="551" y="246">4.5%</text><text class="tiny" x="497" y="276">SYNTHETIC</text><text class="tiny" x="24" y="349">One prespecified iid batch · zero false alarms only · no repeated tries</text><g class="moving"><circle cx="90.67" cy="140.33" r="7.4" fill="#237f87" stroke="white" stroke-width="2.5"><animate attributeName="cx" values="90.67;141.33;204.67;289.11;90.67" keyTimes="0;.25;.5;.75;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="140.33;214.25;257.98;279.16;140.33" keyTimes="0;.25;.5;.75;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="still"><circle cx="141.33" cy="214.25" r="7.4" fill="#237f87" stroke="white" stroke-width="2.5"></circle></g></svg>