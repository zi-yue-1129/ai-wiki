<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">e-prop: forward eligibility, neuron learning signal, local update</title><desc id="desc">A toy leaky eligibility trace rises after local activity and decays. Learning signals at times three and five multiply the current trace to give positive and negative synaptic update contributions. The leaky recurrence is illustrative, not the full e-prop recurrent-neuron eligibility equations. Sample heights and signed bars are proportional; products are revealed only when the sweep reaches their time. Positive gradient sum implies a negative gradient-descent weight step.</desc><style>@media (prefers-reduced-motion:reduce){.motion-only{display:none!important}.static-only{display:inline!important}}</style><rect x="1" y="1" width="638" height="358" rx="15" fill="#f8fbfd" stroke="#d7e4ed"/><text x="28" y="38" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#22394d">e-prop</text><text x="609" y="38" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#637a8e">LOCAL CREDIT</text><rect x="28" y="55" width="584" height="116" rx="12" fill="#fff" stroke="#d7e4ed"/><rect x="28" y="181" width="584" height="150" rx="12" fill="#fff" stroke="#d7e4ed"/><text x="46" y="78" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#356bb2">e(t)</text><text x="582" y="78" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="end" fill="#637a8e">eligibility</text><path d="M105 149L557 149" fill="none" stroke="#d7e4ed" stroke-width="1.2" stroke-linecap="round"/><text x="46" y="207" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#d07842">L(t)</text><text x="38" y="263" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weigh