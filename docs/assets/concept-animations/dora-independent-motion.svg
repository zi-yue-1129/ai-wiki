<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">DoRA directional and magnitude decomposition</title><desc id="dsc">A fixed two-dimensional weight vector in blue and a changing adapted vector in teal. The direction rotates before the magnitude changes. Schematic column example only.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="none"/><text x="22" y="32" fill="#17324d" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">DoRA · Direction and magnitude</text><rect x="18" y="54" width="351" height="269" rx="8" fill="#fff" stroke="#c9d8e4"/><rect x="381" y="54" width="241" height="269" rx="8" fill="#fff" stroke="#c9d8e4"/><text x="34" y="79" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Column vector</text><text x="399" y="79" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Independent controls</text><line x1="43" y1="203" x2="344" y2="203" stroke="#c9d8e4" stroke-width="1.3" /><line x1="169" y1="94" x2="169" y2="303" stroke="#c9d8e4" stroke-width="1.3" /><circle cx="169" cy="203" r="90" fill="none" stroke="#4475a8" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 5"/><circle cx="169" cy="203" r="108" fill="none" stroke="#008f88" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 5"/><defs><marker id="a-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4475a8"/></marker><marker id="a-teal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#008f88"/></marker></defs><line x1="169" y1="203" x2="223" y2="131" stroke="#4475a8" stroke-width="3" marker-end="url(#a-blue)"/><line x1="169" y1="203" x2="223" y2="131" stroke="#008f88" stroke-width="3.5" marker-end="url(#a-teal)"><animate 