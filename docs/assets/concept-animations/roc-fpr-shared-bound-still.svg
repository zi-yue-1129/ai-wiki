<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Zero alarms do not yield the same evidence under dependence</title><desc id="desc">For a hypothetical one-sided 95 percent upper limit with zero false alarms, 30 independent negatives give a 9.5 percent bound, but 30 perfectly correlated negatives from one shared Bernoulli shock amount to one independent draw and give a 95 percent bound. The diagram traces the bound as the observed sample count rises from one to thirty. All probabilities are assumptions, not measured deployment results.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#263d4d}.title{font-size:19px;font-weight:700}.head{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#5c7381}.tiny{font-size:10px;fill:#5c7381}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text class="title" x="22" y="32">Zero alarms: dependence changes evidence</text><rect x="20" y="49" width="600" height="288" rx="12" fill="#fff" stroke="#d2e0e9"/><text class="head" x="40" y="73">ONE-SIDED 95% FPR UPPER LIMIT</text><line x1="322" y1="69" x2="342" y2="69" stroke="#277e86" stroke-width="3"/><text class="sub" x="348" y="73">Independent</text><line x1="448" y1="69" x2="468" y2="69" stroke="#c57d52" stroke-width="3"/><text class="sub" x="474" y="73">One shared shock</text><line x1="94" y1="102" x2="532" y2="102" stroke="#e6edf2"/><text class="tiny" x="83" y="105.5" text-anchor="end">100%</text><line x1="94" y1="143.5" x2="532" y2="143.5" stroke="#e6edf2"/><text class="tiny" x="83" y="147" text-anchor="end">75%</text><line x1="94" y1="185" x2="532" y2="185" stroke="#e6edf2"/><text class="tiny" x="83" y="188.5" text-anchor="end">50%</text><line x1="94" y1="226.5" x2="532" y2="226.5" stroke="#e6edf2"/><text class="tiny" x="83" y="230" text-anchor="end">25%</text><line x1="94" y1="268" x2="532" y2="268" stroke="#e6edf2"/><text class="tiny" x="83" y="271.5" text-anchor="end">0%</text><line x1="94" y1="268" x2="94" y2="272" stroke="#90a9b8"/><text class="tiny" x="94" y="286" text-anchor="middle">1</text><line x1="124.2" y1="268" x2="124.2" y2="272" stroke="#90a9b8"/><text class="tiny" x="124.2" y="286" text-anchor="middle">3</text><line x1="260.1" y1="268" x2="260.1" y2="272" stroke="#90a9b8"/><text class="tiny" x="260.1" y="286" text-anchor="middle">12</text><line x1="335.7" y1="268" x2="335.7" y2="272" stroke="#90a9b8"/><text class="tiny" x="335.7" y="286" text-anchor="middle">17</text><line x1="532" y1="268" x2="532" y2="272" stroke="#90a9b8"/><text class="tiny" x="532" y="286" text-anchor="middle">30</text><text class="sub" x="312" y="307" text-anchor="middle">Observed negatives (all zero alarms)</text><line x1="94" y1="240.3" x2="532" y2="240.3" stroke="#697c8f" stroke-dasharray="4 4"/><text class="tiny" x="539" y="243.3">1/6 cap</text><path d="M94,110.3 L109.1,139.1 L124.2,163.2 L139.3,180.5 L154.4,193.2 L169.5,202.8 L184.6,210.2 L199.7,216.2 L214.8,221 L229.9,225 L245,228.4 L260.1,231.3 L275.2,233.8 L290.3,236 L305.4,237.9 L320.6,239.7 L335.7,241.2 L350.8,242.5 L365.9,243.8 L381,244.9 L396.1,245.9 L411.2,246.9 L426.3,247.7 L441.4,248.5 L456.5,249.3 L471.6,249.9 L486.7,250.6 L501.8,251.2 L516.9,251.7 L532,252.2" fill="none" stroke="#277e86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M94,110.3 H532" fill="none" stroke="#c57d52" stroke-width="3" stroke-linecap="round"/><circle cx="532" cy="252.2" r="5" fill="#277e86" stroke="#fff" stroke-width="2"/><circle cx="532" cy="110.3" r="5" fill="#c57d52" stroke="#fff" stroke-width="2"/><text class="head" x="540" y="113.3">95%</text><text class="head" x="540" y="255.2">9.5%</text><text class="tiny" x="28" y="327">SYNTHETIC · iid NEGATIVES VS PERFECTLY CORRELATED OBSERVATIONS</text></svg>