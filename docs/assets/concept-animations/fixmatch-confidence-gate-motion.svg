"round"/><text x="459" y="313" fill="#66788c" font-size="12" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">no target</text><line x1="509" y1="263" x2="536" y2="263" stroke="#b6c1cb" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/><rect x="538" y="237" width="67" height="53" rx="9" fill="#f3f5f7" stroke="#d6dfe7"/><text x="572" y="268" fill="#66788c" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0</text><circle cx="118" cy="263" r="5" fill="#cb6370" stroke="white" stroke-width="1.7" opacity="0"><animate attributeName="cx" values="118;165;290;355;355;355;355;355" keyTimes="0;0.075;0.165;0.26;0.38;0.48;0.5;1" dur="12s" begin="6s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;1;1;1;0;0" keyTimes="0;0.04;0.15;0.27;0.38;0.48;0.5;1" dur="12s" begin="6s" repeatCount="indefinite"/></circle><rect x="332" y="240" width="46" height="46" rx="10" fill="none" stroke="#cb6370" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0.95;0" keyTimes="0;0.36;0.45;0.5" dur="12s" begin="6s" repeatCount="indefinite"/></rect><text x="24" y="349" fill="#66788c" font-size="12" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Confidence on the weak view controls whether strong-view CE contributes.</text></svg>
