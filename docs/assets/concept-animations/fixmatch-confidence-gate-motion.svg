<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><title>FixMatch confidence gate</title><desc>Two unlabelled examples with illustrative weak-view confidence scores 0.97 and 0.82 are compared with threshold 0.95. Only the first contributes cross-entropy on the strong view.</desc><rect width="640" height="360" fill="#f7fafc"/><text x="22" y="34" fill="#193248" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">FixMatch &#183; confidence-gated consistency</text><text x="617" y="33" fill="#66788c" font-size="15" font-weight="600" text-anchor="end" font-family="Arial,Helvetica,sans-serif">&#964; = 0.95</text><text x="26" y="65" fill="#66788c" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">UNLABELLED</text><text x="180" y="65" fill="#66788c" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">WEAK VIEW</text><text x="330" y="65" fill="#66788c" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">GATE</text><text x="435" y="65" fill="#66788c" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">STRONG VIEW</text><text x="562" y="65" fill="#66788c" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LOSS</text><rect x="20" y="80" width="600" height="116" rx="14" fill="#ffffff" stroke="#d8e4ed"/><rect x="34" y="95" width="80" height="78" rx="8" fill="#e6f3fc" stroke="#dce6ee"/><rect x="49" y="107" width="22" height="22" rx="5" fill="#70b0d9"/><rect x="75" y="124" width="24" height="31" rx="6" fill="#b1d8ef"/><text x="74" y="185" fill="#66788c" font-size="12" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><line x1="114" y1="135" x2="147" y2="135" stroke="#2877ac" stroke-width="2.5"  stroke-linecap="round"/><rect x="148" y="99" width="146" height="73" rx="9" fill="#f8fbfe" stroke="#e3edf3"/><text x="161" y="119" fill="#193248" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">p = 0.97</text><rect x="160" y="136" width="119" height="12" rx="6" fill="#eaf0f4" stroke="#eaf0f4"/><rect x="161" y="137" width="113" height="10" rx="5" fill="#2877ac"/><line x1="272.15" y1="131" x2="272.15" y2="154" stroke="#e08a42" stroke-width="2" stroke-dasharray="2 3" stroke-linecap="round"/><line x1="294" y1="135" x2="328" y2="135" stroke="#169b86" stroke-width="3"  stroke-linecap="round"/><circle cx="355" cy="135" r="23" fill="#e6f8f1" stroke="#169b86" stroke-width="2"/><text x="355" y="140" fill="#169b86" font-size="24" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">&#10003;</text><line x1="379" y1="135" x2="411" y2="135" stroke="#169b86" stroke-width="2.5"  stroke-linecap="round"/><rect x="411" y="99" width="98" height="73" rx="9" fill="#edf9f4" stroke="#dfe7ed"/><path d="M428 152 l17 -34 18 29 12 -11 20 19" fill="none" stroke="#29a392" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="459" y="185" fill="#66788c" font-size="12" font-weight="500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A target</text><line x1="509" y1="135" x2="536" y2="135" stroke="#169b86" stroke-width="2"  stroke-linecap="round"/><rect x="538" y="109" width="67" height="53" rx="9" fill="#e9faf4" stroke="#bce9db"/><text x="572" y="140" fill="#169b86" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">CE</text><circle cx="118" cy="135" r="5" fill="#169b86" stroke="white" stroke-width="1.7" opacity="0"><animate attributeName="cx" values="118;165;290;355;458;573;573;573" keyTimes="0;0.075;0.165;0.26;0.38;0.48;0.5;1" dur="12s" begin="0s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;1;1;1;0;0" keyTimes="0;0.04;0.15;0.27;0.38;0.48;0.5;1" dur="12s" begin="0s" repeatCount=