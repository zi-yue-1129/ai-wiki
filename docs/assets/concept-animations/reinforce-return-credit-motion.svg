<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">REINFORCE return-weighted sampled actions</title><desc id="svgDesc">A three-action sampled episode receives a terminal reward of 4. Discounted returns 2.56, 3.2, and 4 are compared with a baseline of 2; advantage weights become 0.56, 1.2, and 2. A backward credit path and rising weights illustrate the update, not measured training.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" stroke="#94a5b8" stroke-width="1.5" fill="none"/></marker></defs><style>@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect x="0" y="0" width="760" height="400" rx="16" fill="#f8fbff" stroke="none" stroke-width="0" /><rect x="1" y="1" width="758" height="398" rx="15" fill="none" stroke="#d9e5f0" stroke-width="1" /><text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#22344a" text-anchor="start" font-weight="700" >REINFORCE</text><text x="730" y="37" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="end" font-weight="500" >Return-weighted policy gradient</text><text x="32" y="70" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="start" font-weight="600" >Sampled episode</text><line x1="120" y1="134" x2="633" y2="134" stroke="#94a5b8" stroke-width="2" marker-end="url(#arrow)"/><circle cx="141" cy="134" r="31" fill="#eaf0fc" stroke="#426bc0" stroke-width="2"/><text x="141" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#426bc0" text-anchor="middle" font-weight="700" >a0</text><text x="141" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#697e96" text-anchor="middle" font-weight="500" >t=0</text><circle cx="343" cy="134" r="31" fill="#eaf0fc" stroke="#426bc0" stroke-width="2"/><text x="343" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#426bc0" text-anchor="middle" font-weight="700" >a1</text><text x="343" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#697e96" text-anchor="middle" font-weight="500" >t=1</text><circle cx="545" cy="134" r="31" fill="#eaf0fc" stroke="#426bc0" stroke-width="2"/><text x="545" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#426bc0" text-anchor="middle" font-weight="700" >a2</text><text x="545" y="150" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#697e96" text-anchor="middle" font-weight="500" >t=2</text><rect x="639" y="110" width="85" height="48" rx="11" fill="#fff0e9" stroke="#d46a3a" stroke-width="1.5" /><text x="681" y="129" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d46a3a" text-anchor="middle" font-weight="600" >Reward</text><text x="681" y="145" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#d46a3a" text-anchor="middle" font-weight="700" >+4</text><text x="32" y="205" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697e96" text-anchor="start" font-weight="600" >Credit assignment</text><text x="727" y="207" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#697e96" text-anchor="end" font-weight="500" >γ = 0.8   ·   b = 2</text><line x1="65" y1="341" x2="718" y2="341" stroke="#d9e5f0" stroke-width="1.5" /><text x="141" y="236" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#22344a" text-anchor="middle" font-weight="600" >G0 = 2.56</text><rect x="102" y="250" width="78" height="92" rx="7" fill="#edf3f9" stroke="none" stroke-width="0" /><rect x="122" y="316.48" width="38" height="23.520000000000003" rx="5" fill="#078a86"><animate attributeName="height" dur="12s" begin="0s" repeatCount="indefinite" values="0;0;23.520000000000003;23.520000000000003;0" keyTimes="0;0.29;0.48;0.91;1" calcMode="linear"/><animate attributeName="y" dur="12s" begin="0s" repeatCount