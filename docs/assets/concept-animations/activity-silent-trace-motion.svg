<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Activity-silent working memory"><title>Activity-silent working memory</title><desc>Original schematic teaching animation; values and traces are illustrative, not recorded neural data.</desc><g transform="scale(0.888888889 0.9)"><rect x="0.5" y="0.5" width="719" height="399" rx="16" fill="#ffffff" stroke="#dce6f2"/><text x="25" y="39" fill="#17324d" font-size="22" font-family="Arial,sans-serif" font-weight="700">Activity-silent working memory</text><text x="25" y="62" fill="#7590a6" font-size="12" font-family="Arial,sans-serif">A transient synaptic trace can outlast the burst that established it</text><rect x="24" y="86" width="672" height="134" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><rect x="24" y="232" width="672" height="139" rx="12" fill="#f3f7fc" stroke="#dce6f2"/><text x="43" y="114" text-anchor="start" fill="#3274e5" font-size="12" font-weight="700" font-family="Arial,sans-serif">SPIKING</text><text x="43" y="260" text-anchor="start" fill="#009e9b" font-size="12" font-weight="700" font-family="Arial,sans-serif">SYNAPTIC TRACE</text><line x1="109" y1="183" x2="670" y2="183" stroke="#bac9d8" stroke-width="2"/><line x1="109" y1="337" x2="670" y2="337" stroke="#bac9d8" stroke-width="2"/><rect x="206" y="127" width="313" height="52" rx="10" fill="#e6eff9" opacity=".6"/><text x="362" y="149" text-anchor="middle" fill="#7590a6" font-size="11" font-weight="700" font-family="Arial,sans-serif">DELAY</text><defs><clipPath id="reveal"><rect x="109" y="91" width="0" height="270"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;561"/></rect></clipPath></defs><g clip-path="url(#reveal)"><line x1="133" y1="183" x2="133" y2="153" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="143" y1="183" x2="143" y2="132" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="154" y1="183" x2="154" y2="147" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="165" y1="183" x2="165" y2="127" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="184" y1="183" x2="184" y2="162" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="552" y1="183" x2="552" y2="138" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="563" y1="183" x2="563" y2="129" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="574" y1="183" x2="574" y2="155" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="588" y1="183" x2="588" y2="134" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><line x1="605" y1="183" x2="605" y2="160" stroke="#3274e5" stroke-width="4" stroke-linecap="round"/><polyline points="109,333 128,333 145,265 177,264 214,281 279,292 346,302 424,310 505,318 540,317 553,264 570,262 613,274 669,289" fill="none" stroke="#009e9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="109" y1="123" x2="109" y2="349" stroke="#e59a3b" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="x1" values="109;670" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="109;670" dur="12s" repeatCount="indefinite"/></line><circle cx="109" cy="337" r="7" fill="#009e9b" stroke="white" stroke-width="2"><animateMotion dur="12s" repeatCount="indefinite" path="M 0 0 L 19 -4 L 36 -72 L 68 -73 L 105 -56 L 170 -45 L 237 -35 L 315 -27 L 396 -19 L 431 -20 L 444 -73 L 461 -75 L 504 -63 L 560 -48"/></circle><text x="132" y="361" text-anchor="middle" fill="#7590a6" font-size="10" font-weight="700" font-family="Arial,sans-serif">ENCODE</text><text x="344" y="361" text-anchor="middle" fill="#7590a6" font-size="10" font-weight="700" font-family="Arial,sans-serif">MAINTAIN</text><text x="569" y="361" text-anchor="middle" fill="#7590a6" font-size="10" font-weight="700" font-family="Arial,sans-serif">REFRESH</text></g></svg>