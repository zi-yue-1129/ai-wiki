<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">QK normalisation: softmax under growing query and key amplitude</title><desc id="desc">Illustrative centered three-dimensional queries and keys scale from one to four. The raw dot-product logits grow quadratically and softmax concentrates; layer-normalised query and key directions yield constant probabilities. No model measurement. The static fallback shows peak scale.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2f7"/></linearGradient></defs><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#243f55}.tag{font-size:13px;font-weight:700;letter-spacing:1.2px}.heading{font-size:14px;font-weight:700}.micro{font-size:12px}.dim{fill:#657f90}.animate-view{display:inline}.still-view{display:none}@media(prefers-reduced-motion:reduce){.animate-view{display:none!important}.still-view{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="url(#bg)"/><text x="28" y="37" class="tag dim">QK NORMALISATION</text><text x="610" y="37" text-anchor="end" class="micro dim">SCALE SWEEP</text><rect x="28" y="76" width="284" height="219" rx="14" fill="#ffffff" stroke="#d4e2ec"/><text x="44" y="105" class="heading">RAW QK</text><text x="44" y="124" class="micro dim">Softmax of scaled dot products</text><rect x="328" y="76" width="284" height="219" rx="14" fill="#ffffff" stroke="#d4e2ec"/><text x="344" y="105" class="heading">QK NORM</text><text x="344" y="124" class="micro dim">LayerNorm before dot product</text><text x="57" y="164" class="heading">A</text><rect x="94" y="144" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="94" y="144" width="169.983" height="24" rx="6" fill="#287e9b"></rect><text x="57" y="213" class="heading">B</text><rect x="94" y="193" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="94" y="193" width="0.017" height="24" rx="6" fill="#df9a49"></rect><text x="57" y="262" class="heading">C</text><rect x="94" y="242" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="94" y="242" width="0.000" height="24" rx="6" fill="#9078bf"></rect><text x="357" y="164" class="heading">A</text><rect x="394" y="144" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="394" y="144" width="117.086" height="24" rx="6" fill="#287e9b"></rect><text x="357" y="213" class="heading">B</text><rect x="394" y="193" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="394" y="193" width="49.249" height="24" rx="6" fill="#df9a49"></rect><text x="357" y="262" class="heading">C</text><rect x="394" y="242" width="172" height="24" rx="6" fill="#e9f0f5"/><rect x="394" y="242" width="3.665" height="24" rx="6" fill="#9078bf"></rect><text x="35" y="316" class="micro dim">Q / K amplitude</text><path d="M173 314H566" stroke="#d1dee7" stroke-width="7" stroke-linecap="round"/><text x="166" y="342" class="micro dim">1×</text><text x="555" y="342" class="micro dim">4×</text><circle cx="566" cy="314" r="10" fill="#243f55" stroke="#fff" stroke-width="3"/></svg>