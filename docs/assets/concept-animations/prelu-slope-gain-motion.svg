<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Leaky rectifier: matching weight gain to negative slope</title><desc id="desc">An analytical sweep of the negative slope from zero to one. With fixed ReLU-scale weights the output second-moment multiplier rises from one to two. Matching the weight variance to the slope keeps the multiplier at one.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#203650}.meta{font-size:11px;letter-spacing:1.2px;font-weight:700;fill:#71859a}.small{font-size:12px;fill:#71859a}.bold{font-size:13px;font-weight:650}@media(prefers-reduced-motion:reduce){animateMotion,animate{visibility:hidden}}</style><rect width="640" height="360" rx="18" fill="#f6f9fd" /><text class="meta" x="30" y="34">INITIALISATION · ANALYTIC MODEL</text><text x="30" y="61" font-size="17" font-weight="700">Leaky slope changes moment gain</text><text class="small" x="30" y="80">q(next) / q(input)  ·  symmetric preactivation assumption</text><rect x="25" y="98" width="590" height="218" rx="15" fill="white" stroke="#d9e5ee" stroke-width="1.3" /><line x1="93" y1="255.23" x2="572" y2="255.23" stroke="#e6edf4" stroke-dasharray="4 4" /><text x="79" y="259.2" text-anchor="end" class="small">1</text><line x1="93" y1="198.31" x2="572" y2="198.31" stroke="#e6edf4" stroke-dasharray="4 4" /><text x="79" y="202.3" text-anchor="end" class="small">1.5</text><line x1="93" y1="141.38" x2="572" y2="141.38" stroke="#e6edf4" stroke-dasharray="4 4" /><text x="79" y="145.4" text-anchor="end" class="small">2</text><line x1="93" y1="124" x2="93" y2="281" stroke="#9aacbd" /><line x1="93" y1="281" x2="578" y2="281" stroke="#9aacbd" /><text class="small" x="93.00" y="298" text-anchor="middle">0</text><text class="small" x="212.75" y="298" text-anchor="middle">0.25</text><text class="small" x="332.50" y="298" text-anchor="middle">0.5</text><text class="small" x="452.25" y="298" text-an