<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 660" role="img" aria-labelledby="rnd-mobile-title rnd-mobile-desc">
<title id="rnd-mobile-title">RND: learning A, encountering B and learning B</title>
<desc id="rnd-mobile-desc">The same observation is routed to a fixed-weight target and a trainable predictor. While repeated A becomes familiar, the orange prediction moves toward A's green target feature and squared-error bonus falls. An input pulse for B reaches both networks before their state-dependent outputs change discretely and the bonus rises. Further predictor learning on B lowers the error again. Target weights stay frozen. Feature positions and rewards are illustrative rather than measured. Observation A switches instantaneously to B at 7.12 seconds; no interpolated observation is implied.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.head{font-weight:700;fill:#233a53}.muted{fill:#526b84}.line{stroke:#8da2b6;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.resting{display:none}@media(prefers-reduced-motion:reduce){.animated{display:none}.resting{display:inline}}</style>
