<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CTC: forward probability lattice</title><desc id="desc">Target A. Each column combines predecessor mass and multiplies by its frame emission probability. The last two states sum to 0.688.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">CTC: forward probability lattice</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff"/><text x="132" y="77" font-size="17" fill="#233b52" text-anchor="middle">t = 1</text><path d="M177 104 L265 104" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M177 104 L265 192" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M177 192 L265 192" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M177 192 L265 280" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M177 280 L265 280" fill="none" stroke="#a7b8c5" stroke-width="2" /><text x="310" y="77" font-size="17" fill="#233b52" text-anchor="middle">t = 2</text><path d="M355 104 L443 104" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M355 104 L443 192" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M355 192 L443 192" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M355 192 L443 280" fill="none" stroke="#a7b8c5" stroke-width="2" /><path d="M355 280 L443 280" fill="none" stroke="#a7b8c5" stroke-width="2" /><text x="488" y="77" font-size="17" fill="#233b52" text-anchor="middle">t = 3</text><text x="53" y="110" font-size="21" fill="#21678d" text-anchor="middle">∅</text><text x="53" y="198" font-size="21" fill="#21678d" text-anchor="middle">A</text><text x="53" y="286" font-size="21" fill="#21678d" text-anchor="middle">∅</text><rect x="87" y="82" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="87" y="170" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="87" y="258" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="265" y="82" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="265" y="170" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="265" y="258" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="443" y="82" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="443" y="170" width="90" height="44" rx="5" fill="#edf2f6"/><rect x="443" y="258" width="90" height="44" rx="5" fill="#edf2f6"/><text x="38" y="327" font-size="16" fill="#21678d" text-anchor="start">Frame: blank .6, A .4</text><rect x="87" y="82" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="132" y="110" font-size="20" fill="#087d70" text-anchor="middle">0.600</text><rect x="87" y="170" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="132" y="198" font-size="20" fill="#087d70" text-anchor="middle">0.400</text><rect x="87" y="258" width="90" height="44" rx="5" fill="#edf2f6"/><text x="132" y="286" font-size="20" fill="#233b52" text-anchor="middle">0.000</text><rect x="265" y="82" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="310" y="110" font-size="20" fill="#087d70" text-anchor="middle">0.360</text><rect x="265" y="170" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="310" y="198" font-size="20" fill="#087d70" text-anchor="middle">0.400</text><rect x="265" y="258" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="310" y="286" font-size="20" fill="#087d70" text-anchor="middle">0.240</text><rect x="443" y="82" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="488" y="110" font-size="20" fill="#087d70" text-anchor="middle">0.216</text><rect x="443" y="170" width="90" height="44" rx="5" fill="#e0f4ec"/><text x="488" y="198" font-size="20" fill="#087d70" text-anchor="middle">0.304</text><rect x="443" y="258" width="90" heig