<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="322" viewBox="0 0 640 322" role="img" aria-labelledby="title desc"><title id="title">Online softmax maintains a maximum and rescales old mass when a larger score arrives</title><desc id="desc">Tile A has scores 1 and 2 and initial normaliser 1.368. Tile B has scores 5 and 0. The previous tile mass is rescaled to 0.068, new mass is 1.007 and total normaliser is 1.075. Illustrative arithmetic, not a benchmark.</desc><rect width="640" height="322" rx="18" fill="#f8fafc"/><rect x="12" y="12" width="616" height="298" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Online softmax · stable merge</text><text x="30" y="66" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Score tiles [1, 2] and [5, 0]  •  synthetic values</text><path d="M 319 81 L 319 293" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="96" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">Scores by K/V tile</text><rect x="33" y="113" width="125" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="135" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">TILE A</text><rect x="44" y="146" width="43" height="27" rx="6" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="65" y="164" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">1</text><rect x="96" y="146" width="43" height="27" rx="6" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="117" y="164" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">2</text><rect x="173" y="113" width="125" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="184" y="135" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">TILE B</text><rect x="184" y="146" width="43" height="27" rx="6" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="205" y="164" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">5</text><rect x="236" y="146" width="43" height="27" rx="6" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="257" y="164" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">0</text><text x="32" y="213" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">m = max score</text><text x="342" y="95" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">Running statistics</text><text x="342" y="120" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#b45309" text-anchor="start">m = 5</text><text x="440" y="120" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">l = 1.075</text><rect x="342" y="151" width="195" height="20" rx="4" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><rect x="342" y="151" width="8.853351943357758" height="20" rx="4" fill="#0f766e" stroke="#0f766e" stroke-width="0"/><text x="342" y="144" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="start">Rescaled old</text><text x="549" y="166" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">0.068</text><rect x="342" y="208" width="195" height="20" rx="4" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="0"/><rect x="342" y="208" width="130.8759331098811" height="20" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="342" y="201" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="start">New block</text><text x="549" y="223" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">1.007</text><rect x="29" y="243" width="279" height="47" rx="8" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="40" y="261" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="start">m_new = 5</text><text x="40" y="280" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start">l_new = e^-3 × 1.368 + 1 + e^-5</text><text x="342" y="286" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">New mass + rescaled old mass</text></svg>