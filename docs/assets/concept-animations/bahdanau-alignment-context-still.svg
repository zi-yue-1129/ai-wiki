<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">Bahdanau attention alignment by decoder step</title><desc id="figdesc">Schematic 3-by-4 alignment matrix. Every decoder output step has its own normalized probability distribution across four encoder annotations; darker cells indicate higher attention. These are illustrative numbers.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="#f7fafc"/><text x="24" y="31" fill="#20364c" font-size="19" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Bahdanau</text><text x="137" y="31" fill="#667b8d" font-size="13" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">a new alignment at each output step</text><rect x="20" y="49" width="600" height="266" rx="10" fill="#fff" stroke="#dbe6ef"/><text x="38" y="75" fill="#667b8d" font-size="12" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">ALIGNMENT α(i,j)</text><text x="265" y="98" fill="#3d80bb" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">h1</text><text x="340" y="98" fill="#3d80bb" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">h2</text><text x="415" y="98" fill="#3d80bb" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">h3</text><text x="490" y="98" fill="#3d80bb" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">h4</text><text x="125" y="138" fill="#20364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">y1</text><rect x="237" y="107" width="57" height="48" rx="7" fill="rgb(124,189,209)" stroke="#dce6e9"/><text x="265" y="136" fill="#0f5e56" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.65</text><rect x="312" y="107" width="57" height="48" rx="7" fill="rgb(202,229,235)" stroke="#dce6e9"/><text x="340" y="136" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.20</text><rect x="387" y="107" width="57" height="48" rx="7" fill="rgb(220,238,241)" stroke="#dce6e9"/><text x="415" y="136" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.10</text><rect x="462" y="107" width="57" height="48" rx="7" fill="rgb(228,243,244)" stroke="#dce6e9"/><text x="490" y="136" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.05</text><text x="125" y="207" fill="#20364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">y2</text><rect x="237" y="176" width="57" height="48" rx="7" fill="rgb(223,240,242)" stroke="#dce6e9"/><text x="265" y="205" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.08</text><rect x="312" y="176" width="57" height="48" rx="7" fill="rgb(112,183,205)" stroke="#dce6e9"/><text x="340" y="205" fill="#0f5e56" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.72</text><rect x="387" y="176" width="57" height="48" rx="7" fill="rgb(216,236,240)" stroke="#dce6e9"/><text x="415" y="205" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.12</text><rect x="462" y="176" width="57" height="48" rx="7" fill="rgb(223,240,242)" stroke="#dce6e9"/><text x="490" y="205" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.08</text><text x="125" y="276" fill="#20364c" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">y3</text><rect x="237" y="245" width="57" height="48" rx="7" fill="rgb(228,243,244)" stroke="#dce6e9"/><text x="265" y="274" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.05</text><rect x="312" y="245" width="57" height="48" rx="7" fill="rgb(211,234,238)" stroke="#dce6e9"/><text x="340" y="274" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.15</text><rect x="387" y="245" width="57" height="48" rx="7" fill="rgb(202,229,235)" stroke="#dce6e9"/><text x="415" y="274" fill="#20364c" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.20</text><rect x="462" y="245" width="57" height="48" rx="7" fill="rgb(133,194,212)" stroke="#dce6e9"/><text x="490" y="274" fill="#0f5e56" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">0.60</text><text x="568" y="121" fill="#159988" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Σ = 1</text><text x="568" y="191" fill="#159988" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Σ = 1</text><text x="568" y="261" fill="#159988" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Σ = 1</text><text x="28" y="339" fill="#667b8d" font-size="11" font-weight="500" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Each decoder step computes its own weighted context; values are illustrative.</text></svg>
