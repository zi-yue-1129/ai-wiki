<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial,sans-serif"><title id="title">LSQ surrogate scale gradient</title><desc id="desc">Four signed inputs contribute to the scale gradient. Their signed sum is minus one, gradient scaling yields minus one half, and an SGD step increases the scale to 1.1.</desc><rect width="640" height="360" rx="14" fill="#f2f7fa"/><text x="24" y="30" font-size="21" fill="#18364b" text-anchor="start" font-weight="700">LSQ · step-size gradient</text><text x="24" y="54" font-size="15" fill="#496477" text-anchor="start" font-weight="500">Signed 2-bit  ·  s = 1.0</text><text x="92" y="81" font-size="15" fill="#496477" text-anchor="middle" font-weight="700">Input</text><text x="235" y="81" font-size="15" fill="#496477" text-anchor="middle" font-weight="700">∂x̂ / ∂s</text><text x="376" y="81" font-size="15" fill="#496477" text-anchor="middle" font-weight="700">Upstream</text><text x="529" y="81" font-size="15" fill="#496477" text-anchor="middle" font-weight="700">Contribution</text><rect x="24" y="92" width="592" height="34" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="92" y="115" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-2.4</text><text x="235" y="115" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-2</text><text x="376" y="115" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">1</text><text x="529" y="115" font-size="17" fill="#a26420" text-anchor="middle" font-weight="700">-2</text><rect x="24" y="132" width="592" height="34" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="92" y="155" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-0.7</text><text x="235" y="155" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-0.3</text><text x="376" y="155" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">1</text><text x="529" y="155" font-size="17" fill="#a26420" text-anchor="middle" font-weight="700">-0.3</text><rect x="24" y="172" width="592" height="34" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="92" y="195" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">0.3</text><text x="235" y="195" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-0.3</text><text x="376" y="195" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">-1</text><text x="529" y="195" font-size="17" fill="#08756e" text-anchor="middle" font-weight="700">0.3</text><rect x="24" y="212" width="592" height="34" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="92" y="235" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">1.6</text><text x="235" y="235" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">1</text><text x="376" y="235" font-size="17" fill="#18364b" text-anchor="middle" font-weight="700">1</text><text x="529" y="235" font-size="17" fill="#08756e" text-anchor="middle" font-weight="700">1</text><rect x="24" y="263" width="186" height="60" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="117" y="282" font-size="14" fill="#496477" text-anchor="middle" font-weight="500">Running sum</text><text x="117" y="307" font-size="22" fill="#a26420" text-anchor="middle" font-weight="700">−1.0</text><path d="M211 293L224 293" stroke="#496477" stroke-width="2" fill="none"/><rect x="225" y="263" width="186" height="60" rx="5" fill="#ffffff" stroke="#d6e2eb"/><text x="318" y="282" font-size="14" fill="#496477" text-anchor="middle" font-weight="500">Scale × 0.5</text><text x="318" y="307" font-size="22" fill="#a26420" text-anchor="middle" font-weight="700">−0.5</text><path d="M412 293L425 293" stroke="#496477" stroke-width="2" fill="none"/><rect x="426" y="263" width="190" height="60" rx="5" fill="#08756e" /><text x="521" y="282" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="500">SGD  η = 0.2</text><text x="521" y="307"