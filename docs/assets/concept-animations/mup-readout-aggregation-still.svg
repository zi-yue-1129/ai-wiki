<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="mt md"><title id="mt">Illustrative muP readout aggregation over increasing width</title><desc id="md">A toy sum with all channel contributions equal to one grows with width n, whereas multiplying the same sum by one divided by n keeps the scalar output equal to one. Channel activations are fixed artificial values, not observed neural network activations.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#223a53}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;fill:#58758c}.headline{font-size:19px;font-weight:700}.sub{font-size:12px;fill:#627b91}.label{font-size:13px;font-weight:700}.small{font-size:11px;fill:#667f92}.num{font-size:20px;font-weight:700}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="18" fill="#f3f7fb" /><text x="28" y="30" class="eyebrow">WIDTH PARAMETRISATION · TOY COMPUTATION</text><text x="28" y="57" class="headline">Scaling the sum, not the observed loss</text><text x="28" y="78" class="sub">16 equal channel values · each h = 1 · readout factor 1/n</text><rect x="25" y="94" width="290" height="234" rx="14" fill="#fff" stroke="#d9e6ef" stroke-width="1.2" /><rect x="327" y="94" width="288" height="234" rx="14" fill="#fff" stroke="#d9e6ef" stroke-width="1.2" /><text x="45" y="119" class="label">Hidden contributions</text><text x="347" y="119" class="label">Readout: sum then scale</text><text x="45" y="305" class="small">n = 4 → 8 → 12 → 16</text><rect x="48" y="145" width="46" height="23" rx="5" fill="#0e9c98" opacity="1" /><circle cx="71" cy="156.5" r="2.4" fill="#fff" opacity="1" /><rect x="106" y="145" width="46" height="23" rx="5" fill="#0e9c98" opacity="1" /><circle cx="129" cy="156.5" r="2.4" fill="#fff" opacity="1" /><rect x="164" y="145" width="46" height="23" rx="5" fill="#0e9c98" opacity="1" /><circle cx="187" cy="156.5" r="2.4" fill="#fff" opacity=