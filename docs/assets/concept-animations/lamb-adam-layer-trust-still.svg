<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">LAMB Adam directions scaled to match layer parameter norms</title><desc id="desc">Two layers with unit-length Adam directions have layer weight norms 2 and 5. Their trust ratios 2 and 5 lead to illustrative step norms 0.2 and 0.5 at learning rate 0.1. The original Adam directions are maintained. No weight decay or clipping in this demonstration.</desc><style>text{font-family:Inter,Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.still{display:inline}.motion{display:none}}</style><rect x="0" y="0" width="640" height="360" rx="0" fill="#f5f8fc" stroke="none"/><rect x="19" y="16" width="6" height="22" rx="3" fill="#069b91" stroke="none"/><text x="37" y="34" font-size="17" fill="#15324a" font-weight="800" text-anchor="start">LAMB  /  MOMENTS + LAYERWISE SCALING</text><text x="611" y="33" font-size="11" fill="#657e91" font-weight="650" text-anchor="end">ADAM DIRECTION → TRUST → STEP</text><line x1="26" y1="47" x2="614" y2="47" stroke="#dbe6ef" stroke-width="1.2" /><defs><marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#4d8ac9" stroke-width="1.5"/></marker><marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#069b91" stroke-width="1.5"/></marker></defs><rect x="28" y="66" width="282" height="242" rx="13" fill="#fff" stroke="#dce7ef"/><text x="46" y="95" font-size="15" fill="#15324a" font-weight="800" text-anchor="start">LAYER A</text><rect x="206" y="74" width="88" height="30" rx="8" fill="#f2f6fa" stroke="none"/><text x="250" y="94" font-size="12" fill="#15324a" font-weight="650" text-anchor="middle">||w|| = 2</text><text x="46" y="121" font-size="11" fill="#657e91" font-weight="650" text-anchor="start">Adam direction r</text><text x="214" y="121" font-size="11" fill="#657e91" font-weight="650" text-anchor="start">Trust ρ</text><rect x="197" y="132" width="96" height="33" rx="7" fill="#e9f8f6" stroke="none"/><g ><text x="245" y="154" font-size="18" fill="#069b91" font-weight="800" text-anchor="middle">2.0</text></g><line x1="75" y1="247" x2="274" y2="247" stroke="#d0dfeb" stroke-width="1.5" /><line x1="82" y1="256" x2="82" y2="152" stroke="#d0dfeb" stroke-width="1.5" /><line x1="140" y1="196" x2="140" y2="247" stroke="#e6edf3" stroke-width="1" stroke-dasharray="3 4"/><path d="M 82 247 L 138 198" fill="none" stroke="#4d8ac9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" ></path><path d="M 175 260 L 215.6 224.5" fill="none" stroke="#069b91" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)" ></path><text x="48" y="290" font-size="12" fill="#4d8ac9" font-weight="700" text-anchor="start">||r|| = 1</text><text x="293" y="290" font-size="12" fill="#069b91" font-weight="750" text-anchor="end">||Δ|| = .20</text><rect x="325" y="66" width="282" height="242" rx="13" fill="#fff" stroke="#dce7ef"/><text x="343" y="95" font-size="15" fill="#15324a" font-weight="800" text-anchor="start">LAYER B</text><rect x="503" y="74" width="88" height="30" rx="8" fill="#f2f6fa" stroke="none"/><text x="547" y="94" font-size="12" fill="#15324a" font-weight="650" text-anchor="middle">||w|| = 5</text><text x="343" y="121" font-size="11" fill="#657e91" font-weight="650" text-anchor="start">Adam direction r</text><text x="511" y="121" font-size="11" fill="#657e91" font-weight="650" text-anchor="start">Trust ρ</text><rect x="494" y="132" width="96" height="33" rx="7" fill="#e9f8f6" stroke="none"/><g ><text x="542" y="154" font-size="18" fill="#069b91" font-weight="800" text-anchor="middle">5.0</text></g><line x1="372" y1="247" x2="571" y2="247" stroke="#d0dfeb" stroke-width="1.5" /><line x1="379" y1="256" x2="379" y2="152" stroke="#d0dfeb" stroke-width="1.5" /><line x1="437" y1="196" x2="437" y2="247" stroke="#e6edf3" stroke-width="1" stroke-dasharray="3 4"/><path d="M 379 247 L 435 198" fill="none" stroke="#4d8ac9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" ></path><path d="M 472 260 L 572.8 171.8" fill="none" stroke="#069b91" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-teal)" ></path><text x="345" y="290" font-size="12" fill="#4d8ac9" font-weight="700" text-anchor="start">||r|| = 1</text><text x="590" y="290" font-size="12" fill="#069b91" font-weight="750" text-anchor="end">||Δ|| = .50</text><line x1="27" y1="323" x2="613" y2="323" stroke="#dbe6ef" stroke-width="1" /><text x="31" y="344" font-size="11" fill="#657e91" font-weight="500" text-anchor="start">Illustrative: λ = 0  ·  φ(z) = z  ·  learning rate = 0.1</text></svg>