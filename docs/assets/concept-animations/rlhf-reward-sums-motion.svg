ont-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="middle" font-weight="600">+2</text><rect x="324" y="107" width="75" height="31" rx="8" fill="#edf5f7" stroke="#dbe5ee" /><text x="361.5" y="128" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="middle" font-weight="600">+1</text><path d="M405 122 H465" stroke="#b8c5d3" stroke-width="2" stroke-dasharray="4 5"/><rect x="484" y="104" width="101" height="40" rx="9" fill="#e9f0f6" stroke="none" /><text x="535" y="129" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#078c87" text-anchor="middle" font-weight="700">Σ</text><circle cx="154" cy="101" r="7" fill="#078c87" stroke="#fff" stroke-width="2"><animate attributeName="cx" values="154;154;258;362;362" keyTimes="0;0.08;0.38;0.7;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></circle><g opacity="0"><rect x="485" y="104" width="99" height="40" rx="9" fill="#ffffff" stroke="#dbe5ee" /><text x="535" y="130" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#078c87" text-anchor="middle" font-weight="700">1</text><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.16;0.44;0.76;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0"><rect x="485" y="104" width="99" height="40" rx="9" fill="#ffffff" stroke="#dbe5ee" /><text x="535" y="130" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#078c87" text-anchor="middle" font-weight="700">3</text><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.16;0.44;0.76;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0"><rect x="485" y="104" width="99" height="40" rx="9" fill="#ffffff" stroke="#dbe5ee" /><text x="535" y="130" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#078c87" text-anchor="middle" font-weight="700">4</text><animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.16;0.44;0.76;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></g><rect x="35" y="175" width="566" height="68" rx="11" fill="#fbfdff" stroke="#dbe5ee" /><rect x="49" y="187" width="40" height="40" rx="10" fill="#de8743" stroke="none" /><text x="69" y="214" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">B</text><rect x="116" y="191" width="75" height="31" rx="8" fill="#edf5f7" stroke="#dbe5ee" /><text x="153.5" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="middle" font-weight="600">+1</text><rect x="220" y="191" width="75" height="31" rx="8" fill="#e9f0f6" stroke="#dbe5ee" /><text x="257.5" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="middle" font-weight="600">+0</text><rect x="324" y="191" width="75" height="31" rx="8" fill="#edf5f7" stroke="#dbe5ee" /><text x="361.5" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1e3349" text-anchor="middle" font-weight="600">+1</text><path d="M405 206 H465" stroke="#b8c5d3" stroke-width="2" stroke-dasharray="4 5"/><rect x="484" y="188" width="101" height="40" rx="9" fill="#e9f0f6" stroke="none" /><text x="535" y="213" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#de8743" text-anchor="middle" font-weight="700">Σ</text><circle cx="154" cy="185" r="7" fill="#de8743" stroke="#fff" stroke-width="2"><animate attributeName="cx" values="154;154;258;362;362" keyTimes="0;0.08;0.38;0.7;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></circle><g opacity="0"><rect x="485" y="188" width="99" height="40" rx="9" fill="#ffffff" stroke="#dbe5ee" /><text x="535" y="214" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#de8743" text-anchor="middle" font-weight="700">1</text><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.16;0.44;0.76;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></g><g opacity="0"><rect x="485" y="188" width="99" height="40"