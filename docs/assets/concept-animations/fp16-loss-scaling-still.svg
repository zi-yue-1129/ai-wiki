<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Loss scaling prevents FP16 gradient underflow</title><desc id="svgdesc">A tiny artificial gradient rounds to zero with direct FP16 casting. Scaling by 1024 before FP16 storage and unscaling in FP32 recovers its original value, provided values stay representable.</desc><rect width="640" height="360" fill="#10192b"/><g font-family="Inter,Arial,sans-serif"><text x="24" y="36" font-size="18" font-weight="700" fill="#e7f1fb" text-anchor="start" >FP16 LOSS SCALING</text><text x="616" y="36" font-size="11" font-weight="500" fill="#9fb5c9" text-anchor="end" >illustrative gradient</text><path d="M24 50 L616 50" stroke="#33475e" stroke-width="1" fill="none" stroke-linecap="round" /><rect x="24" y="65" width="592" height="54" rx="10" fill="#19273b" stroke="#33475e" stroke-width="1" /><text x="40" y="87" font-size="10" font-weight="700" fill="#9fb5c9" text-anchor="start" >INPUT GRADIENT</text><text x="40" y="108" font-size="17" font-weight="700" fill="#e7f1fb" text-anchor="start" >g = 2⁻²⁷  ≈ 7.45×10⁻⁹</text><text x="25" y="153" font-size="11" font-weight="700" fill="#f17d8d" text-anchor="start" >DIRECT FP16</text><rect x="23" y="164" width="594" height="55" rx="10" fill="#251f30" stroke="#6a4455" stroke-width="1" /><rect x="165" y="174" width="132" height="35" rx="7" fill="#4a293b" stroke="#995367" stroke-width="1" /><text x="231" y="196" font-size="12" font-weight="600" fill="#e7f1fb" text-anchor="middle" >Cast to FP16</text><path d="M299 191 L428 191" stroke="#f17d8d" stroke-width="2" fill="none" stroke-linecap="round" /><text x="427" y="195" font-size="20" font-weight="600" fill="#f17d8d" text-anchor="middle" >→</text><rect x="450" y="174" width="145" height="35" rx="7" fill="#4a293b" stroke="#995367" stroke-width="1" /><text x="522" y="196" font-size="12" font-weight="700" fill="#ffb2be" text-anchor="middle" >0  (underflow)</text><text x="25" y="246" font-size="11" font-weight="700" fill="#42d8c2" text-anchor="start" >SCALED PATH</text><rect x="23" y="256" width="594" height="69" rx="10" fill="#17313c" stroke="#287e79" stroke-width="1" /><rect x="32" y="271" width="112" height="36" rx="7" fill="#1c4d52" stroke="#438a8f" stroke-width="1" /><text x="88.0" y="294" font-size="13" font-weight="700" fill="#e7f1fb" text-anchor="middle" >× 2¹⁰</text><rect x="165" y="271" width="132" height="36" rx="7" fill="#1c4d52" stroke="#42d8c2" stroke-width="1" /><text x="231.0" y="294" font-size="13" font-weight="700" fill="#e7f1fb" text-anchor="middle" >FP16: 2⁻¹⁷</text><rect x="318" y="271" width="123" height="36" rx="7" fill="#1c4d52" stroke="#438a8f" stroke-width="1" /><text x="379.5" y="294" font-size="13" font-weight="700" fill="#e7f1fb" text-anchor="middle" >÷ 2¹⁰</text><rect x="462" y="271" width="146" height="36" rx="7" fill="#1c4d52" stroke="#42d8c2" stroke-width="1" /><text x="535.0" y="294" font-size="13" font-weight="700" fill="#e7f1fb" text-anchor="middle" >FP32: 2⁻²⁷</text><path d="M144 289 L165 289" stroke="#42d8c2" stroke-width="2.5" fill="none" stroke-linecap="round" /><path d="M297 289 L318 289" stroke="#42d8c2" stroke-width="2.5" fill="none" stroke-linecap="round" /><path d="M441 289 L462 289" stroke="#42d8c2" stroke-width="2.5" fill="none" stroke-linecap="round" /><text x="605" y="342" font-size="11" font-weight="500" fill="#9fb5c9" text-anchor="end" >FP16 min subnormal: 2⁻²⁴</text></g></svg>