<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif"><title id="title">Rematerialization trade-off</title><desc id="desc">The same pure a=f(x) is used by b=g(a) and y=k(a,c), with c=h(b). Dropping a after b and recomputing it after c reduces peak internal temporaries from three to two, excluding external x and y. Equal-size buffers, no in-place aliasing.</desc><rect width="640" height="360" rx="12" fill="#101b2d"/><text x="320" y="35" font-size="28" fill="#eef4ff" text-anchor="middle">Rematerialization trade-off</text><text x="320" y="65" font-size="20" fill="#aebed1" text-anchor="middle">Live temporaries during operation</text><rect x="10" y="126" width="620" height="66" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="20" y="167" font-size="25" fill="#eef4ff" text-anchor="start">Keep</text><rect x="10" y="204" width="620" height="66" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="20" y="245" font-size="25" fill="#eef4ff" text-anchor="start">Remat</text><g id="column-0" opacity="1"><text x="196" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">a=f(x)</text><rect x="174" y="137" width="44" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="196" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="174" y="215" width="44" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="196" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">a</text></g><g id="column-1" opacity="1"><text x="292" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">b=g(a)</text><rect x="251.5" y="137" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="271" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="293.5" y="137" width="39" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="313" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">b</text><rect x="251.5" y="215" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="271" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="293.5" y="215" width="39" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="313" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">b</text></g><g id="column-2" opacity="1"><text x="388" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">c=h(b)</text><rect x="347.5" y="137" width="25" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="360" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="375.5" y="137" width="25" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="388" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">b</text><rect x="403.5" y="137" width="25" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="416" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">c</text><rect x="347.5" y="215" width="39" height="43" rx="7" fill="#7358a5" stroke="none" stroke-width="1"/><text x="367" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">b</text><rect x="389.5" y="215" width="39" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="409" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">c</text></g><g id="column-3" opacity="1"><text x="484" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">Remat a</text><rect x="443.5" y="137" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="463" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="485.5" y="137" width="39" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="505" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">c</text><rect x="443.5" y="215" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="463" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="485.5" y="215" width="39" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="505" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">c</text></g><g id="column-4" opacity="1"><text x="580" y="108" font-size="22" fill="#eef4ff" text-anchor="middle">y=k(a,c)</text><rect x="539.5" y="137" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="559" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="581.5" y="137" width="39" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="601" y="166" font-size="24" fill="#eef4ff" text-anchor="middle">c</text><rect x="539.5" y="215" width="39" height="43" rx="7" fill="#176d65" stroke="none" stroke-width="1"/><text x="559" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">a</text><rect x="581.5" y="215" width="39" height="43" rx="7" fill="#9a652d" stroke="none" stroke-width="1"/><text x="601" y="244" font-size="24" fill="#eef4ff" text-anchor="middle">c</text></g><rect x="12" y="306" width="300" height="41" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><rect x="328" y="306" width="300" height="41" rx="7" fill="#192a40" stroke="none" stroke-width="1"/><text x="162" y="333" font-size="24" fill="#eef4ff" text-anchor="middle">Peak: 3 → 2</text><text x="478" y="333" font-size="24" fill="#eef4ff" text-anchor="middle">f calls: 1 → 2</text></svg>