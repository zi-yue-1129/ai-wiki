<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="gradscaler-title gradscaler-detail"><title id="gradscaler-title">Dynamic loss-scale adjustment after finite and overflowing gradients</title><desc id="gradscaler-detail">Synthetic six-iteration GradScaler example: with growth interval 2, growth factor 2 and backoff factor 0.5, the scale used in iterations one through six is 1024, 1024, 2048, 1024, 1024, 2048. Both example gradients remain finite at 1024, so two successful iterations permit growth to 2048; the large scaled gradient overflows at 2048, skipping that optimizer step and reducing the next scale to 1024. The second overflow also backs off after the sixth iteration. the full trajectory and outcome labels remain visible without motion. This is illustrative, not measured training data. The growth interval is deliberately shortened from the PyTorch default of 2000 for teaching.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.moving{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="37" font-size="21" font-weight="750" fill="#18364d">DYNAMIC LOSS SCALE</text><text x="24" y="58" font-size="11.5" fill="#5c7185">Illustrative: growth interval = 2 · growth ×2 · backoff ×0.5</text><rect x="24" y="73" width="592" height="209" rx="11" fill="#ffffff" stroke="#d7e3ec"/><text x="42" y="96" font-size="11" fill="#5b7185" font-weight="700">SCALE</text><line x1="96" y1="115" x2="589" y2="115" stroke="#dde7ed" stroke-dasharray="4 5"/><line x1="96" y1="185" x2="589" y2="185" stroke="#dde7ed" stroke-dasharray="4 5"/><text x="90" y="119" text-anchor="end" font-size="12" fill="#526b82">2048</text><text x="90" y="189" text-anchor="end" font-size="12" fill="#526b82">1024</text><path d="M 133 185 L 218 185 L 303 115 L 388 185 L 473 185 L 558 115" fill="none" stroke="#819bb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="133" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="133" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t1</text><text x="133" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="218" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="218" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t2</text><text x="218" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="303" cy="115" r="11" fill="#b66c39" stroke="#fff" stroke-width="3"/><text x="303" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t3</text><text x="303" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#b66c39">INF</text><circle cx="388" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="388" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t4</text><text x="388" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="473" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="473" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t5</text><text x="473" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="558" cy="115" r="11" fill="#b66c39" stroke="#fff" stroke-width="3"/><text x="558" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t6</text><text x="558" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#b66c39">INF</text><path d="M 235 174 L 268 145" stroke="#16857f" stroke-width="1.5" fill="none"/><path d="M 262 145 L 268 145 L 266 151" fill="none" stroke="#16857f" stroke-width="1.5"/><path d="M 322 126 L 362 161" stroke="#b66c39" stroke-width="1.5" fill="none"/><path d="M 356 159 L 362 161 L 361 155" fill="none" stroke="#b66c39" stroke-width="1.5"/><text x="26" y="308" font-size="12" fill="#16857f" font-weight="700">OK → STEP</text><text x="190" y="308" font-size="12" fill="#b66c39" font-weight="700">INF → SKIP</text><text x="367" y="308" font-size="11" fill="#5a7084">Scale updates after each step check</text><rect x="24" y="320" width="592" height="25" rx="7" fill="#e9eff5"/><text x="320" y="337" text-anchor="middle" font-size="11.5" fill="#344f67">Two OK checks → grow next scale · Inf → skip update and back off</text></svg>