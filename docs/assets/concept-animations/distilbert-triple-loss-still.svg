<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">DistilBERT triple objective</title><desc id="desc">Soft target cross entropy, masked token cross entropy and cosine loss combine into a student-only training objective. Teacher targets remain fixed.</desc><rect width="640" height="360" rx="10" fill="#ffffff"/><g font-family="Arial, sans-serif"><text x="320" y="26" font-size="21" fill="#24374a" text-anchor="middle">DistilBERT: three training signals</text><rect x="12" y="43" width="198" height="110" rx="6" fill="#e8eef4"/><text x="111" y="65" font-size="17" fill="#24374a" text-anchor="middle">Soft targets</text><text x="111" y="99" font-size="16" fill="#315c85" text-anchor="middle">Teacher: .6 .3 .1</text><text x="111" y="126" font-size="16" fill="#08766f" text-anchor="middle">Student: .5 .25 .25</text><path d="M111 153V178" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="31" y="179" width="160" height="65" rx="6" fill="#315c85"/><text x="111" y="202" font-size="16" fill="#ffffff" text-anchor="middle">Soft CE</text><text x="111" y="229" font-size="21" fill="#ffffff" text-anchor="middle">0.970</text><rect x="221" y="43" width="198" height="110" rx="6" fill="#e8eef4"/><text x="320" y="65" font-size="17" fill="#24374a" text-anchor="middle">Masked token</text><text x="320" y="99" font-size="16" fill="#a05c20" text-anchor="middle">Label: B</text><text x="320" y="126" font-size="16" fill="#08766f" text-anchor="middle">Student B: .25</text><path d="M320 153V178" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="179" width="160" height="65" rx="6" fill="#315c85"/><text x="320" y="202" font-size="16" fill="#ffffff" text-anchor="middle">MLM CE</text><text x="320" y="229" font-size="21" fill="#ffffff" text-anchor="middle">1.386</text><rect x="430" y="43" width="198" height="110" rx="6" fill="#e8eef4"/><text x="529" y="65" font-size="17" fill="#24374a" text-anchor="middle">Hidden states</text><text x="529" y="99" font-size="16" fill="#315c85" text-anchor="middle">Teacher: (1, 0)</text><text x="529" y="126" font-size="16" fill="#08766f" text-anchor="middle">Student: (3, 4)</text><path d="M529 153V178" stroke="#315c85" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="449" y="179" width="160" height="65" rx="6" fill="#315c85"/><text x="529" y="202" font-size="16" fill="#ffffff" text-anchor="middle">Cosine loss</text><text x="529" y="229" font-size="21" fill="#ffffff" text-anchor="middle">0.400</text><path d="M111 244V259H320V270" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 244V259H320V270" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M529 244V259H320V270" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="271" width="196" height="36" rx="6" fill="#08766f"/><text x="320" y="295" font-size="21" fill="#ffffff" text-anchor="middle">Total = 2.757</text><path d="M320 307V319" stroke="#08766f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="344" font-size="19" fill="#08766f" text-anchor="middle">Update student only</text></g></svg>
