<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Place-cell firing along a continuous loop</title><desc id="desc">A moving position passes through three Gaussian place fields. Their activity bars change continuously with distance. All rates are schematic, not measured spikes.</desc><rect width="640" height="360" rx="16" fill="#f5f9fc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#233c50}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.3px;fill:#698295}.muted{font-size:12px;fill:#698295}.label{font-size:13px;font-weight:700}</style><text x="28" y="35" class="eyebrow">PLACE-CELL POPULATION</text><text x="29" y="59" class="muted">Position-dependent activity</text><rect x="28" y="75" width="411" height="239" rx="13" fill="white" stroke="#d7e3eb"/><rect x="454" y="75" width="158" height="239" rx="13" fill="white" stroke="#d7e3eb"/><text x="469" y="99" class="muted">FIRING RATE</text><ellipse cx="234" cy="182" rx="155" ry="62" fill="none" stroke="#d7e3eb" stroke-width="3" stroke-dasharray="4 8"/><circle cx="389" cy="182" r="52" fill="#3b7fbb" fill-opacity=".10" stroke="#3b7fbb" stroke-opacity=".4" stroke-width="1.5"/><circle cx="389" cy="182" r="8" fill="#3b7fbb" fill-opacity=".8"/><text x="389" y="163" class="label" text-anchor="middle">A</text><text x="470" y="130" class="label">A</text><rect x="489" y="117" width="107" height="18" rx="5" fill="#e9f0f5"/><rect x="489" y="117" width="93.66" height="18" rx="5" fill="#3b7fbb"></rect><circle cx="234" cy="244" r="52" fill="#14867d" fill-opacity=".10" stroke="#14867d" stroke-opacity=".4" stroke-width="1.5"/><circle cx="234" cy="244" r="8" fill="#14867d" fill-opacity=".8"/><text x="234" y="225" class="label" text-anchor="middle">B</text><text x="470" y="189" class="label">B</text><rect x="489" y="176" width="107" height="18" rx="5" fill="#e9f0f5"/><rect x="489" y="176" width="1.03" height="18" rx="5" fill="#14867d"></rect><circle cx="79" cy="182" r="52" fill="#816ac1" fill-opacity=".10" stroke="#816ac1" stroke-opacity=".4" stroke-width="1.5"/><circle cx="79" cy="182" r="8" fill="#816ac1" fill-opacity=".8"/><text x="79" y="163" class="label" text-anchor="middle">C</text><text x="470" y="248" class="label">C</text><rect x="489" y="235" width="107" height="18" rx="5" fill="#e9f0f5"/><rect x="489" y="235" width="0.00" height="18" rx="5" fill="#816ac1"></rect><circle cx="378.12" cy="204.82" r="15" fill="#e79540" fill-opacity=".16" ></circle><circle cx="378.12" cy="204.82" r="7" fill="#e79540" fill-opacity="1" stroke="white" stroke-width="2"></circle><text x="28" y="337" class="muted">Gaussian fields &#183; illustrative rates, not recorded spikes</text></svg>