<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 548" role="img" aria-labelledby="title desc"><title id="title">Dueling network: value plus centred advantages produces per-action Q values</title><desc id="desc">One shared feature encoder splits into scalar state value V equal to 3 and advantages [+2, 0, -1]. Subtracting their mean, one third, yields centred advantages [+1.67, -0.33, -1.33]. Adding V gives Q values [4.67, 2.67, 1.67]. Illustrative, not trained weights.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduce-only{display:inline!important}}</style><rect x="0" y="0" width="440" height="548" rx="18" fill="#f7fafc" stroke="none" stroke-width="0"/><rect x="1" y="1" width="438" height="546" rx="17" fill="none" stroke="#dbe5ee" stroke-width="1"/><text x="220" y="45" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#24364c" text-anchor="middle">Dueling · Q Head</text><path d="M25 62L415 62" fill="none" stroke="#dbe5ee" stroke-width="1" stroke-linecap="round" /><rect x="135" y="85" width="170" height="46" rx="12" fill="#e8effa" stroke="#dbe5ee" stroke-width="1"/><text x="220" y="115" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#3568b7" text-anchor="middle">Shared features</text><path d="M176 132L118 184" fill="none" stroke="#60718a" stroke-width="2" stroke-linecap="round" /><path d="M266 132L323 184" fill="none" stroke="#60718a" stroke-width="2" stroke-linecap="round" /><rect x="36" y="188" width="169" height="92" rx="13" fill="#ffffff" stroke="#dbe5ee" stroke-width="2"/><rect x="236" y="188" width="169" height="92" rx="13" fill="#ffffff" stroke="#dbe5ee" stroke-width="2"/><text x="119" y="217" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#3568b7" text-anchor="middle">Value V</text><text x="119" y="256" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#3568b7" text-anchor="middle">3.00</text><text x="322" y="217" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ce712a" text-anchor="middle">Advantage A</text><text x="322" y="254" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#ce712a" text-anchor="middle">+2   0   −1</text><circle cx="220" cy="159" r="6" fill="#087f82" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.20;.36;.44;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></circle><path d="M322 281L322 302" fill="none" stroke="#60718a" stroke-width="2" stroke-linecap="round" /><rect x="68" y="311" width="304" height="71" rx="13" fill="#eef7f5" stroke="#cbe9e1" stroke-width="1.5"/><text x="220" y="337" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#128066" text-anchor="middle">Center advantages</text><text x="220" y="365" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#128066" text-anchor="middle">+1.67     −0.33     −1.33</text><rect x="68" y="311" width="304" height="71" rx="13" fill="none" stroke="#087f82" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.29;.47;.83;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><path d="M220 384L220 402" fill="none" stroke="#60718a" stroke-width="2" stroke-linecap="round" /><text x="220" y="420" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#24364c" text-anchor="middle">Q = V + centered A</text><rect x="83" y="500" width="50" height="0" rx="7" fill="#087f82" stroke="none" stroke-width="0"><animate attributeName="height" values="0;0;55.06666706000001;55.06666706000001;0" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="y" values="500;500;444.93333294;444.93333294;500" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><text x="108" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#24364c" text-anchor="middle">A  4.67</text><rect x="195" y="500" width="50" height="0" rx="7" fill="#3568b7" stroke="none" stroke-width="0"><animate attributeName="height" values="0;0;31.466667060000002;31.466667060000002;0" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="y" values="500;500;468.53333294;468.53333294;500" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><text x="220" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#24364c" text-anchor="middle">B  2.67</text><rect x="307" y="500" width="50" height="0" rx="7" fill="#3568b7" stroke="none" stroke-width="0"><animate attributeName="height" values="0;0;19.66666706;19.66666706;0" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="y" values="500;500;480.33333294;480.33333294;500" keyTimes="0;.44;.72;.92;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></rect><text x="332" y="524" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#24364c" text-anchor="middle">C  1.67</text></svg>