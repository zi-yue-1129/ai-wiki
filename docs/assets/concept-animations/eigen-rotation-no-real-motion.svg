<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">A ninety-degree rotation has no nonzero real eigenvector</title><desc id="desc">A real input vector and its ninety-degree rotated image remain perpendicular. Applying R repeatedly walks around four distinct unit-vector positions.</desc><defs><marker id="tip-t" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#0a8f91"/></marker><marker id="tip-o" markerWidth="7" markerHeight="7" refX="5.7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#e1844f"/></marker></defs><rect width="800" height="420" rx="18" fill="#f7fafc"/><text x="34" y="43" font-family="system-ui,Arial,sans-serif" font-size="21" fill="#17304a" font-weight="750" >ROTATION ≠ REAL SCALING</text><text x="34" y="63" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="500" >R = [0  -1; 1  0]</text><rect x="34" y="84" width="420" height="287" rx="17" fill="#fff" stroke="#dae3ed" stroke-width="1.5"/><rect x="470" y="84" width="296" height="287" rx="17" fill="#fff" stroke="#dae3ed" stroke-width="1.5"/><text x="56" y="118" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#17304a" font-weight="750" >ITERATED ACTION</text><text x="494" y="118" font-family="system-ui,Arial,sans-serif" font-size="16" fill="#17304a" font-weight="750" >FOUR-STEP ORBIT</text><line x1="104.00" y1="229.00" x2="376.00" y2="229.00" stroke="#e3eaf0" stroke-width="1.3" /><line x1="240.00" y1="102.00" x2="240.00" y2="356.00" stroke="#e3eaf0" stroke-width="1.3" /><circle cx="240" cy="229" r="105" fill="none" stroke="#c8d7e2" stroke-width="2.4"/><g transform="rotate(0 240 229)"><animateTransform attributeName="transform" type="rotate" values="0 240 229;0 240 229;-90 240 229;-90 240 229;-180 240 229;-180 240 229;-270 240 229;-270 240 229;-360 240 229" keyTimes="0.00;0.08;0.20;0.28;0.40;0.48;0.60;0.68;1.00" dur="12s" calcMode="linear" repeatCount="indefinite"/><line x1="240" y1="229" x2="345" y2="229" stroke="#e1844f" stroke-width="4.8" marker-end="url(#tip-o)" stroke-linecap="round"/><line x1="240" y1="229" x2="240" y2="124" stroke="#0a8f91" stroke-width="4.4" stroke-linecap="round" marker-end="url(#tip-t)"/><circle cx="240" cy="124" r="6.0" fill="#0a8f91" stroke="#fff" stroke-width="2"/><path d="M267 229 A27 27 0 0 0 240 202" fill="none" stroke="#6683d6" stroke-width="2.6"/></g><text x="618" y="62" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#6683d6" font-weight="700" >90° / STEP</text><text x="68" y="358" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#e1844f" font-weight="750" >Previous</text><text x="165" y="358" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#0a8f91" font-weight="750" >Next = R · Previous</text><circle cx="620" cy="221" r="69" fill="none" stroke="#cbd8e5" stroke-width="2"/><circle cx="689.00" cy="221.00" r="9" fill="#e8eef6" stroke="#9bb1c5" stroke-width="1.5"/><text x="704.00" y="208.00" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="650" >k=0</text><circle cx="620.00" cy="152.00" r="9" fill="#e8eef6" stroke="#9bb1c5" stroke-width="1.5"/><text x="617.00" y="140.00" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="650" >k=1</text><circle cx="551.00" cy="221.00" r="9" fill="#e8eef6" stroke="#9bb1c5" stroke-width="1.5"/><text x="518.00" y="208.00" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="650" >k=2</text><circle cx="620.00" cy="290.00" r="9" fill="#e8eef6" stroke="#9bb1c5" stroke-width="1.5"/><text x="617.00" y="315.00" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#61788e" font-weight="650" >k=3</text><circle cx="620" cy="152" r="10" fill="#0a8f91" stroke="#fff" stroke-width="2"><animate attributeName="cx" values="620.00;620.00;551.00;551.00