<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 644" role="img" aria-labelledby="title desc"><title id="title">Maximisation bias from four equally likely noisy Q estimates</title><desc id="desc">Four equally likely pairs of independent plus-or-minus-one errors around a true value of four. The maximum of estimates has exact average four point five while the estimate for action B, selected independently of the estimation noise, averages four. All numbers are illustrative.</desc><rect width="440" height="644" fill="#ffffff"/><text x="22" y="34" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#19324c">Noisy value backups</text><text x="22" y="57" font-family="Arial,sans-serif" font-size="15" fill="#54657a">True Q = 4  ·  next action = B</text><g id="noise-case-1"><rect x="20" y="74" width="400" height="100" rx="12" fill="#f7f9fc" stroke="#d2deeb"/><text x="33" y="98" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#344960">Case 1</text><path d="M87 122 H202" stroke="#9db2c6" stroke-dasharray="3 3" stroke-width="1"/><rect x="111" y="110" width="25" height="50" rx="4" fill="#4d86b5"/><text x="123.5" y="111" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#344960">5</text><text x="123.5" y="171" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#67798a">A</text><rect x="173" y="110" width="25" height="50" rx="4" fill="#ca8a47"/><text x="185.5" y="111" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#344960">5</text><text x="185.5" y="171" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" fill="#67798a">B</text><path d="M215 126 H240" stroke="#95a9bc" stroke-width="2" stroke-linecap="round"/><path d="M238 122 L244 126 L238 130" fill="none" stroke="#95a9bc" stroke-width="2"/><text x="252" y="106" font-family="Arial,sans-serif" font-size="13" fill="#54657a">max</text><text x="341" y="106" font-family="Arial,sans-serif" font-size="13" f