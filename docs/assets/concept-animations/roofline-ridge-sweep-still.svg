<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>Roofline: bandwidth and compute ceilings</title><desc>A marker moves along the log-log attainable-performance ceiling. It rises with arithmetic intensity until the ridge and then remains at peak compute throughput.</desc><rect width="640" height="360" rx="18" fill="#0B1426"/><rect x="12" y="12" width="616" height="336" rx="14" fill="#101E34" stroke="#304361"/><text x="34" y="39" fill="#E9F1FC" font-family="system-ui,Arial,sans-serif" font-size="22" text-anchor="start">ROOFLINE</text><text x="477" y="38" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="start">B = 4  |  Peak = 32</text><line x1="100" y1="65" x2="100" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="100" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">0.5</text><line x1="165" y1="65" x2="165" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="165" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">1</text><line x1="230" y1="65" x2="230" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="230" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">2</text><line x1="295" y1="65" x2="295" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="295" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">4</text><line x1="360" y1="65" x2="360" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="360" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">8</text><line x1="425" y1="65" x2="425" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="425" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">16</text><line x1="490" y1="65" x2="490" y2="291" stroke="#304361" stroke-width="0.8" stroke-dasharray="3 5"/><text x="490" y="315" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="middle">32</text><line x1="100" y1="289" x2="490" y2="289" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="293" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">1</text><line x1="100" y1="245.6" x2="490" y2="245.6" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="249.6" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">2</text><line x1="100" y1="202.2" x2="490" y2="202.2" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="206.2" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">4</text><line x1="100" y1="158.8" x2="490" y2="158.8" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="162.8" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">8</text><line x1="100" y1="115.4" x2="490" y2="115.4" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="119.4" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">16</text><line x1="100" y1="72" x2="490" y2="72" stroke="#304361" stroke-width="0.7" stroke-dasharray="3 5"/><text x="83" y="76" fill="#ACBDD2" font-family="system-ui,Arial,sans-serif" font-size="11" text-anchor="end">32</text><line x1="100" y1="65" x2="100" y2="290" stroke="#ACBDD2" stroke-width="1.2" /><line x1="100" y1="290" x2="492" y2="290" stroke="#ACBDD2" stroke-width="1.2" /><path d="M100 245 L165 202 L230 159 L295 116 L360 72 L425 72 L490 72" stroke="#45DDC4" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="360" y1="73" x2="360" y2="29