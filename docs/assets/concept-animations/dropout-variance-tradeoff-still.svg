<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Inverted dropout: stable mean, growing variance</title><desc id="desc">As the keep probability falls, the nonzero activation moves farther from zero, zero-mask probability increases, the mean stays at two and the variance increases. Synthetic scalar activation h equals two.</desc><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f7fafc}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7fafc"/><text x="26" y="34" font-size="18" fill="#18344c" font-weight="700" text-anchor="start">INVERTED DROPOUT</text><text x="614" y="34" font-size="13" fill="#088a82" font-weight="700" text-anchor="end">h = 2</text><rect x="24" y="56" width="396" height="280" rx="12" fill="#fff" stroke="#cbd8e2"/><rect x="430" y="56" width="186" height="280" rx="12" fill="#fff" stroke="#cbd8e2"/><text x="45" y="82" font-size="13" fill="#18344c" font-weight="700" text-anchor="start">TWO OUTCOMES</text><text x="454" y="82" font-size="13" fill="#18344c" font-weight="700" text-anchor="start">MOMENTS</text><text x="45" y="111" font-size="12" fill="#506578" font-weight="400" text-anchor="start">Keep probability</text><text x="390" y="111" font-size="12" fill="#506578" font-weight="600" text-anchor="end">1.00 → 0.25</text><rect x="70" y="130" width="310" height="5" rx="2.5" fill="#dce9ee"/><circle cx="173.33" cy="132" r="9" fill="#088a82"></circle><text x="67" y="154" font-size="11" fill="#506578" font-weight="400" text-anchor="start">0.25</text><text x="383" y="154" font-size="11" fill="#506578" font-weight="400" text-anchor="end">1.00</text><path d="M52 259H399" stroke="#cbd8e2" stroke-width="2"/><path d="M55 259v5" stroke="#cbd8e2"/><text x="55" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">0</text><path d="M140 259v5" stroke="#cbd8e2"/><text x="140" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">2</text><path d="M225 259v5" stroke="#cbd8e2"/><text x="225" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">4</text><path d="M310 259v5" stroke="#cbd8e2"/><text x="310" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">6</text><path d="M395 259v5" stroke="#cbd8e2"/><text x="395" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">8</text><text x="55" y="304" font-size="12" fill="#ed8759" font-weight="650" text-anchor="start">masked = 0</text><text x="390" y="304" font-size="12" fill="#088a82" font-weight="650" text-anchor="end">kept = h / p</text><path d="M55 190V259" stroke="#ed8759" stroke-width="2" stroke-dasharray="4 4"/><circle cx="55" cy="219" r="14.73" fill="#ed8759" stroke="#fff" stroke-width="2"></circle><circle cx="225" cy="219" r="14.73" fill="#088a82" stroke="#fff" stroke-width="2"></circle><text x="473" y="116" font-size="12" fill="#506578" font-weight="700" text-anchor="start">MEAN</text><text x="551" y="116" font-size="12" fill="#506578" font-weight="700" text-anchor="start">VAR</text><path d="M450 264H593" stroke="#cbd8e2" stroke-width="2"/><rect x="471" y="242" width="27" height="22" rx="4" fill="#088a82"/><rect x="551" y="223.2" width="27" height="40.8" rx="4" fill="#ed8759"></rect><text x="484" y="289" font-size="13" fill="#088a82" font-weight="700" text-anchor="middle">2</text><text x="564" y="289" font-size="12" fill="#ed8759" font-weight="700" text-anchor="middle">4.0</text><text x="453" y="307" font-size="12" fill="#506578" font-weight="400" text-anchor="start">E[y] = h</text><text x="453" y="323" font-size="12" fill="#506578" font-weight="400" text-anchor="start">Var[y] = h²(1-p)/p</text></svg>