<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Prior shift can switch the best decision</title><desc id="desc">For six synthetic ranked labels plus minus plus plus minus minus, the same fixed ROC supports two eligible decision thresholds. As deployment prevalence rises from five to sixty percent with false-negative cost two and false-positive cost one, the minimum-cost choice switches from accepting the top one to accepting the top four at prevalence twenty percent. All rates and costs are invented.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#233d50}.head{font-size:17px;font-weight:750}.cap{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#597284}.tiny{font-size:10px;fill:#597284}.warm{fill:#c06535}.cool{fill:#207c86}.moving{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="23" y="32" class="head">Prior shift · optimal cutoff</text><rect x="20" y="55" width="294" height="262" rx="12" fill="white" stroke="#d2e0e9"/><rect x="326" y="55" width="294" height="262" rx="12" fill="white" stroke="#d2e0e9"/><text x="38" y="77" class="cap">ROC · SAME CURVE</text><text x="343" y="77" class="cap">COST · CHANGING PREVALENCE</text><line x1="70" y1="280" x2="268" y2="280" stroke="#819bab" stroke-width="1.5"/><line x1="70" y1="280" x2="70" y2="105" stroke="#819bab" stroke-width="1.5"/><path d="M70,280 L70,224 L135,224 L135,168 L135,111 L200,111 L265,111" stroke="#b6cad4" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/><circle cx="70" cy="224" r="7" fill="#c06535" stroke="white" stroke-width="2"/><circle cx="135" cy="111" r="7" fill="#207c86" stroke="white" stroke-width="2"/><text x="82" y="217" class="cap warm">k = 1</text><text x="148" y="103" class="cap cool">k = 4</text><text x="43" y="102" class="tiny">TPR</text><text x="170" y="306" class="sub" text-anchor="middle">False positive rate</text><text x="95" y="252" class="tiny">FN cost = 2</text><text x="96" y="268" class="tiny">FP cost = 1</text><line x1="362" y1="268" x2="588" y2="268" stroke="#819bab" stroke-width="1.5"/><line x1="362" y1="268" x2="362" y2="113" stroke="#819bab" stroke-width="1.5"/><line x1="362" y1="201" x2="588" y2="201" stroke="#e6edf2"/><text x="363" y="107" class="tiny">Expected cost</text><path d="M362.00,256.39 L588.00,128.71" fill="none" stroke="#c06535" stroke-width="3.5" stroke-linecap="round"/><path d="M362.00,212.86 L588.00,244.78" fill="none" stroke="#207c86" stroke-width="3.5" stroke-linecap="round"/><text x="536" y="134" class="cap warm">k=1</text><text x="537" y="254" class="cap cool">k=4</text><line x1="423.64" x2="423.64" y1="120" y2="268" stroke="#9ab3c2" stroke-dasharray="3 5"/><circle cx="423.64" cy="221.57" r="6.5" fill="white" stroke="#687f91" stroke-width="2"/><text x="433.64" y="193" class="cap">20%</text><text x="362" y="286" class="tiny">5%</text><text x="588" y="286" class="tiny" text-anchor="end">60%</text><text x="475" y="305" class="sub" text-anchor="middle">Positive prevalence</text><text x="23" y="345" class="tiny">SYNTHETIC RATES · PRIOR SHIFT ONLY · NOT MODEL MEASUREMENTS</text></svg>