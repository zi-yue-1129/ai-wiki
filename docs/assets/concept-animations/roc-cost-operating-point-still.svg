<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Expected decision cost at ROC thresholds</title><desc id="desc">Five thresholds of a plus minus plus minus ranking yield ROC operating points and artificial expected misclassification costs; accepting only the first positive minimizes cost at 0.25.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="18" fill="#f2f8fb"/><text x="24" y="34" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#24465a" >ROC OPERATING COST</text><text x="24" y="57" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="500" fill="#638193" >Threshold choice needs costs and prevalence, not AUC alone</text><rect x="24" y="72" width="286" height="244" rx="14" fill="#ffffff" stroke="#d4e6ee"/><rect x="324" y="72" width="292" height="244" rx="14" fill="#ffffff" stroke="#d4e6ee"/><text x="46" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#638193" >ACCEPT k</text><text x="157" y="96" font-family="Arial,DejaVu Sans,sans-serif" font-size="11" font-weight="700" fill="#638193" >EXPECTED COST</text><text x="58" y="125" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#24465a" >0</text><rect x="150" y="113" width="86" height="14" rx="7" fill="#e8f1f5"/><rect x="150" y="113" width="57.3" height="14" rx="7" fill="#e59a61"/><text x="280" y="125" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#24465a" text-anchor="end">0.500</text><text x="58" y="162" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#24465a" >1</text><rect x="150" y="150" width="86" height="14" rx="7" fill="#e8f1f5"/><rect x="150" y="150" width="28.7" height="14" rx="7" fill="#31998e"/><text x="280" y="162" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#24465a" text-anchor="end">0.250</text><text x="58" y="199" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#24465a" >2</text><rect x="150" y="187" width="86" height="14" rx="7" fill="#e8f1f5"/><rect x="150" y="187" width="71.7" height="14" rx="7" fill="#e59a61"/><text x="280" y="199" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#24465a" text-anchor="end">0.625</text><text x="58" y="236" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#24465a" >3</text><rect x="150" y="224" width="86" height="14" rx="7" fill="#e8f1f5"/><rect x="150" y="224" width="43.0" height="14" rx="7" fill="#e59a61"/><text x="280" y="236" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#24465a" text-anchor="end">0.375</text><text x="58" y="273" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#24465a" >4</text><rect x="150" y="261" width="86" height="14" rx="7" fill="#e8f1f5"/><rect x="150" y="261" width="86.0" height="14" rx="7" fill="#e59a61"/><text x="280" y="273" font-family="Arial,DejaVu Sans,sans-serif" font-size="12" font-weight="700" fill="#24465a" text-anchor="end">0.750</text><path d="M356 97 V265 H562" fill="none" stroke="#638193" stroke-width="1.5"/><path d="M356 265 V181 H459 V97 H562" fill="none" stroke="#5f96c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="356" cy="265" r="4" fill="#ffffff" stroke="#5f96c4" stroke-width="2"/><circle cx="356" cy="181" r="4" fill="#ffffff" stroke="#5f96c4" stroke-width="2"/><circle cx="459" cy="181" r="4" fill="#ffffff" stroke="#5f96c4" stroke-width="2"/><circle cx="459" cy="97" r="4" fill="#ffffff" stroke="#5f96c4" stroke-width="2"/><circle cx="562" cy="97" r="4" fill="#ffffff" stroke="#5f96c4" stroke-width="2"/><text x="349" y="283" font-family="Arial,DejaVu Sans,s