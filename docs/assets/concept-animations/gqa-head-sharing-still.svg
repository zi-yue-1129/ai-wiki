" width="54" height="42" rx="11" fill="#fffefa" stroke="#dcb280" stroke-width="1.8"/><text x="507" y="118" class="head">Q7</text><rect x="551" y="92" width="54" height="42" rx="11" fill="#fffefa" stroke="#dcb280" stroke-width="1.8"/><text x="578" y="118" class="head">Q8</text><rect x="128" y="218" width="154" height="50" rx="12" fill="#e1f4f4" stroke="#138d98" stroke-width="2.1"/><text x="205" y="239" class="head">K1 / V1</text><text x="205" y="257" text-anchor="middle" class="muted">shared cache</text><rect x="359" y="218" width="154" height="50" rx="12" fill="#fdf0de" stroke="#c18b45" stroke-width="2.1"/><text x="436" y="239" class="head">K2 / V2</text><text x="436" y="257" text-anchor="middle" class="muted">shared cache</text><path d="M28 290H612" stroke="#dce7ed"/><text x="29" y="321" class="eyebrow">KV PAIRS / TOKEN</text><text x="198" y="321" class="head">MHA</text><text x="425" y="321" class="head">GQA</text><rect x="232" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="247" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="262" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="277" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="292" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="307" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="322" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="337" y="309" width="10" height="17" rx="3" fill="#c2cdd7"/><rect x="462" y="309" width="24" height="17" rx="4" fill="#138d98"/><rect x="495" y="309" width="24" height="17" rx="4" fill="#c18b45"/><text x="373" y="322" text-anchor="middle" class="muted">8</text><text x="546" y="322" class="muted">2</text></svg>