<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Grouped-query attention: eight queries share two key-value heads</title><desc id="desc">Four blue query heads share KV group zero, and four amber query heads share KV group one. Moving pulses travel from each query to its shared KV group. Two KV pairs are cached per token rather than eight pairs in multi-head attention.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#f0f5fa"/></linearGradient><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#8ca7ba" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,system-ui,Segoe UI,sans-serif;fill:#243e53} .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;fill:#567185}.muted{font-size:12px;fill:#627c90}.head{font-size:13px;font-weight:750;text-anchor:middle}.quiet{fill:none;stroke:#b8ceda;stroke-width:2;stroke-linecap:round}.hi0{stroke:#138d98;fill:none;stroke-width:3;stroke-linecap:round}.hi1{stroke:#b97b34;fill:none;stroke-width:3;stroke-linecap:round} @media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><rect width="640" height="360" rx="19" fill="url(#bg)"/><text x="28" y="35" class="eyebrow">GROUPED-QUERY ATTENTION</text><text x="28" y="60" class="muted">8 Q HEADS</text><text x="548" y="60" text-anchor="end" class="muted">2 KV GROUPS</text><rect x="24" y="72" width="289" height="209" rx="14" fill="#e6f5f5" stroke="#cee7e7"/><rect x="327" y="72" width="289" height="209" rx="14" fill="#fff3e5" stroke="#f0dfc8"/><path d="M63 134 C63 171 205 177 205 218" class="quiet"/><path d="M63 134 C63 171 205 177 205 218" fill="none" stroke="#138d98" stroke-opacity=".3" stroke-width="2.3"/><path d="M134 134 C134 171 205 177 205 218" class="quiet"/><path d="M134 134 C134 171 205 177 205 218" fill="