<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Regularized aging evolution population replacement</title><desc id="desc">Tournament chooses C, mutates to child F, and evicts the oldest A even though A has the highest illustrative score. Queue becomes B C D E F. Toy validation scores, not experimental benchmarks.</desc><style>text{font-family:Inter,Arial,sans-serif} @media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" stroke="#f5f9fc" stroke-width="1"/><text x="26" y="33" font-size="14" fill="#263d51" text-anchor="start" font-weight="750">AGING EVOLUTION  /  SEARCH LOOP</text><text x="26" y="56" font-size="11" fill="#637b91" text-anchor="start" font-weight="500">Tournament → parent → mutate → oldest leaves</text><rect x="23" y="78" width="594" height="265" rx="12" fill="white" stroke="#dce7ef" stroke-width="1"/><text x="36" y="100" font-size="11" fill="#637b91" text-anchor="start" font-weight="600">Oldest</text><text x="602" y="100" font-size="11" fill="#637b91" text-anchor="end" font-weight="600">Newest</text><path d="M37 109L600 109" fill="none" stroke="#dce7ef" stroke-width="2"/><g><rect x="36" y="130" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="44" y="139" width="84" height="6" rx="3" fill="#bd5b66" stroke="#bd5b66" stroke-width="1"/><text x="86" y="176" font-size="23" fill="#263d51" text-anchor="middle" font-weight="750">A</text><text x="86" y="199" font-size="13" fill="#637b91" text-anchor="middle" font-weight="650">.94</text><animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;.2;.45;.64;.70;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></g><g><rect x="149" y="130" width="100" height="91" rx="12" fill="#f8fbfd" stroke="#dce7ef" stroke-width="1"/><rect x="157" y="139" width="84" height="6"