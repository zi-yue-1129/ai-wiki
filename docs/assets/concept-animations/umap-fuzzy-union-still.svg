<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">UMAP: fuzzy union of two asymmetric neighbour memberships</title><desc id="desc">Two illustrative pairs carry directed weights 0.35 and 0.70, 0.20 and 0.50, which merge by fuzzy union to 0.805 and 0.60. Animated pulses show directed messages; final undirected edge thickness represents the merged membership. Numbers are not measured data.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#d8e4ec"/><rect x="20" y="68" width="281" height="234" rx="13" fill="#fff" stroke="#d8e4ec"/><rect x="340" y="68" width="280" height="234" rx="13" fill="#fff" stroke="#d8e4ec"/><text x="31" y="45" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#24394c" text-anchor="start">DIRECTED WEIGHTS</text><text x="356" y="45" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#24394c" text-anchor="start">FUZZY UNION</text><circle cx="71" cy="125" r="13" fill="#fff" stroke="#087e86" stroke-width="2.5"></circle><circle cx="252" cy="125" r="13" fill="#fff" stroke="#087e86" stroke-width="2.5"></circle><text x="71" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">A</text><text x="252" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">B</text><line x1="94" y1="113" x2="230" y2="113" stroke="#087e86" stroke-width="2.5" opacity="1" stroke-linecap="round" /><line x1="230" y1="137" x2="94" y2="137" stroke="#c47b29" stroke-width="2.5" opacity="1" stroke-linecap="round" /><path d="M223 108 L232 113 L223 118" fill="none" stroke="#087e86" stroke-width="2"/><path d="M101 132 L92 137 L101 142" fill="none" stroke="#c47b29" stroke-width="2"/><text x="161" y="102" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#087e86" text-anchor="middle">0.35</text><text x="161" y="160" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c47b29" text-anchor="middle">0.70</text><line x1="307" y1="125" x2="329" y2="125" stroke="#d8e4ec" stroke-width="3" opacity="1" stroke-linecap="round" /><path d="M321 119 L329 125 L321 131" fill="none" stroke="#657d91" stroke-width="2"/><line x1="390" y1="125" x2="567" y2="125" stroke="#edf3f7" stroke-width="12" opacity="1" stroke-linecap="round" /><circle cx="390" cy="125" r="13" fill="#fff" stroke="#087e86" stroke-width="2.5"></circle><circle cx="567" cy="125" r="13" fill="#fff" stroke="#087e86" stroke-width="2.5"></circle><text x="390" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">A</text><text x="567" y="130" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">B</text><g><line x1="409" y1="125" x2="548" y2="125" stroke="#087e86" stroke-width="10.05" opacity="1" stroke-linecap="round" /></g><text x="479" y="103" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087e86" text-anchor="middle">0.805</text><circle cx="71" cy="238" r="13" fill="#fff" stroke="#356bb2" stroke-width="2.5"></circle><circle cx="252" cy="238" r="13" fill="#fff" stroke="#356bb2" stroke-width="2.5"></circle><text x="71" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">C</text><text x="252" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">D</text><line x1="94" y1="226" x2="230" y2="226" stroke="#087e86" stroke-width="2.5" opacity="1" stroke-linecap="round" /><line x1="230" y1="250" x2="94" y2="250" stroke="#c47b29" stroke-width="2.5" opacity="1" stroke-linecap="round" /><path d="M223 221 L232 226 L223 231" fill="none" stroke="#087e86" stroke-width="2"/><path d="M101 245 L92 250 L101 255" fill="none" stroke="#c47b29" stroke-width="2"/><text x="161" y="215" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#087e86" text-anchor="middle">0.20</text><text x="161" y="273" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#c47b29" text-anchor="middle">0.50</text><line x1="307" y1="238" x2="329" y2="238" stroke="#d8e4ec" stroke-width="3" opacity="1" stroke-linecap="round" /><path d="M321 232 L329 238 L321 244" fill="none" stroke="#657d91" stroke-width="2"/><line x1="390" y1="238" x2="567" y2="238" stroke="#edf3f7" stroke-width="12" opacity="1" stroke-linecap="round" /><circle cx="390" cy="238" r="13" fill="#fff" stroke="#356bb2" stroke-width="2.5"></circle><circle cx="567" cy="238" r="13" fill="#fff" stroke="#356bb2" stroke-width="2.5"></circle><text x="390" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">C</text><text x="567" y="243" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24394c" text-anchor="middle">D</text><g><line x1="409" y1="238" x2="548" y2="238" stroke="#356bb2" stroke-width="8.00" opacity="1" stroke-linecap="round" /></g><text x="479" y="216" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#356bb2" text-anchor="middle">0.600</text><text x="31" y="325" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#24394c" text-anchor="start">w = a + b − ab</text><text x="405" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#657d91" text-anchor="start">Stronger edge</text></svg>