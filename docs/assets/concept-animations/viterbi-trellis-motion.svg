<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Viterbi: max-product and traceback</title><desc id="desc">Three-step two-state HMM: initialise Viterbi scores, choose best incoming transitions at t2 and t3, and trace the best state path A B A. Example probabilities are illustrative, not model measurements.</desc><defs><marker id="arrow-t" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker><marker id="arrow-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#376ca8" stroke-width="1.5"/></marker><marker id="arrow-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#7753a6" stroke-width="1.5"/></marker><marker id="arrow-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c47736" stroke-width="1.5"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.frame{display:none!important}.reduced{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#d7e2eb" stroke-width="1"/><rect x="24" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="92" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">1  Initialise</text><rect x="176" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="244" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">2  Max at t2</text><rect x="328" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="396" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">3  Max at t3</text><rect x="480" y="18" width="136" height="40" rx="9" fill="#edf4f8" stroke="#d7e2eb" stroke-width="1"/><text x="548" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#61758a">4  Traceback</text><rect x="26" y="311" width="588" height="35" rx="8" fill="#edf4f8" stroke="#edf4f8" stroke-width="0"/><text x="120" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#61758a">t1</text><text x="320" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#61758a">t2</text><text x="520" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#61758a">t3</text><path d="M169 158 L271 158" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M169 158 L271 245" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M169 245 L271 158" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M169 245 L271 245" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M369 158 L471 158" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M369 158 L471 245" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M369 245 L471 158" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><path d="M369 245 L471 245" fill="none" stroke="#d7e2eb" stroke-width="1.7" stroke-linecap="round"  /><rect x="76" y="129" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="120" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">A</text><text x="120" y="177" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.480</text><rect x="76" y="216" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="120" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">B</text><text x="120" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.120</text><rect x="276" y="129" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="320" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">A</text><text x="320" y="177" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.067</text><rect x="276" y="216" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="320" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">B</text><text x="320" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.130</text><rect x="476" y="129" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="520" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">A</text><text x="520" y="177" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.036</text><rect x="476" y="216" width="88" height="58" rx="13" fill="#fff" stroke="#d7e2eb" stroke-width="1.7"/><text x="520" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#24354a">B</text><text x="520" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" fill="#61758a">0.031</text><g class="frame" opacity="1"><rect x="24" y="18" width="136" height="40" rx="9" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="92" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#fff">1  Initialise</text><rect x="76" y="129" width="88" height="58" rx="13" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="76" y="216" width="88" height="58" rx="13" fill="none" stroke="#376ca8" stroke-width="3"/><text x="320" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#24354a">Initial score = prior × emission</text><animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g class="frame" opacity="0"><rect x="176" y="18" width="136" height="40" rx="9" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="244" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#fff">2  Max at t2</text><path d="M169 158 L271 245" fill="none" stroke="#0f766e" stroke-width="3.8" stroke-linecap="round"  marker-end="url(#arrow-t)"/><rect x="276" y="216" width="88" height="58" rx="13" fill="none" stroke="#0f766e" stroke-width="3"/><rect x="76" y="129" width="88" height="58" rx="13" fill="none" stroke="#0f766e" stroke-width="3"/><text x="320" y="334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#24354a">Store the winning predecessor at t2</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/></g><g class="frame" opacity="0"><rect x="328" y="18" width="136" height="40" rx="9" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="396" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14.5" font-weight="600" fill="#fff">3  Max at t3</text><path d="M369 245 L4