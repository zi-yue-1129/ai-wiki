<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Pseudoinverse noise amplification</title><desc id="desc">In a toy diagonal matrix with small singular value 0.25, inverse sensitivity is four times the perturbation in the second observation; spectral truncation at a 0.5 threshold suppresses the direction but can introduce bias.</desc><rect x="0" y="0" width="800" height="420" rx="0" fill="#f6f9fc" stroke="none"/><text x="30" y="38" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1d3448">Pseudoinverse sensitivity</text><text x="30" y="59" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51677c">Noise along a small singular direction</text><line x1="30" y1="74" x2="770" y2="74" stroke="#d5e1ea" stroke-width="2" /><rect x="28" y="90" width="471" height="285" rx="12" fill="#fff" stroke="#d5e1ea"/><rect x="516" y="90" width="256" height="285" rx="12" fill="#fff" stroke="#d5e1ea"/><text x="47" y="120" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1d3448">x₂ = δb₂ / 0.25</text><text x="530" y="120" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1d3448">Gain in coordinate 2</text><line x1="82" y1="246" x2="470" y2="246" stroke="#a8bdcc" stroke-width="1.5" /><line x1="273" y1="143" x2="273" y2="342" stroke="#a8bdcc" stroke-width="1.5" /><line x1="83" y1="322" x2="468" y2="322" stroke="#d5e1ea" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="83" y1="284" x2="468" y2="284" stroke="#d5e1ea" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="83" y1="246" x2="468" y2="246" stroke="#d5e1ea" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="83" y1="208" x2="468" y2="208" stroke="#d5e1ea" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="83" y1="170" x2="468" y2="170" stroke="#d5e1ea" stroke-width="0.8" stroke-dasharray="3 5"/><line x1="111" y1="322" x2="435" y2="170" stroke="#d18439" stroke-width="3.5" /><line x1="111" y1="246" x2="435" y2="246" stroke="#4279bb" stroke-width="2.8" stroke-dasharray="7 5"/><text x="90" y="149" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#51677c">x₂</text><text x="473" y="343" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#51677c">δb₂</text><text x="111" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51677c">−0.2</text><text x="435" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51677c">+0.2</text><text x="250" y="181" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#51677c">+0.8</text><text x="250" y="318" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#51677c">−0.8</text><rect x="529" y="141" width="225" height="83" rx="10" fill="#fff7ed" stroke="#fae9d5"/><text x="542" y="162" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#d18439">Full inverse</text><text x="542" y="194" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1d3448">1 / σ₂ = 4×</text><rect x="529" y="234" width="225" height="83" rx="10" fill="#eaf3fb" stroke="#e5eefb"/><text x="542" y="255" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#4279bb">Truncated inverse</text><text x="542" y="286" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1d3448">x₂ = 0</text><text x="531" y="355" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#51677c">σ₂ = 0.25 · threshold 0.5</text><circle cx="435" cy="170" r="9" fill="#d18439" stroke="#fff" stroke-width="3"/><circle cx="435" cy="246" r="6" fill="#4279bb" stroke="#fff" stroke-width="2"/><text x="400" y="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1d3448">δb₂ = +0.20 → full x₂ = +0.80 · truncated x₂ = 0</text></svg>