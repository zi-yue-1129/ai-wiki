<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Born-again networks: fresh students and contraction</title><desc id="desc">Two students start with uniform probabilities, receive fixed targets from the preceding generation, and take one illustrative gradient step each. The lower plot reveals the L2 distance to uniform and a contraction bound at each generation.</desc><rect width="640" height="360" rx="10" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="26" font-size="21" fill="#24374a" text-anchor="middle">Born-again networks</text><rect x="16" y="41" width="176" height="180" rx="3" fill="#e8eef4" /><text x="104" y="61" font-size="17" fill="#24374a" text-anchor="middle">Generation 0</text><text x="104" y="80" font-size="14" fill="#24374a" text-anchor="middle">Fixed teacher</text><path d="M26 150.667H182" stroke="#63778a" stroke-dasharray="3 3" stroke-width="1.2" opacity=".8"/><rect x="35" y="114.000" width="34" height="70.000" rx="3" fill="#315c85" /><text x="52" y="202" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="52" y="102" font-size="12" fill="#315c85" text-anchor="middle">70.0%</text><rect x="84" y="164.000" width="34" height="20.000" rx="3" fill="#315c85" /><text x="101" y="202" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="101" y="102" font-size="12" fill="#315c85" text-anchor="middle">20.0%</text><rect x="133" y="174.000" width="34" height="10.000" rx="3" fill="#315c85" /><text x="150" y="202" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="150" y="102" font-size="12" fill="#315c85" text-anchor="middle">10.0%</text><path d="M196 125h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2"/><rect x="232" y="41" width="176" height="180" rx="3" fill="#e8eef4" /><text x="320" y="61" font-size="17" fill="#24374a" text-anchor="middle">Generation 1</text><text x="320" y="80" font-size="14" fill="#24374a" text-anchor="middle">Fresh logits → step</text><path d="M242 150.667H398" stroke="#63778a" stroke-dasharray="3 3" stroke-width="1.2" opacity=".8"/><rect x="251" y="137.604" width="34" height="46.396" rx="3" fill="#08766f" /><text x="268" y="202" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="268" y="102" font-size="12" fill="#08766f" text-anchor="middle">46.4%</text><rect x="300" y="155.859" width="34" height="28.141" rx="3" fill="#08766f" /><text x="317" y="202" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="317" y="102" font-size="12" fill="#08766f" text-anchor="middle">28.1%</text><rect x="349" y="158.537" width="34" height="25.463" rx="3" fill="#08766f" /><text x="366" y="202" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="366" y="102" font-size="12" fill="#08766f" text-anchor="middle">25.5%</text><text x="320" y="216" font-size="12" fill="#24374a" text-anchor="middle">z = (.367, −.133, −.233)</text><path d="M412 125h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2"/><rect x="448" y="41" width="176" height="180" rx="3" fill="#e8eef4" /><text x="536" y="61" font-size="17" fill="#24374a" text-anchor="middle">Generation 2</text><text x="536" y="80" font-size="14" fill="#24374a" text-anchor="middle">Fresh logits → step</text><path d="M458 150.667H614" stroke="#63778a" stroke-dasharray="3 3" stroke-width="1.2" opacity=".8"/><rect x="467" y="146.182" width="34" height="37.818" rx="3" fill="#08766f" /><text x="484" y="202" font-size="13" fill="#24374a" text-anchor="middle">A</text><text x="484" y="102" font-size="12" fill="#08766f" text-anchor="middle">37.8%</text><rect x="516" y="152.493" width="34" height="31.507" rx="3" fill="#08766f" /><text x="533" y="202" font-size="13" fill="#24374a" text-anchor="middle">B</text><text x="533" y="102" font-size="12" fill="#08766f" text-anchor="middle">31.5%</text><rect x="565" y="153.325" width="34" height="30.675" rx="3" fill="#08766f" /><text x="582" y="202" font-size="13" fill="#24374a" text-anchor="middle">C</text><text x="582" y="102" font-size="12" fill="#08766f" text-anchor="middle">30.7%</text><text x="536" y="216" font-size="12" fill="#24374a" text-anchor="middle">z = (.131, −.052, −.079)</text><text x="320" y="238" font-size="12" fill="#63778a" text-anchor="middle">Dashed line: uniform probability</text><rect x="16" y="248" width="608" height="99" rx="3" fill="#f4f6f8" /><text x="107" y="268" font-size="14" fill="#24374a" text-anchor="middle">Distance to uniform</text><text x="107" y="286" font-size="12" fill="#24374a" text-anchor="middle">L2 norm</text><text x="107" y="312" font-size="12" fill="#08766f" text-anchor="middle">Actual</text><text x="107" y="330" font-size="12" fill="#a05c20" text-anchor="middle">Upper bound</text><path d="M207 308H603" stroke="#c5ced6" stroke-width="1"/><circle cx="220" cy="267.0854549090424" r="4" fill="#08766f"/><text x="220" y="284.0854549090424" font-size="12" fill="#08766f" text-anchor="middle">0.455</text><text x="220" y="339" font-size="13" fill="#24374a" text-anchor="middle">G0</text><path d="M220 267.0854549090424L399 287.54272745452124" stroke="#a05c20" stroke-width="1.7" stroke-dasharray="5 4" fill="none"/><path d="M220 267.0854549090424L399 293.5005269140693" stroke="#08766f" stroke-width="2.4" fill="none"/><circle cx="399" cy="293.5005269140693" r="4" fill="#08766f"/><text x="399" y="310.5005269140693" font-size="12" fill="#08766f" text-anchor="middle">0.161</text><circle cx="399" cy="287.54272745452124" r="3" fill="#a05c20"/><text x="399" y="339" font-size="13" fill="#24374a" text-anchor="middle">G1</text><path d="M399 287.54272745452124L578 297.7713637272606" stroke="#a05c20" stroke-width="1.7" stroke-dasharray="5 4" fill="none"/><path d="M399 293.5005269140693L578 303.02866236420647" stroke="#08766f" stroke-width="2.4" fill="none"/><circle cx="578" cy="303.02866236420647" r="4" fill="#08766f"/><text x="578" y="320.02866236420647" font-size="12" fill="#08766f" text-anchor="middle">0.055</text><circle cx="578" cy="297.7713637272606" r="3" fill="#a05c20"/><text x="578" y="339" font-size="13" fill="#24374a" text-anchor="middle">G2</text></g></svg>