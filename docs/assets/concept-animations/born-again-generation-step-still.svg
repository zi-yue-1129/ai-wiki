<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Born-again networks: change the teacher</title><desc id="desc">Equal-size models pass their probability predictions to freshly initialized students. Each example student takes one soft-target gradient step.</desc><rect width="640" height="360" rx="10" fill="#fff"/><g font-family="Arial, sans-serif"><text x="320" y="27" font-size="21" fill="#24374a" text-anchor="middle">Born-again networks: change the teacher</text><rect x="16" y="44" width="176" height="181" rx="5" fill="#e8eef4"/><text x="104" y="66" font-size="17" fill="#24374a" text-anchor="middle">Generation 0</text><text x="104" y="85" font-size="13" fill="#24374a" text-anchor="middle">Same architecture</text><rect x="38" y="124" width="34" height="70" rx="3" fill="#315c85"></rect><text x="55" y="213" font-size="14" fill="#24374a" text-anchor="middle">A</text><text x="55" y="117" font-size="12" fill="#315c85" text-anchor="middle">70.0%</text><rect x="87" y="174" width="34" height="20" rx="3" fill="#315c85"></rect><text x="104" y="213" font-size="14" fill="#24374a" text-anchor="middle">B</text><text x="104" y="167" font-size="12" fill="#315c85" text-anchor="middle">20.0%</text><rect x="136" y="184" width="34" height="10" rx="3" fill="#315c85"></rect><text x="153" y="213" font-size="14" fill="#24374a" text-anchor="middle">C</text><text x="153" y="177" font-size="12" fill="#315c85" text-anchor="middle">10.0%</text><path d="M194 135h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2.5" stroke-linejoin="round"/><rect x="232" y="44" width="176" height="181" rx="5" fill="#e8eef4"/><text x="320" y="66" font-size="17" fill="#24374a" text-anchor="middle">Generation 1</text><text x="320" y="85" font-size="13" fill="#24374a" text-anchor="middle">Fresh logits → step</text><rect x="254" y="147.6" width="34" height="46.4" rx="3" fill="#08766f"></rect><text x="271" y="213" font-size="14" fill="#24374a" text-anchor="middle">A</text><text x="271" y="140.6" font-size="12" fill="#08766f" text-anchor="middle">46.4%</text><rect x="303" y="165.9" width="34" height="28.1" rx="3" fill="#08766f"></rect><text x="320" y="213" font-size="14" fill="#24374a" text-anchor="middle">B</text><text x="320" y="158.9" font-size="12" fill="#08766f" text-anchor="middle">28.1%</text><rect x="352" y="168.5" width="34" height="25.5" rx="3" fill="#08766f"></rect><text x="369" y="213" font-size="14" fill="#24374a" text-anchor="middle">C</text><text x="369" y="161.5" font-size="12" fill="#08766f" text-anchor="middle">25.5%</text><path d="M410 135h32m-7 -5 7 5-7 5" fill="none" stroke="#8a9bab" stroke-width="2.5" stroke-linejoin="round"/><rect x="448" y="44" width="176" height="181" rx="5" fill="#e8eef4"/><text x="536" y="66" font-size="17" fill="#24374a" text-anchor="middle">Generation 2</text><text x="536" y="85" font-size="13" fill="#24374a" text-anchor="middle">Fresh logits → step</text><rect x="470" y="156.2" width="34" height="37.8" rx="3" fill="#08766f"></rect><text x="487" y="213" font-size="14" fill="#24374a" text-anchor="middle">A</text><text x="487" y="149.2" font-size="12" fill="#08766f" text-anchor="middle">37.8%</text><rect x="519" y="162.5" width="34" height="31.5" rx="3" fill="#08766f"></rect><text x="536" y="213" font-size="14" fill="#24374a" text-anchor="middle">B</text><text x="536" y="155.5" font-size="12" fill="#08766f" text-anchor="middle">31.5%</text><rect x="568" y="163.3" width="34" height="30.7" rx="3" fill="#08766f"></rect><text x="585" y="213" font-size="14" fill="#24374a" text-anchor="middle">C</text><text x="585" y="156.3" font-size="12" fill="#08766f" text-anchor="middle">30.7%</text><rect x="16" y="242" width="608" height="102" rx="5" fill="#f4f6f8"/><text x="320" y="262" font-size="16" fill="#24374a" text-anchor="middle">One soft-target SGD step per new model</text><text x="117" y="290" font-size="15" fill="#315c85" text-anchor="middle">Fixed target</text><text x="320" y="290" font-size="15" fill="#08766f" text-anchor="middle">z = 0 → p₀ − ⅓</text><text x="523" y="290" font-size="15" fill="#08766f" text-anchor="middle">z = 0 → p₁ − ⅓</text><text x="320" y="322" font-size="15" fill="#24374a" text-anchor="middle">( .367, −.133, −.233 )</text><text x="523" y="322" font-size="15" fill="#24374a" text-anchor="middle">( .131, −.052, −.079 )</text><text x="117" y="322" font-size="20" fill="#315c85" text-anchor="middle">p₀</text></g></svg>