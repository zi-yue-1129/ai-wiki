<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tanh saturation reduces gradient gain</title><desc id="desc">For zero-mean Gaussian preactivations with increasing variance q, the expected squared tanh derivative falls below the unit linearised gain; the line is numerical Gaussian quadrature, not a training measurement.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#223851}.meta{font-size:11px;letter-spacing:1.1px;font-weight:700;fill:#77899e}.small{font-size:12px;fill:#61748c}.legend{font-size:12px;font-weight:650}@media(prefers-reduced-motion:reduce){.moving{visibility:hidden}}</style><rect width="640" height="360" rx="18" fill="#f5f8fc" /><text class="meta" x="28" y="32">INITIALISATION · ANALYTICAL TOY MODEL</text><text x="28" y="60" font-size="18" font-weight="700">Tanh saturation reduces local slope²</text><text class="small" x="28" y="82">Z ~ Normal(0, q)   ·   E[(tanh'(Z))²]</text><rect x="24" y="98" width="592" height="218" rx="15" fill="#fff" stroke="#d9e4ef" stroke-width="1.2" /><line x1="94" y1="268" x2="574" y2="268" stroke="#e7eef6" stroke-width="1" /><text x="80" y="272" text-anchor="end" class="small">0.0</text><line x1="94" y1="204" x2="574" y2="204" stroke="#e7eef6" stroke-width="1" /><text x="80" y="208" text-anchor="end" class="small">0.5</text><line x1="94" y1="140" x2="574" y2="140" stroke="#e7eef6" stroke-width="1" /><text x="80" y="144" text-anchor="end" class="small">1.0</text><line x1="94" y1="136" x2="94" y2="268" stroke="#9aacbe" /><line x1="94" y1="268" x2="574" y2="268" stroke="#9aacbe" /><line x1="94" y1="268" x2="94" y2="272" stroke="#a6b4c6" /><text class="small" x="94" y="289" text-anchor="middle">0</text><line x1="200.67" y1="268" x2="200.67" y2="272" stroke="#a6b4c6" /><text class="small" x="200.67" y="289" text-anchor="middle">2</text><line x1="307.33" y1="268" x2="307.33" y2="272" stroke="#a6b4c6" /><text class="sm