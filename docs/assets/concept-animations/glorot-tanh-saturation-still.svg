<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tanh saturation reduces gradient gain</title><desc id="desc">For zero-mean Gaussian preactivations with increasing variance q, the expected squared tanh derivative falls below the unit linearised gain; the line is numerical Gaussian quadrature, not a training measurement.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#223851}.meta{font-size:11px;letter-spacing:1.1px;font-weight:700;fill:#77899e}.small{font-size:12px;fill:#61748c}.legend{font-size:12px;font-weight:650}@media(prefers-reduced-motion:reduce){.moving{visibility:hidden}}</style><rect width="640" height="360" rx="18" fill="#f5f8fc"/><text class="meta" x="28" y="32">INITIALISATION · ANALYTICAL TOY MODEL</text><text x="28" y="60" font-size="18" font-weight="700">Tanh saturation reduces gradient gain</text><text class="small" x="28" y="82">Z ~ Normal(0, q)   ·   E[(tanh'(Z))²]</text><rect x="24" y="98" width="592" height="218" rx="15" fill="#fff" stroke="#d9e4ef" stroke-width="1.2"/><line x1="94" y1="268" x2="574" y2="268" stroke="#e7eef6" stroke-width="1"/><text x="80" y="272" text-anchor="end" class="small">0.0</text><line x1="94" y1="204" x2="574" y2="204" stroke="#e7eef6" stroke-width="1"/><text x="80" y="208" text-anchor="end" class="small">0.5</text><line x1="94" y1="140" x2="574" y2="140" stroke="#e7eef6" stroke-width="1"/><text x="80" y="144" text-anchor="end" class="small">1.0</text><line x1="94" y1="136" x2="94" y2="268" stroke="#9aacbe"/><line x1="94" y1="268" x2="574" y2="268" stroke="#9aacbe"/><line x1="94" y1="268" x2="94" y2="272" stroke="#a6b4c6"/><text class="small" x="94" y="289" text-anchor="middle">0</text><line x1="200.67" y1="268" x2="200.67" y2="272" stroke="#a6b4c6"/><text class="small" x="200.67" y="289" text-anchor="middle">2</text><line x1="307.33" y1="268" x2="307.33" y2="272" stroke="#a6b4c6"/><text class="small" x="307.33" y="289" text-anchor="middle">4</text><line x1="414" y1="268" x2="414" y2="272" stroke="#a6b4c6"/><text class="small" x="414" y="289" text-anchor="middle">6</text><line x1="574" y1="268" x2="574" y2="272" stroke="#a6b4c6"/><text class="small" x="574" y="289" text-anchor="middle">9</text><text class="small" x="334" y="307" text-anchor="middle">Preactivation variance q</text><line x1="94" y1="140" x2="574" y2="140" stroke="#a8b5c7" stroke-width="2" stroke-dasharray="5 5"/><polyline points="94,140 107.33,176.18 120.67,192.17 134,201.86 147.33,208.56 160.67,213.55 174,217.46 187.33,220.63 200.67,223.26 214,225.5 227.33,227.44 240.67,229.13 254,230.62 267.33,231.96 280.67,233.16 294,234.25 307.33,235.24 320.67,236.15 334,236.99 347.33,237.76 360.67,238.48 374,239.15 387.33,239.78 400.67,240.36 414,240.92 427.33,241.44 440.67,241.93 454,242.39 467.33,242.84 480.67,243.25 494,243.65 507.33,244.03 520.67,244.4 534,244.74 547.33,245.08 560.67,245.39 574,245.7" stroke="#7160af" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="404" y1="118" x2="421" y2="118" stroke="#7160af" stroke-width="4" stroke-linecap="round"/><text x="427" y="122" class="legend">Mean slope²</text><circle cx="254" cy="230.62" r="6" fill="#7160af" stroke="#fff" stroke-width="2"/><text class="small" x="28" y="341">E[sech⁴(Z)] from Gaussian quadrature · no measured gradients.</text></svg>