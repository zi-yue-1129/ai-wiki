<text x="595" y="144" font-size="14" fill="#087e70" font-weight="700">f(s)</text>
<g class="resting">
 <line x1="479" y1="233" x2="581" y2="138" stroke="#db7c3b" stroke-width="3" stroke-dasharray="6 5"/>
 <circle cx="479" cy="233" r="10" fill="#d57533" stroke="#fff" stroke-width="3"/>
</g>
<g class="animated">
 <line x1="581" y1="138" x2="479" y2="233" stroke="#db7c3b" stroke-width="3" stroke-dasharray="6 5">
  <animate attributeName="x2" values="479;479;512;551;573;573;479" keyTimes="0;.14;.43;.68;.83;.94;1" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="233;233;201;166;147;147;233" keyTimes="0;.14;.43;.68;.83;.94;1" dur="8s" repeatCount="indefinite"/>
