<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">H2O Heavy Hitter Oracle cache selection</title><desc id="desc">Eight tokens are ranked with illustrative accumulated attention scores. Tokens 3 and 5 are heavy hitters. Tokens 7 and 8 are kept for recency, leaving a four-token cache.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#19394c}.head{font-size:19px;font-weight:bold}.sub{font-size:11.5px;fill:#60798c}.label{font-size:12px;font-weight:bold}.tiny{font-size:10px;fill:#668194}.num{font-size:13px;font-weight:bold}.reduced-only{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.reduced-only{display:inline!important}.result{opacity:1!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f6f9fc" stroke="none" /><text x="24" y="34" class="head" >H2O / HEAVY-HITTER EVICTION</text><text x="24" y="55" class="sub" >Keep important history plus the newest context</text><rect x="24" y="72" width="592" height="189" rx="12" fill="#ffffff" stroke="#dae4ee" /><text x="42" y="93" class="label" >SEQUENCE</text><text x="597" y="93" class="tiny" text-anchor="end">ATTENTION SCORE</text><rect x="52" y="110" width="49" height="39" rx="8" fill="#edf2f6" stroke="#cbd7e1" stroke-width="1.7"/><text x="76.5" y="135" class="num" text-anchor="middle">t1</text><rect x="64" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="64" y="214" width="24" height="12" rx="4" fill="#a9becd" stroke="none" /><text x="76" y="245" class="tiny" text-anchor="middle">2</text><rect x="120" y="110" width="49" height="39" rx="8" fill="#edf2f6" stroke="#cbd7e1" stroke-width="1.7"/><text x="144.5" y="135" class="num" text-anchor="middle">t2</text><rect x="132" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="132" y="220" width="24" height="6" rx="4" fill="#a9becd" stroke="none" /><text x="144" y="245" class="tiny" text-anchor="middle">1</text><rect x="188" y="110" width="49" height="39" rx="8" fill="#fff0cf" stroke="#cf9a37" stroke-width="1.7"/><text x="212.5" y="135" class="num" text-anchor="middle">t3</text><rect x="200" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="200" y="171" width="24" height="55" rx="4" fill="#e7b55b" stroke="none" /><text x="212" y="245" class="tiny" text-anchor="middle">9</text><rect x="256" y="110" width="49" height="39" rx="8" fill="#edf2f6" stroke="#cbd7e1" stroke-width="1.7"/><text x="280.5" y="135" class="num" text-anchor="middle">t4</text><rect x="268" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="268" y="208" width="24" height="18" rx="4" fill="#a9becd" stroke="none" /><text x="280" y="245" class="tiny" text-anchor="middle">3</text><rect x="324" y="110" width="49" height="39" rx="8" fill="#fff0cf" stroke="#cf9a37" stroke-width="1.7"/><text x="348.5" y="135" class="num" text-anchor="middle">t5</text><rect x="336" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="336" y="183" width="24" height="43" rx="4" fill="#e7b55b" stroke="none" /><text x="348" y="245" class="tiny" text-anchor="middle">7</text><rect x="392" y="110" width="49" height="39" rx="8" fill="#edf2f6" stroke="#cbd7e1" stroke-width="1.7"/><text x="416.5" y="135" class="num" text-anchor="middle">t6</text><rect x="404" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="404" y="214" width="24" height="12" rx="4" fill="#a9becd" stroke="none" /><text x="416" y="245" class="tiny" text-anchor="middle">2</text><rect x="460" y="110" width="49" height="39" rx="8" fill="#d9f3ed" stroke="#198879" stroke-width="1.7"/><text x="484.5" y="135" class="num" text-anchor="middle">t7</text><rect x="472" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="472" y="220" width="24" height="6" rx="4" fill="#6eb7a9" stroke="none" /><text x="484" y="245" class="tiny" text-anchor="middle">1</text><rect x="528" y="110" width="49" height="39" rx="8" fill="#d9f3ed" stroke="#198879" stroke-width="1.7"/><text x="552.5" y="135" class="num" text-anchor="middle">t8</text><rect x="540" y="166" width="24" height="60" rx="4" fill="#edf1f5" stroke="none" /><rect x="540" y="226" width="24" height="0" rx="4" fill="#6eb7a9" stroke="none" /><text x="552" y="245" class="tiny" text-anchor="middle">0</text><text x="42" y="275" class="label" >CACHE BUDGET</text><text x="601" y="275" class="tiny" text-anchor="end">2 HEAVY + 2 RECENT</text><g class="result"><rect x="123" y="283" width="73" height="43" rx="9" fill="#fff0cf" stroke="#cf9a37" stroke-width="2"/><text x="159" y="310" class="num" text-anchor="middle">t3</text><rect x="229" y="283" width="73" height="43" rx="9" fill="#fff0cf" stroke="#cf9a37" stroke-width="2"/><text x="265" y="310" class="num" text-anchor="middle">t5</text><rect x="335" y="283" width="73" height="43" rx="9" fill="#d9f3ed" stroke="#198879" stroke-width="2"/><text x="371" y="310" class="num" text-anchor="middle">t7</text><rect x="441" y="283" width="73" height="43" rx="9" fill="#d9f3ed" stroke="#198879" stroke-width="2"/><text x="477" y="310" class="num" text-anchor="middle">t8</text><animate attributeName="opacity" values=".14;.14;1;1" keyTimes="0;.55;.76;1" dur="12s" repeatCount="indefinite"/></g><text x="26" y="347" class="sub" >Illustrative scores - evicted tokens cannot be recovered</text><g class="motion"><rect x="64" y="226" width="24" height="0" rx="3" fill="#5c9cbe" opacity=".32"><animate attributeName="height" values="0;12;12" keyTimes="0;.33;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="226;214;214" keyTimes="0;.33;1" dur="12s" repeatCount="indefinite"/></rect><rect x="132" y="226" width="24" height="0" rx="3" fill="#5c9cbe" opacity=".32"><animate attributeName="height" values="0;6;6" keyTimes="0;.33;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="