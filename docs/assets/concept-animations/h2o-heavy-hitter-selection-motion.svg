="indefinite"/><animateMotion path="M 0 0 Q -41.5 15 -83.0 174" begin="6.1s" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="484.5" cy="130" r="6" fill="#138d7b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.55;.73;.84;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M 0 0 Q -56.5 15 -113.0 174" begin="6.1s" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="552.5" cy="130" r="6" fill="#138d7b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.49;.55;.73;.84;1" dur="12s" repeatCount="indefinite"/><animateMotion path="M 0 0 Q -37.5 15 -75.0 174" begin="6.1s" dur="3.1s" repeatCount="indefinite"/></circle></g></svg>