<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Prevalence shifts precision-recall but not ROC coordinates</title><desc id="desc">Five artificial class prevalences change positive predictive value while the ROC operating point stays fixed.</desc><style>text{font-family:Inter,Arial,sans-serif}.moving{display:inline}.static-final{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.static-final{display:inline}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f2f8fb"/><text x="24" y="36" fill="#234457" font-size="24" font-weight="750">PREVALENCE SHIFTS ROC vs PR</text><text x="24" y="58" fill="#688698" font-size="13" font-weight="500">Fixed TPR = 0.80   ·   FPR = 0.10</text><rect x="24" y="78" width="184" height="207" rx="12" fill="#ffffff" stroke="#cbe1ec"/><rect x="223" y="78" width="186" height="207" rx="12" fill="#ffffff" stroke="#cbe1ec"/><rect x="425" y="78" width="191" height="207" rx="12" fill="#ffffff" stroke="#cbe1ec"/><text x="42" y="105" fill="#688698" font-size="14" font-weight="700">CLASS MIX</text><text x="240" y="105" fill="#688698" font-size="15" font-weight="700">ROC</text><text x="443" y="105" fill="#688698" font-size="15" font-weight="700">PR</text><text x="43" y="143" fill="#234457" font-size="12" font-weight="600">Positive prior</text><rect x="43" y="154" width="150" height="22" rx="4" fill="#e9f1f5"/><g class="moving"><rect x="43" y="154" width="8" height="22" rx="3" fill="#2d9c8f"><animate attributeName="width" values="8;15;30;60;90;90" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect></g><g class="static-final"><rect x="43" y="154" width="90" height="22" rx="3" fill="#2d9c8f"/></g><g class="moving"><text opacity="1" x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 5%<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 10%<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 20%<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 40%<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 60%<animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text></g><g class="static-final"><text x="43" y="202" fill="#234457" font-size="17" font-weight="600">p = 60%</text></g><g class="moving"><text opacity="1" x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.296<animate attributeName="opacity" values="1;0;0;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.471<animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.667<animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.842<animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text><text opacity="0" x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.923<animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></text></g><g class="static-final"><text x="43" y="231" fill="#2d9c8f" font-size="15" font-weight="600">PPV = 0.923</text></g><text x="43" y="264" fill="#688698" font-size="12" font-weight="500">Same classifier</text><line x1="266" y1="247" x2="394" y2="247" stroke="#688698" stroke-width="1.2"/><line x1="266" y1="247" x2="266" y2="122" stroke="#688698" stroke-width="1.2"/><text x="264" y="264" fill="#688698" font-size="10" font-weight="500">0</text><text x="392" y="263" fill="#688698" font-size="10" font-weight="500">1</text><text x="260" y="127" fill="#688698" font-size="10" font-weight="500">1</text><text x="394" y="280" fill="#688698" font-size="10" font-weight="500" text-anchor="end">FPR</text><line x1="467" y1="247" x2="595" y2="247" stroke="#688698" stroke-width="1.2"/><line x1="467" y1="247" x2="467" y2="122" stroke="#688698" stroke-width="1.2"/><text x="465" y="264" fill="#688698" font-size="10" font-weight="500">0</text><text x="593" y="263" fill="#688698" font-size="10" font-weight="500">1</text><text x="461" y="127" fill="#688698" font-size="10" font-weight="500">1</text><text x="595" y="280" fill="#688698" font-size="10" font-weight="500" text-anchor="end">Recall</text><text x="244" y="119" fill="#688698" font-size="10" font-weight="500">TPR</text><text x="445" y="119" fill="#688698" font-size="10" font-weight="500">Precision</text><line x1="278.8" y1="247" x2="278.8" y2="122" stroke="#cbe1ec" stroke-width="1" stroke-dasharray="4 4"/><line x1="266" y1="147" x2="394" y2="147" stroke="#cbe1ec" stroke-width="1" stroke-dasharray="4 4"/><circle cx="278.8" cy="147" r="7" fill="#587fa7" stroke="#ffffff" stroke-width="2"/><text x="295" y="178" fill="#587fa7" font-size="11" font-weight="700">fixed</text><line x1="569.4" y1="247" x2="569.4" y2="122" stroke="#cbe1ec" stroke-width="1" stroke-dasharray="4 4"/><line x1="467" y1="210" x2="595" y2="210" stroke="#cbe1ec" stroke-width="1" stroke-dasharray="4 4"/><circle cx="569.4" cy="210" r="2.8" fill="#a8d6cf"/><circle cx="569.4" cy="188.2" r="2.8" fill="#a8d6cf"/><circle cx="569.4" cy="163.7" r="2.8" fill="#a8d6cf"/><circle cx="569.4" cy="141.7" r="2.8" fill="#a8d6cf"/><circle cx="569.4" cy="131.6" r="2.8" fill="#a8d6cf"/><g class="moving"><circle cx="569.4" cy="210" r="7" fill="#2d9c8f" stroke="white" stroke-width="2"><animate attributeName="cy" values="210;188.2;163.7;141.7;131.6;131.6" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000;1.000000" dur="10s" calcMode="discrete" repeatCount="indefinite"/></circle></g><g class="static-final"><circle cx="569.4" cy="131.6" r="7" fill="#2d9c8f" stroke="#ffffff" stroke-width="2"/></g><line x1="26" y1="304" x2="614" y2="304" stroke="#cbe1ec" stroke-width="1.5"/><text x="28" y="330" fill="#587fa7" font-size="14" font-weight="700">ROC location stays fixed</text><text x="613" y="330" fill="#2d9c8f" font-size="14" font-weight="700" text-anchor="end">Precision changes with prevalence</text></svg>