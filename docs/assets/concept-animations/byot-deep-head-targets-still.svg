<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Within-network self-distillation</title><desc id="desc">Forward features feed shallow and deep heads; deep features and predictions supply shallow targets, while the label supervises both heads. Target arrows are not gradient arrows.</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#315c85" stroke-width="1.3"/></marker><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#08766f" stroke-width="1.3"/></marker><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#a05c20" stroke-width="1.3"/></marker></defs><rect x="1" y="1" width="638" height="358" rx="14" fill="#f9fbfe" stroke="#dae5ef"/><text x="22" y="30" fill="#23364a" font-size="21" text-anchor="start">Within-network self-distillation</text><rect x="24" y="126" width="70" height="42" rx="6" fill="#315c85" stroke="none"/><text x="59" y="153" fill="white" font-size="17" text-anchor="middle">Input</text><rect x="142" y="116" width="136" height="62" rx="6" fill="#315c85" stroke="none"/><text x="210" y="153" fill="white" font-size="17" text-anchor="middle">Shallow</text><rect x="362" y="116" width="136" height="62" rx="6" fill="#315c85" stroke="none"/><text x="430" y="153" fill="white" font-size="17" text-anchor="middle">Deep</text><path d="M94 147H142" stroke="#315c85" stroke-width="2.4" fill="none" marker-end="url(#b)"/><path d="M278 147H362" stroke="#315c85" stroke-width="2.4" fill="none" marker-end="url(#b)"/><path d="M210 178V216" stroke="#315c85" stroke-width="2.4" fill="none" marker-end="url(#b)"/><path d="M430 178V216" stroke="#315c85" stroke-width="2.4" fill="none" marker-end="url(#b)"/><rect x="142" y="216" width="136" height="48" rx="6" fill="#315c85" stroke="none"/><text x="210" y="246" fill="white" font-size="17" text-anchor="middle">Head 1</text><rect x="362" y="216" width="136" height="48" rx="6" fill="#315c85" stroke="none"/><text x="430" y="246" fill="white" font-size="17" text-anchor="middle">Head C</text><path d="M430 116V70H210V116" stroke="#08766f" stroke-width="2.4" fill="none" marker-end="url(#t)" stroke-dasharray="6 4"/><text x="320" y="60" fill="#08766f" font-size="17" text-anchor="middle">Feature target</text><path d="M362 240H278" stroke="#08766f" stroke-width="2.4" fill="none" marker-end="url(#t)" stroke-dasharray="6 4"/><text x="320" y="226" fill="#08766f" font-size="17" text-anchor="middle">KL</text><rect x="270" y="310" width="100" height="32" rx="6" fill="#a05c20" stroke="none"/><text x="320" y="332" fill="white" font-size="17" text-anchor="middle">Label</text><path d="M320 310V292H210V264" stroke="#a05c20" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M320 310V292H430V264" stroke="#a05c20" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="164" y="286" fill="#a05c20" font-size="17" text-anchor="middle">CE</text><text x="476" y="286" fill="#a05c20" font-size="17" text-anchor="middle">CE</text><text x="574" y="147" fill="#315c85" font-size="15" text-anchor="middle">Forward</text><text x="574" y="168" fill="#08766f" font-size="15" text-anchor="middle">Target</text><text x="574" y="189" fill="#a05c20" font-size="15" text-anchor="middle">Label</text></svg>
