<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Original sequence-to-sequence encoder decoder</title><desc id="svg-desc">The encoder reads a reversed source sequence into one fixed context vector. A decoder then emits target tokens autoregressively. There is no cross attention in this original architecture.</desc><rect x="0" y="0" width="860" height="440" rx="0" fill="#fff" stroke="none" /><text x="27" y="38" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#16263b" font-weight="700">SEQ2SEQ</text><text x="830" y="36" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7756b7" text-anchor="end" font-weight="700">NO ATTENTION</text><rect x="24" y="61" width="338" height="315" rx="16" fill="#f6faff" stroke="#d7e1eb" /><rect x="374" y="61" width="107" height="315" rx="16" fill="#f7f3fe" stroke="#d9d0ed" /><rect x="493" y="61" width="342" height="315" rx="16" fill="#f9fcfb" stroke="#d7e1eb" /><text x="43" y="95" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2774b7" font-weight="700">Encoder</text><text x="427" y="95" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7756b7" text-anchor="middle" font-weight="700">Context</text><text x="512" y="95" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#168978" font-weight="700">Decoder</text><text x="43" y="119" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" >reverse source order</text><text x="512" y="119" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#64748b" >autoregressive output</text><rect x="48" y="191" width="58" height="76" rx="11" fill="#e7f2fa" stroke="#9bc7e2" /><text x="77" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2774b7" text-anchor="middle" font-weight="700">x4</text><line x1="106" y1="229" x2="132" y2="229" stroke="#2774b7" stroke-width="2.5" stroke-linecap="round"/><rect x="48" y="191" width="