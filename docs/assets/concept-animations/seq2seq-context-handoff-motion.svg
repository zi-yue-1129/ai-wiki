 x1="78" y1="315" x2="338" y2="315" stroke="#d7e1eb" stroke-width="2" /><line x1="525" y1="315" x2="715" y2="315" stroke="#d7e1eb" stroke-width="2" /><text x="208" y="343" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">read inputs → update state</text><text x="657" y="343" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">emit token → feedback</text><text x="27" y="415" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7756b7" font-weight="700">ONE FIXED VECTOR v</text><text x="832" y="415" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" text-anchor="end">Illustrative tokens • not a measured translation</text></svg>