<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">MCTS: four-step search iteration</title><desc id="desc">One schematic MCTS iteration: select the left branch, expand a new child, evaluate it as plus one, and back up the result and visit count along the selected path. Values are illustrative.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#087f82" stroke-width="1.7"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#cb6b26" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="640" height="360" rx="16" fill="#fbfdff" stroke="none" stroke-width="1.5"/><rect x="1" y="1" width="638" height="358" rx="15" fill="none" stroke="#dbe5ee" stroke-width="1"/><rect x="27" y="32" width="139" height="39" rx="10" fill="#f1f5f9" stroke="#dbe5ee" stroke-width="1"/><text x="96.5" y="57" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#718399" text-anchor="middle">Select</text><rect x="175" y="32" width="139" height="39" rx="10" fill="#f1f5f9" stroke="#dbe5ee" stroke-width="1"/><text x="244.5" y="57" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#718399" text-anchor="middle">Expand</text><rect x="323" y="32" width="139" height="39" rx="10" fill="#f1f5f9" stroke="#dbe5ee" stroke-width="1"/><text x="392.5" y="57" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#718399" text-anchor="middle">Evaluate</text><rect x="471" y="32" width="139" height="39" rx="10" fill="#f1f5f9" stroke="#dbe5ee" stroke-width="1"/><text x="540.5" y="57" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#718399" text-anchor="middle">Backup</text><path d="M302 144 L219 188" fill="none" stroke="#dbe5ee" stroke-width="3" stroke-linecap="ro