<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 402" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">ICM gradient balance static summary</title><desc id="svg-desc">Three illustrative beta choices of zero, one half and one show the inverse-loss and forward-loss contributions combining into one shared encoder gradient in a chosen two-dimensional parameter slice.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:19px;font-weight:700;fill:#29435d}.small{font-size:13px;fill:#526b84}.lbl{font-size:16px;font-weight:700;fill:#29435d}.line{stroke:#c3d2e0;stroke-width:2} .box{fill:#fff;stroke:#d3dfeb;stroke-width:1.5} @media(prefers-reduced-motion:reduce){.motion-dot{display:none}}</style><rect width="380" height="402" rx="16" fill="#f7f9fd"/><text x="22" y="34" class="title">ICM · LOSS BALANCE</text><text x="22" y="56" class="small">Illustrative 2D vector composition</text><rect x="21" y="78" width="338" height="83" rx="10" fill="#fff" stroke="#d3dfeb"/><text x="37" y="109" font-size="17" font-weight="700" fill="#137468">β = 0</text><line x1="155" y1="143" x2="212" y2="125" stroke="#8564b4" stroke-width="3"/><line x1="212" y1="125" x2="212" y2="125" stroke="#d5893e" stroke-width="3"/><line x1="155" y1="143" x2="212" y2="125" stroke="#168a7d" stroke-width="4"/><circle cx="212" cy="125" r="5" fill="#168a7d"/><text x="292" y="127" text-anchor="middle" font-size="12" fill="#526b84">weighted</text><text x="292" y="143" text-anchor="middle" font-size="12" fill="#526b84">sum</text><rect x="21" y="171" width="338" height="83" rx="10" fill="#fff" stroke="#d3dfeb"/><text x="37" y="202" font-size="17" font-weight="700" fill="#137468">β = 0.5</text><line x1="155" y1="236" x2="183.5" y2="227.0" stroke="#8564b4" stroke-width="3"/><line x1="183.5" y1="227.0" x2="165.5" y2="200.5" stroke="#d5893e" stroke-width="3"/><line x1="155" y1="236" x2="165.5" y2="200.5" stroke="#168a7d" stroke-width="4"/><circle cx="165.5" cy="200.5" r="5" fill="#168a7d"/><text x="292" y="220" text-anchor="middle" font-size="12" fill="#526b84">weighted</text><text x="292" y="236" text-anchor="middle" font-size="12" fill="#526b84">sum</text><rect x="21" y="264" width="338" height="83" rx="10" fill="#fff" stroke="#d3dfeb"/><text x="37" y="295" font-size="17" font-weight="700" fill="#137468">β = 1</text><line x1="155" y1="329" x2="155" y2="329" stroke="#8564b4" stroke-width="3"/><line x1="155" y1="329" x2="119" y2="276" stroke="#d5893e" stroke-width="3"/><line x1="155" y1="329" x2="119" y2="276" stroke="#168a7d" stroke-width="4"/><circle cx="119" cy="276" r="5" fill="#168a7d"/><text x="292" y="313" text-anchor="middle" font-size="12" fill="#526b84">weighted</text><text x="292" y="329" text-anchor="middle" font-size="12" fill="#526b84">sum</text><g font-size="12"><rect x="25" y="374" width="11" height="11" fill="#8564b4"/><text x="42" y="384" fill="#526b84">Inverse</text><rect x="133" y="374" width="11" height="11" fill="#d5893e"/><text x="150" y="384" fill="#526b84">Forward</text><rect x="251" y="374" width="11" height="11" fill="#168a7d"/><text x="268" y="384" fill="#526b84">Total</text></g></svg>