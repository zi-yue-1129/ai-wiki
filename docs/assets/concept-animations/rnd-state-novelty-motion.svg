<path class="edge" d="M377 140H419" marker-end="url(#novel-arrow)"/>
<path class="edge" d="M377 232H419" marker-end="url(#novel-arrow)"/>
<rect x="430" y="94" width="226" height="190" rx="14" fill="#f8fafc" stroke="#d7e2ed" stroke-width="2"/>
<text x="445" y="117" class="lbl">Feature space</text>
<path d="M448 255H634M448 255V130" stroke="#c0d0df" stroke-width="2"/>
<path d="M448 213H634M448 171H634M500 130V255M558 130V255" stroke="#e3eaf1" stroke-width="1.5"/>
<g class="animated">
<line x1="589" y1="145" x2="470" y2="235" stroke="#d67b37" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="x1" values="589;589;589;550;550;589" keyTimes="0;.69;.70;.72;.96;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y1" values="145;145;145;202;202;145" keyTimes="0;.69;.70;.72;.96;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="470;470;572;621;621;572;470" keyTimes="0;.16;.64;.72;.78;.96;1" dur="10s" repeatCount="indefinite"/><animate attributeName="y2" values="235;235;158;139;139;187;235" keyTimes="0;.16;.64;.72;.78;.96;1" dur="10s" repeatCount="indefinite"/></line>
<circle cx="589" cy="145" r="9" fill="#138978" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="589;589;589;550;550;589" keyTimes="0;.69;.70;.72;.96;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="145;145;145;202;202;145" keyTimes="0;.69;.70;.72;.96;1" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="470" cy="235" r="9" fill="#d5813c" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="470;470;572;621;621;572;470" keyTimes="0;.16;.64;.72;.78;.96;1" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="235;235;158;139;139;187;235" keyTimes="0;.16;.64;.72;.78;.96;1" dur="10s" repeatCount="indefinite"/></circle>
</g>
<g class="resting"><line x1="589" y1="145" x2="572" y2="158" stroke="#d67b37" stroke-width="3" stroke-dasharray="6 5"/><circle cx="589" cy="145" r="9" fill="#138978" stroke="#fff" stroke-width="3"/><circle cx="572" cy="158" r="9" fill="#d5813c" stroke="#fff" stroke-width="3"/></g>
<text x="26" y="308" class="lbl">Intrinsic bonus</text>
<rect x="177" y="293" width="466" height="26" rx="13" fill="#edf2f7"/>
<rect x="180" y="296" width="390" height="20" rx="9" fill="#d5813c" class="animated"><animate attributeName="width" values="390;390;36;36;330;330;70;390" keyTimes="0;.16;.64;.69;.72;.78;.96;1" dur="10s" repeatCount="indefinite"/></rect>
<rect x="180" y="296" width="36" height="20" rx="9" fill="#d5813c" class="resting"/>
<text x="26" y="349" font-size="13" fill="#61768e">Schematic · fixed weights, state-dependent outputs</text>
