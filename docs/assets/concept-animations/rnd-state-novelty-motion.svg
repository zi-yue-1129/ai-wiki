<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="novel-title novel-desc">
<title id="novel-title">RND novelty: prediction error can rise on an unseen observation</title>
<desc id="novel-desc">For repeatedly observed A, the predictor approaches the fixed-weight target output and its error falls. Switching to a distinct observation B can raise the error because both networks produce input-dependent features. Further predictor training on B then reduces that error while the target parameters stay fixed. Blue and amber input pulses indicate that A and B each pass into both networks before the corresponding feature outputs are compared. The A-to-B response changes together after both amber input traces arrive, rather than depicting intermediate observations. The orange bonus bar is a normalized squared distance between the two shown feature dots at sampled times. Loop reset is instantaneous; training steps, features and reward scale are illustrative, not measurements. Observation A switches instantaneously to B at 7.12 seconds; no interpolated observation is implied.</desc>
