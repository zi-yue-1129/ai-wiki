<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">VQ-VAE: nearest codebook entry</title><desc id="dsc">A toy encoder output sweeps across a boundary of a three-vector codebook and its assigned discrete code switches abruptly. This is an illustrative quantisation geometry, not trained vectors.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf4f9"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284458}.title{font-size:17px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:.7px}.small{font-size:12px}.muted{fill:#6d8393}.panel{fill:#fff;stroke:#d5e3eb;stroke-width:1.4}@media(prefers-reduced-motion:reduce){animate{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="26" y="34" class="title" >VQ-VAE · NEAREST CODE</text><text x="26" y="56" class="small muted" >A moving encoder output snaps to a learned code</text><rect x="26" y="76" width="372" height="242" rx="14" class="panel"/><rect x="412" y="76" width="202" height="242" rx="14" class="panel"/><text x="46" y="103" class="label muted" >LATENT SPACE</text><text x="429" y="103" class="label muted" >DISCRETE CODE</text><path d="M65 158H365 M65 226H365 M145 118V286 M275 118V286" stroke="#e4edf3" stroke-width="1" stroke-dasharray="3 6"/><circle cx="139" cy="187" r="24" fill="#277aaa" fill-opacity=".10" stroke="#277aaa" stroke-opacity=".35"/><circle cx="139" cy="187" r="9" fill="#277aaa"/><text x="139" y="228" class="small" text-anchor="middle" fill="#277aaa">e1</text><circle cx="290" cy="187" r="24" fill="#ef9560" fill-opacity=".10" stroke="#ef9560" stroke-opacity=".35"/><circle cx="290" cy="187" r="9" fill="#ef9560"/><text x="290" y="228" class="small" text-anchor="middle" fill="#ef9560">e2</text><circle cx="220" cy="266" r="24" fill="#67ad9d" fill-opacity=".10" stroke="#67ad9d" stroke-opacity=".35"/><circle cx="220" cy="266" r="9" fill="#67ad9d"/><text x="220" y="307" class="small" text-anchor="middle" fill="#67ad9d">e3</text><path d="M214.5 124V221" stroke="#9db3c0" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="160" y1="146" x2="139" y2="187" stroke="#384f60" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="x1" values="160;260;160" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite" calcMode="linear"/><animate attributeName="x2" values="139;139;290;290;139;139" keyTimes="0;0.271;0.273;0.727;0.729;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></line><circle cx="160" cy="146" r="11" fill="#fff" stroke="#213b51" stroke-width="3"><animate attributeName="cx" values="160;260;160" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></circle><text x="76" y="298" class="small muted" >Encoder z</text><rect x="438" y="125" width="150" height="108" rx="14" fill="#f4f8fc" stroke="#dbe6ed"/><text x="512" y="147" class="small muted" text-anchor="middle">Quantized z</text><g opacity="1"><rect x="455" y="161" width="116" height="55" rx="12" fill="#e3f0f7" stroke="#277aaa" stroke-width="2"/><text x="513" y="194" class="title" text-anchor="middle">e1</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.271;.273;.727;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></g><g opacity="0"><rect x="455" y="161" width="116" height="55" rx="12" fill="#fff0e4" stroke="#ef9560" stroke-width="2"/><text x="513" y="194" class="title" text-anchor="middle">e2</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.271;.273;.727;1" dur="12s" repeatCount="indefinite" calcMode="linear"/></g><text x="512" y="259" class="small muted" text-anchor="middle">Nearest neighbour</text><text x="512" y="281" class="small muted" text-anchor="middle">not interpolation</text><text x="27" y="344" class="small muted" >ILLUSTRATIVE 2D CODEBOOK · NOT LEARNED EMBEDDINGS</text></svg>