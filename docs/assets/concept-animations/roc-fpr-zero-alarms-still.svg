<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Zero false alarms still leave uncertainty about the population FPR</title><desc id="desc">For n independent negative cases with zero observed false positives, the exact one-sided 95 percent binomial upper confidence limit is 1 minus 0.05 to the power 1 over n. The illustrated n values are 3, 12, 17, and 30; their upper limits are about 63.2, 22.1, 16.2, and 9.5 percent. Only at n at least 17 does the limit fall below the assumed one-sixth FPR budget. The sequence illustrates increasing sample size under an artificial zero-error scenario, not an experiment or model measurement.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#263d4d}.head{font-size:17px;font-weight:700}.cap{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#597181}.tiny{font-size:10px;fill:#597181}.large{font-size:21px;font-weight:700}.number{font-size:25px;font-weight:700}.status{font-size:11px;font-weight:700;text-anchor:middle}.percent{font-size:11px;font-weight:700}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="22" y="31" class="head">Zero alarms do not imply zero FPR</text><rect x="20" y="51" width="290" height="274" rx="12" fill="white" stroke="#d2e0e9"/><rect x="326" y="51" width="294" height="274" rx="12" fill="white" stroke="#d2e0e9"/><text x="36" y="76" class="cap">NEGATIVE CASES</text><text x="343" y="76" class="cap">EXACT UPPER LIMIT</text><text x="343" y="94" class="sub">95% one-sided · K = 0</text><line x1="370" y1="274" x2="592" y2="274" stroke="#9bb2bf" stroke-width="1.5"/><line x1="370" y1="108" x2="370" y2="274" stroke="#9bb2bf" stroke-width="1.5"/><text x="350" y="113" class="tiny">80%</text><text x="351" y="278" class="tiny">0%</text><text x="370" y="292" class="tiny" text-anchor="middle">2</text><text x="592" y="292" class="tiny" text-anchor="middle">30</text><text x="480" y="310" class="sub" text-anchor="middle">Negative cases tested, n</text><line x1="370" y1="239.4" x2="592" y2="239.4" stroke="#c57d52" stroke-width="1.7" stroke-dasharray="5 4"/><text x="591" y="223.4" class="tiny" text-anchor="end">cap = 1/6</text><polyline fill="none" stroke="#277e86" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" points="370.00,112.90 373.96,129.10 377.93,142.94 381.89,154.66 385.86,164.62 389.82,173.14 393.79,180.48 397.75,186.86 401.71,192.44 405.68,197.38 409.64,201.76 413.61,205.67 417.57,209.19 421.54,212.37 425.50,215.25 429.46,217.88 433.43,220.29 437.39,222.49 441.36,224.53 445.32,226.41 449.29,228.16 453.25,229.78 457.21,231.29 461.18,232.71 465.14,234.03 469.11,235.27 473.07,236.43 477.04,237.53 481.00,238.57 484.96,239.55 488.93,240.48 492.89,241.35 496.86,242.19 500.82,242.98 504.79,243.73 508.75,244.45 512.71,245.14 516.68,245.79 520.64,246.41 524.61,247.01 528.57,247.58 532.54,248.13 536.50,248.66 540.46,249.16 544.43,249.65 548.39,250.12 552.36,250.57 556.32,251.00 560.29,251.42 564.25,251.82 568.21,252.21 572.18,252.58 576.14,252.95 580.11,253.30 584.07,253.63 588.04,253.96 592.00,254.28"/><g><text x="36" y="107" class="large">17 tested</text><text x="36" y="125" class="sub">0 false alarms</text><circle cx="49.0" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="73.4" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="97.8" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="122.2" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="146.6" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="171.0" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="195.4" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="219.8" cy="149" r="9" fill="#277e86" stroke="#277e86" stroke-width="1.2"/><circle cx="244.2" cy="149" r="9" fill="#277e86" stroke="#2