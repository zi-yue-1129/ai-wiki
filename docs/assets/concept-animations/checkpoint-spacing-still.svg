<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">Activation checkpoint spacing: all five exact slot counts</title><desc id="d">16 equal-cost layers. For segment lengths 1, 2, 4, 8 and 16, persistent activation counts are 17, 9, 5, 3, 2, temporary internal counts are 0, 1, 3, 7, 15, and illustrative peak live slots are 17, 10, 8, 10, 17. Segment size 4 minimizes this five-choice example.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.motion-only{} .reduced-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.reduced-only{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="38" font-size="21" fill="#18364d" font-weight="750" >CHECKPOINT SPACING</text><text x="24" y="59" font-size="12" fill="#60768c" font-weight="500" >16 layers · persistent + temporary = peak slots</text><rect x="24" y="80" width="12" height="12" rx="2" fill="#36a8a1" stroke="none" /><text x="44" y="91" font-size="11" fill="#526b82" font-weight="700" >KEPT</text><rect x="111" y="80" width="12" height="12" rx="2" fill="#de9c64" stroke="none" /><text x="131" y="91" font-size="11" fill="#526b82" font-weight="700" >REBUILT</text><text x="33" y="114" font-size="14" fill="#24435c" font-weight="700" >s=1</text><rect x="119" y="98" width="350" height="20" rx="5" fill="#e5ebf1" stroke="none" /><rect x="119" y="98" width="340" height="20" rx="5" fill="#36a8a1" stroke="none" /><text x="491" y="113" font-size="15" fill="#1b3d56" font-weight="700" >17 + 0 = 17</text><text x="33" y="158" font-size="14" fill="#24435c" font-weight="700" >s=2</text><rect x="119" y="142" width="350" height="20" rx="5" fill="#e5ebf1" stroke="none" /><rect x="119" y="142" width="180" height="20" rx="5" fill="#36a8a1" stroke="none" /><rect x="299" y="142" width="20" height="20" rx="2" fill="#de9c64" stroke="none" /><text x="491" y="157" font-size="15" fill="#1b3d56" font-weight="700" >9 + 1 = 10</text><rect x="15" y="176" width="609" height="40" rx="8" fill="#e5f4f0" stroke="#94c9c1" /><text x="33" y="202" font-size="14" fill="#24435c" font-weight="700" >s=4</text><rect x="119" y="186" width="350" height="20" rx="5" fill="#e5ebf1" stroke="none" /><rect x="119" y="186" width="100" height="20" rx="5" fill="#36a8a1" stroke="none" /><rect x="219" y="186" width="60" height="20" rx="2" fill="#de9c64" stroke="none" /><text x="491" y="201" font-size="15" fill="#1b3d56" font-weight="700" >5 + 3 = 8</text><text x="33" y="246" font-size="14" fill="#24435c" font-weight="700" >s=8</text><rect x="119" y="230" width="350" height="20" rx="5" fill="#e5ebf1" stroke="none" /><rect x="119" y="230" width="60" height="20" rx="5" fill="#36a8a1" stroke="none" /><rect x="179" y="230" width="140" height="20" rx="2" fill="#de9c64" stroke="none" /><text x="491" y="245" font-size="15" fill="#1b3d56" font-weight="700" >3 + 7 = 10</text><text x="33" y="290" font-size="14" fill="#24435c" font-weight="700" >s=16</text><rect x="119" y="274" width="350" height="20" rx="5" fill="#e5ebf1" stroke="none" /><rect x="119" y="274" width="40" height="20" rx="5" fill="#36a8a1" stroke="none" /><rect x="159" y="274" width="300" height="20" rx="2" fill="#de9c64" stroke="none" /><text x="491" y="289" font-size="15" fill="#1b3d56" font-weight="700" >2 + 15 = 17</text><text x="24" y="343" font-size="12" fill="#60768c" font-weight="500" >Peak counts only activation slots; not total GPU memory.</text></svg>