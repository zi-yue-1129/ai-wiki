 <rect x="38" y="233" width="50" height="28" rx="14" fill="#3285c5" opacity=".14"/>
 <text x="63" y="253" fill="#3285c5" font-size="15" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">n=1</text>
 <text x="107" y="249" fill="#344b67" font-size="16" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >1 + 0.9 × 3</text>
