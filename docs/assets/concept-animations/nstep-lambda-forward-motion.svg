 <text x="472" y="275" fill="#3285c5" font-size="18" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="end">3.700</text>
 </g>
 <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;1;1;0.28" keyTimes="0;0.360;0.500;0.98;1" dur="12s" repeatCount="indefinite"/>
 <rect x="25" y="300" width="470" height="72" rx="13" fill="#f8faff" stroke="#dbe6f1"/>
 <rect x="38" y="313" width="50" height="28" rx="14" fill="#7765c6" opacity=".14"/>
 <text x="63" y="333" fill="#7765c6" font-size="15" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">n=2</text>
 <text x="107" y="329" fill="#344b67" font-size="16" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >1 − 0.9 + 0.81 × 1</text>
 <rect x="107" y="346" width="286" height="9" rx="4.5" fill="#e6eef8"/>
 <rect x="107" y="346" width="0" height="9" rx="4.5" fill="#7765c6"><animate attributeName="width" values="0;0;188;188;0" keyTimes="0;0.360;0.500;0.98;1" dur="12s" repeatCount="indefinite"/></rect>
 <text x="472" y="355" fill="#7765c6" font-size="18" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="end">0.910</text>
 </g>
 <g opacity="0.28"><animate attributeName="opacity" values="0.28;0.28;1;1;0.28" keyTimes="0;0.590;0.730;0.98;1" dur="12s" repeatCount="indefinite"/>
 <rect x="25" y="380" width="470" height="72" rx="13" fill="#f8faff" stroke="#dbe6f1"/>
 <rect x="38" y="393" width="50" height="28" rx="14" fill="#259985" opacity=".14"/>
 <text x="63" y="413" fill="#259985" font-size="15" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">n=3</text>
 <text x="107" y="409" fill="#344b67" font-size="16" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif" >1 − 0.9 + 3.24 + 1.458</text>
 <rect x="107" y="426" width="286" height="9" rx="4.5" fill="#e6eef8"/>
 <rect x="107" y="426" width="0" height="9" rx="4.5" fill="#259985"><animate attributeName="width" values="0;0;286;286;0" keyTimes="0;0.590;0.730;0.98;1" dur="12s" repeatCount="indefinite"/></rect>
 <text x="472" y="435" fill="#259985" font-size="18" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="end">4.798</text>
 </g>
 <text x="29" y="486" fill="#344b67" font-size="14" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" >Truncated λ-return</text>
 <g opacity="0.24"><animate attributeName="opacity" values="0.24;0.24;1;1;0.24" keyTimes="0;0.74;0.83;0.98;1" dur="12s" repeatCount="indefinite"/>
 <rect x="37" y="500" width="446" height="61" rx="12" fill="#f8faff" stroke="#dbe6f1"/>
 <rect x="48" y="513" width="84" height="30" rx="6" fill="#3285c5"/><text x="90" y="534" fill="white" font-size="15" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">0.20</text>
 <rect x="136" y="513" width="69" height="30" rx="6" fill="#7765c6"/><text x="170" y="534" fill="white" font-size="15" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">0.16</text>
 <rect x="209" y="513" width="262" height="30" rx="6" fill="#259985"/><text x="340" y="534" fill="white" font-size="15" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">0.64</text>
 </g>
