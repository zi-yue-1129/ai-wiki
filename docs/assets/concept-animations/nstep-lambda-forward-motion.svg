<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 626" role="img" aria-labelledby="title desc">
 <title id="title">One to three step SARSA returns and truncated lambda mixture</title>
 <desc id="desc">A four-state trajectory with rewards plus one, minus one and plus four. One, two and three step returns use increasingly distant bootstrap action values. A lambda weighted combination uses weights point two, point one six and point six four; all numbers are illustrative.</desc>
 <rect width="520" height="626" rx="22" fill="#f4f7fc"/>
 <rect x="12" y="12" width="496" height="602" rx="19" fill="white" stroke="#dce5f0"/>
 <text x="28" y="47" fill="#213047" font-size="24" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" >Multi-step TD</text>
 <rect x="318" y="24" width="176" height="31" rx="15" fill="#e7f0ff"/>
 <text x="406" y="45" fill="#46648a" font-size="14" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">γ = 0.9  ·  λ = 0.8</text>
 <text x="29" y="80" fill="#8294ac" font-size="12" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" >Trajectory</text>
 <path d="M68 120 H451" stroke="#d7e1ef" stroke-width="7" stroke-linecap="round"/>
 <path d="M68 120 H451" stroke="#a8bed6" stroke-width="2" stroke-dasharray="5 8"/>
 <circle cx="68" cy="120" r="22" fill="#fff" stroke="#4079b8" stroke-width="3"/><text x="68" y="126" fill="#346b9f" font-size="17" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">s0</text><circle cx="195" cy="120" r="22" fill="#fff" stroke="#4079b8" stroke-width="3"/><text x="195" y="126" fill="#346b9f" font-size="17" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">s1</text><circle cx="322" cy="120" r="22" fill="#fff" stroke="#4079b8" stroke-width="3"/><text x="322" y="126" fill="#346b9f" font-size="17" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">s2</text><circle cx="449" cy="120" r="22" fill="#fff" stroke="#2c9d85" stroke-width="3"/><text x="449" y="126" fill="#218873" font-size="17" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">s3</text>
 <text x="131.5" y="104" fill="#be7130" font-size="14" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">+1</text><text x="258.5" y="104" fill="#be7130" font-size="14" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">−1</text><text x="385.5" y="104" fill="#be7130" font-size="14" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">+4</text>
 <text x="195" y="170" fill="#2a977e" font-size="13" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Q1 = 3</text><text x="322" y="170" fill="#2a977e" font-size="13" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Q2 = 1</text><text x="449" y="170" fill="#2a977e" font-size="13" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">Q3 = 2</text>
 <circle cx="68" cy="83" r="5" fill="#ec9348" opacity="1"><animate attributeName="cx" values="68;68;195;322;449;449;68" keyTimes="0;0.08;0.3;0.51;0.72;0.96;1" dur="12s" repeatCount="indefinite"/></circle>
 <text x="29" y="207" fill="#8294ac" font-size="12" font-weight="750" font-family="Inter,Segoe UI,Arial,sans-serif" >Backup horizon</text>
