<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">wav2vec 2.0: product quantization</title><desc id="desc">One entry per codebook is selected. The two vectors are concatenated and linearly projected to the quantized target q.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa" stroke="none"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">wav2vec 2.0: product quantization</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff" stroke="none"/><text x="113" y="77" font-size="18" fill="#233b52" text-anchor="middle">Codebook 1</text><rect x="36" y="82" width="154" height="26" rx="5" fill="#edf2f6" stroke="none"/><text x="52" y="101" font-size="15" fill="#233b52" text-anchor="start">1</text><text x="117" y="101" font-size="17" fill="#233b52" text-anchor="middle">[0, 1]</text><rect x="36" y="113" width="154" height="26" rx="5" fill="#dcecf6" stroke="#21678d"/><text x="52" y="132" font-size="15" fill="#233b52" text-anchor="start">2</text><text x="117" y="132" font-size="17" fill="#21678d" text-anchor="middle">[1, 0]</text><rect x="36" y="144" width="154" height="26" rx="5" fill="#edf2f6" stroke="none"/><text x="52" y="163" font-size="15" fill="#233b52" text-anchor="start">3</text><text x="117" y="163" font-size="17" fill="#233b52" text-anchor="middle">[−1, 0]</text><text x="113" y="214" font-size="18" fill="#233b52" text-anchor="middle">Codebook 2</text><rect x="36" y="219" width="154" height="26" rx="5" fill="#edf2f6" stroke="none"/><text x="52" y="238" font-size="15" fill="#233b52" text-anchor="start">1</text><text x="117" y="238" font-size="17" fill="#233b52" text-anchor="middle">[1, 1]</text><rect x="36" y="250" widt