<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Adafactor: row and column factors reconstruct the second moment</title><desc id="svg-desc">An illustrative three-by-four squared-gradient matrix is compressed into row sums and column sums and reconstructed as an outer-product approximation. Colors represent magnitude. Factoring is approximate, not necessarily exact.</desc><style>@media(prefers-reduced-motion:reduce){.motion{display:none!important}}</style><rect x="0" y="0" width="720" height="460" rx="18" fill="#f8fbff" stroke="#dbe5ef" stroke-width="1"/><text x="35" y="42" fill="#24374c" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start">Adafactor</text><text x="193" y="42" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">factor the second moment</text><rect x="28" y="72" width="218" height="306" rx="14" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.2"/><rect x="257" y="72" width="191" height="306" rx="14" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.2"/><rect x="459" y="72" width="234" height="306" rx="14" fill="#ffffff" stroke="#dbe5ef" stroke-width="1.2"/><text x="51" y="110" fill="#24374c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">S = g²</text><text x="282" y="110" fill="#24374c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">R · C</text><text x="483" y="110" fill="#24374c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">V̂</text><rect x="48" y="145" width="38" height="45" rx="6" fill="#b3d6dd" stroke="none" stroke-width="1"/><rect x="91" y="145" width="38" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="134" y="145" width="38" height="45" rx="6" fill="#b3d6dd" stroke="none" stroke-width="1"/><rect x="177" y="145" width="38" height="45" rx="6" fill="#e9f4f7" stroke="none" stroke-width="1"/><rect x="48" y="195" width="38" height="45" rx="6" fill="#479aa9" stroke="none" stroke-width="1"/><rect x="91" y="195" width="38" height="45" rx="6" fill="#b3d6dd" stroke="none" stroke-width="1"/><rect x="134" y="195" width="38" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="177" y="195" width="38" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="48" y="245" width="38" height="45" rx="6" fill="#e9f4f7" stroke="none" stroke-width="1"/><rect x="91" y="245" width="38" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="134" y="245" width="38" height="45" rx="6" fill="#117c8f" stroke="none" stroke-width="1"/><rect x="177" y="245" width="38" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><text x="137" y="334" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle">3 × 4</text><rect x="278" y="143" width="48" height="42" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="278" y="190" width="48" height="42" rx="6" fill="#117c8f" stroke="none" stroke-width="1"/><rect x="278" y="237" width="48" height="42" rx="6" fill="#117c8f" stroke="none" stroke-width="1"/><rect x="276" y="320" width="32" height="36" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="315" y="320" width="32" height="36" rx="6" fill="#62a9b6" stroke="none" stroke-width="1"/><rect x="354" y="320" width="32" height="36" rx="6" fill="#2c8b9c" stroke="none" stroke-width="1"/><rect x="393" y="320" width="32" height="36" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><text x="344" y="205" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">rows</text><text x="351" y="300" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">cols</text><rect x="484" y="145" width="40" height="45" rx="6" fill="#bedce2" stroke="none" stroke-width="1"/><rect x="530" y="145" width="40" height="45" rx="6" fill="#b3d6dd" stroke="none" stroke-width="1"/><rect x="576" y="145" width="40" height="45" rx="6" fill="#9dcad3" stroke="none" stroke-width="1"/><rect x="622" y="145" width="40" height="45" rx="6" fill="#bedce2" stroke="none" stroke-width="1"/><rect x="484" y="196" width="40" height="45" rx="6" fill="#93c4cd" stroke="none" stroke-width="1"/><rect x="530" y="196" width="40" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="576" y="196" width="40" height="45" rx="6" fill="#52a0ae" stroke="none" stroke-width="1"/><rect x="622" y="196" width="40" height="45" rx="6" fill="#93c4cd" stroke="none" stroke-width="1"/><rect x="484" y="247" width="40" height="45" rx="6" fill="#93c4cd" stroke="none" stroke-width="1"/><rect x="530" y="247" width="40" height="45" rx="6" fill="#7db8c3" stroke="none" stroke-width="1"/><rect x="576" y="247" width="40" height="45" rx="6" fill="#52a0ae" stroke="none" stroke-width="1"/><rect x="622" y="247" width="40" height="45" rx="6" fill="#93c4cd" stroke="none" stroke-width="1"/><text x="577" y="334" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="middle">rank 1</text><path d="M223 198 L270 198 M329 267 L329 309 M450 198 L480 198" fill="none" stroke="#d48536" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 5"/><text x="360" y="410" fill="#0b858a" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">V̂ᵢⱼ = Rᵢ · Cⱼ / ΣR</text><text x="360" y="441" fill="#61748a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" text-anchor="middle">Stored: 3 + 4 values instead of 3 × 4</text><rect class="motion" x="274" y="140" width="53" height="146" fill="#ffffff"><animate attributeName="x" values="274;274;327;327" keyTimes="0;0.08;0.39;1" d