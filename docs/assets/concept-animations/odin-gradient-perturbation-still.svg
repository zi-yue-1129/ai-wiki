<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">ODIN input-gradient perturbation and softmax confidence</title><desc id="d">A one-dimensional analytic example shifts x from 1 to 1.25 using a score-increasing input gradient at T=2. The maximum softmax confidence rises from 0.731 to 0.777 and crosses a schematic threshold 0.75; this is not measured OOD performance.</desc><rect width="640" height="360" fill="#0b1526"/><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" fill="#e7f1fc" font-size="22" font-weight="750" text-anchor="start" >ODIN</text><text x="103" y="37" fill="#9fb7cc" font-size="13" font-weight="500" text-anchor="start" >Input-gradient preprocessing</text><rect x="24" y="60" width="352" height="227" rx="15" fill="#15263d" /><rect x="389" y="60" width="227" height="227" rx="15" fill="#15263d" /><text x="43" y="88" fill="#9fb7cc" font-size="11" font-weight="700" text-anchor="start" >INPUT SPACE</text><text x="409" y="88" fill="#9fb7cc" font-size="11" font-weight="700" text-anchor="start" >MAX SOFTMAX</text><line x1="62" y1="202" x2="340" y2="202" stroke="#405a74" stroke-width="2" /><line x1="82" y1="202" x2="82" y2="207" stroke="#9fb7cc" stroke-width="1.5" /><line x1="178" y1="202" x2="178" y2="207" stroke="#9fb7cc" stroke-width="1.5" /><line x1="230" y1="202" x2="230" y2="207" stroke="#9fb7cc" stroke-width="1.5" /><line x1="319" y1="202" x2="319" y2="207" stroke="#9fb7cc" stroke-width="1.5" /><text x="178" y="229" fill="#e7f1fc" font-size="12" font-weight="600" text-anchor="middle" >x = 1</text><text x="230" y="248" fill="#53d6d0" font-size="12" font-weight="600" text-anchor="middle" >x̃ = 1.25</text><text x="62" y="268" fill="#9fb7cc" font-size="11" font-weight="500" text-anchor="start" >1D differentiable classifier · T = 2</text><line x1="178" y1="172" x2="230" y2="172" stroke="#af9df3" stroke-width="3" stroke-linecap="round"/><path d="M221 166 L233 172 L221 178" stroke="#af9df3" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="203" y="153" fill="#af9df3" font-size="12" font-weight="650" text-anchor="middle" >+ ε sign(∇)</text><circle cx="178" cy="202" r="6" fill="#e7f1fc" stroke="#263f57" stroke-width="2"/><circle cx="230" cy="202" r="6" fill="none" stroke="#53d6d0" stroke-dasharray="3 3" stroke-width="2"/><circle cx="230" cy="202" r="9" fill="#53d6d0" stroke="#e7f1fc" stroke-width="2"/><text x="410" y="111" fill="#e7f1fc" font-size="12" font-weight="600" text-anchor="start" >confidence</text><line x1="413" y1="139" x2="593" y2="139" stroke="#405a74" stroke-width="2" /><line x1="413.0" y1="135" x2="413.0" y2="143" stroke="#405a74" stroke-width="1.1" /><text x="413" y="158" fill="#9fb7cc" font-size="10" font-weight="500" text-anchor="middle" >0.5</text><line x1="458.0" y1="135" x2="458.0" y2="143" stroke="#405a74" stroke-width="1.1" /><text x="458" y="158" fill="#9fb7cc" font-size="10" font-weight="500" text-anchor="middle" >0.6</text><line x1="503.0" y1="135" x2="503.0" y2="143" stroke="#405a74" stroke-width="1.1" /><text x="503" y="158" fill="#9fb7cc" font-size="10" font-weight="500" text-anchor="middle" >0.7</text><line x1="548.0" y1="135" x2="548.0" y2="143" stroke="#405a74" stroke-width="1.1" /><text x="548" y="158" fill="#9fb7cc" font-size="10" font-weight="500" text-anchor="middle" >0.8</text><line x1="593.0" y1="135" x2="593.0" y2="143" stroke="#405a74" stroke-width="1.1" /><text x="593" y="158" fill="#9fb7cc" font-size="10" font-weight="500" text-anchor="middle" >0.9</text><line x1="525.5" y1="120" x2="525.5" y2="257" stroke="#ffca74" stroke-width="1.4" stroke-dasharray="4 4"/><text x="529.5" y="119" fill="#ffca74" font-size="11" font-weight="600" text-anchor="start" >δ=.75</text><text x="410" y="194" fill="#9fb7cc" font-size="11" font-weight="700" text-anchor="start" >BEFORE</text><text x="410" y="241" fill="#9fb7cc" font-size="11" font-weight="700" text-anchor="start" >AFTER</text><line x1="4