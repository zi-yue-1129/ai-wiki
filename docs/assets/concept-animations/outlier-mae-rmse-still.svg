<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">MAE and RMSE response to an outlier</title><desc id="desc">Four fixed absolute errors of one and a fifth error that rises smoothly from one to six; the MAE bar grows linearly while the RMSE bar grows faster. Values are illustrative.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif} @media(prefers-reduced-motion:reduce){svg{animation:none}}</style><rect width="640" height="360" rx="19" fill="#F5F8FC"/><rect x="15" y="15" width="610" height="330" rx="16" fill="#FFF" stroke="#DDE6EF"/><text x="35" y="42" font-size="17" font-weight="800" fill="#23364A">OUTLIER SENSITIVITY</text><text x="603" y="40" font-size="11" text-anchor="end" font-weight="700" fill="#75869B">n = 5</text><rect x="35" y="56" width="570" height="167" rx="11" fill="#F5F8FD"/><text x="51" y="76" fill="#64748B" font-weight="700" font-size="10">ABSOLUTE RESIDUALS</text><line x1="58" y1="197" x2="587" y2="197" stroke="#BCCDDD" stroke-width="1.5"/><rect x="84" y="173" width="58" height="24" rx="5" fill="#59B7B2"></rect><text x="113" y="212" text-anchor="middle" fill="#516578" font-size="11" font-weight="650">1</text><rect x="191" y="173" width="58" height="24" rx="5" fill="#59B7B2"></rect><text x="220" y="212" text-anchor="middle" fill="#516578" font-size="11" font-weight="650">2</text><rect x="298" y="173" width="58" height="24" rx="5" fill="#59B7B2"></rect><text x="327" y="212" text-anchor="middle" fill="#516578" font-size="11" font-weight="650">3</text><rect x="405" y="173" width="58" height="24" rx="5" fill="#59B7B2"></rect><text x="434" y="212" text-anchor="middle" fill="#516578" font-size="11" font-weight="650">4</text><rect x="512" y="53" width="58" height="144" rx="5" fill="#E88B66" stroke="#B65D44" stroke-width="1"></rect><text x="541" y="212" text-anchor="middle" fill="#516578" font-size="11" font-weight="650">5</text><text x="519" y="231" font-size="9" font-weight="750" fill="#7B8B9B">PEAK</text><text x="52" y="255" font-size="14" font-weight="800" fill="#158D91">MAE</text><rect x="149" y="241" width="356" height="15" rx="7.5" fill="#EDF2F6"/><rect x="149" y="241" width="200" height="15" rx="7.5" fill="#158D91"></rect><text x="521" y="255" font-size="12" font-weight="800" fill="#34465A">2.00</text><text x="52" y="310" font-size="14" font-weight="800" fill="#B76A24">RMSE</text><rect x="149" y="296" width="356" height="15" rx="7.5" fill="#EDF2F6"/><rect x="149" y="296" width="282.842712474619" height="15" rx="7.5" fill="#B76A24"></rect><text x="521" y="310" font-size="12" font-weight="800" fill="#34465A">2.83</text><text x="150" y="338" font-size="10.5" fill="#738599">Error 5: 1 → 6 → 1</text><text x="603" y="338" text-anchor="end" font-size="10" fill="#738599">SCHEMATIC</text></svg>