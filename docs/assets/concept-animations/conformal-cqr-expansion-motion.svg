<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Conformalized quantile regression: calibration offset</title><desc id="desc">Two raw conditional quantile intervals with different widths grow by the same finite-sample calibration offset q=0.35 on both sides. Analytical teaching values, not model measurements.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.head{font-size:14px;font-weight:750;letter-spacing:1.05px}.muted{font-size:12px;fill:#637d90}.lab{font-size:15px;font-weight:700}.small{font-size:12px;font-weight:650}@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none!important}}</style><rect width="640" height="360" rx="18" fill="#f4f8fc"/><text x="28" y="35" class="head">CONFORMALIZED QUANTILE REGRESSION</text><text x="28" y="58" class="muted">Two raw intervals · shared q = 0.35</text><rect x="28" y="77" width="584" height="235" rx="13" fill="white" stroke="#dae5ec"/><text x="47" y="145" class="lab">A</text><path d="M91 140H556" stroke="#c5d4e0" stroke-width="1.5"/><path d="M91 135v10M556 135v10" stroke="#c5d4e0" stroke-width="1.3"/><rect x="175" y="125" width="85" height="30" rx="8" fill="#dbf3ec" stroke="#138978" stroke-width="1.4"><animate attributeName="x" values="175;175;145.25;145.25;175" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="85;85;144.5;144.5;85" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></rect><rect x="175" y="132" width="85" height="16" rx="6" fill="#267da6" opacity=".90"/><circle cx="175" cy="140" r="5" fill="#138978" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="175;175;145.25;145.25;175" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="260" cy="140" r="5" fill="#138978" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="260;260;289.75;289.75;260" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></circle><text x="175" y="114" class="muted" text-anchor="middle">1.0</text><text x="260" y="114" class="muted" text-anchor="middle">2.0</text><text x="47" y="257" class="lab">B</text><path d="M91 252H556" stroke="#c5d4e0" stroke-width="1.5"/><path d="M91 247v10M556 247v10" stroke="#c5d4e0" stroke-width="1.3"/><rect x="345" y="237" width="144.5" height="30" rx="8" fill="#dbf3ec" stroke="#138978" stroke-width="1.4"><animate attributeName="x" values="345;345;315.25;315.25;345" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="144.5;144.5;204;204;144.5" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></rect><rect x="345" y="244" width="144.5" height="16" rx="6" fill="#267da6" opacity=".90"/><circle cx="345" cy="252" r="5" fill="#138978" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="345;345;315.25;315.25;345" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="489.5" cy="252" r="5" fill="#138978" stroke="white" stroke-width="1.5"><animate attributeName="cx" values="489.5;489.5;519.25;519.25;489.5" keyTimes="0;.16;.60;.84;1" dur="12s" repeatCount="indefinite"/></circle><text x="345" y="226" class="muted" text-anchor="middle">3.0</text><text x="489.5" y="226" class="muted" text-anchor="middle">4.7</text><rect x="66" y="325" width="15" height="9" rx="3" fill="#267da6"/><text x="88" y="334" class="muted">raw quantiles</text><rect x="232" y="325" width="15" height="9" rx="3" fill="#dbf3ec" stroke="#138978"/><text x="254" y="334" class="muted">conformal expansion</text><text x="577" y="334" text-anchor="end" class="small">L − q  ·  U + q</text></svg>