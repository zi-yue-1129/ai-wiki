<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Dual-number propagation across a nonlinear computation</title><desc id="desc">For x=2 and y=1, a seed (1,0.5) propagates value/tangent pairs through multiply, square and addition. Product: (2,2), square: (4,8), output: (6,9). The paths and stage emphasis move in sequence; these are constructed exact arithmetic values.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#4978ae" stroke-width="1.6"/></marker><marker id="skip-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#ca6e22" stroke-width="1.5"/></marker></defs><rect width="800" height="420" rx="18" fill="#f4f8fb"/><rect x="16" y="16" width="768" height="388" rx="16" fill="white" stroke="#dbe6ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="52" font-size="22" fill="#1d3548" font-weight="bold">Dual numbers  ·  value + tangent</text><text x="38" y="75" font-size="13" fill="#62788a">f(x,y) = (xy)² + x     •     seed = (1, 0.5)</text><path d="M109 170 L109 125 L690 125 L690 165" fill="none" stroke="#ca6e22" stroke-width="2.7" stroke-dasharray="5 5" marker-end="url(#skip-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="581" y="116" font-size="14" fill="#ca6e22" font-weight="bold">+ x</text><path d="M182 212 L239 225" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M393 232 L434 232" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M592 232 L624 232" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M182 334 L213 334 L213 252 L239 252" fill="none" stroke="#4978ae" stroke-width="2.7" stroke-dasharray="none" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="36" y="154" width="146" height="116" rx="12" fill="#f8fbfd" stroke="#dbe6ed" stroke-width="2"/><rect x="38" y="156" width="142" height="6" rx="3" fill="#087f86" opacity="0.18"/><text x="51" y="181" font-size="14" fill="#1d3548" font-weight="bold">x</text><text x="51" y="215" font-size="12" fill="#62788a">value</text><text x="168" y="215" font-size="19" fill="#087f86" font-weight="bold" text-anchor="end">2</text><text x="51" y="247" font-size="12" fill="#62788a">tangent</text><text x="168" y="247" font-size="19" fill="#ca6e22" font-weight="bold" text-anchor="end">1</text><rect x="37" y="155" width="144" height="114" rx="12" fill="none" stroke="#ca6e22" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.20;0.33;1" dur="10s" begin="0s" repeatCount="indefinite"/></rect></g><g><rect x="36" y="277" width="146" height="116" rx="12" fill="#f8fbfd" stroke="#dbe6ed" stroke-width="2"/><rect x="38" y="279" width="142" height="6" rx="3" fill="#087f86" opacity="0.18"/><text x="51" y="304" font-size="14" fill="#1d3548" font-weight="bold">y</text><text x="51" y="338" font-size="12" fill="#62788a">value</text><text x="168" y="338" font-size="19" fill="#087f86" font-weight="bold" text-anchor="end">1</text><text x="51" y="370" font-size="12" fill="#62788a">tangent</text><text x="168" y="370" font-size="19" fill="#ca6e22" font-weight="bold" text-anchor="end">0.5</text><rect x="37" y="278" width="144" height="114" rx="12" fill="none" stroke="#ca6e22" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.20;0.33;1" dur="10s" begin="0s" repeatCount="indefinite"/></rect></g><g><rect x="239" y="177" width="154" height="116" rx="12" fill="#f8fbfd" stroke="#dbe6ed" stroke-width="2"/><rect x="241" y="179" width="150" height="6" rx="3" fill="#087f86" opacity="0.18"/><text x="254" y="204" font-size="14" fill="#1d3548" font-weight="bold">a = x × y</text><text x="254" y="238" font-size="12" fill="#62788a">value</text><text x="379" y="238" font-size="19" fill="#087f86" font-weight="bold" text-anchor="end">2</text><text x="254" y="270" font-size="12" fill="#62788a">tangent</text><text x="379" y="270" font-size="19" fill="#ca6e22" font-weight="bold" text-anchor="end">2</text><rect x="240" y="178" width="152" height="114" rx="12" fill="none" stroke="#ca6e22" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.20;0.33;1" dur="10s" begin="1.8s" repeatCount="indefinite"/></rect></g><g><rect x="434" y="177" width="158" height="116" rx="12" fill="#f8fbfd" stroke="#dbe6ed" stroke-width="2"/><rect x="436" y="179" width="154" height="6" rx="3" fill="#087f86" opacity="0.18"/><text x="449" y="204" font-size="14" fill="#1d3548" font-weight="bold">b = a²</text><text x="449" y="238" font-size="12" fill="#62788a">value</text><text x="578" y="238" font-size="19" fill="#087f86" font-weight="bold" text-anchor="end">4</text><text x="449" y="270" font-size="12" fill="#62788a">tangent</text><text x="578" y="270" font-size="19" fill="#ca6e22" font-weight="bold" text-anchor="end">8</text><rect x="435" y="178" width="156" height="114" rx="12" fill="none" stroke="#ca6e22" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.20;0.33;1" dur="10s" begin="3.8s" repeatCount="indefinite"/></rect></g><g><rect x="624" y="177" width="147" height="116" rx="12" fill="#f8fbfd" stroke="#dbe6ed" stroke-width="2"/><rect x="626" y="179" width="143" height="6" rx="3" fill="#087f86" opacity="0.18"/><text x="639" y="204" font-size="14" fill="#1d3548" font-weight="bold">z = b + x</text><text x="639" y="238" font-size="12" fill="#62788a">value</text><text x="757" y="238" font-size="19" fill="#087f86" font-weight="bold" text-anchor="end">6</text><text x="639" y="270" font-size="12" fill="#62788a">tangent</text><text x="757" y="270" font-size="19" fill="#ca6e22" font-weight="bold" text-anchor="end">9</text><rect x="625" y="178" width="145" height="114" rx="12" fill="none" stroke="#ca6e22" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.20;0.33;1" dur="10s" begin="5.8s" repeatCount="indefinite"/></rect></g><text x="757" y="343" font-size="18" fill="#ca6e22" font-weight="bold" text-anchor="end">Jv = 9</text><circle r="6" fill="#087f86" stroke="white" stroke-width="2"><animateMotion dur="3.1s" begin="0s" repeatCount="indefinite" path="M182 212 L239 225"/></circle><circle r="6" fill="#087f86" stroke="white" stroke-width="2"><animateMotion dur="3.1s" begin="0s" repeatCount="indefinite" path="M182 334 L213 334 L213 252 L239 252"/></circle><circle r="6" fill="#087f86" stroke="white" stroke-width="2"><animateMotion dur="3.1s" begin="1.5s" repeatCount="indefinite" path="M393 232 L434 232"/></circle><circle r="6" fill="#087f86" stroke="white" stroke-width="2"><animateMotion dur="3.1s" begin="3s" repeatCount="indefinite" path="M592 232 L624 232"/></circle><circle r="6" fill="#ca6e22" stroke="white" stroke-width="2"><animateMotion dur="3.1s" begin="3s" repeatCount="indefinite" path="M109 170 L109 125 L690 125 L690 165"/></circle></g></svg>