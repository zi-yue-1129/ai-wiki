<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DDIM skipping denoising steps using the same trained network</title><desc id="desc">In a schematic reverse time sequence, DDPM visits all eight intermediate updates while DDIM visits every second step and uses eta zero, with no newly drawn stochastic noise in the transition. Highlight rings traverse visited nodes. This is an illustrative schedule, not measured image quality or runtime.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#e9f3fc"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8fa8bc" flood-opacity=".15"/></filter></defs><style>text{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;fill:#28465e}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;fill:#66849b}.label{font-size:14px;font-weight:700;fill:#29495f}.small{font-size:12px;fill:#637e92;font-weight:500}.card{fill:#fff;stroke:#d4e3ef;stroke-width:1.5}@media(prefers-reduced-motion:reduce){.motion{display:none}.reduced{display:inline!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="30" y="39" class="eyebrow">DDIM  /  STRIDED SAMPLING</text><text x="30" y="67" class="small">Same denoiser, fewer selected time steps</text><rect x="30" y="83" width="580" height="94" rx="15" fill="#fff" stroke="#d5e3ed"/><text x="48" y="110" class="label">DDPM</text><text x="155" y="110" class="small">8 updates  ·  fresh noise</text><path d="M92 139H568" stroke="#d5e2e9" stroke-width="5" stroke-linecap="round"/><circle cx="92" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="92" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">8</text><circle cx="151.5" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="151.5" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">7</text><circle cx="211" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="211" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">6</text><circle cx="270.5" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="270.5" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">5</text><circle cx="330" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="330" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">4</text><circle cx="389.5" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="389.5" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">3</text><circle cx="449" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="449" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">2</text><circle cx="508.5" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="508.5" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">1</text><circle cx="568" cy="139" r="14" fill="#edf5fa" stroke="#348aa6" stroke-width="2"/><text x="568" y="143" font-size="10" font-weight="700" text-anchor="middle" fill="#3e6378">0</text><circle class="motion" cx="92" cy="139" r="21" fill="none" stroke="#348aa6" stroke-width="3" opacity=".8"><animate attributeName="cx" values="92;151.5;211;270.5;330;389.5;449;508.5;568;92" keyTimes="0;0.111111;0.222222;0.333333;0.444444;0.555556;0.666667;0.777778;0.888889;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/></circle><circle class="reduced" cx="568" cy="139" r="21" fill="none" stroke="#348aa6" stroke-width="3" display="none"/><path d="M147.5 168l4 -4 4 4" stroke="#91b4c2" stroke-width="1.7" fill="none"/><path d="M266.5 168l4 -4 4 4" stroke="#91b4c2" stroke-width="1.7" fill="none