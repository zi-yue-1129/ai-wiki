<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">DeiT hard-label distillation</title><desc id="d">Image patches are consumed by a student Vision Transformer and an independent CNN teacher. The class token is supervised by ground truth, while a distillation token is supervised by the teacher hard label; gradients from both losses train the student but not the teacher.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7faff"/><text x="23" y="32" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1d3550">DeiT  /  two supervision paths</text><text x="70" y="62" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#61758c">Image patches</text><rect x="28" y="78" width="23" height="23" rx="4" fill="#dbeafe" stroke="#d6e0ec"/><rect x="55" y="78" width="23" height="23" rx="4" fill="#cbe8f2" stroke="#d6e0ec"/><rect x="82" y="78" width="23" height="23" rx="4" fill="#fbe8c9" stroke="#d6e0ec"/><rect x="28" y="105" width="23" height="23" rx="4" fill="#e2ecff" stroke="#d6e0ec"/><rect x="55" y="105" width="23" height="23" rx="4" fill="#dbeafe" stroke="#d6e0ec"/><rect x="82" y="105" width="23" height="23" rx="4" fill="#cbe8f2" stroke="#d6e0ec"/><rect x="28" y="132" width="23" height="23" rx="4" fill="#fbe8c9" stroke="#d6e0ec"/><rect x="55" y="132" width="23" height="23" rx="4" fill="#e2ecff" stroke="#d6e0ec"/><rect x="82" y="132" width="23" height="23" rx="4" fill="#dbeafe" stroke="#d6e0ec"/><rect x="173" y="103" width="128" height="74" rx="13" fill="#e8f1fe" stroke="#3578ce"/><text x="237" y="131" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1d3550">Student ViT</text><text x="237" y="152" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#61758c">CLS   +   DIST</text><path d="M115 118 L173 139" fill="none" stroke="#3578ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M301 125 L354 94" fill="none" stroke="#3578ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M301 151 L354 204" fill="none" stroke="#0f9c9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="353" y="63" width="104" height="59" rx="11" fill="#e8f1fe" stroke="#3578ce"/><text x="405" y="87" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3578ce">CLS head</text><text x="405" y="107" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1d3550">CE</text><rect x="353" y="175" width="104" height="59" rx="11" fill="#ddf5f2" stroke="#0f9c9a"/><text x="405" y="198" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f9c9a">DIST head</text><text x="405" y="218" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1d3550">CE</text><rect x="492" y="52" width="124" height="54" rx="10" fill="#fff" stroke="#3578ce"/><text x="554" y="73" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#61758c">Ground truth</text><text x="554" y="91" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3578ce">y</text><rect x="25" y="230" width="135" height="60" rx="11" fill="#fff1dc" stroke="#dd9141"/><text x="93" y="253" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1d3550">CNN teacher</text><text x="93" y="274" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#61758c">hard label</text><rect x="491" y="178" width="124" height="56" rx="10" fill="#fff1dc" stroke="#dd9141"/><text x="553" y="200" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#61758c">Teacher label</text><text x="553" y="220" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#dd9141">yₜ</text><path d="M492 80 L457 91" fill="none" stroke="#3578ce" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 275 L184 310 L469 310 Q490 310 504 272 L530 234" fill="none" stroke="#dd9141" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M491 206 L457 206" fill="none" stroke="#dd9141" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M93 158 L93 230" fill="none" stroke="#dd9141" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="185" y="251" width="240" height="39" rx="10" fill="#fff" stroke="#d6e0ec"/><text x="304" y="276" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1d3550">½ CE(cls, y) + ½ CE(dist, yₜ)</text><rect x="24" y="326" width="592" height="23" rx="7" fill="#ddf5f2" stroke="#ddf5f2"/><text x="320" y="341" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#1d3550">Teacher produces labels; student receives both losses</text></svg>