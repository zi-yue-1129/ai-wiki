<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Finite-sample conformal quantiles: staircase in alpha</title><desc id="desc">With eight invented sorted calibration scores, the conformal index ceil(9(1-alpha)) drops one rank at a time as the nominal miscoverage alpha increases. For alpha below 1/9 the finite-sample threshold is infinity. A moving indicator follows the exact step function.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.head{font-size:15px;font-weight:750;letter-spacing:.8px}.muted{font-size:11px;fill:#61788d}.label{font-size:14px;font-weight:700}.value{font-size:13px;font-weight:650}.tick{font-size:11px;fill:#61788d}@media(prefers-reduced-motion:reduce){animate,animateTransform,.moving{display:none!important}}</style><rect width="640" height="360" rx="17" fill="#f2f7fb"/><text x="26" y="33" class="head">FINITE-SAMPLE QUANTILE · ORDER STATISTIC</text><rect x="26" y="62" width="588" height="276" rx="14" fill="#fff" stroke="#d7e4ed"/><text x="47" y="87" class="muted">n = 8 · k = ceil[9(1 − α)]</text><text x="548" y="87" text-anchor="end" class="muted">q = score(k)</text><path d="M101 125H535" stroke="#edf2f6" stroke-width="1"/><text x="80" y="129" class="tick" text-anchor="end">9</text><path d="M101 163H535" stroke="#edf2f6" stroke-width="1"/><text x="80" y="167" class="tick" text-anchor="end">8</text><path d="M101 201H535" stroke="#edf2f6" stroke-width="1"/><text x="80" y="205" class="tick" text-anchor="end">7</text><path d="M101 239H535" stroke="#edf2f6" stroke-width="1"/><text x="80" y="243" class="tick" text-anchor="end">6</text><path d="M101 277H535" stroke="#edf2f6" stroke-width="1"/><text x="80" y="281" class="tick" text-anchor="end">5</text><text x="44" y="113" class="muted">index k</text><line x1="140.42" y1="114" x2="140.42" y2="290" stroke="#f3f5f8"/><text x="140.42" y="310" class="tick" text-anchor="middle">0.10</text><line x1="228.96" y1="114" x2="228.96" y2="290" stroke="#f3f5f8"/><text x="228.96" y="310" class="tick" text-anchor="middle">0.20</text><line x1="317.5" y1="114" x2="317.5" y2="290" stroke="#f3f5f8"/><text x="317.5" y="310" class="tick" text-anchor="middle">0.30</text><line x1="406.04" y1="114" x2="406.04" y2="290" stroke="#f3f5f8"/><text x="406.04" y="310" class="tick" text-anchor="middle">0.40</text><line x1="494.58" y1="114" x2="494.58" y2="290" stroke="#f3f5f8"/><text x="494.58" y="310" class="tick" text-anchor="middle">0.50</text><text x="539" y="310" class="muted">α</text><line x1="105.0" y1="125" x2="150.25" y2="125" stroke="#178d81" stroke-width="5" stroke-linecap="butt"/><line x1="150.25" y1="125" x2="150.25" y2="163" stroke="#178d81" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/><line x1="150.25" y1="163" x2="248.63" y2="163" stroke="#178d81" stroke-width="5" stroke-linecap="butt"/><line x1="248.63" y1="163" x2="248.63" y2="201" stroke="#178d81" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/><line x1="248.63" y1="201" x2="347.01" y2="201" stroke="#178d81" stroke-width="5" stroke-linecap="butt"/><line x1="347.01" y1="201" x2="347.01" y2="239" stroke="#178d81" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/><line x1="347.01" y1="239" x2="445.39" y2="239" stroke="#178d81" stroke-width="5" stroke-linecap="butt"/><line x1="445.39" y1="239" x2="445.39" y2="277" stroke="#178d81" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/><line x1="445.39" y1="277" x2="530.0" y2="277" stroke="#178d81" stroke-width="5" stroke-linecap="butt"/><line x1="273.23" y1="110" x2="273.23" y2="289" stroke="#d19452" stroke-width="1.5" stroke-dasharray="4 5" opacity=".5"/><text x="279.23" y="102" class="muted">α=.25 ⇒ q=.54</text><text x="560" y="129" class="tick">∞</text><text x="560" y="167" class="tick">.69</text><text x="560" y="205" class="tick">.54</text><text x="560" y="243" class="tick">.47</text><text x="560" y="281" class="tick">.42</text><line class="moving" x1="122.71" y1="112" x2="122.71" y2="290" stroke="#dd9860" stroke-width="1.4" opacity=".8"><animate attributeName="x1" values="122.71;494.58;122.71" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="122.71;494.58;122.71" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/></line><circle class="moving" cx="122.71" cy="125" r="8" fill="#cf8751" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="122.71;494.58;122.71" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="125;163;201;239;277;239;201;163;125" keyTimes="0.000000;0.037037;0.169312;0.301587;0.433862;0.566138;0.698413;0.830688;0.962963" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><text x="49" y="329" class="muted">Illustrative sorted scores · no model measurements</text></svg>
