<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 598" role="img" aria-labelledby="ttl dsc">
<title id="ttl">SARSA lambda eligibility and Watkins Q lambda trace cut</title>
<desc id="dsc">A sequence of three distinct state-action pairs. The third action is non-greedy. With gamma lambda point seven two, SARSA retains decayed traces of earlier actions, while Watkins Q lambda clears the preceding traces when exploration occurs.</desc>
