<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Unit-vector normalization JVP removes radial input perturbations</title><desc id="desc">At x=(3,4), the normalized vector u=(0.6,0.8). A unit input seed rotates from radial to tangential; its radial component is eliminated and the output JVP grows along the tangent. The output arrow is magnified five times for visibility.</desc><defs><marker id="arr-teal" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#13868b"/></marker><marker id="arr-amber" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c98132"/></marker><marker id="arr-purple" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#7461a5"/></marker></defs><rect x="0.00" y="0.00" width="800.00" height="420.00" rx="18" fill="#f1f7fa" stroke="none"/><rect x="16.00" y="16.00" width="768.00" height="388.00" rx="16" fill="#fff" stroke="#d8e4eb"/><text x="38.00" y="52.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#19384b" text-anchor="start" font-weight="700">Normalization removes radial sensitivity</text><text x="38.00" y="78.00" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#5b7383" text-anchor="start">u = x / ||x||       x = (3,4)       ||x|| = 5</text><rect x="37.00" y="104.00" width="380.00" height="276.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><rect x="435.00" y="104.00" width="329.00" height="276.00" rx="12" fill="#f7fafc" stroke="#d8e4eb"/><text x="56.00" y="133.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19384b" text-anchor="start" font-weight="700">Input seed v</text><text x="455.00" y="133.00" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#19384b" text-anchor="start" font-weight="700">Normalized output tangent</text><circle cx="233.00" cy="259.00" r="98" fill="none" stroke=