ke="none" /><rect x="116" y="241" width="84" height="42" rx="5" fill="#e4edf2" stroke="none" /><rect x="226" y="249" width="350" height="26" rx="5" fill="#e4edf2" stroke="none" /><text x="226" y="316" font-size="13" fill="#233b52" text-anchor="start">0</text><text x="576" y="316" font-size="13" fill="#233b52" text-anchor="middle">1</text><text x="401" y="337" font-size="14" fill="#233b52" text-anchor="middle">Dashed marker = before</text><g class="motion"><g id="candidate-c" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.416667;1" values="0;1;0"/><text x="62" y="268" font-size="19" fill="#233b52" text-anchor="middle">C</text><text x="158" y="268" font-size="19" fill="#233b52" text-anchor="middle">2</text></g><circle cx="105" cy="118" r="7" fill="#087d70" opacity="0"><animate attributeName="cy" dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.166667;0.416667;0.99;1" values="118;118;262;262;118"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.166667;0.416667;1" values="0;1;0;0"/></circle><rect id="bar-0" x="226" y="105" width="308.279" height="26" rx="4" fill="#21678d"><animate attributeName="width" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.416667;1" values="308.279;163.909;308.279"/></rect><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.416667;1" values="1;0;1"/><text x="598" y="124" font-size="14" fill="#233b52" text-anchor="middle">0.881</text></g><g id="prob-0" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.416667;1" values="0;1;0"/><text x="598" y="124" font-size="14" fill="#233b52" text-anchor="middle">0.468</text></g><line x1="534.279" x2="534.279" y1="101" y2="135" stroke="#233b52" stroke-width="2" stroke-dasharray="3 2"/><rect id="bar-1" x="226" y="177" width="4