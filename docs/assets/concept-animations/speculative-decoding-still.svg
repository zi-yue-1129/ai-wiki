="none" stroke="#c65e69" stroke-width="2.2" stroke-linecap="round"/><rect x="438" y="164" width="60" height="45" rx="10" fill="#f1f4f6" stroke="#c8d4dc" stroke-width="2"/><rect x="168" y="245" width="60" height="45" rx="10" fill="#d5f1e7" stroke="#289575" stroke-width="2"/><text x="198" y="274" class="cell" text-anchor="middle">A</text><path d="M210 257l4 4 7-9" fill="none" stroke="#289575" stroke-width="2.2" stroke-linecap="round"/><rect x="258" y="245" width="60" height="45" rx="10" fill="#d5f1e7" stroke="#289575" stroke-width="2"/><text x="288" y="274" class="cell" text-anchor="middle">B</text><path d="M300 257l4 4 7-9" fill="none" stroke="#289575" stroke-width="2.2" stroke-linecap="round"/><rect x="348" y="245" width="60" height="45" rx="10" fill="#fff0d9" stroke="#c18b35" stroke-width="2"/><text x="378" y="274" class="cell" text-anchor="middle">R</text><rect x="438" y="245" width="60" height="45" rx="10" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><path d="M378 214v23" stroke="#c18b35" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M372 234l6 7 6-7" fill="none" stroke="#c18b35" stroke-width="2"/></svg>