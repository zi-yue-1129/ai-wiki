<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">Speculative decoding: draft, parallel verification, first rejection and residual correction (static final state)</title><desc id="desc">Four stages show draft tokens A B C D, one parallel target verification, acceptance of A and B, rejection of C, and corrected token R from the residual distribution. D is discarded. Decisions are illustrative random draws, not equality tests.</desc>
<style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#284658}.head{font-size:17px;font-weight:750;letter-spacing:1px}.label{font-size:14px;font-weight:700;letter-spacing:.8px;fill:#607b8c}.cell{font-size:18px;font-weight:750}.note{font-size:12px;fill:#718a99}.phase{opacity:0}@media(prefers-reduced-motion:reduce){.phase{opacity:0!important}.phase0{opacity:1!important}.scan{display:none!important}}</style>
