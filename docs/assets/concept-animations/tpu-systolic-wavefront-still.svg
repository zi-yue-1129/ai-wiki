<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img"><title>Weight-stationary systolic array</title><desc>Two inputs move right through stationary weights while partial sums move down. Each cell shows its current multiply-add; the last row emits each output component on its scheduled cycle.</desc><rect width="360" height="300" rx="12" fill="#101E34"/><g font-family="system-ui,Arial,sans-serif"><text x="180" y="24" fill="#E9F1FC" font-size="15" text-anchor="middle">WEIGHT-STATIONARY ARRAY</text><text x="15" y="45" fill="#45DDC4" font-size="11" text-anchor="start">Activation</text><text x="345" y="45" fill="#FFBD6A" font-size="11" text-anchor="end">Partial sum</text><line x1="53" y1="90" x2="97" y2="90" stroke="#45DDC4" stroke-width="2" stroke-linecap="round"/><path d="M91 86 L97 90 L91 94" fill="none" stroke="#45DDC4" stroke-width="2" stroke-linejoin="round"/><line x1="182" y1="90" x2="212" y2="90" stroke="#45DDC4" stroke-width="2" stroke-linecap="round"/><path d="M206 86 L212 90 L206 94" fill="none" stroke="#45DDC4" stroke-width="2" stroke-linejoin="round"/><line x1="53" y1="177" x2="97" y2="177" stroke="#45DDC4" stroke-width="2" stroke-linecap="round"/><path d="M91 173 L97 177 L91 181" fill="none" stroke="#45DDC4" stroke-width="2" stroke-linejoin="round"/><line x1="182" y1="177" x2="212" y2="177" stroke="#45DDC4" stroke-width="2" stroke-linecap="round"/><path d="M206 173 L212 177 L206 181" fill="none" stroke="#45DDC4" stroke-width="2" stroke-linejoin="round"/><line x1="140" y1="122" x2="140" y2="144" stroke="#FFBD6A" stroke-width="2" stroke-linecap="round"/><path d="M136 138 L140 144 L144 138" fill="none" stroke="#FFBD6A" stroke-width="2" stroke-linejoin="round"/><line x1="140" y1="209" x2="140" y2="232" stroke="#FFBD6A" stroke-width="2" stroke-linecap="round"/><path d="M136 226 L140 232 L144 226" fill="none" stroke="#FFBD6A" stroke-width="2" stroke-linejoin="round"/><line x1="255" y1="122" x2="255" y2="144" stroke="#FFBD6A" stroke-width="2" stroke-linecap="round"/><path d="M251 138 L255 144 L259 138" fill="none" stroke="#FFBD6A" stroke-width="2" stroke-linejoin="round"/><line x1="255" y1="209" x2="255" y2="232" stroke="#FFBD6A" stroke-width="2" stroke-linecap="round"/><path d="M251 226 L255 232 L259 226" fill="none" stroke="#FFBD6A" stroke-width="2" stroke-linejoin="round"/><rect x="98" y="59" width="84" height="62" rx="7" fill="#152741" stroke="#304361"/><text x="140" y="78" fill="#A993F9" font-size="13" text-anchor="middle">w = 2</text><rect x="213" y="59" width="84" height="62" rx="7" fill="#152741" stroke="#304361"/><text x="255" y="78" fill="#A993F9" font-size="13" text-anchor="middle">w = 1</text><rect x="98" y="146" width="84" height="62" rx="7" fill="#152741" stroke="#304361"/><text x="140" y="165" fill="#A993F9" font-size="13" text-anchor="middle">w = 3</text><rect x="213" y="146" width="84" height="62" rx="7" fill="#152741" stroke="#304361"/><text x="255" y="165" fill="#A993F9" font-size="13" text-anchor="middle">w = 4</text><text x="20" y="257" fill="#ACBDD2" font-size="12" text-anchor="start">Output</text><text x="180" y="288" fill="#ACBDD2" font-size="12" text-anchor="middle">Cycle 3 / 5</text><rect x="214" y="60" width="82" height="60" rx="7" fill="#152741" stroke="#45DDC4"/><text x="255" y="78" fill="#A993F9" font-size="13" text-anchor="middle">w = 1</text><text x="255" y="97" fill="#E9F1FC" font-size="12" text-anchor="middle">3 × 1 + 0</text><text x="255" y="114" fill="#FFBD6A" font-size="13" text-anchor="middle">= 3</text><text x="42" y="181" fill="#45DDC4" font-size="15" text-anchor="middle">1</text><rect x="99" y="147" width="82" height="60" rx="7" fill="#152741" stroke="#45DDC4"/><text x="140" y="165" fill="#A993F9" font-size="13" text-anchor="middle">w = 3</text><text x="140" y="184" fill="#E9F1FC" font-size="12" text-anchor="middle">1 × 3 + 6</text><text x="140" y="201" fill="#FFBD6A" font-size="13" text-anchor="middle">= 9</text><rect x="214" y="147" width="82" height="60" rx="7" fill="#152741" stroke="#45DDC4"/><text x="255" y="165" fill="#A993F9" font-size="13" text-anchor="middle">w = 4</text><text x="255" y="184" fill="#E9F1FC" font-size="12" text-anchor="middle">2 × 4 + 1</text><text x="255" y="201" fill="#FFBD6A" font-size="13" text-anchor="middle">= 9</text><text x="140" y="252" fill="#FFBD6A" font-size="14" text-anchor="middle">y2 = 9</text><text x="255" y="252" fill="#FFBD6A" font-size="14" text-anchor="middle">y1 = 9</text></g></svg>