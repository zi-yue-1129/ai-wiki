<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Item neighbourhood weighted prediction</title><desc id="desc">A weighted-sum predictor first uses a single rating, then incorporates a second rated neighbour. The constructed ratings are A equals five and B equals two, with similarities 0.8 and 0.4, so the final predicted rating is four.</desc><rect width="800" height="420" fill="#f6f9fc"/><text x="30" y="38" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1d3448" text-anchor="start">Item-based CF</text><text x="30" y="61" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="start">Weighted neighbours update the predicted rating</text><path d="M30 76L770 76" fill="none" stroke="#d8e5ec" stroke-width="2" /><rect x="30" y="95" width="385" height="265" rx="12" fill="#ffffff" stroke="#d8e5ec"/><rect x="430" y="95" width="340" height="265" rx="12" fill="#ffffff" stroke="#d8e5ec"/><text x="49" y="121" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d3448" text-anchor="start">Rated neighbours</text><text x="449" y="121" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#1d3448" text-anchor="start">Target prediction</text><rect x="49" y="140" width="130" height="81" rx="11" fill="#edf4fb" stroke="#d8e5ec"/><rect x="49" y="235" width="130" height="81" rx="11" fill="#fff2e5" stroke="#d8e5ec"/><text x="69" y="171" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#3978b7" text-anchor="start">A</text><text x="99" y="168" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1d3448" text-anchor="start">r = 5</text><text x="99" y="196" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526a80" text-anchor="start">w = 0.8</text><text x="69" y="266" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#d58a34" text-anchor="start">B</text><text x="99" y="263" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#1d3448" text-anchor="start">r = 2</text><text x="99" y="291" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526a80" text-anchor="start">w = 0.4</text><text x="205" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#526a80" text-anchor="start">w × r</text><rect x="202" y="158" width="182" height="48" rx="6" fill="#edf4fb" stroke="none"/><rect x="202" y="253" width="182" height="48" rx="6" fill="#fff2e5" stroke="none"/><rect x="202" y="168" width="160" height="28" rx="5" fill="#3978b7"/><text x="280" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4.0</text><rect x="202" y="263" width="0" height="28" rx="5" fill="#d58a34"><animate attributeName="width" values="0;0;32;32;0" keyTimes="0;.25;.58;.85;1" dur="10s" repeatCount="indefinite"/></rect><g opacity="0"><text x="253" y="283" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1d3448" text-anchor="start">0.8</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.58;.85;1" dur="10s" repeatCount="indefinite"/></g><path d="M395 193L445 193" fill="none" stroke="#3978b7" stroke-width="2.5" /><path d="M395 279L445 279" fill="none" stroke="#d58a34" stroke-width="2.5" /><path d="M445 193L445 279" fill="none" stroke="#526a80" stroke-width="2" /><path d="M445 237L480 237" fill="none" stroke="#526a80" stroke-width="2.5" stroke-linecap="round"/><g opacity="1"><rect x="504" y="151" width="235" height="93" rx="12" fill="#eaf7f4" stroke="none"/><text x="621" y="178" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#168887" text-anchor="middle">4.0 / 0.8</text><text x="621" y="217" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1d3448" text-anchor="middle">= 5.0</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.25;.59;.85;1" dur="10s" repeatCount="indefinite"/></g><g opacity="0"><rect x="504" y="151" width="235" height="93" rx="12" fill="#eaf7f4" stroke="none"/><text x="621" y="178" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#168887" text-anchor="middle">4.8 / 1.2</text><text x="621" y="217" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1d3448" text-anchor="middle">= 4.0</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.59;.85;1" dur="10s" repeatCount="indefinite"/></g><text x="455" y="274" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#526a80" text-anchor="start">Rating scale</text><path d="M476 311L728 311" fill="none" stroke="#d8e5ec" stroke-width="7" stroke-linecap="round"/><path d="M476 301L476 321" fill="none" stroke="#d8e5ec" stroke-width="2" /><text x="476" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="middle">1</text><path d="M539 301L539 321" fill="none" stroke="#d8e5ec" stroke-width="2" /><text x="539" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="middle">2</text><path d="M602 301L602 321" fill="none" stroke="#d8e5ec" stroke-width="2" /><text x="602" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="middle">3</text><path d="M665 301L665 321" fill="none" stroke="#d8e5ec" stroke-width="2" /><text x="665" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="middle">4</text><path d="M728 301L728 321" fill="none" stroke="#d8e5ec" stroke-width="2" /><text x="728" y="341" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#526a80" text-anchor="middle">5</text><circle cx="665" cy="311" r="11" fill="#168887" stroke="#fff" stroke-width="3"><animate attributeName="cx" values="728;728;665;665;728" keyTimes="0;.25;.58;.85;1" dur="10s" repeatCount="indefinite"/></circle><text x="30" y="389" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526a80" text-anchor="start">A only: 5.0       A + B: 4.0  ·  Missing ratings are not zero</text><circle r="7" fill="#d58a34" opacity=".85"><animateMotion path="M 190 278 L 375 278 L 445 237 L 499 205" dur="10s" repeatCount="indefinite" keyTimes="0;.25;.55;1" keyPoints="0;0;.99;1" calcMode="linear"/></circle></svg>