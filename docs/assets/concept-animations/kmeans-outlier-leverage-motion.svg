<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">K-means mean sensitivity to an outlier</title><desc id="desc">Five fixed observations at 0 through 4 and a sixth moving observation at x from 4 to 12. The arithmetic mean moves from 2.333 to 3.667 while the median stays at 2.5. This is synthetic, not measured model behaviour.</desc><style>text{font-family:Inter,Arial,sans-serif}.moving{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduced{display:inline!important}}</style><rect width="800" height="420" rx="18" fill="#f5f9fc"/><text x="32" y="42" font-size="15" font-weight="700" fill="#243b50" text-anchor="start">K-MEANS · OUTLIER SENSITIVITY</text><rect x="32" y="72" width="736" height="295" rx="14" fill="white" stroke="#d6e3eb"/><text x="54" y="111" font-size="15" font-weight="700" fill="#243b50" text-anchor="start">One-dimensional data</text><line x1="112" y1="240" x2="688" y2="240" stroke="#d6e3eb" stroke-width="3"/><line x1="112" y1="234" x2="112" y2="250" stroke="#d6e3eb"/><text x="112" y="268" font-size="12" font-weight="600" fill="#71889a" text-anchor="middle">0</text><line x1="304" y1="234" x2="304" y2="250" stroke="#d6e3eb"/><text x="304" y="268" font-size="12" font-weight="600" fill="#71889a" text-anchor="middle">4</text><line x1="496" y1="234" x2="496" y2="250" stroke="#d6e3eb"/><text x="496" y="268" font-size="12" font-weight="600" fill="#71889a" text-anchor="middle">8</text><line x1="688" y1="234" x2="688" y2="250" stroke="#d6e3eb"/><text x="688" y="268" font-size="12" font-weight="600" fill="#71889a" text-anchor="middle">12</text><circle cx="112" cy="238" r="8" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="160" cy="238" r="8" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="208" cy="238" r="8" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="256" cy="238" r="8" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="304" cy="238" r="8" fill="#3679b7" stroke="white" stroke-width="2"/><line x1="304" y1="181" x2="688" y2="181" stroke="#dc9a38" opacity=".32" stroke-width="2" stroke-dasharray="5 6"/><g class="moving"><g transform="translate(304 0)"><path d="M0 183V222" stroke="#dc9a38" stroke-width="2" stroke-dasharray="4 5"/><circle cx="0" cy="181" r="10" fill="#dc9a38" stroke="white" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;384 0;384 0;0 0" keyTimes="0;.22;.67;.86;1" dur="12s" repeatCount="indefinite"/></g><g transform="translate(224 0)"><line x1="0" y1="273" x2="0" y2="335" stroke="#0d9488" stroke-width="2"/><path d="M-9 295L0 282L9 295Z" fill="#0d9488"/><text x="0" y="347" font-size="12" font-weight="700" fill="#0d9488" text-anchor="middle">MEAN</text><animateTransform attributeName="transform" type="translate" values="0 0;0 0;64 0;64 0;0 0" keyTimes="0;.22;.67;.86;1" dur="12s" repeatCount="indefinite"/></g></g><g class="reduced"><circle cx="688" cy="181" r="10" fill="#dc9a38"/><line x1="288" x2="288" y1="274" y2="335" stroke="#0d9488" stroke-width="2"/><text x="288" y="345" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle">MEAN</text></g><line x1="232" y1="278" x2="232" y2="306" stroke="#dc9a38" stroke-width="2" stroke-dasharray="4 4"/><line x1="232" y1="306" x2="317" y2="306" stroke="#dc9a38" stroke-width="1.5"/><text x="323" y="310" font-size="12" font-weight="700" fill="#dc9a38" text-anchor="start">MEDIAN</text><text x="55" y="390" font-size="13" font-weight="600" fill="#dc9a38" text-anchor="start">Moving observation: 4 → 12</text><text x="420" y="390" font-size="13" font-weight="600" fill="#0d9488" text-anchor="start">Mean: 2.33 → 3.67</text></svg>