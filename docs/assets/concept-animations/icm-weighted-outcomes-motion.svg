<circle id="icm-ring-3" cx="89.000" cy="263.200" r="19" fill="none" stroke="#8672b4" opacity=".55" stroke-width="5.733"><animate attributeName="stroke-width" values="5.733;4.333;2.933;4.333;5.733" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle cx="89.000" cy="263.200" r="10" fill="#8672b4" stroke="#fff" stroke-width="2"/>
