<text x="37" y="495" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#496678">EXPECTED GAP²</text>
<text x="37" y="519" font-family="Arial,sans-serif" font-size="14" fill="#7154a3">Variance floor</text>
