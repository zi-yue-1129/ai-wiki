<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
<title id="title">ICM: reweighting three outcomes changes the conditional mean and variance floor</title>
<desc id="desc">Ten-second repeating counterfactual probability sweep: the three possible next-state features stay fixed while their probabilities change. The best deterministic forecast tracks the weighted mean, and the irreducible squared-error bar changes. This is not an empirical training trace.</desc>
<rect x="1" y="1" width="398" height="638" rx="17" fill="#f7fafc" stroke="#b8ccd9"/>
<text x="22" y="40" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#243f53">Weighted outcomes</text>
<text x="22" y="77" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#637b8d">CONDITIONAL PROBABILITIES</text>
<rect x="24" y="91" width="352" height="39" rx="7" fill="#dfe9ef"/>
<rect id="icm-weight-1" x="24.000" y="91" width="46.933" height="39" fill="#267f9f"><animate attributeName="x" values="24.000;24.000;24.000;24.000;24.000" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="width" values="46.933;117.333;187.733;117.333;46.933" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></rect>
<text x="47.467" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">1<animate attributeName="x" values="47.467;82.667;117.867;82.667;47.467" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></text>
<rect id="icm-weight-2" x="70.933" y="91" width="117.333" height="39" fill="#319d91"><animate attributeName="x" values="70.933;141.333;211.733;141.333;70.933" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="width" values="117.333;117.333;117.333;117.333;117.333" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></rect>
<text x="129.600" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">2<animate attributeName="x" values="129.600;200.000;270.400;200.000;129.600" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></text>
<rect id="icm-weight-3" x="188.267" y="91" width="187.733" height="39" fill="#8672b4"><animate attributeName="x" values="188.267;258.667;329.067;258.667;188.267" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="width" values="187.733;117.333;46.933;117.333;187.733" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></rect>
<text x="282.133" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">3<animate attributeName="x" values="282.133;317.333;352.533;317.333;282.133" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></text>
