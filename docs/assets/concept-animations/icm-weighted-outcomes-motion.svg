<circle id="icm-weighted-mean" cx="151.700" cy="297.020" r="17" stroke="#7459a4" stroke-width="3" fill="#fff" fill-opacity=".9"><animate attributeName="cx" values="151.700;193.500;235.300;193.500;151.700" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="297.020;291.700;286.380;291.700;297.020" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></circle>
<circle id="icm-weighted-forecast" cx="151.700" cy="297.020" r="7" fill="#d28a3e"><animate attributeName="cx" values="151.700;193.500;235.300;193.500;151.700" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="cy" values="297.020;291.700;286.380;291.700;297.020" keyTimes="0;.25;.5;.75;1" dur="10s" calcMode="linear" repeatCount="indefinite"/></circle>
<text x="37" y="444" font-family="Arial,sans-serif" font-size="13" fill="#526d80">○ Mean / forecast</text>
