<svg xmlns="http://www.w3.org/2000/svg" width="400" height="640" viewBox="0 0 400 640" role="img" aria-labelledby="title desc">
<title id="title">ICM: reweighting three outcomes changes the conditional mean and variance floor</title>
<desc id="desc">Ten-second repeating counterfactual probability sweep: the three possible next-state features stay fixed while their probabilities change. The best deterministic forecast tracks the weighted mean; the variance floor is partitioned into three probability-weighted squared-distance contributions, colored like the outcomes. This is not an empirical training trace.</desc>
