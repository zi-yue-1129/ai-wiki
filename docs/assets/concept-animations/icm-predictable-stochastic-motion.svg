<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="iv-title iv-desc">
<title id="iv-title">ICM: predictable and stochastic next-state features</title>
<desc id="iv-desc">The same feature and action can lead to a reproducible or a stochastic next feature. In the predictable case the orange forward prediction learns toward a fixed green next feature and the illustrated squared-error bar decreases with the squared feature-space distance. In the stochastic case, the actual encoded next feature changes between repeated transitions even though the input is unchanged, so the orange model prediction cannot match all outcomes. The three equally weighted illustrative outcomes have their arithmetic mean at the fixed orange prediction; the orange error bar is proportional to each sampled squared distance, not a measured training loss. A repeated input pulse precedes each discrete outcome change; no interpolated positions represent observations. This is a schematic limitation, not a claim that inverse dynamics never filters noise. A translucent outline joins the three possible outcomes around their equal-weight mean. A violet tick marks the expected squared error across these outcomes; the orange bar shows only the currently sampled squared error. The tick represents a hypothetical conditional-variance floor for a fixed encoder and optimal deterministic mean predictor, not a measured reward.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif} .head{font-weight:700;fill:#223950} .small{font-size:16px;fill:#587086} .border{stroke:#d6e2ed;stroke-width:2} .line{stroke:#d4a272;stroke-width:2.8;stroke-dasharray:5 5;fill:none}.resting{display:none}
@media(prefers-reduced-motion:reduce){.animated{display:none}.resting{display:inline}}
</style>
