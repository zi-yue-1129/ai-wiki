<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DIAL differentiable training channel versus discrete execution</title><desc id="desc">Illustrative scalar message 0.40 becomes sigmoid(0.40 minus 0.10) approximately 0.574 in training and a single binary bit 1 in decentralised execution. Only the training channel carries backpropagated receiver gradients.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f5f8fc" stroke="#f5f8fc" stroke-width="0"/><text x="320" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#1d334b">DIAL: training and execution</text><rect x="18" y="61" width="294" height="278" rx="16" fill="#fff" stroke="#cad9e6" stroke-width="1.5"/><rect x="31" y="73" width="99" height="29" rx="14" fill="#e3f5f0" stroke="none" stroke-width="0"/><text x="80" y="93" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#008e89">TRAIN</text><rect x="34" y="139" width="64" height="58" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.5"/><text x="66" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#2776b7">m</text><text x="66" y="183" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1d334b">0.40</text><rect x="128" y="139" width="77" height="58" rx="10" fill="#e3f5f0" stroke="#008e89" stroke-width="1.5"/><text x="166" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#008e89">DRU</text><text x="166" y="183" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#526781">sigmoid</text><rect x="232" y="139" width="65" height="58" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.5"/><text x="264" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1d334b">value</text><text x="264" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#008e89">0.574</text><path d="M98 167 H128" fill="none" stroke="#2776b7" stroke-width="3" stroke-linecap="round"/><path d="M205 167 H232" fill="none" stroke="#2776b7" stroke-width="3" stroke-linecap="round"/><text x="166" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526781">m + noise = 0.30</text><text x="165" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#008e89">continuous channel</text><rect x="328" y="61" width="294" height="278" rx="16" fill="#fff" stroke="#cad9e6" stroke-width="1.5"/><rect x="341" y="73" width="99" height="29" rx="14" fill="#fff2e1" stroke="none" stroke-width="0"/><text x="390" y="93" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#bb721c">EXECUTE</text><rect x="344" y="139" width="64" height="58" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.5"/><text x="376" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#2776b7">m</text><text x="376" y="183" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1d334b">0.40</text><rect x="438" y="139" width="77" height="58" rx="10" fill="#fff3e6" stroke="#bb721c" stroke-width="1.5"/><text x="476" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#bb721c">DRU</text><text x="476" y="183" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#526781">threshold</text><rect x="542" y="139" width="65" height="58" rx="10" fill="#edf4fb" stroke="#2776b7" stroke-width="1.5"/><text x="574" y="162" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1d334b">bit</text><text x="574" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#bb721c">1</text><path d="M408 167 H438" fill="none" stroke="#2776b7" stroke-width="3" stroke-linecap="round"/><path d="M515 167 H542" fill="none" stroke="#2776b7" stroke-width="3" stroke-linecap="round"/><text x="476" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#526781">m > 0</text><text x="475" y="236" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#bb721c">binary channel</text><path d="M266 206 V259 H72 V207" fill="none" stroke="#ac4f91" stroke-width="3.3" stroke-linecap="round"/><text x="170" y="281" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ac4f91">receiver gradient</text><path d="M382 260 H573" fill="none" stroke="#bb721c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 6"/><text x="474" y="283" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#bb721c">no cross-agent gradient</text><rect x="105" y="300" width="124" height="20" rx="10" fill="#fbeef7" stroke="none" stroke-width="0"/><text x="167" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#ac4f91">training only</text><rect x="397" y="300" width="155" height="20" rx="10" fill="#fff3e6" stroke="none" stroke-width="0"/><text x="474" y="314" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#bb721c">decentralised use</text><rect x="248" y="208" width="44" height="8" rx="4" fill="#e9eef4" stroke="none" stroke-width="0"/><rect x="248" y="208" width="0" height="8" rx="4" fill="#008e89"><animate attributeName="width" values="0;0;25.25;25.25;0" keyTimes="0;0.24;0.52;0.91;1" dur="12s" repeatCount="indefinite"/></rect><circle r="6" fill="#2776b7" stroke="white" stroke-width="2"><animateMotion path="M101 167 H126" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.38;0.43;1" dur="12s" begin="0s" repeatCount="indefinite"/></circle><circle r="6" fill="#008e89" stroke="white" stroke-width="2"><animateMotion path="M205 167 H232" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.38;0.43;1" dur="12s" begin="2s" repeatCount="indefinite"/></circle><circle r="6" fill="#bb721c" stroke="white" stroke-width="2"><animateMotion path="M575 167 H591" dur="12s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.38;0.43;1" dur="12s" begin="0s" repeatCount="indefinite"/></circle><circle r="6" fill="#ac4f91" stroke="white" stroke-width="2"><animateMotion path="M266 206 V259 H72 V207" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.15;0.38;0.43;1" dur="12s" begin="4s" repeatCount="indefinite"/></circle><rect x="132" y="135" width="75" height="66" rx="11" fill="none" stroke="#008e89" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.2;0.35;0.5;1" dur="12s" repeatCount="indefinite"/></rect></svg>