<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">GIN: Multiset Counts</title><desc id="desc">Two neighbours with scalar value 1 and three neighbours with the same scalar value 1 have equal mean 1 but unequal sums 2 and 3. GIN uses sum aggregation plus an MLP. All values are schematic.</desc><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7fafc" stroke="#dbe5ed" stroke-width="1" /><text x="24" y="37" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#24364b" text-anchor="start">GIN: Multiset Counts</text><text x="24" y="58" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#62778a" text-anchor="start">Mean collapses multiplicity; sum can preserve it.</text><rect x="24" y="82" width="287" height="240" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1" /><rect x="324" y="82" width="292" height="240" rx="12" fill="#ffffff" stroke="#dbe5ed" stroke-width="1" /><text x="42" y="108" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">NEIGHBOUR MULTISETS</text><text x="342" y="108" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">AGGREGATION</text><text x="375" y="134" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">MEAN</text><text x="523" y="134" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#62778a" text-anchor="start">SUM</text><text x="42" y="122" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24364b" text-anchor="start">A</text><line x1="78" y1="267" x2="250" y2="267" stroke="#dbe5ed" stroke-width="2.8" stroke-linecap="round" /><line x1="78" y1="267" x2="180" y2="299" stroke="#dbe5ed" stroke-width="2.8" stroke-linecap="round" /><line x1="78" y1="267" x2="180" y2="235" stroke="#dbe5ed" stroke-width="2.8" stroke-linecap="round" /><line x1="78" y1="166" x2="242.0" y2="186" stroke="#dbe5ed" stroke-width="2.8" stroke-linecap="round" /><line x1="78" y1="166" x2="178.0" y2="146" stroke="#dbe5ed" stroke-width="2.8" stroke-linecap="round" /><circle cx="78" cy="166" r="23" fill="#e9e1f3" stroke="#8455a8" stroke-width="2.2" /><text x="78" y="171" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24364b" text-anchor="middle">v</text><circle cx="178" cy="146" r="19" fill="#eaf4fb" stroke="#3968ad" stroke-width="2.1" /><text x="178" y="151" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">1</text><circle cx="242" cy="186" r="19" fill="#eaf4fb" stroke="#3968ad" stroke-width="2.1" /><text x="242" y="191" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">1</text><rect x="338" y="146" width="120" height="50" rx="9" fill="#eef4f8" stroke="none" stroke-width="1" /><rect x="471" y="146" width="128" height="50" rx="9" fill="#e8f6f5" stroke="none" stroke-width="1" /><text x="398" y="177" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#3968ad" text-anchor="middle">1</text><text x="535" y="177" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f84" text-anchor="middle">2</text><text x="42" y="223" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24364b" text-anchor="start">B</text><circle cx="78" cy="267" r="23" fill="#e9e1f3" stroke="#8455a8" stroke-width="2.2" /><text x="78" y="272" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#24364b" text-anchor="middle">v</text><circle cx="180" cy="235" r="19" fill="#eaf4fb" stroke="#3968ad" stroke-width="2.1" /><text x="180" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">1</text><circle cx="180" cy="299" r="19" fill="#eaf4fb" stroke="#3968ad" stroke-width="2.1" /><text x="180" y="304" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">1</text><circle cx="250" cy="267" r="19" fill="#eaf4fb" stroke="#3968ad" stroke-width="2.1" /><text x="250" y="272" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#24364b" text-anchor="middle">1</text><rect x="338" y="247" width="120" height="50" rx="9" fill="#eef4f8" stroke="none" stroke-width="1" /><rect x="471" y="247" width="128" height="50" rx="9" fill="#e8f6f5" stroke="none" stroke-width="1" /><text x="398" y="278" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#3968ad" text-anchor="middle">1</text><text x="535" y="278" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f84" text-anchor="middle">3</text><line x1="342" y1="303" x2="596" y2="303" stroke="#dbe5ed" stroke-width="1" stroke-linecap="round" /><text x="344" y="316" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="500" fill="#62778a" text-anchor="start">A and B: same mean, different sum</text><text x="29" y="346" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#62778a" text-anchor="start">Illustrative scalar features · no learned MLP applied</text></svg>
