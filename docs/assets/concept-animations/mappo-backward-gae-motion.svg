<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">MAPPO backward GAE recursion with a centralised value function</title><desc id="dsc">A three-step example computes TD residuals using centralised values and propagates weighted advantages backward from t=2 to t=0; numbers are schematic, not actual agent training measurements.</desc><defs><marker id="blue-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3468b2"/></marker><marker id="teal-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b8992"/></marker><marker id="magenta-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bb5087"/></marker><marker id="amber-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c17a25"/></marker></defs><style>@media(prefers-reduced-motion:reduce){.pulse,.glow{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f6f9fe" stroke="#f6f9fe" stroke-width="1.3"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#dbe4ef" stroke-width="1"/><text x="27" y="37" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#24364b">MAPPO / backward GAE</text><rect x="468" y="17" width="145" height="28" rx="14" fill="#e9f1fd" stroke="#e9f1fd" stroke-width="0"/><text x="540" y="36" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3468b2">γ=0.9    λ=0.8</text><rect x="23" y="59" width="594" height="251" rx="12" fill="white" stroke="#dbe4ef" stroke-width="1.3"/><text x="42" y="84" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="star