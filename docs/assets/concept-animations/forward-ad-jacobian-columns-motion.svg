<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Building Jacobian columns by forward-mode passes</title><desc id="desc">Two different basis seeds e1 and e2 pass through the same primal computation to produce Jacobian columns (5,1) and (2,-1), for F=(xy+2x,x-y) at (2,3). Synthetic exact arithmetic, not model measurements.</desc><rect width="800" height="420" rx="18" fill="#f5f9fc"/><rect x="17" y="16" width="766" height="386" rx="16" fill="#fff" stroke="#dce7ee"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="52" font-size="22" fill="#20364b" font-weight="700">Forward-mode • recover columns</text><text x="38" y="73" font-size="13" fill="#64798e" >F = (xy + 2x, x − y)   •   x = 2, y = 3</text><rect x="37" y="93" width="222" height="258" rx="13" fill="#f8fafc" stroke="#dce7ef"/><rect x="276" y="93" width="217" height="258" rx="13" fill="#f8fafc" stroke="#dce7ef"/><rect x="510" y="93" width="253" height="258" rx="13" fill="#f8fafc" stroke="#dce7ef"/><text x="54" y="122" font-size="15" fill="#20364b" font-weight="700">Seed</text><text x="292" y="122" font-size="15" fill="#20364b" font-weight="700">JVP</text><text x="528" y="122" font-size="15" fill="#20364b" font-weight="700">Jacobian J</text><rect x="66" y="149" width="164" height="68" rx="10" fill="#0b8b8a" fill-opacity=".08" stroke="#0b8b8a" stroke-width="1.6"/><text x="148" y="179" font-size="19" fill="#0b8b8a" font-weight="700" text-anchor="middle">e₁ = (1, 0)</text><text x="148" y="200" font-size="12" fill="#64798e" text-anchor="middle">one input direction</text><rect x="66" y="251" width="164" height="68" rx="10" fill="#de8540" fill-opacity=".08" stroke="#de8540" stroke-width="1.6"/><text x="148" y="281" font-size="19" fill="#de8540" font-weight="700" text-anchor="middle">e₂ = (0, 1)</text><text x="148" y="302" font-size="12" fill="#64798e" text-anchor="middle">second direction</text><rect x="305" y="149" width="160" height="68" rx="10" fill="#0b8b8a" fill-opacity=".08" stroke="#0b8b8a" stroke-width="1.6"/><text x="385" y="179" font-size="19" fill="#0b8b8a" font-weight="700" text-anchor="middle">(5, 1)</text><text x="385" y="200" font-size="12" fill="#64798e" text-anchor="middle">first column</text><rect x="305" y="251" width="160" height="68" rx="10" fill="#de8540" fill-opacity=".08" stroke="#de8540" stroke-width="1.6"/><text x="385" y="281" font-size="19" fill="#de8540" font-weight="700" text-anchor="middle">(2, −1)</text><text x="385" y="302" font-size="12" fill="#64798e" text-anchor="middle">second column</text><path d="M231 183 H302 M231 285 H302 M467 183 H551 M467 285 C501 285 514 258 551 249" fill="none" stroke="#bac9d5" stroke-width="3" stroke-linecap="round"/><path d="M573 156 V297 M728 156 V297" stroke="#95a8ba" stroke-width="2.5" fill="none"/><rect x="584" y="165" width="61" height="116" rx="10" fill="#0b8b8a" fill-opacity=".1" stroke="#0b8b8a" stroke-width="1.6"/><rect x="653" y="165" width="61" height="116" rx="10" fill="#de8540" fill-opacity=".1" stroke="#de8540" stroke-width="1.6"/><text x="614" y="202" font-size="22" fill="#0b8b8a" font-weight="700" text-anchor="middle">5</text><text x="682" y="202" font-size="22" fill="#de8540" font-weight="700" text-anchor="middle">2</text><text x="614" y="258" font-size="22" fill="#0b8b8a" font-weight="700" text-anchor="middle">1</text><text x="682" y="258" font-size="22" fill="#de8540" font-weight="700" text-anchor="middle">−1</text><text x="610" y="315" font-size="13" fill="#0b8b8a" text-anchor="middle">e₁</text><text x="682" y="315" font-size="13" fill="#de8540" text-anchor="middle">e₂</text><circle cx="231" cy="183" r="7" fill="#0b8b8a"><animate attributeName="cx" values="231;302;467;551;551" keyTimes="0;.24;.65;.86;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.49;.5;.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><circle cx="231" cy="285" r="7" fill="#de8540" opacity="0"><animate attributeName="cx" values="231;231;302;467;551" keyTimes="0;.5;.65;.84;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.5;.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><rect x="648" y="160" width="71" height="126" rx="13" stroke="#de8540" fill="none" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.49;.5;.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><rect x="579" y="160" width="71" height="126" rx="13" stroke="#0b8b8a" fill="none" stroke-width="3" opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.49;.5;.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect><text x="42" y="382" font-size="12" fill="#64798e" >2 forward sweeps → 2 Jacobian columns • synthetic arithmetic</text></g></svg>