<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Multilabel accuracy: error placement matters</title><desc id="desc">Four records with three labels each and three wrong cells. Spreading errors across three records yields 25 percent exact match; clustering three errors in one record yields 75 percent exact match. Label-wise accuracy is 75 percent in both layouts.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15384c}.h{font-size:18px;font-weight:700}.sub{font-size:11px;fill:#687c8b}.label{font-size:12px;font-weight:700}.score{font-size:25px;font-weight:700}.value{font-size:15px;font-weight:700}.tick{font-size:15px;font-weight:700}.scene{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.scene{display:none!important}.reduced{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f1f6fa"/><rect x="14" y="14" width="612" height="332" rx="14" fill="white" stroke="#dce6ee"/><text x="34" y="47" class="h" text-anchor="start">MULTILABEL ACCURACY</text><text x="34" y="68" class="sub" text-anchor="start">Same 3 wrong labels  ·  different affected samples</text><g class="scene" opacity="1"><rect x="33" y="84" width="366" height="241" rx="11" fill="#f8fbfd" stroke="#d6e3ea" stroke-width="1"/><text x="50" y="106" class="label" text-anchor="start">4 samples  ×  3 labels</text><text x="68" y="143" class="sub" text-anchor="middle">1</text><rect x="90" y="120" width="39" height="33" rx="6" fill="#fbe0d1" stroke="#daab92" stroke-width="1"/><path d="M104.5,131 l10,10 m0,-10 l-10,10" stroke="#b65330" stroke-width="2.6" fill="none" stroke-linecap="round"/><rect x="141" y="120" width="39" height="33" rx="6" fill="#d8f2e8" stroke="#93d0bc" stroke-width="1"/><path d="M154.5,135 l4,4 8,-10" stroke="#087f72" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="192" y="120" width="39" height="33" rx=