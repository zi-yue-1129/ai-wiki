<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Weak supervision label function votes and calibrated probabilities</title><desc id="desc">Three labeling functions vote positive, negative or abstain on four toy examples. Highlighted example votes correspond to output probabilities under assumed known, independent function accuracies; probabilities are illustrative, not fitted from these four examples.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f6f8fc" stroke="none" /><rect x="14" y="13" width="612" height="334" rx="14" fill="#fff" stroke="#dae4ed" /><text x="30" y="45" font-size="21" font-weight="700" fill="#203651" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Weak supervision</text><text x="30" y="63" font-size="11" font-weight="500" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Label functions → probabilistic labels</text><rect x="28" y="80" width="315" height="239" rx="9" fill="#fbfdff" stroke="#dae4ed" /><rect x="355" y="80" width="257" height="239" rx="9" fill="#fbfdff" stroke="#dae4ed" /><text x="42" y="105" font-size="14" font-weight="700" fill="#203651" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LF votes</text><text x="369" y="105" font-size="14" font-weight="700" fill="#203651" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Label model</text><text x="138" y="128" font-size="11" font-weight="700" fill="#60768d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">E1</text><text x="191" y="128" font-size="11" font-weight="700" fill="#60768d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">E2</text><text x="244" y="128" font-size="11" font-weight="700" fill="#60768d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">E3</text><text x="297" y="128" font-size="11" font-weight="700" fill="#60768d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">E4</text><text x="44" y="166" font-size="12" font-weight="700" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LF1</text><rect x="121" y="145" width="34" height="35" rx="7" fill="#eaf7f5" stroke="none" /><text x="138" y="169" font-size="17" font-weight="700" fill="#087f89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+</text><rect x="174" y="145" width="34" height="35" rx="7" fill="#eaf7f5" stroke="none" /><text x="191" y="169" font-size="17" font-weight="700" fill="#087f89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+</text><rect x="227" y="145" width="34" height="35" rx="7" fill="#edf1f5" stroke="none" /><text x="244" y="169" font-size="17" font-weight="700" fill="#8c9aa8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">–</text><rect x="280" y="145" width="34" height="35" rx="7" fill="#eaf7f5" stroke="none" /><text x="297" y="169" font-size="17" font-weight="700" fill="#087f89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+</text><text x="44" y="219" font-size="12" font-weight="700" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LF2</text><rect x="121" y="198" width="34" height="35" rx="7" fill="#eaf7f5" stroke="none" /><text x="138" y="222" font-size="17" font-weight="700" fill="#087f89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">+</text><rect x="174" y="198" width="34" height="35" rx="7" fill="#fff1e5" stroke="none" /><text x="191" y="222" font-size="17" font-weight="700" fill="#bb6930" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−</text><rect x="227" y="198" width="34" height="35" rx="7" fill="#fff1e5" stroke="none" /><text x="244" y="222" font-size="17" font-weight="700" fill="#bb6930" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−</text><rect x="280" y="198" width="34" height="35" rx="7" fill="#edf1f5" stroke="none" /><text x="297" y="222" font-size="17" font-weight="700" fill="#8c9aa8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">–</text><text x="44" y="272" font-size="12" font-weight="700" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">LF3</text><rect x="121" y="251" width="34" height="35" rx="7" fill="#edf1f5" stroke="none" /><text x="138" y="275" font-size="17" font-weight="700" fill="#8c9aa8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">–</text><rect x="174" y="251" width="34" height="35" rx="7" fill="#edf1f5" stroke="none" /><text x="191" y="275" font-size="17" font-weight="700" fill="#8c9aa8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">–</text><rect x="227" y="251" width="34" height="35" rx="7" fill="#fff1e5" stroke="none" /><text x="244" y="275" font-size="17" font-weight="700" fill="#bb6930" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−</text><rect x="280" y="251" width="34" height="35" rx="7" fill="#fff1e5" stroke="none" /><text x="297" y="275" font-size="17" font-weight="700" fill="#bb6930" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">−</text><text x="42" y="303" font-size="11" font-weight="500" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">+ / − = vote     – = abstain</text><text x="369" y="150" font-size="12" font-weight="700" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">E1</text><rect x="397" y="133" width="147" height="23" rx="7" fill="#edf2f7" stroke="none" /><rect x="397" y="133" width="137" height="23" rx="7" fill="#087f89" stroke="none" /><text x="558" y="150" font-size="12" font-weight="700" fill="#203651" text-anchor="start" font-family="Arial,Helvetica,sans-serif">0.93</text><text x="369" y="193" font-size="12" font-weight="700" fill="#60768d" text-anchor="start" font-family="Arial,Helvetica,sans-serif">E2</text><rect x="397" y="176" width="147" height="23" rx="7" fill="#edf2f7"