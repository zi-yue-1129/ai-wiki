<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">ROC-AUC can agree while average precision differs</title><desc id="desc">Two synthetic rankings, positive negative negative positive and negative positive positive negative, each have two wins in four positive-negative pairs and hence ROC AUC 0.5. Average precision differs, 0.75 and seven twelfths, because positive items appear at different ranks.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f6fbfe"/><stop offset="1" stop-color="#eaf4f8"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#204357}.title{font-size:19px;font-weight:750}.sub{font-size:12px;font-weight:550;fill:#668293}.label{font-size:13px;font-weight:700}.mini{font-size:11px;font-weight:600}.big{font-size:27px;font-weight:760}.still{display:none}.moving{display:inline}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="url(#bg)"/><text x="26" y="35" class="title" >SAME ROC-AUC · DIFFERENT AP</text><text x="26" y="56" class="sub" >Equal pairwise wins need not mean equal early retrieval quality</text><rect x="25" y="76" width="286" height="246" rx="12" fill="white" stroke="#d5e5ed"/><text x="45" y="104" class="label" >RANKING A</text><text x="291" y="104" class="label" text-anchor="end">AP .750</text><text x="45" y="119" class="mini" >AUC = 0.500</text><text x="291" y="119" class="mini" text-anchor="end">2 / 4 pairs</text><text x="47" y="157" class="mini" >1</text><circle cx="86" cy="152" r="13" fill="#2a9389" opacity=".95"/><text x="86" y="156" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">+</text><rect x="114" y="145" width="101" height="14" rx="5" fill="#e8f0f3"/><rect x="114" y="145" width="90.0" height="14" rx="5" fill="#72c8b6"/><text x="227" y="156" class="mini" >+0.500</text><text x="47" y="195" class="mini" >2</text><circle cx="86" cy="190" r="13" fill="#e29b65" opacity=".95"/><text x="86" y="194" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">−</text><rect x="114" y="183" width="101" height="14" rx="5" fill="#e8f0f3"/><text x="227" y="194" class="mini" >—</text><text x="47" y="233" class="mini" >3</text><circle cx="86" cy="228" r="13" fill="#e29b65" opacity=".95"/><text x="86" y="232" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">−</text><rect x="114" y="221" width="101" height="14" rx="5" fill="#e8f0f3"/><text x="227" y="232" class="mini" >—</text><text x="47" y="271" class="mini" >4</text><circle cx="86" cy="266" r="13" fill="#2a9389" opacity=".95"/><text x="86" y="270" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">+</text><rect x="114" y="259" width="101" height="14" rx="5" fill="#e8f0f3"/><rect x="114" y="259" width="45.0" height="14" rx="5" fill="#72c8b6"/><text x="227" y="270" class="mini" >+0.250</text><text x="45" y="308" class="mini" >AP = mean precision at positive ranks</text><rect x="329" y="76" width="286" height="246" rx="12" fill="white" stroke="#d5e5ed"/><text x="349" y="104" class="label" >RANKING B</text><text x="595" y="104" class="label" text-anchor="end">AP .583</text><text x="349" y="119" class="mini" >AUC = 0.500</text><text x="595" y="119" class="mini" text-anchor="end">2 / 4 pairs</text><text x="351" y="157" class="mini" >1</text><circle cx="390" cy="152" r="13" fill="#e29b65" opacity=".95"/><text x="390" y="156" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">−</text><rect x="418" y="145" width="101" height="14" rx="5" fill="#e8f0f3"/><text x="531" y="156" class="mini" >—</text><text x="351" y="195" class="mini" >2</text><circle cx="390" cy="190" r="13" fill="#2a9389" opacity=".95"/><text x="390" y="194" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">+</text><rect x="418" y="183" width="101" height="14" rx="5" fill="#e8f0f3"/><rect x="418" y="183" width="45.0" height="14" rx="5" fill="#72c8b6"/><text x="531" y="194" class="mini" >+0.250</text><text x="351" y="233" class="mini" >3</text><circle cx="390" cy="228" r="13" fill="#2a9389" opacity=".95"/><text x="390" y="232" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">+</text><rect x="418" y="221" width="101" height="14" rx="5" fill="#e8f0f3"/><rect x="418" y="221" width="60.0" height="14" rx="5" fill="#72c8b6"/><text x="531" y="232" class="mini" >+0.333</text><text x="351" y="271" class="mini" >4</text><circle cx="390" cy="266" r="13" fill="#e29b65" opacity=".95"/><text x="390" y="270" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" fill="white">−</text><rect x="418" y="259" width="101" height="14" rx="5" fill="#e8f0f3"/><text x="531" y="270" class="mini" >—</text><text x="349" y="308" class="mini" >AP = mean precision at positive ranks</text><text x="26" y="346" class="mini" >ILLUSTRATIVE RANKINGS · 2 POSITIVES / 2 NEGATIVES IN EACH LIST</text></svg>