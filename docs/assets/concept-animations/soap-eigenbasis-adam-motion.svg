<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">SOAP rotates a matrix gradient, adapts it, and rotates back</title><desc id="desc">A two-by-two example of SOAP: a matrix gradient transforms to an eigenbasis, an illustrative coordinate-wise Adam update is applied there, and the update is transformed back. Signals travel through the transformations in a continuous loop.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#203b52}.h{font-size:13px;font-weight:760;letter-spacing:.35px}.cap{font-size:10px;letter-spacing:1.3px;font-weight:800;fill:#60788b}.lbl{font-size:12px;fill:#60788b}.num{font-size:14px;font-weight:750}.tiny{font-size:10px;fill:#60788b}@media(prefers-reduced-motion:reduce){animate,animateMotion,animateTransform{display:none!important}}</style><rect width="640" height="360" rx="18" fill="#f5f9fc"/><rect x="18" y="52" width="604" height="288" rx="16" fill="white" stroke="#d7e4eb"/><text x="27" y="31" class="cap">SOAP  ·  EIGENBASIS  →  ADAM  →  BACK</text><rect x="35" y="81" width="117" height="219" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><text x="94" y="110" class="h" text-anchor="middle">G</text><rect x="48" y="133" width="44" height="44" rx="8" fill="#d9e5f2" stroke="#d7e4eb"/><text x="70" y="160" class="num" text-anchor="middle">3</text><rect x="96" y="133" width="44" height="44" rx="8" fill="#d9e5f2" stroke="#d7e4eb"/><text x="118" y="160" class="num" text-anchor="middle">1</text><rect x="48" y="181" width="44" height="44" rx="8" fill="#d9e5f2" stroke="#d7e4eb"/><text x="70" y="208" class="num" text-anchor="middle">1</text><rect x="96" y="181" width="44" height="44" rx="8" fill="#d9e5f2" stroke="#d7e4eb"/><text x="118" y="208" class="num" text-anchor="middle">3</text><text x="94" y="265" class="cap" text-anchor="middle">gradient</text><rect x="186" y="81" width="117" height="219" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><text x="245" y="110" class="h" text-anchor="middle">Qᵀ G Q</text><rect x="199" y="133" width="44" height="44" rx="8" fill="#c9ece6" stroke="#d7e4eb"/><text x="221" y="160" class="num" text-anchor="middle">4</text><rect x="247" y="133" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="269" y="160" class="num" text-anchor="middle">0</text><rect x="199" y="181" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="221" y="208" class="num" text-anchor="middle">0</text><rect x="247" y="181" width="44" height="44" rx="8" fill="#c9ece6" stroke="#d7e4eb"/><text x="269" y="208" class="num" text-anchor="middle">2</text><text x="245" y="265" class="cap" text-anchor="middle">rotate</text><rect x="194" y="125" width="101" height="106" rx="10" fill="none" stroke="#008c85" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.18;.35;.94;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><rect x="337" y="81" width="117" height="219" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><text x="396" y="110" class="h" text-anchor="middle">Adam</text><rect x="350" y="133" width="44" height="44" rx="8" fill="#fce4c7" stroke="#d7e4eb"/><text x="372" y="160" class="num" text-anchor="middle">1</text><rect x="398" y="133" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="420" y="160" class="num" text-anchor="middle">0</text><rect x="350" y="181" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="372" y="208" class="num" text-anchor="middle">0</text><rect x="398" y="181" width="44" height="44" rx="8" fill="#fce4c7" stroke="#d7e4eb"/><text x="420" y="208" class="num" text-anchor="middle">1.6</text><text x="396" y="265" class="cap" text-anchor="middle">scale</text><rect x="345" y="125" width="101" height="106" rx="10" fill="none" stroke="#e39943" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.39;.47;.94;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><rect x="488" y="81" width="117" height="219" rx="12" fill="#f8fbfd" stroke="#d7e4eb"/><text x="547" y="110" class="h" text-anchor="middle">Q U Qᵀ</text><rect x="501" y="133" width="44" height="44" rx="8" fill="#c9ece6" stroke="#d7e4eb"/><text x="523" y="160" class="num" text-anchor="middle">1.3</text><rect x="549" y="133" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="571" y="160" class="num" text-anchor="middle">-0.3</text><rect x="501" y="181" width="44" height="44" rx="8" fill="#f1f5f7" stroke="#d7e4eb"/><text x="523" y="208" class="num" text-anchor="middle">-0.3</text><rect x="549" y="181" width="44" height="44" rx="8" fill="#c9ece6" stroke="#d7e4eb"/><text x="571" y="208" class="num" text-anchor="middle">1.3</text><text x="547" y="265" class="cap" text-anchor="middle">restore</text><rect x="496" y="125" width="101" height="106" rx="10" fill="none" stroke="#008c85" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.67;.75;.94;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><path d="M154 180 H182" stroke="#60788b" stroke-width="2" opacity=".6"/><path d="M177 175 L182 180 L177 185" stroke="#60788b" stroke-width="2" fill="none"/><circle cx="154" cy="180" r="5" fill="#3469ac" opacity="0"><animate attributeName="cx" values="154;154;182;182;182" keyTimes="0;.05;.23;.31;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.23;.31;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></circle><path d="M305 180 H333" stroke="#60788b" stroke-width="2" opacity=".6"/><path d="M328 175 L333 180 L328 185" stroke="#60788b" stroke-width="2" fill="none"/><circle cx="305" cy="180" r="5" fill="#008c85" opacity="0"><animate attributeName="cx" values="305;305;333;333;333" keyTimes="0;.31;.49;.57;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" valu