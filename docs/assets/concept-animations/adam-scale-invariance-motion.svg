<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Adam positive gradient scale invariance</title><desc id="desc">An illustrative constant positive gradient history is uniformly scaled from one to eight. The bias-corrected momentum and root second moment both scale by eight, while the magnitude of their ratio stays one when epsilon equals zero. The animated bar interpolation is illustrative.</desc><style>text{font-family:Inter,Arial,sans-serif}@media(prefers-reduced-motion:reduce){.cursor{opacity:0!important}}</style><rect x="0" y="0" width="800" height="420" rx="18" fill="#f5f9fc" stroke="none"/><text x="34" y="42" font-size="16" fill="#18344c" font-weight="750" text-anchor="start">ADAM · GRADIENT RESCALING</text><text x="34" y="67" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">Positive constant gradient · ε = 0 · corrected moments</text><rect x="40" y="99" width="335" height="240" rx="14" fill="white" stroke="#d8e5ec"/><text x="58" y="129" font-size="16" fill="#18344c" font-weight="750" text-anchor="start">BASE  ×1</text><text x="60" y="157" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">m-hat</text><rect x="60" y="165" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="60" y="165" width="31.25" height="18" rx="5" fill="#2876b5" stroke="none"/><text x="350" y="180" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">1</text><text x="60" y="217" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">sqrt(v-hat)</text><rect x="60" y="225" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="60" y="225" width="31.25" height="18" rx="5" fill="#dc8740" stroke="none"/><text x="350" y="240" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">1</text><text x="60" y="277" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">m / sqrt(v)</text><rect x="60" y="285" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="60" y="285" width="31.25" height="18" rx="5" fill="#079a89" stroke="none"/><text x="350" y="300" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">1</text><rect x="424" y="99" width="335" height="240" rx="14" fill="white" stroke="#d8e5ec"/><text x="442" y="129" font-size="16" fill="#18344c" font-weight="750" text-anchor="start">TARGET  ×8</text><text x="444" y="157" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">m-hat</text><rect x="444" y="165" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="444" y="165" width="250" height="18" rx="5" fill="#2876b5" stroke="none"/><text x="734" y="180" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">8</text><text x="444" y="217" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">sqrt(v-hat)</text><rect x="444" y="225" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="444" y="225" width="250" height="18" rx="5" fill="#dc8740" stroke="none"/><text x="734" y="240" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">8</text><text x="444" y="277" font-size="12" fill="#6f8799" font-weight="600" text-anchor="start">m / sqrt(v)</text><rect x="444" y="285" width="278" height="18" rx="5" fill="#e9f0f4" stroke="none"/><rect x="444" y="285" width="31.25" height="18" rx="5" fill="#079a89" stroke="none"/><text x="734" y="300" font-size="12" fill="#18344c" font-weight="700" text-anchor="end">1</text><path d="M378 210 L411 210" fill="none" stroke="#6f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M405 204 L412 210 L405 216" fill="none" stroke="#6f8799" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="444" y="165" width="31.25" height="18" rx="5" fill="#2876b5"><animate attributeName="width" values="31.25;250;31.25" keyTimes="0;.6;1" dur="10s" repeatCount="indefinite"/></rect><rect x="444" y="225" width="31.25" height="18" rx="5" fill="#dc8740"><animate attributeName="width" values="31.25;250;31.25" keyTimes="0;.6;1" dur="10s" repeatCount="indefinite"/></rect><path d="M465 374 H750" fill="none" stroke="#d8e5ec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="465" cy="374" r="10" fill="#2876b5" stroke="white" stroke-width="3"><animate attributeName="cx" values="465;750;465" keyTimes="0;.6;1" dur="10s" repeatCount="indefinite"/></circle><text x="400" y="402" font-size="12" fill="#6f8799" font-weight="500" text-anchor="middle">Both corrected moments scale; their ratio is unchanged.</text></svg>