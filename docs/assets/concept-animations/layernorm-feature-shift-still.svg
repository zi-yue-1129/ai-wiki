<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Layer normalisation: common input shift</title><desc id="svg-desc">A feature vector is shifted by plus two. Its mean moves with the features while the standardised values remain unchanged. Illustrative values and gamma one beta zero.</desc><rect x="0" y="0" width="860" height="440" rx="0" fill="#ffffff" stroke="none" /><text x="27" y="38" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#16263b" font-weight="700">LAYER NORM</text><text x="833" y="36" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#7756b7" text-anchor="end" font-weight="700">ONE SAMPLE</text><rect x="24" y="59" width="396" height="335" rx="16" fill="#f8fbfe" stroke="#d7e1eb" /><rect x="439" y="59" width="396" height="335" rx="16" fill="#f8fbfe" stroke="#d7e1eb" /><text x="44" y="89" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16263b" font-weight="700">Raw features</text><text x="459" y="89" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#16263b" font-weight="700">Standardised features</text><text x="44" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#2774b7" >shift +2</text><text x="459" y="112" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#168978" >same output</text><line x1="46" y1="360" x2="401" y2="360" stroke="#98a8b7" stroke-width="1.5" /><line x1="461" y1="245" x2="811" y2="245" stroke="#98a8b7" stroke-width="1.5" /><text x="49" y="375" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" >0</text><text x="465" y="239" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#64748b" >z = 0</text><line x1="92" y1="129" x2="92" y2="357" stroke="#e6edf4" stroke-width="1" /><line x1="509" y1="129" x2="509" y2="353" stroke="#e6edf4" stroke-width="1" /><text x="92" y="379" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748b" tex