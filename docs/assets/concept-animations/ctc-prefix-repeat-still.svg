<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CTC: repeated prefix extension</title><desc id="desc">Two paths with prefix A end differently; emitting A extends only the blank-ending prefix.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">CTC: repeated prefix extension</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff"/><text x="134" y="80" font-size="17" fill="#233b52" text-anchor="middle">Prefix A at t = 2</text><text x="320" y="80" font-size="17" fill="#233b52" text-anchor="middle">Emit A</text><text x="507" y="80" font-size="17" fill="#233b52" text-anchor="middle">Prefix at t = 3</text><rect x="36" y="99" width="198" height="76" rx="5" fill="#edf2f6"/><text x="135" y="129" font-size="18" fill="#233b52" text-anchor="middle">Ends in blank</text><text x="135" y="156" font-size="22" fill="#21678d" text-anchor="middle">0.24</text><path d="M234 137L426 137" stroke="#9bafbd" stroke-width="2" fill="none"/><text x="330" y="125" font-size="18" fill="#233b52" text-anchor="middle">× 0.4</text><rect x="426" y="99" width="162" height="76" rx="5" fill="#edf2f6"/><rect x="36" y="212" width="198" height="76" rx="5" fill="#edf2f6"/><text x="135" y="242" font-size="18" fill="#233b52" text-anchor="middle">Ends in A</text><text x="135" y="269" font-size="22" fill="#21678d" text-anchor="middle">0.40</text><path d="M234 250L426 250" stroke="#9bafbd" stroke-width="2" fill="none"/><text x="330" y="238" font-size="18" fill="#233b52" text-anchor="middle">× 0.4</text><rect x="426" y="212" width="162" height="76" rx="5" fill="#edf2f6"/><rect x="426" y="99" width="162" height="76" rx="5" fill="#e0f4ec"/><text x="507" y="129" font-size="24" fill="#087d70" text-anchor="middle">AA</text><text x="507" y="156" font-size="20" fill="#087d70" text-anchor="middle">0.096</text><rect x="426" y="212" width="162" height="76" rx="5" fill="#e0f4ec"/><text x="507" y="242" font-size="24" fill="#087d70" text-anchor="middle">A</text><text x="507" y="269" font-size="20" fill="#087d70" text-anchor="middle">0.160</text><text x="320" y="324" font-size="16" fill="#233b52" text-anchor="middle">Only repeated-A contributions shown</text></svg>