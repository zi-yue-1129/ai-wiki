<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Micro and macro F1 under class imbalance</title><desc id="desc">Two mutually exclusive labels: 90 majority cases are correctly classified. One of ten minority cases is recovered at each step. Micro F1 follows total correct counts; macro F1 averages one-versus-rest F1 equally across classes.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#19354d}.title{font-size:17px;font-weight:760;letter-spacing:.55px}.sub{font-size:11px;fill:#607b91}.lab{font-size:12px;font-weight:650}.tiny{font-size:10px;fill:#607b91}.num{font-size:17px;font-weight:780}.moving{display:inline}.static-stage{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.static-stage{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" fill="#f2f7fb" rx="16"/><rect x="14" y="14" width="612" height="332" fill="#fff" rx="13" stroke="#dce7ef"/><text x="32" y="45" class="title" >MICRO  /  MACRO F1</text><text x="32" y="67" class="sub" >Two-class single-label prediction  •   90 majority / 10 minority</text><rect x="30" y="84" width="283" height="237" fill="#f8fbfd" rx="10" stroke="#dce7ef"/><rect x="324" y="84" width="285" height="237" fill="#f8fbfd" rx="10" stroke="#dce7ef"/><text x="48" y="113" class="lab" >Class A</text><text x="292" y="113" class="sub" text-anchor="end">90 / 90</text><rect x="48" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="75" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="102" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="129" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="156" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="183" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="210" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="237" y="128" width="21" height="24" fill="#168d80" rx="4"/><rect x="264" y="128" width="21" height="24" fill="#168d80" rx="4"/><text x="48" y="173" class="lab" >Class B</text><text x="292" y="173" class="sub" text-anchor="end">0 → 10 / 10</text><text x="48" y="242" class="sub" >One minority correction per step</text><text x="48" y="267" class="sub" >A: fixed     B: recovered one by one</text><rect x="48" y="286" width="11" height="11" fill="#168d80" rx="2"/><text x="64" y="296" class="tiny" >Correct</text><rect x="133" y="286" width="11" height="11" fill="#d88e46" rx="2"/><text x="149" y="296" class="tiny" >Incorrect</text><text x="345" y="112" class="lab" >F1 against recovered minority</text><line x1="356" y1="276" x2="584" y2="276" stroke="#dce7ef" stroke-dasharray="3 5"/><text x="347" y="280" class="tiny" text-anchor="end">0.0</text><line x1="356" y1="208.5" x2="584" y2="208.5" stroke="#dce7ef" stroke-dasharray="3 5"/><text x="347" y="212.5" class="tiny" text-anchor="end">0.5</text><line x1="356" y1="141" x2="584" y2="141" stroke="#dce7ef" stroke-dasharray="3 5"/><text x="347" y="145" class="tiny" text-anchor="end">1.0</text><line x1="356" y1="139" x2="356" y2="276" stroke="#607b91" /><line x1="356" y1="276" x2="584" y2="276" stroke="#607b91" /><path d="M356 154.5 L378.4 153.15 L400.8 151.8 L423.2 150.45 L445.6 149.1 L468 147.75 L490.4 146.4 L512.8 145.05 L535.2 143.7 L557.6 142.35 L580 141" fill="none" stroke="#168d80" stroke-width="3.1"/><path d="M356 212.05 L378.4 199.44 L400.8 188.87 L423.2 179.87 L445.6 172.11 L468 165.32 L490.4 159.34 L512.8 154.02 L535.2 149.24 L557.6 144.93 L580 141" fill="none" stroke="#7551b8" stroke-width="3.1"/><text x="356" y="294" class="tiny" >0</text><text x="580" y="294" class="tiny" text-anchor="end">10</text><text x="468" y="311" class="tiny" text-anchor="middle">Minority cases recovered</text><rect x="405" y="126" width="9" height="9" fill="#168d80" rx="2"/><text x="418" y="134" class="tiny" >Micro</text><rect x="480" y="126" width="9" height="9" fill="#7551b8" rx="2"/><text x="493" y="134" class="tiny" >Macro</text><rect x="48" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="72.7" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="97.4" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="122.1" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="146.8" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="171.5" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="196.2" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="220.9" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="245.6" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><rect x="270.3" y="189" width="20" height="24" rx="4" fill="#d88e46"></rect><circle cx="356" cy="154.5" r="6" fill="#168d80" stroke="white" stroke-width="2"/><circle cx="356" cy="212.05" r="6" fill="#7551b8" stroke="white" stroke-width="2"/></svg>