<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 602" role="img" aria-labelledby="title desc"><title id="title">Terminal state versus external time-limit truncation</title><desc id="desc">In a true terminal transition the continuation value is masked for both Q-learning and SARSA; a time-limit truncation preserves the bootstrap value from the final observation, using the greedy or sampled action respectively. Illustrative values.</desc><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8294a7"/></marker><marker id="teal-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0f9e86"/></marker></defs><rect width="440" height="602" rx="20" fill="#f5f8fc"/><text x="22" y="39" fill="#102b42" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">When does TD bootstrap?</text><text x="22" y="62" fill="#50687b" font-family="DejaVu Sans,Arial,sans-serif" font-size="12">Same reward · different stopping conditions</text><!-- true terminal transition --><rect x="14" y="78" width="412" height="218" rx="15" fill="#fff" stroke="#dce6ef" stroke-width="1.4"/><rect x="25" y="91" width="135" height="29" rx="14" fill="#feece7"/><text x="40" y="110" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#a84229">TERMINATED</text><text x="176" y="110" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#61768a">MDP ends</text><circle id="term-state" cx="63" cy="161" r="19" fill="#e7effc" stroke="#6a90cd" stroke-width="2.4"><animate attributeName="stroke-width" values="2.4;5;2.4" dur="2.1s" begin="0s" repeatCount="indefinite"/></circle><text x="63" y="167" text-anchor="middle" font-size="17" font-weight="700" fill="#315c96" font-family="DejaVu Sans,Arial,sans-serif">s</text><path d="M84 161H165" fill="none" stroke="#8294a7" stroke-width="2.7" marker-end="url(#head)"/><rect x="107" y="140" width="48" height="19" rx="9" fill="#eaf5fc"/><text x="131" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#235d8e" font-family="DejaVu Sans,Arial,sans-serif">r = 1</text><rect x="172" y="138" width="64" height="46" rx="11" fill="#fbd5ca" stroke="#e56a53" stroke-width="2"/><text x="204" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#a84229" font-family="DejaVu Sans,Arial,sans-serif">STOP</text><path d="M190 166L218 174M218 166L190 174" stroke="#a84229" stroke-width="2" stroke-linecap="round"/><path d="M238 161H280" stroke="#c8d1db" stroke-width="2" stroke-dasharray="5 6"/><circle cx="318" cy="161" r="23" fill="#f5f6f8" stroke="#bcc8d2" stroke-dasharray="5 5" stroke-width="1.8"/><text x="318" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#a4b2bd" font-family="DejaVu Sans,Arial,sans-serif">s'</text><text x="318" y="175" text-anchor="middle" font-size="11" fill="#a4b2bd" font-family="DejaVu Sans,Arial,sans-serif">ignored</text><g id="term-mask"><path d="M271 140L368 182" stroke="#e26350" stroke-width="3.5" stroke-linecap="round" opacity=".82"/><path d="M368 140L271 182" stroke="#e26350" stroke-width="3.5" stroke-linecap="round" opacity=".82"/><animate attributeName="opacity" values=".25;.25;1;1;.25" keyTimes="0;.13;.2;.38;1" dur="10s" repeatCount="indefinite"/></g><text x="26" y="210" font-size="12" fill="#627b8a" font-family="DejaVu Sans,Arial,sans-serif">Bootstrap = 0</text><path d="M26 217H414" stroke="#edf2f6"/><rect id="term-q" x="25" y="230" width="184" height="52" rx="10" fill="#fff4ef" stroke="#efbdad" stroke-width="1.5"/><rect id="term-s" x="231" y="230" width="184" height="52" rx="10" fill="#fff4ef" stroke="#efbdad" stroke-width="1.5"/><text x="37" y="251" font-size="12" fill="#876459" font-family="DejaVu Sans,Arial,sans-serif">Q-learning</text><text x="37" y="270" font-size="17" font-weight="700" fill="#9d4432" font-family="DejaVu Sans,Arial,sans-serif">1.00</text><text x="243" y="251" font-size="12" fill="#876459" font-family="DejaVu Sans,Arial,sans-serif">SARSA</text><text x="243" y="270" font-size="17" font-weight="700" fill="#9d4432" font-family="DejaVu Sans,Arial,sans-serif">1.00</text><rect x="25" y="230" width="390" height="52" rx="10" fill="none" stroke="#e36551" stroke-width="3" opacity=".06"><animate attributeName="opacity" values=".06;.06;1;1;.06" keyTimes="0;.16;.22;.34;1" dur="10s" repeatCount="indefinite"/></rect><!-- external truncation --><rect x="14" y="312" width="412" height="275" rx="15" fill="#fff" stroke="#dce6ef" stroke-width="1.4"/><rect x="25" y="325" width="133" height="29" rx="14" fill="#dff8f1"/><text x="40" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700" fill="#087e6c">TRUNCATED</text><text x="176" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#61768a">External cutoff</text><circle cx="63" cy="405" r="19" fill="#e7effc" stroke="#6a90cd" stroke-width="2.4"/><text x="63" y="411" text-anchor="middle" font-size="17" font-weight="700" fill="#315c96" font-family="DejaVu Sans,Arial,sans-serif">s</text><path d="M84 405H164" stroke="#8294a7" stroke-width="2.7" marker-end="url(#head)" fill="none"/><rect x="107" y="384" width="48" height="19" rx="9" fill="#eaf5fc"/><text x="131" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#235d8e" font-family="DejaVu Sans,Arial,sans-serif">r = 1</text><path id="cut" d="M198 375V437" stroke="#d79a38" stroke-width="2.4" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path><rect x="166" y="387" width="69" height="34" rx="8" fill="#fff5dc" stroke="#ddb765"/><text x="200" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#a57422" font-family="DejaVu Sans,Arial,sans-serif">TIME</text><path d="M236 405H285" stroke="#0f9e86" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#teal-head)"><animate attributeName="stroke-dashoffset" values="26;0" dur="1.3s" begin="3.6s" repeatCount="indefinite"/></path><circle cx="317" cy="405" r="24" fill="#e4f8f1" stroke="#0f9e86" stroke-width="2.5"/><text x="317" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#087e6c" font-family="DejaVu Sans,Arial,sans-serif">s'</text><text x="317" y="417" text-anchor="middle" font-size="9.5" fill="#087e6c" font-family="DejaVu Sans,Arial,sans-serif">final obs.</text><text x="26" y="460" font-size="12" fill="#627b8a" font-family="DejaVu Sans,Arial,sans-serif">Bootstrap from the final observation</text><path d="M26 468H414" stroke="#edf2f6"/><rect x="25" y="480" width="184" height="95" rx="11" fill="#e9f2ff" stroke="#93b5e3" stroke-width="1.5"/><rect x="231" y="480" width="184" height="95" rx="11" fill="#e0f8ee" stroke="#7ed0b2" stroke-width="1.5"/><text x="37" y="501" font-size="13" font-weight="700" fill="#315c96" font-family="DejaVu Sans,Arial,sans-serif">Q-learning</text><text x="243" y="501" font-size="13" font-weight="700" fill="#087e6c" font-family="DejaVu Sans,Arial,sans-serif">SARSA</text><text x="37" y="523" font-size="13" fill="#486a93" font-family="DejaVu Sans,Arial,sans-serif">max Q = 4</text><text x="243" y="523" font-size="13" fill="#167e6d" font-family="DejaVu Sans,Arial,sans-serif">Q(s', a') = 2</text><text x="37" y="550" font-size="12" fill="#527191" font-family="DejaVu Sans,Arial,sans-serif">1 + .9 × 4 =</text><text x="137" y="552" font-size="19" font-weight="700" fill="#24549e" font-family="DejaVu Sans,Arial,sans-serif">4.60</text><text x="243" y="550" font-size="12" fill="#287b6b" font-family="DejaVu Sans,Arial,sans-serif">1 + .9 × 2 =</text><text x="343" y="552" font-size="19" font-weight="700" fill="#087e6c" font-family="DejaVu Sans,Arial,sans-serif">2.80</text><rect id="q-glow" x="25" y="480" width="184" height="95" rx="11" fill="none" stroke="#3877ce" stroke-width="3" opacity=".08"><animate attributeName="opacity" values=".08;.08;.95;.95;.08" keyTimes="0;.40;.46;.63;1" dur="10s" repeatCount="indefinite"/></rect><rect id="s-glow" x="231" y="480" width="184" height="95" rx="11" fill="none" stroke="#0f9e86" stroke-width="3" opacity=".08"><animate attributeName="opacity" values=".08;.08;.95;.95;.08" keyTimes="0;.64;.70;.88;1" dur="10s" repeatCount="indefinite"/></rect><circle id="q-pulse" r="4" fill="#2b75c4" opacity="0"><animateMotion path="M317 432 Q220 450 120 479" begin="4s" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="4s" repeatCount="indefinite"/></circle><circle id="s-pulse" r="4" fill="#0a9e83" opacity="0"><animateMotion path="M317 432 Q340 456 323 479" begin="6.6s" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="1.8s" begin="6.6s" repeatCount="indefinite"/></circle><text x="220" y="598" text-anchor="middle" font-size="9" fill="#6c8193" font-family="DejaVu Sans,Arial,sans-serif">Illustrative values · not measured model outputs</text></svg>