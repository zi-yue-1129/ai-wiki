<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Saved micro-batch activation sets during pipeline training</title><desc id="desc">Counts after each completed slot. Each forward saves one activation set and each matching backward frees it. GPipe peaks at four on every stage; 1F1B peaks at three, two, and one. Counts exclude other memory and are schematic.</desc><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="640" height="360" fill="#f7fafc" rx="14"/><text x="20" y="30" font-size="24" fill="#294456" text-anchor="start" font-weight="700">Saved activations</text><text x="610" y="30" font-size="17" fill="#526b7d" text-anchor="end">Peak: GPipe / 1F1B</text><defs><clipPath id="history"><rect x="106" y="0" width="0" height="360"><animate attributeName="width" values="0;504;504" keyTimes="0;0.85714286;1" calcMode="linear" dur="14s" repeatCount="indefinite"/></rect></clipPath></defs><text x="20" y="68" font-size="19" fill="#294456" text-anchor="start" font-weight="700">S1</text><text x="20" y="93" font-size="17" fill="#526b7d" text-anchor="start">4 / 3</text><path d="M106 110H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="115" font-size="14" fill="#526b7d" text-anchor="end">0</text><path d="M106 82H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="87" font-size="14" fill="#526b7d" text-anchor="end">2</text><path d="M106 54H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="59" font-size="14" fill="#526b7d" text-anchor="end">4</text><text x="20" y="157" font-size="19" fill="#294456" text-anchor="start" font-weight="700">S2</text><text x="20" y="182" font-size="17" fill="#526b7d" text-anchor="start">4 / 2</text><path d="M106 199H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="204" font-size="14" fill="#526b7d" text-anchor="end">0</text><path d="M106 171H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="176" font-size="14" fill="#526b7d" text-anchor="end">2</text><path d="M106 143H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="148" font-size="14" fill="#526b7d" text-anchor="end">4</text><text x="20" y="246" font-size="19" fill="#294456" text-anchor="start" font-weight="700">S3</text><text x="20" y="271" font-size="17" fill="#526b7d" text-anchor="start">4 / 1</text><path d="M106 288H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="293" font-size="14" fill="#526b7d" text-anchor="end">0</text><path d="M106 260H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="265" font-size="14" fill="#526b7d" text-anchor="end">2</text><path d="M106 232H610" stroke="#d6e0e8" stroke-width="1"/><text x="96" y="237" font-size="14" fill="#526b7d" text-anchor="end">4</text><g clip-path="url(#history)"><path id="count-0-0" d="M106 110H148V96H190V82H232V68H274V54H316V54H358V54H400V54H442V54H484V68H526V82H568V96H610V110" fill="none" stroke="#147a72" stroke-width="4" stroke-linejoin="round"/><path id="count-1-0" d="M106 110H148V96H190V82H232V68H274V68H316V68H358V82H400V68H442V82H484V82H526V96H568V96H610V110" fill="none" stroke="#b56a23" stroke-width="3" stroke-dasharray="7 4" stroke-linejoin="round"/><path id="count-0-1" d="M106 199H148V199H190V185H232V171H274V157H316V143H358V143H400V143H442V157H484V171H526V185H568V199H610V199" fill="none" stroke="#147a72" stroke-width="4" stroke-linejoin="round"/><path id="count-1-1" d="M106 199H148V199H190V185H232V171H274V171H316V185H358V171H400V185H442V171H484V185H526V185H568V199H610V199" fill="none" stroke="#b56a23" stroke-width="3" stroke-dasharray="7 4" stroke-linejoin="round"/><path id="count-0-2" d="M106 288H148V288H190V288H232V274H274V260H316V246H358V232H400V246H442V260H484V274H526V288H568V288H610V288" fill="none" stroke="#147a72" stroke-width="4" stroke-linejoin="round"/><path id="count-1-2" d="M106 288H148V288H190V288H232V274H274V288H316V274H358V288H400V274H442V288H484V274H526V288H568V288H610V288" fill="none" stroke="#b56a23" stroke-width="3" stroke-dasharray="7 4" stroke-linejoin="round"/></g><path d="M106 48V288" stroke="#b56a23" stroke-width="2.5"><animateTransform attributeName="transform" type="translate" values="0 0;504 0;504 0" keyTimes="0;0.85714286;1" dur="14s" repeatCount="indefinite"/></path><text x="106" y="311" font-size="15" fill="#526b7d" text-anchor="middle">0</text><text x="190" y="311" font-size="15" fill="#526b7d" text-anchor="middle">2</text><text x="274" y="311" font-size="15" fill="#526b7d" text-anchor="middle">4</text><text x="358" y="311" font-size="15" fill="#526b7d" text-anchor="middle">6</text><text x="442" y="311" font-size="15" fill="#526b7d" text-anchor="middle">8</text><text x="526" y="311" font-size="15" fill="#526b7d" text-anchor="middle">10</text><text x="610" y="311" font-size="15" fill="#526b7d" text-anchor="middle">12</text><path d="M106 334H138" stroke="#147a72" stroke-width="4"/><text x="146" y="340" font-size="17" fill="#294456" text-anchor="start">GPipe</text><path d="M255 334H287" stroke="#b56a23" stroke-width="3" stroke-dasharray="7 4"/><text x="295" y="340" font-size="17" fill="#294456" text-anchor="start">1F1B</text><text x="610" y="340" font-size="16" fill="#526b7d" text-anchor="end">Completed slots</text></g></svg>
