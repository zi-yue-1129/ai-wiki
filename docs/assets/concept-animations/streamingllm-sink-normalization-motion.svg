<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Attention sink and softmax redistribution</title><desc id="desc">For fixed unnormalized weights 6,2,1,1, masking the sink changes normalized weights from 60,20,10,10 percent to 0,50,25,25 percent. Toy fixed-logit example, not measured model attention.</desc><style>text{font-family:system-ui,Arial,sans-serif;font-weight:600}@media(prefers-reduced-motion:reduce){.moving{display:none}.fallback{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f5f9fc" /><text x="26" y="35" font-size="20" text-anchor="start" fill="#24465b">ATTENTION SINK · NORMALIZATION</text><text x="26" y="60" font-size="14" text-anchor="start" fill="#5c7889">Fixed unnormalized weights: 6, 2, 1, 1</text><rect x="34" y="83" width="16" height="16" rx="3" fill="#98611b" /><text x="57" y="96" font-size="16" text-anchor="start" fill="#24465b">Sink</text><rect x="184" y="83" width="16" height="16" rx="3" fill="#35678f" /><text x="207" y="96" font-size="16" text-anchor="start" fill="#24465b">A</text><rect x="334" y="83" width="16" height="16" rx="3" fill="#08756e" /><text x="357" y="96" font-size="16" text-anchor="start" fill="#24465b">B</text><rect x="484" y="83" width="16" height="16" rx="3" fill="#526b94" /><text x="507" y="96" font-size="16" text-anchor="start" fill="#24465b">C</text><text x="26" y="146" font-size="16" text-anchor="start" fill="#24465b">Retained</text><text x="26" y="240" font-size="16" text-anchor="start" fill="#24465b">Masking</text><rect x="136" y="120" width="460" height="46" rx="5" fill="#e4ecf2" /><rect x="136" y="214" width="460" height="46" rx="5" fill="#e4ecf2" /><rect x="136" y="120" width="276" height="46" rx="0" fill="#98611b" /><text x="274" y="149" font-size="15" text-anchor="middle" fill="#fff">60%</text><rect x="412" y="120" width="92" height="46" rx="0" fill="#35678f" /><text x="458" y="149" font-size="15" text-anchor="middle" fill="#fff">20%</text><rect x="504" y="120" width="46" height="46" rx="0" fill="#08756e" /><text x="527" y="149" font-size="15" text-anchor="middle" fill="#fff">10%</text><rect x="550" y="120" width="46" height="46" rx="0" fill="#526b94" /><text x="573" y="149" font-size="15" text-anchor="middle" fill="#fff">10%</text><text x="26" y="290" font-size="16" text-anchor="start" fill="#24465b">Sink removed: denominator 10 → 4</text><text x="26" y="334" font-size="14" text-anchor="start" fill="#5c7889">Fixed logits · not model measurements</text><g class="fallback" style="display:none"><rect x="136" y="214" width="230" height="46" rx="0" fill="#35678f" /><text x="251" y="243" font-size="16" text-anchor="middle" fill="#fff">50%</text><rect x="366" y="214" width="115" height="46" rx="0" fill="#08756e" /><text x="423.5" y="243" font-size="16" text-anchor="middle" fill="#fff">25%</text><rect x="481" y="214" width="115" height="46" rx="0" fill="#526b94" /><text x="538.5" y="243" font-size="16" text-anchor="middle" fill="#fff">25%</text></g><g class="moving"><rect x="136" y="214" width="276" height="46" fill="#98611b"><animate attributeName="x" values="136;136;136;136" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="276;276;0;0" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><rect x="412" y="214" width="92" height="46" fill="#35678f"><animate attributeName="x" values="412;412;136;136" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="92;92;230;230" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><rect x="504" y="214" width="46" height="46" fill="#08756e"><animate attributeName="x" values="504;504;366;366" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="46;46;115;115" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><rect x="550" y="214" width="46" height="46" fill="#526b94"><animate attributeName="x" values="550;550;481;481" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="46;46;115;115" keyTimes="0;0.2;0.65;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><text x="251" y="243" font-size="16" text-anchor="middle" fill="#fff">50%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.65;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="423.5" y="243" font-size="16" text-anchor="middle" fill="#fff">25%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.65;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="538.5" y="243" font-size="16" text-anchor="middle" fill="#fff">25%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.65;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></g></g></svg>
