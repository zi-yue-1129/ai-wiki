<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Hessian-vector product as a JVP of the gradient</title><desc id="desc">For quadratic f(x,y)=x squared plus xy plus twice y squared, move along seed (1,-1). The gradient changes by (1,-3) per unit t. Two synchronized dots move in input and gradient space, illustrating forward-over-reverse differentiation. All quantities analytic, not benchmark data.</desc><rect width="800" height="420" rx="18" fill="#f4f8fb"/><rect x="16" y="16" width="768" height="388" rx="16" fill="white" stroke="#dbe6ed"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="51" fill="#1d3548" font-size="21" font-weight="bold">Forward-over-reverse · Hessian-vector product</text><text x="36" y="77" fill="#62788a" font-size="13">f(x,y) = x² + xy + 2y²     •     p = (1,1)     •     v = (1,−1)</text><rect x="36" y="96" width="347" height="250" rx="12" fill="#f8fbfd" stroke="#dbe6ed"/><rect x="417" y="96" width="347" height="250" rx="12" fill="#f8fbfd" stroke="#dbe6ed"/><text x="56" y="122" fill="#087f86" font-size="16" font-weight="bold">Input space</text><text x="437" y="122" fill="#ca6e22" font-size="16" font-weight="bold">Gradient space</text><text x="57" y="141" fill="#62788a" font-size="12">p(t) = (1+t, 1−t)</text><text x="437" y="141" fill="#62788a" font-size="12">g(t) = (3+t, 5−3t)</text><path d="M108 160 L108 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M205 160 L205 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M302 160 L302 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M89 173 L350 173" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M89 239 L350 239" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M89 305 L350 305" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M529 160 L529 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M597 160 L597 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M665 160 L665 320" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M460 173 L725 173" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M460 239 L725 239" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M460 305 L725 305" fill="none" stroke="#e5edf2" stroke-width="1"/><path d="M89 319 L350 319" fill="none" stroke="#4978ae" stroke-width="1.4"/><path d="M460 319 L725 319" fill="none" stroke="#4978ae" stroke-width="1.4"/><path d="M150.0,184.0 L260.0,294.0" fill="none" stroke="#087f86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M564.0,169.5 L630.0,308.5" fill="none" stroke="#ca6e22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="239" r="5" fill="white" stroke="#087f86" stroke-width="2"/><circle cx="597" cy="239" r="5" fill="white" stroke="#ca6e22" stroke-width="2"/><text x="315" y="334" fill="#62788a" font-size="12">x</text><text x="699" y="334" fill="#62788a" font-size="12">g₁</text><text x="89" y="175" fill="#62788a" font-size="12">y</text><text x="461" y="175" fill="#62788a" font-size="12">g₂</text><text x="205" y="335" fill="#62788a" font-size="12" text-anchor="middle">1</text><text x="597" y="335" fill="#62788a" font-size="12" text-anchor="middle">3</text><text x="372" y="234" fill="#4978ae" font-size="24" font-weight="bold" text-anchor="middle">→</text><circle cx="150.0" cy="184.0" r="7" fill="#087f86" stroke="white" stroke-width="2"/><circle cx="260.0" cy="294.0" r="9" fill="#087f86" stroke="white" stroke-width="2"/><circle cx="564.0" cy="169.5" r="7" fill="#ca6e22" stroke="white" stroke-width="2"/><circle cx="630.0" cy="308.5" r="9" fill="#ca6e22" stroke="white" stroke-width="2"/><text x="52" y="371" fill="#62788a" font-size="13">Gradient JVP:</text><text x="209" y="371" fill="#ca6e22" font-size="18" font-weight="bold">H v = (1, −3)</text><text x="550" y="371" fill="#087f86" font-size="13" font-weight="bold">No full Hessian required</text><text x="760" y="395" fill="#62788a" font-size="11" text-anchor="end">Exact quadratic example</text></g></svg>