<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">DoRA directional and magnitude decomposition</title><desc id="dsc">A fixed two-dimensional weight vector in blue and a changing adapted vector in teal. The direction rotates before the magnitude changes. Schematic column example only.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f7fafc" stroke="none"/><text x="22" y="32" fill="#17324d" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">DoRA · Direction and magnitude</text><rect x="18" y="54" width="351" height="269" rx="8" fill="#fff" stroke="#c9d8e4"/><rect x="381" y="54" width="241" height="269" rx="8" fill="#fff" stroke="#c9d8e4"/><text x="34" y="79" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Column vector</text><text x="399" y="79" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Independent controls</text><line x1="43" y1="203" x2="344" y2="203" stroke="#c9d8e4" stroke-width="1.3" /><line x1="169" y1="94" x2="169" y2="303" stroke="#c9d8e4" stroke-width="1.3" /><circle cx="169" cy="203" r="90" fill="none" stroke="#4475a8" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 5"/><circle cx="169" cy="203" r="108" fill="none" stroke="#008f88" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 5"/><defs><marker id="a-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4475a8"/></marker><marker id="a-teal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#008f88"/></marker></defs><line x1="169" y1="203" x2="223" y2="131" stroke="#4475a8" stroke-width="3" marker-end="url(#a-blue)"/><line x1="169" y1="203" x2="255.4" y2="138.2" stroke="#008f88" stroke-width="3.5" marker-end="url(#a-teal)"></line><circle cx="169" cy="203" r="4" fill="#17324d" stroke="#fff" stroke-width="2"/><text x="44" y="299" fill="#4475a8" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Blue: frozen W₀</text><text x="193" y="299" fill="#008f88" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Teal: adapted W′</text><text x="403" y="115" fill="#7257b5" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Direction</text><text x="403" y="138" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">53°  →  37°</text><rect x="405" y="152" width="179" height="9" rx="5" fill="#e7e2f3" stroke="none"/><circle cx="578" cy="156.5" r="8" fill="#7257b5" stroke="#fff" stroke-width="2"></circle><text x="403" y="203" fill="#008f88" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Magnitude</text><text x="403" y="226" fill="#17324d" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">5  →  6</text><rect x="405" y="239" width="179" height="12" rx="5" fill="#e6f4f2" stroke="none"/><rect x="405" y="239" height="12" rx="5" width="150" fill="#008f88"></rect><text x="403" y="297" fill="#647b90" font-size="12" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">W′ = m · V / ||V||</text><text x="320" y="344" fill="#647b90" font-size="11" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="middle">Illustrative single column · not measured</text></svg>