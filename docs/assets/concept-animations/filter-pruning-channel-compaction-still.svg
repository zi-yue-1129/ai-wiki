<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title desc"><title id="title">Filter and channel compaction</title><desc id="desc">Filter two has the smallest L1 norm. Its output row and the corresponding next-layer input column are removed; surviving weights move into smaller dense matrices.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8798aa"/></marker></defs><rect width="640" height="360" rx="10" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="150" y="32" font-size="21" fill="#24364b" text-anchor="middle">Original</text><text x="491" y="32" font-size="21" fill="#24364b" text-anchor="middle">Compacted</text><text x="150" y="68" font-size="16" fill="#24364b" text-anchor="middle">W₁ · 3 × 2</text><text x="491" y="68" font-size="16" fill="#24364b" text-anchor="middle">W₁ · 2 × 2</text><text x="150" y="230" font-size="16" fill="#24364b" text-anchor="middle">W₂ · 2 × 3</text><text x="491" y="230" font-size="16" fill="#24364b" text-anchor="middle">W₂ · 2 × 2</text><text x="307" y="76" font-size="14" fill="#24364b" text-anchor="middle">L1</text><rect x="98" y="80" width="49" height="36" rx="5" fill="#dce4ec" stroke="none"/><text x="122.5" y="104" font-size="17" fill="#24364b" text-anchor="middle">2</text><rect x="153" y="80" width="49" height="36" rx="5" fill="#dce4ec" stroke="none"/><text x="177.5" y="104" font-size="17" fill="#24364b" text-anchor="middle">−1</text><text x="307" y="103" font-size="15" fill="#24364b" text-anchor="middle">3</text><rect x="98" y="122" width="49" height="36" rx="5" fill="#f5e6d3" stroke="none"/><text x="122.5" y="146" font-size="17" fill="#24364b" text-anchor="middle">0.1</text><rect x="153" y="122" width="49" height="36" rx="5" fill="#f5e6d3" stroke="none"/><text x="177.5" y="146" font-size="17" fill="#24364b" text-anchor="middle">0.1</text><text x="307" y="145" font-size="15" fill