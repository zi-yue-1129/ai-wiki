="end">Start</text><rect x="24" y="18" width="143" height="39" rx="9" fill="#edf3f7" stroke="#d8e4ec" stroke-width="1"/><text x="95.5" y="43" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#657d91" text-anchor="middle">Momentum</text><rect x="177" y="18" width="143" height="39" rx="9" fill="#edf3f7" stroke="#d8e4ec" stroke-width="1"/><text x="248.5" y="43" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#657d91" text-anchor="middle">Half kick</text><rect x="330" y="18" width="143" height="39" rx="9" fill="#edf3f7" stroke="#d8e4ec" stroke-width="1"/><text x="401.5" y="43" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#657d91" text-anchor="middle">Leapfrog</text><rect x="483" y="18" width="143" height="39" rx="9" fill="#0b7d83" stroke="#0b7d83" stroke-width="1"/><text x="554.5" y="43" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="white" text-anchor="middle">Metropolis</text><path d="M208.00 166.00 L229.56 140.76 L262.20 122.05 L301.92 112.15 L343.85 112.28 L382.87 122.42" fill="none" stroke="#23785b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="229.56" cy="140.765" r="3" fill="#7953a6" stroke="white" stroke-width="2"/><circle cx="262.1989" cy="122.0512875" r="3" fill="#7953a6" stroke="white" stroke-width="2"/><circle cx="301.91843474999996" cy="112.15129228125001" r="3" fill="#7953a6" stroke="white" stroke-width="2"/><circle cx="343.852961243125" cy="112.27776375804687" r="3" fill="#7953a6" stroke="white" stroke-width="2"/><circle cx="382.8654999839672" cy="122.41520917448301" r="8" fill="#23785b" stroke="white" stroke-width="2"/><text x="395.8654999839672" y="109.41520917448301" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#23785b" text-anchor="start">Accepted</text><rect x="28" y="314" width="584" height="31" rx="7" fill="#edf3f7" stroke="none" stroke-width="1"