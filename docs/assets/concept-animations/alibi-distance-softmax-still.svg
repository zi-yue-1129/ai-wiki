<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
<title id="title">ALiBi slope changes attention distribution</title><desc id="description">Illustrative causal softmax with eight equal content logits. For key distance d, the ALiBi bias is negative m times d; each normalized weight equals exp(-m d) divided by the sum of eight exponentials. At slope zero the distribution is uniform and increasing the slope concentrates probability near the current token.</desc>
<rect width="640" height="360" rx="18" fill="#fff"/><rect x="1" y="1" width="638" height="358" rx="17" stroke="#dee6ee" stroke-width="2" fill="none"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#25354a}.title{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#63758b}.label{font-size:13px;font-weight:600}.tick{font-size:12px;fill:#64748b}</style>
<text class="title" x="28" y="39">ALiBi · distance bias</text>
<text class="sub" x="28" y="61">One causal query · eight equal content logits</text>
<text class="sub" x="28" y="86">Same content scores · different normalized weights</text>
<rect x="30" y="103" width="280" height="223" rx="11" fill="#f8fafc" stroke="#e1e8f0"/><text class="label" x="46" y="129">m = 0</text>
<rect x="47" y="248.62" width="22" height="25.38" rx="4" fill="#2b9e9a"/><text class="tick" x="58" y="292" text-anchor="middle">7</text>
