<rect x="171" y="248.62" width="22" height="25.38" rx="4" fill="#2b9e9a"/><text class="tick" x="182" y="292" text-anchor="middle">3</text>
<rect x="202" y="248.62" width="22" height="25.38" rx="4" fill="#2b9e9a"/><text class="tick" x="213" y="292" text-anchor="middle">2</text>
<rect x="233" y="248.62" width="22" height="25.38" rx="4" fill="#2b9e9a"/><text class="tick" x="244" y="292" text-anchor="middle">1</text>
<rect x="264" y="248.62" width="22" height="25.38" rx="4" fill="#e0a14b"/><text class="tick" x="275" y="292" text-anchor="middle">0</text>
<line x1="46" y1="276" x2="295" y2="276" stroke="#94a3b8"/><text class="sub" x="46" y="311">Key distance → 0</text>
<rect x="340" y="103" width="280" height="223" rx="11" fill="#f8fafc" stroke="#e1e8f0"/><text class="label" x="356" y="129">m = 1</text>
<rect x="357" y="273.88" width="22" height="0.12" rx="4" fill="#2b9e9a"/><text class="tick" x="368" y="292" text-anchor="middle">7</text>
<rect x="388" y="273.68" width="22" height="0.32" rx="4" fill="#2b9e9a"/><text class="tick" x="399" y="292" text-anchor="middle">6</text>
