<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Shared gradient norm clipping versus per-layer clipping</title><desc id="desc">Two scalar layer gradient norms: gA=4 and gB=3s. As gB grows, a shared global L2 cap of four rescales both layers, reducing the output for A; separate per-layer caps of four leave both unchanged even though their combined norm becomes five. Synthetic mathematical parameter sweep, not measured training gradients.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.reduced-static{display:none}@media(prefers-reduced-motion:reduce){.animated-live{display:none!important}.reduced-static{display:inline!important}}</style><rect x="0" y="0" width="800" height="420" fill="#f5f9fc" rx="18"></rect><text x="30" y="43" fill="#1b354d" font-size="23" font-weight="750">GLOBAL vs PER-LAYER CLIPPING</text><text x="30" y="66" fill="#647c90" font-size="12.5" font-weight="500">Two layer-gradient groups · g₁ = 4, g₂ = 3s · 0 ≤ s ≤ 1</text><rect x="22" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="43" y="123" fill="#1b354d" font-size="16" font-weight="750">ONE SHARED L₂ BUDGET</text><rect x="408" y="86" width="370" height="302" fill="#fff" rx="16" stroke="#dbe7ef" stroke-width="1.4"></rect><text x="429" y="123" fill="#1b354d" font-size="16" font-weight="750">TWO INDEPENDENT CAPS</text><line x1="161" y1="171" x2="161" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="288" x2="343" y2="288" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="200" y1="171" x2="200" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="249" x2="343" y2="249" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="239" y1="171" x2="239" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="210" x2="343" y2="210" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="278" y1="171" x2="278" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="171" x2="343" y2="171" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="122" y1="327" x2="347" y2="327" stroke="#8298a7" stroke-width="1.4" stroke-linecap="round"></line><line x1="122" y1="327" x2="122" y2="169" stroke="#8298a7" stroke-width="1.4" stroke-linecap="round"></line><path d="M278 327 A156 156 0 0 0 122 171" fill="none" stroke="#078c84" stroke-width="1.8" stroke-dasharray="5 7" opacity="0.6"></path><text x="341" y="345" fill="#647c90" font-size="12" font-weight="650">g₁</text><text x="101" y="186" fill="#647c90" font-size="12" font-weight="650">g₂</text><text x="290" y="315" fill="#078c84" font-size="12" font-weight="700">τ</text><line x1="547" y1="171" x2="547" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="508" y1="288" x2="729" y2="288" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="586" y1="171" x2="586" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="508" y1="249" x2="729" y2="249" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="625" y1="171" x2="625" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="508" y1="210" x2="729" y2="210" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="664" y1="171" x2="664" y2="327" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="508" y1="171" x2="729" y2="171" stroke="#e6eef3" stroke-width="1" stroke-linecap="round"></line><line x1="508" y1="327" x2="733" y2="327" stroke="#8298a7" stroke-width="1.4" stroke-linecap="round"></line><line x1="508" y1="327" x2="508" y2="169" stroke="#8298a7" stroke-width="1.4" stroke-linecap="round"></line><path d="M664 327 A156 156 0 0 0 508 171" fill="none" stroke="#078c84" stroke-width="1.8" stroke-dasharray="5 7" opacity="0.6"></path><text x="727" y="345" fill="#647c90" font-size="12" font-weight="650">g₁</text><text x="487" y="186" fill="#647c90" font-size="12" font-weight="650">g₂</text><text x="676" y="315" fill="#078c84" font-size="12" font-weight="700">τ</text><text x="43" y="149" fill="#078c84" font-size="13" font-weight="600">Global τ = 4</text><text x="429" y="149" fill="#cf7234" font-size="13" font-weight="600">Per-group τ = 4</text><line x1="122" y1="327" x2="278" y2="210" stroke="#8298a7" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"></line><line x1="122" y1="327" x2="246.80" y2="233.40" stroke="#078c84" stroke-width="5" stroke-linecap="round"></line><circle cx="246.80" cy="233.40" r="6" fill="#078c84"></circle><line x1="508" y1="327" x2="664.00" y2="210.00" stroke="#cf7234" stroke-width="5" stroke-linecap="round"></line><circle cx="664.00" cy="210.00" r="6" fill="#cf7234"></circle><text x="43" y="371" fill="#078c84" font-size="13" font-weight="650">Joint norm at s=1: 4</text><text x="429" y="371" fill="#cf7234" font-size="13" font-weight="650">Joint norm at s=1: 5</text></svg>