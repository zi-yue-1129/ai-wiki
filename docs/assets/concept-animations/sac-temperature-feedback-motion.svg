<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="sac-title sac-desc"><title id="sac-title">SAC: entropy target controls temperature</title><desc id="sac-desc">Two illustrative feedback cases. When policy entropy falls below the target, the temperature rises. When entropy exceeds the target, the temperature falls. Bars do not represent optimizer measurements.</desc><style>@media(prefers-reduced-motion:reduce){.moving{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fbff" stroke="none" stroke-width="0" /><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d9e5ef" stroke-width="1" /><text x="25" y="37" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start">SAC / Temperature feedback</text><rect x="471" y="16" width="143" height="29" rx="14" fill="#e9f0f6" stroke="none" stroke-width="0" /><text x="542" y="35" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" text-anchor="middle">target entropy = 1.0</text><rect x="25" y="68" width="283" height="261" rx="12" fill="#fff" stroke="#d9e5ef" stroke-width="1.4" /><text x="45" y="99" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Below target</text><text x="45" y="131" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="start">H = 0.50</text><rect x="47" y="148" width="210" height="16" rx="8" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="47" y="148" width="70" height="16" rx="8" fill="#078f91" stroke="none" stroke-width="0" /><path d="M187 139 L187 170" fill="none" stroke="#6957bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="187" y="184" fill="#6957bd" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">H*</text><path d="M165 193 Q165 205 165 214" fill="none" stroke="#078f91" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="48" y="244" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="start">Temperature α</text><text x="277" y="244" fill="#078f91" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">↑</text><rect x="47" y="255" width="210" height="18" rx="9" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="47" y="255" width="137" height="18" rx="9" fill="#078f91" stroke="none" stroke-width="0" opacity=".23"/><text x="47" y="304" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start">0.20 → 0.27</text><rect class="moving" x="47" y="255" height="18" width="101" rx="9" fill="#078f91"><animate attributeName="width" values="101;101;137;137;101" keyTimes="0;.16;.46;.86;1" dur="10s" repeatCount="indefinite"/></rect><circle class="moving" r="5" fill="#078f91" opacity="0.95"><animateMotion path="M165 190 Q202 210 165 238" dur="10s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.83;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle><rect x="332" y="68" width="283" height="261" rx="12" fill="#fff" stroke="#d9e5ef" stroke-width="1.4" /><text x="352" y="99" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">Above target</text><text x="352" y="131" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="start">H = 1.40</text><rect x="354" y="148" width="210" height="16" rx="8" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="354" y="148" width="196" height="16" rx="8" fill="#d77a36" stroke="none" stroke-width="0" /><path d="M494 139 L494 170" fill="none" stroke="#6957bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="494" y="184" fill="#6957bd" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">H*</text><path d="M472 193 Q472 205 472 214" fill="none" stroke="#d77a36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="355" y="244" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="start">Temperature α</text><text x="584" y="244" fill="#d77a36" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle">↓</text><rect x="354" y="255" width="210" height="18" rx="9" fill="#e9f0f6" stroke="none" stroke-width="0" /><rect x="354" y="255" width="112" height="18" rx="9" fill="#d77a36" stroke="none" stroke-width="0" opacity=".23"/><text x="354" y="304" fill="#23354a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start">0.27 → 0.22</text><rect class="moving" x="354" y="255" height="18" width="137" rx="9" fill="#d77a36"><animate attributeName="width" values="137;137;112;112;137" keyTimes="0;.16;.46;.86;1" dur="10s" repeatCount="indefinite"/></rect><circle class="moving" r="5" fill="#d77a36" opacity="0.95"><animateMotion path="M472 190 Q509 210 472 238" dur="10s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.83;1" dur="10s" begin="2s" repeatCount="indefinite"/></circle></svg>