<text x="522" y="258" fill="#193e69" font-family="Arial,sans-serif" font-size="12" font-weight="bold">1/4 25%</text>
<text x="24" y="289" fill="#924624" font-family="Arial,sans-serif" font-size="12" font-weight="bold">+WRONG</text>
