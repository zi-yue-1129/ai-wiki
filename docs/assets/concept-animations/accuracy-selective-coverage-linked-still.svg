<text x="24" y="228" fill="#193e69" font-family="Arial,sans-serif" font-size="12" font-weight="bold">AT k=3 · HYPOTHETICAL NEXT</text>
<rect x="24" y="239" width="286" height="31" rx="8" fill="#e3f3f1"/>
<rect x="320" y="239" width="296" height="31" rx="8" fill="#fbeee6"/>
<text x="36" y="260" fill="#0d626a" font-family="Arial,sans-serif" font-size="13" font-weight="bold">IF +CORRECT   1/4 (25%)</text>
<text x="332" y="260" fill="#924624" font-family="Arial,sans-serif" font-size="13" font-weight="bold">IF +WRONG   2/4 (50%)</text></svg>
