<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" role="img" aria-labelledby="title desc">
<title id="title">Synthetic risk and coverage at six observed cutoffs with two hypothetical next-case outcomes</title>
<desc id="desc">The six ranked synthetic predictions have correctness true, true, false, true, false, true. Risk at k one to six is zero, zero, one third, one quarter, two fifths, one third. Small hollow points mark intermediate cutoffs; filled points are interactive milestones at k two, four, and six on the MkDocs site. Risk can decrease as coverage increases; line segments only connect discrete values. At k three with one error, accepting a hypothetical next correct case would yield one error in four; a hypothetical next wrong case would yield two errors in four. Neither is a new observed prediction.</desc>
<rect width="640" height="282" rx="12" fill="#f8fafc"/><rect x="1" y="1" width="638" height="280" rx="11" fill="none" stroke="#d4deec"/>
<text x="24" y="27" fill="#526783" font-family="Arial,sans-serif" font-size="14" font-weight="bold">RISK</text>
<path d="M84 45V144H588" fill="none" stroke="#9aacc1" stroke-width="1.6"/>
<polyline points="160.00,144.00 240.00,144.00 320.00,77.33 400.00,94.00 480.00,64.00 560.00,77.33" fill="none" stroke="#087e85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160.00" cy="144.00" r="4" fill="#f8fafc" stroke="#087e85" stroke-width="2" data-risk-k="1"/>
<circle cx="240.00" cy="144.00" r="6" fill="#087e85" data-risk-k="2"/>
<circle cx="320.00" cy="77.33" r="4" fill="#f8fafc" stroke="#087e85" stroke-width="2" data-risk-k="3"/>
<circle cx="400.00" cy="94.00" r="6" fill="#087e85" data-risk-k="4"/>
<circle cx="480.00" cy="64.00" r="4" fill="#f8fafc" stroke="#087e85" stroke-width="2" data-risk-k="5"/>
<circle cx="560.00" cy="77.33" r="6" fill="#087e85" data-risk-k="6"/>
<text x="240.00" y="126.00" fill="#526783" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">0%</text>
<text x="240.00" y="165" fill="#526783" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">2/6</text>
<text x="400.00" y="76.00" fill="#526783" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">25%</text>
<text x="400.00" y="165" fill="#526783" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">4/6</text>
<text x="560.00" y="59.33" fill="#526783" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">33%</text>
<text x="560.00" y="165" fill="#526783" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">6/6</text>
<text x="24" y="190" fill="#526783" font-family="Arial,sans-serif" font-size="12">HOLLOW: k=1,3,5</text>
<text x="461" y="190" fill="#526783" font-family="Arial,sans-serif" font-size="13" font-weight="bold">COVERAGE →</text>
