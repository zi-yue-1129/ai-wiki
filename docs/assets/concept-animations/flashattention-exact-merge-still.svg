<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="322" viewBox="0 0 640 322" role="img" aria-labelledby="title desc"><title id="title">FlashAttention blockwise output is a normaliser-weighted merge, not the mean of tile outputs</title><desc id="desc">Tile A contains scores 1,2 with values 1,3; tile B has scores 5,0 with values 4,-2. Tile A output is 2.462. The naive mean of separate tile outputs is 3.211, but exact online softmax output and dense attention both equal 3.865. All values synthetic.</desc><rect width="640" height="322" rx="18" fill="#f8fafc"/><rect x="12" y="12" width="616" height="298" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Exact output · not a tile average</text><text x="30" y="66" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Scores [1,2,5,0]  •  values [1,3,4,-2]</text><path d="M 319 81 L 319 293" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="101" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">K/V tile pairs</text><rect x="30" y="113" width="133" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="134" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">TILE A</text><text x="42" y="158" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="start">s</text><text x="42" y="192" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="start">v</text><rect x="62" y="141" width="42" height="25" rx="4" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="83" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">1</text><text x="83" y="192" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">1</text><rect x="110" y="141" width="42" height="25" rx="4" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="131" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">2</text><text x="131" y="192" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3</text><rect x="173" y="113" width="133" height="125" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="185" y="134" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">TILE B</text><text x="185" y="158" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="start">s</text><text x="185" y="192" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="start">v</text><rect x="205" y="141" width="42" height="25" rx="4" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="226" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">5</text><text x="226" y="192" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">4</text><rect x="253" y="141" width="42" height="25" rx="4" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="274" y="158" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">0</text><text x="274" y="192" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">-2</text><text x="341" y="98" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start">Output on the same scale</text><text x="341" y="127" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="start">0</text><text x="572" y="127" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="end">4.5</text><line x1="342" x2="571" y1="162" y2="162" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/><circle cx="538" cy="162" r="9" fill="#0f766e" stroke="#fff" stroke-width="2"/><text x="342" y="145" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">Exact merged  ·  3.865</text><text x="342" y="229" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#0f766e" text-anchor="start">Matches dense softmax.</text><rect x="29" y="251" width="279" height="44" rx="8" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="40" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="start">Merge weighted sums and mass</text><text x="40" y="286" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">under one shared maximum.</text><text x="342" y="280" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start">Dense softmax = 3.865</text></svg>