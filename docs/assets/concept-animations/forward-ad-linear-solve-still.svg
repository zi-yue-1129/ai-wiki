<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Linear solve tangent: a right-hand-side perturbation maps to a solution perturbation</title><desc id="desc">In a fixed two by two linear system with A rows (2,1) and (1,2), perturb b in direction (1,0); the solution moves along direction (two thirds, minus one third). The two tracks are synchronized illustrative trajectories.</desc><rect width="800" height="420" rx="18" fill="#f2f7fa"/><rect x="16" y="16" width="768" height="388" rx="16" fill="#fff" stroke="#d8e6ec"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="54" fill="#17364a" font-size="22" font-weight="bold">Forward AD through a linear solve</text><text x="38" y="79" fill="#617a8a" font-size="14" >A x = b     ·     A δx = δb   (A fixed)</text><rect x="36" y="103" width="339" height="242" rx="12" fill="#f8fbfd" stroke="#d8e6ec"/><rect x="425" y="103" width="339" height="242" rx="12" fill="#f8fbfd" stroke="#d8e6ec"/><text x="55" y="135" fill="#047e88" font-size="17" font-weight="bold">Input b</text><text x="445" y="135" fill="#c57219" font-size="17" font-weight="bold">Solution x</text><path d="M74 234L343 234" fill="none" stroke="#d6e4ed" stroke-width="1.5"  stroke-linecap="round"/><path d="M198 164L198 312" fill="none" stroke="#d6e4ed" stroke-width="1.5"  stroke-linecap="round"/><path d="M460 234L740 234" fill="none" stroke="#d6e4ed" stroke-width="1.5"  stroke-linecap="round"/><path d="M602 164L602 312" fill="none" stroke="#d6e4ed" stroke-width="1.5"  stroke-linecap="round"/><path d="M148 234 L248 234" fill="none" stroke="#047e88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M542 206 L662 262" fill="none" stroke="#c57219" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="198" cy="234" r="6" fill="#fff" stroke="#047e88" stroke-width="2"/><circle cx="602" cy="234" r="6" fill="#fff" stroke="#c57219" stroke-width="2"/><circle cx="148" cy="234" r="8" fill="#047e88"/><circle cx="248" cy="234" r="8" fill="#047e88"/><circle cx="542" cy="206" r="8" fill="#c57219"/><circle cx="662" cy="262" r="8" fill="#c57219"/><text x="57" y="160" fill="#617a8a" font-size="13" >b₀ = (3,3)</text><text x="445" y="160" fill="#617a8a" font-size="13" >x₀ = (1,1)</text><text x="58" y="324" fill="#047e88" font-size="16" font-weight="bold">δb = (1, 0)</text><text x="445" y="324" fill="#c57219" font-size="16" font-weight="bold">δx = (⅔, −⅓)</text><text x="383" y="230" fill="#6955af" font-size="25" text-anchor="middle" font-weight="bold">→</text><text x="391" y="252" fill="#6955af" font-size="12" text-anchor="middle">A⁻¹</text><text x="41" y="376" fill="#617a8a" font-size="13" >Exact synthetic system: A = [[2, 1], [1, 2]]</text><text x="757" y="392" fill="#617a8a" font-size="11" text-anchor="end">No measured solver timings</text></g></svg>