<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Inverted dropout: stable mean, growing variance</title><desc id="desc">As the keep probability falls, the nonzero activation moves farther from zero, zero-mask probability increases, the mean stays at two and the variance increases. Synthetic scalar activation h equals two.</desc><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f7fafc}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f7fafc"/><text x="26" y="34" font-size="18" fill="#18344c" font-weight="700" text-anchor="start">INVERTED DROPOUT</text><text x="614" y="34" font-size="13" fill="#088a82" font-weight="700" text-anchor="end">h = 2</text><rect x="24" y="56" width="396" height="280" rx="12" fill="#fff" stroke="#cbd8e2"/><rect x="430" y="56" width="186" height="280" rx="12" fill="#fff" stroke="#cbd8e2"/><text x="45" y="82" font-size="13" fill="#18344c" font-weight="700" text-anchor="start">TWO OUTCOMES</text><text x="454" y="82" font-size="13" fill="#18344c" font-weight="700" text-anchor="start">MOMENTS</text><text x="45" y="111" font-size="12" fill="#506578" font-weight="400" text-anchor="start">Keep probability</text><text x="390" y="111" font-size="12" fill="#506578" font-weight="600" text-anchor="end">1.00 → 0.25</text><rect x="70" y="130" width="310" height="5" rx="2.5" fill="#dce9ee"/><circle cx="380" cy="132" r="9" fill="#088a82"><animate attributeName="cx" values="380.00;367.08;354.17;341.25;328.33;315.42;302.50;289.58;276.67;263.75;250.83;237.92;225.00;212.08;199.17;186.25;173.33;160.42;147.50;134.58;121.67;108.75;95.83;82.92;70.00;82.92;95.83;108.75;121.67;134.58;147.50;160.42;173.33;186.25;199.17;212.08;225.00;237.92;250.83;263.75;276.67;289.58;302.50;315.42;328.33;341.25;354.17;367.08;380.00" dur="12s" repeatCount="indefinite"/></circle><text x="67" y="154" font-size="11" fill="#506578" font-weight="400" text-anchor="start">0.25</text><text x="383" y="154" font-size="11" fill="#506578" font-weight="400" text-anchor="end">1.00</text><path d="M52 259H399" stroke="#cbd8e2" stroke-width="2"/><path d="M55 259v5" stroke="#cbd8e2"/><text x="55" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">0</text><path d="M140 259v5" stroke="#cbd8e2"/><text x="140" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">2</text><path d="M225 259v5" stroke="#cbd8e2"/><text x="225" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">4</text><path d="M310 259v5" stroke="#cbd8e2"/><text x="310" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">6</text><path d="M395 259v5" stroke="#cbd8e2"/><text x="395" y="281" font-size="11" fill="#506578" font-weight="400" text-anchor="middle">8</text><text x="55" y="304" font-size="12" fill="#ed8759" font-weight="650" text-anchor="start">masked = 0</text><text x="390" y="304" font-size="12" fill="#088a82" font-weight="650" text-anchor="end">kept = h / p</text><path d="M55 190V259" stroke="#ed8759" stroke-width="2" stroke-dasharray="4 4"/><circle cx="55" cy="219" r="1" fill="#ed8759" stroke="#fff" stroke-width="2"><animate attributeName="r" values="2.00;5.18;6.50;7.51;8.36;9.12;9.79;10.42;11.00;11.55;12.06;12.55;13.02;13.47;13.91;14.32;14.73;15.12;15.50;15.87;16.23;16.58;16.92;17.26;17.59;17.26;16.92;16.58;16.23;15.87;15.50;15.12;14.73;14.32;13.91;13.47;13.02;12.55;12.06;11.55;11.00;10.42;9.79;9.12;8.36;7.51;6.50;5.18;2.00" dur="12s" repeatCount="indefinite"/></circle><circle cx="140" cy="219" r="20" fill="#088a82" stroke="#fff" stroke-width="2"><animate attributeName="cx" values="140.00;142.74;145.67;148.79;152.14;155.74;159.62;163.80;168.33;173.26;178.64;184.52;191.00;198.16;206.11;215.00;225.00;236.33;249.29;264.23;281.67;302.27;327.00;357.22;395.00;357.22;327.00;302.27;281.67;264.23;249.29;236.33;225.00;215.00;206.11;198.16;191.00;184.52;178.64;173.26;168.33;163.80;