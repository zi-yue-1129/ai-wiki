<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="gradscaler-title gradscaler-detail"><title id="gradscaler-title">Dynamic loss-scale adjustment after finite and overflowing gradients</title><desc id="gradscaler-detail">Synthetic six-iteration GradScaler example: with growth interval 2, growth factor 2 and backoff factor 0.5, the scale used in iterations one through six is 1024, 1024, 2048, 1024, 1024, 2048. Both example gradients remain finite at 1024, so two successful iterations permit growth to 2048; the large scaled gradient overflows at 2048, skipping that optimizer step and reducing the next scale to 1024. The second overflow also backs off after the sixth iteration. A two-dot streak strip directly below each scale point fills after finite checks, completes the two-check growth trigger, and shows a crossed reset on overflow; it is visible in GitHub previews and with reduced motion. A moving outline and synchronized finite-check streak readout follow the six observed steps; the NEXT S row shows the following iteration's scale, including the unshown seventh iteration; the full trajectory and outcome labels remain visible without motion. This is illustrative, not measured training data. The growth interval is deliberately shortened from the PyTorch default of 2000 for teaching.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.moving,.live{display:inline}.reduced-only{display:none}@media(prefers-reduced-motion:reduce){.moving,.live{display:none!important}.reduced-only{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="37" font-size="21" font-weight="750" fill="#18364d">DYNAMIC LOSS SCALE</text><text x="24" y="58" font-size="11.5" fill="#5c7185">Illustrative: growth interval = 2 · growth ×2 · backoff ×0.5</text><rect x="24" y="73" width="592" height="227" rx="11" fill="#ffffff" stroke="#d7e3ec"/><text x="42" y="96" font-size="11" fill="#5b7185" font-weight="700">SCALE</text><line x1="96" y1="115" x2="589" y2="115" stroke="#dde7ed" stroke-dasharray="4 5"/><line x1="96" y1="185" x2="589" y2="185" stroke="#dde7ed" stroke-dasharray="4 5"/><text x="90" y="119" text-anchor="end" font-size="12" fill="#526b82">2048</text><text x="90" y="189" text-anchor="end" font-size="12" fill="#526b82">1024</text><path d="M 133 185 L 218 185 L 303 115 L 388 185 L 473 185 L 558 115" fill="none" stroke="#819bb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="133" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><g data-teaching-role="finite-streak-history" aria-label="Synthetic finite-check streak by iteration: one of two; two of two then grow; reset on overflow; one of two; two of two then grow; reset on overflow"><text x="42" y="216" font-size="10.5" font-weight="700" fill="#5b7185">STREAK</text><circle cx="128" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="138" cy="213" r="3.5" fill="#fff" stroke="#16857f" stroke-width="1.2"/><circle cx="213" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="223" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="303" cy="213" r="8" fill="#fff3e9" stroke="#b66c39" stroke-width="1.5"/><path d="M 300 210 L 306 216 M 306 210 L 300 216" stroke="#b66c39" stroke-width="1.6" stroke-linecap="round"/><circle cx="383" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="393" cy="213" r="3.5" fill="#fff" stroke="#16857f" stroke-width="1.2"/><circle cx="468" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="478" cy="213" r="3.5" fill="#16857f" stroke="#16857f" stroke-width="1.2"/><circle cx="558" cy="213" r="8" fill="#fff3e9" stroke="#b66c39" stroke-width="1.5"/><path d="M 555 210 L 561 216 M 561 210 L 555 216" stroke="#b66c39" stroke-width="1.6" stroke-linecap="round"/></g><text x="133" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t1</text><text x="133" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="218" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="218" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t2</text><text x="218" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="303" cy="115" r="11" fill="#b66c39" stroke="#fff" stroke-width="3"/><text x="303" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t3</text><text x="303" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#b66c39">INF</text><circle cx="388" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="388" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t4</text><text x="388" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="473" cy="185" r="11" fill="#16857f" stroke="#fff" stroke-width="3"/><text x="473" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t5</text><text x="473" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#16857f">OK</text><circle cx="558" cy="115" r="11" fill="#b66c39" stroke="#fff" stroke-width="3"/><text x="558" y="237" text-anchor="middle" font-size="11.5" fill="#5c7185">t6</text><text x="558" y="259" text-anchor="middle" font-size="12" font-weight="700" fill="#b66c39">INF</text><path d="M 235 174 L 268 145" stroke="#16857f" stroke-width="1.5" fill="none"/><path d="M 262 145 L 268 145 L 266 151" fill="none" stroke="#16857f" stroke-width="1.5"/><path d="M 322 126 L 362 161" stroke="#b66c39" stroke-width="1.5" fill="none"/><path d="M 356 159 L 362 161 L 361 155" fill="none" stroke="#b66c39" stroke-width="1.5"/><g data-teaching-role="next-scale-row"><text x="42" y="288" font-size="10.5" font-weight="700" fill="#5b7185">NEXT S</text><text x="133" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">1024</text><text x="218" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">2048</text><text x="303" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">1024</text><text x="388" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">1024</text><text x="473" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">2048</text><text x="558" y="288" text-anchor="middle" font-size="11.5" font-weight="700" fill="#344f67">1024</text></g><g class="moving" data-teaching-role="scale-cursor" aria-label="Moving marker traces the loss scale at each training iteration"><circle cx="133" cy="185" r="17" fill="none" stroke="#273e62" stroke-width="3"><animate attributeName="cx" values="133;218;303;388;473;558;133" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="cy" values="185;185;115;185;185;115;185" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></circle></g><text x="28" y="315" font-size="11.5" fill="#16857f" font-weight="700">OK → ELIGIBLE</text><text x="191" y="315" font-size="11.5" fill="#b66c39" font-weight="700">INF → SKIP</text><text x="367" y="315" font-size="10.5" fill="#5a7084">NEXT S applies after each check</text><rect x="24" y="325" width="592" height="23" rx="7" fill="#e9eff5"/><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="1">t1 · streak 1/2 · next 1024<animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="0">t2 · streak 2/2 → GROW · next 2048<animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="0">t3 · INF → RESET · next 1024<animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="0">t4 · streak 1/2 · next 1024<animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="0">t5 · streak 2/2 → GROW · next 2048<animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="live" data-teaching-role="finite-streak" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67" opacity="0">t6 · INF → RESET · next 1024<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.166667;0.333333;0.5;0.666667;0.833333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text><text class="reduced-only" x="320" y="341" text-anchor="middle" font-size="11.5" fill="#344f67">t2 · streak 2/2 → GROW · next 2048</text></svg>