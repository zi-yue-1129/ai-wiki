<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Quantization introduces ties and changes ROC-AUC</title><desc id="desc">Four synthetic scores: positive 0.90 and 0.60, negative 0.80 and 0.30. Original pairwise ROC-AUC is 0.75. Rounding each score to the nearest half yields 1, 0.5, 1, 0.5, creating two cross-class ties; ROC-AUC becomes 0.50. Moving marker positions between endpoints depict a visual transition, not intermediate valid quantized scores.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#2b4858}.head{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:650}.small{font-size:11px;fill:#58758a}.tiny{font-size:10px;fill:#647d8c}</style><rect width="640" height="360" rx="14" fill="#f0f7fb"/><text class="head" x="22" y="32">Quantization can change ROC-AUC</text><rect x="20" y="49" width="600" height="284" rx="12" fill="#fff" stroke="#d5e5ed"/><text x="41" y="74" class="label">Score positions</text><text x="401" y="94" class="label">Pair outcomes</text><line x1="377" y1="68" x2="377" y2="312" stroke="#dbe8ee"/><text x="148" y="89" class="tiny" text-anchor="middle">0</text><text x="248" y="89" class="tiny" text-anchor="middle">0.5</text><text x="348" y="89" class="tiny" text-anchor="middle">1</text><rect x="39" y="98" width="326" height="34" rx="8" fill="#eef9f7"/><text x="51" y="119" class="label">P1</text><text x="91" y="119" class="small">.90</text><line x1="148" y1="115" x2="348" y2="115" stroke="#b7cbd4" stroke-width="3" stroke-linecap="round"/><circle cx="348" cy="115" r="8" fill="none" stroke="#e5a55d" stroke-width="2" stroke-dasharray="3 2"/><g><circle cx="348" cy="115" r="9" fill="#188a91" stroke="white" stroke-width="2"/></g><rect x="39" y="143" width="326" height="34" rx="8" fill="#eef9f7"/><text x="51" y="164" class="label">P2</text><text x="91" y="164" class="small">.60</text><line x1="148" y1="160" x2="348" y2="160" stroke="#b7cbd4" stroke-width="3" stroke-linecap="round"/><circle cx="248" cy="160" r="8" fill="none" stroke="#e5a55d" stroke-width="2" stroke-dasharray="3 2"/><g><circle cx="248" cy="160" r="9" fill="#188a91" stroke="white" stroke-width="2"/></g><rect x="39" y="188" width="326" height="34" rx="8" fill="#f7f0fa"/><text x="51" y="209" class="label">N1</text><text x="91" y="209" class="small">.80</text><line x1="148" y1="205" x2="348" y2="205" stroke="#b7cbd4" stroke-width="3" stroke-linecap="round"/><circle cx="348" cy="205" r="8" fill="none" stroke="#e5a55d" stroke-width="2" stroke-dasharray="3 2"/><g><circle cx="348" cy="205" r="9" fill="#a477ba" stroke="white" stroke-width="2"/></g><rect x="39" y="233" width="326" height="34" rx="8" fill="#f7f0fa"/><text x="51" y="254" class="label">N2</text><text x="91" y="254" class="small">.30</text><line x1="148" y1="250" x2="348" y2="250" stroke="#b7cbd4" stroke-width="3" stroke-linecap="round"/><circle cx="248" cy="250" r="8" fill="none" stroke="#e5a55d" stroke-width="2" stroke-dasharray="3 2"/><g><circle cx="248" cy="250" r="9" fill="#a477ba" stroke="white" stroke-width="2"/></g><text x="41" y="310" class="small">Dotted ring = rounded target</text><text x="450" y="123" class="small" text-anchor="middle">N1</text><text x="541" y="123" class="small" text-anchor="middle">N2</text><text x="398" y="161" class="small">P1</text><text x="398" y="213" class="small">P2</text><rect x="423" y="134" width="64" height="41" rx="9" fill="#f7fafc" stroke="#d6e2e9"/><g><rect x="425" y="136" width="60" height="37" rx="7" fill="#fff0d8"/><text x="455" y="161" text-anchor="middle" style="fill:#ae6f2a;font-size:17px;font-weight:700">T</text></g><rect x="514" y="134" width="64" height="41" rx="9" fill="#f7fafc" stroke="#d6e2e9"/><g><rect x="516" y="136" width="60" height="37" rx="7" fill="#def5ee"/><text x="546" y="161" text-anchor="middle" style="fill:#168171;font-size:17px;font-weight:700">W</text></g><rect x="423" y="186" width="64" height="41" rx="9" fill="#f7fafc" stroke="#d6e2e9"/><g><rect x="425" y="188" width="60" height="37" rx="7" fill="#e6edf1"/><text x="455" y="213" text-anchor="middle" style="fill:#597182;font-size:17px;font-weight:700">L</text></g><rect x="514" y="186" width="64" height="41" rx="9" fill="#f7fafc" stroke="#d6e2e9"/><g><rect x="516" y="188" width="60" height="37" rx="7" fill="#fff0d8"/><text x="546" y="213" text-anchor="middle" style="fill:#ae6f2a;font-size:17px;font-weight:700">T</text></g><text x="500" y="241" text-anchor="middle" class="small">W win · T tie · L loss</text><rect x="397" y="251" width="201" height="53" rx="9" fill="#eef6f8"/><text x="413" y="270" class="small">AUC</text><g><text x="503" y="286" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#b17632">0.50</text></g><text x="25" y="349" class="tiny">Synthetic scores · round to nearest 0.5 · two new cross-class ties</text></svg>