<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" role="img" aria-labelledby="title desc"><title id="title">RND fixed target versus ICM representation drift</title><desc id="desc">For a fixed illustrative input, the RND random target feature stays in place. The ICM next-state feature may shift when its encoder updates, temporarily changing the prediction gap even before the forward predictor updates. Later both predictors adapt. The coordinates illustrate separate parameter-update effects, not recorded training.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-weight:700;fill:#253951}.muted{fill:#587086}.panel{fill:#fff;stroke:#cedbe8;stroke-width:1.5}.axis{stroke:#d8e2ec;stroke-width:3;stroke-linecap:round}.gap{stroke:#8c75ba;stroke-width:5;stroke-linecap:round}.target{fill:#fff;stroke:#15958c;stroke-width:4}.predict{fill:#f1a452;stroke:#ae6d28;stroke-width:1.8}.reduced-frame{display:none}@media(prefers-reduced-motion:reduce){.live{display:none}.reduced-frame{display:block}}</style><rect width="360" height="492" rx="18" fill="#f7f9fd"/><text x="17" y="31" class="title" font-size="19">WHO MOVES THE TARGET?</text><text x="17" y="53" class="muted" font-size="12">Same input · isolated update steps</text><circle class="target" cx="25" cy="77" r="6"/><text x="38" y="81" font-size="12" fill="#46657b">Target</text><rect class="predict" x="126" y="71" width="12" height="12" rx="2"/><text x="147" y="81" font-size="12" fill="#46657b">Prediction</text><line class="gap" x1="258" x2="270" y1="77" y2="77" stroke-width="3"/><text x="278" y="81" font-size="12" fill="#46657b">Gap</text><g class="live"><rect class="panel" x="14" y="100" width="332" height="154" rx="15"/><text x="29" y="129" class="title" font-size="19">RND</text><text x="29" y="149" class="muted" font-size="12">Fixed random-network target</text><text x="29" y="237" class="muted" font-size="12">Target fixed · predictor learns later</text><rect class="panel" x="14" y="264" width="332" height="154" rx="15"/><text x="29" y="293" class="title" font-size="19">ICM</text><text x="29" y="313" class="muted" font-size="12">Trainable next-feature encoder</text><text x="29" y="401" class="muted" font-size="12">Target can move before predictor refits</text><line class="axis" x1="76" y1="200" x2="315" y2="200"/><line class="gap" x1="101" x2="225" y1="200" y2="200"><animate attributeName="x1" values="101;101;101;219;219" keyTimes="0;.56;.62;.82;1" dur="12s" repeatCount="indefinite"/></line><circle class="target" cx="225" cy="200" r="8"/><rect class="predict" x="94" y="193" width="14" height="14" rx="3"><animate attributeName="x" values="94;94;94;212;212" keyTimes="0;.56;.62;.82;1" dur="12s" repeatCount="indefinite"/></rect><line class="axis" x1="76" y1="364" x2="315" y2="364"/><line class="gap" x1="101" x2="225" y1="364" y2="364"><animate attributeName="x1" values="101;101;101;279;279" keyTimes="0;.56;.62;.82;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x2" values="225;225;291;291;291" keyTimes="0;.25;.50;.82;1" dur="12s" repeatCount="indefinite"/></line><circle class="target" cx="225" cy="364" r="8"><animate attributeName="cx" values="225;225;291;291;291" keyTimes="0;.25;.50;.82;1" dur="12s" repeatCount="indefinite"/></circle><rect class="predict" x="94" y="357" width="14" height="14" rx="3"><animate attributeName="x" values="94;94;94;272;272" keyTimes="0;.56;.62;.82;1" dur="12s" repeatCount="indefinite"/></rect><path d="M228 340Q258 318 289 340" fill="none" stroke="#8b67b7" stroke-width="2" stroke-dasharray="4 4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.29;.49;.53;1" dur="12s" repeatCount="indefinite"/></path><path d="M102 386H278" fill="none" stroke="#df9850" stroke-width="2" stroke-dasharray="5 5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.60;.64;.80;1" dur="12s" repeatCount="indefinite"/></path></g><g class="reduced-frame"><rect class="panel" x="14" y="100" width="332" height="154" rx="15"/><text x="29" y="129" class="title" font-size="19">RND</text><text x="29" y="149" class="muted" font-size="12">Fixed random-network target</text><text x="29" y="237" class="muted" font-size="12">RND target stays at the same coordinate</text><rect class="panel" x="14" y="264" width="332" height="154" rx="15"/><text x="29" y="293" class="title" font-size="19">ICM</text><text x="29" y="313" class="muted" font-size="12">Trainable next-feature encoder</text><text x="29" y="401" class="muted" font-size="12">ICM target may shift after encoder update</text><line class="axis" x1="76" y1="200" x2="315" y2="200"/><line class="gap" x1="101" y1="200" x2="225" y2="200"/><rect class="predict" x="94" y="193" width="14" height="14" rx="3"/><circle class="target" cx="225" cy="200" r="8"/><line class="axis" x1="76" y1="364" x2="315" y2="364"/><line class="gap" x1="101" y1="364" x2="291" y2="364"/><rect class="predict" x="94" y="357" width="14" height="14" rx="3"/><circle class="target" cx="291" cy="364" r="8"/></g><rect x="18" y="434" width="324" height="37" rx="11" fill="#e9eef7"/><text x="42" y="458" class="title" font-size="13">START</text><text x="137" y="458" class="title" font-size="13">ENCODER</text><text x="256" y="458" class="title" font-size="13">PREDICTOR</text><rect x="34" y="466" width="40" height="3.5" rx="1.75" fill="#7288ae"><animate attributeName="x" values="34;34;128;128;248;248" keyTimes="0;.25;.29;.56;.62;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="40;40;68;68;75;75" keyTimes="0;.25;.29;.56;.62;1" dur="12s" repeatCount="indefinite"/></rect><text x="18" y="486" font-size="10.5" fill="#64798c">Schematic feature coordinate · not model measurements</text></svg>