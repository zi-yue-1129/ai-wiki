<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">K-means mean versus median as one point moves</title><desc id="desc">Two static views of the same five fixed observations plus one movable observation. The mean is 2.33 then 3.67; the median remains 2.50.</desc><style>text{font-family:Inter,Arial,sans-serif}.moving{display:inline}.reduced{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.reduced{display:inline!important}}</style><rect width="800" height="420" rx="18" fill="#f5f9fc"/><text x="32" y="42" font-size="15" font-weight="700" fill="#243b50" text-anchor="start">K-MEANS · OUTLIER LEVERAGE</text><rect x="32" y="79" width="736" height="148" rx="14" fill="white" stroke="#d6e3eb"/><text x="54" y="102" font-size="14" font-weight="700" fill="#243b50" text-anchor="start">BEFORE · x = 4</text><line x1="112" y1="161" x2="688" y2="161" stroke="#d6e3eb" stroke-width="2"/><circle cx="112" cy="161" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="160" cy="161" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="208" cy="161" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="256" cy="161" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="304" cy="161" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="304" cy="128" r="10" fill="#dc9a38"/><text x="304" y="113" font-size="12" font-weight="600" fill="#dc9a38" text-anchor="middle">x</text><text x="224" y="197" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">MEAN 2.33</text><line x1="224" x2="224" y1="170" y2="182" stroke="#0d9488" stroke-width="2"/><line x1="232" x2="232" y1="147" y2="171" stroke="#dc9a38" stroke-width="2" stroke-dasharray="3 3"/><text x="565" y="197" font-size="12" font-weight="600" fill="#dc9a38" text-anchor="start">MEDIAN 2.50</text><rect x="32" y="249" width="736" height="148" rx="14" fill="white" stroke="#d6e3eb"/><text x="54" y="272" font-size="14" font-weight="700" fill="#243b50" text-anchor="start">AFTER · x = 12</text><line x1="112" y1="331" x2="688" y2="331" stroke="#d6e3eb" stroke-width="2"/><circle cx="112" cy="331" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="160" cy="331" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="208" cy="331" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="256" cy="331" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="304" cy="331" r="7" fill="#3679b7" stroke="white" stroke-width="2"/><circle cx="688" cy="298" r="10" fill="#dc9a38"/><text x="688" y="283" font-size="12" font-weight="600" fill="#dc9a38" text-anchor="middle">x</text><text x="288" y="367" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">MEAN 3.67</text><line x1="288" x2="288" y1="340" y2="352" stroke="#0d9488" stroke-width="2"/><line x1="232" x2="232" y1="317" y2="341" stroke="#dc9a38" stroke-width="2" stroke-dasharray="3 3"/><text x="565" y="367" font-size="12" font-weight="600" fill="#dc9a38" text-anchor="start">MEDIAN 2.50</text><text x="32" y="403" font-size="11" font-weight="600" fill="#71889a" text-anchor="start">Synthetic observations · same six values except the moving point</text></svg>