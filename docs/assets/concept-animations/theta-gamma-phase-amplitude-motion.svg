<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Illustrative theta phase–gamma amplitude coupling. A moving phase cursor links the slow theta oscillation to the changing amplitude envelope of faster gamma oscillations. Values are synthetic.</title><desc id="desc">A phase cursor tracks a slow theta oscillation and a fast gamma carrier whose amplitude is phase-modulated. The illustration is analytic, not a physiological recording.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7fbff" /><stop offset="1" stop-color="#edf5fa" /></linearGradient><linearGradient id="band" x2="0" y2="1"><stop stop-color="#16a7a0" stop-opacity=".15" /><stop offset="1" stop-color="#16a7a0" stop-opacity=".02" /></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#29475c}.over{font-size:12px;font-weight:800;letter-spacing:1.1px}.label{font-size:13px;font-weight:700}.note{font-size:11px;fill:#637f93}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)" /><text class="over" x="28" y="35">THETA–GAMMA PHASE–AMPLITUDE COUPLING</text><rect x="26" y="59" width="588" height="273" rx="14" fill="#ffffff" stroke="#d9e7ef" /><rect x="43" y="81" width="553" height="111" rx="10" fill="#f3f8fc" /><rect x="43" y="200" width="553" height="100" rx="10" fill="#f3f8fc" /><text class="label" x="55" y="109" fill="#246b9b">Theta</text><text class="label" x="55" y="224" fill="#ba6f2b">Gamma</text><line x1="119" y1="136" x2="592" y2="136" stroke="#cad9e4" stroke-dasharray="4 5" /><line x1="119" y1="235" x2="592" y2="235" stroke="#cad9e4" stroke-dasharray="4 5" /><path d="M119.0,166.0 L123.9,165.9 L128.9,165.7 L133.8,165.4 L138.7,165.0 L143.6,164.4 L148.6,163.7 L153.5,162.9 L158.4,162.0 L163.3,160.9 L168.3,159.8 L173.2,158.6 L178.1,157.2 L183.1,155.8 L188.0,154.3 L192.9,152.7 L