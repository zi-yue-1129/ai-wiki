<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description" font-family="Arial,Helvetica,sans-serif"><title id="title">HAWQ: same bit budget</title><desc id="description">Two equal-bit allocations compare growing perturbations and their quadratic losses in sharp and flat scalar blocks.</desc><rect x="0" y="0" width="640" height="360" rx="14" fill="#f7fbff"/><text x="22" y="32" font-size="23" fill="#1b3651" text-anchor="start">HAWQ: same bit budget</text><text x="24" y="61" font-size="16" fill="#1b3651" text-anchor="start">12 bits  ·  two scalar blocks</text><rect x="18" y="79" width="294" height="263" rx="10" fill="#fff"/><text x="165" y="104" font-size="18" fill="#1b3651" text-anchor="middle">Swapped allocation</text><text x="30" y="129" font-size="15" fill="#1b3651" text-anchor="start">Sharp  λ=8  ·  4 bit</text><text x="30" y="152" font-size="14" fill="#1b3651" text-anchor="start">|δ|</text><rect x="75" y="139" width="150" height="15" rx="4" fill="#e6edf2"/><rect id="still-0-0-delta" x="75" y="139" width="150" height="15" rx="3" fill="#a26420"></rect><text x="298" y="152" font-size="14" fill="#1b3651" text-anchor="end">0.5</text><text x="30" y="180" font-size="14" fill="#1b3651" text-anchor="start">ΔL</text><rect x="75" y="165" width="150" height="19" rx="4" fill="#e6edf2"/><rect id="still-0-0-loss" x="75" y="165" width="150" height="19" rx="3" fill="#35678f"></rect><text x="298" y="180" font-size="14" fill="#1b3651" text-anchor="end">1</text><text x="30" y="220" font-size="15" fill="#1b3651" text-anchor="start">Flat  λ=2  ·  8 bit</text><text x="30" y="243" font-size="14" fill="#1b3651" text-anchor="start">|δ|</text><rect x="75" y="230" width="150" height="15" rx="4" fill="#e6edf2"/><rect id="still-0-1-delta" x="75" y="230" width="75" height="15" rx="3" fill="#a26420"></rect><text x="298" y="243" font-size="14" fill="#1b3651" text-anchor="end">0.25</text><text x="30" y="271" font-size="14" fill="#1b3651" text-anchor="start">ΔL</text><rect x="75" y="256" width="150" height="19" rx="4" fill="#e6edf2"/><rect id="still-0-1-loss" x="75" y="256" width="9.375" height="19" rx="3" fill="#08756e"></rect><text x="298" y="271" font-size="14" fill="#1b3651" text-anchor="end">0.0625</text><text x="165" y="325" font-size="19" fill="#1b3651" text-anchor="middle">Total ΔL = 1.0625</text><rect x="328" y="79" width="294" height="263" rx="10" fill="#fff"/><text x="475" y="104" font-size="18" fill="#1b3651" text-anchor="middle">Curvature-aware</text><text x="340" y="129" font-size="15" fill="#1b3651" text-anchor="start">Sharp  λ=8  ·  8 bit</text><text x="340" y="152" font-size="14" fill="#1b3651" text-anchor="start">|δ|</text><rect x="385" y="139" width="150" height="15" rx="4" fill="#e6edf2"/><rect id="still-1-0-delta" x="385" y="139" width="75" height="15" rx="3" fill="#a26420"></rect><text x="608" y="152" font-size="14" fill="#1b3651" text-anchor="end">0.25</text><text x="340" y="180" font-size="14" fill="#1b3651" text-anchor="start">ΔL</text><rect x="385" y="165" width="150" height="19" rx="4" fill="#e6edf2"/><rect id="still-1-0-loss" x="385" y="165" width="37.5" height="19" rx="3" fill="#35678f"></rect><text x="608" y="180" font-size="14" fill="#1b3651" text-anchor="end">0.25</text><text x="340" y="220" font-size="15" fill="#1b3651" text-anchor="start">Flat  λ=2  ·  4 bit</text><text x="340" y="243" font-size="14" fill="#1b3651" text-anchor="start">|δ|</text><rect x="385" y="230" width="150" height="15" rx="4" fill="#e6edf2"/><rect id="still-1-1-delta" x="385" y="230" width="150" height="15" rx="3" fill="#a26420"></rect><text x="608" y="243" font-size="14" fill="#1b3651" text-anchor="end">0.5</text><text x="340" y="271" font-size="14" fill="#1b3651" text-anchor="start">ΔL</text><rect x="385" y="256" width="150" height="19" rx="4" fill="#e6edf2"/><rect id="still-1-1-loss" x="385" y="256" width="37.5" height="19" rx="3" fill="#08756e"></rect><text x="608" y="271" fon