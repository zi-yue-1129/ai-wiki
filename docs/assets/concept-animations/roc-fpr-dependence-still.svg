<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Dependence changes the distribution of false alarms</title><desc id="desc">Three synthetic negative cases each have false alarm probability one sixth. With independent alarms, the probability of at least one false alarm is 91 over 216, or 42.1 percent. With one shared Bernoulli shock causing all three alarms together, their marginal probabilities stay one sixth but the chance of at least one alarm is one sixth, or 16.7 percent. The animated histogram changes between the two joint models. This is a hypothetical comparison, not a model measurement.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#263d4d}.title{font-size:18px;font-weight:700}.head{font-size:12px;font-weight:700}.sub{font-size:11px;fill:#597181}.tiny{font-size:10px;fill:#597181}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect width="640" height="360" rx="14" fill="#f1f7fb"/><text x="22" y="31" class="title">Same marginal FPR, different batch risk</text><rect x="20" y="50" width="289" height="273" rx="12" fill="#fff" stroke="#d2e0e9"/><rect x="320" y="50" width="300" height="273" rx="12" fill="#fff" stroke="#d2e0e9"/><text x="36" y="76" class="head">THREE NEGATIVE CASES</text><text x="336" y="76" class="head">FALSE ALARMS / BATCH</text><text x="36" y="97" class="sub">Each P(FP) = 1/6 in both models</text><line x1="344" y1="282" x2="602" y2="282" stroke="#9db3c0" stroke-width="1.5"/><line x1="344" y1="159" x2="344" y2="282" stroke="#d8e4ea"/><text x="342" y="151" class="tiny">Probability</text><text x="344" y="297" class="tiny">K =</text><text x="385" y="297" text-anchor="middle" class="sub">0</text><text x="443" y="297" text-anchor="middle" class="sub">1</text><text x="501" y="297" text-anchor="middle" class="sub">2</text><text x="559" y="297" text-anchor="middle" class="sub">3</text><text x="165" y="124" class="head" text-anchor="middle">SHARED VS INDEPENDENT</text><text x="165" y="153" class="sub" text-anchor="middle">Each case: P(FP) = 1/6</text><path d="M70 182H265" stroke="#dbe6ec" stroke-width="2"/><circle cx="90" cy="182" r="10" fill="#277e86"/><circle cx="165" cy="182" r="10" fill="#277e86"/><circle cx="240" cy="182" r="10" fill="#277e86"/><text x="165" y="219" class="sub" text-anchor="middle">Independent: 42.1% any FP</text><path d="M92 245L165 267L239 245" stroke="#c57d52" stroke-width="2" fill="none"/><circle cx="165" cy="245" r="10" fill="#c57d52"/><text x="165" y="301" class="sub" text-anchor="middle">Shared shock: 16.7% any FP</text><text x="484" y="103" class="sub" text-anchor="middle">Independent / shared shock</text><rect x="368" y="199.4" width="16" height="82.6" rx="2" fill="#277e86"/><rect x="386" y="163.0" width="16" height="119.0" rx="2" fill="#c57d52"/><rect x="426" y="232.4" width="16" height="49.6" rx="2" fill="#277e86"/><rect x="444" y="282.0" width="16" height="0.0" rx="2" fill="#c57d52"/><rect x="484" y="272.1" width="16" height="9.9" rx="2" fill="#277e86"/><rect x="502" y="282.0" width="16" height="0.0" rx="2" fill="#c57d52"/><rect x="542" y="281.3" width="16" height="0.7" rx="2" fill="#277e86"/><rect x="560" y="258.2" width="16" height="23.8" rx="2" fill="#c57d52"/><rect x="367" y="311" width="10" height="7" fill="#277e86"/><text x="382" y="318" class="tiny">Independent</text><rect x="471" y="311" width="10" height="7" fill="#c57d52"/><text x="486" y="318" class="tiny">Shared</text><text x="22" y="346" class="tiny">SYNTHETIC · SAME MARGINAL FPR · DIFFERENT JOINT DISTRIBUTIONS</text></svg>