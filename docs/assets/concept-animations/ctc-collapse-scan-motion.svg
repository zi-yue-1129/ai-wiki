<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">CTC: collapse a frame path</title><desc id="desc">Scan A,A,blank,A,B. Emit A at frame one, skip its repeat, skip blank, emit A and B. The transcript is AAB; a blank separates repeated letters.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif}.motion{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="5" fill="#f1f6fa" stroke="none"/><text x="24" y="33" font-size="23" fill="#233b52" text-anchor="start">CTC: collapse a frame path</text><rect x="18" y="52" width="604" height="290" rx="5" fill="#ffffff" stroke="none"/><text x="38" y="78" font-size="17" fill="#233b52" text-anchor="start">Frame path</text><text x="38" y="248" font-size="17" fill="#233b52" text-anchor="start">Transcript</text><rect x="55" y="86" width="70" height="48" rx="5" fill="#e9f2f9" stroke="none"/><text x="90" y="119" font-size="26" fill="#21678d" text-anchor="middle">A</text><text x="90" y="158" font-size="17" fill="#087d70" text-anchor="middle">emit</text><rect x="170" y="86" width="70" height="48" rx="5" fill="#e9f2f9" stroke="none"/><text x="205" y="119" font-size="26" fill="#21678d" text-anchor="middle">A</text><text x="205" y="158" font-size="17" fill="#a95516" text-anchor="middle">repeat</text><rect x="285" y="86" width="70" height="48" rx="5" fill="#eef1f4" stroke="none"/><text x="320" y="119" font-size="26" fill="#637786" text-anchor="middle">∅</text><text x="320" y="158" font-size="17" fill="#a95516" text-anchor="middle">blank</text><rect x="400" y="86" width="70" height="48" rx="5" fill="#e9f2f9" stroke="none"/><text x="435" y="119" font-size="26" fill="#21678d" text-anchor="middle">A</text><text x="435" y="158" font-size="17" fill="#087d70" text-anchor="middle">emit</text><rect x="515" y="86" width="70" height="48" rx="5" fill="#e9f2f9" stroke="none"/><text x="550" y="119" font-size="26" fill="#21678d" text-anchor="middle">B</text><text x="550" y="158" font-size="17" fill="#087d70" text-anchor="middle">emit</text><rect x="171" y="260" width="68" height="48" rx="5" fill="#eef3f5" stroke="none"/><rect x="286" y="260" width="68" height="48" rx="5" fill="#eef3f5" stroke="none"/><rect x="401" y="260" width="68" height="48" rx="5" fill="#eef3f5" stroke="none"/><path d="M90 165 L90 187 L205 222 L205 256" fill="none" stroke="#a7b8c5" stroke-width="2" stroke-linejoin="round"/><path d="M435 165 L435 187 L320 222 L320 256" fill="none" stroke="#a7b8c5" stroke-width="2" stroke-linejoin="round"/><path d="M550 165 L550 187 L435 222 L435 256" fill="none" stroke="#a7b8c5" stroke-width="2" stroke-linejoin="round"/><text x="320" y="330" font-size="17" fill="#233b52" text-anchor="middle">Merge repeats before removing blanks</text><g class="motion"><g id="emit-0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="171" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="205" y="292" font-size="25" fill="#087d70" text-anchor="middle">A</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.005;0.15;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="6" fill="#087d70"><animateMotion path="M90 165 L90 187 L205 222 L205 256" keyPoints="0;0;1;1" keyTimes="0;0.005;0.15;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g id="emit-1" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.62;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="286" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="320" y="292" font-size="25" fill="#087d70" text-anchor="middle">A</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.485;0.62;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="6" fill="#087d70"><animateMotion path="M435 165 L435 187 L320 222 L320 256" keyPoints="0;0;1;1" keyTimes="0;0.485;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><g id="emit-2" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.8;0.99;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><rect x="401" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="435" y="292" font-size="25" fill="#087d70" text-anchor="middle">B</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.665;0.8;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/><circle r="6" fill="#087d70"><animateMotion path="M550 165 L550 187 L435 222 L435 256" keyPoints="0;0;1;1" keyTimes="0;0.665;0.8;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></circle></g><rect x="55" y="137" width="70" height="4" rx="2" fill="#21678d"><animate attributeName="x" values="55;55;170;170;285;285;400;400;515;515;515" keyTimes="0;0.15;0.19;0.31;0.35;0.44;0.48;0.62;0.66;0.98;1" calcMode="linear" dur="12s" repeatCount="indefinite"/></rect></g><g class="still"><rect x="171" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="205" y="292" font-size="25" fill="#087d70" text-anchor="middle">A</text><rect x="286" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="320" y="292" font-size="25" fill="#087d70" text-anchor="middle">A</text><rect x="401" y="260" width="68" height="48" rx="5" fill="#e0f4ec" stroke="none"/><text x="435" y="292" font-size="25" fill="#087d70" text-anchor="middle">B</text></g></svg>