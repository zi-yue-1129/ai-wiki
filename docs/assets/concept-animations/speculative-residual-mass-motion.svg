<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Speculative sampling probability mass</title><desc id="desc">At one fixed prefix, draft probabilities A B C are 50 40 10 percent, target 20 50 30. Accepted mass is 20 40 10; rejected mass 30 is redistributed as 0 10 20. Output equals target. This is probability mass, not a single random trajectory.</desc><style>text{font-family:Arial,system-ui,sans-serif}.fallback{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.fallback{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" rx="14" fill="#f5f9fc" stroke="none"/><text x="24" y="34" font-size="20" fill="#253c52" text-anchor="start" font-weight="700">SPECULATIVE SAMPLING</text><rect x="24" y="60" width="592" height="236" rx="10" fill="#fff" stroke="#dbe5ed"/><text x="80" y="85" font-size="16" fill="#253c52" text-anchor="start" font-weight="700">Draft q</text><text x="367" y="85" font-size="16" fill="#253c52" text-anchor="start" font-weight="700">Output p</text><text x="590" y="85" font-size="13" fill="#536b7d" text-anchor="end">Target</text><text x="24" y="333" font-size="14" fill="#35678f" text-anchor="start" font-weight="700">Accepted</text><rect x="101" y="320" width="20" height="16" rx="5" fill="#35678f" stroke="none"/><text x="151" y="333" font-size="14" fill="#a26420" text-anchor="start" font-weight="700">Rejected</text><rect x="227" y="320" width="20" height="16" rx="5" fill="#a26420" stroke="none"/><text x="280" y="333" font-size="14" fill="#08756e" text-anchor="start" font-weight="700">Correction</text><rect x="362" y="320" width="20" height="16" rx="5" fill="#08756e" stroke="none"/><text x="616" y="333" font-size="13" fill="#536b7d" text-anchor="end">Schematic</text><text x="43" y="130" font-size="17" fill="#253c52" text-anchor="start" font-weight="700">A</text><rect x="80" y="105" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="105" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="105" width="72" height="36" rx="3" fill="none" stroke="#a9bac8"/><text x="294" y="129" font-size="15" fill="#536b7d" text-anchor="end">50%</text><text x="590" y="129" font-size="15" fill="#536b7d" text-anchor="end">20%</text><text x="43" y="190" font-size="17" fill="#253c52" text-anchor="start" font-weight="700">B</text><rect x="80" y="165" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="165" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="165" width="180" height="36" rx="3" fill="none" stroke="#a9bac8"/><text x="294" y="189" font-size="15" fill="#536b7d" text-anchor="end">40%</text><text x="590" y="189" font-size="15" fill="#536b7d" text-anchor="end">50%</text><text x="43" y="250" font-size="17" fill="#253c52" text-anchor="start" font-weight="700">C</text><rect x="80" y="225" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="225" width="180" height="36" rx="5" fill="#eef3f7" stroke="none"/><rect x="367" y="225" width="108" height="36" rx="3" fill="none" stroke="#a9bac8"/><text x="294" y="249" font-size="15" fill="#536b7d" text-anchor="end">10%</text><text x="590" y="249" font-size="15" fill="#536b7d" text-anchor="end">30%</text><g class="moving"><rect x="80" y="105" width="72" height="36" fill="#35678f" data-token="A" data-mass="2" data-kind="accepted"></rect><rect x="152" y="105" width="108" height="36" fill="#a26420" data-token="A" data-mass="3" data-kind="rejected"></rect><rect x="80" y="165" width="144" height="36" fill="#35678f" data-token="B" data-mass="4" data-kind="accepted"></rect><rect x="80" y="225" width="36" height="36" fill="#35678f" data-token="C" data-mass="1" data-kind="accepted"></rect><rect x="367" y="105" width="72" height="36" fill="#35678f" data-token="A" data-mass="2" data-kind="accepted"><animate attributeName="width" values="0;0;72;72" keyTimes="0;0.12;0.37;1" dur="12s" repeatCount="indefinite"/></rect><rect x="367" y="165" width="144" height="36" fill="#35678f" data-token="B" data-mass="4" data-kind="accepted"><animate attributeName="width" values="0;0;144;144" keyTimes="0;0.12;0.37;1" dur="12s" repeatCount="indefinite"/></rect><rect x="511" y="165" width="36" height="36" fill="#08756e" data-token="B" data-mass="1" data-kind="correction"><animate attributeName="width" values="0;0;36;36" keyTimes="0;0.55;0.76;1" dur="12s" repeatCount="indefinite"/></rect><rect x="367" y="225" width="36" height="36" fill="#35678f" data-token="C" data-mass="1" data-kind="accepted"><animate attributeName="width" values="0;0;36;36" keyTimes="0;0.12;0.37;1" dur="12s" repeatCount="indefinite"/></rect><rect x="403" y="225" width="72" height="36" fill="#08756e" data-token="C" data-mass="2" data-kind="correction"><animate attributeName="width" values="0;0;72;72" keyTimes="0;0.55;0.76;1" dur="12s" repeatCount="indefinite"/></rect><g opacity="0"><text x="42" y="280" font-size="15" fill="#35678f" text-anchor="start" font-weight="700">Accept 70%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.37;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="319" y="280" font-size="15" fill="#a26420" text-anchor="middle" font-weight="700">Reject 30%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="598" y="280" font-size="15" fill="#08756e" text-anchor="end" font-weight="700">Correct 30%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.76;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="1"><text x="616" y="34" font-size="15" fill="#35678f" text-anchor="end" font-weight="700">Split draft mass</text><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.37;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="616" y="34" font-size="15" fill="#a26420" text-anchor="end" font-weight="700">Redistribute excess</text><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.37;0.76;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g><g opacity="0"><text x="616" y="34" font-size="15" fill="#08756e" text-anchor="end" font-weight="700">70% + 30% = 100%</text><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.76;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/></g></g><g class="fallback"><rect x="80" y="105" width="72" height="36" fill="#35678f" data-token="A" data-mass="2" data-kind="accepted"></rect><rect x="152" y="105" width="108" height="36" fill="#a26420" data-token="A" data-mass="3" data-kind="rejected"></rect><rect x="80" y="165" width="144" height="36" fill="#35678f" data-token="B" data-mass="4" data-kind="accepted"></rect><rect x="80" y="225" width="36" height="36" fill="#35678f" data-token="C" data-mass="1" data-kind="accepted"></rect><rect x="367" y="105" width="72" height="36" fill="#35678f" data-token="A" data-mass="2" data-kind="accepted"></rect><rect x="367" y="165" width="144" height="36" fill="#35678f" data-token="B" data-mass="4" data-kind="accepted"></rect><rect x="511" y="165" width="36" height="36" fill="#08756e" data-token="B" data-mass="1" data-kind="correction"></rect><rect x="367" y="225" width="36" height="36" fill="#35678f" data-token="C" data-mass="1" data-kind="accepted"></rect><rect x="403" y="225" width="72" height="36" fill="#08756e" data-token="C" data-mass="2" data-kind="correction"></rect><text x="42" y="280" font-size="15" fill="#35678f" text-anchor="start" font-weight="700">Accept 70%</text><text x="319" y="280" font-size="15" fill="#a26420" text-anchor="middle" font-weight="700">Reject 30%</text><text x="598" y="280" font-size="15" fill="#08756e" text-anchor="end" font-weight="700">Correct 30%</text><text x="616" y="34" font-size="15" fill="#08756e" text-anchor="end" font-weight="700">70% + 30% = 100%</text></g></svg>
