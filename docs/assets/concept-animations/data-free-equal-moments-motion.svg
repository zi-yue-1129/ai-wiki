<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Equal moments and different activation distributions</title><desc>A continuous mixture of two discrete distributions preserves mean two and variance one, so the illustrative moment loss remains zero. The fourth central moment rises from one to four. Dashed outlines mark the reference distribution X.</desc><rect width="640" height="360" fill="white"/><text x="320" y="28" font-size="22" text-anchor="middle" fill="#243447">Equal moments, different distributions</text><rect x="12" y="43" width="368" height="270" rx="3" fill="#f2f5f8" /><rect x="392" y="43" width="236" height="270" rx="3" fill="#f2f5f8" /><text x="196" y="65" font-size="16" text-anchor="middle" fill="#243447">Probability mass</text><line x1="56" y1="252" x2="364" y2="252" stroke="#8494a8" stroke-opacity=".35"/><text x="49" y="257" font-size="12" text-anchor="end" fill="#243447">0</text><line x1="56" y1="200" x2="364" y2="200" stroke="#8494a8" stroke-opacity=".35"/><text x="49" y="205" font-size="12" text-anchor="end" fill="#243447">0.25</text><line x1="56" y1="148" x2="364" y2="148" stroke="#8494a8" stroke-opacity=".35"/><text x="49" y="153" font-size="12" text-anchor="end" fill="#243447">0.5</text><line x1="56" y1="96" x2="364" y2="96" stroke="#8494a8" stroke-opacity=".35"/><text x="49" y="101" font-size="12" text-anchor="end" fill="#243447">0.75</text><line x1="56" y1="252" x2="364" y2="252" stroke="#243447" /><line x1="56" y1="252" x2="56" y2="96" stroke="#243447" /><rect id="mass-0" x="69" y="252" width="40" height="0" rx="2" fill="#08766f"><animate attributeName="y" values="252;252;239;239;226;226;252" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;13;13;26;26;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="89" y="270" font-size="14" text-ancho