<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui,sans-serif"><title>Equal moments, different distributions</title><desc>Probability mass changes while mean two, variance one and moment loss zero stay fixed. The fourth central moment increases from one to four, while the expected rectified centred activation decreases from one half to one quarter. Dashed outlines mark the reference.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="white"/><text x="320" y="28" font-size="22" text-anchor="middle" fill="#243447">Equal moments, different distributions</text><rect x="12" y="43" width="368" height="270" rx="3" fill="#f2f5f8"/><rect x="392" y="43" width="236" height="270" rx="3" fill="#f2f5f8"/><text x="196" y="65" font-size="16" text-anchor="middle" fill="#243447">Probability mass</text><line x1="56" y1="252" x2="364" y2="252" stroke="#8494a8" stroke-opacity="0.35"/><text x="49" y="257" font-size="12" text-anchor="end" fill="#243447">0</text><line x1="56" y1="200" x2="364" y2="200" stroke="#8494a8" stroke-opacity="0.35"/><text x="49" y="205" font-size="12" text-anchor="end" fill="#243447">0.25</text><line x1="56" y1="148" x2="364" y2="148" stroke="#8494a8" stroke-opacity="0.35"/><text x="49" y="153" font-size="12" text-anchor="end" fill="#243447">0.5</text><line x1="56" y1="96" x2="364" y2="96" stroke="#8494a8" stroke-opacity="0.35"/><text x="49" y="101" font-size="12" text-anchor="end" fill="#243447">0.75</text><line x1="56" y1="252" x2="364" y2="252" stroke="#243447"/><line x1="56" y1="252" x2="56" y2="96" stroke="#243447"/><rect id="mass-0" x="69" width="40" rx="2" fill="#08766f" y="252" height="0"><animate attributeName="y" values="252;252;239;239;226;226;252" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;13;13;26;26;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="89" y="270" font-size="14" text-anchor="middle" fill="#243447">0</text><rect id="mass-1" x="129" width="40" rx="2" fill="#08766f" y="148" height="104"><animate attributeName="y" values="148;148;200;200;252;252;148" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="104;104;52;52;0;0;104" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><rect x="129" y="148" width="40" height="104" rx="2" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="4 3"/><text x="149" y="270" font-size="14" text-anchor="middle" fill="#243447">1</text><rect id="mass-2" x="189" width="40" rx="2" fill="#08766f" y="252" height="0"><animate attributeName="y" values="252;252;174;174;96;96;252" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;78;78;156;156;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="209" y="270" font-size="14" text-anchor="middle" fill="#243447">2</text><rect id="mass-3" x="249" width="40" rx="2" fill="#08766f" y="148" height="104"><animate attributeName="y" values="148;148;200;200;252;252;148" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="104;104;52;52;0;0;104" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><rect x="249" y="148" width="40" height="104" rx="2" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="4 3"/><text x="269" y="270" font-size="14" text-anchor="middle" fill="#243447">3</text><rect id="mass-4" x="309" width="40" rx="2" fill="#08766f" y="252" height="0"><animate attributeName="y" values="252;252;239;239;226;226;252" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/><animate attributeName="height" values="0;0;13;13;26;26;0" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="329" y="270" font-size="14" text-anchor="middle" fill="#243447">4</text><text x="196" y="294" font-size="15" text-anchor="middle" fill="#243447">Activation</text><text x="408" y="68" font-size="16" text-anchor="start" fill="#243447">Mean</text><text x="612" y="68" font-size="18" text-anchor="end" fill="#243447">2</text><line x1="408" y1="78" x2="612" y2="78" stroke="#8494a8" stroke-opacity="0.35"/><text x="408" y="99" font-size="16" text-anchor="start" fill="#243447">Variance</text><text x="612" y="99" font-size="18" text-anchor="end" fill="#243447">1</text><line x1="408" y1="109" x2="612" y2="109" stroke="#8494a8" stroke-opacity="0.35"/><text x="408" y="130" font-size="16" text-anchor="start" fill="#243447">Moment loss</text><text x="612" y="130" font-size="18" text-anchor="end" fill="#243447">0</text><line x1="408" y1="140" x2="612" y2="140" stroke="#8494a8" stroke-opacity="0.35"/><text x="408" y="162" font-size="16" text-anchor="start" fill="#243447">Fourth moment</text><rect x="408" y="174" width="204" height="14" rx="3" fill="#e4eaf0"/><rect id="fourth-moment" x="408" y="174" height="14" rx="3" fill="#a05c20" width="51"><animate attributeName="width" values="51;51;127.5;127.5;204;204;51" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="408" y="204" font-size="12" text-anchor="middle" fill="#243447">0</text><text x="459" y="204" font-size="12" text-anchor="middle" fill="#243447">1</text><text x="510" y="204" font-size="12" text-anchor="middle" fill="#243447">2</text><text x="561" y="204" font-size="12" text-anchor="middle" fill="#243447">3</text><text x="612" y="204" font-size="12" text-anchor="middle" fill="#243447">4</text><text x="408" y="235" font-size="16" text-anchor="start" fill="#243447">E[ReLU(x − 2)]</text><rect x="408" y="247" width="204" height="14" rx="3" fill="#e4eaf0"/><rect id="relu-mean" x="408" y="247" height="14" rx="3" fill="#315c85" width="204"><animate attributeName="width" values="204;204;153;153;102;102;204" keyTimes="0;0.12;0.43;0.58;0.85;0.95;1" dur="12s" repeatCount="indefinite"/></rect><text x="408" y="277" font-size="12" text-anchor="middle" fill="#243447">0</text><text x="510" y="277" font-size="12" text-anchor="middle" fill="#243447">0.25</text><text x="612" y="277" font-size="12" text-anchor="middle" fill="#243447">0.5</text><text x="408" y="300" font-size="13" text-anchor="start" fill="#243447">Nonlinear outputs differ</text><rect x="25" y="324" width="22" height="15" rx="2" fill="none" stroke="#315c85" stroke-width="2" stroke-dasharray="4 3"/><text x="56" y="337" font-size="15" text-anchor="start" fill="#243447">Reference X</text><rect x="189" y="324" width="22" height="15" rx="3" fill="#08766f"/><text x="220" y="337" font-size="15" text-anchor="start" fill="#243447">Mixture of X and Y</text></svg>
