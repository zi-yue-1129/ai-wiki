<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">DART: perturbed expert demonstration with clean action labels</title><desc id="desc">Noise perturbs the executed action and causes off-center visited states, while each training pair records the expert clean action at the current state. Illustrative, not sampled from a Gaussian or a learned policy.</desc><defs><marker id="a-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#087d85" stroke-width="1.5"/></marker><marker id="a-coral" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#e2705a" stroke-width="1.5"/></marker><marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#3570b4" stroke-width="1.5"/></marker><marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#27956d" stroke-width="1.5"/></marker><marker id="a-grey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#647a8e" stroke-width="1.5"/></marker></defs><style>@media (prefers-reduced-motion: reduce) {.motion-overlay{display:none!important}.fallback-route{opacity:1!important}}</style><rect width="640" height="360" rx="15" fill="#f7fafd" stroke="#dbe6ec"/><text x="24" y="33" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#213449">DART</text><text x="616" y="33" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" text-anchor="end" fill="#647a8e">Noisy execution · clean labels</text><rect x="19" y="49" width="393" height="278" rx="12" fill="white" stroke="#dbe6ec"/><rect x="426" y="49" width="195" height="278" rx="12" fill="white" stroke="#dbe6ec"/><text x="36" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#213449">Noisy demonstration</text><text x="444" y="75" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#213449">Recorded supervision</text><path d="M45 195 L393 195" fill="none" stroke="#087d85" stroke-width="3.5" stroke-dasharray="9 8" opacity=".56"/><circle cx="53" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><circle cx="116" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><circle cx="179" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><circle cx="242" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><circle cx="305" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><circle cx="368" cy="195" r="3" fill="white" stroke="#087d85" stroke-width="1"/><path class="fallback-route" d="M50 195 C103 190 124 251 172 251 S254 125 303 150 S358 234 393 188" fill="none" stroke="#e2705a" stroke-width="5" stroke-linecap="round" opacity="0.32"/><circle cx="171" cy="251" r="8" fill="white" stroke="#e2705a" stroke-width="2.5"/><circle cx="303" cy="150" r="8" fill="white" stroke="#e2705a" stroke-width="2.5"/><path d="M171 251 L216 205" fill="none" stroke="#087d85" stroke-width="3" stroke-linecap="round" marker-end="url(#a-teal)"/><path d="M303 150 L344 186" fill="none" stroke="#087d85" stroke-width="3" stroke-linecap="round" marker-end="url(#a-teal)"/><path d="M171 251 L220 266" fill="none" stroke="#e2705a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a-coral)"/><text x="36" y="308" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#e2705a">Executed</text><path d="M96 304 L126 304" fill="none" stroke="#e2705a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-coral)"/><text x="164" y="308" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#087d85">Clean expert</text><path d="M246 304 L276 304" fill="none" stroke="#087d85" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-teal)"/><rect x="441" y="97" width="165" height="61" rx="9" fill="#fff4f0" stroke="#f4cec5"/><text x="455" y="117" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#e2705a">Executed</text><text x="455" y="143" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#e2705a">u = π*(s) + ε</text><rect x="441" y="174" width="165" height="61" rx="9" fill="#eaf6f5" stroke="#b9dddd"/><text x="455" y="194" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#087d85">Training label</text><text x="455" y="219" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#087d85">a* = π*(s)</text><path d="M522 159 L522 172" fill="none" stroke="#647a8e" stroke-width="2" stroke-linecap="round" marker-end="url(#a-grey)"/><rect x="441" y="255" width="165" height="58" rx="9" fill="#f2f6fa" stroke="#dbe6ec"/><text x="455" y="274" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#213449">Saved pair</text><circle cx="462" cy="291" r="5" fill="#e2705a" stroke="none" stroke-width="1"/><text x="474" y="296" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#213449">(s, π*(s))</text><g class="motion-overlay"><path d="M50 195 C103 190 124 251 172 251 S254 125 303 150 S358 234 393 188" fill="none" stroke="#e2705a" stroke-width="5.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.55;.98;1" dur="12s" repeatCount="indefinite"/></path><circle r="7" fill="#e2705a" stroke="white" stroke-width="2"><animateMotion dur="12s" repeatCount="indefinite" path="M50