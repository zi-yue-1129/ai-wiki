<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">HMM forward recursion: sum over incoming paths</title><desc id="desc">Three observation time points and two states. The forward filter sums every incoming path, updates each state likelihood and normalises each column. Artificial probabilities, not model measurements.</desc><style>@media (prefers-reduced-motion: reduce){.moving{display:none!important}}</style><rect x="0" y="0" width="640" height="360" rx="16" fill="#f8fbfd" stroke="#d7e2eb" stroke-width="1" /><text x="26" y="34" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#23354c">Forward: sum over paths</text><text x="26" y="56" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#5e7389">All predecessors contribute to each new state</text><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b1c5d2" stroke-width="1.2"/></marker></defs><path d="M146 151 L284 151" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M146 151 L284 227" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M146 227 L284 151" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M146 227 L284 227" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M356 151 L494 151" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M356 151 L494 227" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M356 227 L494 151" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><path d="M356 227 L494 227" stroke="#c7d7e0" stroke-width="1.7" fill="none" marker-end="url(#tip)"/><circle class="moving" r="4.8" fill="#0f766e" opacity="0.8"><animateMotio