eight="700" fill="#23354c">B</text><text x="110" y="244" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">0.200</text><rect x="263" y="76" width="114" height="31" rx="9" fill="#eaf2f7" stroke="none" stroke-width="1" /><text x="320" y="97" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">x2  0.2 / 0.9</text><circle cx="320" cy="151" r="34" fill="#fff" stroke="#0f766e" stroke-width="2.3"/><text x="320" y="147" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#23354c">A</text><text x="320" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">0.283</text><circle cx="320" cy="227" r="34" fill="#fff" stroke="#376ca8" stroke-width="2.3"/><text x="320" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#23354c">B</text><text x="320" y="244" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">0.717</text><rect x="473" y="76" width="114" height="31" rx="9" fill="#eaf2f7" stroke="none" stroke-width="1" /><text x="530" y="97" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">x3  0.7 / 0.4</text><circle cx="530" cy="151" r="34" fill="#fff" stroke="#0f766e" stroke-width="2.3"/><text x="530" y="147" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#23354c">A</text><text x="530" y="168" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#5e7389">0.622</text><circle cx="530" cy="227" r="34" fill="#fff" stroke="#376ca8" stroke-width="2.3"/><text x="530" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#23354c">B</text