<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Feasible Newton backtracking</title><desc id="desc">For F(x)=4x-log(x) on x>0, the start is 0.75 and Newton direction is -1.5. Trial steps of size 1 and 0.5 reach -0.75 and zero, both infeasible. A quarter step reaches 0.375 and passes Armijo with c=0.1. The marker traverses the trial positions, not accepted iterates.</desc><style>text{font-family:Arial,system-ui,sans-serif;fill:#263f53;font-size:16px}.heading{font-size:20px;font-weight:700}.small{font-size:14px}.strong{font-weight:700}.panel{fill:white;stroke:#dce7ed;stroke-width:1.5}.axis{stroke:#7691a3;stroke-width:1.5}.motion{display:inline}.fallback{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.fallback{display:inline}}</style><rect width="640" height="360" rx="16" fill="#f4f8fb"/><text x="24" y="34" class="heading" text-anchor="start">FEASIBLE NEWTON STEP</text><rect class="panel" x="20" y="50" width="600" height="282" rx="12"/><rect x="42" y="88" width="278" height="90" rx="7" fill="#faeee9"/><rect x="320" y="88" width="278" height="90" rx="7" fill="#eaf5f2"/><text x="59" y="111" class="strong" text-anchor="start">Infeasible</text><text x="581" y="111" class="strong" text-anchor="end">Feasible</text><path d="M320 88V156" stroke="#b45b37" stroke-width="2" stroke-dasharray="4 4"/><path class="axis" d="M42 145H598"/><path d="M112 139V151" class="axis"/><text x="112" y="170" class="small" text-anchor="middle">−0.75</text><path d="M320 139V151" class="axis"/><text x="320" y="170" class="small" text-anchor="middle">0</text><path d="M424 139V151" class="axis"/><text x="424" y="170" class="small" text-anchor="middle">0.375</text><path d="M528 139V151" class="axis"/><text x="528" y="170" class="small" text-anchor="middle">0.75</text><circle cx="528" cy="145" r="6" fill="#4268a7"/><path d="M519 126H121l8 -5m-8 5 8 5" stroke="#4268a7" stroke-width="2.5" fill="none"/><text x="523" y="201" class="small" text-anchor="middle">Start</text><text x="24" y="349" class="strong" text-anchor="start">F(x) = 4x − log(x)</text><path d="M112 180V210H119V225" stroke="#b45b37" stroke-width="1.5" stroke-opacity=".6" fill="none"/><rect x="35" y="225" width="168" height="81" rx="8" fill="#b45b37" fill-opacity=".10" stroke="#b45b37" stroke-opacity=".5"/><text x="119" y="249" class="strong" text-anchor="middle">Step 1</text><text x="119" y="278" class="strong" text-anchor="middle" style="fill:#b45b37">Reject</text><path d="M320 180V210H319V225" stroke="#b45b37" stroke-width="1.5" stroke-opacity=".6" fill="none"/><rect x="235" y="225" width="168" height="81" rx="8" fill="#b45b37" fill-opacity=".10" stroke="#b45b37" stroke-opacity=".5"/><text x="319" y="249" class="strong" text-anchor="middle">Step 1/2</text><text x="319" y="278" class="strong" text-anchor="middle" style="fill:#b45b37">Reject</text><path d="M424 180V210H519V225" stroke="#087f82" stroke-width="1.5" stroke-opacity=".6" fill="none"/><rect x="435" y="225" width="168" height="81" rx="8" fill="#087f82" fill-opacity=".10" stroke="#087f82" stroke-opacity=".5"/><text x="519" y="249" class="strong" text-anchor="middle">Step 1/4</text><text x="519" y="278" class="strong" text-anchor="middle" style="fill:#087f82">Accept</text><g class="motion"><circle cx="528" cy="145" r="9" fill="#4268a7" stroke="white" stroke-width="2"><animate attributeName="cx" values="528;112;112;320;320;424;424;528" keyTimes="0;.16;.30;.44;.58;.72;.9999;1" dur="12s" repeatCount="indefinite"/><animate attributeName="fill" values="#4268a7;#b45b37;#b45b37;#b45b37;#b45b37;#087f82;#087f82;#4268a7" keyTimes="0;.16;.30;.44;.58;.72;.9999;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="112" cy="145" r="14" fill="none" stroke="#b45b37" stroke-width="2" opacity="0"><animate calcMode="discrete" attributeName="opacity" values="0;1;0;0" keyTimes="0;0.16;0.3;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="320" cy="145" r="14" fill="none" stroke="#b45b37" stroke-width="2" opacity="0"><animate calcMode="discrete" attributeName="opacity" values="0;1;0;0" keyTimes="0;0.44;0.58;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="424" cy="145" r="14" fill="none" stroke="#087f82" stroke-width="2" opacity="0"><animate calcMode="discrete" attributeName="opacity" values="0;1;0;0" keyTimes="0;0.72;0.95;1" dur="12s" repeatCount="indefinite"/></circle></g><g class="fallback"><circle cx="424" cy="145" r="9" fill="#087f82" stroke="white" stroke-width="2"/><path d="M106 139l12 12m0 -12 -12 12 M314 139l12 12m0 -12 -12 12" stroke="#b45b37" stroke-width="3"/></g></svg>
