<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Gibbs sampling: alternating exact conditional draws</title><desc id="desc">A correlated two-dimensional target stays fixed while four accepted conditional draws alternately change x and y. The chain moves horizontally and vertically, one coordinate at a time.</desc><style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#244259}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:700;fill:#607b8f}.small{font-size:12px;fill:#607b8f}.stage{font-size:21px;font-weight:750}.phase{opacity:0}@media(prefers-reduced-motion:reduce){.phase{display:none!important}.phase-final{display:inline!important;opacity:1!important}}</style><rect width="640" height="360" rx="18" fill="#f4f9fc"/><rect x="20" y="53" width="401" height="284" rx="15" fill="#fff" stroke="#d5e3eb"/><rect x="436" y="53" width="184" height="284" rx="15" fill="#fff" stroke="#d5e3eb"/><text x="28" y="33" class="eyebrow" >GIBBS SAMPLING</text><text x="592" y="33" class="small" text-anchor="end">8 s loop</text><line x1="61" y1="294" x2="391" y2="294" stroke="#d3e0e8" stroke-width="1.5"  stroke-linecap="round"/><line x1="61" y1="294" x2="61" y2="86" stroke="#d3e0e8" stroke-width="1.5"  stroke-linecap="round"/><text x="397" y="300" class="small" >x</text><text x="55" y="79" class="small" >y</text><ellipse cx="239" cy="189" rx="150" ry="49" transform="rotate(-38 239 189)" fill="none" stroke="#9ec6c3" stroke-width="1.8" opacity=".75"/><ellipse cx="239" cy="189" rx="119" ry="37" transform="rotate(-38 239 189)" fill="none" stroke="#9ec6c3" stroke-width="1.3" opacity=".75"/><ellipse cx="239" cy="189" rx="86" ry="26" transform="rotate(-38 239 189)" fill="none" stroke="#9ec6c3" stroke-width="1.3" opacity=".75"/><text x="84" y="78" class="small" >Correlated target</text><line x1="261" y1="92" x2="261" y2="296" stroke="#dc8c45" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round"/><line x1="118" y1="277" x2="195" y2="277" stroke="#9bb6c4" stroke-width="3"  stroke-linecap="round"/><line x1="195" y1="277" x2="195" y2="231" stroke="#9bb6c4" stroke-width="3"  stroke-linecap="round"/><line x1="195" y1="231" x2="261" y2="231" stroke="#9bb6c4" stroke-width="3"  stroke-linecap="round"/><line x1="261" y1="231" x2="261" y2="166" stroke="#0c9489" stroke-width="5"  stroke-linecap="round"/><circle cx="118" cy="277" r="5" fill="#8ea5b3"/><circle cx="261" cy="166" r="9" fill="#0c9489" stroke="#fff" stroke-width="3"/><text x="454" y="139" class="eyebrow" >CONDITIONAL</text><text x="454" y="172" class="stage" >Draw y</text><text x="454" y="211" class="" font-size="26" font-weight="750" fill="#0c9489" style="fill:#0c9489">y | x</text><line x1="454" y1="234" x2="602" y2="234" stroke="#d5e3eb" stroke-width="1.3"  stroke-linecap="round"/><text x="454" y="255" class="small" >Hold x fixed</text><text x="454" y="276" class="small" >Sample y</text><text x="454" y="316" class="" font-size="13" font-weight="700" fill="#0c9489" style="fill:#0c9489">Accepted</text><circle cx="462" cy="89" r="14" fill="#eaf2f6"/><text x="462" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">1</text><circle cx="505" cy="89" r="14" fill="#eaf2f6"/><text x="505" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">2</text><circle cx="548" cy="89" r="14" fill="#eaf2f6"/><text x="548" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#607b8f" style="fill:#607b8f">3</text><circle cx="591" cy="89" r="14" fill="#0c9489"/><text x="591" y="93" class="" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="fill:#fff">4</text></svg>