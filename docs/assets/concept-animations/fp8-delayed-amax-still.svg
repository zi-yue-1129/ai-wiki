<svg xmlns="http://www.w3.org/2000/svg" width="360" height="254" viewBox="0 0 360 254" role="img" aria-labelledby="title desc"><title id="title">FP8 current versus delayed scaling</title><desc id="desc">Six synthetic amax values. Current scaling matches each maximum; delayed scaling uses the maximum of the preceding two values. The spike clips, then the historical limit remains high until it ages out.</desc><rect width="360" height="254" rx="12" fill="#101e34"/><g font-family="system-ui,Arial,sans-serif" font-size="13" fill="#e9f1fc"><text x="18" y="25" font-size="17" font-weight="600">FP8 scale lag</text><text x="342" y="25" text-anchor="end" fill="#acbdd2">amax</text><rect x="65" y="71.5" width="18" height="7.5" rx="2" fill="#acbdd2"></rect><text x="74" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t1</text><rect x="112" y="71.5" width="18" height="7.5" rx="2" fill="#acbdd2"></rect><text x="121" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t2</text><rect x="159" y="49" width="18" height="30" rx="2" fill="#acbdd2"></rect><text x="168" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t3</text><rect x="206" y="71.5" width="18" height="7.5" rx="2" fill="#acbdd2"></rect><text x="215" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t4</text><rect x="253" y="71.5" width="18" height="7.5" rx="2" fill="#acbdd2"></rect><text x="262" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t5</text><rect x="300" y="71.5" width="18" height="7.5" rx="2" fill="#acbdd2"></rect><text x="309" y="95" font-size="11" text-anchor="middle" fill="#acbdd2">t6</text><rect x="152" y="43" width="32" height="57" rx="5" fill="none" stroke="#fff" stroke-width="1.6"></rect><text x="18" y="122" font-weight="600">Current</text><text x="18" y="178" font-weight="600">Delayed</text><rect x="82" y="129" width="240" height="15" rx="3" fill="#263b55"></rect><rect x="82" y="185" width="240" height="15" rx="3" fill="#263b55"></rect><rect x="82" y="129" width="240" height="15" rx="3" fill="#45ddc4"></rect><rect x="82" y="185" width="60" height="15" rx="3" fill="#45ddc4"></rect><rect x="142" y="185" width="180" height="15" fill="#ffbd6a"></rect><line x1="322" y1="123" x2="322" y2="150" stroke="#fff" stroke-width="2.5"></line><line x1="142" y1="179" x2="142" y2="206" stroke="#fff" stroke-width="2.5"></line><text x="82" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">0</text><text x="142" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">1</text><text x="202" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">2</text><text x="262" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">3</text><text x="322" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">4</text><rect x="42" y="236" width="12" height="8" fill="#45ddc4"></rect><text x="59" y="244" font-size="11">In range</text><rect x="130" y="236" width="12" height="8" fill="#ffbd6a"></rect><text x="147" y="244" font-size="11">Clipped</text><line x1="230" y1="233" x2="230" y2="246" stroke="#fff" stroke-width="2"></line><text x="236" y="244" font-size="11">Limit</text></g></svg>
