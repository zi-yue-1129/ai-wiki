<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><ns0:title id="title">Conformalized quantile regression: calibration offset</ns0:title><ns0:desc id="desc">Two raw conditional quantile intervals with different widths grow by the same finite-sample calibration offset q=0.35 on both sides. Analytical teaching values, not model measurements.</ns0:desc><ns0:style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#244259}.head{font-size:14px;font-weight:750;letter-spacing:1.05px}.muted{font-size:12px;fill:#637d90}.lab{font-size:15px;font-weight:700}.small{font-size:12px;font-weight:650}</ns0:style><ns0:rect width="640" height="360" rx="18" fill="#f4f8fc" /><ns0:text x="28" y="35" class="head">CONFORMALIZED QUANTILE REGRESSION</ns0:text><ns0:text x="28" y="58" class="muted">Two raw intervals · shared q = 0.35</ns0:text><ns0:rect x="28" y="77" width="584" height="235" rx="13" fill="white" stroke="#dae5ec" /><ns0:text x="47" y="145" class="lab">A</ns0:text><ns0:path d="M91 140H556" stroke="#c5d4e0" stroke-width="1.5" /><ns0:path d="M91 135v10M556 135v10" stroke="#c5d4e0" stroke-width="1.3" /><ns0:rect x="145.25" y="125" width="144.5" height="30" rx="8" fill="#dbf3ec" stroke="#138978" stroke-width="1.4" /><ns0:rect x="175" y="132" width="85" height="16" rx="6" fill="#267da6" opacity=".90" /><ns0:circle cx="145.25" cy="140" r="5" fill="#138978" stroke="white" stroke-width="1.5" /><ns0:circle cx="289.75" cy="140" r="5" fill="#138978" stroke="white" stroke-width="1.5" /><ns0:text x="175" y="114" class="muted" text-anchor="middle">1.0</ns0:text><ns0:text x="260" y="114" class="muted" text-anchor="middle">2.0</ns0:text><ns0:text x="47" y="257" class="lab">B</ns0:text><ns0:path d="M91 252H556" stroke="#c5d4e0" stroke-width="1.5" /><ns0:path d="M91 247v10M556 247v10" stroke="#c5d4e0" stroke-width="1.3" /><ns0:rect x="315.25" y="237" width="204.0" height="30" rx="8" fill="#dbf3ec" stroke="#138978" stroke-width="1.4" /><ns0:rect x="345" y="244" width="144.5" height="16" rx="6" fill="#267da6" opacity=".90" /><ns0:circle cx="315.25" cy="252" r="5" fill="#138978" stroke="white" stroke-width="1.5" /><ns0:circle cx="519.25" cy="252" r="5" fill="#138978" stroke="white" stroke-width="1.5" /><ns0:text x="345" y="226" class="muted" text-anchor="middle">3.0</ns0:text><ns0:text x="489.5" y="226" class="muted" text-anchor="middle">4.7</ns0:text><ns0:rect x="66" y="325" width="15" height="9" rx="3" fill="#267da6" /><ns0:text x="88" y="334" class="muted">raw quantiles</ns0:text><ns0:rect x="232" y="325" width="15" height="9" rx="3" fill="#dbf3ec" stroke="#138978" /><ns0:text x="254" y="334" class="muted">conformal expansion</ns0:text><ns0:text x="577" y="334" text-anchor="end" class="small">L − q  ·  U + q</ns0:text><ns0:text x="28" y="353" style="font:10px Arial,sans-serif;fill:#526b7c">Positive-q example: expand, hold, return to raw intervals (loop).</ns0:text></ns0:svg>