<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">FSDP temporary full parameter residency</title><desc id="desc">Each rank permanently retains one local parameter shard. A second, remote shard is temporarily materialized during forward and backward all-gather, then released after computation. Two temporary peaks in parameter residency are illustrative, not measured GPU memory usage.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284456}.title{font-size:18px;font-weight:700}.sub{font-size:11px;fill:#526b7d}.row{font-size:13px;font-weight:700}.tiny{font-size:10px;font-weight:700;text-anchor:middle}.label{font-size:12px;font-weight:700;text-anchor:middle}</style><rect width="640" height="360" rx="18" fill="#f7fafc"/><rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#d7e2e9"/><text x="24" y="34" class="title">FSDP · temporary full parameters</text><text x="24" y="55" class="sub">Two ranks · local shard persists · remote shard is temporary</text><rect x="24" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="58.5" y="102" class="tiny">SHARD</text><rect x="99" y="81" width="69" height="34" rx="6" fill="#e1f3ee"/><text x="133.5" y="102" class="tiny">GATHER</text><rect x="174" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="208.5" y="102" class="tiny">FWD</text><rect x="249" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="283.5" y="102" class="tiny">FREE</text><rect x="324" y="81" width="69" height="34" rx="6" fill="#e1f3ee"/><text x="358.5" y="102" class="tiny">GATHER</text><rect x="399" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="433.5" y="102" class="tiny">BWD</text><rect x="474" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="508.5" y="102" class="tiny">SCATTER</text><rect x="549" y="81" width="69" height="34" rx="6" fill="#e9eef4"/><text x="583.5" y="102" class="tiny">STEP</text><circle cx="583" cy="125" r="6" fill="#d48a36"/><text x="24" y="181" class="row">GPU 0</text><rect x="104" y="149" width="420" height="48" rx="10" fill="#e8eef3"/><rect x="109" y="154" width="202" height="38" rx="7" fill="#148b7f"/><text x="210" y="178" class="label" style="fill:#fff">LOCAL A</text><rect x="317" y="154" width="202" height="38" rx="7" fill="none" stroke="#7053b5" stroke-width="2" stroke-dasharray="5 4"/><g opacity="1"><rect x="319" y="156" width="198" height="34" rx="6" fill="#7053b5"/><text x="418" y="178" class="label" style="fill:#fff">REMOTE B</text></g><g opacity="0"><text x="548" y="178" class="row">1 shard</text></g><g opacity="1"><text x="548" y="178" class="row">2 shards</text></g><text x="24" y="266" class="row">GPU 1</text><rect x="104" y="234" width="420" height="48" rx="10" fill="#e8eef3"/><rect x="109" y="239" width="202" height="38" rx="7" fill="#7053b5"/><text x="210" y="263" class="label" style="fill:#fff">LOCAL B</text><rect x="317" y="239" width="202" height="38" rx="7" fill="none" stroke="#148b7f" stroke-width="2" stroke-dasharray="5 4"/><g opacity="1"><rect x="319" y="241" width="198" height="34" rx="6" fill="#148b7f"/><text x="418" y="263" class="label" style="fill:#fff">REMOTE A</text></g><g opacity="0"><text x="548" y="263" class="row">1 shard</text></g><g opacity="1"><text x="548" y="263" class="row">2 shards</text></g><rect x="24" y="326" width="12" height="12" rx="3" fill="#cbdce2" stroke="#476678"/><text x="43" y="336" class="sub">Persistent local</text><rect x="170" y="326" width="12" height="12" rx="3" fill="none" stroke="#476678" stroke-dasharray="3 2"/><text x="189" y="336" class="sub">Temporary remote</text><text x="400" y="336" class="sub">Parameter shards / rank (schematic)</text></svg>