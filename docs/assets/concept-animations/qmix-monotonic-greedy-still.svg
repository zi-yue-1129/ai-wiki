<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title>QMIX monotonic mixing and decentralised action selection</title><desc>Four stages show two agents choosing local greedy actions, nonnegative state-conditioned mixing, the monotonic joint value, and execution without the central mixer. Values and rankings are illustrative.</desc><rect x="0" y="0" width="640" height="360" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="0"/><rect x="19" y="86" width="602" height="253" rx="15" fill="#fff" stroke="#cbd8e4" stroke-width="1"/><text x="320" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#213449">Monotonic mixing</text><rect x="22" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="93.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Local Q</text><rect x="177" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="248.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">State weights</text><rect x="332" y="24" width="143" height="33" rx="8" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1"/><text x="403.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#61738a">Joint value</text><rect x="487" y="24" width="143" height="33" rx="8" fill="#087e83" stroke="#087e83" stroke-width="1"/><text x="558.5" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#fff">Decentralise</text><rect x="46" y="132" width="135" height="150" rx="10" fill="#f6f8fb" stroke="#cbd8e4" stroke-width="1.5"/><text x="113" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#213449">Agent 1</text