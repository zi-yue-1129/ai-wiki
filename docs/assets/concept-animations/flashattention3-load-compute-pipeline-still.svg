<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">FlashAttention-3 · Load/compute overlap</title><desc id="svg-desc">Four toy tiles each need a load and matrix multiply stage of equal duration. Serial processing takes eight abstract ticks. An idealized two-stage pipeline overlaps the load of the next tile with compute on the previous tile, completing in five ticks. The timeline is not a hardware performance measurement.</desc><rect x="0" y="0" width="640" height="360" rx="18" fill="#f8fafc" stroke="none" /><rect x="12" y="12" width="616" height="336" rx="13" fill="#ffffff" stroke="#e2e8f0" /><text x="27" y="43" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">FlashAttention-3 · Load/compute overlap</text><text x="27" y="64" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">4 tiles · assumed equal Load/MMA durations</text><rect x="25" y="84" width="590" height="241" rx="12" fill="#f8fafc" stroke="#e2e8f0" /><text x="37" y="112" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Serial · 8</text><text x="37" y="194" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="start">Pipelined · 5</text><text x="182" y="101" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">t0</text><path d="M 156 108 V 310" stroke="#e2e8f0" stroke-width="1"/><rect x="159" y="119" width="45" height="39" rx="6" fill="#dbeafe" stroke="#93c5fd" /><text x="181.5" y="144" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">L0</text><rect x="159" y="218" width="45" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd" /><t