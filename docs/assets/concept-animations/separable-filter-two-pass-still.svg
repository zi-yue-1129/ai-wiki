<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>Separable filter: reuse horizontal responses</title><desc>Four horizontal dot products give minus two, one, minus two, three. Two overlapping vertical windows reuse the middle responses to produce minus two and zero.</desc><rect width="640" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="320" y="31" font-size="24" fill="#172b40" text-anchor="middle">Separable spatial filter</text><text x="91" y="62" font-size="19" fill="#172b40" text-anchor="middle">Input</text><text x="258" y="62" font-size="19" fill="#172b40" text-anchor="middle">Horizontal</text><text x="395" y="62" font-size="19" fill="#172b40" text-anchor="middle">Window 1</text><text x="545" y="62" font-size="19" fill="#172b40" text-anchor="middle">Window 2</text><text x="91" y="86" font-size="16" fill="#315e87" text-anchor="middle">h = [1, 0, −1]</text><text x="470" y="86" font-size="16" fill="#315e87" text-anchor="middle">v = [1, 2, 1]</text><rect x="24" y="100" width="42" height="36" rx="5" fill="#e6eef5"/><text x="45" y="124" font-size="20" fill="#172b40" text-anchor="middle">1</text><rect x="70" y="100" width="42" height="36" rx="5" fill="#e6eef5"/><text x="91" y="124" font-size="20" fill="#172b40" text-anchor="middle">2</text><rect x="116" y="100" width="42" height="36" rx="5" fill="#e6eef5"/><text x="137" y="124" font-size="20" fill="#172b40" text-anchor="middle">3</text><path d="M164 118H218m-6 -5 6 5-6 5" fill="none" stroke="#315e87" stroke-width="1.8"/><g id="horizontal-0"><rect x="226" y="100" width="64" height="36" rx="5" fill="#e6eef5"/><text x="258" y="124" font-size="22" fill="#315e87" text-anchor="middle">−2</text></g><rect x="24" y="146" width="42" height="36" rx="5" fill="#e6eef5"/><text x="45" y="170" font-size="20" fill="#172b40" text-anchor="middle">2</text><rect x="70" y="146" width="42" height="36" rx="5" fill="#e6eef5"/><text x="91" y="170" font-size="20" fill="#172b40" text-anchor="middle">4</text><rect x="116" y="146" width="42" height="36" rx="5" fill="#e6eef5"/><text x="137" y="170" font-size="20" fill="#172b40" text-anchor="middle">1</text><path d="M164 164H218m-6 -5 6 5-6 5" fill="none" stroke="#315e87" stroke-width="1.8"/><g id="horizontal-1"><rect x="226" y="146" width="64" height="36" rx="5" fill="#dcebe8"/><text x="258" y="170" font-size="22" fill="#08756e" text-anchor="middle">1</text></g><rect x="24" y="192" width="42" height="36" rx="5" fill="#e6eef5"/><text x="45" y="216" font-size="20" fill="#172b40" text-anchor="middle">0</text><rect x="70" y="192" width="42" height="36" rx="5" fill="#e6eef5"/><text x="91" y="216" font-size="20" fill="#172b40" text-anchor="middle">1</text><rect x="116" y="192" width="42" height="36" rx="5" fill="#e6eef5"/><text x="137" y="216" font-size="20" fill="#172b40" text-anchor="middle">2</text><path d="M164 210H218m-6 -5 6 5-6 5" fill="none" stroke="#315e87" stroke-width="1.8"/><g id="horizontal-2"><rect x="226" y="192" width="64" height="36" rx="5" fill="#dcebe8"/><text x="258" y="216" font-size="22" fill="#08756e" text-anchor="middle">−2</text></g><rect x="24" y="238" width="42" height="36" rx="5" fill="#e6eef5"/><text x="45" y="262" font-size="20" fill="#172b40" text-anchor="middle">3</text><rect x="70" y="238" width="42" height="36" rx="5" fill="#e6eef5"/><text x="91" y="262" font-size="20" fill="#172b40" text-anchor="middle">1</text><rect x="116" y="238" width="42" height="36" rx="5" fill="#e6eef5"/><text x="137" y="262" font-size="20" fill="#172b40" text-anchor="middle">0</text><path d="M164 256H218m-6 -5 6 5-6 5" fill="none" stroke="#315e87" stroke-width="1.8"/><g id="horizontal-3"><rect x="226" y="238" width="64" height="36" rx="5" fill="#e6eef5"/><text x="258" y="262" font-size="22" fill="#315e87" text-anchor="middle">3</text></g><g id="window-0-term-0"><rect x="330" y="100" width="130" height="36" rx="5" fill="#e6eef5"/><text x="395" y="124" font-size="19" fill="#315e87" text-anchor="middle">−2 × 1</text></g><g id="window-0-term-1"><rect x="330" y="146" width="130" height="36" rx="5" fill="#dcebe8"/><text x="395" y="170" font-size="19" fill="#08756e" text-anchor="middle">1 × 2</text></g><g id="window-0-term-2"><rect x="330" y="192" width="130" height="36" rx="5" fill="#dcebe8"/><text x="395" y="216" font-size="19" fill="#08756e" text-anchor="middle">−2 × 1</text></g><g id="window-1-term-0"><rect x="480" y="146" width="130" height="36" rx="5" fill="#dcebe8"/><text x="545" y="170" font-size="19" fill="#08756e" text-anchor="middle">1 × 1</text></g><g id="window-1-term-1"><rect x="480" y="192" width="130" height="36" rx="5" fill="#dcebe8"/><text x="545" y="216" font-size="19" fill="#08756e" text-anchor="middle">−2 × 2</text></g><g id="window-1-term-2"><rect x="480" y="238" width="130" height="36" rx="5" fill="#e6eef5"/><text x="545" y="262" font-size="19" fill="#315e87" text-anchor="middle">3 × 1</text></g><g id="reuse-legend"><text x="258" y="319" font-size="17" fill="#08756e" text-anchor="middle">Reused ×2</text></g><g id="output-0"><rect x="330" y="294" width="130" height="38" rx="5" fill="#dcebe8"/><text x="395" y="318" font-size="15" fill="#08756e" text-anchor="middle">−2 + 2 − 2 = −2</text></g><g id="output-1"><rect x="480" y="294" width="130" height="38" rx="5" fill="#dcebe8"/><text x="545" y="318" font-size="16" fill="#08756e" text-anchor="middle">1 − 4 + 3 = 0</text></g></g></svg>