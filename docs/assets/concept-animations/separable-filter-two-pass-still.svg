<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><title>Two-pass separable spatial filtering</title><desc>Horizontal dot products give minus two, one, minus two; vertical weights one, two, one combine them into minus two.</desc><rect width="640" height="360" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="320" y="31" font-size="24" fill="#172b40" text-anchor="middle">Separable spatial filter</text><text x="112" y="63" font-size="19" fill="#172b40" text-anchor="middle">Input patch</text><text x="290" y="63" font-size="19" fill="#172b40" text-anchor="middle">Horizontal</text><text x="410" y="63" font-size="19" fill="#172b40" text-anchor="middle">Vertical</text><text x="554" y="63" font-size="19" fill="#172b40" text-anchor="middle">Output</text><rect x="38" y="77" width="46" height="34" rx="5" fill="#dce5ed" stroke="none"/><text x="61" y="100" font-size="18" fill="#315e87" text-anchor="middle">1</text><rect x="89" y="77" width="46" height="34" rx="5" fill="#dce5ed" stroke="none"/><text x="112" y="100" font-size="18" fill="#315e87" text-anchor="middle">0</text><rect x="140" y="77" width="46" height="34" rx="5" fill="#dce5ed" stroke="none"/><text x="163" y="100" font-size="18" fill="#315e87" text-anchor="middle">-1</text><rect x="38" y="123" width="46" height="46" rx="5" fill="#e6eef5" stroke="none"/><text x="61" y="153" font-size="22" fill="#172b40" text-anchor="middle">1</text><rect x="89" y="123" width="46" height="46" rx="5" fill="#e6eef5" stroke="none"/><text x="112" y="153" font-size="22" fill="#172b40" text-anchor="middle">2</text><rect x="140" y="123" width="46" height="46" rx="5" fill="#e6eef5" stroke="none"/><text x="163" y="153" font-size="22" fill="#172b40" text-anchor="middle">3</text><g><path d="M191 146L251 146" stroke="#315e87" stroke-width="3" fill="none"/><path d="M243 140L251 146L243 152" fill="none" stroke="#315e87" stroke-width="2"/><rect x="255" y="123" width="70" height="46" rx="5