<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Gated SAE: feature detection and magnitude</title><desc id="desc">Three features take separate gate and magnitude paths. A negative gate blocks a positive magnitude, while active gates pass magnitudes unchanged.</desc><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#243f53}.cap{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#6f8798}.small{font-size:13px;font-weight:600}.panel{fill:white;stroke:#d5e1e9;stroke-width:1.5} @media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect width="640" height="360" rx="18" fill="#f5f9fc"/><text x="30" y="37" class="cap" >GATED SAE</text><text x="30" y="58" class="small" >Two paths, one sparse code</text><rect class="panel" x="56" y="90" width="143" height="221" rx="12"/><rect class="panel" x="250" y="90" width="143" height="221" rx="12"/><rect class="panel" x="444" y="90" width="143" height="221" rx="12"/><text x="72" y="117" class="cap" >GATE</text><text x="266" y="117" class="cap" >MAGNITUDE</text><text x="460" y="117" class="cap" >OUTPUT</text><text x="34" y="155" class="small" fill="#243f53">A</text><path d="M86 165H177" stroke="#d5e1e9" stroke-width="3"/><circle cx="132" cy="165" r="3.5" fill="#6f8798"/><rect x="95" y="159" width="37" height="12" rx="6" fill="#91a8b8"/><text x="111" y="152" class="small" >-0.7</text><rect x="269" y="159" width="102" height="12" rx="6" fill="#f5f9fc"/><rect x="269" y="159" width="62" height="12" rx="6" fill="#dc8a3d"/><text x="270" y="152" class="small" >1.5</text><rect x="463" y="159" width="102" height="12" rx="6" fill="#f5f9fc"/><path d="M463 159L476 171M476 159L463 171" stroke="#91a8b8" stroke-width="3" stroke-linecap="round"/><text x="465" y="152" class="small" >0.0</text><text x="34" y="216" class="small" fill="#243f53">B</text><path d="M86 226H177" stroke="#d5e1e9" stroke-width="3"/><circle cx="132" cy="226" r="3.5" fill="#6f8798"/><rect x="136" y="220" width="26" height="12" rx="6" fill="#168f89"/><text x="111" y="213" class="small" >0.6</text><rect x="269" y="220" width="102" height="12" rx="6" fill="#f5f9fc"/><rect x="269" y="220" width="82" height="12" rx="6" fill="#dc8a3d"/><text x="270" y="213" class="small" >2.0</text><rect x="463" y="220" width="102" height="12" rx="6" fill="#f5f9fc"/><rect x="463" y="220" width="82" height="12" rx="6" fill="#168f89"/><text x="465" y="213" class="small" >2.0</text><text x="34" y="277" class="small" fill="#243f53">C</text><path d="M86 287H177" stroke="#d5e1e9" stroke-width="3"/><circle cx="132" cy="287" r="3.5" fill="#6f8798"/><rect x="136" y="281" width="39" height="12" rx="6" fill="#168f89"/><text x="111" y="274" class="small" >0.9</text><rect x="269" y="281" width="102" height="12" rx="6" fill="#f5f9fc"/><rect x="269" y="281" width="29" height="12" rx="6" fill="#dc8a3d"/><text x="270" y="274" class="small" >0.7</text><rect x="463" y="281" width="102" height="12" rx="6" fill="#f5f9fc"/><rect x="463" y="281" width="29" height="12" rx="6" fill="#168f89"/><text x="465" y="274" class="small" >0.7</text><path d="M200 199H246 M393 199H440" stroke="#91a8b8" stroke-width="2" stroke-dasharray="4 6"/><text x="319" y="336" class="small" text-anchor="middle">Output = 1[gate &gt; 0] × ReLU(magnitude)</text></svg>