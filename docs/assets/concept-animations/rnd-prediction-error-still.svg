<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" role="img" aria-labelledby="rnd-title rnd-desc">
<title id="rnd-title">Random network distillation: predictor error falls after learning on a visited state (initial state)</title>
<desc id="rnd-desc">The fixed target receives the same state as a trainable predictor. The predictor output approaches the unchanged target feature, shortening their error and the intrinsic bonus. Positions are illustrative, not measured model outputs. Static first-frame preview; no motion is required to understand the pipeline.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif}
  .small{font-size:16px;fill:#45556c;font-weight:600}
  .resting{display:none}
  .link{stroke:#8395ad;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  @media(prefers-reduced-motion:reduce){.animated{display:none}.resting{display:inline}}
</style>
