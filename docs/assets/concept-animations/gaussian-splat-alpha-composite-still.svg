<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="ttl dsc"><title id="ttl">3D Gaussian splatting: front-to-back blending</title><desc id="dsc">Toy sorted splats with effective pixel alphas 0.5, 0.6 and 0.8 produce compositing weights 0.50, 0.30 and 0.16 with residual transmittance 0.04; no trained scene or measured rendered pixel.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf4f9"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#284458}.title{font-size:17px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:.7px}.small{font-size:12px}.muted{fill:#6d8393}.panel{fill:#fff;stroke:#d5e3eb;stroke-width:1.4}@media(prefers-reduced-motion:reduce){animate{display:none!important}}</style><rect width="640" height="360" rx="18" fill="url(#bg)"/><text x="26" y="34" class="title" >3D GAUSSIAN SPLATTING · ALPHA BLENDING</text><text x="26" y="56" class="small muted" >Depth-sorted layers contribute front to back</text><rect x="25" y="77" width="368" height="242" rx="14" class="panel"/><rect x="408" y="77" width="207" height="242" rx="14" class="panel"/><text x="45" y="103" class="label muted" >RAY / DEPTH ORDER</text><text x="425" y="103" class="label muted" >PIXEL WEIGHTS</text><path d="M58 247H368" stroke="#91aabd" stroke-width="2.5"/><path d="M356 240l12 7-12 7" fill="none" stroke="#91aabd" stroke-width="2"/><ellipse cx="111" cy="193" rx="24" ry="49" fill="#347bb8" fill-opacity=".2" stroke="#347bb8" stroke-width="2"/><ellipse cx="111" cy="193" rx="11" ry="30" fill="#347bb8" fill-opacity=".22"/><text x="111" y="270" class="small" text-anchor="middle">α=0.50</text><circle cx="111" cy="193" r="9" fill="none" stroke="#347bb8" stroke-width="3" opacity="1"></circle><ellipse cx="213" cy="193" rx="26" ry="49" fill="#ec9d56" fill-opacity=".2" stroke="#ec9d56" stroke-width="2"/><ellipse cx="213" cy="193" rx="13" ry="30" fill="#ec9d56" fill-opacity=".22"/><text x="213" y="270" class="small" text-anchor="middle">α=0.60</text><circle cx="213" cy="193" r="9" fill="none" stroke="#ec9d56" stroke-width="3" opacity="1"></circle><ellipse cx="313" cy="193" rx="28" ry="49" fill="#43a395" fill-opacity=".2" stroke="#43a395" stroke-width="2"/><ellipse cx="313" cy="193" rx="15" ry="30" fill="#43a395" fill-opacity=".22"/><text x="313" y="270" class="small" text-anchor="middle">α=0.80</text><circle cx="313" cy="193" r="9" fill="none" stroke="#43a395" stroke-width="3" opacity="1"></circle><text x="67" y="300" class="small muted" >Near</text><text x="331" y="300" class="small muted" >Far</text><rect x="431" y="143" width="158" height="52" rx="7" fill="#f1f5f7" stroke="#d5e3eb"/><rect x="431.00" y="143" width="79.00" height="52" fill="#347bb8" opacity="1"></rect><rect x="510.00" y="143" width="47.40" height="52" fill="#ec9d56" opacity="1"></rect><rect x="557.40" y="143" width="25.28" height="52" fill="#43a395" opacity="1"></rect><rect x="582.68" y="143" width="6.32" height="52" fill="#e1eaf0" opacity="1"></rect><text x="510" y="128" class="small muted" text-anchor="middle">Accumulated contributions</text><text x="431" y="225" class="small" fill="#347bb8">0.50</text><text x="495" y="225" class="small" fill="#ec9d56">+0.30</text><text x="563" y="225" class="small" fill="#43a395">+0.16</text><text x="510" y="256" class="small muted" text-anchor="middle">Weights: αᵢ × Tᵢ</text><text x="510" y="282" class="small muted" text-anchor="middle">Remaining T = 0.04</text><text x="27" y="344" class="small muted" >ILLUSTRATIVE SINGLE PIXEL · FIXED DEPTH / OPACITY</text></svg>