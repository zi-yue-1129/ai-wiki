<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Partial ROC-AUC at a moving false-positive-rate cutoff</title><desc id="desc">Synthetic ordered labels positive negative positive negative negative negative. The ROC staircase rises to TPR 0.5 at FPR 0, then TPR 1 at FPR 0.25. A moving cutoff reveals raw area from 0.125 at FPR 0.25 to full AUC 0.875. Raw partial area is not standardized partial AUC.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5f8"/></linearGradient></defs><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#183d52}.heading{font-size:18px;font-weight:750}.label{font-size:13px;font-weight:700}.small{font-size:11px;font-weight:600}.muted{fill:#6c8391}.axis{stroke:#819dac;stroke-width:1.7}.moving{display:inline}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none!important}.still{display:inline!important}}</style><rect x="0" y="0" width="640" height="360" fill="url(#bg)" rx="16"/><defs><clipPath id="sweep"><rect x="130" y="110" width="75" height="180" fill="white"></rect></clipPath><clipPath id="sweep-still"><rect x="130" y="110" width="75" height="180"/></clipPath></defs><text x="24" y="36" class="heading" >PARTIAL ROC AREA</text><text x="24" y="57" class="small" fill="#698393">Low-FPR region vs the full curve</text><rect x="24" y="75" width="422" height="253" fill="white" rx="14" stroke="#dce8ee"/><rect x="453" y="75" width="163" height="253" fill="white" rx="14" stroke="#dce8ee"/><text x="130" y="96" class="label" >TPR</text><line x1="130" y1="110" x2="130" y2="290" stroke="#e5eef2" /><text x="130" y="310" class="small" text-anchor="middle">0</text><line x1="205" y1="110" x2="205" y2="290" stroke="#e5eef2" /><text x="205" y="310" class="small" text-anchor="middle">0.25</text><line x1="280" y1="110" x2="280" y2="290" stroke="#e5eef2" /><text x="280" y="310" class="small" text-anchor="middle">0.50</text><line x1="355" y1="110" x2="355" y2="290" stroke="#e5eef2" /><text x="355" y="310" class="small" text-anchor="middle">0.75</text><line x1="430" y1="110" x2="430" y2="290" stroke="#e5eef2" /><text x="430" y="310" class="small" text-anchor="middle">1</text><line x1="130" y1="290" x2="430" y2="290" stroke="#e7eff2" /><text x="115" y="294" class="small" text-anchor="end">0</text><line x1="130" y1="200" x2="430" y2="200" stroke="#e7eff2" /><text x="115" y="204" class="small" text-anchor="end">0.5</text><line x1="130" y1="110" x2="430" y2="110" stroke="#e7eff2" /><text x="115" y="114" class="small" text-anchor="end">1</text><line x1="130" y1="110" x2="130" y2="290" stroke="#8099a8" stroke-width="1.7"/><line x1="130" y1="290" x2="430" y2="290" stroke="#8099a8" stroke-width="1.7"/><path d="M130 290V200H205V110H430" fill="none" stroke="#327b9c" stroke-width="4" stroke-linejoin="round"/><path d="M130 290 L130 200 L205 200 L205 110 L430 110 L430 290 Z" fill="#70c8b9" opacity="0.62" clip-path="url(#sweep-still)"/><line x1="205" y1="110" x2="205" y2="290" stroke="#e07846" stroke-width="2.7" stroke-dasharray="5 4"/><text x="470" y="106" class="label" >RAW AREA</text><text x="470" y="134" class="small" >At c = .25</text><text x="470" y="159" class="heading" >0.125</text><text x="470" y="185" class="small" >Full AUC</text><text x="470" y="210" class="heading" >0.875</text><rect x="466" y="229" width="130" height="13" fill="#e8f0f3" rx="7"/><rect x="466" y="229" width="18.57" height="13" fill="#4db2a6" rx="7"/><text x="466" y="265" class="small" >Shaded region</text><text x="466" y="290" class="small" >No normalisation</text><text x="24" y="350" class="small" >SYNTHETIC SCORES · + − + − − −</text></svg>