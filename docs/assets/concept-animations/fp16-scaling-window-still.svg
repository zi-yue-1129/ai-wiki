<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d"><title id="t">FP16 loss scaling: three representative scale choices</title><desc id="d">For tiny g=2^-27 and large g=2^5, S=1 causes tiny-gradient underflow, S=1024 keeps both finite, and S=4096 causes large-gradient overflow. This is a constructed binary16 example, not measured training behavior.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.motion-only{} .reduced-only{display:none}@media(prefers-reduced-motion:reduce){.motion-only{display:none!important}.reduced-only{display:inline!important}}</style><rect width="640" height="360" rx="16" fill="#f6f9fc"/><text x="24" y="38" font-size="21" fill="#18364d" font-weight="750" >LOSS SCALE WINDOW</text><text x="24" y="59" font-size="12" fill="#60768c" font-weight="500" >g low = 2^-27   ·   g high = 2^5   ·   binary16</text><rect x="23" y="82" width="196" height="236" rx="10" fill="#ffffff" stroke="#dbe6ec" /><text x="39" y="111" font-size="16" fill="#19364e" font-weight="750" >S = 1</text><text x="39" y="145" font-size="12" fill="#59728a" font-weight="700" >LOW</text><rect x="38" y="157" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="121" y="176" font-size="16" fill="#b55a40" font-weight="700" text-anchor="middle">0</text><text x="39" y="210" font-size="12" fill="#59728a" font-weight="700" >HIGH</text><rect x="38" y="222" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="121" y="241" font-size="16" fill="#227e9d" font-weight="700" text-anchor="middle">2^5</text><rect x="36" y="269" width="170" height="31" rx="6" fill="#fce8db" stroke="none" /><text x="121" y="290" font-size="11" fill="#984b32" font-weight="700" text-anchor="middle">UNDERFLOW</text><rect x="230" y="82" width="196" height="236" rx="10" fill="#ffffff" stroke="#dbe6ec" /><text x="246" y="111" font-size="16" fill="#19364e" font-weight="750" >S = 1024</text><text x="246" y="145" font-size="12" fill="#59728a" font-weight="700" >LOW</text><rect x="245" y="157" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="328" y="176" font-size="16" fill="#227e9d" font-weight="700" text-anchor="middle">2^-17</text><text x="246" y="210" font-size="12" fill="#59728a" font-weight="700" >HIGH</text><rect x="245" y="222" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="328" y="241" font-size="16" fill="#227e9d" font-weight="700" text-anchor="middle">2^15</text><rect x="243" y="269" width="170" height="31" rx="6" fill="#def3e8" stroke="none" /><text x="328" y="290" font-size="11" fill="#16685f" font-weight="700" text-anchor="middle">BOTH FINITE</text><rect x="437" y="82" width="196" height="236" rx="10" fill="#ffffff" stroke="#dbe6ec" /><text x="453" y="111" font-size="16" fill="#19364e" font-weight="750" >S = 4096</text><text x="453" y="145" font-size="12" fill="#59728a" font-weight="700" >LOW</text><rect x="452" y="157" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="535" y="176" font-size="16" fill="#227e9d" font-weight="700" text-anchor="middle">2^-15</text><text x="453" y="210" font-size="12" fill="#59728a" font-weight="700" >HIGH</text><rect x="452" y="222" width="166" height="27" rx="5" fill="#e8edf1" stroke="none" /><text x="535" y="241" font-size="16" fill="#b55a40" font-weight="700" text-anchor="middle">INF</text><rect x="450" y="269" width="170" height="31" rx="6" fill="#fce8db" stroke="none" /><text x="535" y="290" font-size="11" fill="#984b32" font-weight="700" text-anchor="middle">OVERFLOW</text><text x="24" y="344" font-size="12" fill="#60768c" font-weight="500" >Values are illustrative, not measured training outcomes.</text></svg>