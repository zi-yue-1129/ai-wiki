" dur="9s" calcMode="discrete" repeatCount="indefinite"/></line><line x1="142" y1="179" x2="142" y2="206" stroke="#fff" stroke-width="2.5"><animate attributeName="x1" values="142;142;142;322;322;142" dur="9s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="x2" values="142;142;142;322;322;142" dur="9s" calcMode="discrete" repeatCount="indefinite"/></line><text x="82" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">0</text><text x="142" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">1</text><text x="202" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">2</text><text x="262" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">3</text><text x="322" y="219" text-anchor="middle" fill="#acbdd2" font-size="11">4</text><rect x="42" y="236" width="12" height="8" fill="#45ddc4"></rect><text x="59" y="244" font-size="11">In range</text><rect x="130" y="236" width="12" height="8" fill="#ffbd6a"></rect><text x="147" y="244" font-size="11">Clipped</text><line x1="230" y1="233" x2="230" y2="246" stroke="#fff" stroke-width="2"></line><text x="236" y="244" font-size="11">Limit</text><line x1="275" y1="240" x2="286" y2="240" stroke="#a993f9" stroke-width="3" stroke-linecap="round"/><text x="291" y="244" font-size="11">History</text></g></svg>
