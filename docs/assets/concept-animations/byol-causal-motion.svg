<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" tabindex="0" aria-labelledby="title desc">
<title id="title">BYOL stop-gradient routing counterfactual</title><desc id="desc">Top: actual BYOL loss gradient flows only from loss to online, target route blocked. Bottom: a no-stop-gradient hypothetical permits a target gradient. Green dashed arrow is the separate EMA parameter update, not backpropagation. Hover or focus to pause motion.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#21394d}
.title{font-size:22px;font-weight:700;letter-spacing:.2px}
.label{font-size:18px;font-weight:600}
.token{font-size:20px;font-weight:700}
.small{font-size:16px;fill:#526879}
.num{font-family:monospace;font-size:18px;font-weight:700}

@keyframes goleft{0%,18%{opacity:0;transform:translate(0,0)}22%{opacity:1}50%{opacity:1;transform:translate(-47px,0)}54%,100%{opacity:0;transform:translate(-47px,0)}}
@keyframes goright{0%,18%{opacity:0;transform:translate(0,0)}22%{opacity:1}50%{opacity:1;transform:translate(51px,0)}54%,100%{opacity:0;transform:translate(51px,0)}}
@keyframes goema{0%,56%{opacity:0;transform:translate(0,0)}59%{opacity:1}88%{opacity:1;transform:translate(175px,0)}93%,100%{opacity:0;transform:translate(175px,0)}}
.pulse-left{animation:goleft 4.6s linear infinite}
.pulse-right{animation:goright 4.6s linear infinite}
.pulse-ema{animation:goema 4.6s linear infinite}
svg:hover .pulse-left,svg:focus .pulse-left,svg:hover .pulse-right,svg:focus .pulse-right,svg:hover .pulse-ema,svg:focus .pulse-ema{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.pulse-left,.pulse-right,.pulse-ema{animation:none!important;opacity:0!important}}

</style>
<rect x="1" y="1" width="638" height="242" rx="12" fill="#f8fbfd" stroke="#b9cbd6"/>
<text x="19" y="33" class="title" >BYOL / gradient routes</text><text x="618" y="32" class="small" text-anchor="end">TOY · one direction</text><defs><marker id="arr-o" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#c47743"/></marker><marker id="arr-g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#168574"/></marker></defs><text x="18" y="78" class="label" >Stop-grad</text><rect x="154" y="57" width="93" height="38" rx="7" fill="#dcecf5" stroke="#7da7bf"/><text x="200.5" y="82" class="token" text-anchor="middle">Online</text><rect x="296" y="57" width="81" height="38" rx="7" fill="#f0edf2" stroke="#b3acbc"/><text x="336.5" y="82" class="token" text-anchor="middle">Loss</text><rect x="445" y="57" width="93" height="38" rx="7" fill="#dff1e9" stroke="#7dab9a"/><text x="491.5" y="82" class="token" text-anchor="middle">Target</text><path d="M293 76 H251" fill="none" stroke="#c47743" stroke-width="3" marker-end="url(#arr-o)"/><path d="M380 76 H442" fill="none" stroke="#bd8a84" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M406 66 l16 20 m0 -20 l-16 20" stroke="#b45b55" stroke-width="3"/><circle class="pulse-left" cx="288" cy="76" r="5" fill="#f2a04b"/><text x="18" y="152" class="label" >No stop-grad</text><rect x="154" y="131" width="93" height="38" rx="7" fill="#dcecf5" stroke="#7da7bf"/><text x="200.5" y="156" class="token" text-anchor="middle">Online</text><rect x="296" y="131" width="81" height="38" rx="7" fill="#f0edf2" stroke="#b3acbc"/><text x="336.5" y="156" class="token" text-anchor="middle">Loss</text><rect x="445" y="131" width="93" height="38" rx="7" fill="#dff1e9" stroke="#7dab9a"/><text x="491.5" y="156" class="token" text-anchor="middle">Target</text><path d="M293 150 H251" fill="none" stroke="#c47743" stroke-width="3" marker-end="url(#arr-o)"/><path d="M380 150 H441" fill="none" stroke="#c47743" stroke-width="3" marker-end="url(#arr-o)"/><circle class="pulse-left" cx="288" cy="150" r="5" fill="#f2a04b"/><circle class="pulse-right" cx="386" cy="150" r="5" fill="#f2a04b"/><path d="M247 213 H441" stroke="#168574" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-g)"/><text x="19" y="218" class="label" >EMA</text><text x="470" y="218" class="small" >≠ backprop</text><circle class="pulse-ema" cx="260" cy="213" r="5" fill="#168574"/></svg>