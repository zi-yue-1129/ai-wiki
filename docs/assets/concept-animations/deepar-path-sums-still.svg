<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Ancestral sampling</title><desc id="desc">Four equally likely two-step paths reuse their first sample. Their sums are 3, 5, 7 and 9.</desc><rect width="640" height="360" fill="#ffffff"/><text x="24" y="31" font-size="23" text-anchor="start" fill="#23354a">Ancestral sampling</text><line x1="24" x2="616" y1="43" y2="43" stroke="#dce4ed"/><text x="62" y="65" font-size="16" text-anchor="middle" fill="#23354a">Known</text><text x="190" y="65" font-size="16" text-anchor="middle" fill="#23354a">Step 1</text><text x="342" y="65" font-size="16" text-anchor="middle" fill="#23354a">Step 2</text><text x="523" y="65" font-size="16" text-anchor="middle" fill="#23354a">Path sum</text><line x1="83" y1="190" x2="169" y2="126" stroke="#315c85" stroke-width="3" stroke-linecap="butt"></line><line x1="83" y1="190" x2="169" y2="254" stroke="#315c85" stroke-width="3" stroke-linecap="butt"></line><line x1="211" y1="126" x2="321" y2="94" stroke="#08766f" stroke-width="3" stroke-linecap="butt"></line><line x1="363" y1="94" x2="460" y2="94" stroke="#a05c20" stroke-width="3" stroke-linecap="butt"></line><line x1="211" y1="126" x2="321" y2="158" stroke="#08766f" stroke-width="3" stroke-linecap="butt"></line><line x1="363" y1="158" x2="460" y2="158" stroke="#a05c20" stroke-width="3" stroke-linecap="butt"></line><line x1="211" y1="254" x2="321" y2="222" stroke="#08766f" stroke-width="3" stroke-linecap="butt"></line><line x1="363" y1="222" x2="460" y2="222" stroke="#a05c20" stroke-width="3" stroke-linecap="butt"></line><line x1="211" y1="254" x2="321" y2="286" stroke="#08766f" stroke-width="3" stroke-linecap="butt"></line><line x1="363" y1="286" x2="460" y2="286" stroke="#a05c20" stroke-width="3" stroke-linecap="butt"></line><circle cx="62" cy="190" r="21" fill="#23354a"/><text x="62" y="196" font-size="19" text-anchor="middle" fill="#ffffff">3</text><g opacity="1"><circle cx="190" cy="126" r="21" fill="#315c85"/><text x="190" y="132" font-size="19" text-anchor="middle" fill="#ffffff">2</text><circle cx="190" cy="254" r="21" fill="#315c85"/><text x="190" y="260" font-size="19" text-anchor="middle" fill="#ffffff">4</text></g><g opacity="1"><circle cx="342" cy="94" r="21" fill="#08766f"/><text x="342" y="100" font-size="19" text-anchor="middle" fill="#ffffff">1</text></g><g opacity="1"><rect x="460" y="73" width="126" height="42" rx="7" fill="#f6ebdf" stroke="none"/><text x="523" y="100" font-size="19" text-anchor="middle" fill="#a05c20">2 + 1 = 3</text></g><g opacity="1"><circle cx="342" cy="158" r="21" fill="#08766f"/><text x="342" y="164" font-size="19" text-anchor="middle" fill="#ffffff">3</text></g><g opacity="1"><rect x="460" y="137" width="126" height="42" rx="7" fill="#f6ebdf" stroke="none"/><text x="523" y="164" font-size="19" text-anchor="middle" fill="#a05c20">2 + 3 = 5</text></g><g opacity="1"><circle cx="342" cy="222" r="21" fill="#08766f"/><text x="342" y="228" font-size="19" text-anchor="middle" fill="#ffffff">3</text></g><g opacity="1"><rect x="460" y="201" width="126" height="42" rx="7" fill="#f6ebdf" stroke="none"/><text x="523" y="228" font-size="19" text-anchor="middle" fill="#a05c20">4 + 3 = 7</text></g><g opacity="1"><circle cx="342" cy="286" r="21" fill="#08766f"/><text x="342" y="292" font-size="19" text-anchor="middle" fill="#ffffff">5</text></g><g opacity="1"><rect x="460" y="265" width="126" height="42" rx="7" fill="#f6ebdf" stroke="none"/><text x="523" y="292" font-size="19" text-anchor="middle" fill="#a05c20">4 + 5 = 9</text></g><g opacity="1"><text x="523" y="334" font-size="17" text-anchor="middle" fill="#a05c20">Each path: 25%</text></g><text x="24" y="334" font-size="16" text-anchor="start" fill="#23354a">Sample → feed back → sample</text></svg>
