name: Item-based CF page browser QA
on:
  pull_request:
    paths:
      - 'docs/theory/models/recommender/**'
      - 'scripts/test_item_cf_browser.py'
      - 'scripts/test_built_motion_browser.py'
      - '.github/workflows/item-cf-browser.yml'
      - '.github/actions/install-cjk-font/**'
      - 'scripts/ci_font_archive.py'
      - 'scripts/test_ci_font_archive.py'
      - 'scripts/test_ci_item_cf_workflow.py'
      - 'requirements.txt'
      - 'mkdocs.yml'
      - 'docs/javascripts/mathjax.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  item-cf-browser:
    runs-on: ubuntu-24.04
    # Cold browser/font downloads exhausted the old 15-minute job twice.
    # Keep the full strict build and browser test on cache hits and misses.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Install verified Traditional Chinese font
        id: font
        uses: ./.github/actions/install-cjk-font
      - name: Verify dependency safety and CF workflow contracts
        run: |
          python scripts/test_ci_font_archive.py
          python scripts/test_ci_item_cf_workflow.py
      - name: Keep font dependency measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-cf-font-dependency-report
          path: ${{ steps.font.outputs.report }}
          if-no-files-found: warn
      - run: mkdocs build --strict
      - run: python scripts/test_item_cf_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-cf-browser-review
          path: artifacts/item-cf-browser/
          retention-days: 14
