name: Chapter issues

# Keeps chapter issues in step with their pages: closes the issue of a page
# that became complete, and opens one for a stub or draft that has none.
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chapter-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync chapter issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_chapter_issues.py
