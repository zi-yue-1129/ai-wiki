name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test asset URL handling
        run: |
          python scripts/test_built_asset_urls.py
          python scripts/test_source_asset_urls.py
      - run: mkdocs build --strict
      - name: Verify built asset URLs
        run: |
          site_url="$(python -c 'from mkdocs.config import load_config; print(load_config()["site_url"])')"
          python scripts/verify_built_asset_urls.py --site-dir site --site-url "$site_url"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build search index
        run: npx --yes pagefind@1.3.0 --site site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
