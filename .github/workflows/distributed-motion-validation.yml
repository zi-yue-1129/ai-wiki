name: Distributed training concept motion

on:
  pull_request:
    paths:
      - "docs/assets/concept-animations/gpipe-fill-drain-*.svg"
      - "docs/assets/concept-animations/gpipe-gradient-accumulation-*.svg"
      - "docs/assets/concept-animations/fsdp-gather-scatter-*.svg"
      - "docs/assets/concept-animations/fsdp-parameter-residency-*.svg"
      - "docs/engineering/distributed-training/gpipe*.md"
      - "docs/engineering/distributed-training/fsdp*.md"
      - "docs/engineering/distributed-training/zero*.md"
      - "docs/engineering/distributed-training/megatron-tensor-parallelism*.md"
      - "docs/assets/concept-animations/zero-state-sharding-*.svg"
      - "docs/assets/concept-animations/megatron-column-row-*.svg"
      - "docs/stylesheets/extra.css"
      - "scripts/test_distributed_motion_browser.py"
      - "scripts/test_zero_megatron_motion_browser.py"
      - ".github/workflows/distributed-motion-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Check actual SVG motion, accessible controls, reduced motion and responsive overflow
        run: |
          python scripts/test_distributed_motion_browser.py
          python scripts/test_zero_megatron_motion_browser.py
      - name: Preserve browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-motion-screenshots
          path: distributed-motion-screenshots/
          if-no-files-found: ignore
