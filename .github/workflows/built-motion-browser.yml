name: Built motion browser regression

on:
  pull_request:
    paths:
      - "scripts/test_support_numpy_motion_semantics.py"
      - "scripts/fixtures/deployed-motion-contracts.json"
      - "docs/**"
      - "hooks/**"
      - "overrides/**"
      - "includes/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "scripts/fixtures/browser-support-suites.json"
      - "scripts/fixtures/built-motion-browser-unsharded-reference.yml"
      - "scripts/motion_shard_contract.py"
      - "scripts/motion_shard_ci.py"
      - "scripts/run_motion_shard_support.py"
      - "scripts/test_motion_shard*.py"
      - ".github/actions/upload-browser-parts/**"
      - "scripts/prepare_browser_artifacts.py"
      - "scripts/test_prepare_browser_artifacts.py"
      - "scripts/test_built_motion_browser.py"
      - "scripts/test_built_motion_discovery.py"
      - "scripts/test_motion_scroll_discovery.cjs"
      - "scripts/test_built_prose_browser.py"
      - "scripts/fixtures/embedding-prose-pages.json"
      - "scripts/fixtures/ddim-prose-pages.json"
      - "scripts/test_policy_gradient_motion_browser.py"
      - "scripts/test_policy_gradient_restore.py"
      - "scripts/policy_glyph_contract.py"
      - "scripts/policy_line_clearance.py"
      - "scripts/test_policy_glyph_contract_motion_semantics.py"
      - "scripts/test_policy_future_routes_motion_semantics.py"
      - "scripts/test_policy_original_gate_motion_semantics.py"
      - "scripts/test_policy_credit_labs_browser.py"
      - "scripts/test_built_planning_evolution_labs_browser.py"
      - "scripts/ci_font_archive.py"
      - "scripts/test_ci_font_archive.py"
      - ".github/actions/install-cjk-font/**"
      - "scripts/test_mathjax_lifecycle.cjs"
      - "scripts/test_reviewed_scroll_player.cjs"
      - "scripts/test_planning_evolution_history.py"
      - "scripts/test_policy_credit_labs_browser.py"
      - "scripts/test_built_planning_evolution_labs_browser.py"
      - "scripts/test_*motion_semantics.py"
      - "scripts/curiosity_svg_math.py"
      - "scripts/test_curiosity_math.cjs"
      - "scripts/test_curiosity_player.cjs"
      - "scripts/README-built-motion-browser.md"
      - ".github/workflows/built-motion-browser.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # The tested checkout may be GitHub's merge ref. Keep the event head separate.
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  full-motion:
    name: Full motion shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      EVIDENCE_PREFIX: motion-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wiki and browser dependencies
        run: |
          python -m pip install -r requirements.txt "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Install verified Traditional Chinese font
        id: font
        uses: ./.github/actions/install-cjk-font
      - name: Verify font cache safety regressions
        run: python scripts/test_ci_font_archive.py
      - name: Keep font dependency measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-${{ env.EVIDENCE_PREFIX }}
          path: ${{ steps.font.outputs.report }}
          if-no-files-found: warn
      - name: Test discovery, shard coverage and artifact safety
        run: |
          python scripts/test_built_motion_discovery.py
          python scripts/test_motion_shard_contract.py
          python scripts/test_motion_shard_ci.py
          python scripts/test_prepare_browser_artifacts.py
          node scripts/test_mathjax_lifecycle.cjs
      - name: Build every real bilingual page
        run: mkdocs build --strict
      - name: Exercise deterministic quarter of the full discovered case set
        run: python scripts/test_built_motion_browser.py --shard-index ${{ matrix.shard }} --shard-count 4
      - name: Package bounded lossless evidence, including failed cases
        if: always()
        run: python scripts/prepare_browser_artifacts.py --roots built-motion-browser --allow-missing-roots --artifact-prefix "$EVIDENCE_PREFIX"
      - name: Write small coverage and packaging receipt
        if: always()
        run: python scripts/motion_shard_ci.py receipt --kind shard
      - name: Upload small exact-attempt receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVIDENCE_PREFIX }}-receipt
          path: browser-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload all bounded evidence groups
        if: always()
        uses: ./.github/actions/upload-browser-parts
        with:
          prefix: ${{ env.EVIDENCE_PREFIX }}
  support-browser:
    name: Support browser suites
    runs-on: ubuntu-24.04
    # Every numerical motion contract and every support browser suite must run;
    # 50 minutes prematurely cancelled support jobs before evidence receipts.
    timeout-minutes: 90
    env:
      EVIDENCE_PREFIX: motion-${{ github.run_id }}-${{ github.run_attempt }}-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wiki and browser dependencies
        run: |
          python -m pip install -r requirements.txt "playwright==1.55.0"
          python -m pip install "numpy==2.5.5"
          python -m playwright install --with-deps chromium
      - name: Install verified Traditional Chinese font
        id: font
        uses: ./.github/actions/install-cjk-font
      - name: Verify font cache safety regressions
        run: python scripts/test_ci_font_archive.py
      - name: Keep font dependency measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-${{ env.EVIDENCE_PREFIX }}
          path: ${{ steps.font.outputs.report }}
          if-no-files-found: warn
      - name: Test discovery, shard coverage and artifact safety
        run: |
          python scripts/test_built_motion_discovery.py
          python scripts/test_motion_shard_contract.py
          python scripts/test_motion_shard_ci.py
          python scripts/test_prepare_browser_artifacts.py
          node scripts/test_mathjax_lifecycle.cjs
          node scripts/test_reviewed_scroll_player.cjs
          python scripts/test_policy_gradient_restore.py
          python scripts/test_policy_glyph_contract_motion_semantics.py
          python scripts/test_policy_future_routes_motion_semantics.py
          python scripts/test_policy_original_gate_motion_semantics.py
          python scripts/test_planning_evolution_history.py
          python scripts/test_reinforce_layout_motion_semantics.py
          python scripts/test_policy_history_motion_semantics.py
          python scripts/test_policy_layout_ci_motion_semantics.py
      - name: Check available motion numerical semantics
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys

          for test in sorted(Path("scripts").glob("test_*motion_semantics.py")):
              print(f"Running {test}", flush=True)
              subprocess.run([sys.executable, str(test)], check=True)
          PYTHON
      - name: Build every real bilingual page
        run: mkdocs build --strict
      - name: Run complete preflight, prose, calculators, policy-credit and planning/evolution suites
        run: python scripts/run_motion_shard_support.py
      - name: Package bounded lossless evidence, including failed cases
        if: always()
        run: python scripts/prepare_browser_artifacts.py --roots $(python scripts/run_motion_shard_support.py --roots) --allow-missing-roots --artifact-prefix "$EVIDENCE_PREFIX"
      - name: Write small coverage and packaging receipt
        if: always()
        run: python scripts/motion_shard_ci.py receipt --kind support
      - name: Upload small exact-attempt receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVIDENCE_PREFIX }}-receipt
          path: browser-receipt/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload all bounded evidence groups
        if: always()
        uses: ./.github/actions/upload-browser-parts
        with:
          prefix: ${{ env.EVIDENCE_PREFIX }}
  built-motion-browser:
    # Keep the old required-check job ID; matrix successes alone are insufficient.
    name: built-motion-browser
    if: always()
    needs: [full-motion, support-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require all exact-attempt producer jobs to succeed
        env:
          PRODUCERS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          jobs=json.loads(os.environ['PRODUCERS'])
          assert set(jobs)=={'full-motion','support-browser'}
          assert all(j['result']=='success' for j in jobs.values()), jobs
          PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install independent discovery and build dependencies
        run: python -m pip install -r requirements.txt "playwright==1.55.0"
      - name: Test fail-closed coverage gate
        run: |
          python scripts/test_motion_shard_contract.py
          python scripts/test_motion_shard_ci.py
      - name: Independently build every bilingual page for expected URL mapping
        run: mkdocs build --strict
      - name: Download only current-attempt small receipts
        uses: actions/download-artifact@v4
        with:
          pattern: motion-${{ github.run_id }}-${{ github.run_attempt }}-*-receipt
          path: shard-receipts
          merge-multiple: false
      - name: Read exact run and attempt job/artifact inventory
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const args = {...context.repo, run_id: context.runId, per_page: 100};
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, args);
            const jobs = await github.paginate('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {...args, attempt_number: attempt});
            fs.writeFileSync('run-inventory.json', JSON.stringify({run_id: context.runId, run_attempt: attempt, jobs_attempt: attempt, artifacts, jobs}));
      - name: Require exact full discovery, all cases, all support suites and uploaded groups
        run: python scripts/motion_shard_ci.py gate --receipts shard-receipts --inventory run-inventory.json --shard-count 4
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-gate.json
            run-inventory.json
          if-no-files-found: warn
          retention-days: 14
