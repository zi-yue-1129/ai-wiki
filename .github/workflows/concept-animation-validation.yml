    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate FlashAttention and LSTM SVGs
        run: python scripts/verify_concept_svgs.py

  build-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wiki dependencies
        run: pip install -r requirements.txt
      - name: Verify supported causal prose browser runner contract
        run: python scripts/test_causal_prose_runner_motion_semantics.py
      - name: Install built article browser package
        run: pip install playwright==1.55.0 Pillow==13.0.0
      - name: Install built article Chromium dependencies
        run: |
          # Retry transient Ubuntu mirror / CDN failures; never skip dependencies.
          for attempt in 1 2 3; do
            if
            python -m playwright install --with-deps chromium
          then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Browser dependency install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((15 * attempt))
          done
      - name: Check built article native coverage contract
        run: python scripts/test_deployed_math_contract.py
      - name: Check forward AD production Markdown math containers
        run: python scripts/test_forward_math_markup.py
      - name: Check retained existing-page math boundaries and source coverage
        run: python scripts/test_existing_math_followup.py
      - name: Verify ICM formula structure with site-version MathJax
        run: |
          npm install --prefix "$RUNNER_TEMP/wiki-mathjax" --no-audit --no-fund --ignore-scripts mathjax-full@3.2.2
          NODE_PATH="$RUNNER_TEMP/wiki-mathjax/node_modules" python scripts/verify_icm_mathjax_structure.py
      - name: Check actual STDP and e-prop geometry, timing and bilingual hooks
        run: python scripts/test_snn_credit_motion_semantics.py
      - name: Upload ICM real MathJax structure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icm-mathjax-structure
          path: artifacts/icm-mathjax-structure/*.json
          if-no-files-found: ignore
      - name: Strict MkDocs build
        run: mkdocs build --strict
      - name: Check exact explanation math and timeline
        run: python scripts/test_explanation_motion_semantics.py
      - name: Check causal mechanism math and timeline
        run: python scripts/test_causal_motion_semantics.py
      - name: Validate causal estimand arithmetic and counterexamples
        run: python scripts/test_causal_inference_motion_semantics.py
      - name: Install causal prose browser
        run: |
          python -m pip install "playwright==1.55.0"
          # Retry transient Ubuntu mirror / CDN failures; never skip dependencies.
          for attempt in 1 2 3; do
            if
            python -m playwright install --with-deps chromium
          then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Browser dependency install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((15 * attempt))
          done
      - name: Install verified Traditional Chinese font for causal prose
        uses: ./.github/actions/install-cjk-font
      - name: Check all bilingual causal prose pages and formulas
        run: python scripts/test_causal_inference_prose_browser.py --site-dir site
      - name: Keep causal prose browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-prose-browser
          path: artifacts/causal-prose/
          if-no-files-found: error
          retention-days: 7
      - name: Capture every repaired article display at three widths
        run: python scripts/test_deployed_math_browser.py
      - name: Upload built article math evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-math-browser
          path: artifacts/deployed-math/
          if-no-files-found: error
          retention-days: 7
