name: Validate concept animations

on:
  pull_request:
    paths:
      - "docs/assets/concept-animations/**"
      - "scripts/verify_concept_animations.py"
      - "scripts/verify_concept_motion.py"
      - "scripts/verify_concept_svgs.py"
      - "docs/javascripts/concept-motion.js"
      - "docs/stylesheets/concept-motion.css"
      - "docs/javascripts/concept-motion-detailed.js"
      - "docs/javascripts/self-supervised-labs.js"
      - "docs/stylesheets/concept-motion-detailed.css"
      - "docs/stylesheets/self-supervised-labs.css"
      - "scripts/test_concept_motion_chapters.cjs"
      - "scripts/test_self_supervised_labs.cjs"
      - "mkdocs.yml"
      - ".github/workflows/concept-animation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent GIF decoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Decode every frame and check GIF metadata
        run: python scripts/verify_concept_animations.py

  validate-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate looping SVGs, fallbacks and Markdown paths
        run: python scripts/verify_concept_motion.py
      - name: Exercise bilingual guided motion controls and fallback
        run: node scripts/test_concept_motion_chapters.cjs
      - name: Test MoCo FIFO and BYOL EMA simulators
        run: node scripts/test_self_supervised_labs.cjs
      - name: Install Chromium for real interactive visual tests
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install chromium
      - name: Chromium mobile/desktop playback, pause and geometry
        run: python scripts/test_self_supervised_browser.py
      - name: Keep rendered review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-supervised-lab-browser-review
          path: artifacts/self-supervised-labs/*.png
          if-no-files-found: ignore
          retention-days: 7

  validate-svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate FlashAttention and LSTM SVGs
        run: python scripts/verify_concept_svgs.py

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wiki dependencies
        run: pip install -r requirements.txt
      - name: Strict MkDocs build
        run: mkdocs build --strict
