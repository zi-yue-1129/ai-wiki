  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent GIF decoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Decode every frame and check GIF metadata
        run: python scripts/verify_concept_animations.py

  validate-motion:
    # Playwright 1.55.0 bundles Chromium for supported Ubuntu 24.04.
    # Playwright 1.55 supports Ubuntu 24.04, not the latest 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source fixture import dependencies before all semantic consumers
        run: |
          python -m pip install "playwright==1.55.0"
          python -m pip install "PyYAML==6.0.3"
          python scripts/test_fixture_dependency_motion_semantics.py
      - name: Check predictive coding math and causal timelines
        run: |
          python scripts/test_predictive_coding_motion_semantics.py
          node scripts/test_predictive_coding_labs.cjs
      - name: Check Diffusion Policy actual SVG timeline and numerical contracts
        run: |
          python scripts/test_diffusion_policy_motion_semantics.py
          node scripts/test_diffusion_policy_player.cjs
      - name: Validate looping SVGs, fallbacks and Markdown paths
        run: python scripts/verify_concept_motion.py
      - name: Check information-theory motion analytical timelines
        run: python scripts/test_information_motion_semantics.py
      - name: Check EKFAC and KFC numerical motion semantics
        run: python scripts/test_kfac_motion_semantics.py
      - name: Check confident joint and anisotropic retrieval semantics
        run: python scripts/test_data_retrieval_motion_semantics.py
      - name: Verify selective classification animation and GitHub fallback arithmetic
        run: |
          python scripts/test_selective_accuracy_motion_semantics.py
          python scripts/test_selective_scene_binding_motion_semantics.py
          python scripts/test_selective_static_fallback_binding.py
          python scripts/test_selective_linked_fallbacks.py
          node --check docs/javascripts/selective-accuracy-player.js
          python scripts/test_selective_player_contract.py
      - name: Validate bilingual causal-imitation motion pairs
        run: python scripts/verify_causal_imitation_motion.py
      - name: Check working-memory causal timing and computed states
        run: python scripts/test_working_memory_motion_semantics.py
      - name: Check segmentation numerical semantics and causal timing
        run: python scripts/test_segmentation_motion_semantics.py
      - name: Verify video SVG structure and bilingual static-first fallback
        run: python scripts/verify_video_motion.py
      - name: Check diffusion toy arithmetic and decode timing
        run: python scripts/test_diffusion_process_motion_semantics.py
      - name: SSM arithmetic and animation regressions
        run: |
          node scripts/test_ssm_actual_math.cjs
          python -m unittest discover -s scripts -p test_ssm_actual_motion_semantics.py
      - name: Validate S4D and Mamba-2 SSM visual semantics and bilingual stills
        run: python scripts/verify_ssm_motion.py
      - name: Check LayerNorm and Seq2Seq SVG, fallback and maths
        run: |
          python scripts/verify_norm_seq_motion.py
          python scripts/test_norm_seq_actual_motion_semantics.py
          node scripts/test_norm_seq_actual_math.cjs
          node scripts/test_norm_seq_actual_ui.cjs
      - name: Check positional SVG phase and probability semantics
        run: python scripts/test_positional_motion_semantics.py
      - name: Check conformal coverage, calibration and actual SVG timelines
        run: |
          python scripts/test_conformal_motion_semantics.py
          python scripts/test_conformal_coverage_motion_semantics.py
      - name: Reject cross-topic canvas regressions with actual SVG mutations
        run: |
          python scripts/test_scoped_viewbox_motion_semantics.py
          python scripts/test_scoped_canvas_motion_semantics.py
          python scripts/test_alt_accessibility_motion_semantics.py
          python scripts/test_source_contract_retention_motion_semantics.py
      - name: Check uncertainty motion numerical semantics
        run: python scripts/test_uncertainty_motion_semantics.py
      - name: Check probability-score decomposition and ECE bin merging
        run: python scripts/test_probability_motion_semantics.py
      - name: Validate co-design memory and loss-scale motion arithmetic
        run: python scripts/test_co_design_tradeoff_motion.py
