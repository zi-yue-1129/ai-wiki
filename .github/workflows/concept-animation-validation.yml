name: Validate concept animations

on:
  pull_request:
    paths:
      - "docs/assets/concept-animations/**"
      - "scripts/verify_concept_animations.py"
      - ".github/workflows/concept-animation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gifs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent GIF decoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Decode every frame and check GIF metadata
        run: python scripts/verify_concept_animations.py

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wiki dependencies
        run: pip install -r requirements.txt
      - name: Strict MkDocs build
        run: mkdocs build --strict
