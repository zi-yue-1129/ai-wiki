      - "docs/assets/concept-animations/**"
      - "scripts/verify_concept_animations.py"
      - "scripts/verify_concept_motion.py"
      - "scripts/verify_concept_svgs.py"
      - "scripts/test_uncertainty_motion_semantics.py"
      - "scripts/test_predictive_coding_motion_browser.py"
      - "scripts/test_predictive_coding_motion_semantics.py"
      - "scripts/test_predictive_coding_labs.cjs"
      - "scripts/test_predictive_coding_labs_browser.py"
      - "docs/javascripts/predictive-coding-labs.js"
      - "docs/stylesheets/predictive-coding-labs.css"
      - "scripts/test_scoped_viewbox_motion_semantics.py"
      - "scripts/test_scoped_canvas_motion_semantics.py"
      - "scripts/test_alt_accessibility_motion_semantics.py"
      - "scripts/test_source_contract_retention_motion_semantics.py"
      - "scripts/test_linear_algebra_motion_semantics.py"
      - "scripts/render_linear_algebra_keyframes.py"
      - "docs/javascripts/concept-motion.js"
      - "docs/javascripts/adaptive-optimiser-labs.js"
