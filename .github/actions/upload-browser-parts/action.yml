name: Upload bounded browser evidence
description: Upload every verified lossless 100MiB group with an exact-attempt prefix
inputs:
  prefix:
    required: true
    description: Unique run-attempt producer artifact prefix
runs:
  using: composite
  steps:
    - name: Upload group 01
      if: always() && hashFiles('browser-artifact-parts/group-01/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.prefix }}-01
        path: browser-artifact-parts/group-01/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 14
    - name: Upload group 02
      if: always() && hashFiles('browser-artifact-parts/group-02/**') != ''
      uses: actions/upload-artifact@v4
