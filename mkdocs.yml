site_name: AI Wiki
site_description: An open, comprehensive wiki of artificial intelligence — foundations, models, brain and cognitive science, applications across fields, engineering, and society
site_author: starpig
site_url: https://zi-yue-1129.github.io/ai-wiki/
repo_url: https://github.com/zi-yue-1129/ai-wiki
repo_name: zi-yue-1129/ai-wiki
edit_uri: edit/main/docs/
copyright: Content licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

theme:
  name: material
  language: en
  custom_dir: overrides
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tooltips

hooks:
  - hooks/related.py
  - hooks/knowledge_map.py
  - hooks/search_aliases.py

plugins:
  # Keeps Material's header search button. The dialog itself is Pagefind
  # (overrides/partials/search.html, built by .github/workflows/deploy.yml).
