site_name: AI Wiki
site_description: An open, comprehensive wiki of artificial intelligence — foundations, models, brain and cognitive science, applications across fields, engineering, and society
site_author: starpig
site_url: https://zi-yue-1129.github.io/ai-wiki/
repo_url: https://github.com/zi-yue-1129/ai-wiki
repo_name: zi-yue-1129/ai-wiki
edit_uri: edit/main/docs/
copyright: Content licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>

theme:
  name: material
  language: en
  icon:
    logo: material/brain
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips

hooks:
  - hooks/related.py

plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_name: AI Wiki 人工智慧知識庫
          nav_translations:
            Home: 首頁
            Getting Started: 開始
            Learning Paths: 學習路線
            Open-Source Resource Survey: 開源資源調查
            History of AI: AI 發展史
